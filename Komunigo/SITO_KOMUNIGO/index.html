<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>KOMUNIGO — Stampa, insegne e allestimenti</title>
<style>
  :root{
    --paper:#F7F4EE; --surface:#FFFFFF; --surface-2:#F0EBDF; --ink:#1C2A44; --ink-soft:#55607A;
    --ink-faint:#99A0B0; --line:#E4DFD2; --line-strong:#CFC8B7;
    --navy:#1C2A44; --blu:#2E6FB0; --blu-wash:#E4EDF6; --sand:#A9884B; --sand-wash:#EFE7D4;
    --ok:#2C7A54; --warn:#9A6712;
    --shadow:0 1px 2px rgba(20,22,26,.05), 0 10px 30px rgba(20,22,26,.07);
    --disp:"Bahnschrift SemiBold","Bahnschrift","DIN Alternate","Oswald","Barlow Condensed","Arial Narrow",sans-serif;
    --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --mono:"Cascadia Code","Consolas",ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#131727; --surface:#1A2033; --surface-2:#212840; --ink:#ECEBE4; --ink-soft:#A7ACBA;
    --ink-faint:#6E7488; --line:#2C3350; --line-strong:#3C4468;
    --navy:#ECEBE4; --blu:#5B9BD8; --blu-wash:#16233B; --sand:#C79A57; --sand-wash:#2A2417;
    --shadow:0 1px 2px rgba(0,0,0,.34), 0 12px 36px rgba(0,0,0,.42);}}
  *{box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;margin:0;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  .disp{font-family:var(--disp);text-transform:uppercase;letter-spacing:.01em;}
  .btn{background:var(--blu);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-weight:700;font-size:14px;}
  .btn:hover{filter:brightness(1.06);}
  .btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .pill{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--blu);}
  .in{max-width:1200px;margin:0 auto;padding:0 24px;}

  /* header a banda nera */
  header.top{position:sticky;top:0;z-index:20;background:#15171C;box-shadow:var(--shadow);}
  .topline{height:3px;background:linear-gradient(90deg,var(--blu) 0%,var(--blu) 76%,var(--sand) 100%);}
  .top-in{max-width:1200px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:20px;}
  .brand{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:25px;letter-spacing:.01em;color:#F7F4EE;background:none;border:none;padding:0;}
  .brand .go{color:var(--blu);}
  .search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:#22252C;border:1px solid #2c3037;border-radius:9px;padding:9px 13px;color:#8b9098;font-size:13.5px;}
  .search input{flex:1;background:none;border:none;outline:none;color:#e8eaed;font:inherit;}
  .search input::placeholder{color:#8b9098;}
  .search-x{background:none;border:none;color:#8b9098;cursor:pointer;font-size:18px;line-height:1;padding:0 2px;}
  .cat-search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 10px;max-width:520px;}
  .cat-search input{flex:1;background:none;border:none;outline:none;font:inherit;color:var(--ink);}
  .cat-search .search-x{color:var(--ink-soft);}
  .cat-toprow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .cat-toprow .cat-search{flex:1;margin:0 0 10px;}
  .iva-toggle{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:10px;}
  .iva-toggle button{background:var(--surface);border:none;padding:8px 12px;font:inherit;font-size:13px;color:var(--ink-soft);cursor:pointer;}
  .iva-toggle button.on{background:var(--blu);color:#fff;font-weight:700;}
  .iva-toggle.sm{margin:0 10px 0 auto;}
  .iva-toggle.sm button{padding:5px 9px;font-size:12px;}
  .iva-tag{font-size:11px;color:var(--ink-soft);font-weight:600;}
  nav.main{display:flex;gap:6px;}
  nav.main button{background:transparent;border:none;color:#C7CBD3;font-size:14.5px;font-weight:600;padding:8px 12px;border-radius:8px;}
  nav.main button.on{color:#fff;background:rgba(255,255,255,.08);}
  .cart-btn{margin-left:auto;position:relative;background:var(--blu);color:#fff;border:none;border-radius:9px;padding:9px 15px;font-weight:700;font-size:13px;}
  .cart-badge{position:absolute;top:-6px;right:-6px;background:var(--sand);color:#1a1300;border-radius:20px;font-size:11px;font-weight:800;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;}
  .band-panna{height:10px;background:var(--paper);}
  @media(max-width:820px){.search{display:none;}}

  .wrap{max-width:1200px;margin:0 auto;padding:26px 24px 70px;}
  h2.sec{font-family:var(--disp);text-transform:uppercase;letter-spacing:.02em;font-weight:600;font-size:23px;margin:0 0 3px;}
  .sec-sub{font-size:14px;color:var(--ink-soft);margin:0 0 16px;}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:44px 0 16px;}
  .head .lnk{color:var(--blu);font-weight:700;font-size:13.5px;background:none;border:none;white-space:nowrap;}

  /* hero navy */
  .hero{background:linear-gradient(120deg,#1C2A44,#132038);color:#fff;border-radius:0;}
  .hero-in{max-width:1200px;margin:0 auto;padding:46px 24px;display:grid;grid-template-columns:1.2fr .8fr;gap:26px;align-items:center;}
  @media(max-width:760px){.hero-in{grid-template-columns:1fr;}}
  .hero .tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8FB8E0;font-weight:700;}
  .hero h1{font-family:var(--disp);text-transform:uppercase;font-weight:700;line-height:1;font-size:clamp(30px,5vw,52px);margin:12px 0 14px;text-wrap:balance;}
  .hero h1 em{font-style:normal;color:#6FA8E0;}
  .hero p{font-size:15.5px;color:#C7D2E4;margin:0 0 22px;max-width:46ch;}
  .promo{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow);text-align:center;color:var(--ink);}
  .promo .k{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sand);font-weight:700;}
  .promo .big{font-family:var(--disp);text-transform:uppercase;font-size:38px;margin:6px 0 2px;}
  .promo .big b{color:var(--blu);}
  .promo p{font-size:13px;color:var(--ink-soft);margin:4px 0 0;}

  /* categorie */
  .cats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
  @media(max-width:980px){.cats{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:560px){.cats{grid-template-columns:1fr 1fr;}}
  .cat{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:18px 14px;text-align:center;box-shadow:var(--shadow);transition:transform .12s,border-color .12s;}
  .cat:hover{transform:translateY(-3px);border-color:var(--blu);}
  .cat .ic{width:50px;height:50px;margin:0 auto 10px;border-radius:12px;display:grid;place-items:center;font-size:23px;background:var(--blu-wash);}
  .cat h4{font-family:var(--disp);text-transform:uppercase;font-size:15px;margin:0 0 2px;letter-spacing:.01em;}
  .cat p{font-size:11.5px;color:var(--ink-soft);margin:0;}

  /* card prodotto */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;}
  .card .ph{aspect-ratio:4/3;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-faint);font-size:30px;overflow:hidden;}
  .card .ph img{width:100%;height:100%;object-fit:cover;}
  .card .bd{padding:13px 14px;display:flex;flex-direction:column;gap:7px;flex:1;}
  .card .cat-l{font-size:10.5px;color:var(--blu);font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
  .card h3{margin:0;font-size:15px;line-height:1.25;}
  .card .desc{font-size:12.5px;color:var(--ink-soft);flex:1;}
  .card .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;}
  .price{font-size:17px;font-weight:800;}
  .avail{font-size:11.5px;font-weight:700;}
  .avail.ok{color:var(--ok);} .avail.no{color:var(--warn);}
  .tag-conf{align-self:flex-start;background:var(--sand-wash);color:var(--sand);font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;}
  .add{font-weight:700;font-size:13px;padding:9px;border-radius:8px;border:none;background:var(--blu);color:#fff;width:100%;}
  .add.g{background:transparent;color:var(--blu);border:1.5px solid var(--blu);}
  .add:disabled{opacity:.5;cursor:not-allowed;}

  /* offerte / lavori */
  .banners{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;}
  @media(max-width:760px){.banners{grid-template-columns:1fr;}}
  .ban{border-radius:15px;position:relative;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;color:#fff;box-shadow:var(--shadow);}
  .ban.big{background:linear-gradient(120deg,#2E6FB0,#1c4a78);} .ban.s1{background:linear-gradient(120deg,#26324f,#141d30);} .ban.s2{background:linear-gradient(120deg,#A9884B,#7d5f2f);}
  .ban .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;}
  .ban h3{font-family:var(--disp);text-transform:uppercase;font-size:24px;margin:6px 0 4px;line-height:1;}
  .ban p{font-size:13px;margin:0;opacity:.94;max-width:34ch;}
  .ban .imgtag{position:absolute;top:12px;right:14px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;}
  .works{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media(max-width:760px){.works{grid-template-columns:1fr 1fr;}}
  .work{aspect-ratio:1/1;border-radius:13px;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;color:#fff;box-shadow:var(--shadow);}
  .work.w1{background:linear-gradient(160deg,#2E6FB0,#16233b);} .work.w2{background:linear-gradient(160deg,#3a4a68,#151d30);} .work.w3{background:linear-gradient(160deg,#5a6f92,#1c2a44);} .work.w4{background:linear-gradient(160deg,#24507f,#101b2e);}
  .work b{font-family:var(--disp);text-transform:uppercase;font-size:15px;} .work span{font-size:11.5px;opacity:.9;}
  .work .imgtag{position:absolute;top:10px;left:12px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;}
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media(max-width:760px){.steps{grid-template-columns:1fr 1fr;}}
  .step{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:var(--shadow);}
  .step .n{font-family:var(--mono);font-weight:700;color:var(--blu);border:1.5px solid var(--blu);border-radius:8px;width:30px;height:30px;display:grid;place-items:center;font-size:13px;margin-bottom:10px;}
  .step h4{font-family:var(--disp);text-transform:uppercase;font-size:15px;margin:0 0 3px;} .step p{font-size:12.5px;color:var(--ink-soft);margin:0;}

  /* modale / configuratore */
  .overlay{position:fixed;inset:0;background:rgba(15,20,30,.55);z-index:40;display:grid;place-items:center;padding:20px;}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);width:min(560px,100%);max-height:90vh;overflow:auto;}
  .modal .mh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
  .modal .mh h3{margin:0;font-size:18px;flex:1;font-family:var(--disp);text-transform:uppercase;letter-spacing:.01em;}
  .modal .mb{padding:20px;} .modal .mf{padding:16px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;}
  .x{background:transparent;border:none;font-size:22px;color:var(--ink-faint);line-height:1;}
  label.fld{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:12px 0 4px;}
  input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--ink);font-size:14px;font-family:inherit;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .opts label{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0;font-weight:500;color:var(--ink);} .opts input{width:auto;}

  /* carrello */
  .cart-line{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);}
  .cart-line .g{flex:1;} .cart-line h4{margin:0 0 2px;font-size:15px;} .cart-line p{margin:0;font-size:12.5px;color:var(--ink-soft);}
  .wiz-steps{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px 0;}
  .wiz-step{font-size:12.5px;font-weight:700;color:var(--ink-soft);background:var(--line);border-radius:20px;padding:4px 12px;}
  .wiz-step.on{background:var(--blu);color:#fff;}
  .wiz-step.done{background:#e6f4ea;color:#1e7d34;}
  .scaglioni{display:flex;flex-direction:column;gap:6px;}
  .tier{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;font:inherit;color:var(--ink);}
  .tier:hover{border-color:var(--blu);}
  .tier.on{border-color:var(--blu);background:#eef4fb;box-shadow:0 0 0 1px var(--blu) inset;}
  .tier .tq{font-weight:700;min-width:70px;}
  .tier .tu{color:var(--ink-soft);font-size:13.5px;flex:1;}
  .tier .tt{font-weight:700;}
  .tier .tr{background:#e6f4ea;color:#1e7d34;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700;}
  .price-da{font-size:15px;color:var(--ink);} .price-da b{color:var(--blu);font-size:17px;}
  .stampa-pos{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .stampa-pos.on{border-color:var(--blu);background:#f6faff;}
  .sagoma{width:76px;height:76px;flex:0 0 76px;color:#9aa3b0;}
  .stampa-pos.on .sagoma{color:var(--blu);}
  .sagoma-area{fill:rgba(46,111,176,.22);stroke:var(--blu);stroke-width:2;stroke-dasharray:5 3;}
  .stampa-pos.on .sagoma-area{fill:rgba(46,111,176,.45);stroke-dasharray:none;}
  .sagoma-vista{font-size:15px;fill:#8a93a0;font-family:inherit;}
  .tec-info-btn{border:none;background:none;color:var(--blu);font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:0 4px;margin-left:2px;}
  .tec-info-btn:hover{text-decoration:underline;}
  .tec-info{display:block;flex-basis:100%;margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--surface,#f7f7f7);border:1px solid var(--line);font-size:12.5px;font-weight:400;line-height:1.5;color:var(--ink-soft);cursor:default;}
  .abb-swatches{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px;}
  .abb-sw{width:54px;height:54px;border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;}
  .abb-sw img{width:100%;height:100%;object-fit:contain;}
  .abb-sw.on{border-color:var(--blu);box-shadow:0 0 0 2px var(--blu);}
  .abb-taglie{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;}
  .abb-tg{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;}
  .abb-tg.on{border-color:var(--blu);background:#f6faff;}
  .abb-tg-n{font-weight:700;margin-bottom:4px;}
  .abb-tg input{width:100%;text-align:center;padding:6px 4px;}
  .abb-tg-p{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .stampa-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer;}
  .stampa-nome{font-weight:600;}
  .tec-badge{background:#eef0f4;color:var(--ink-soft);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;}
  .stampa-area{display:flex;align-items:center;gap:10px;margin:8px 0 2px;}
  .area-rect{display:inline-flex;align-items:center;justify-content:center;width:62px;height:34px;border:2px dashed var(--blu);border-radius:6px;color:var(--blu);font-size:10px;letter-spacing:.5px;text-transform:uppercase;opacity:.75;background:repeating-linear-gradient(45deg,transparent,transparent 5px,rgba(46,111,176,.06) 5px,rgba(46,111,176,.06) 10px);}
  .area-lbl{font-size:12.5px;color:var(--ink-soft);}
  .stampa-col{margin-top:8px;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .campione-lnk{display:inline-block;margin-top:12px;font-size:13.5px;color:var(--blu);text-decoration:none;border:1px dashed var(--blu);border-radius:8px;padding:8px 12px;}
  .campione-lnk:hover{background:#eef4fb;}
  .trust{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);}
  .trust-i{display:flex;gap:10px;align-items:flex-start;}
  .trust-ic{font-size:20px;line-height:1.2;}
  .trust-tx{display:flex;flex-direction:column;}
  .trust-tx b{font-size:13.5px;color:var(--ink);}
  .trust-tx span{font-size:12px;color:var(--ink-soft);}
  .trust-c{box-shadow:none;background:transparent;border:1px dashed var(--line);padding:12px;grid-template-columns:repeat(2,1fr);}
  @media(max-width:720px){ .trust{grid-template-columns:repeat(2,1fr);} }
  .b2b-note{background:#eef4fb;border:1px solid #cfe0f2;color:#1C2A44;border-radius:10px;padding:10px 14px;font-size:14px;}
  .listino-old{text-decoration:line-through;color:var(--ink-soft,#8a8a8a);font-weight:600;font-size:.82em;margin-left:8px;}
  .b2b-badge{display:inline-block;background:#e7f0fa;color:var(--blu,#2E6FB0);border:1px solid #cfe0f2;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;}
  .btn.small{padding:6px 12px;font-size:13px;}
  .ft-links{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 6px;}
  .ft-lnk{background:none;border:none;color:#C7D2E4;cursor:pointer;font:inherit;font-size:14px;padding:0;text-decoration:underline;text-underline-offset:3px;}
  .ft-lnk:hover{color:#fff;}
  /* --- Linee guida file di stampa --- */
  .lg-hero{background:var(--navy);color:#fff;border-radius:16px;padding:32px 28px;margin-bottom:28px;}
  .lg-hero h1{margin:0 0 8px;font-size:30px;letter-spacing:.5px;}
  .lg-hero p{margin:0;color:#C7D2E4;max-width:720px;line-height:1.55;}
  .lg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;}
  .lg-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);}
  .lg-card .lg-ico{font-size:26px;}
  .lg-card h3{margin:8px 0 8px;font-size:18px;color:var(--ink);}
  .lg-card p, .lg-card li{color:var(--ink-soft);font-size:14px;line-height:1.5;}
  .lg-card ul{margin:8px 0 0;padding-left:18px;}
  .lg-card b{color:var(--ink);}
  .lg-diagram{width:100%;height:auto;border-radius:10px;margin-top:6px;}
  .lg-progress{display:flex;align-items:center;gap:14px;margin:0 0 20px;}
  .lg-bar{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden;}
  .lg-bar span{display:block;height:100%;background:#1e7d34;border-radius:6px;transition:width .25s;}
  .lg-progress-lbl{font-size:13px;color:var(--ink-soft);white-space:nowrap;}
  .lg-items{margin-top:12px;display:flex;flex-direction:column;gap:2px;}
  .lg-item{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--ink);line-height:1.45;}
  .lg-item:hover{background:rgba(46,111,176,.06);}
  .lg-item input{margin-top:2px;width:17px;height:17px;flex:0 0 auto;accent-color:#1e7d34;cursor:pointer;}
  .lg-item.on span{color:var(--ink-soft);text-decoration:line-through;}
  .lg-done{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:#eef7ee;border:1px solid #cfe6cf;color:#1e5b2a;border-radius:12px;padding:16px 20px;margin-top:22px;font-size:15px;}
  .lg-done > div{flex:1;min-width:240px;}
  .lg-check{background:#f3f8f2;border:1px solid #cfe6cf;border-radius:14px;padding:22px 24px;margin-top:30px;}
  .lg-check h2{margin:0 0 14px;font-size:20px;color:var(--ink);}
  .lg-check li{list-style:none;margin:8px 0;padding-left:30px;position:relative;color:var(--ink);font-size:15px;}
  .lg-check li::before{content:"✓";position:absolute;left:0;top:0;color:#1e7d34;font-weight:800;}
  .lg-cta{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-top:24px;box-shadow:var(--shadow);}
  .lg-cta h2{margin:0 0 6px;font-size:19px;color:var(--ink);}
  .lg-cta p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.5;flex:1;min-width:260px;}
  .lg-actions{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 20px;}
  .lg-actions .lg-progress{flex:1;margin:0;min-width:220px;}
  .lg-print-note{display:none;}
  @media print{
    .top, .band-panna, footer.ft, .no-print, .lg-cta button{display:none !important;}
    body{background:#fff !important;}
    .wrap{max-width:100% !important;padding:0 !important;}
    .lg-print-note{display:block !important;text-align:right;font-size:11px;color:#555;margin:0 0 6px;}
    .lg-hero{background:#fff !important;color:#000 !important;padding:0 0 10px !important;border:0;border-bottom:2px solid #1C2A44;border-radius:0;margin-bottom:14px;}
    .lg-hero h1{color:#1C2A44 !important;font-size:22px;}
    .lg-hero p{color:#333 !important;font-size:12px;}
    .lg-grid{display:block !important;}
    .lg-card{break-inside:avoid;border:0 !important;box-shadow:none !important;padding:4px 0 8px !important;}
    .lg-card h3{font-size:15px;border-bottom:1px solid #bbb;padding-bottom:3px;margin:10px 0 6px;}
    .lg-ico{display:none;}
    .lg-items{gap:0;}
    .lg-item{color:#000 !important;font-size:11.5px;padding:2px 0 !important;break-inside:avoid;}
    .lg-item:hover{background:none;}
    .lg-item input{-webkit-appearance:none;appearance:none;width:11px;height:11px;border:1px solid #333;border-radius:2px;background:#fff !important;}
    .lg-item.on span{text-decoration:none !important;color:#000 !important;}
    .lg-diagram{max-width:230px;}
    .lg-done{display:none !important;}
    .lg-cta{border:0 !important;box-shadow:none !important;background:#fff !important;padding:10px 0 0 !important;margin-top:14px;border-top:1px solid #bbb;border-radius:0;}
    .lg-cta h2{font-size:14px;color:#000 !important;} .lg-cta p{font-size:11.5px;color:#333 !important;}
    a{color:#000 !important;text-decoration:none;}
  }
  .cart-tot{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);}
  .cart-tot .r{display:flex;justify-content:space-between;font-size:14px;margin:5px 0;color:var(--ink-soft);}
  .cart-tot .r.big{font-size:19px;font-weight:800;color:var(--ink);margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}

  .note{background:var(--blu-wash);border:1px solid var(--blu);border-radius:11px;padding:13px 15px;font-size:13.5px;margin-top:16px;color:var(--ink);}
  .warn{background:var(--sand-wash);border:1px solid var(--sand);border-radius:11px;padding:13px 15px;font-size:13.5px;} .warn b{color:var(--sand);}
  .empty{text-align:center;color:var(--ink-soft);padding:50px 20px;}
  .muted{color:var(--ink-faint);font-size:13px;}
  footer.ft{background:var(--navy);color:#C7D2E4;margin-top:56px;}
  :root[data-theme="dark"] footer.ft{background:#0E1424;}
  .ft-in{max-width:1200px;margin:0 auto;padding:28px 24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12.5px;}
  .ft-in .brand{color:#fff;font-size:22px;}
  /* --- pagina dettaglio prodotto (PDP) --- */
  .pdp-back{background:none;border:none;color:var(--blu);font-weight:700;font-size:13.5px;padding:4px 0;margin-bottom:14px;cursor:pointer;}
  .pdp{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start;}
  @media(max-width:820px){.pdp{grid-template-columns:1fr;gap:22px;}}
  .pdp-main{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden;}
  .pdp-main img{width:100%;height:100%;object-fit:cover;}
  .pdp-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .pdp-thumb{width:64px;height:64px;border-radius:9px;overflow:hidden;border:1.5px solid var(--line);background:var(--surface);padding:0;cursor:pointer;}
  .pdp-thumb.on{border-color:var(--blu);}
  .pdp-thumb img{width:100%;height:100%;object-fit:cover;}
  .pdp-title{font-family:var(--display,var(--sans));font-size:30px;line-height:1.12;margin:8px 0 4px;color:var(--ink);}
  .pdp-sub{color:var(--ink-soft);font-size:15px;margin:0 0 12px;}
  .pdp-desc{white-space:pre-wrap;color:var(--ink);font-size:14.5px;margin:10px 0 18px;}
  .pdp-buy{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:var(--shadow);}
  .pdp-buy .price{font-size:24px;font-weight:800;color:var(--ink);}
  .pdp-buy .add{width:auto;padding:11px 22px;margin-left:auto;}
  .pdp-template{margin-top:18px;background:var(--sand-wash);border:1px solid var(--sand);border-radius:13px;padding:16px;}
  .pdp-tpl-h{font-weight:800;color:var(--ink);font-size:15px;}
  .btn-tpl{display:inline-block;background:var(--sand);color:#1a1300;font-weight:800;font-size:13.5px;padding:10px 16px;border-radius:9px;text-decoration:none;}
  .pdp-specs{margin-top:34px;}
  table.spec{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
  table.spec th{text-align:left;width:38%;padding:11px 15px;background:var(--surface-2);color:var(--ink-soft);font-weight:700;font-size:13.5px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.spec td{padding:11px 15px;color:var(--ink);font-size:14px;border-bottom:1px solid var(--line);}
  table.spec tr:last-child th,table.spec tr:last-child td{border-bottom:none;}
  /* --- scelta spedizione nel carrello --- */
  .ship{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);}
  .ship-h{margin:0 0 10px;font-size:15px;color:var(--ink);}
  .ship-opt{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;}
  .ship-opt.on{border-color:var(--blu);background:var(--blu-wash);}
  .ship-opt input{width:auto;flex:0 0 auto;}
  .ship-txt{flex:1;font-size:14px;color:var(--ink);}
  .ship-price{font-weight:800;color:var(--ink);white-space:nowrap;}
  /* --- carosello homepage --- */
  .carousel{position:relative;width:100%;aspect-ratio:1920/720;max-height:460px;overflow:hidden;background:var(--navy);}
  @media(max-width:700px){.carousel{aspect-ratio:16/10;}}
  .cslide{position:absolute;inset:0;margin:0;opacity:0;transition:opacity .8s ease;pointer-events:none;}
  .cslide.on{opacity:1;pointer-events:auto;}
  .cslide img{width:100%;height:100%;object-fit:cover;display:block;}
  /* --- barra filtri categorie --- */
  .catbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
  .catbar button{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:7px 15px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:all .12s;}
  .catbar button:hover{border-color:var(--blu);color:var(--blu);}
  .catbar button.on{background:var(--blu);color:#fff;border-color:var(--blu);}
  .cslide figcaption{position:absolute;left:0;right:0;bottom:0;padding:24px 26px;background:linear-gradient(to top,rgba(8,13,26,.74),rgba(8,13,26,0));color:#fff;}
  .cslide figcaption b{font-family:var(--display,var(--sans));font-size:23px;display:block;line-height:1.1;}
  .cslide figcaption span{font-size:14px;opacity:.92;}
  .cdots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:2;}
  .cdots button{width:9px;height:9px;border-radius:50%;border:0;background:rgba(255,255,255,.5);cursor:pointer;padding:0;}
  .cdots button.on{background:#fff;}
  .carousel:focus-visible{outline:2px solid var(--blu);outline-offset:-2px;}
  @media (prefers-reduced-motion: reduce){.cslide{transition:none;}}
  /* --- checkout (dati cliente) --- */
  .co-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:640px){.co-grid{grid-template-columns:1fr;}}
  .co-f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-soft);}
  .co-f.co-full{grid-column:1 / -1;}
  /* --- pagina "I miei ordini" --- */
  .ord-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:14px;}
  .ord-riga{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;}
  .ord-riga-h b{color:var(--ink);}
  .ord-files{display:flex;flex-direction:column;gap:6px;}
  .ord-file{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;}
  .ord-file-n{flex:1;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ord-file-n a{color:var(--blu);}
  .ord-file-x{background:none;border:none;color:var(--ink-faint);font-size:18px;cursor:pointer;line-height:1;padding:0 2px;}
  .ord-up{margin-top:auto;background:var(--blu);color:#fff;font-weight:700;font-size:13px;padding:9px;border-radius:8px;text-align:center;cursor:pointer;}
</style>
</head>
<body>
<div id="root"></div>

<script src="config.js"></script>
<script src="lib/react.production.min.js"></script>
<script src="lib/react-dom.production.min.js"></script>
<script src="lib/supabase.js"></script>
<script src="lib/babel.min.js"></script>

<script type="text/babel">
const {useState,useEffect,useMemo}=React;
const CFG=window.GESTIONALE_CONFIG||{};
const sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
const IVA=0.22;
const eur=n=>(Number(n)||0).toLocaleString("it-IT",{style:"currency",currency:"EUR"});
// data stimata = oggi + N giorni LAVORATIVI (salta sabato e domenica)
const dataStimata=(giorni)=>{ let n=Math.max(0,Number(giorni)||0); const d=new Date(); while(n>0){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w!==0&&w!==6) n--; } return d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"}); };

const CART_KEY="komunigo_cart";
const leggiCart=()=>{try{return JSON.parse(localStorage.getItem(CART_KEY))||[];}catch(e){return [];}};
const scriviCart=c=>{try{localStorage.setItem(CART_KEY,JSON.stringify(c));}catch(e){}};

// ---- sconto B2B (mirror lato client della logica server) ----
const clampPct=n=>{ n=Number(n)||0; return n<0?0:n>100?100:n; };
const eur2=x=>Math.round((Number(x)||0)*100)/100;
// prezzi memorizzati = IVA esclusa (imponibile). Vista con/senza IVA per il cliente.
const conIva=(net,mode)=> mode==="incl"? Math.round((Number(net)||0)*(1+IVA)*100)/100 : (Number(net)||0);
const ivaLbl=mode=> mode==="incl"?"IVA incl.":"IVA escl.";
function scontoPerCat(profilo, categoria){
  if(!profilo || !profilo.b2b) return 0;
  const cat=String(categoria||"").trim().toLowerCase();
  if(cat){ const e=(profilo.sconti_cat||[]).find(x=>String(x.categoria||"").trim().toLowerCase()===cat);
    if(e && e.sconto_pct!=null && e.sconto_pct!=="") return clampPct(e.sconto_pct); }
  if(profilo.sconto_std!=null && profilo.sconto_std!=="") return clampPct(profilo.sconto_std);
  if((profilo.cliente_categoria||"")==="Rivenditore") return clampPct(profilo.sconto_riv_std);
  return 0;
}
const prezzoNet=(listino, profilo, categoria)=>eur2(Number(listino||0)*(1-scontoPerCat(profilo,categoria)/100));

const ORD_KEY="komunigo_ordine_token";   // ultimo ordine del cliente (per "I miei ordini")
const leggiOrdToken=()=>{try{return localStorage.getItem(ORD_KEY)||"";}catch(e){return "";}};
const scriviOrdToken=t=>{try{ if(t) localStorage.setItem(ORD_KEY,t); }catch(e){}};

function App(){
  const urlToken=(()=>{ try{ return new URLSearchParams(window.location.search).get("ordine")||""; }catch(e){ return ""; } })();
  const [vista,setVista]=useState(urlToken?"ordine":"home");
  const [ordineToken,setOrdineToken]=useState(urlToken||"");
  const [cart,setCart]=useState(leggiCart);
  useEffect(()=>{scriviCart(cart);},[cart]);
  const addCart=(riga)=>setCart(c=>[...c,{...riga,rid:Date.now()+"-"+Math.random().toString(36).slice(2,7)}]);
  const delCart=(rid)=>setCart(c=>c.filter(r=>r.rid!==rid));
  const nPezzi=cart.reduce((s,r)=>s+(Number(r.quantita)||1),0);
  const apriOrdine=(tok)=>{ if(!tok) return; setOrdineToken(tok); setVista("ordine"); };
  const onOrdineCreato=(tok)=>{ scriviOrdToken(tok); setCart([]); apriOrdine(tok); };
  const ultimoOrd=leggiOrdToken();
  const [catFiltro,setCatFiltro]=useState("");
  const vaiCat=(cat)=>{ setCatFiltro(typeof cat==="string"?cat:""); setVista("catalogo"); };
  const [ricerca,setRicerca]=useState("");
  const cercaIn=(q)=>{ setRicerca(q); if(vista!=="catalogo") setVista("catalogo"); };
  // vista prezzi IVA inclusa/esclusa (default: B2B → esclusa, altrimenti inclusa)
  const [ivaMode,setIvaMode]=useState(()=>{ try{return localStorage.getItem("komunigo_iva")||"";}catch(e){return "";} });
  useEffect(()=>{ try{ if(ivaMode) localStorage.setItem("komunigo_iva",ivaMode); }catch(e){} },[ivaMode]);
  const [sess,setSess]=useState(null);
  const [account,setAccount]=useState(null);
  const [authOpen,setAuthOpen]=useState(false);
  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSess(data.session||null));
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSess(s||null));
    return ()=>{ try{ sub.subscription.unsubscribe(); }catch(e){} };
  },[]);
  useEffect(()=>{ (async()=>{
    if(!sess){ setAccount(null); return; }
    try{ const {data}=await sb.from("komunigo_account").select("*").eq("id",sess.user.id).maybeSingle(); setAccount(data||null); }catch(e){ setAccount(null); }
  })(); },[sess]);
  const logout=async()=>{ await sb.auth.signOut(); setAccount(null); setProfiloB2b(null); setVista("home"); };
  const nomeAcc = (account&&(account.ragione_sociale||account.nome||account.azienda)) || (sess&&sess.user.email) || "Account";
  const iva = ivaMode || (account&&account.stato==="b2b"?"escl":"incl");   // vista prezzi effettiva

  // profilo sconti B2B del cliente loggato (per prezzi riservati a magazzino)
  const [profiloB2b,setProfiloB2b]=useState(null);
  useEffect(()=>{ (async()=>{
    if(!account || account.stato!=="b2b"){ setProfiloB2b(null); return; }
    try{ const {data}=await sb.functions.invoke("komunigo-ordine",{body:{action:"profilo-prezzi"}}); setProfiloB2b(data&&data.b2b?data:null); }
    catch(e){ setProfiloB2b(null); }
  })(); },[account]);

  // riordino rapido: ricarica le righe di un ordine passato nel carrello
  const riordina=async(token)=>{
    try{
      const {data}=await sb.functions.invoke("komunigo-ordine",{body:{action:"dettaglio",token}});
      const righe=(data&&data.righe)||[];
      righe.forEach(r=>addCart(r.tipo==="configurabile"
        ? {tipo:"configurabile",prodotto_config_id:r.prodotto_config_id,descrizione:r.descrizione,config:r.config||{},quantita:Number(r.quantita)||1,prezzo_unitario:Number(r.prezzo_unitario)||0,prezzo_totale:Number(r.prezzo_totale)||0}
        : {tipo:"prodotto",articolo_id:r.articolo_id,descrizione:r.descrizione,quantita:Number(r.quantita)||1,prezzo_unitario:Number(r.prezzo_unitario)||0,prezzo_totale:Number(r.prezzo_totale)||0}));
      if(righe.length) setVista("carrello");
    }catch(e){}
  };

  return (
    <div>
      <header className="top">
        <div className="topline"></div>
        <div className="top-in">
          <button className="brand" onClick={()=>setVista("home")}>Komuni<span className="go">go</span></button>
          <form className="search" onSubmit={e=>{e.preventDefault(); setVista("catalogo");}}>
            <span>🔍</span>
            <input value={ricerca} onChange={e=>cercaIn(e.target.value)} placeholder="Cerca prodotti, lavorazioni…"/>
            {ricerca && <button type="button" className="search-x" onClick={()=>setRicerca("")} aria-label="Pulisci">×</button>}
          </form>
          <nav className="main">
            <button className={vista==="home"?"on":""} onClick={()=>setVista("home")}>Home</button>
            <button className={vista==="catalogo"?"on":""} onClick={()=>vaiCat("")}>Catalogo</button>
            {(!sess && (ultimoOrd||ordineToken)) && <button className={vista==="ordine"?"on":""} onClick={()=>apriOrdine(ordineToken||ultimoOrd)}>I miei ordini</button>}
            {sess
              ? <button className={vista==="account"?"on":""} onClick={()=>setVista("account")}>👤 {nomeAcc}</button>
              : <button onClick={()=>setAuthOpen(true)}>Accedi</button>}
          </nav>
          <button className="cart-btn" onClick={()=>setVista("carrello")}>🛒 Carrello
            {nPezzi>0 && <span className="cart-badge">{nPezzi}</span>}</button>
        </div>
      </header>
      <div className="band-panna"></div>

      {vista==="home"     && <Home vaiCatalogo={vaiCat}/>}
      {vista!=="home" && <div className="wrap">
        {vista==="catalogo" && <Catalogo addCart={addCart} catInit={catFiltro} profilo={profiloB2b} vaiGuida={()=>setVista("guida")} ricerca={ricerca} setRicerca={setRicerca} iva={iva} setIva={setIvaMode}/>}
        {vista==="carrello" && <Carrello cart={cart} delCart={delCart} vaiCatalogo={()=>setVista("catalogo")} onOrdineCreato={onOrdineCreato} account={account} profilo={profiloB2b}/>}
        {vista==="ordine" && <OrdinePagina token={ordineToken||ultimoOrd} vaiCatalogo={()=>setVista("catalogo")}/>}
        {vista==="account" && <AccountPagina account={account} sess={sess} onLogout={logout} vaiCatalogo={()=>vaiCat("")} apriOrdine={apriOrdine} onAccountChange={setAccount} riordina={riordina}/>}
        {vista==="guida" && <LineeGuida vaiCatalogo={()=>setVista("catalogo")}/>}
      </div>}

      {authOpen && <AuthModal onClose={()=>setAuthOpen(false)}/>}

      <footer className="ft">
        <div className="ft-in">
          <div className="brand disp">Komuni<span style={{color:"var(--blu)"}}>go</span></div>
          <div className="ft-links">
            <button className="ft-lnk" onClick={()=>setVista("guida")}>📄 Linee guida file di stampa</button>
            <button className="ft-lnk" onClick={()=>vaiCat("")}>Catalogo</button>
          </div>
          <div>Creatio Group · Stampa &amp; Allestimenti — komunigo.it · Catalogo e prezzi dal gestionale.</div>
        </div>
      </footer>
    </div>
  );
}

// =====================================================================
//  HOME  (struttura a piani)
// =====================================================================
// carosello a scorrimento automatico (banda sotto l'hero)
function Carosello({items}){
  const [i,setI]=useState(0);
  const [paused,setPaused]=useState(false);
  const [touchX,setTouchX]=useState(null);
  const n=items.length;
  const reduce = typeof window!=="undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  useEffect(()=>{
    if(n<2 || paused || reduce) return;
    const t=setInterval(()=>setI(x=>(x+1)%n), 5000);
    return ()=>clearInterval(t);
  },[n,paused,reduce]);
  useEffect(()=>{ if(i>=n) setI(0); },[n,i]);
  if(!n) return null;
  const vai=d=>setI(x=>((x+d)%n+n)%n);
  const onTS=e=>setTouchX(e.touches[0].clientX);
  const onTE=e=>{ if(touchX==null) return; const dx=e.changedTouches[0].clientX-touchX; if(Math.abs(dx)>40) vai(dx<0?1:-1); setTouchX(null); };
  return (
    <div className="carousel" tabIndex={0} onMouseEnter={()=>setPaused(true)} onMouseLeave={()=>setPaused(false)}
      onTouchStart={onTS} onTouchEnd={onTE}
      onKeyDown={e=>{ if(e.key==="ArrowRight") vai(1); if(e.key==="ArrowLeft") vai(-1); }}
      aria-roledescription="carosello">
      {items.map((it,idx)=>(
        <figure className={"cslide "+(idx===i?"on":"")} key={it.id} aria-hidden={idx!==i}>
          <img src={kPubShop(it.path)} alt={it.titolo||""}/>
          {(it.titolo||it.sottotitolo) && <figcaption><b>{it.titolo}</b>{it.sottotitolo?<span>{it.sottotitolo}</span>:null}</figcaption>}
        </figure>
      ))}
      {n>1 && <div className="cdots">{items.map((_,idx)=>
        <button key={idx} className={idx===i?"on":""} onClick={()=>setI(idx)} aria-label={"Vai alla foto "+(idx+1)}/>)}</div>}
    </div>
  );
}

function Catalogo({addCart, catInit, profilo, vaiGuida, ricerca, setRicerca, iva, setIva}){
  const [prodotti,setProdotti]=useState(null);
  const [conf,setConf]=useState(null);
  const [errore,setErrore]=useState("");
  const [dettaglio,setDettaglio]=useState(null);
  const [cat,setCat]=useState(catInit||"");
  const [prezziDa,setPrezziDa]=useState({});   // {confId: prezzo unitario base} per i gadget
  const [abb,setAbb]=useState([]);   // capi del catalogo fornitore proposti (vista komunigo_abbigliamento, v17)
  const [abbSub,setAbbSub]=useState("");
  useEffect(()=>{ setCat(catInit||""); },[catInit]);
  useEffect(()=>{ (async()=>{
    try{ const {data,error}=await sb.from("komunigo_abbigliamento").select("*").order("nome");
      if(!error) setAbb((data||[]).map(x=>({...x, categoria:"Abbigliamento"}))); }catch(e){}
  })(); },[]);

  useEffect(()=>{ (async()=>{
    try{
      const [p,c]=await Promise.all([
        sb.from("komunigo_prodotti").select("*").order("nome"),
        sb.from("komunigo_configuratori").select("*").order("nome"),
      ]);
      if(p.error) throw p.error;
      if(c.error) throw c.error;
      setProdotti(p.data||[]); setConf(c.data||[]);
    }catch(e){ setErrore(e.message||String(e)); setProdotti([]); setConf([]); }
  })(); },[]);

  // prezzo "da €X/pz" per i gadget (minimo pezzi, senza stampa) — come fanno i competitor
  useEffect(()=>{ (async()=>{
    const gz=(conf||[]).filter(c=>c.tipo==="gadget");
    if(!gz.length) return;
    try{
      const res=await Promise.all(gz.map(c=>sb.functions.invoke("hyper-endpoint",{body:{prodotto_id:c.id, quantita:Number(c.minimo)||1}})
        .then(r=>({id:c.id, unit:(r.data && !r.data.sotto_costo)? Number(r.data.prezzo_unitario)||0 : 0})).catch(()=>({id:c.id,unit:0}))));
      const m={}; res.forEach(x=>{ if(x.unit>0) m[x.id]=x.unit; }); setPrezziDa(m);
    }catch(e){}
  })(); },[conf]);

  if(errore) return (
    <div className="warn"><b>Vetrina non ancora disponibile.</b> Esegui prima la migrazione
      <code> komunigo-v1.sql </code> in Supabase (crea le viste pubbliche). Dettaglio: {errore}</div>
  );
  if(prodotti===null || conf===null) return <div className="empty">Carico il catalogo…</div>;
  if(dettaglio && dettaglio.tipo==="abbigliamento") return <AbbigliamentoDettaglio capo={dettaglio.prod} addCart={addCart} onBack={()=>setDettaglio(null)} profilo={profilo} vaiGuida={vaiGuida} iva={iva} setIva={setIva}/>;
  if(dettaglio) return <ProdottoDettaglio tipo={dettaglio.tipo} prod={dettaglio.prod} addCart={addCart} onBack={()=>setDettaglio(null)} profilo={profilo} vaiGuida={vaiGuida} iva={iva} setIva={setIva}/>;

  const catList=[...new Set([...conf,...prodotti,...abb].map(x=>x.categoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const matchCat = x => !cat || String(x.categoria||"").toLowerCase()===cat.toLowerCase();
  const q=(ricerca||"").trim().toLowerCase();
  const matchQ = x => !q || [x.nome,x.descrizione,x.note,x.categoria,x.codice,x.sottocategoria,x.brand].filter(Boolean).join(" ").toLowerCase().includes(q);
  const capiAll = abb.filter(x=>matchCat(x) && matchQ(x));
  const abbSubs = [...new Set(capiAll.map(x=>x.sottocategoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const capi = capiAll.filter(x=>!abbSub || x.sottocategoria===abbSub);
  const gadget = conf.filter(c=>c.tipo==="gadget" && matchCat(c) && matchQ(c));
  const misura = conf.filter(c=>c.tipo!=="gadget" && matchCat(c) && matchQ(c));
  const stock  = prodotti.filter(x=>matchCat(x) && matchQ(x));
  const nTot = gadget.length+misura.length+stock.length+capiAll.length;
  const vuoto = nTot===0;

  const cardConf = (c,isGadget) => (
    <div className="card" key={c.id} style={{cursor:"pointer"}} onClick={()=>setDettaglio({tipo:"configuratore",prod:c})}>
      <div className="ph">{isGadget?"🎁":"🎨"}</div>
      <div className="bd"><span className="tag-conf">{isGadget?"Personalizzabile":"Su misura"}</span><h3>{c.nome}</h3>
        <div className="desc">{c.note||"Prodotto personalizzabile."}</div>
        <div className="row">{isGadget && prezziDa[c.id]
          ? <span className="price-da">da <b>{eur(conIva(prezziDa[c.id],iva))}</b>/pz <span className="iva-tag">{ivaLbl(iva)}</span></span>
          : <span className="muted">{Number(c.giorni_lavorazione)>0?`pronto in ~${c.giorni_lavorazione} gg lav.`:"prezzo su configurazione"}</span>}</div>
        <button className="add" onClick={e=>{e.stopPropagation();setDettaglio({tipo:"configuratore",prod:c});}}>{isGadget?"Personalizza":"Vedi e configura"}</button></div>
    </div>);

  return (
    <div>
      {profilo && profilo.b2b && <div className="b2b-note">🤝 <b>Prezzi riservati B2B{profilo.cliente_nome?" · "+profilo.cliente_nome:""}</b> — lo sconto del tuo listino è già applicato ai prezzi qui sotto.</div>}
      <div className="cat-toprow">
        <div className="cat-search">
          <span>🔍</span>
          <input value={ricerca||""} onChange={e=>setRicerca(e.target.value)} placeholder="Cerca per nome, categoria, codice…"/>
          {q && <button className="search-x" onClick={()=>setRicerca("")} aria-label="Pulisci">×</button>}
        </div>
        {setIva && <div className="iva-toggle" title="Mostra i prezzi con o senza IVA">
          <button className={iva==="escl"?"on":""} onClick={()=>setIva("escl")}>IVA escl.</button>
          <button className={iva==="incl"?"on":""} onClick={()=>setIva("incl")}>IVA incl.</button>
        </div>}
      </div>
      {q && <p className="muted" style={{margin:"2px 0 10px"}}><b>{nTot}</b> {nTot===1?"risultato":"risultati"} per «{ricerca}» {(cat)?`in ${cat} `:""}<button className="lnk" onClick={()=>{setRicerca("");setCat("");}}>azzera</button></p>}
      {catList.length>0 && <div className="catbar">
        <button className={!cat?"on":""} onClick={()=>setCat("")}>Tutti</button>
        {catList.map(cc=><button key={cc} className={cat.toLowerCase()===cc.toLowerCase()?"on":""} onClick={()=>setCat(cc)}>{cc}</button>)}
      </div>}

      {capiAll.length>0 && <>
        <h2 className="sec">👕 Abbigliamento personalizzato</h2>
        <p className="sec-sub">T-shirt, felpe, polo e giacche con il tuo logo: scegli colore, taglie e dove stampare.</p>
        {abbSubs.length>1 && <div className="catbar" style={{marginTop:0}}>
          <button className={!abbSub?"on":""} onClick={()=>setAbbSub("")}>Tutto</button>
          {abbSubs.map(sc=><button key={sc} className={abbSub===sc?"on":""} onClick={()=>setAbbSub(sc)}>{sc}</button>)}
        </div>}
        <div className="grid">{capi.map(c=>{ const img=(c.immagini||[])[0]; return (
          <div className="card" key={c.fornitore+":"+c.codice} style={{cursor:"pointer"}} onClick={()=>setDettaglio({tipo:"abbigliamento",prod:c})}>
            <div className="ph">{img?<img src={img.anteprima} alt={c.nome} loading="lazy" style={{objectFit:"contain",background:"#fff"}}/>:"👕"}</div>
            <div className="bd"><span className="tag-conf">Personalizzabile</span>{c.sottocategoria && <span className="cat-l" style={{marginLeft:6}}>{c.sottocategoria}</span>}
              <h3>{c.nome}</h3>
              <div className="desc">{[c.brand,c.genere,c.grammatura].filter(Boolean).join(" · ")}</div>
              <div className="row">{c.prezzo_da
                ? <span className="price-da">da <b>{eur(conIva(c.prezzo_da,iva))}</b>/pz <span className="iva-tag">{ivaLbl(iva)}</span></span>
                : <span className="muted">prezzo su configurazione</span>}</div>
              <button className="add" onClick={e=>{e.stopPropagation();setDettaglio({tipo:"abbigliamento",prod:c});}}>Personalizza</button></div>
          </div>); })}</div>
      </>}

      {gadget.length>0 && <>
        <h2 className="sec" style={{marginTop:capiAll.length?40:0}}>🎁 Gadget personalizzati</h2>
        <p className="sec-sub">Scegli colore, quantità e dove stampare: il prezzo lo calcola il sistema.</p>
        <div className="grid">{gadget.map(c=>cardConf(c,true))}</div>
      </>}

      {misura.length>0 && <>
        <h2 className="sec" style={{marginTop:gadget.length?40:0}}>Lavorazioni su misura</h2>
        <p className="sec-sub">Scegli materiale e misure: il prezzo lo calcola il nostro sistema.</p>
        <div className="grid">{misura.map(c=>cardConf(c,false))}</div>
      </>}

      {stock.length>0 && <>
        <h2 className="sec" style={{marginTop:(gadget.length||misura.length)?40:0}}>Pronti a magazzino</h2>
        <p className="sec-sub">Disponibilità reale dal nostro magazzino.</p>
        <div className="grid">{stock.map(p=>{ const disp=Number(p.disponibile)||0; const sc=scontoPerCat(profilo,p.categoria); const net=prezzoNet(p.prezzo,profilo,p.categoria); return (
          <div className="card" key={p.id} style={{cursor:"pointer"}} onClick={()=>setDettaglio({tipo:"articolo",prod:p})}>
            <div className="ph">{Array.isArray(p.foto_urls)&&p.foto_urls[0]?<img src={p.foto_urls[0]} alt={p.nome}/>:"📦"}</div>
            <div className="bd">{p.categoria && <span className="cat-l">{p.categoria}</span>}<h3>{p.nome}</h3>
              <div className="desc">{p.descrizione||""}</div>
              <div className="row"><span className="price">{eur(conIva(net,iva))}{sc>0 && <span className="listino-old">{eur(conIva(p.prezzo,iva))}</span>}</span>
                <span className={"avail "+(disp>0?"ok":"no")}>{disp>0?disp+" disp.":"Esaurito"}</span></div>
              <button className="add" onClick={e=>{e.stopPropagation();setDettaglio({tipo:"articolo",prod:p});}}>Vedi prodotto</button></div>
          </div>); })}</div>
      </>}

      {vuoto && (q||cat) && <p className="muted">Nessun prodotto{q?` per «${ricerca}»`:""}{cat?` nella categoria «${cat}»`:""}. <button className="lnk" onClick={()=>{setRicerca&&setRicerca("");setCat("");}}>Vedi tutto il catalogo</button></p>}
      {vuoto && !q && !cat && <p className="muted">Catalogo in allestimento. (Nel gestionale: attiva i configuratori o rendi "vendibile" gli articoli.)</p>}
    </div>
  );
}

// =====================================================================
//  DETTAGLIO PRODOTTO (scheda: descrizione, caratteristiche, galleria, template)

const kPubShop = path => path ? sb.storage.from("komunigo-public").getPublicUrl(path).data.publicUrl : "";

function ProdottoDettaglio({tipo, prod, addCart, onBack, profilo, vaiGuida, iva, setIva}){
  const [scheda,setScheda]=useState(null);   // null = sto caricando
  const [cfgOpen,setCfgOpen]=useState(false);
  const [imgSel,setImgSel]=useState(0);
  useEffect(()=>{ (async()=>{
    try{
      const {data}=await sb.from("komunigo_schede_pub").select("*").eq("tipo",tipo).eq("ref_id",prod.id).maybeSingle();
      setScheda(data||{});
    }catch(e){ setScheda({}); }
  })(); },[tipo,prod.id]);

  if(scheda===null) return <div className="empty">Carico la scheda…</div>;

  const imgs = Array.isArray(scheda.immagini)? scheda.immagini : [];
  const galleria = imgs.map(x=>kPubShop(x.path)).filter(Boolean);
  if(!galleria.length && tipo==="articolo" && Array.isArray(prod.foto_urls)) galleria.push(...prod.foto_urls.filter(Boolean));
  const carat = Array.isArray(scheda.caratteristiche)? scheda.caratteristiche.filter(c=>c && (c.label||c.valore)) : [];
  const disp = tipo==="articolo" ? (Number(prod.disponibile)||0) : null;
  const fotoMain = galleria[imgSel] || galleria[0] || null;

  return (
    <div>
      <button className="pdp-back" onClick={onBack}>← Torna al catalogo</button>
      <div className="pdp">
        <div className="pdp-media">
          <div className="pdp-main">{fotoMain? <img src={fotoMain} alt={prod.nome}/> : <span style={{fontSize:64}}>{tipo==="configuratore"?"🎨":"📦"}</span>}</div>
          {galleria.length>1 && <div className="pdp-thumbs">{galleria.map((u,i)=>
            <button key={i} className={"pdp-thumb "+(i===imgSel?"on":"")} onClick={()=>setImgSel(i)}><img src={u} alt=""/></button>)}</div>}
        </div>
        <div className="pdp-info">
          {tipo==="configuratore"? <span className="tag-conf">Su misura</span> : (prod.categoria && <span className="cat-l">{prod.categoria}</span>)}
          <h1 className="pdp-title">{prod.nome}</h1>
          {scheda.sottotitolo && <p className="pdp-sub">{scheda.sottotitolo}</p>}
          {scheda.descrizione && <div className="pdp-desc">{scheda.descrizione}</div>}

          {tipo==="articolo" && (()=>{ const sc=scontoPerCat(profilo,prod.categoria); const net=prezzoNet(prod.prezzo,profilo,prod.categoria); return <div className="pdp-buy">
            <span className="price">{eur(conIva(net,iva))} <span className="iva-tag">{ivaLbl(iva)}</span>{sc>0 && <span className="listino-old">{eur(conIva(prod.prezzo,iva))}</span>}</span>
            {sc>0 && <span className="b2b-badge">−{sc}% riservato</span>}
            <span className={"avail "+(disp>0?"ok":"no")}>{disp>0?disp+" disp.":"Esaurito"}</span>
            <button className="add" disabled={disp<=0}
              onClick={()=>addCart({tipo:"prodotto",articolo_id:prod.id,descrizione:prod.nome,quantita:1,prezzo_unitario:net,prezzo_totale:net})}>
              {disp>0?"Aggiungi al carrello":"Non disponibile"}</button>
          </div>; })()}
          {tipo==="configuratore" && <div className="pdp-buy">
            <span className="muted">Prezzo calcolato sulla tua configurazione</span>
            <button className="add" onClick={()=>setCfgOpen(true)}>Configura e ordina</button>
          </div>}

          {Number(prod.giorni_lavorazione)>0
            ? <div className="muted" style={{fontSize:13,marginTop:10}}>📦 Spedizione stimata: <b>{dataStimata(prod.giorni_lavorazione)}</b> <span style={{opacity:.8}}>(≈ {prod.giorni_lavorazione} gg lavorativi + spedizione)</span></div>
            : (tipo==="articolo" && disp>0 && <div className="muted" style={{fontSize:13,marginTop:10}}>📦 <b>Pronto</b> per la spedizione</div>)}

          <div style={{marginTop:14}}><BarraFiducia compact/></div>

          {scheda.template_path && <div className="pdp-template">
            <div className="pdp-tpl-h">📄 Template / layout di stampa</div>
            <p className="muted" style={{margin:"4px 0 10px",fontSize:13}}>{scheda.template_note||"Scarica il file, posiziona la tua grafica nell'area indicata ed esporta in PDF."}</p>
            <a className="btn-tpl" href={kPubShop(scheda.template_path)} target="_blank" rel="noopener noreferrer" download>⬇ Scarica il template ({scheda.template_nome||"PDF"})</a>
          </div>}

          {vaiGuida && <p className="muted" style={{fontSize:13,marginTop:12}}>📄 Come preparare il file? <button className="lnk" onClick={vaiGuida}>Leggi le linee guida di stampa →</button></p>}

          {tipo==="configuratore" && <a className="campione-lnk" href={`mailto:info@komunigo.it?subject=${encodeURIComponent("Richiesta campione neutro — "+prod.nome)}&body=${encodeURIComponent("Vorrei ricevere un campione NEUTRO (senza stampa) di: "+prod.nome+"\n\nNome/azienda:\nIndirizzo di spedizione:\nTelefono:\n\nGrazie!")}`}>🧪 Vuoi provarlo prima? <b>Ordina un campione neutro</b></a>}
        </div>
      </div>

      {carat.length>0 && <div className="pdp-specs">
        <h2 className="sec">Caratteristiche</h2>
        <table className="spec"><tbody>{carat.map((c,i)=>
          <tr key={i}><th>{c.label}</th><td>{c.valore}</td></tr>)}</tbody></table>
      </div>}

      {cfgOpen && <Configuratore prod={prod} chiudi={()=>setCfgOpen(false)} addCart={addCart} iva={iva} setIva={setIva}/>}
    </div>
  );
}

// =====================================================================
//  TECNICHE DI STAMPA: badge + "ⓘ Cos'è?" con la spiegazione per il cliente.
//  Testi da Komunigo/contenuti/tecniche-di-stampa.md (forniti da Giulio, refusi
//  corretti). L'ordine conta: quadricromia prima di serigrafia, 360° prima di digitale.
// =====================================================================
const TECNICHE_INFO=[
  {re:/quadricromia/i, titolo:"Quadricromia", testo:"La quadricromia è una tecnica di stampa serigrafica che consente di riprodurre immagini fotografiche o con sfumature utilizzando i quattro colori primari: ciano, magenta, giallo e nero. Attraverso la separazione dei quattro colori in retini, questi vengono sovrapposti e mescolati in diverse intensità per generare tutte le altre sfumature cromatiche. Il risultato migliore si ottiene modulando la luminosità e la densità di ciascun colore primario. Con l'utilizzo di telai ad alta definizione si riduce significativamente la dimensione dei retini, ottenendo così una resa fotografica."},
  {re:/ricamo/i, titolo:"Ricamo", testo:"Il ricamo personalizzato è l'arte di decorare tessuti e altri materiali con fili colorati (fino a 12 colori) per creare disegni, loghi o scritte uniche, su richiesta del cliente, offrendo alta qualità, eleganza e durabilità: è ideale per abbigliamento aziendale, divise e gadget di pregio. Questa tecnica, che può includere anche patch applicabili (patch ricamate), si adatta a diverse superfici, conferendo prestigio e resistenza nel tempo, a differenza di altre tecniche di stampa. La ricamatura viene effettuata da una macchina che riceve il logo attraverso un software: il macchinario stesso prepara la punciatura dell'immagine, che consentirà un ricamo punto a punto. Il logo ricamato è resistente ai lavaggi e nel tempo e si adatta a ogni tipo di tessuto."},
  {re:/digitale/i, titolo:"Stampa digitale", testo:"La stampa digitale è un processo che riproduce immagini e testi direttamente da un file elettronico (come un PDF, JPG o TIF) su un supporto fisico, senza la necessità di lastre di stampa intermedie. Questo la rende veloce e flessibile, ideale per tirature medio-piccole e personalizzazioni, poiché i dati vengono inviati direttamente alla stampante, che utilizza tecnologie come il getto d'inchiostro, il toner, la sublimazione, il transfer DTF e i raggi UV per trasferire il colore. Permette di stampare su una vasta gamma di supporti, come carta, cartone, tessuti, plastica, metallo e legno: qualsiasi file o logo, senza limiti di colore."},
  {re:/serigrafia/i, titolo:"Serigrafia", testo:"La serigrafia è una tecnica di stampa versatile che trasferisce l'inchiostro direttamente su quasi ogni tipo di superficie (tessuti, carta, vetro, metallo) usando un'incisione del file su un telaio. Permette di ottenere colori vivaci e resistenti ed è ideale per grandi tirature e stampe d'arte su shopper o T-shirt, con effetti speciali anche a più colori."},
  {re:/tampografia/i, titolo:"Tampografia", testo:"La tampografia è una tecnica di stampa indiretta che trasferisce loghi e scritte su oggetti di forme diverse (piane, curve, irregolari) tramite un tampone morbido in silicone, che preleva l'inchiostro da una lastra incisa (cliché) e lo deposita sull'oggetto. È ideale per personalizzare gadget, oggettistica, penne o portachiavi grazie alla sua precisione e versatilità anche su piccole superfici, con alta definizione di testi e piccoli dettagli."},
];
const tecnicaInfo=t=>TECNICHE_INFO.find(x=>x.re.test(String(t||"")))||null;
// badge della tecnica + spiegazione apribile (sta dentro la <label> della posizione: niente click "passanti")
function TecBadge({tecnica}){
  const [open,setOpen]=useState(false);
  if(!tecnica) return null;
  const info=tecnicaInfo(tecnica);
  const stop=e=>{ e.preventDefault(); e.stopPropagation(); };
  return <>
    <span className="tec-badge">{tecnica}</span>
    {info && <button type="button" className="tec-info-btn" onClick={e=>{stop(e); setOpen(o=>!o);}} aria-expanded={open}>{open?"✕ chiudi":"ⓘ Cos'è?"}</button>}
    {info && open && <span className="tec-info" onClick={stop}><b>{info.titolo}.</b> {info.testo}</span>}
  </>;
}

// =====================================================================
//  SAGOME DI STAMPA: disegno vettoriale dell'oggetto + rettangolo della
//  posizione, proporzionato all'area reale (area_cm della posizione).
//  Coordinate in un viewBox 240×240; "ucm" = unità del disegno per 1 cm.
//  Nomi posizione normalizzati (minuscolo, senza "ricamo ").
// =====================================================================
const SAGOME={
  maglietta:{ ucm:2.4,
    viste:{
      fronte:"M88 30 Q120 50 152 30 L190 42 L228 88 L200 108 L182 92 L182 225 L58 225 L58 92 L40 108 L12 88 L50 42 Z",
      retro:"M88 30 Q120 38 152 30 L190 42 L228 88 L200 108 L182 92 L182 225 L58 225 L58 92 L40 108 L12 88 L50 42 Z" },
    pos:{
      "lato cuore":{v:"fronte",cx:146,cy:82},          // petto sinistro di chi indossa = a destra guardando
      "lato destro":{v:"fronte",cx:94,cy:82},
      "centro fronte":{v:"fronte",cx:120,top:62},
      "centro retro":{v:"retro",cx:120,top:50},
      "manica sinistra":{v:"fronte",cx:204,cy:80},
      "manica destra":{v:"fronte",cx:36,cy:80},
      "centro collo fronte":{v:"fronte",cx:120,top:47},
      "centro collo retro":{v:"retro",cx:120,top:38} } },
  zaino:{ ucm:4,
    viste:{
      fronte:"M70 48 Q70 34 84 34 L156 34 Q170 34 170 48 L176 214 Q176 226 164 226 L76 226 Q64 226 64 214 Z M100 34 Q100 14 120 14 Q140 14 140 34 M78 150 L162 150 L162 212 L78 212 Z",
      retro:"M70 48 Q70 34 84 34 L156 34 Q170 34 170 48 L176 214 Q176 226 164 226 L76 226 Q64 226 64 214 Z M100 34 Q100 14 120 14 Q140 14 140 34 M92 46 Q86 130 96 214 M148 46 Q154 130 144 214" },
    pos:{
      "fronte":{v:"fronte",cx:120,cy:100},
      "retro":{v:"retro",cx:120,cy:120},
      "alto fronte":{v:"fronte",cx:120,cy:62},
      "basso fronte":{v:"fronte",cx:120,cy:181} } },
};
const sagomaPerCapo=c=> /bag|backpack|zain|borsa|borse|sacca/i.test([c&&c.sottocategoria,c&&c.nome].join(" ")) ? "zaino" : "maglietta";
function areaCm(a){ const n=String(a||"").replace(/,/g,".").match(/[\d.]+/g); return n&&n.length>=2? [Number(n[0]),Number(n[1])] : null; }
function SagomaStampa({sagoma,nome,area}){
  const S=SAGOME[sagoma]; if(!S) return null;
  const key=String(nome||"").toLowerCase().replace(/^ricamo\s+/,"").trim();
  const p=S.pos[key]; if(!p) return null;
  const a=areaCm(area)||[8,8];
  const w=Math.min(a[0]*S.ucm,200), h=Math.min(a[1]*S.ucm,180);
  const x=p.cx-w/2, y=p.top!=null? p.top : p.cy-h/2;
  return (
    <svg className="sagoma" viewBox="0 0 240 240" role="img" aria-label={"Posizione di stampa: "+nome}>
      <path d={S.viste[p.v]} fill="#fff" stroke="currentColor" strokeWidth="3" strokeLinejoin="round" fillRule="evenodd"/>
      <rect x={x} y={y} width={w} height={h} rx="2" className="sagoma-area"/>
      <text x="120" y="238" textAnchor="middle" className="sagoma-vista">{p.v==="retro"?"retro":"fronte"}</text>
    </svg>);
}

const lavaggioIt=t=>String(t||"").split(";").map(x=>x.trim()).filter(Boolean).map(x=>LAVAGGIO_IT[x.toLowerCase()]||x).join(" · ");

    setColori(data||[]); if((data||[]).length) setColSel(data[0].codice_colore);

          {imgs.length>1 && <div className="pdp-thumbs">{imgs.map((u,i)=>

function ConfiguratoreAbbigliamento({capo, colori, colInit, chiudi, addCart, iva, setIva}){
  const [col,setCol]=useState(colInit||(colori[0]&&colori[0].codice_colore)||"");
  const [taglie,setTaglie]=useState([]);   // [{sku,taglia,prezzo,ordine,codice_colore}]
  const [qta,setQta]=useState({});         // {sku: n}
  const [stampe,setStampe]=useState([]);
  const [stSel,setStSel]=useState({});     // {stampa_id: n_colori}
  const [prezzo,setPrezzo]=useState(null);
  const [stato,setStato]=useState(""); const [errMsg,setErrMsg]=useState("");
  const [step,setStep]=useState(1);
  useEffect(()=>{ (async()=>{
    const [t,s]=await Promise.all([
      sb.from("komunigo_abbigliamento_taglie").select("*").eq("fornitore",capo.fornitore).eq("codice_prodotto",capo.codice).order("ordine"),
      sb.from("komunigo_configuratori_stampe").select("*").eq("prodotto_id",capo.modello_stampa_id).order("ordine"),
    ]);
    setTaglie(t.data||[]); setStampe(s.data||[]);
  })(); },[capo.fornitore,capo.codice,capo.modello_stampa_id]);
  const invalida=()=>{ setPrezzo(null); setErrMsg(""); setStato(""); };
  const tCol=taglie.filter(t=>t.codice_colore===col);
  const righeT=tCol.map(t=>({sku:t.sku, taglia:t.taglia, qta:Math.max(0,Math.floor(Number(qta[t.sku])||0))})).filter(t=>t.qta>0);
  const N=righeT.reduce((s,t)=>s+t.qta,0);
  const minimo=Number(capo.minimo)||0;
  const stArr=()=>Object.keys(stSel).filter(id=>stSel[id]>0).map(id=>({stampa_id:id, colori:stSel[id]}));
  const cNome=(colori.find(c=>c.codice_colore===col)||{}).colore||col;
  const abbCfg=()=>({fornitore:capo.fornitore, codice:capo.codice, colore:col, colore_nome:cNome, taglie:righeT});
  const calcola=async()=>{
    setStato("calcolo"); setPrezzo(null); setErrMsg("");
    try{
      const {data,error}=await sb.functions.invoke("hyper-endpoint",{body:{prodotto_id:capo.modello_stampa_id, abbigliamento:abbCfg(), stampe:stArr()}});
      if(error) throw error;
      if(!data || data.error) throw new Error((data&&data.error)||"Calcolo non riuscito");
      setPrezzo(data); setStato("");
    }catch(e){ setStato("errore"); setErrMsg(e.message||String(e)); }
  };
  const prezzoOk=prezzo && Number(prezzo.prezzo_totale)>0 && !prezzo.sotto_costo;
  const aggiungi=()=>{
    if(!prezzoOk) return;
    const stNomi=stArr().map(x=>{ const st=stampe.find(s=>s.id===x.stampa_id); return st? `${st.nome} ${x.colori} col.` : ""; }).filter(Boolean);
    const descr=`${capo.nome} · ${cNome} · ${righeT.map(t=>t.taglia+"×"+t.qta).join(", ")}`+(stNomi.length?` · stampa: ${stNomi.join(", ")}`:" · senza stampa");
    addCart({ tipo:"configurabile", prodotto_config_id:capo.modello_stampa_id, descrizione:descr,
      config:{abbigliamento:abbCfg(), stampe:stArr(), quantita:N, unita_calcolo:"pz"},
      quantita:N, prezzo_unitario:Number(prezzo.prezzo_unitario)||0, prezzo_totale:Number(prezzo.prezzo_totale)||0 });
    chiudi();
  };
  const passi=[[1,"Colore"],[2,"Taglie"],...(stampe.length?[[3,"Stampa"]]:[])];
  const ultimo=passi[passi.length-1][0];
  const puoAvanti = step===1? !!col : step===2? (N>0 && N>=minimo) : true;
  const d=prezzo&&prezzo.dettaglio;
  return (
    <div className="overlay">
      <div className="modal">
        <div className="mh"><h3>{capo.nome}</h3>
          {setIva && <div className="iva-toggle sm">
            <button className={iva==="escl"?"on":""} onClick={()=>setIva("escl")}>IVA escl.</button>
            <button className={iva==="incl"?"on":""} onClick={()=>setIva("incl")}>IVA incl.</button>
          </div>}
          <button className="x" onClick={chiudi}>×</button></div>
        <div className="wiz-steps">{passi.map(([n,l])=>
          <span key={n} className={"wiz-step"+(step===n?" on":"")+(step>n?" done":"")}>{n}. {l}</span>)}</div>
        <div className="mb">
          {step===1 && <>
            <label className="fld">Colore: <b>{cNome}</b></label>
            <div className="abb-swatches">{colori.map(c=>{ const im=(c.immagini||[])[0]; return (
              <button key={c.codice_colore} title={c.colore} className={"abb-sw"+(c.codice_colore===col?" on":"")}
                onClick={()=>{ if(c.codice_colore!==col){ setCol(c.codice_colore); setQta({}); invalida(); } }}>
                {im? <img src={im.anteprima} alt={c.colore} loading="lazy"/> : <span>{c.colore}</span>}</button>); })}</div>
          </>}
          {step===2 && <>
            <label className="fld">Quantità per taglia · {cNome}{minimo?` · minimo ${minimo} pz in totale`:""}</label>
            <div className="abb-taglie">{tCol.map(t=>(
              <div key={t.sku} className={"abb-tg"+((Number(qta[t.sku])||0)>0?" on":"")}>
                <div className="abb-tg-n">{t.taglia}</div>
                <input type="number" min="0" step="1" inputMode="numeric" value={qta[t.sku]??""} placeholder="0"
                  onChange={e=>{ const v=e.target.value; setQta(o=>({...o,[t.sku]:v})); invalida(); }}/>
                <div className="abb-tg-p">{eur(conIva(t.prezzo,iva))}</div>
              </div>))}</div>
            <div className="muted" style={{fontSize:12.5,marginTop:6}}>Totale <b>{N}</b> pz{minimo&&N<minimo?<> — ne servono almeno <b>{minimo}</b></>:""}. Sotto ogni taglia il prezzo del capo neutro: le taglie grandi costano un po' di più.</div>
          </>}
          {step===3 && stampe.length>0 && <div className="opts"><label className="fld">Dove stampare</label>
            {stampe.map(s=>{ const c=stSel[s.id]||0; return (
              <div key={s.id} className={"stampa-pos"+(c>0?" on":"")}>
                <label className="stampa-head"><input type="checkbox" checked={c>0}
                  onChange={e=>{ const on=e.target.checked; setStSel(o=>({...o,[s.id]:on?1:0})); invalida(); }}/>
                  <span className="stampa-nome">{s.nome}</span>
                  <TecBadge tecnica={s.tecnica}/></label>
                <div className="stampa-area">{(SAGOME[sagomaPerCapo(capo)] && SAGOME[sagomaPerCapo(capo)].pos[String(s.nome||"").toLowerCase().replace(/^ricamo\s+/,"").trim()])
                    ? <SagomaStampa sagoma={sagomaPerCapo(capo)} nome={s.nome} area={s.area_cm}/>
                    : <span className="area-rect">area</span>}
                  <span className="area-lbl">Area di stampa{s.area_cm?` · ${s.area_cm} cm`:""}</span></div>
                {c>0 && /digitale/i.test(s.tecnica||"") && <div className="stampa-col muted" style={{fontSize:12.5}}>🎨 Stampa a colori illimitati (anche foto e sfumature): il prezzo non dipende dai colori.</div>}
                {c>0 && !/digitale/i.test(s.tecnica||"") && <div className="stampa-col">N° colori <input type="number" min="1" max={s.max_colori||4} value={c} style={{width:56,padding:"4px 6px"}}
                  onChange={e=>{ const n=Math.max(1,Math.min(Number(e.target.value)||1, s.max_colori||4)); setStSel(o=>({...o,[s.id]:n})); invalida(); }}/> <span className="muted" style={{fontSize:12}}>{/ricamo/i.test(s.tecnica||"")?"(fino a 12 colori, il prezzo non cambia)":"(dal n° colori del tuo logo)"}</span></div>}
              </div>); })}
          </div>}
          {step===ultimo && <>
            {Number(capo.giorni_lavorazione)>0 && <div className="muted" style={{fontSize:13,marginTop:12}}>📦 Spedizione stimata: <b>{dataStimata(capo.giorni_lavorazione)}</b></div>}
            <div className="note" style={{marginTop:12}}>📎 Dopo l'ordine carichi il logo e ricevi la <b>bozza di stampa da approvare</b> prima della produzione.</div>
            {stato==="errore" && <div className="warn" style={{marginTop:14}}><b>Prezzo non disponibile.</b> {errMsg} — scrivici a <a href="mailto:info@komunigo.it">info@komunigo.it</a>.</div>}
            {prezzoOk && <div className="cart-tot" style={{marginTop:14}}>
              {d && <>
                <div className="r"><span>Capi ({N} pz · {(d.taglie||[]).map(t=>t.taglia+"×"+t.qta).join(", ")})</span><span>{eur(conIva(d.prodotto,iva))}</span></div>
                {(d.stampe||[]).map((x,i)=><div className="r" key={i}><span>Stampa {x.nome} · {x.colori} col.</span><span>{eur(conIva(x.prezzo,iva))}</span></div>)}
                {Number(d.impianto)>0 && <div className="r"><span>Impianto stampa (una tantum)</span><span>{eur(conIva(d.impianto,iva))}</span></div>}
              </>}
              {Number(prezzo.sconto_pct)>0 && <div className="r" style={{color:"var(--blu)",fontWeight:700}}><span>Sconto riservato B2B</span><span>−{prezzo.sconto_pct}%</span></div>}
              <div className="r"><span>Prezzo medio a capo</span><span>{eur(conIva(prezzo.prezzo_unitario,iva))}</span></div>
              <div className="r big"><span>Totale ({N} pz) <span className="iva-tag">{ivaLbl(iva)}</span></span><span>{eur(conIva(prezzo.prezzo_totale,iva))}</span></div></div>}
            {prezzo && !prezzoOk && <div className="warn" style={{marginTop:14}}><b>Prezzo su richiesta.</b> Contattaci a <a href="mailto:info@komunigo.it">info@komunigo.it</a>.</div>}
          </>}
        </div>
        <div className="mf">
          {step>1 && <button className="btn ghost" onClick={()=>setStep(s=>s-1)}>← Indietro</button>}
          {step<ultimo && <button className="btn" disabled={!puoAvanti} onClick={()=>setStep(s=>s+1)}>Avanti →</button>}
          {step===ultimo && (prezzoOk
            ? <button className="btn" onClick={aggiungi}>Aggiungi al carrello</button>
            : <button className="btn" onClick={calcola} disabled={stato==="calcolo"||N<=0||N<minimo}>{stato==="calcolo"?"Calcolo…":"Calcola prezzo"}</button>)}
          <button className="btn ghost" onClick={chiudi}>Annulla</button>
        </div>
      </div>
    </div>
  );
}
