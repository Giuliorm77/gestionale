// =====================================================================
//  SAGOME DI STAMPA: disegno vettoriale dell'oggetto + rettangolo della
//  posizione, proporzionato all'area reale (area_cm della posizione).
//  Coordinate in un viewBox 240×240; "ucm" = unità del disegno per 1 cm.
//  Nomi posizione normalizzati (minuscolo, senza "ricamo ").
// =====================================================================
const SAGOME={
  maglietta:{ ucm:2.4,
    viste:{
      fronte:"M88 30 Q120 50 152 30 L190 42 L228 88 L200 108 L182 92 L182 225 L58 225 L58 92 L40 108 L12 88 L50 42 Z",
      retro:"M88 30 Q120 38 152 30 L190 42 L228 88 L200 108 L182 92 L182 225 L58 225 L58 92 L40 108 L12 88 L50 42 Z" },
    pos:{
      "lato cuore":{v:"fronte",cx:146,cy:82},          // petto sinistro di chi indossa = a destra guardando
      "lato destro":{v:"fronte",cx:94,cy:82},
      "centro fronte":{v:"fronte",cx:120,top:62},
      "centro retro":{v:"retro",cx:120,top:50},
      "manica sinistra":{v:"fronte",cx:204,cy:80},
      "manica destra":{v:"fronte",cx:36,cy:80},
      "centro collo fronte":{v:"fronte",cx:120,top:47},
      "centro collo retro":{v:"retro",cx:120,top:38} } },
  zaino:{ ucm:4,
    viste:{
      fronte:"M70 48 Q70 34 84 34 L156 34 Q170 34 170 48 L176 214 Q176 226 164 226 L76 226 Q64 226 64 214 Z M100 34 Q100 14 120 14 Q140 14 140 34 M78 150 L162 150 L162 212 L78 212 Z",
      retro:"M70 48 Q70 34 84 34 L156 34 Q170 34 170 48 L176 214 Q176 226 164 226 L76 226 Q64 226 64 214 Z M100 34 Q100 14 120 14 Q140 14 140 34 M92 46 Q86 130 96 214 M148 46 Q154 130 144 214" },
    pos:{
      "fronte":{v:"fronte",cx:120,cy:100},
      "retro":{v:"retro",cx:120,cy:120},
      "alto fronte":{v:"fronte",cx:120,cy:62},
      "basso fronte":{v:"fronte",cx:120,cy:181} } },
};
const sagomaPerCapo=c=> /bag|backpack|zain|borsa|borse|sacca/i.test([c&&c.sottocategoria,c&&c.nome].join(" ")) ? "zaino" : "maglietta";
function areaCm(a){ const n=String(a||"").replace(/,/g,".").match(/[\d.]+/g); return n&&n.length>=2? [Number(n[0]),Number(n[1])] : null; }
// rettangolo (nel disegno 240×240) di una posizione di stampa, in scala con l'area reale
function rettPosizione(sagoma,nome,area){
  const S=SAGOME[sagoma]; if(!S) return null;
  const key=String(nome||"").toLowerCase().replace(/^ricamo\s+/,"").trim();
  const p=S.pos[key]; if(!p) return null;
  const a=areaCm(area)||[8,8];
  const w=Math.min(a[0]*S.ucm,200), h=Math.min(a[1]*S.ucm,180);
  return {v:p.v, x:p.cx-w/2, y:p.top!=null? p.top : p.cy-h/2, w, h};
}
function SagomaStampa({sagoma,nome,area}){
  const S=SAGOME[sagoma]; if(!S) return null;
  const r=rettPosizione(sagoma,nome,area); if(!r) return null;
  const p={v:r.v}, x=r.x, y=r.y, w=r.w, h=r.h;
  return (
    <svg className="sagoma" viewBox="0 0 240 240" role="img" aria-label={"Posizione di stampa: "+nome}>
      <path d={S.viste[p.v]} fill="#fff" stroke="currentColor" strokeWidth="3" strokeLinejoin="round" fillRule="evenodd"/>
      <rect x={x} y={y} width={w} height={h} rx="2" className="sagoma-area"/>
      <text x="120" y="238" textAnchor="middle" className="sagoma-vista">{p.v==="retro"?"retro":"fronte"}</text>
    </svg>);
}

// =====================================================================
//  MOCKUP 2D con il logo del cliente
//  Il logo (PNG/JPG/SVG) resta nella sessione: si carica una volta e si
//  vede su ogni prodotto. Opzione "togli lo sfondo bianco" (raster).
// =====================================================================
function useLogoCliente(){
  const [logo,setLogoS]=useState(()=>{ try{ return sessionStorage.getItem("kg_logo")||""; }catch(e){ return ""; } });
  const setLogo=v=>{ setLogoS(v||""); try{ if(v) sessionStorage.setItem("kg_logo",v); else sessionStorage.removeItem("kg_logo"); }catch(e){} };
  return [logo,setLogo];
}
function togliBianco(dataUrl){
  return new Promise(res=>{ const im=new Image(); im.onload=()=>{ try{
      const M=1400, k=Math.min(1,M/Math.max(im.width,im.height)); const c=document.createElement("canvas");
      c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); const x=c.getContext("2d"); x.drawImage(im,0,0,c.width,c.height);
      const d=x.getImageData(0,0,c.width,c.height), p=d.data;
      for(let i=0;i<p.length;i+=4){ const m=Math.min(p[i],p[i+1],p[i+2]); if(m>238) p[i+3]=0; else if(m>215) p[i+3]=Math.round(p[i+3]*(238-m)/23); }
      x.putImageData(d,0,0); res(c.toDataURL("image/png"));
    }catch(e){ res(dataUrl); } }; im.onerror=()=>res(dataUrl); im.src=dataUrl; });
}
function CaricaLogo({logo,setLogo,scala,setScala,compatto}){
  const [togli,setTogli]=useState(false);
  const [orig,setOrig]=useState("");
  const [err,setErr]=useState("");
  const leggi=async e=>{ const f=(e.target.files||[])[0]; e.target.value=""; if(!f) return; setErr("");
    if(!/^image\/(png|jpe?g|svg\+xml|webp|gif)$/.test(f.type)){ setErr("Per l'anteprima usa un'immagine PNG, JPG o SVG. Il file definitivo (anche PDF) lo carichi dopo l'ordine."); return; }
    if(f.size>8*1024*1024){ setErr("Immagine troppo grande per l'anteprima (max 8 MB)."); return; }
    const r=new FileReader(); r.onload=async()=>{ const u=String(r.result); setOrig(u); setLogo(togli&&!/svg/.test(f.type)? await togliBianco(u) : u); }; r.readAsDataURL(f); };
  const cambiaTogli=async v=>{ setTogli(v); const base=orig||logo; if(!base) return; setLogo(v? await togliBianco(base) : base); };
  return (
    <div className={"logo-up"+(compatto?" compatto":"")}>
      <label className="logo-btn"><Ico n="upload" s={16} style={{marginRight:6}}/>{logo?"Cambia logo":"Prova il tuo logo"}
        <input type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp" onChange={leggi} hidden/></label>
      {logo && <>
        <label className="logo-opt"><input type="checkbox" checked={togli} onChange={e=>cambiaTogli(e.target.checked)}/> Togli lo sfondo bianco</label>
        {setScala && <label className="logo-opt">Dimensione <input type="range" min="40" max="100" value={Math.round(scala*100)} onChange={e=>setScala(Number(e.target.value)/100)}/></label>}
        <button type="button" className="lnk" style={{fontSize:12.5}} onClick={()=>{ setLogo(""); setOrig(""); }}>Rimuovi</button>
      </>}
      {err && <div className="warn" style={{marginTop:6,fontSize:12.5}}>{err}</div>}
      {!logo && !compatto && <div className="muted" style={{fontSize:12,marginTop:4}}>Anteprima indicativa: il controllo vero lo fa il nostro grafico con la bozza.</div>}
    </div>);
}
// colore del capo (dal nome del colore) per la sagoma del mockup
function coloreCapo(nome){
  const n=String(nome||"").toLowerCase();
  const M=[[/bianc|white|naturale|ottico/,"#f7f7f4"],[/ner|black/,"#1d1d1f"],[/blu scuro|navy|notte|marine/,"#1f2b46"],[/royal/,"#2b4fb5"],[/azzurr|cielo|sky|light blue/,"#8cc2ea"],[/turchese|aqua/,"#2bb3b1"],[/blu|blue/,"#2f5fa7"],
    [/bordeaux|burgundy|vinaccia/,"#6b1d2c"],[/ross|red/,"#c33131"],[/arancio|orange/,"#ef7d22"],[/giall|yellow|lime/,"#f1c533"],[/verde militare|army|kaki|khaki|oliva|olive/,"#59603c"],
    [/verde|green/,"#2f8f5b"],[/antracite|anthracite|grigio scuro|charcoal|carbon/,"#3c3f45"],[/grig|grey|gray|melange/,"#a7aab0"],[/rosa|pink|fucsia/,"#ee9fbd"],[/viola|purple|lilla/,"#6c3d9a"],
    [/sabbia|beige|sand|crema|panna|naturale/,"#e3d6b9"],[/marrone|brown|cioccolato|caff/,"#6b4a30"]];
  for(const [re,c] of M) if(re.test(n)) return c;
  return "#f2f2f0";
}
const scuro=hex=>{ const v=parseInt(hex.slice(1),16); return ((v>>16)*0.299+((v>>8)&255)*0.587+(v&255)*0.114)<120; };
function MockupCapo({sagoma, posizioni, logo, scala, colore}){
  const S=SAGOME[sagoma]; if(!S) return null;
  const fill=coloreCapo(colore), bordo=scuro(fill)?"#0b0b0c":"#9aa3b0";
  const viste=Object.keys(S.viste);
  const rett=(posizioni||[]).map(p=>({...p, r:rettPosizione(sagoma,p.nome,p.area_cm)})).filter(p=>p.r);
  const k=Math.max(.3,Math.min(1,scala||.85));
  // disegno di una vista (riusato per la vista intera e per gli ingrandimenti)
  const disegno=(v,sw)=>(<>
    <path d={S.viste[v]} fill={fill} stroke={bordo} strokeWidth={sw} strokeLinejoin="round" fillRule="evenodd"/>
    {rett.filter(p=>p.r.v===v).map((p,i)=>{ const {x,y,w,h}=p.r; const lw=w*k, lh=h*k;
      return <g key={i}>
        <rect x={x} y={y} width={w} height={h} rx="1.5" fill="none" stroke={scuro(fill)?"rgba(255,255,255,.55)":"rgba(46,111,176,.55)"} strokeWidth={sw*0.45} strokeDasharray={(sw*1.3)+" "+sw}/>
        {logo ? <image href={logo} x={x+(w-lw)/2} y={y+(h-lh)/2} width={lw} height={lh} preserveAspectRatio="xMidYMid meet"/>
              : <text x={x+w/2} y={y+h/2+Math.min(w,h)/9} textAnchor="middle" className="mockup-ph" style={{fill:scuro(fill)?"#fff":"#2E6FB0",fontSize:Math.max(3,Math.min(w,h)/3.2)}}>LOGO</text>}
      </g>; })}
  </>);
  // posizioni piccole (cuore, lato destro, maniche, collo): lente d'ingrandimento
  const piccole=rett.filter(p=>p.r.w<70 || p.r.h<70);
  return (<>
    <div className="mockup">
      {viste.map(v=>(
        <figure key={v} className="mockup-v">
          <svg viewBox="0 0 240 240" role="img" aria-label={"Anteprima "+v}>{disegno(v,2.2)}</svg>
          <figcaption>{v}</figcaption>
        </figure>))}
    </div>
    {piccole.length>0 && <div className="mockup-zoom">
      {piccole.map((p,i)=>{ const {x,y,w,h,v}=p.r; const lato=Math.max(w,h)*1.55+6, cx=x+w/2, cy=y+h/2;
        return <figure key={i} className="mockup-z">
          <svg viewBox={`${cx-lato/2} ${cy-lato/2} ${lato} ${lato}`} role="img" aria-label={"Dettaglio "+p.nome}>{disegno(v,lato/110)}</svg>
          <figcaption><Ico n="search" s={12} style={{marginRight:4}}/>{p.nome.replace(/^Ricamo\s+/i,"")}</figcaption>
        </figure>; })}
    </div>}
  </>);
}

const lavaggioIt=t=>String(t||"").split(";").map(x=>x.trim()).filter(Boolean).map(x=>LAVAGGIO_IT[x.toLowerCase()]||x).join(" · ");

  useEffect(()=>{ (async()=>{
    const {data}=await sb.from("komunigo_abbigliamento_colori").select("*")
      .eq("fornitore",capo.fornitore).eq("codice_prodotto",capo.codice).order("ordine");
    setColori(data||[]); if((data||[]).length) setColSel(data[0].codice_colore);

  const vSel=(colori||[]).find(c=>c.codice_colore===colSel);
  const imgs=((vSel&&vSel.immagini&&vSel.immagini.length)? vSel.immagini : (capo.immagini||[])).filter(i=>i.anteprima);

      <div className="pdp">
        <div className="pdp-media">
          <div className="pdp-main">{fotoMain? <img src={fotoMain.anteprima} alt={capo.nome} style={{objectFit:"contain",background:"#fff"}}/> : <Ico n="shirt" s={90} sw={1} className="ph-ico"/>}</div>
          {imgs.length>1 && <div className="pdp-thumbs">{imgs.map((u,i)=>
            <button key={i} className={"pdp-thumb "+(i===imgSel?"on":"")} onClick={()=>setImgSel(i)}><img src={u.anteprima} alt="" loading="lazy" style={{objectFit:"contain",background:"#fff"}}/></button>)}</div>}
        </div>
        <div className="pdp-info">
          <span className="tag-conf">Personalizzabile</span>{capo.sottocategoria && <span className="cat-l" style={{marginLeft:6}}>{tradSub(capo.sottocategoria)}</span>}
          <h1 className="pdp-title">{capo.nome}</h1>
          <p className="pdp-sub">{[capo.brand,capo.linea,capo.genere].filter(Boolean).join(" · ")}</p>
          {capo.descrizione && <div className="pdp-desc">{capo.descrizione}</div>}
          {colori && colori.length>0 && <>
            <label className="fld" style={{marginTop:14}}>Colore: <b>{vSel?vSel.colore:""}</b></label>
            <div className="abb-swatches">{colori.map(c=>{ const im=(c.immagini||[])[0]; return (
              <button key={c.codice_colore} title={c.colore} className={"abb-sw"+(c.codice_colore===colSel?" on":"")}
                onClick={()=>{setColSel(c.codice_colore);setImgSel(0);}}>
                {im? <img src={im.anteprima} alt={c.colore} loading="lazy"/> : <span>{c.colore}</span>}</button>); })}</div>

          <div className="pdp-buy">

            <span className="muted" style={{fontSize:13}}>capo neutro · stampa a parte{capo.minimo?` · minimo ${capo.minimo} pz`:""}</span>

          </div>

          <div style={{marginTop:14}}><BarraFiducia compact/></div>
          {vaiGuida && <p className="muted" style={{fontSize:13,marginTop:12}}><Ico n="doc" s={16} className="ico-t"/>Come preparare il file? <button className="lnk" onClick={vaiGuida}>Leggi le linee guida di stampa →</button></p>}
        </div>

    </div>
  );
}

function ConfiguratoreAbbigliamento({capo, colori, colInit, chiudi, addCart, iva, setIva}){
  const [col,setCol]=useState(colInit||(colori[0]&&colori[0].codice_colore)||"");
  const [taglie,setTaglie]=useState([]);   // [{sku,taglia,prezzo,ordine,codice_colore}]
  const [qta,setQta]=useState({});         // {sku: n}
  const [stampe,setStampe]=useState([]);
  const [stSel,setStSel]=useState({});     // {stampa_id: n_colori}
  const [tecSel,setTecSel]=useState("");   // scheda tecnica (Serigrafia / Ricamo…): filtra solo la vista
  const [logo,setLogo]=useLogoCliente();
  const [scalaLogo,setScalaLogo]=useState(.85);
  const [prezzo,setPrezzo]=useState(null);
  const [stato,setStato]=useState(""); const [errMsg,setErrMsg]=useState("");
  const [step,setStep]=useState(1);
  useEffect(()=>{ (async()=>{
    const [t,s]=await Promise.all([
      sb.from("komunigo_abbigliamento_taglie").select("*").eq("fornitore",capo.fornitore).eq("codice_prodotto",capo.codice).order("ordine"),
      sb.from("komunigo_configuratori_stampe").select("*").eq("prodotto_id",capo.modello_stampa_id).order("ordine"),
    ]);
    setTaglie(t.data||[]); setStampe(s.data||[]);
  })(); },[capo.fornitore,capo.codice,capo.modello_stampa_id]);
  const invalida=()=>{ setPrezzo(null); setErrMsg(""); setStato(""); };
  const tCol=taglie.filter(t=>t.codice_colore===col);
  const righeT=tCol.map(t=>({sku:t.sku, taglia:t.taglia, qta:Math.max(0,Math.floor(Number(qta[t.sku])||0))})).filter(t=>t.qta>0);
  const N=righeT.reduce((s,t)=>s+t.qta,0);
  const minimo=Number(capo.minimo)||0;
  const stArr=()=>Object.keys(stSel).filter(id=>stSel[id]>0).map(id=>({stampa_id:id, colori:stSel[id]}));
  const cNome=(colori.find(c=>c.codice_colore===col)||{}).colore||col;
  const abbCfg=()=>({fornitore:capo.fornitore, codice:capo.codice, colore:col, colore_nome:cNome, taglie:righeT});
  const reqA=React.useRef(0);
  const calcola=async()=>{
    const mio=++reqA.current;
    setStato("calcolo"); setErrMsg("");
    try{
      const {data,error}=await sb.functions.invoke("hyper-endpoint",{body:{prodotto_id:capo.modello_stampa_id, abbigliamento:abbCfg(), stampe:stArr()}});
      if(mio!==reqA.current) return;
      if(error) throw error;
      if(!data || data.error) throw new Error((data&&data.error)||"Calcolo non riuscito");
      setPrezzo(data); setStato("");
    }catch(e){ setStato("errore"); setErrMsg(e.message||String(e)); }
  };
  // prezzo AUTOMATICO all'ultimo passo, ricalcolato a ogni modifica di colore/taglie/stampa
  useEffect(()=>{
    if(step!==ultimo || !(N>0) || N<minimo) return;
    const tm=setTimeout(()=>{ calcola(); },550);
    return ()=>clearTimeout(tm);
  },[step, col, JSON.stringify(qta), JSON.stringify(stSel)]);
  const prezzoOk=prezzo && Number(prezzo.prezzo_totale)>0 && !prezzo.sotto_costo;
  const aggiungi=()=>{
    if(!prezzoOk) return;
    const stNomi=stArr().map(x=>{ const st=stampe.find(s=>s.id===x.stampa_id); return st? `${st.nome} ${x.colori} col.` : ""; }).filter(Boolean);
    const descr=`${capo.nome} · ${cNome} · ${righeT.map(t=>t.taglia+"×"+t.qta).join(", ")}`+(stNomi.length?` · stampa: ${stNomi.join(", ")}`:" · senza stampa");
    addCart({ tipo:"configurabile", prodotto_config_id:capo.modello_stampa_id, descrizione:descr,
      config:{abbigliamento:abbCfg(), stampe:stArr(), quantita:N, unita_calcolo:"pz"},
      quantita:N, prezzo_unitario:Number(prezzo.prezzo_unitario)||0, prezzo_totale:Number(prezzo.prezzo_totale)||0 });
    chiudi();
  };
  const passi=[[1,"Colore"],[2,"Taglie"],...(stampe.length?[[3,"Stampa"]]:[])];
  const ultimo=passi[passi.length-1][0];
  const puoAvanti = step===1? !!col : step===2? (N>0 && N>=minimo) : true;
  const d=prezzo&&prezzo.dettaglio;
  return (
    <div className="overlay">
      <div className="modal modal-wide">
        <div className="mh"><h3>{capo.nome}</h3>
          {setIva && <div className="iva-toggle sm">
            <button className={iva==="escl"?"on":""} onClick={()=>setIva("escl")}>IVA escl.</button>
            <button className={iva==="incl"?"on":""} onClick={()=>setIva("incl")}>IVA incl.</button>
          </div>}
          <button className="x" onClick={chiudi}>×</button></div>
        <div className="wiz-steps">{passi.map(([n,l])=>
          <span key={n} className={"wiz-step"+(step===n?" on":"")+(step>n?" done":"")}>{n}. {l}</span>)}</div>
        <div className="mb">
          {step===1 && <>
            <label className="fld">Colore: <b>{cNome}</b></label>
            <div className="abb-swatches">{colori.map(c=>{ const im=(c.immagini||[])[0]; return (
              <button key={c.codice_colore} title={c.colore} className={"abb-sw"+(c.codice_colore===col?" on":"")}
                onClick={()=>{ if(c.codice_colore!==col){ setCol(c.codice_colore); setQta({}); invalida(); } }}>
                {im? <img src={im.anteprima} alt={c.colore} loading="lazy"/> : <span>{c.colore}</span>}</button>); })}</div>
          </>}
          {step===2 && <>
            <label className="fld">Quantità per taglia · {cNome}{minimo?` · minimo ${minimo} pz in totale`:""}</label>
            <div className="abb-taglie">{tCol.map(t=>(
              <div key={t.sku} className={"abb-tg"+((Number(qta[t.sku])||0)>0?" on":"")}>
                <div className="abb-tg-n">{t.taglia}</div>
                <input type="number" min="0" step="1" inputMode="numeric" value={qta[t.sku]??""} placeholder="0"
                  onChange={e=>{ const v=e.target.value; setQta(o=>({...o,[t.sku]:v})); invalida(); }}/>
                <div className="abb-tg-p">{eur(conIva(t.prezzo,iva))}</div>
              </div>))}</div>
            <div className="muted" style={{fontSize:12.5,marginTop:6}}>Totale <b>{N}</b> pz{minimo&&N<minimo?<> — ne servono almeno <b>{minimo}</b></>:""}. Sotto ogni taglia il prezzo del capo neutro: le taglie grandi costano un po' di più.</div>
          </>}
          {step===3 && stampe.length>0 && (()=>{ const tecs=[...new Set(stampe.map(x=>x.tecnica||"Stampa"))]; const tAtt=tecs.includes(tecSel)?tecSel:tecs[0]; const visibili=tecs.length>1? stampe.filter(x=>(x.tecnica||"Stampa")===tAtt) : stampe; return <div className="opts">
            <div className="mockup-box">
              <div className="mockup-h"><b>Anteprima con il tuo logo</b><CaricaLogo logo={logo} setLogo={setLogo} scala={scalaLogo} setScala={setScalaLogo}/></div>
              <MockupCapo sagoma={sagomaPerCapo(capo)} colore={cNome} logo={logo} scala={scalaLogo}
                posizioni={stampe.filter(x=>(stSel[x.id]||0)>0).map(x=>({nome:x.nome, area_cm:x.area_cm}))}/>
              {!stampe.some(x=>(stSel[x.id]||0)>0) && <div className="muted" style={{fontSize:12.5,textAlign:"center"}}>Scegli qui sotto dove stampare: il logo comparirà sul capo.</div>}
            </div>
            <label className="fld">Dove stampare</label>
            {tecs.length>1 && <div className="tec-tabs">{tecs.map(t=>{ const n=stampe.filter(x=>(x.tecnica||"Stampa")===t && (stSel[x.id]||0)>0).length; return <button type="button" key={t} className={t===tAtt?"on":""} onClick={()=>setTecSel(t)}>{t}{n>0?" · "+n+" ✓":""}</button>; })}</div>}
            {tecs.length>1 && <div className="muted" style={{fontSize:12,margin:"-2px 0 8px"}}>Puoi combinare tecniche diverse (es. ricamo sul cuore e serigrafia sul retro).</div>}
            {visibili.map(s=>{ const c=stSel[s.id]||0; return (
              <div key={s.id} className={"stampa-pos"+(c>0?" on":"")}>
                <label className="stampa-head"><input type="checkbox" checked={c>0}
                  onChange={e=>{ const on=e.target.checked; setStSel(o=>({...o,[s.id]:on?1:0})); invalida(); }}/>
                  <span className="stampa-nome">{s.nome}</span>
                  <TecBadge tecnica={s.tecnica}/></label>
                <div className="stampa-area">{(SAGOME[sagomaPerCapo(capo)] && SAGOME[sagomaPerCapo(capo)].pos[String(s.nome||"").toLowerCase().replace(/^ricamo\s+/,"").trim()])
                    ? <SagomaStampa sagoma={sagomaPerCapo(capo)} nome={s.nome} area={s.area_cm}/>
                    : <span className="area-rect">area</span>}
                  <span className="area-lbl">Area di stampa{s.area_cm?` · ${s.area_cm} cm`:""}</span></div>
                {c>0 && /digitale/i.test(s.tecnica||"") && <div className="stampa-col muted" style={{fontSize:12.5}}><Ico n="drop" s={15} className="ico-t"/>Stampa a colori illimitati (anche foto e sfumature): il prezzo non dipende dai colori.</div>}
                {c>0 && !/digitale/i.test(s.tecnica||"") && <div className="stampa-col">N° colori <input type="number" min="1" max={s.max_colori||4} value={c} style={{width:56,padding:"4px 6px"}}
                  onChange={e=>{ const n=Math.max(1,Math.min(Number(e.target.value)||1, s.max_colori||4)); setStSel(o=>({...o,[s.id]:n})); invalida(); }}/> <span className="muted" style={{fontSize:12}}>{/ricamo/i.test(s.tecnica||"")?"(fino a 12 colori, il prezzo non cambia)":"(dal n° colori del tuo logo)"}</span></div>}
              </div>); })}
          </div>; })()}
          {step===ultimo && <>
            {Number(capo.giorni_lavorazione)>0 && <div className="muted" style={{fontSize:13,marginTop:12}}><Consegna g={capo.giorni_lavorazione}/></div>}
            <div className="note" style={{marginTop:12}}><Ico n="clip" s={16} className="ico-t"/>Dopo l'ordine carichi il logo e ricevi la <b>bozza di stampa da approvare</b> prima della produzione.</div>
            {stato==="errore" && <div className="warn" style={{marginTop:14}}><b>Prezzo non disponibile.</b> {errMsg} — scrivici a <a href="mailto:info@komunigo.it">info@komunigo.it</a>.</div>}
            {prezzoOk && <BadgeVerifica/>}
            {prezzoOk && <div className="cart-tot" style={{marginTop:14}}>
              {d && <>
                <div className="r"><span>Capi ({N} pz · {(d.taglie||[]).map(t=>t.taglia+"×"+t.qta).join(", ")})</span><span>{eur(conIva(d.prodotto,iva))}</span></div>
                {(d.stampe||[]).map((x,i)=><div className="r" key={i}><span>Stampa {x.nome} · {x.colori} col.</span><span>{eur(conIva(x.prezzo,iva))}</span></div>)}
                {Number(d.impianto)>0 && <div className="r"><span>Impianto stampa (una tantum)</span><span>{eur(conIva(d.impianto,iva))}</span></div>}
              </>}
              {Number(prezzo.sconto_pct)>0 && <div className="r" style={{color:"var(--blu)",fontWeight:700}}><span>Sconto riservato B2B</span><span>−{prezzo.sconto_pct}%</span></div>}
              <div className="r"><span>Prezzo medio a capo</span><span>{eur(conIva(prezzo.prezzo_unitario,iva))}</span></div>
              <div className="r big"><span>Totale ({N} pz) <span className="iva-tag">{ivaLbl(iva)}</span></span><span>{eur(conIva(prezzo.prezzo_totale,iva))}</span></div></div>}
            {prezzo && !prezzoOk && <div className="warn" style={{marginTop:14}}><b>Prezzo su richiesta.</b> Contattaci a <a href="mailto:info@komunigo.it">info@komunigo.it</a>.</div>}
          </>}
        </div>
        <div className="mf">
          {step>1 && <button className="btn ghost" onClick={()=>setStep(s=>s-1)}>← Indietro</button>}
          {step<ultimo && <button className="btn" disabled={!puoAvanti} onClick={()=>setStep(s=>s+1)}>Avanti →</button>}
          {step===ultimo && (prezzoOk
            ? <button className="btn" onClick={aggiungi}>Aggiungi al carrello</button>
            : <button className="btn" onClick={calcola} disabled={stato==="calcolo"||N<=0||N<minimo}>{stato==="calcolo"?"Calcolo…":"Calcola prezzo"}</button>)}
          <button className="btn ghost" onClick={chiudi}>Annulla</button>
        </div>
      </div>
    </div>
  );
}

// =====================================================================
const FORMATI_STAMPA_SHOP=[{nome:"32×44"},{nome:"33×48,8"}];
function Configuratore({prod,chiudi,addCart,iva,setIva}){
  const gadget = prod.tipo==="gadget";
  const isStampa = prod.tipo==="stampa";
  const shopQta = (Array.isArray(prod.shop_quantita)? prod.shop_quantita.map(n=>Number(n)).filter(n=>n>0) : [])
    .filter(n=> !gadget || n>=(Number(prod.minimo)||0));   // sui gadget mai sotto il minimo ordinabile
  const misMin = Number(prod.shop_mis_min)||0, misMax = Number(prod.shop_mis_max)||0;   // cm (dal DB)
  const misMinMm = misMin*10, misMaxMm = misMax*10;                                     // mm (per l'utente)
  const [varianti,setVarianti]=useState([]);
  const [voci,setVoci]=useState([]);
  const [stampe,setStampe]=useState([]);
  const [stSel,setStSel]=useState({});   // {stampa_id: n_colori}
  const [variante,setVariante]=useState("");
  const [larg,setLarg]=useState(isStampa?85:1000), [alt,setAlt]=useState(isStampa?55:700), [qta,setQta]=useState(shopQta.length?shopQta[0]:(gadget?(Number(prod.minimo)||1):isStampa?100:1));
  const [opzioni,setOpzioni]=useState({});
  const [stMacchina,setStMacchina]=useState("piccolo"), [stFmt,setStFmt]=useState("auto"), [stColore,setStColore]=useState(true), [stFr,setStFr]=useState(false);
  const [prezzo,setPrezzo]=useState(null);
  const [stato,setStato]=useState("");
  const [tiers,setTiers]=useState(null);   // scaglioni calcolati [{qta,res,unit,tot,risparmio}]

  useEffect(()=>{ (async()=>{
    const [v,c,s]=await Promise.all([
      sb.from("komunigo_configuratori_varianti").select("*").eq("prodotto_id",prod.id).order("ordine"),
      sb.from("komunigo_configuratori_voci").select("*").eq("prodotto_id",prod.id).order("ordine"),
      gadget? sb.from("komunigo_configuratori_stampe").select("*").eq("prodotto_id",prod.id).order("ordine") : Promise.resolve({data:[]}),
    ]);
    setVarianti(v.data||[]); setVoci((c.data||[]).filter(x=>x.opzionale)); setStampe(s.data||[]);
    if((v.data||[]).length) setVariante(v.data[0].id);
  })(); },[prod.id]);

  const stArr = ()=>Object.keys(stSel).filter(id=>stSel[id]>0).map(id=>({stampa_id:id, colori:stSel[id]}));

  const bodyFor=(q)=> gadget
    ? { prodotto_id:prod.id, variante_id:variante, quantita:Number(q), stampe:stArr() }
    : { prodotto_id:prod.id, variante_id:variante, larghezza_cm:Number(larg)/10, altezza_cm:Number(alt)/10, quantita:Number(q), opzioni:Object.keys(opzioni).filter(k=>opzioni[k]),
        ...(isStampa?{st_macchina:stMacchina, st_fmt:stFmt, st_colore:stColore, st_fr:stFr}:{}) };

  const reqC=React.useRef(0);
  const calcola=async()=>{
    const mio=++reqC.current;
    setStato("calcolo");
    try{
      if(shopQta.length){
        // calcola il prezzo per ogni scaglione e mostra la tabella (più ne ordini, meno costa)
        const res=await Promise.all(shopQta.map(q=>sb.functions.invoke("hyper-endpoint",{body:bodyFor(q)}).then(r=>({q,data:r.data,error:r.error})).catch(e=>({q,error:e}))));
        if(mio!==reqC.current) return;
        const rows=res.filter(x=>!x.error && x.data && Number(x.data.prezzo_totale)>0 && !x.data.sotto_costo)
          .map(x=>({qta:x.q, res:x.data, unit:Number(x.data.prezzo_unitario)||0, tot:Number(x.data.prezzo_totale)||0}));
        if(!rows.length){ setStato("errore"); return; }
        const unitBase=Math.max(...rows.map(r=>r.unit));
        rows.forEach(r=>r.risparmio = unitBase>0? Math.round((1-r.unit/unitBase)*100):0);
        setTiers(rows);
        const sel=rows.find(r=>r.qta===Number(qta))||rows[0];
        setQta(sel.qta); setPrezzo(sel.res); setStato("");
      }else{
        const {data,error}=await sb.functions.invoke("hyper-endpoint",{body:bodyFor(qta)});
        if(mio!==reqC.current) return;
        if(error) throw error;
        setPrezzo(data); setStato("");
      }
    }catch(e){ setStato("errore"); }
  };
  const selTier=(t)=>{ setQta(t.qta); setPrezzo(t.res); };
  const invalida=()=>{ setPrezzo(null); setTiers(null); };
  // wizard a step (solo gadget): 1 Colore · 2 Stampa · 3 Quantità
  const [step,setStep]=useState(1);
  const hasStampe = gadget && stampe.length>0;
  const nextStep=()=>setStep(s=> s===1? (hasStampe?2:3) : 3);
  // prezzo AUTOMATICO: ricalcola poco dopo ogni modifica (per i gadget all'ultimo passo)
  useEffect(()=>{
    if(gadget && step!==3) return;
    if(!gadget && !(Number(larg)>0 && Number(alt)>0)) return;
    if(!shopQta.length && !(Number(qta)>0)) return;
    const tm=setTimeout(()=>{ calcola(); },550);
    return ()=>clearTimeout(tm);
  },[step, variante, larg, alt, shopQta.length?0:qta, JSON.stringify(opzioni), JSON.stringify(stSel), stMacchina, stFmt, stColore, stFr]);
  const prevStep=()=>setStep(s=> s===3? (hasStampe?2:1) : 1);

  const prezzoOk = prezzo && Number(prezzo.prezzo_totale) > 0 && !prezzo.sotto_costo
    && !(isStampa && prezzo.impaginazione && !prezzo.impaginazione.valido);

  const aggiungi=()=>{
    if(!prezzoOk) return;
    const va=varianti.find(x=>x.id===variante);
    const config = gadget
      ? {variante_id:variante, quantita:Number(qta), stampe:stArr()}
      : {variante_id:variante, larghezza_cm:Number(larg)/10, altezza_cm:Number(alt)/10, opzioni:Object.keys(opzioni).filter(k=>opzioni[k]),
         ...(isStampa?{st_macchina:stMacchina, st_fmt:stFmt, st_colore:stColore, st_fr:stFr}:{})};
    const descr = gadget
      ? prod.nome+(va?" · "+va.nome:"")+` · ${qta} pz`
      : isStampa
        ? prod.nome+(va?" · "+va.nome:"")+` · ${larg}×${alt}mm · ${qta} pz`
        : prod.nome+(va?" · "+va.nome:"")+` · ${larg}×${alt}mm`;
    addCart({ tipo:"configurabile", prodotto_config_id:prod.id, descrizione:descr, config,
      quantita:Number(qta), prezzo_unitario:Number(prezzo.prezzo_unitario)||0, prezzo_totale:Number(prezzo.prezzo_totale)||0});
    chiudi();
  };

  return (
    <div className="overlay">
      <div className="modal">
        <div className="mh"><h3>{prod.nome}</h3>
          {setIva && <div className="iva-toggle sm">
            <button className={iva==="escl"?"on":""} onClick={()=>setIva("escl")}>IVA escl.</button>
            <button className={iva==="incl"?"on":""} onClick={()=>setIva("incl")}>IVA incl.</button>
          </div>}
          <button className="x" onClick={chiudi}>×</button></div>
        {gadget && <div className="wiz-steps">
          {[[1,"Colore"],...(hasStampe?[[2,"Stampa"]]:[]),[3,"Quantità"]].map(([n,l])=>
            <span key={n} className={"wiz-step"+(step===n?" on":"")+(step>n?" done":"")}>{n}. {l}</span>)}
        </div>}
        <div className="mb">
          {varianti.length>0 && (!gadget||step===1) && <>
            <label className="fld">{gadget?"Colore":isStampa?"Carta":"Materiale / variante"}</label>
            <select value={variante} onChange={e=>{setVariante(e.target.value);invalida();}}>
              {varianti.map(v=><option key={v.id} value={v.id}>{v.nome}{(!gadget&&!isStampa&&v.spessore)?` (${v.spessore}mm)`:""}</option>)}
            </select></>}
          {!gadget && <><div className="two">
            <div><label className="fld">{isStampa?"Larghezza pezzo (mm)":"Larghezza (mm)"}</label>
              <input type="number" step="1" value={larg} min={misMinMm||1} max={misMaxMm||undefined} onChange={e=>{setLarg(e.target.value);setPrezzo(null);}}/></div>
            <div><label className="fld">{isStampa?"Altezza pezzo (mm)":"Altezza (mm)"}</label>
              <input type="number" step="1" value={alt} min={misMinMm||1} max={misMaxMm||undefined} onChange={e=>{setAlt(e.target.value);setPrezzo(null);}}/></div>
          </div>
          {(misMin>0||misMax>0) && <div className="muted" style={{fontSize:12}}>Misura {misMinMm>0?`da ${misMinMm}`:""}{misMaxMm>0?` fino a ${misMaxMm}`:""} mm per lato.</div>}</>}
          {(!gadget||step===3) && <><label className="fld">Quantità{gadget&&prod.minimo?` · minimo ${prod.minimo}`:""}</label>
          {shopQta.length
            ? (()=>{ const showP=!!(tiers&&prezzo); const tmap={}; (tiers||[]).forEach(t=>tmap[t.qta]=t); return (
                <div className="scaglioni">
                  {shopQta.map(q=>{ const t=tmap[q]; const on=Number(qta)===q; return (
                    <button type="button" key={q} className={"tier"+(on?" on":"")}
                      onClick={()=>{ if(showP&&t){ selTier(t); } else { setQta(q); } }}>
                      <span className="tq">{q} pz</span>
                      {showP&&t
                        ? <><span className="tu">{eur(conIva(t.unit,iva))}/pz</span><span className="tt">{eur(conIva(t.tot,iva))}</span>{t.risparmio>0 && <span className="tr">−{t.risparmio}%</span>}</>
                        : <span className="tu muted">da calcolare</span>}
                    </button>); })}
                  <div className="muted" style={{fontSize:12,marginTop:4}}>Più pezzi ordini, meno costano. {showP?"Tocca la quantità che preferisci.":"Premi “Calcola prezzi”."}</div>
                </div>); })()
            : <input type="number" value={qta} min={gadget?(prod.minimo||1):1} onChange={e=>{setQta(e.target.value);invalida();}}/>}</>}
          {isStampa && <div className="opts" style={{marginTop:12}}>
            <label className="fld">Stampa</label>
            <div className="two">
              <div><label className="fld" style={{fontWeight:400}}>Colori</label>
                <select value={stColore?"col":"bn"} onChange={e=>{setStColore(e.target.value==="col");setPrezzo(null);}}>
                  <option value="col">A colori</option><option value="bn">Bianco e nero</option>
                </select></div>
            </div>
            <label style={{display:"flex",gap:8,alignItems:"center",marginTop:8}}>
              <input type="checkbox" checked={stFr} onChange={e=>{setStFr(e.target.checked);setPrezzo(null);}}/> Fronte/retro</label>
          </div>}
          {gadget && step===2 && stampe.length>0 && <div className="opts"><label className="fld">Dove stampare</label>
            {stampe.map(s=>{ const col=stSel[s.id]||0; return (
              <div key={s.id} className={"stampa-pos"+(col>0?" on":"")}>
                <label className="stampa-head"><input type="checkbox" checked={col>0}
                  onChange={e=>{ setStSel(o=>({...o,[s.id]:e.target.checked?1:0})); setPrezzo(null); }}/>
                  <span className="stampa-nome">{s.nome}</span>
                  <TecBadge tecnica={s.tecnica}/></label>
                <div className="stampa-area">
                  <span className="area-rect">area</span>
                  <span className="area-lbl">Area di stampa{s.area_cm?` · ${s.area_cm} cm`:""}</span>
                </div>
                {col>0 && /digitale/i.test(s.tecnica||"") && <div className="stampa-col muted" style={{fontSize:12.5}}><Ico n="drop" s={15} className="ico-t"/>Stampa a colori illimitati (anche foto e sfumature): il prezzo non dipende dai colori.</div>}
                {col>0 && !/digitale/i.test(s.tecnica||"") && <div className="stampa-col">N° colori <input type="number" min="1" max={s.max_colori||4} value={col} style={{width:56,padding:"4px 6px"}}
                  onChange={e=>{ const n=Math.max(1,Math.min(Number(e.target.value)||1, s.max_colori||4)); setStSel(o=>({...o,[s.id]:n})); setPrezzo(null); }}/> <span className="muted" style={{fontSize:12}}>(dal n° colori del tuo logo)</span></div>}
              </div>); })}
          </div>}
          {!gadget && voci.length>0 && <div className="opts"><label className="fld">Opzioni</label>
            {voci.map(v=>(<label key={v.id}><input type="checkbox" checked={!!opzioni[v.id]}
              onChange={e=>{setOpzioni(o=>({...o,[v.id]:e.target.checked}));setPrezzo(null);}}/>{v.descrizione}</label>))}
          </div>}
          {(!gadget||step===3) && Number(prod.giorni_lavorazione)>0 && <div className="muted" style={{fontSize:13,marginTop:12}}><Consegna g={prod.giorni_lavorazione}/></div>}
          {(!gadget||step===3) && <div className="note" style={{marginTop:12}}><Ico n="clip" s={16} className="ico-t"/>Dopo l'ordine carichi il file grafico e ricevi la <b>bozza di stampa da approvare</b> prima della produzione.</div>}
          {stato==="errore" && <div className="warn" style={{marginTop:14}}>
            <b>Motore prezzi non ancora collegato.</b> Serve la Edge Function <code>prezzo-configuratore</code>. Fino ad allora il preventivo si fa dal gestionale.</div>}
          {(!gadget||step===3) && prezzoOk && <BadgeVerifica/>}
          {(!gadget||step===3) && prezzoOk && <div className="cart-tot" style={{marginTop:14}}>
            {Number(prezzo.sconto_pct)>0 && <>
              <div className="r"><span>Prezzo di listino</span><span className="listino-old" style={{marginLeft:0}}>{eur(conIva(prezzo.prezzo_listino_totale,iva))}</span></div>
              <div className="r" style={{color:"var(--blu)",fontWeight:700}}><span>Sconto riservato B2B</span><span>−{prezzo.sconto_pct}%</span></div>
            </>}
            <div className="r"><span>Prezzo unitario</span><span>{eur(conIva(prezzo.prezzo_unitario,iva))}</span></div>
            <div className="r big"><span>Totale ({qta} pz) <span className="iva-tag">{ivaLbl(iva)}</span></span><span>{eur(conIva(prezzo.prezzo_totale,iva))}</span></div></div>}
          {(!gadget||step===3) && prezzo && !prezzoOk && <div className="warn" style={{marginTop:14}}>
            <b>Prezzo su richiesta.</b> Per questa configurazione contattaci a <a href="mailto:info@komunigo.it">info@komunigo.it</a> e ti facciamo un preventivo su misura.</div>}
        </div>
        <div className="mf">
          {gadget ? <>
            {step>1 && <button className="btn ghost" onClick={prevStep}>← Indietro</button>}
            {step<3 && <button className="btn" onClick={nextStep}>Avanti →</button>}
            {step===3 && (prezzoOk
              ? <button className="btn" onClick={aggiungi}>Aggiungi al carrello</button>
              : <button className="btn" onClick={calcola} disabled={stato==="calcolo"}>{stato==="calcolo"?"Calcolo…":"Calcola prezzi"}</button>)}
          </> : <>
            {prezzoOk
              ? <button className="btn" onClick={aggiungi}>Aggiungi al carrello</button>
              : <button className="btn" onClick={calcola} disabled={stato==="calcolo"}>{stato==="calcolo"?"Calcolo…":(shopQta.length?"Calcola prezzi":"Calcola prezzo")}</button>}
          </>}
          <button className="btn ghost" onClick={chiudi}>Annulla</button>
        </div>
      </div>
    </div>
  );
}

// =====================================================================
//  CARRELLO
// =====================================================================
function Carrello({cart,delCart,vaiCatalogo,onOrdineCreato,account,profilo}){
  const [invio,setInvio]=useState("");
  const [err,setErr]=useState("");
  const [spedOpts,setSpedOpts]=useState(null);
  const [spedSel,setSpedSel]=useState("");
  const [pagOpts,setPagOpts]=useState(null);
  const [pagSel,setPagSel]=useState("");
  const [espos,setEspos]=useState(0);   // esposizione differita già in corso del cliente
  const [cli,setCli]=useState(()=>{
    const a=account;
    const addr = a ? (a.consegna_uguale===false
      ? [a.consegna_indirizzo,a.consegna_cap,a.consegna_citta,a.consegna_provincia].filter(Boolean).join(", ")
      : [a.indirizzo,a.cap,a.citta,a.provincia].filter(Boolean).join(", ")) : "";
    return {nome:(a&&(a.ragione_sociale||a.nome||a.azienda))||"", email:(a&&a.email)||"", tel:(a&&a.telefono)||"", indirizzo:addr};
  });
  useEffect(()=>{ (async()=>{
    try{
      const [s,p]=await Promise.all([
        sb.from("komunigo_spedizioni_pub").select("*").order("ordine"),
        sb.from("komunigo_pagamenti_pub").select("*").order("ordine"),
      ]);
      const so=s.data||[]; setSpedOpts(so); if(so.length) setSpedSel(so[0].id);
      const po=p.data||[]; setPagOpts(po); if(po.length) setPagSel(po[0].metodo);
    }catch(e){ setSpedOpts([]); setPagOpts([]); }
  })(); },[]);
  // esposizione differita già in corso (ordini a conto aperto non ancora saldati)
  useEffect(()=>{ (async()=>{
    if(!(account && account.pagamento_differito)){ setEspos(0); return; }
    try{ const {data}=await sb.from("komunigo_ordini").select("totale,pagamento_metodo,pagamento_stato").eq("account_id",account.id);
      setEspos((data||[]).filter(o=>o.pagamento_metodo==="differito" && !["pagato","annullato"].includes(o.pagamento_stato)).reduce((s,o)=>s+(Number(o.totale)||0),0));
    }catch(e){ setEspos(0); }
  })(); },[account]);

  const imponibileMerce=cart.reduce((s,r)=>s+(Number(r.prezzo_totale)||0),0);
  const sped=(spedOpts||[]).find(o=>o.id===spedSel)||null;
  const spedCosto=sped? (Number(sped.prezzo)||0) : 0;
  const imponibile=imponibileMerce+spedCosto;
  const iva=imponibile*IVA;
  const totale=imponibile+iva;
  const setC=(k,v)=>setCli(p=>({...p,[k]:v}));
  const emailOk=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(cli.email.trim());
  const serveIndirizzo = sped && !sped.ritiro;
  // il "pagamento al ritiro" si offre solo se la consegna è il ritiro in sede
  const pagDisponibili=(pagOpts||[]).filter(p=> p.metodo!=="ritiro" || (sped&&sped.ritiro));
  // conto aperto (pagamento differito): solo per clienti B2B con differito attivo
  const dif = !!(account && account.pagamento_differito);
  const fido = Number(account && account.fido_massimo)||0;
  const ggPag = (account && account.giorni_pagamento)||30;
  const metodoDifferito = dif ? {metodo:"differito", nome:`Conto aperto — pagamento a ${ggPag} giorni`, descrizione:"Paghi a fattura, senza anticipo"} : null;
  const metodiMostrati = [...pagDisponibili, ...(metodoDifferito?[metodoDifferito]:[])];
  const sforaFido = pagSel==="differito" && fido>0 && (espos+totale)>fido;
  const pagOk = pagSel && metodiMostrati.some(p=>p.metodo===pagSel);
  const puoConfermare = cli.nome.trim() && emailOk && (!serveIndirizzo || cli.indirizzo.trim()) && pagOk;

  const conferma=async()=>{
    setInvio("attesa"); setErr("");
    try{
      const {data,error}=await sb.functions.invoke("komunigo-ordine",{body:{
        action:"crea",
        cliente:{nome:cli.nome.trim(), email:cli.email.trim(), tel:cli.tel.trim()},
        spedizione_id: sped? sped.id : null,
        indirizzo: serveIndirizzo? cli.indirizzo.trim() : null,
        pagamento_metodo: pagSel,
        righe: cart.map(r=>({ tipo:r.tipo, articolo_id:r.articolo_id, prodotto_config_id:r.prodotto_config_id,
          descrizione:r.descrizione, config:{...(r.config||{}), quantita:r.quantita}, quantita:r.quantita })),
      }});
      if(error) throw error;
      if(data && data.error) throw new Error(data.error);
      if(data && data.token){ onOrdineCreato(data.token); return; }
      throw new Error("Risposta inattesa dal server");
    }catch(e){ setInvio(""); setErr(e.message||String(e)); }
  };

  if(cart.length===0) return (
    <div className="empty"><p style={{fontSize:18,fontWeight:700}}>Il carrello è vuoto</p>
      <button className="btn" onClick={vaiCatalogo}>Vai al catalogo</button></div>
  );

  return (
    <div>
      <h2 className="sec">Il tuo carrello</h2>
      <div style={{marginTop:14}}>
        {cart.map(r=>(
          <div className="cart-line" key={r.rid}>
            <div className="g"><h4>{r.descrizione}</h4>
              <p>{r.quantita} × {eur(r.prezzo_unitario)}{r.tipo==="configurabile"?(r.config&&r.config.abbigliamento?" · personalizzato":" · su misura"):""}</p></div>
            <div className="price">{eur(r.prezzo_totale)}</div>
            <button className="x" title="Rimuovi" onClick={()=>delCart(r.rid)}>×</button>
          </div>
        ))}
      </div>

      <div className="ship">
        <h3 className="ship-h">Consegna</h3>
        {spedOpts===null? <p className="muted">Carico le opzioni di consegna…</p>
         : spedOpts.length===0? <p className="muted">Nessuna opzione di consegna configurata. (Nel gestionale: Impostazioni → Spedizioni Komunigo.)</p>
         : spedOpts.map(o=>{ const gratis=o.ritiro||Number(o.prezzo)===0; return (
            <label className={"ship-opt "+(o.id===spedSel?"on":"")} key={o.id}>
              <input type="radio" name="sped" checked={o.id===spedSel} onChange={()=>setSpedSel(o.id)}/>
              <span className="ship-txt"><b>{o.nome}</b>{o.descrizione?<span className="muted"> — {o.descrizione}</span>:null}</span>
              <span className="ship-price">{gratis?"Gratis":eur(o.prezzo)}</span>
            </label>); })}
      </div>

      <div className="ship" style={{marginTop:16}}>
        <h3 className="ship-h">Pagamento</h3>
        {pagOpts===null? <p className="muted">Carico i metodi di pagamento…</p>
         : metodiMostrati.length===0? <p className="muted">Nessun metodo di pagamento attivo. (Nel gestionale: Impostazioni → Metodi di pagamento.)</p>
         : metodiMostrati.map(p=>(
            <label className={"ship-opt "+(p.metodo===pagSel?"on":"")+(p.metodo==="differito"?" ship-b2b":"")} key={p.metodo}>
              <input type="radio" name="pag" checked={p.metodo===pagSel} onChange={()=>setPagSel(p.metodo)}/>
              <span className="ship-txt"><b>{p.nome}</b>{p.metodo==="differito"?<span className="b2b-badge" style={{marginLeft:8}}>B2B</span>:null}{p.descrizione?<span className="muted"> — {p.descrizione}</span>:null}</span>
            </label>))}
        {sforaFido && <div className="warn" style={{marginTop:10}}><Ico n="alert" s={16} className="ico-t"/>Con questo ordine superi il <b>fido concordato</b> ({eur(espos+totale)} su {eur(fido)}). Puoi comunque procedere: ti contatteremo per l'importo eccedente.</div>}
      </div>

      {profilo && profilo.b2b && <div className="b2b-note" style={{marginTop:12}}><Ico n="tag" s={16} className="ico-t"/><b>Prezzi riservati B2B applicati.</b> Gli importi vengono ricalcolati con il tuo sconto alla conferma dell'ordine.</div>}
      <div className="cart-tot" style={{marginTop:16}}>
        <div className="r"><span>Imponibile merce</span><span>{eur(imponibileMerce)}</span></div>
        {sped && <div className="r"><span>Trasporto — {sped.nome}</span><span>{spedCosto===0?"Gratis":eur(spedCosto)}</span></div>}
        <div className="r"><span>IVA 22%</span><span>{eur(iva)}</span></div>
        <div className="r big"><span>Totale</span><span>{eur(totale)}</span></div>
      </div>

      <div className="ship" style={{marginTop:16}}>
        <h3 className="ship-h">I tuoi dati</h3>
        <div className="co-grid">
          <label className="co-f"><span>Nome e cognome / azienda *</span>
            <input value={cli.nome} onChange={e=>setC("nome",e.target.value)} placeholder="Es. Mario Rossi"/></label>
          <label className="co-f"><span>Email *</span>
            <input type="email" value={cli.email} onChange={e=>setC("email",e.target.value)} placeholder="nome@email.it"/></label>
          <label className="co-f"><span>Telefono</span>
            <input value={cli.tel} onChange={e=>setC("tel",e.target.value)} placeholder="(facoltativo)"/></label>
          {serveIndirizzo && <label className="co-f co-full"><span>Indirizzo di spedizione *</span>
            <input value={cli.indirizzo} onChange={e=>setC("indirizzo",e.target.value)} placeholder="Via, numero, CAP, città"/></label>}
        </div>
        {err && <div className="warn" style={{marginTop:12}}><b>Ordine non inviato.</b> {err}</div>}
        <button className="btn" style={{width:"100%",marginTop:14}} onClick={conferma}
          disabled={invio==="attesa"||!puoConfermare}>
          {invio==="attesa"?"Invio ordine…":"Conferma ordine"}</button>
        {!puoConfermare && <div className="muted" style={{fontSize:12,marginTop:8}}>Compila nome ed email{serveIndirizzo?", l'indirizzo di spedizione":""} e scegli il metodo di pagamento per continuare.</div>}
      </div>

      <div className="note">Dopo la conferma vedrai le <b>istruzioni di pagamento</b> e potrai <b>caricare i file grafici</b> per ogni prodotto dalla pagina "I miei ordini".</div>
    </div>
  );
}

// =====================================================================
//  I MIEI ORDINI — dettaglio + upload file grafici (dopo l'ordine)
// =====================================================================
function OrdinePagina({token, vaiCatalogo}){
  const [dati,setDati]=useState(null);   // null = carico
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState("");     // id riga in upload
  const [pagList,setPagList]=useState([]);
  const [bozBusy,setBozBusy]=useState("");
  const [bozNote,setBozNote]=useState("");
  const [modApri,setModApri]=useState(false);
  useEffect(()=>{ (async()=>{ try{ const {data}=await sb.from("komunigo_pagamenti_pub").select("*"); setPagList(data||[]); }catch(e){} })(); },[]);

  const carica=async()=>{
    setErr("");
    try{
      const {data,error}=await sb.functions.invoke("komunigo-ordine",{body:{action:"dettaglio", token}});
      if(error) throw error;
      if(data && data.error) throw new Error(data.error);
      setDati(data);
    }catch(e){ setErr(e.message||String(e)); setDati({}); }
  };
  useEffect(()=>{ if(token) carica(); },[token]);

  async function carica_file(riga, file){
    if(!file) return;
    setBusy(riga?riga.id:"gen"); setErr("");
    try{
      const {data:u,error:e1}=await sb.functions.invoke("komunigo-ordine",{body:{action:"file-url", token, riga_id:riga?riga.id:null, nome_file:file.name}});
      if(e1) throw e1; if(u&&u.error) throw new Error(u.error);
      const {error:e2}=await sb.storage.from(u.bucket).uploadToSignedUrl(u.path, u.token, file);
      if(e2) throw e2;
      const {data:r,error:e3}=await sb.functions.invoke("komunigo-ordine",{body:{action:"file-registra", token, riga_id:riga?riga.id:null, path:u.path, nome_file:file.name, dimensione:file.size, mime:file.type}});
      if(e3) throw e3; if(r&&r.error) throw new Error(r.error);
      await carica();
    }catch(e){ setErr("Caricamento non riuscito: "+(e.message||e)); }
    setBusy("");
  }
  async function elimina_file(f){
    if(!window.confirm("Rimuovere il file \""+f.nome_file+"\"?")) return;
    try{ const {data,error}=await sb.functions.invoke("komunigo-ordine",{body:{action:"file-elimina", token, file_id:f.id}});
      if(error) throw error; if(data&&data.error) throw new Error(data.error); await carica();
    }catch(e){ setErr(e.message||String(e)); }
  }
  async function approvaBozza(){
    setBozBusy("ok"); setErr("");
    try{ const {data,error}=await sb.functions.invoke("komunigo-ordine",{body:{action:"bozza-approva", token}});
      if(error) throw error; if(data&&data.error) throw new Error(data.error); await carica();
    }catch(e){ setErr(e.message||String(e)); }
    setBozBusy("");
  }
  async function chiediModifiche(){
    if(!bozNote.trim()){ setErr("Scrivi cosa vuoi modificare."); return; }
    setBozBusy("mod"); setErr("");
    try{ const {data,error}=await sb.functions.invoke("komunigo-ordine",{body:{action:"bozza-modifica", token, note:bozNote.trim()}});
      if(error) throw error; if(data&&data.error) throw new Error(data.error); setModApri(false); setBozNote(""); await carica();
    }catch(e){ setErr(e.message||String(e)); }
    setBozBusy("");
  }

  if(!token) return <div className="empty"><p>Nessun ordine da mostrare.</p><button className="btn" onClick={vaiCatalogo}>Vai al catalogo</button></div>;
  if(dati===null) return <div className="empty">Carico l'ordine…</div>;
  if(!dati.ordine) return <div className="warn"><b>Ordine non trovato.</b> {err||"Il link potrebbe non essere valido."}</div>;

  const o=dati.ordine;
  const fileDiRiga = rid => (dati.file||[]).filter(f=>f.ordine_riga_id===rid && f.tipo!=="bozza");
  const bozzaFiles = (dati.file||[]).filter(f=>f.tipo==="bozza");
  const kb = n => n? (n>1048576? (n/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(n/1024))+" KB") : "";
  const pag = (pagList||[]).find(p=>p.metodo===o.pagamento_metodo) || null;
  const pagato = o.pagamento_stato==="pagato";

  return (
    <div>
      <h2 className="sec">Ordine {o.numero}</h2>
      <p className="sec-sub">Grazie{o.cliente_nome?(", "+o.cliente_nome):""}! Carica qui sotto i file grafici per ogni prodotto. Puoi tornare a questa pagina in qualsiasi momento da <b>“I miei ordini”</b>.</p>
      {err && <div className="warn" style={{marginBottom:12}}>{err}</div>}

      {o.pagamento_metodo && <div className="warn" style={{marginBottom:16, background:pagato?"var(--blu-wash)":"var(--sand-wash)", border:"1px solid "+(pagato?"var(--blu)":"var(--sand)")}}>
        {o.pagamento_metodo==="differito"
         ? <><b>Pagamento — Conto aperto:</b> {pagato? "saldato, grazie!" : `a ${o.pagamento_giorni||30} giorni dalla fattura.`}
             {!pagato && <div style={{marginTop:6,fontSize:13.5}}>Importo: <b>{eur(o.totale)}</b> · nessun anticipo richiesto, riceverai fattura. L'ordine è già preso in carico.</div>}</>
         : <><b>Pagamento — {pag?pag.nome:o.pagamento_metodo}:</b> {pagato? "ricevuto, grazie!" : "in attesa."}
             {!pagato && pag && pag.istruzioni && <div style={{whiteSpace:"pre-wrap",marginTop:6,fontSize:13}}>{pag.istruzioni}</div>}
             {!pagato && (o.pagamento_metodo==="bonifico"||o.pagamento_metodo==="ritiro") &&
               <div style={{marginTop:6,fontSize:13.5}}>Importo: <b>{eur(o.totale)}</b>{o.pagamento_metodo==="bonifico"?<> · Causale: <b>{o.numero}</b></>:null}</div>}</>}
      </div>}

      {o.bozza_stato && <div className="warn" style={{marginBottom:16, background:o.bozza_stato==="approvata"?"var(--blu-wash)":"var(--sand-wash)", border:"1px solid "+(o.bozza_stato==="approvata"?"var(--blu)":"var(--sand)")}}>
        <b><Ico n="pen" s={17} className="ico-t"/>Bozza grafica (simulazione di stampa)</b>
        {o.bozza_stato==="da_approvare" && <>
          <p style={{margin:"6px 0",fontSize:13.5}}>Abbiamo preparato l'anteprima di come verrà stampato. Controllala e <b>approvala</b> per mandare l'ordine in produzione.</p>
          {bozzaFiles.map(f=><div key={f.id} style={{marginBottom:6,fontSize:13.5}}><Ico n="image" s={15} className="ico-t"/>{f.url? <a href={f.url} target="_blank" rel="noopener noreferrer">{f.nome_file}</a> : f.nome_file}</div>)}
          {!modApri
            ? <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:6}}>
                <button className="btn" onClick={approvaBozza} disabled={bozBusy==="ok"}>{bozBusy==="ok"?"…":"✓ Approva la bozza"}</button>
                <button className="btn ghost" onClick={()=>setModApri(true)}>Chiedi una modifica</button>
              </div>
            : <div style={{marginTop:8}}>
                <textarea rows={2} value={bozNote} onChange={e=>setBozNote(e.target.value)} placeholder="Scrivi cosa vorresti modificare…" style={{width:"100%"}}/>
                <div style={{display:"flex",gap:10,marginTop:6}}>
                  <button className="btn" onClick={chiediModifiche} disabled={bozBusy==="mod"}>{bozBusy==="mod"?"…":"Invia richiesta"}</button>
                  <button className="btn ghost" onClick={()=>{setModApri(false);setBozNote("");}}>Annulla</button>
                </div>
              </div>}
        </>}
        {o.bozza_stato==="approvata" && <p style={{margin:"6px 0 0",fontSize:13.5}}><Ico n="ok" s={16} className="ico-t"/>Hai approvato la bozza — l'ordine può andare in produzione. Grazie!</p>}
        {o.bozza_stato==="modifiche_richieste" && <p style={{margin:"6px 0 0",fontSize:13.5}}>Abbiamo ricevuto la tua richiesta di modifica: ti invieremo una nuova bozza a breve.</p>}
      </div>}

      <div className="ord-grid">
        {(dati.righe||[]).map(r=>{ const files=fileDiRiga(r.id); return (
          <div className="ord-riga" key={r.id}>
            <div className="ord-riga-h">
              <div><b>{r.descrizione}</b><div className="muted" style={{fontSize:12.5}}>{r.quantita} pz · {eur(r.prezzo_totale)}</div>
                {r.config && r.config.scatola && r.config.scatola.modello && <button type="button" className="lnk" style={{fontSize:13,marginTop:4}}
                  onClick={()=>{ const c=r.config.scatola; scaricaTracciato(c.modello,c.A,c.B,c.H,c.spessore||0,c.materiale||""); }}><Ico n="download" s={15} style={{marginRight:5}}/>Scarica il tracciato della scatola (PDF)</button>}</div>
            </div>
            <div className="ord-files">
              {files.map(f=>(
                <div className="ord-file" key={f.id}>
                  <span className="ord-file-n"><Ico n="clip" s={15} className="ico-t"/>{f.url? <a href={f.url} target="_blank" rel="noopener noreferrer">{f.nome_file}</a> : f.nome_file}</span>
                  <span className="muted" style={{fontSize:12}}>{kb(f.dimensione)}</span>
                  <button className="ord-file-x" title="Rimuovi" onClick={()=>elimina_file(f)}>×</button>
                </div>
              ))}
              {files.length===0 && <div className="muted" style={{fontSize:13}}>Nessun file caricato per questo prodotto.</div>}
            </div>
            <label className="ord-up">
              {busy===r.id? "Carico…" : <><Ico n="upload" s={15} style={{marginRight:6}}/>Carica file grafico</>}
              <input type="file" onChange={e=>{const f=e.target.files[0]; e.target.value=""; carica_file(r,f);}} disabled={busy===r.id} style={{display:"none"}}/>
            </label>
          </div>
        ); })}
      </div>

      <div className="cart-tot" style={{marginTop:20,maxWidth:420,marginLeft:"auto"}}>
        <div className="r"><span>Imponibile</span><span>{eur(o.imponibile)}</span></div>
        <div className="r"><span>IVA 22%</span><span>{eur(o.iva)}</span></div>
        <div className="r big"><span>Totale</span><span>{eur(o.totale)}</span></div>
      </div>
      <div className="note">Stato ordine: <b>{o.stato}</b>. Formati consigliati: <b>PDF</b> (o JPG/PNG ad alta risoluzione). Se hai il nostro template, posiziona la grafica nell'area indicata prima di esportare.</div>
    </div>
  );
}

// dati di fatturazione — valori vuoti, mappatura da/verso komunigo_account
const DATI_VUOTI={tipo:"azienda",ragione_sociale:"",nome:"",partita_iva:"",codice_fiscale:"",pec:"",codice_sdi:"",telefono:"",indirizzo:"",cap:"",citta:"",provincia:"",consegna_uguale:true,consegna_indirizzo:"",consegna_cap:"",consegna_citta:"",consegna_provincia:""};
const accToForm=a=>({...DATI_VUOTI, tipo:a&&a.tipo_cliente||"azienda", ragione_sociale:a&&a.ragione_sociale||"", nome:a&&a.nome||"",
  partita_iva:a&&a.partita_iva||"", codice_fiscale:a&&a.codice_fiscale||"", pec:a&&a.pec||"", codice_sdi:a&&a.codice_sdi||"",
  telefono:a&&a.telefono||"", indirizzo:a&&a.indirizzo||"", cap:a&&a.cap||"", citta:a&&a.citta||"", provincia:a&&a.provincia||"",
  consegna_uguale:a?a.consegna_uguale!==false:true, consegna_indirizzo:a&&a.consegna_indirizzo||"", consegna_cap:a&&a.consegna_cap||"", consegna_citta:a&&a.consegna_citta||"", consegna_provincia:a&&a.consegna_provincia||""});
const formToAcc=f=>({tipo_cliente:f.tipo, ragione_sociale:(f.ragione_sociale||"").trim(), nome:(f.nome||"").trim(),
  azienda:(f.ragione_sociale||"").trim(), partita_iva:(f.partita_iva||"").trim(), codice_fiscale:(f.codice_fiscale||"").trim().toUpperCase(),
  pec:(f.pec||"").trim(), codice_sdi:(f.codice_sdi||"").trim().toUpperCase(), telefono:(f.telefono||"").trim(),
  indirizzo:(f.indirizzo||"").trim(), cap:(f.cap||"").trim(), citta:(f.citta||"").trim(), provincia:(f.provincia||"").trim().toUpperCase(),
  consegna_uguale:f.consegna_uguale!==false, consegna_indirizzo:(f.consegna_indirizzo||"").trim(), consegna_cap:(f.consegna_cap||"").trim(), consegna_citta:(f.consegna_citta||"").trim(), consegna_provincia:(f.consegna_provincia||"").trim().toUpperCase()});
function fatturazioneValida(f){
  if(f.tipo==="azienda") return !!((f.ragione_sociale||"").trim() && (f.partita_iva||"").trim());
  return !!((f.nome||"").trim() && (f.codice_fiscale||"").trim());
}

      {azienda ? <>
        <label className="co-f"><span>Ragione sociale *</span><input value={f.ragione_sociale} onChange={e=>set("ragione_sociale",e.target.value)}/></label>
        <label className="co-f"><span>Partita IVA *</span><input value={f.partita_iva} onChange={e=>set("partita_iva",e.target.value)}/></label>
        <label className="co-f"><span>Codice Fiscale</span><input value={f.codice_fiscale} onChange={e=>set("codice_fiscale",e.target.value)}/></label>
        <label className="co-f"><span>Referente</span><input value={f.nome} onChange={e=>set("nome",e.target.value)} placeholder="persona di riferimento"/></label>
        <label className="co-f"><span>Codice Destinatario (SDI)</span><input value={f.codice_sdi} onChange={e=>set("codice_sdi",e.target.value)} maxLength={7} placeholder="7 caratteri (o 0000000)"/></label>
        <label className="co-f"><span>PEC</span><input value={f.pec} onChange={e=>set("pec",e.target.value)} placeholder="per la fattura elettronica"/></label>
      </> : <>

        <label className="co-f"><span>Codice Fiscale *</span><input value={f.codice_fiscale} onChange={e=>set("codice_fiscale",e.target.value)}/></label>
      </>}
      <label className="co-f"><span>Telefono</span><input value={f.telefono} onChange={e=>set("telefono",e.target.value)}/></label>
    </div>
    <div className="fld" style={{marginTop:14,fontWeight:700}}>Sede legale / indirizzo</div>
    <div className="co-grid">
      <label className="co-f co-full"><span>Indirizzo</span><input value={f.indirizzo} onChange={e=>set("indirizzo",e.target.value)} placeholder="Via e numero"/></label>
      <label className="co-f"><span>CAP</span><input value={f.cap} onChange={e=>set("cap",e.target.value)}/></label>
      <label className="co-f"><span>Città</span><input value={f.citta} onChange={e=>set("citta",e.target.value)}/></label>
      <label className="co-f"><span>Provincia</span><input value={f.provincia} onChange={e=>set("provincia",e.target.value)} maxLength={2} placeholder="es. MI"/></label>
    </div>
    <label style={{display:"flex",gap:8,alignItems:"center",margin:"12px 0 2px",fontSize:14}}>
      <input type="checkbox" checked={f.consegna_uguale!==false} onChange={e=>set("consegna_uguale",e.target.checked)} style={{width:"auto"}}/>
      Consegna allo stesso indirizzo
    </label>
    {f.consegna_uguale===false && <div className="co-grid">
      <label className="co-f co-full"><span>Indirizzo di consegna</span><input value={f.consegna_indirizzo} onChange={e=>set("consegna_indirizzo",e.target.value)}/></label>
      <label className="co-f"><span>CAP</span><input value={f.consegna_cap} onChange={e=>set("consegna_cap",e.target.value)}/></label>
      <label className="co-f"><span>Città</span><input value={f.consegna_citta} onChange={e=>set("consegna_citta",e.target.value)}/></label>
      <label className="co-f"><span>Provincia</span><input value={f.consegna_provincia} onChange={e=>set("consegna_provincia",e.target.value)} maxLength={2}/></label>
    </div>}
  </>);
}

// =====================================================================
//  AUTENTICAZIONE CLIENTI (registrazione / login)
// =====================================================================
function AuthModal({onClose, motivo}){
  const [modo,setModo]=useState(motivo?"registra":"login");
  const [f,setF]=useState({email:"",password:"",consenso:false,...DATI_VUOTI});
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState(""); const [msg,setMsg]=useState("");
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  async function submit(){
    setBusy(true); setErr(""); setMsg("");
    try{
      if(modo==="login"){
        const {error}=await sb.auth.signInWithPassword({email:f.email.trim(),password:f.password});
        if(error) throw error; onClose();
      }else{
        if(f.password.length<6){ setErr("La password deve avere almeno 6 caratteri."); setBusy(false); return; }
        if(!fatturazioneValida(f)){ setErr(f.tipo==="azienda"?"Per le aziende servono ragione sociale e P.IVA.":"Servono nome e codice fiscale."); setBusy(false); return; }
        const {data,error}=await sb.auth.signUp({email:f.email.trim(),password:f.password,
          options:{ data:{ komunigo:"true", nome:(f.nome||f.ragione_sociale||"").trim(), consenso_marketing:f.consenso?"true":"false" } }});
        if(error) throw error;
        if(data.session){
          try{ await sb.from("komunigo_account").update(formToAcc(f)).eq("id",data.session.user.id); }catch(e){}
          onClose();
        } else setMsg("Ti abbiamo inviato una email per confermare la registrazione. Confermala, poi accedi (i dati di fatturazione li completi nell'area account).");
      }
    }catch(e){ setErr(e.message||String(e)); }
    setBusy(false);
  }
  return (
    <div className="overlay">
      <div className="modal" style={{width:modo==="registra"?"min(620px,100%)":"min(440px,100%)"}}>
        <div className="mh"><h3>{modo==="login"?"Accedi":"Crea un account"}</h3><button className="x" onClick={onClose}>×</button></div>
        <div className="mb">
          {motivo && <div className="auth-motivo"><Ico n="lock" s={16} className="ico-t"/>Per <b>{motivo}</b> serve un account Komunigo: è gratis e ci vuole un minuto.{modo==="registra"?"":" Accedi oppure registrati."}</div>}
          {err && <div className="warn" style={{marginBottom:12}}>{err}</div>}
          {msg && <div className="note" style={{marginBottom:12}}>{msg}</div>}
          {modo==="registra" && <>
            <div className="fld" style={{fontWeight:700,marginTop:0}}>Dati di fatturazione</div>
            <p className="muted" style={{fontSize:12,marginTop:0,marginBottom:8}}>Servono per emettere la fattura. Puoi comunque completarli/modificarli dopo, nell'area account.</p>
            <CampiFatturazione f={f} set={set}/>
            <div className="fld" style={{fontWeight:700,marginTop:16}}>Credenziali di accesso</div>
          </>}
          <label className="fld">Email</label>
          <input type="email" value={f.email} onChange={e=>set("email",e.target.value)} placeholder="nome@email.it"/>
          <label className="fld">Password</label>
          <input type="password" value={f.password} onChange={e=>set("password",e.target.value)} placeholder={modo==="registra"?"almeno 6 caratteri":""}/>
          {modo==="registra" && <>
            <label className="consenso-box">
              <input type="checkbox" checked={!!f.consenso} onChange={e=>set("consenso",e.target.checked)}/>
              <span><b>Sì, voglio ricevere offerte e novità</b> di Komunigo via email. Facoltativo: puoi revocarlo quando vuoi dal tuo account o con il link in ogni email.</span></label>
            <p className="muted" style={{fontSize:11.5,margin:"8px 0 0"}}>Registrandoti dichiari di aver letto l'<a href="#" onClick={e=>{e.preventDefault(); onClose(); setTimeout(()=>{ const b=[...document.querySelectorAll(".ft-lnk")].find(x=>x.innerText==="Privacy"); if(b) b.click(); },50);}}>informativa privacy</a>. I tuoi dati servono a gestire account e ordini.</p>
          </>}
        </div>
        <div className="mf">
          <button className="btn" onClick={submit} disabled={busy||!f.email||!f.password}>{busy?"…":(modo==="login"?"Accedi":"Registrati")}</button>
          <button className="btn ghost" onClick={()=>{setModo(modo==="login"?"registra":"login");setErr("");setMsg("");}}>
            {modo==="login"?"Registrati":"Ho già un account"}</button>
        </div>
      </div>
    </div>
  );
}

// =====================================================================
//  AREA ACCOUNT (dati cliente + storico ordini)
// =====================================================================
function AccountPagina({account,sess,onLogout,vaiCatalogo,apriOrdine,onAccountChange,riordina}){
  const [ordini,setOrdini]=useState(null);
  const [f,setF]=useState(()=>accToForm(account));
  const [salvato,setSalvato]=useState(false);
  useEffect(()=>{ setF(accToForm(account)); },[account]);
  useEffect(()=>{ (async()=>{
    if(!sess){ setOrdini([]); return; }
    try{ const {data}=await sb.from("komunigo_ordini").select("numero,token,stato,totale,creato_il,pagamento_stato").eq("account_id",sess.user.id).order("creato_il",{ascending:false}); setOrdini(data||[]); }
    catch(e){ setOrdini([]); }
  })(); },[sess]);
  const set=(k,v)=>{ setF(p=>({...p,[k]:v})); setSalvato(false); };
  const [errS,setErrS]=useState("");
  async function salvaProfilo(){
    setErrS("");
    if(!fatturazioneValida(f)){ setErrS(f.tipo==="azienda"?"Per le aziende servono ragione sociale e P.IVA.":"Servono nome e codice fiscale."); return; }
    const payload=formToAcc(f);
    const {error}=await sb.from("komunigo_account").update(payload).eq("id",sess.user.id);
    if(error){ setErrS(error.message); return; }
    setSalvato(true); if(onAccountChange) onAccountChange({...(account||{}),...payload});
  }
  if(!sess) return <div className="empty"><p>Accedi per vedere il tuo account.</p></div>;
  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
        <h2 className="sec" style={{margin:0}}>Il mio account</h2>
        <button className="btn ghost" onClick={onLogout}>Esci</button>
      </div>
      <p className="sec-sub">{sess.user.email}{account&&account.stato==="b2b"?" · Cliente B2B":""}</p>

      <div className="ship" style={{marginTop:8}}>
        <h3 className="ship-h">Dati di fatturazione</h3>
        {errS && <div className="warn" style={{marginBottom:10}}>{errS}</div>}
        <CampiFatturazione f={f} set={set}/>
        <button className="btn" style={{marginTop:14}} onClick={salvaProfilo}>{salvato?"Salvato ✓":"Salva dati"}</button>
      </div>
      {account && "consenso_marketing" in account && <div className="ship" style={{marginTop:14}}>
        <h3 className="ship-h">Offerte via email</h3>
        <label className="consenso-box" style={{marginTop:0}}>
          <input type="checkbox" checked={!!account.consenso_marketing} onChange={async e=>{ const v=e.target.checked;
            const patch={consenso_marketing:v, consenso_marketing_il:new Date().toISOString(), consenso_marketing_fonte:v?"area account":"revoca area account"};
            const {error}=await sb.from("komunigo_account").update(patch).eq("id",sess.user.id);
            if(!error && onAccountChange) onAccountChange({...(account||{}),...patch}); }}/>
          <span>Voglio ricevere offerte e novità di Komunigo via email.{account.consenso_marketing_il? <span className="muted"> (aggiornato il {new Date(account.consenso_marketing_il).toLocaleDateString("it-IT")})</span>:null}</span></label>
      </div>}

      <h3 className="ship-h" style={{marginTop:24}}>I tuoi ordini</h3>
      {ordini===null? <p className="muted">Carico…</p>
       : ordini.length===0? <p className="muted">Non hai ancora ordini. <button className="lnk" onClick={vaiCatalogo}>Vai al catalogo →</button></p>
       : <div style={{marginTop:8}}>{ordini.map(o=>(
          <div className="cart-line" key={o.numero} style={{cursor:"pointer"}} onClick={()=>apriOrdine(o.token)}>
            <div className="g"><h4>Ordine {o.numero}</h4><p>{o.creato_il?new Date(o.creato_il).toLocaleDateString("it-IT"):""} · {o.pagamento_stato==="pagato"?"pagato":"pagamento in attesa"}</p></div>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <span className="price">{eur(o.totale)}</span>
              {riordina && <button className="btn ghost small" onClick={e=>{e.stopPropagation();riordina(o.token);}}><Ico n="repeat" s={15} style={{marginRight:6}}/>Riordina</button>}
            </div>
          </div>))}</div>}
    </div>
  );
}

// =====================================================================
//  LINEE GUIDA FILE DI STAMPA  (pagina informativa, stile FlyerAlarm)
// =====================================================================
function DiagrammaRifilo(){
  return (
    <svg className="lg-diagram" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abbondanza, linea di taglio e margine di sicurezza">
      <rect x="10" y="10" width="300" height="180" fill="#e9eef5"/>
      <rect x="28" y="28" width="264" height="144" fill="#ffffff" stroke="#2E6FB0" strokeWidth="2" strokeDasharray="6 4"/>
      <rect x="46" y="46" width="228" height="108" fill="none" stroke="#1e7d34" strokeWidth="1.5" strokeDasharray="4 4"/>
      <text x="160" y="22" textAnchor="middle" fontSize="11" fill="#8a4b00">Abbondanza +3 mm (sfondo fin qui)</text>
      <text x="160" y="41" textAnchor="middle" fontSize="11" fill="#2E6FB0">Linea di taglio (formato finito)</text>
      <text x="160" y="104" textAnchor="middle" fontSize="11" fill="#1e7d34">Area sicura</text>
      <text x="160" y="120" textAnchor="middle" fontSize="10" fill="#1e7d34">testi e loghi qui dentro</text>
    </svg>
  );
}
const LG_SEZIONI=[
  {ico:"ruler", t:"Formato e taglio", extra:"diagramma", voci:[
    "Imposta il file nel formato del prodotto, inclusi i 3 mm di abbondanza per lato (es. biglietto 8,5×5,5 cm → file da 8,7×5,7 cm).",
    "Tieni testi, loghi ed elementi importanti entro l'area sicura, ad almeno 3 mm dal taglio.",
    "Estendi sfondi e immagini a vivo fino al bordo del file, coprendo tutta l'abbondanza.",
    "Nessun crocino di taglio, piega o registro nel file: li generiamo noi.",
    "Usa il template della scheda prodotto: ha già taglio, abbondanza e area sicura.",
  ]},
  {ico:"drop", t:"Colore", voci:[
    "Lavora in CMYK (stampa 4/4 o 4/0). In RGB i colori vengono convertiti e possono cambiare tonalità.",
    "Per colori esatti usa Pantone / tinte piatte (HKS/PANTONE) coi nomi canale corretti; indicali nelle note dell'ordine.",
    "Nero dei testi: C0 M0 Y0 K100. Nero profondo per grandi fondi: C40 M0 Y0 K100.",
    "Grigi: K50 (grigio caldo +C10, grigio freddo +M10).",
    "Apporto totale di colore tra il 10% e il 300%.",
    "Elementi bianchi mai in sovrastampa (sparirebbero).",
    "Profilo colore consigliato: ISO Coated V2 300% (ECI), impostato come output intent.",
  ]},
  {ico:"image", t:"Immagini e risoluzione", voci:[
    "Risoluzione 300 dpi (fino a 356) alla dimensione reale di stampa.",
    "Grande formato (da A2 in su): 100–150 dpi sono sufficienti.",
    "Immagini in CMYK; evita immagini piccole ingrandite dal web (vengono sgranate).",
    "Se impagini, i collegamenti alle immagini devono essere presenti e aggiornati.",
  ]},
  {ico:"type", t:"Scritte e linee", voci:[
    "Corpo del testo minimo 6 pt.",
    "Font incorporati nel PDF oppure testi convertiti in tracciati / curve.",
    "Spessore minimo linee: 0,25 pt in positivo, 0,5 pt in negativo (chiaro su scuro).",
    "Niente cornici/outline a filo: se le usi, tienile ad almeno 4 mm dal bordo.",
  ]},
  {ico:"doc", t:"Formato file", voci:[
    "Invia in PDF (ideale PDF/X-3 o PDF/X-4), oppure TIFF / JPG ad alta risoluzione.",
    "Niente password o cifratura sul file.",
    "Testi neri piccoli e linee sottili nere meglio in sovrastampa: evitano bordi bianchi.",
    "Evita grafiche vettoriali troppo complesse: in caso, esporta in raster (JPG).",
  ]},
  {ico:"layers", t:"Pagine e livelli (multipagina)", voci:[
    "Sequenza e orientamento delle pagine corretti; numero facciate giusto.",
    "Riduci tutti i livelli a un unico livello di fondo (PDF/TIF da Photoshop/GIMP).",
  ]},
];
function LineeGuida({vaiCatalogo}){
  const [ok,setOk]=useState(()=>{ try{return new Set(JSON.parse(localStorage.getItem("komunigo_lg")||"[]"));}catch(e){return new Set();} });
  const totale=LG_SEZIONI.reduce((s,z)=>s+z.voci.length,0);
  const fatti=ok.size;
  const toggle=(k)=>setOk(p=>{ const n=new Set(p); n.has(k)?n.delete(k):n.add(k); try{localStorage.setItem("komunigo_lg",JSON.stringify([...n]));}catch(e){} return n; });
  const reset=()=>{ setOk(new Set()); try{localStorage.removeItem("komunigo_lg");}catch(e){} };
  const completo=fatti===totale;
  return (
    <div>
      <div className="lg-hero">
        <h1>Linee guida per i file di stampa</h1>
        <p>Prepara correttamente il tuo file e ottieni una stampa fedele, senza brutte sorprese. Spunta le caselle mentre controlli il file. Dopo l'ordine lo carichi e ti inviamo una <b>bozza di stampa da approvare</b> prima di andare in produzione. Ogni prodotto ha il suo <b>template</b> scaricabile dalla scheda.</p>
      </div>

      <div className="lg-actions no-print">
        <div className="lg-progress">
          <div className="lg-bar"><span style={{width:(totale?Math.round(fatti/totale*100):0)+"%"}}/></div>
          <div className="lg-progress-lbl">{fatti}/{totale} controlli {fatti>0 && <button className="lnk" onClick={reset}>azzera</button>}</div>
        </div>
        <button className="btn ghost" onClick={()=>window.print()}><Ico n="download" s={16} style={{marginRight:6}}/>Scarica la checklist (PDF)</button>
      </div>
      <div className="lg-print-note">Checklist file di stampa — komunigo.it · info@komunigo.it</div>

      <div className="lg-grid">
        {LG_SEZIONI.map((z,i)=>(
          <div className="lg-card" key={i}>
            <div className="lg-ico"><Ico n={z.ico} s={26} sw={1.5}/></div>
            <h3>{z.t}</h3>
            {z.extra==="diagramma" && <DiagrammaRifilo/>}
            <div className="lg-items">
              {z.voci.map((v,j)=>{ const k=i+"-"+j; return (
                <label key={j} className={"lg-item"+(ok.has(k)?" on":"")}>
                  <input type="checkbox" checked={ok.has(k)} onChange={()=>toggle(k)}/>
                  <span>{v}</span>
                </label>); })}
            </div>
          </div>
        ))}
      </div>

      {completo && <div className="lg-done">
        <div><Ico n="spark" s={22} className="ico-t"/> <b>Hai spuntato tutto!</b> Il tuo file è pronto. Scegli il prodotto, completa l'ordine e poi carica il file dalla pagina «I tuoi ordini».</div>
        <button className="btn no-print" onClick={vaiCatalogo}>Vai al catalogo e ordina →</button>
      </div>}

      <div className="lg-cta">
        <div>
          <h2>Controllo file &amp; assistenza grafica</h2>
          <p>Verifichiamo il tuo file prima della stampa e ti mandiamo la bozza da approvare. Hai bisogno di aiuto con la grafica o non hai un file pronto? Scrivici a <a href="mailto:info@komunigo.it">info@komunigo.it</a> e ti diamo una mano.</p>
        </div>
        <button className="btn" onClick={vaiCatalogo}>Vai al catalogo</button>
      </div>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
