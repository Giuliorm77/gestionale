<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>KOMUNIGO — Stampa, insegne e allestimenti</title>
<style>
  :root{
    --paper:#F7F4EE; --surface:#FFFFFF; --surface-2:#F0EBDF; --ink:#1C2A44; --ink-soft:#55607A;
    --ink-faint:#99A0B0; --line:#E4DFD2; --line-strong:#CFC8B7;
    --navy:#1C2A44; --blu:#2E6FB0; --blu-wash:#E4EDF6; --sand:#A9884B; --sand-wash:#EFE7D4;
    --ok:#2C7A54; --warn:#9A6712;
    --shadow:0 1px 2px rgba(20,22,26,.05), 0 10px 30px rgba(20,22,26,.07);
    --disp:"Bahnschrift SemiBold","Bahnschrift","DIN Alternate","Oswald","Barlow Condensed","Arial Narrow",sans-serif;
    --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --mono:"Cascadia Code","Consolas",ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#131727; --surface:#1A2033; --surface-2:#212840; --ink:#ECEBE4; --ink-soft:#A7ACBA;
    --ink-faint:#6E7488; --line:#2C3350; --line-strong:#3C4468;
    --navy:#ECEBE4; --blu:#5B9BD8; --blu-wash:#16233B; --sand:#C79A57; --sand-wash:#2A2417;
    --shadow:0 1px 2px rgba(0,0,0,.34), 0 12px 36px rgba(0,0,0,.42);}}
  *{box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;margin:0;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  .disp{font-family:var(--disp);text-transform:uppercase;letter-spacing:.01em;}
  .btn{background:var(--blu);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-weight:700;font-size:14px;}
  .btn:hover{filter:brightness(1.06);}
  .btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .pill{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--blu);}
  .in{max-width:var(--pagina,1560px);margin:0 auto;padding:0 24px;}

  /* header a banda nera */
  header.top{position:sticky;top:0;z-index:20;background:#15171C;box-shadow:var(--shadow);}
  .topline{height:3px;background:linear-gradient(90deg,var(--blu) 0%,var(--blu) 76%,var(--sand) 100%);}
  .top-in{max-width:var(--pagina,1560px);margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:20px;}
  .brand{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:33px;letter-spacing:.01em;color:#F7F4EE;background:none;border:none;padding:0;cursor:pointer;line-height:1;}
  .brand .go{color:var(--blu);}
  .search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:#F7F4EE;border:1px solid #E4DFD2;border-radius:9px;padding:9px 13px;color:#55607A;font-size:13.5px;}
  .search input{flex:1;background:none;border:none;outline:none;color:#1C2A44;font:inherit;}
  .search input::placeholder{color:#8a8f9c;}
  .search-x{background:none;border:none;color:#55607A;cursor:pointer;font-size:18px;line-height:1;padding:0 2px;}
  .cat-search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 10px;max-width:520px;}
  .cat-search input{flex:1;background:none;border:none;outline:none;font:inherit;color:var(--ink);}
  .cat-search .search-x{color:var(--ink-soft);}
  .cat-toprow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .cat-toprow .cat-search{flex:1;margin:0 0 10px;}
  .iva-toggle{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:10px;}
  .iva-toggle button{background:var(--surface);border:none;padding:8px 12px;font:inherit;font-size:13px;color:var(--ink-soft);cursor:pointer;}
  .iva-toggle button.on{background:var(--blu);color:#fff;font-weight:700;}
  .iva-toggle.sm{margin:0 10px 0 auto;}
  .iva-toggle.sm button{padding:5px 9px;font-size:12px;}
  .iva-tag{font-size:11px;color:var(--ink-soft);font-weight:600;}
  nav.main{display:flex;gap:6px;}
  nav.main button{background:transparent;border:none;color:#C7CBD3;font-size:14.5px;font-weight:600;padding:8px 12px;border-radius:8px;}
  nav.main button.on{color:#fff;background:rgba(255,255,255,.08);}
  .aiuto-btn{margin-left:auto;display:inline-flex;align-items:center;background:transparent;color:#F7F4EE;border:1.5px solid rgba(247,244,238,.35);border-radius:9px;padding:8px 13px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;}
  .aiuto-btn:hover{border-color:#F7F4EE;}
  .aiuto-btn + .cart-btn{margin-left:0;}
  @media(max-width:900px){.aiuto-btn{font-size:0;padding:8px 9px;} .aiuto-btn .ico{margin-right:0 !important;}}
  .nav-promo{display:inline-flex;align-items:center;}
  .nav-promo .ico{color:#C9A96B;}
  .cart-btn{margin-left:auto;position:relative;background:var(--blu);color:#fff;border:none;border-radius:9px;padding:9px 15px;font-weight:700;font-size:13px;}
  .cart-imp{margin-left:8px;padding-left:8px;border-left:1px solid rgba(255,255,255,.35);font-weight:800;white-space:nowrap;}
  .cart-badge{position:absolute;top:-6px;right:-6px;background:var(--sand);color:#1a1300;border-radius:20px;font-size:11px;font-weight:800;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;}
  .band-panna{height:10px;background:var(--paper);}
  @media(max-width:820px){.search{display:none;}}

  .wrap{max-width:var(--pagina,1560px);margin:0 auto;padding:26px 24px 70px;}
  h2.sec{font-family:var(--disp);text-transform:uppercase;letter-spacing:.02em;font-weight:600;font-size:23px;margin:0 0 3px;}
  .sec-sub{font-size:14px;color:var(--ink-soft);margin:0 0 16px;}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:44px 0 16px;}
  .head .lnk{color:var(--blu);font-weight:700;font-size:13.5px;background:none;border:none;white-space:nowrap;}

  /* hero navy */
  .hero{background:linear-gradient(120deg,#1C2A44,#132038);color:#fff;border-radius:0;}
  .hero-in{max-width:var(--pagina,1560px);margin:0 auto;padding:46px 24px;display:grid;grid-template-columns:1.2fr .8fr;gap:26px;align-items:center;}
  @media(max-width:760px){.hero-in{grid-template-columns:1fr;}}
  .hero .tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8FB8E0;font-weight:700;}
  .hero h1{font-family:var(--disp);text-transform:uppercase;font-weight:700;line-height:1;font-size:clamp(30px,5vw,52px);margin:12px 0 14px;text-wrap:balance;}
  .hero h1 em{font-style:normal;color:#6FA8E0;}
  .hero p{font-size:15.5px;color:#C7D2E4;margin:0 0 22px;max-width:46ch;}
  .promo{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow);text-align:center;color:var(--ink);}
  .promo .k{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sand);font-weight:700;}
  .promo .big{font-family:var(--disp);text-transform:uppercase;font-size:38px;margin:6px 0 2px;}
  .promo .big b{color:var(--blu);}
  .promo p{font-size:13px;color:var(--ink-soft);margin:4px 0 0;}

  /* categorie */
  .cats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  @media(max-width:820px){.cats{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:480px){.cats{grid-template-columns:1fr;}}
  .cat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:30px 22px 26px;text-align:center;box-shadow:var(--shadow);transition:transform .12s,border-color .12s;cursor:pointer;font:inherit;color:inherit;}
  .cat:hover{transform:translateY(-3px);border-color:var(--blu);}
  .cat .ic{width:96px;height:96px;margin:0 auto 16px;border-radius:20px;display:grid;place-items:center;font-size:46px;background:var(--blu-wash);}
  .cat h4{font-family:var(--disp);text-transform:uppercase;font-size:21px;margin:0 0 6px;letter-spacing:.01em;}
  .cat p{font-size:14px;color:var(--ink-soft);margin:0;line-height:1.4;}
  .pack-pg{max-width:1100px;margin:10px auto 40px;}
  .aiuto-modal{width:min(520px,100%);}
  .aiuto-voci{display:flex;flex-direction:column;gap:10px;margin:14px 0;}
  .aiuto-voce{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);background:var(--surface,#fff);transition:border-color .15s,background .15s;}
  .aiuto-voce:hover{border-color:var(--blu);background:var(--blu-wash);}
  .aiuto-voce > span:nth-child(2){flex:1;display:flex;flex-direction:column;gap:2px;}
  .aiuto-voce b{font-size:15px;} .aiuto-voce span span{font-size:13px;color:var(--ink-soft);}
  .aiuto-ic{flex:0 0 46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,var(--blu),#1C2A44);}
  .aiuto-voce.wa .aiuto-ic{background:linear-gradient(140deg,#2bb673,#128c4a);}
  .aiuto-go{font-size:24px;color:var(--ink-soft);}
  .promo-pg{max-width:1100px;margin:10px auto 40px;}
  .promo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:16px;}
  .promo-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);}
  .promo-badge{display:inline-block;background:#1C2A44;color:#fff;border-radius:8px;padding:3px 9px;font-weight:700;font-size:12.5px;}
  .promo-vuota{display:flex;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 28px;margin-top:16px;box-shadow:var(--shadow);}
  .promo-vuota h3{margin:0 0 6px;font-size:20px;} .promo-vuota p{margin:0;color:var(--ink-soft);line-height:1.5;max-width:640px;}
  .promo-ic{flex:0 0 72px;height:72px;border-radius:20px;display:grid;place-items:center;color:#C9A96B;background:#1C2A44;}
  .promo-iscrivi{margin-top:18px;}
  .mockup-box{background:linear-gradient(180deg,#fff,#f6f7f9);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;}
  .mockup-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:6px;font-size:14px;}
  .mockup{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .mockup-v{margin:0;text-align:center;}
  .mockup-v svg{width:100%;max-width:260px;height:auto;}
  .mockup-v figcaption{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);}
  .mockup-ph{font-family:var(--disp);font-weight:700;letter-spacing:.06em;opacity:.75;}
  .mockup-zoom{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px;padding-top:10px;border-top:1px dashed var(--line);}
  .mockup-z{margin:0;text-align:center;}
  .mockup-z > svg{width:170px;height:170px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .mockup-z figcaption{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .logo-up{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;}
  .logo-up.compatto{justify-content:center;}
  .logo-btn{display:inline-flex;align-items:center;background:var(--blu);color:#fff;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;}
  .logo-btn:hover{filter:brightness(1.1);}
  .logo-opt{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);}
  .logo-opt input[type=checkbox]{width:auto;}
  .logo-opt input[type=range]{width:90px;}
  .consegna{display:inline-flex;flex-wrap:wrap;align-items:center;gap:0 4px;font-size:14px;color:var(--ink);}
  .consegna b{color:var(--ink);}
  .consegna-n{flex-basis:100%;font-size:12px;color:var(--ink-soft);margin-left:23px;}
  .badge-verifica{display:flex;align-items:center;gap:9px;margin-top:12px;padding:9px 12px;border-radius:12px;background:#e8f6ee;border:1px solid #b9e2c9;color:#17663a;font-size:13px;line-height:1.35;}
  .badge-verifica b{color:#0f5a30;}
  .badge-verifica .ico{color:#1e8a4c;flex:0 0 auto;}
  .ph-ico{color:#b7a27a;opacity:.85;}
  .pack-ph{color:var(--blu);}
  .cat .ic{color:var(--blu);}
  .bf-ic{color:var(--blu);display:grid;place-items:center;}
  .sumisura-ic{color:#C9A96B;}
  .lg-ico{color:var(--blu);}
  .auth-motivo{background:var(--blu-wash);border:1px solid var(--blu);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;}
  .consenso-box{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13px;line-height:1.45;cursor:pointer;}
  .consenso-box input{width:auto;margin-top:3px;flex:0 0 auto;}
  .scatola-top{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;}
  .scatola-vis{flex:0 0 280px;display:flex;flex-direction:column;gap:6px;}
  .scatola-tabs{display:flex;gap:4px;}
  .scatola-tabs button{flex:1;border:1.5px solid var(--line);background:var(--surface,#fff);border-radius:8px;padding:5px 8px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);}
  .scatola-tabs button.on{border-color:var(--blu);color:var(--blu);background:var(--blu-wash);}
  .tracciato-svg{width:100%;height:230px;background:#fff;border:1px solid var(--line);border-radius:12px;}
  .tr-cut{stroke:#d9002b;stroke-width:1.4;vector-effect:non-scaling-stroke;}
  .tr-fold{stroke:#0073d9;stroke-width:1.2;stroke-dasharray:4 3;vector-effect:non-scaling-stroke;}
  .tr-lab{fill:#9aa3b0;font-family:inherit;font-weight:600;}
  .tracciato-dl{border:1.5px dashed var(--blu);background:transparent;color:var(--blu);border-radius:10px;padding:8px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;}
  .tracciato-dl:disabled{opacity:.5;cursor:default;}
  .scatola-svg{width:100%;flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:12px;}
  .sf-ql{font-size:10.5px;fill:#fff;font-weight:700;font-family:inherit;}
  .sc-mis{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .sc-box{display:flex;align-items:center;gap:6px;border:2px solid var(--c);border-radius:22px;padding:6px 14px;background:var(--surface,#fff);width:100%;}
  .sc-box b{color:var(--c);font-size:15px;}
  .sc-box input::-webkit-outer-spin-button,.sc-box input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .sc-box input{-moz-appearance:textfield;appearance:textfield;text-align:center;font-size:16px !important;background:transparent !important;padding:4px 0 !important;width:100%;min-width:0;font:inherit;font-weight:600;outline:none;box-shadow:none !important;}
  .sc-box i{font-style:normal;color:var(--c);font-size:12px;font-weight:600;}
  .sc-lbl{font-size:12px;color:var(--ink-soft);}
  .sf-top{fill:#EEDFC0;stroke:#8a6d3b;stroke-width:1.4;stroke-linejoin:round;} .sf-front{fill:#DCC497;stroke:#8a6d3b;stroke-width:1.4;stroke-linejoin:round;} .sf-side{fill:#C2A36C;stroke:#8a6d3b;stroke-width:1.4;stroke-linejoin:round;}
  .sf-seam{stroke:#8a6d3b;stroke-width:1;stroke-dasharray:4 3;opacity:.7;}
  .sf-q{font-size:11px;fill:#5b6472;font-family:inherit;font-weight:600;}
  .scatola-mis{display:grid;grid-template-columns:repeat(3,minmax(110px,1fr));gap:10px;}
  @media(max-width:520px){.scatola-mis{grid-template-columns:1fr;}}
  .scatola-mis label{display:flex;flex-direction:column;font-size:12px;color:var(--ink-soft);gap:3px;}
  .scatola-mis input{width:100%;}
  .scatola-lati{display:flex;gap:6px;flex-wrap:wrap;}
  .scatola-lati button{border:1.5px solid var(--line);background:var(--surface,#fff);border-radius:20px;padding:6px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);}
  .scatola-lati button.on{background:var(--blu);border-color:var(--blu);color:#fff;}
  .boxfinder{margin:20px 0 6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);}
  .bf-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px;font-size:15px;}
  .bf-head .muted{font-size:13px;}
  .bf-row{display:flex;gap:10px;flex-wrap:wrap;}
  .bf-row label{display:flex;flex-direction:column;font-size:12px;color:var(--ink-soft);gap:3px;}
  .bf-row .sc-mis{width:150px;}
  .bf-modelli{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px;}
  .bf-mod{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface,#fff);border-radius:12px;padding:10px 12px;font:inherit;color:var(--ink);cursor:pointer;flex-wrap:wrap;}
  .bf-mod:hover{border-color:var(--blu);}
  .bf-ic{font-size:26px;}
  .bf-go{flex-basis:100%;color:var(--blu);font-weight:700;font-size:12.5px;}
  .wrap.wrap-wide{max-width:1760px;}
  .cat-layout{display:grid;grid-template-columns:1fr;gap:26px;}
  .cat-side,.cat-rail{display:none;}
  @media(min-width:1280px){ .cat-layout{grid-template-columns:230px minmax(0,1fr);} .cat-side{display:block;} }
  @media(min-width:1520px){ .cat-layout{grid-template-columns:230px minmax(0,1fr) 210px;} .cat-rail{display:block;} }
  .side-menu{position:sticky;top:90px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;}
  .side-head{width:100%;display:flex;align-items:center;gap:8px;background:#1C2A44;color:#fff;border:none;padding:13px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;text-align:left;}
  .side-head span:first-child{flex:1;}
  .side-n{background:rgba(255,255,255,.15);border-radius:10px;padding:1px 8px;font-size:12px;}
  .side-filtro{width:calc(100% - 20px);margin:10px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;}
  .side-list{max-height:calc(100vh - 220px);overflow:auto;padding:0 6px 10px;}
  .side-lett{font-size:11px;font-weight:800;color:var(--blu);letter-spacing:.08em;padding:10px 8px 2px;}
  .side-item{display:block;width:100%;text-align:left;background:none;border:none;font:inherit;font-size:13.5px;color:var(--ink);padding:5px 8px;border-radius:7px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .side-item:hover{background:var(--blu-wash);color:var(--blu);}
  .side-item.on{background:var(--blu-wash);color:var(--blu);font-weight:700;}
  .side-tutto{font-weight:700;margin:6px 0 2px;}
  .side-gr{margin-top:8px;}
  .side-gr-h{display:block;width:100%;text-align:left;background:none;border:none;font:inherit;font-family:var(--disp);text-transform:uppercase;letter-spacing:.04em;font-size:13px;font-weight:700;color:var(--ink);padding:6px 8px 3px;cursor:pointer;border-radius:7px;}
  .side-gr-h:hover,.side-gr-h.on{color:var(--blu);}
  .side-gr .side-item{padding-left:16px;}
  .foto-rail{position:sticky;top:90px;}
  .foto-rail-h{font-family:var(--disp);text-transform:uppercase;font-size:14px;letter-spacing:.06em;color:var(--ink-soft);margin:0 0 8px 2px;}
  .foto-rail-win{height:calc(100vh - 140px);max-height:900px;overflow:hidden;border-radius:14px;-webkit-mask-image:linear-gradient(transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(transparent,#000 8%,#000 92%,transparent);}
  .foto-rail-track{display:flex;flex-direction:column;gap:12px;}
  .foto-rail-track.anim{animation:railUp linear infinite;}
  .foto-rail-win:hover .foto-rail-track{animation-play-state:paused;}
  @keyframes railUp{from{transform:translateY(0);}to{transform:translateY(calc(-50% - 6px));}}
  .foto-rail-it{position:relative;display:block;width:100%;border:none;padding:0;background:#fff;border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);}
  .foto-rail-it img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;}
  .foto-rail-it span{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;font-size:11.5px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));text-align:left;}

    .lg-diagram{max-width:230px;}
    .lg-done{display:none !important;}
    .lg-cta{border:0 !important;box-shadow:none !important;background:#fff !important;padding:10px 0 0 !important;margin-top:14px;border-top:1px solid #bbb;border-radius:0;}
    .lg-cta h2{font-size:14px;color:#000 !important;} .lg-cta p{font-size:11.5px;color:#333 !important;}
    a{color:#000 !important;text-decoration:none;}
  }
  .cart-tot{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);}
  .cart-tot .r{display:flex;justify-content:space-between;font-size:14px;margin:5px 0;color:var(--ink-soft);}
  .cart-tot .r.big{font-size:19px;font-weight:800;color:var(--ink);margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}

  .note{background:var(--blu-wash);border:1px solid var(--blu);border-radius:11px;padding:13px 15px;font-size:13.5px;margin-top:16px;color:var(--ink);}
  .warn{background:var(--sand-wash);border:1px solid var(--sand);border-radius:11px;padding:13px 15px;font-size:13.5px;} .warn b{color:var(--sand);}
  .empty{text-align:center;color:var(--ink-soft);padding:50px 20px;}
  .muted{color:var(--ink-faint);font-size:13px;}
  footer.ft{background:var(--navy);color:#C7D2E4;margin-top:56px;}
  :root[data-theme="dark"] footer.ft{background:#0E1424;}
  .ft-in{max-width:var(--pagina,1560px);margin:0 auto;padding:28px 24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12.5px;}
  .ft-in .brand{color:#fff;font-size:22px;}
  /* --- pagina dettaglio prodotto (PDP) --- */
  .pdp-back{background:none;border:none;color:var(--blu);font-weight:700;font-size:13.5px;padding:4px 0;margin-bottom:14px;cursor:pointer;}
  .pdp{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start;}
  @media(max-width:820px){.pdp{grid-template-columns:1fr;gap:22px;}}
  .pdp-main{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);aspect-ratio:1/1;max-height:640px;width:100%;display:grid;place-items:center;overflow:hidden;}
  .pdp-main img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:14px;box-sizing:border-box;}
  .pdp-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .pdp-thumb{width:64px;height:64px;border-radius:9px;overflow:hidden;border:1.5px solid var(--line);background:var(--surface);padding:0;cursor:pointer;}
  .pdp-thumb.on{border-color:var(--blu);}
  .pdp-thumb img{width:100%;height:100%;object-fit:contain;background:#fff;}
  .pdp-title{font-family:var(--display,var(--sans));font-size:30px;line-height:1.12;margin:8px 0 4px;color:var(--ink);}
  .pdp-sub{color:var(--ink-soft);font-size:15px;margin:0 0 12px;}
  .pdp-desc{white-space:pre-wrap;color:var(--ink);font-size:14.5px;margin:10px 0 18px;}
  .pdp-buy{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:var(--shadow);}
  .pdp-buy .price{font-size:24px;font-weight:800;color:var(--ink);}
  .pdp-buy .add{width:auto;padding:11px 22px;margin-left:auto;}
  .pdp-template{margin-top:18px;background:var(--sand-wash);border:1px solid var(--sand);border-radius:13px;padding:16px;}
  .pdp-tpl-h{font-weight:800;color:var(--ink);font-size:15px;}
  .btn-tpl{display:inline-block;background:var(--sand);color:#1a1300;font-weight:800;font-size:13.5px;padding:10px 16px;border-radius:9px;text-decoration:none;}
  .pdp-specs{margin-top:34px;}
  table.spec{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
  table.spec th{text-align:left;width:38%;padding:11px 15px;background:var(--surface-2);color:var(--ink-soft);font-weight:700;font-size:13.5px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.spec td{padding:11px 15px;color:var(--ink);font-size:14px;border-bottom:1px solid var(--line);}
  table.spec tr:last-child th,table.spec tr:last-child td{border-bottom:none;}
  /* --- scelta spedizione nel carrello --- */
  .ship{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);}
  .ship-h{margin:0 0 10px;font-size:15px;color:var(--ink);}
  .ship-opt{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;}
  .ship-opt.on{border-color:var(--blu);background:var(--blu-wash);}
  .ship-opt input{width:auto;flex:0 0 auto;}
  .ship-txt{flex:1;font-size:14px;color:var(--ink);}
  .ship-price{font-weight:800;color:var(--ink);white-space:nowrap;}
  /* --- carosello homepage --- */
  .carousel{position:relative;width:100%;aspect-ratio:1920/720;max-height:460px;overflow:hidden;background:var(--navy);}
  @media(max-width:700px){.carousel{aspect-ratio:16/10;}}
  .cslide{position:absolute;inset:0;margin:0;opacity:0;transition:opacity .8s ease;pointer-events:none;}
  .cslide.on{opacity:1;pointer-events:auto;}
  .cslide img{width:100%;height:100%;object-fit:cover;display:block;}
  /* --- barra filtri categorie --- */
  .catbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
  .catbar button{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:7px 15px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:all .12s;}
  .catbar button:hover{border-color:var(--blu);color:var(--blu);}
  .catbar button.on{background:var(--blu);color:#fff;border-color:var(--blu);}
  .cslide figcaption{position:absolute;left:0;right:0;bottom:0;padding:24px 26px;background:linear-gradient(to top,rgba(8,13,26,.74),rgba(8,13,26,0));color:#fff;}
  .cslide figcaption b{font-family:var(--display,var(--sans));font-size:23px;display:block;line-height:1.1;}
  .cslide figcaption span{font-size:14px;opacity:.92;}
  .cdots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:2;}
  .cdots button{width:9px;height:9px;border-radius:50%;border:0;background:rgba(255,255,255,.5);cursor:pointer;padding:0;}
  .cdots button.on{background:#fff;}
  .carousel:focus-visible{outline:2px solid var(--blu);outline-offset:-2px;}
  @media (prefers-reduced-motion: reduce){.cslide{transition:none;}}
  /* --- checkout (dati cliente) --- */
  .co-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:640px){.co-grid{grid-template-columns:1fr;}}
  .co-f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-soft);}
  .co-f.co-full{grid-column:1 / -1;}
  /* --- pagina "I miei ordini" --- */
  .ord-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:14px;}
  .ord-riga{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;}
  .ord-riga-h b{color:var(--ink);}
  .ord-files{display:flex;flex-direction:column;gap:6px;}
  .ord-file{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;}
  .ord-file-n{flex:1;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ord-file-n a{color:var(--blu);}
  .ord-file-x{background:none;border:none;color:var(--ink-faint);font-size:18px;cursor:pointer;line-height:1;padding:0 2px;}
  .ord-up{margin-top:auto;background:var(--blu);color:#fff;font-weight:700;font-size:13px;padding:9px;border-radius:8px;text-align:center;cursor:pointer;}
</style>
</head>
<body>
<div id="root"></div>

<script src="config.js"></script>
<script src="lib/react.production.min.js"></script>
<script src="lib/react-dom.production.min.js"></script>
<script src="lib/supabase.js"></script>
<script src="lib/babel.min.js"></script>

<script type="text/babel">
const {useState,useEffect,useMemo}=React;
const CFG=window.GESTIONALE_CONFIG||{};
const sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
const IVA=0.22;
const eur=n=>(Number(n)||0).toLocaleString("it-IT",{style:"currency",currency:"EUR"});
// data stimata = oggi + N giorni LAVORATIVI (salta sabato e domenica)
// consegna: giorni di lavorazione + corriere (giorni lavorativi)
const GG_CORRIERE=2;
function Consegna({g}){
  const n=Number(g)||0; if(!(n>0)) return null;
  return <span className="consegna"><Ico n="truck" s={17} className="ico-t"/>Ricevi entro <b>{dataStimata(n+GG_CORRIERE)}</b>
    <span className="consegna-n">produzione {n} gg lavorativi + corriere {GG_CORRIERE} gg · se approvi la bozza oggi</span></span>;
}
function BadgeVerifica(){
  return <div className="badge-verifica"><Ico n="ok" s={17} sw={1.9}/><span><b>Verifica file gratuita</b> — controlliamo il tuo file e ti mandiamo la bozza prima di stampare</span></div>;
}
const dataStimata=(giorni)=>{ let n=Math.max(0,Number(giorni)||0); const d=new Date(); while(n>0){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w!==0&&w!==6) n--; } return d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"}); };

const CART_KEY="komunigo_cart";
const leggiCart=()=>{try{return JSON.parse(localStorage.getItem(CART_KEY))||[];}catch(e){return [];}};
const scriviCart=c=>{try{localStorage.setItem(CART_KEY,JSON.stringify(c));}catch(e){}};

// ---- sconto B2B (mirror lato client della logica server) ----
const clampPct=n=>{ n=Number(n)||0; return n<0?0:n>100?100:n; };
const eur2=x=>Math.round((Number(x)||0)*100)/100;
// prezzi memorizzati = IVA esclusa (imponibile). Vista con/senza IVA per il cliente.
const conIva=(net,mode)=> mode==="incl"? Math.round((Number(net)||0)*(1+IVA)*100)/100 : (Number(net)||0);
const ivaLbl=mode=> mode==="incl"?"IVA incl.":"IVA escl.";
function scontoPerCat(profilo, categoria){
  if(!profilo || !profilo.b2b) return 0;
  const cat=String(categoria||"").trim().toLowerCase();
  if(cat){ const e=(profilo.sconti_cat||[]).find(x=>String(x.categoria||"").trim().toLowerCase()===cat);
    if(e && e.sconto_pct!=null && e.sconto_pct!=="") return clampPct(e.sconto_pct); }
  if(profilo.sconto_std!=null && profilo.sconto_std!=="") return clampPct(profilo.sconto_std);
  if((profilo.cliente_categoria||"")==="Rivenditore") return clampPct(profilo.sconto_riv_std);
  return 0;
}
const prezzoNet=(listino, profilo, categoria)=>eur2(Number(listino||0)*(1-scontoPerCat(profilo,categoria)/100));

const ORD_KEY="komunigo_ordine_token";   // ultimo ordine del cliente (per "I miei ordini")
const leggiOrdToken=()=>{try{return localStorage.getItem(ORD_KEY)||"";}catch(e){return "";}};
const scriviOrdToken=t=>{try{ if(t) localStorage.setItem(ORD_KEY,t); }catch(e){}};

function App(){
  const urlToken=(()=>{ try{ return new URLSearchParams(window.location.search).get("ordine")||""; }catch(e){ return ""; } })();
  const [vista,setVista]=useState(urlToken?"ordine":"home");
  const [infoSlug,setInfoSlug]=useState("");   // pagina informativa aperta dal footer
  const [ordineToken,setOrdineToken]=useState(urlToken||"");
  const [cart,setCart]=useState(leggiCart);
  useEffect(()=>{scriviCart(cart);},[cart]);
  const addCart=(riga)=>setCart(c=>[...c,{...riga,rid:Date.now()+"-"+Math.random().toString(36).slice(2,7)}]);
  const delCart=(rid)=>setCart(c=>c.filter(r=>r.rid!==rid));
  const nPezzi=cart.reduce((s,r)=>s+(Number(r.quantita)||1),0);
  const apriOrdine=(tok)=>{ if(!tok) return; setOrdineToken(tok); setVista("ordine"); };
  const onOrdineCreato=(tok)=>{ scriviOrdToken(tok); setCart([]); apriOrdine(tok); };
  const ultimoOrd=leggiOrdToken();
  const [catFiltro,setCatFiltro]=useState("");
  const vaiCat=(cat)=>{ setCatFiltro(typeof cat==="string"?cat:""); setVista("catalogo"); };
  const [ricerca,setRicerca]=useState("");
  const cercaIn=(q)=>{ setRicerca(q); if(vista!=="catalogo") setVista("catalogo"); };
  // vista prezzi IVA inclusa/esclusa (default: B2B → esclusa, altrimenti inclusa)
  const [ivaMode,setIvaMode]=useState(()=>{ try{return localStorage.getItem("komunigo_iva")||"";}catch(e){return "";} });
  useEffect(()=>{ try{ if(ivaMode) localStorage.setItem("komunigo_iva",ivaMode); }catch(e){} },[ivaMode]);
  const [sess,setSess]=useState(null);
  const [account,setAccount]=useState(null);
  const [authOpen,setAuthOpen]=useState(false);
  const [authMotivo,setAuthMotivo]=useState("");
  const [aiutoOpen,setAiutoOpen]=useState(false);
  const [focusRicerca,setFocusRicerca]=useState(false);
  const phRicerca=usePlaceholderAnimato(FRASI_RICERCA, !focusRicerca && !ricerca);
  // download riservati (template, tracciati): servono agli altri componenti
  useEffect(()=>{ window.KG_AUTH={ sess, chiedi:(motivo)=>{ setAuthMotivo(motivo||""); setAuthOpen(true); } }; },[sess]);
  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSess(data.session||null));
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSess(s||null));
    return ()=>{ try{ sub.subscription.unsubscribe(); }catch(e){} };
  },[]);
  useEffect(()=>{ (async()=>{
    if(!sess){ setAccount(null); return; }
    try{ const {data}=await sb.from("komunigo_account").select("*").eq("id",sess.user.id).maybeSingle(); setAccount(data||null); }catch(e){ setAccount(null); }
  })(); },[sess]);
  const logout=async()=>{ await sb.auth.signOut(); setAccount(null); setProfiloB2b(null); setVista("home"); };
  const nomeAcc = (account&&(account.ragione_sociale||account.nome||account.azienda)) || (sess&&sess.user.email) || "Account";
  const iva = ivaMode || (account&&account.stato==="b2b"?"escl":"incl");   // vista prezzi effettiva

  // profilo sconti B2B del cliente loggato (per prezzi riservati a magazzino)
  const [profiloB2b,setProfiloB2b]=useState(null);
  useEffect(()=>{ (async()=>{
    if(!account || account.stato!=="b2b"){ setProfiloB2b(null); return; }
    try{ const {data}=await sb.functions.invoke("komunigo-ordine",{body:{action:"profilo-prezzi"}}); setProfiloB2b(data&&data.b2b?data:null); }
    catch(e){ setProfiloB2b(null); }
  })(); },[account]);

  // riordino rapido: ricarica le righe di un ordine passato nel carrello
  const riordina=async(token)=>{
    try{
      const {data}=await sb.functions.invoke("komunigo-ordine",{body:{action:"dettaglio",token}});
      const righe=(data&&data.righe)||[];
      righe.forEach(r=>addCart(r.tipo==="configurabile"
        ? {tipo:"configurabile",prodotto_config_id:r.prodotto_config_id,descrizione:r.descrizione,config:r.config||{},quantita:Number(r.quantita)||1,prezzo_unitario:Number(r.prezzo_unitario)||0,prezzo_totale:Number(r.prezzo_totale)||0}
        : {tipo:"prodotto",articolo_id:r.articolo_id,descrizione:r.descrizione,quantita:Number(r.quantita)||1,prezzo_unitario:Number(r.prezzo_unitario)||0,prezzo_totale:Number(r.prezzo_totale)||0}));
      if(righe.length) setVista("carrello");
    }catch(e){}
  };

  return (
    <div>
      {window.KOMUNIGO_ANTEPRIMA && <div className="anteprima-band"><Ico n="lock" s={15} style={{marginRight:6}}/>ANTEPRIMA INTERNA — sito non pubblico. Il database è quello vero: gli ordini di prova compaiono nel gestionale (scrivi "TEST" nel nome).</div>}
      <header className="top">
        <div className="topline"></div>
        <div className="top-in">
          <button className="brand" onClick={()=>setVista("home")}>Komuni<span className="go">go</span></button>
          <form className="search" onSubmit={e=>{e.preventDefault(); setVista("catalogo");}}>
            <Ico n="search" s={18}/>
            <input value={ricerca} onChange={e=>cercaIn(e.target.value)} placeholder={phRicerca} aria-label="Cerca prodotti e lavorazioni"
              onFocus={()=>setFocusRicerca(true)} onBlur={()=>setFocusRicerca(false)}/>
            {ricerca && <button type="button" className="search-x" onClick={()=>setRicerca("")} aria-label="Pulisci">×</button>}
          </form>
          <nav className="main">
            <button className={vista==="catalogo"?"on":""} onClick={()=>vaiCat("")}>Catalogo</button>
            <button className={"nav-promo"+(vista==="promo"?" on":"")} onClick={()=>{ setVista("promo"); try{ window.scrollTo(0,0); }catch(e){} }}><Ico n="percent" s={15} style={{marginRight:5}}/>Promozioni</button>
            {(!sess && (ultimoOrd||ordineToken)) && <button className={vista==="ordine"?"on":""} onClick={()=>apriOrdine(ordineToken||ultimoOrd)}>I miei ordini</button>}
            {sess
              ? <button className={vista==="account"?"on":""} onClick={()=>setVista("account")}><Ico n="user" s={17} className="ico-t" style={{color:"inherit"}}/>{nomeAcc}</button>
              : <button onClick={()=>setAuthOpen(true)}>Accedi</button>}
          </nav>
          <button className="aiuto-btn" onClick={()=>setAiutoOpen(true)}><Ico n="help" s={18} style={{marginRight:6}}/>Hai bisogno di aiuto?</button>
          <button className="cart-btn" onClick={()=>setVista("carrello")}><Ico n="cart" s={18} style={{marginRight:6}}/>Carrello
            {cart.length>0 && <span className="cart-imp">{eur(conIva(cart.reduce((t,r)=>t+(Number(r.prezzo_totale)||0),0),iva))}</span>}
            {cart.length>0 && <span className="cart-badge" title={nPezzi+" pezzi in totale"}>{cart.length}</span>}</button>
        </div>
      </header>
      <div className="band-panna"></div>

      {vista==="home"     && <Home vaiCatalogo={vaiCat} vaiPackaging={()=>{ setVista("packaging"); try{ window.scrollTo(0,0); }catch(e){} }}/>}
      {vista!=="home" && <div className={"wrap"+(vista==="catalogo"?" wrap-wide":"")}>
        {vista==="catalogo" && <Catalogo addCart={addCart} catInit={catFiltro} profilo={profiloB2b} vaiGuida={()=>setVista("guida")} ricerca={ricerca} setRicerca={setRicerca} iva={iva} setIva={setIvaMode}/>}
        {vista==="carrello" && <Carrello cart={cart} delCart={delCart} vaiCatalogo={()=>setVista("catalogo")} onOrdineCreato={onOrdineCreato} account={account} profilo={profiloB2b}/>}
        {vista==="ordine" && <OrdinePagina token={ordineToken||ultimoOrd} vaiCatalogo={()=>setVista("catalogo")}/>}
        {vista==="account" && <AccountPagina account={account} sess={sess} onLogout={logout} vaiCatalogo={()=>vaiCat("")} apriOrdine={apriOrdine} onAccountChange={setAccount} riordina={riordina}/>}
        {vista==="guida" && <LineeGuida vaiCatalogo={()=>setVista("catalogo")}/>}
        {vista==="info" && <PaginaInfo slug={infoSlug} vaiCatalogo={()=>vaiCat("")}/>}
        {vista==="promo" && <PaginaPromozioni sess={sess} account={account} onAccountChange={setAccount}/>}
        {vista==="packaging" && <PaginaPackaging vaiCatalogo={vaiCat} addCart={addCart} iva={iva} setIva={setIvaMode}/>}
      </div>}

      {aiutoOpen && <AiutoModal onClose={()=>setAiutoOpen(false)} vaiFaq={()=>{ setAiutoOpen(false); setInfoSlug("faq"); setVista("info"); try{ window.scrollTo(0,0); }catch(e){} }}/>}
      {authOpen && <AuthModal motivo={authMotivo} onClose={()=>{ setAuthOpen(false); setAuthMotivo(""); }}/>}

      <FooterKomunigo vai={k=>{
        if(k==="@guida") setVista("guida");
        else if(k==="@ordini"){ if(sess) setVista("account"); else if(ordineToken||ultimoOrd) apriOrdine(ordineToken||ultimoOrd); else setAuthOpen(true); }
        else { setInfoSlug(k==="@tecniche"?"tecniche":k); setVista("info"); }
        try{ window.scrollTo(0,0); }catch(e){}
      }}/>
    </div>
  );
}

// =====================================================================
//  PAGINE INFORMATIVE + FOOTER (2026-10-14)
//  Testi scritti per Komunigo (prima stesura, da rivedere con Giulio).
//  Le pagine legali derivano da Pagine-Legali-BOZZA.html: vanno validate da
//  legale/commercialista prima della messa online (PAGINE_LEGALI_BOZZA=true
//  mostra l'avviso). Dati aziendali forniti da Giulio il 2026-10-14.
// =====================================================================
const PAGINE_LEGALI_BOZZA=true;
const DATI_AZIENDA={
  ragione:"Creatio S.r.l.", marchio:"Komunigo",
  sedeLegale:"Via dei Prati Fiscali 289, 00141 Roma", sedeOperativa:"Via Vaccareccia 51, 00071 Pomezia (RM)",
  piva:"15790001000", rea:"RM-1614205", capitale:"€ 10.000,00 i.v.", email:"info@komunigo.it", pec:"creatiogroup@pec.it", tel:"06 9105683",
};
const PAGINE_INFO={
  "come-funziona":{gruppo:"Ordinare", titolo:"Come funziona", intro:"Dal tuo logo al prodotto finito, in quattro passaggi. Ti seguiamo noi in ognuno.",
    sezioni:[

// =====================================================================
//  TRACCIATO FUSTELLA delle scatole (Fase 2) — JS puro, condiviso tra
//  negozio Komunigo e gestionale (stesso codice nei due file).
//  Geometria in mm, origine in alto a sinistra. Ogni pezzo:
//  {nome, w, h, cut:[[x1,y1,x2,y2]...], fold:[...], label:[{x,y,t}]}
//  Coerente con sviluppoScatola() del motore prezzi (colla/linguette 15 mm).
//  ⚠ Prima stesura: da verificare su un campione reale prima della produzione.
// =====================================================================
const TRACCIATO_MODELLI={astuccio:"Astuccio con alette a incastro",fondo_automatico:"Astuccio con fondo automatico",fondo_coperchio:"Scatola fondo e coperchio",americana:"Scatola americana (FEFCO 0201)"};
function tracciatoScatola(modello,A,B,H,t){
  A=Number(A)||0; B=Number(B)||0; H=Number(H)||0; t=Number(t)||0;
  const r1=n=>Math.round(n*10)/10;
  const nuovo=nome=>({nome,w:0,h:0,cut:[],fold:[],label:[]});
  const seg=(arr,a,b)=>arr.push([r1(a[0]),r1(a[1]),r1(b[0]),r1(b[1])]);
  const pl=(arr,pts)=>{ for(let i=0;i<pts.length-1;i++) seg(arr,pts[i],pts[i+1]); };
  const lab=(p,x,y,s)=>p.label.push({x:r1(x),y:r1(y),t:s});

  // ---- astucci (alette a incastro / fondo automatico) ----
  if(modello==="astuccio"||modello==="fondo_automatico"){
    const p=nuovo("Astuccio");
    const Ap=A+t, Bp=B+t, Hp=H+2*t, g=15, L=15, c=4, d=Math.max(8,Math.round(Bp*0.55));
    const X0=g, X1=X0+Ap, X2=X1+Bp, X3=X2+Ap, X4=X3+Bp, Yt=Bp+L, Yb=Yt+Hp;
    const dust=(xa,xb,y,dir)=>{ pl(p.cut,[[xa,y],[xa+2,y+dir*(d-c)],[xa+2+c,y+dir*d],[xb-3*c,y+dir*d],[xb,y+dir*Math.round(d*0.35)],[xb,y]]); seg(p.fold,[xa,y],[xb,y]); };
    const lid=(xa,xb,y,dir)=>{ pl(p.cut,[[xa,y],[xa,y+dir*Bp],[xa+c,y+dir*(Bp+L)],[xb-c,y+dir*(Bp+L)],[xb,y+dir*Bp],[xb,y]]); seg(p.fold,[xa,y],[xb,y]); seg(p.fold,[xa,y+dir*Bp],[xb,y+dir*Bp]); };
    // aletta colla + pieghe verticali + bordo destro
    pl(p.cut,[[X0,Yt],[0,Yt+8],[0,Yb-8],[X0,Yb]]);
    [X0,X1,X2,X3].forEach(x=>seg(p.fold,[x,Yt],[x,Yb]));
    seg(p.cut,[X4,Yt],[X4,Yb]);
    // sopra: coperchio a incastro sul fronte (pannello 3) + alette antipolvere sui lati
    seg(p.cut,[X0,Yt],[X1,Yt]); dust(X1,X2,Yt,-1); lid(X2,X3,Yt,-1); dust(X3,X4,Yt,-1);
    let hTot=Yb+Bp+L;
    if(modello==="astuccio"){   // sotto: incastro sul retro (alette alternate)
      lid(X0,X1,Yb,1); dust(X1,X2,Yb,1); seg(p.cut,[X2,Yb],[X3,Yb]); dust(X3,X4,Yb,1);
      lab(p,(X0+X1)/2,Yb+Bp/2,"FONDO");
    }else{                      // sotto: fondo automatico (crash-lock) su tutti e 4 i pannelli
      const dA=Math.round(Bp*0.75)+10, dB=Math.max(8,Math.round(Bp*0.5));
      [[X0,X1],[X2,X3]].forEach(([xa,xb])=>{ pl(p.cut,[[xa,Yb],[xa+3,Yb+dA],[xb-3,Yb+dA],[xb,Yb]]); seg(p.fold,[xa,Yb],[xb,Yb]);
        seg(p.fold,[xa+Math.min(Ap,Bp)*0.15,Yb],[xa+Math.min(Ap*0.5,dA),Yb+Math.min(dA,Ap*0.5)]); });
      [[X1,X2],[X3,X4]].forEach(([xa,xb])=>{ pl(p.cut,[[xa,Yb],[xa+3,Yb+dB],[xb-dB*0.6,Yb+dB],[xb,Yb+dB*0.4],[xb,Yb]]); seg(p.fold,[xa,Yb],[xb,Yb]);
        seg(p.fold,[xa,Yb],[xa+Math.min(Bp*0.8,dB*0.9),Yb+dB*0.9]); });
      hTot=Yb+dA;
      lab(p,(X0+X1)/2,Yb+dA/2,"FONDO AUTOMATICO");
    }
    lab(p,X0/2,(Yt+Yb)/2,"COLLA"); lab(p,(X0+X1)/2,(Yt+Yb)/2,"RETRO"); lab(p,(X1+X2)/2,(Yt+Yb)/2,"LATO");
    lab(p,(X2+X3)/2,(Yt+Yb)/2,"FRONTE"); lab(p,(X3+X4)/2,(Yt+Yb)/2,"LATO"); lab(p,(X2+X3)/2,Yt-Bp/2,"COPERCHIO");
    p.w=r1(X4); p.h=r1(hTot);
    return [p];
  }
  // ---- americana FEFCO 0201 ----
  if(modello==="americana"){
    const p=nuovo("Scatola");
    const Ap=A+t, Bp=B+t, Hp=H+2*t, g=35, f=Math.round(Bp/2);
    const X0=g, X1=X0+Ap, X2=X1+Bp, X3=X2+Ap, X4=X3+Bp, Yt=f, Yb=Yt+Hp, Ht=Yb+f;
    pl(p.cut,[[X0,Yt],[0,Yt+10],[0,Yb-10],[X0,Yb]]);
    pl(p.cut,[[X0,Yt],[X0,0],[X4,0],[X4,Ht],[X0,Ht],[X0,Yb]]);
    [X1,X2,X3].forEach(x=>{ seg(p.cut,[x,0],[x,Yt]); seg(p.cut,[x,Yb],[x,Ht]); });   // fessure tra le patelle
    [X0,X1,X2,X3].forEach(x=>seg(p.fold,[x,Yt],[x,Yb]));
    seg(p.fold,[X0,Yt],[X4,Yt]); seg(p.fold,[X0,Yb],[X4,Yb]);
    lab(p,X0/2,(Yt+Yb)/2,"COLLA"); ["FRONTE","LATO","RETRO","LATO"].forEach((s,i)=>{ const xs=[X0,X1,X2,X3,X4]; lab(p,(xs[i]+xs[i+1])/2,(Yt+Yb)/2,s); lab(p,(xs[i]+xs[i+1])/2,Yt/2,"PATELLA"); lab(p,(xs[i]+xs[i+1])/2,Yb+f/2,"PATELLA"); });
    p.w=r1(X4); p.h=r1(Ht);
    return [p];
  }
  // ---- fondo e coperchio: due vassoi ----
  const vassoio=(nome,a,b,h)=>{
    const p=nuovo(nome), L=15;
    const W=2*h+a, Ht=2*L+2*h+b, yA=L+h, yB=L+h+b;
    pl(p.cut,[[h,0],[h+a,0],[h+a,L],[W-3,L+5],[W-3,yA],[W,yA],[W,yB],[W-3,yB],[W-3,yB+h-5],[h+a,yB+h],[h+a,Ht],[h,Ht],[h,yB+h],[3,yB+h-5],[3,yB],[0,yB],[0,yA],[3,yA],[3,L+5],[h,L],[h,0]]);
    seg(p.cut,[0,yA],[h,yA]); seg(p.cut,[0,yB],[h,yB]); seg(p.cut,[h+a,yA],[W,yA]); seg(p.cut,[h+a,yB],[W,yB]);   // tagli che separano le alette d'angolo
    pl(p.fold,[[h,yA],[h+a,yA],[h+a,yB],[h,yB],[h,yA]]);                    // fondo del vassoio
    seg(p.fold,[h,L],[h+a,L]); seg(p.fold,[h,yB+h],[h+a,yB+h]);             // bordini ripiegati
    seg(p.fold,[h,L],[h,yA]); seg(p.fold,[h+a,L],[h+a,yA]); seg(p.fold,[h,yB],[h,yB+h]); seg(p.fold,[h+a,yB],[h+a,yB+h]);   // alette d'angolo
    lab(p,h+a/2,(yA+yB)/2,nome.toUpperCase()); lab(p,h/2,(yA+yB)/2,"FIANCO"); lab(p,h+a+h/2,(yA+yB)/2,"FIANCO");
    lab(p,h+a/2,L+h/2,"TESTATA"); lab(p,h+a/2,yB+h/2,"TESTATA");
    p.w=r1(W); p.h=r1(Ht); return p;
  };
  const hc=Math.max(15,Math.round(H*0.75));
  return [vassoio("Fondo",A+t,B+t,H+t), vassoio("Coperchio",A+3*t+2,B+3*t+2,hc)];
}
// PDF vettoriale (1 pagina, pezzi affiancati), senza librerie. Testo solo ASCII.
function pdfTracciato(pezzi, righe){
  const mm=72/25.4, M=15, GAP=20, HEAD=26, FOOT=14;
  const Wmm=pezzi.reduce((s,p)=>s+p.w,0)+GAP*(pezzi.length-1)+2*M;
  const Hmm=Math.max(...pezzi.map(p=>p.h))+2*M+HEAD+FOOT;
  const PW=(Wmm*mm).toFixed(2), PH=(Hmm*mm).toFixed(2);
  const asc=s=>String(s).replace(/[×]/g,"x").replace(/[àá]/g,"a").replace(/[èé]/g,"e").replace(/[ìí]/g,"i").replace(/[òó]/g,"o").replace(/[ùú]/g,"u").replace(/[^\x20-\x7E]/g,"").replace(/([()\\])/g,"\\$1");
  const X=x=>(x*mm).toFixed(2), Y=y=>((Hmm-y)*mm).toFixed(2);
  const ops=[];
  const testo=(x,y,s,sz,col,centro)=>{ const w=centro? asc(s).length*sz*0.27 : 0;
    ops.push(`BT /F1 ${sz} Tf ${col} rg ${(x*mm-w).toFixed(2)} ${Y(y)} Td (${asc(s)}) Tj ET`); };
  (righe||[]).forEach((r,i)=>testo(M,M+5+i*6,r,i===0?13:9,i===0?"0.1 0.1 0.1":"0.3 0.3 0.3",false));
  let ox=M; const oy=M+HEAD;
  pezzi.forEach(p=>{
    ops.push("1 J 1 j");
    ops.push("0.85 0 0.1 RG 0.6 w [] 0 d");
    p.cut.forEach(([x1,y1,x2,y2])=>ops.push(`${X(ox+x1)} ${Y(oy+y1)} m ${X(ox+x2)} ${Y(oy+y2)} l S`));
    ops.push("0 0.45 0.85 RG 0.6 w [4 3] 0 d");
    p.fold.forEach(([x1,y1,x2,y2])=>ops.push(`${X(ox+x1)} ${Y(oy+y1)} m ${X(ox+x2)} ${Y(oy+y2)} l S`));
    ops.push("[] 0 d");
    p.label.forEach(l=>testo(ox+l.x,oy+l.y+1.5,l.t,7,"0.55 0.55 0.55",true));
    testo(ox+p.w/2,oy+p.h+8,`${p.nome}: ${p.w} x ${p.h} mm`,8,"0.25 0.25 0.25",true);
    ox+=p.w+GAP;
  });
  // legenda
  const ly=Hmm-M+2;
  ops.push(`0.85 0 0.1 RG 0.8 w [] 0 d ${X(M)} ${Y(ly)} m ${X(M+12)} ${Y(ly)} l S`); testo(M+14,ly+1.2,"TAGLIO",7,"0.3 0.3 0.3",false);
  ops.push(`0 0.45 0.85 RG 0.8 w [4 3] 0 d ${X(M+40)} ${Y(ly)} m ${X(M+52)} ${Y(ly)} l S [] 0 d`); testo(M+54,ly+1.2,"PIEGA / CORDONATURA",7,"0.3 0.3 0.3",false);
  testo(M+100,ly+1.2,"Tracciato indicativo generato da komunigo.it - abbondanza grafica consigliata 3 mm oltre il taglio",7,"0.45 0.45 0.45",false);
  const stream=ops.join("\n");
  const objs=["<< /Type /Catalog /Pages 2 0 R >>","<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>`,
    `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`,"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>"];
  let out="%PDF-1.4\n"; const off=[];
  objs.forEach((o,i)=>{ off.push(out.length); out+=`${i+1} 0 obj\n${o}\nendobj\n`; });
  const xr=out.length;
  out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
  return new Blob([out],{type:"application/pdf"});
}
function scaricaTracciato(modello,A,B,H,t,materiale){
  const pezzi=tracciatoScatola(modello,A,B,H,t);
  const righe=[`${TRACCIATO_MODELLI[modello]||"Scatola"} - interno ${A} x ${B} x ${H} mm`,
    `Materiale: ${materiale||"-"} (spessore ${t} mm)  -  Steso: ${pezzi.map(p=>p.nome+" "+p.w+" x "+p.h+" mm").join("  +  ")}`];
  const blob=pdfTracciato(pezzi,righe);
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`tracciato-${modello}-${A}x${B}x${H}.pdf`; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
}

function TracciatoSvg({modello,A,B,H,t}){
  const pezzi=tracciatoScatola(modello,A,B,H,t);
  const GAP=20, W=pezzi.reduce((s,p)=>s+p.w,0)+GAP*(pezzi.length-1), Hm=Math.max(...pezzi.map(p=>p.h));

        <g key={i} transform={`translate(${x},0)`}>
          {p.cut.map((l,j)=><line key={"c"+j} x1={l[0]} y1={l[1]} x2={l[2]} y2={l[3]} className="tr-cut"/>)}
          {p.fold.map((l,j)=><line key={"f"+j} x1={l[0]} y1={l[1]} x2={l[2]} y2={l[3]} className="tr-fold"/>)}
          {p.label.map((l,j)=><text key={"t"+j} x={l.x} y={l.y} textAnchor="middle" className="tr-lab" style={{fontSize:Math.max(6,Math.min(W,Hm)/28)}}>{l.t}</text>)}

const modelloScatola=p=> p.scatola_modello || (/americana/i.test(p.nome)?"americana":/coperchio/i.test(p.nome)?"fondo_coperchio":/automatico/i.test(p.nome)?"fondo_automatico":"astuccio");

// =====================================================================
//  SCATOLE (tipo 'scatola', v20): configuratore stile "modello + misure".
//  Il prezzo (foglio steso, pose, fogli, taglio plotter/fustella) lo calcola
//  SOLO il server (hyper-endpoint con {scatola:{A,B,H,lati}}).
// =====================================================================
const SCATOLA_STAMPA=[[0,"Senza stampa"],[1,"Stampa esterna"],[2,"Esterna e interna"]];
// piccolo disegno isometrico della scatola con le misure (proporzionato)
// disegno isometrico della scatola con QUOTE COLORATE (A blu, B arancio, H verde),
// gli stessi colori dei campi misura: il cliente vede subito quale lato è quale
const SC_COL={A:"#3b5bdb",B:"#e8590c",H:"#0ca678"};
function ScatolaDisegno({A,B,H,logo}){
  // prospettiva "cavaliera": fronte A×H vero, profondità B a 30° ridotta a 0,6
  const a=Math.max(1,Number(A)||1), b=Math.max(1,Number(B)||1), h=Math.max(1,Number(H)||1);
  const VW=280, VH=230, L=58, R=44, T=18, Bm=40;                 // riquadro e margini per le quote
  const cs=Math.cos(Math.PI/6)*0.6, sn=Math.sin(Math.PI/6)*0.6;
  const k=Math.min((VW-L-R)/(a+b*cs), (VH-T-Bm)/(h+b*sn));
  const W=a*k, Hh=h*k, dx=b*k*cs, dy=b*k*sn;
  const x0=L+((VW-L-R)-(W+dx))/2, yb=T+dy+Hh+((VH-T-Bm)-(Hh+dy))/2, y0=yb-Hh;   // fronte: (x0,y0)-(x0+W,yb)
  const P=pts=>pts.map(p=>p.map(n=>Math.round(n*10)/10).join(",")).join(" ");
  // quota: linea con due tacche + etichetta colorata
  const quota=(x1,y1,x2,y2,c,lab,lx,ly)=>{ const ang=Math.atan2(y2-y1,x2-x1), nx=-Math.sin(ang)*5, ny=Math.cos(ang)*5;
    const tw=lab.length*6.4+12;
    return (<g>
      <line x1={x1} y1={y1} x2={x2} y2={y2} stroke={c} strokeWidth="2"/>
      <line x1={x1-nx} y1={y1-ny} x2={x1+nx} y2={y1+ny} stroke={c} strokeWidth="2"/>
      <line x1={x2-nx} y1={y2-ny} x2={x2+nx} y2={y2+ny} stroke={c} strokeWidth="2"/>
      <rect x={lx-tw/2} y={ly-9} width={tw} height="18" rx="9" fill={c}/>
      <text x={lx} y={ly+4} textAnchor="middle" className="sf-ql">{lab}</text></g>); };
  const g=8;   // distanza delle quote dagli spigoli
  return (
    <svg viewBox={`0 0 ${VW} ${VH}`} className="scatola-svg" role="img" aria-label={`Scatola ${a}×${b}×${h} mm`}>
      <polygon points={P([[x0,y0],[x0+W,y0],[x0+W+dx,y0-dy],[x0+dx,y0-dy]])} className="sf-top"/>
      <line x1={x0+dx/2} y1={y0-dy/2} x2={x0+W+dx/2} y2={y0-dy/2} className="sf-seam"/>
      <polygon points={P([[x0+W,y0],[x0+W+dx,y0-dy],[x0+W+dx,yb-dy],[x0+W,yb]])} className="sf-side"/>
      <polygon points={P([[x0,y0],[x0+W,y0],[x0+W,yb],[x0,yb]])} className="sf-front"/>
      {logo && <image href={logo} x={x0+W*0.15} y={y0+Hh*0.18} width={W*0.7} height={Hh*0.64} preserveAspectRatio="xMidYMid meet"/>}
      {quota(x0, yb+g+4, x0+W, yb+g+4, SC_COL.A, "A "+a, x0+W/2, yb+g+20)}
      {quota(x0+W+g*0.6, yb+g*0.6, x0+W+dx+g*0.6, yb-dy+g*0.6, SC_COL.B, "B "+b, x0+W+dx/2+g+18, yb-dy/2+g+12)}
      {quota(x0-g-4, y0, x0-g-4, yb, SC_COL.H, "H "+h, x0-g-24, (y0+yb)/2)}
    </svg>);
}

function usePlaceholderAnimato(frasi, attivo){
  const [t,setT]=useState(frasi[0]);
  useEffect(()=>{
    if(!attivo) return;
    const fermo = typeof window!=="undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(fermo){ setT(frasi[0]); return; }
    let i=0, c=0, giu=false, tm;
    const passo=()=>{ const f=frasi[i];
      if(!giu){ c++; setT(f.slice(0,c)); if(c>=f.length){ giu=true; tm=setTimeout(passo,1900); return; } tm=setTimeout(passo,60); }
      else { c--; setT(f.slice(0,c)); if(c<=0){ giu=false; i=(i+1)%frasi.length; tm=setTimeout(passo,350); return; } tm=setTimeout(passo,22); } };
    tm=setTimeout(passo,500);
    return ()=>clearTimeout(tm);
  },[attivo]);
  return attivo? (t+"|") : "Cerca prodotti, lavorazioni…";
}

// carosello a scorrimento automatico (banda sotto l'hero)
function Carosello({items}){
  const [i,setI]=useState(0);
  const [paused,setPaused]=useState(false);
  const [touchX,setTouchX]=useState(null);
  const n=items.length;
  const reduce = typeof window!=="undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  useEffect(()=>{
    if(n<2 || paused || reduce) return;
    const t=setInterval(()=>setI(x=>(x+1)%n), 5000);
    return ()=>clearInterval(t);
  },[n,paused,reduce]);
  useEffect(()=>{ if(i>=n) setI(0); },[n,i]);
  if(!n) return null;
  const vai=d=>setI(x=>((x+d)%n+n)%n);
  const onTS=e=>setTouchX(e.touches[0].clientX);
  const onTE=e=>{ if(touchX==null) return; const dx=e.changedTouches[0].clientX-touchX; if(Math.abs(dx)>40) vai(dx<0?1:-1); setTouchX(null); };
  return (
    <div className="carousel" tabIndex={0} onMouseEnter={()=>setPaused(true)} onMouseLeave={()=>setPaused(false)}
      onTouchStart={onTS} onTouchEnd={onTE}
      onKeyDown={e=>{ if(e.key==="ArrowRight") vai(1); if(e.key==="ArrowLeft") vai(-1); }}
      aria-roledescription="carosello">
      {items.map((it,idx)=>(
        <figure className={"cslide "+(idx===i?"on":"")} key={it.id} aria-hidden={idx!==i}>
          <img src={kPubShop(it.path)} alt={it.titolo||""}/>
          {(it.titolo||it.sottotitolo) && <figcaption><b>{it.titolo}</b>{it.sottotitolo?<span>{it.sottotitolo}</span>:null}</figcaption>}
        </figure>
      ))}
      {n>1 && <div className="cdots">{items.map((_,idx)=>
        <button key={idx} className={idx===i?"on":""} onClick={()=>setI(idx)} aria-label={"Vai alla foto "+(idx+1)}/>)}</div>}
    </div>
  );
}

  })(); },[]);
  useEffect(()=>{ (async()=>{
    try{ const {data}=await sb.from("komunigo_lavori_pub").select("*").order("ordine"); setLavori(data||[]); }catch(e){}
  })(); },[]);
  useEffect(()=>{ (async()=>{
    try{ const {data}=await sb.from("komunigo_carosello_pub").select("*").order("ordine"); setCarosello(data||[]); }catch(e){}
  })(); },[]);

  return (
    <div>
      <section className="hero">
        <div className="hero-in">
          <div>
            <span className="tag">Stampa · Insegne · Allestimenti</span>
            <h1>La tua comunicazione, stampata e <em>installata</em> come si deve.</h1>
            <p>Le lavorazioni che garantiamo ogni giorno e i prodotti in casa. E ciò che i giganti non fanno: montiamo noi, sul posto.</p>
            <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
              <button className="btn" onClick={vaiCatalogo}>Vai al catalogo →</button>
              <button className="btn ghost" style={{color:"#fff",borderColor:"#6FA8E0"}} onClick={vaiCatalogo}>Configura su misura</button>
            </div>
          </div>
          <div className="promo">
            <div className="k">Sconti a quantità</div>
            <div className="big">fino al <b>−40%</b></div>
            <p>Più pezzi ordini, più risparmi. Il prezzo scende da solo nel configuratore.</p>
          </div>
        </div>
      </section>

      <div className="in"><BarraFiducia/></div>

      {carosello.length>0 && <Carosello items={carosello}/>}

      <div className="in">
        <div className="head"><div><h2 className="sec">Cosa stampiamo</h2><p className="sec-sub">Scegli la categoria e parti.</p></div><button className="lnk" onClick={vaiCatalogo}>Tutto il catalogo →</button></div>
        <div className="cats">
          {CATEGORIE_HOME.map(([ic,t,s,dest])=>(
            <button className="cat" key={t} onClick={()=>dest==="packaging"? (vaiPackaging&&vaiPackaging()) : vaiCatalogo(dest)}><div className="ic"><Ico n={ic} s={44} sw={1.35}/></div><h4>{t}</h4><p>{s}</p></button>
          ))}
        </div>

        <div className="head"><div><h2 className="sec">In evidenza</h2><p className="sec-sub">Pronti a magazzino, disponibilità reale.</p></div><button className="lnk" onClick={vaiCatalogo}>Vedi tutti →</button></div>
        {evid===null ? <div className="empty">Carico…</div>
          : evid.length===0
            ? <p className="muted">Presto in vetrina: nel gestionale spunta “vendibile” su qualche articolo, con prezzo pubblico e foto.</p>
            : <div className="grid">{evid.map(p=>{ const disp=Number(p.disponibile)||0; return (
                <div className="card" key={p.id}>
                  <div className="ph">{Array.isArray(p.foto_urls)&&p.foto_urls[0]?<img src={p.foto_urls[0]} alt={p.nome}/>:<Ico n="box" s={56} sw={1.1} className="ph-ico"/>}</div>
                  <div className="bd">{p.categoria && <span className="cat-l">{p.categoria}</span>}<h3>{p.nome}</h3>
                    <div className="row"><span className="price">{eur(p.prezzo)}</span><span className={"avail "+(disp>0?"ok":"no")}>{disp>0?disp+" disp.":"Esaurito"}</span></div>
                    <button className="add" onClick={vaiCatalogo}>Vai al catalogo</button></div>
                </div>); })}</div>}

        <div className="head"><div><h2 className="sec">Offerte &amp; convenienza</h2><p className="sec-sub">Prezzi onesti, e più risparmi sui volumi.</p></div><span></span></div>
        <div className="banners">
          <div className="ban big"><span className="imgtag">[ foto lavoro ]</span><span className="k">Sconti a scaglioni</span><h3>Più ne fai, meno costano</h3><p>Il configuratore applica lo sconto quantità in automatico — lo vedi prima di ordinare.</p></div>
          <div className="ban s1"><span className="imgtag">[ foto ]</span><span className="k">Ogni settimana</span><h3>In offerta</h3><p>Una lavorazione a prezzo speciale.</p></div>
          <div className="ban s2"><span className="imgtag">[ foto ]</span><span className="k">Consegna</span><h3>Ritiro gratis</h3><p>Ritira in sede o spedizione tracciata.</p></div>
        </div>

        <div className="head"><div><h2 className="sec">Fatti da noi, installati da noi</h2><p className="sec-sub">Il pezzo che i grandi portali non hanno: montaggio, sopralluogo, servizio locale.</p></div><span></span></div>
        <div className="works">
          {lavori.length>0
            ? lavori.map(l=>(
                <div className="work" key={l.id} style={l.path?{background:"#16233b"}:{background:"linear-gradient(160deg,#2E6FB0,#16233b)"}}>
                  {l.path && <img src={kPubShop(l.path)} alt={l.titolo||""} style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover"}}/>}
                  {l.path && <div style={{position:"absolute",inset:0,background:"linear-gradient(to top,rgba(10,16,30,.78),rgba(10,16,30,0) 55%)"}}/>}
                  <b style={{position:"relative"}}>{l.titolo}</b><span style={{position:"relative"}}>{l.sottotitolo}</span>
                </div>))
            : <>
                <div className="work w1"><span className="imgtag">[ foto reale ]</span><b>Insegna luminosa</b><span>Negozio · centro città</span></div>
                <div className="work w2"><span className="imgtag">[ foto reale ]</span><b>Allestimento fiera</b><span>Stand 6×4</span></div>
                <div className="work w3"><span className="imgtag">[ foto reale ]</span><b>Vetrofania</b><span>Vetrina completa</span></div>
                <div className="work w4"><span className="imgtag">[ foto reale ]</span><b>Totem &amp; grande formato</b><span>Evento sportivo</span></div>
              </>}
        </div>

        <div className="head"><div><h2 className="sec">Come funziona</h2><p className="sec-sub">Semplice, dall'ordine alla posa.</p></div><span></span></div>
        <div className="steps">
          {[["1","Configura","Misure, materiale, file. Prezzo subito."],["2","Paga sicuro","Carta gestita da Nexi. I dati non passano dal sito."],["3","Produciamo","L'ordine entra in produzione da noi."],["4","Consegna o posa","Spedizione, ritiro, o installazione sul posto."]].map(([n,t,p])=>(
            <div className="step" key={n}><div className="n">{n}</div><h4>{t}</h4><p>{p}</p></div>
          ))}
        </div>
      </div>
    </div>
  );
}

// =====================================================================
//  COLONNE LATERALI DEL CATALOGO (solo schermi larghi)
//  sinistra: menu "Tutti i prodotti" in ordine alfabetico; destra: foto in loop
// =====================================================================
// sotto-categorie dei cataloghi fornitore (arrivano in inglese) → italiano
const SUB_IT={"T-shirt":"T-shirt","Sweatshirt":"Felpe","Pique":"Polo piqué","Polo":"Polo","Shirt":"Camicie","Vest":"Gilet",
  "Jackets":"Giacche","Softshell Jacket":"Giacche softshell","Fleece Jacket":"Pile","Winter jacket":"Giacconi invernali","Shell Jacket":"Giacche tecniche",
  "Rain jacket":"Giacche antipioggia","Jackets and Vests":"Giacche e gilet","Knitted Sweater":"Maglioni","Pants":"Pantaloni","Shorts":"Bermuda e shorts",
  "Cap":"Cappellini","Hat":"Cappelli","Accessories":"Accessori","Backpack":"Zaini","Sportbag":"Borse sportive","Laptop Bag":"Borse porta PC",
  "Travelbag":"Borse da viaggio","Borse":"Borse"};
const tradSub=x=>SUB_IT[x]||x||"";
const BORSE_SUB=new Set(["Backpack","Sportbag","Laptop Bag","Travelbag","Borse"]);
const eBorsa=c=> BORSE_SUB.has(c.sottocategoria) || (!c.sottocategoria && /bag|zain|borsa/i.test(c.nome||""));
// menu laterale stile "tutti i prodotti": CATEGORIE e loro VOCI (tipi), in ordine alfabetico
function MenuTuttiProdotti({gruppi, attivo, onScegli}){
  const [open,setOpen]=useState(true);
  const [f,setF]=useState("");
  const q=f.trim().toLowerCase();
  const lista=gruppi.map(g=>({...g, voci:g.voci.filter(v=>!q || v.nome.toLowerCase().includes(q) || g.nome.toLowerCase().includes(q))}))
    .filter(g=>!q || g.voci.length || g.nome.toLowerCase().includes(q));
  return (
    <nav className="side-menu" aria-label="Tutti i prodotti">
      <button type="button" className="side-head" onClick={()=>setOpen(o=>!o)} aria-expanded={open}>
        <span><Ico n="menu" s={17} style={{marginRight:8}}/>Tutti i prodotti</span><span className="side-car">{open?"▴":"▾"}</span></button>
      {open && <>
        <input className="side-filtro" placeholder="Cerca un tipo di prodotto…" value={f} onChange={e=>setF(e.target.value)}/>
        <div className="side-list">
          <button type="button" className={"side-item side-tutto"+(!attivo?" on":"")} onClick={()=>onScegli(null)}>Tutto il catalogo</button>
          {lista.map(g=>(
            <div key={g.k} className="side-gr">
              <button type="button" className={"side-gr-h"+(attivo===g.k?" on":"")} onClick={()=>onScegli(g)}>{g.nome}</button>
              {g.voci.map(v=><button type="button" key={v.k} className={"side-item"+(attivo===v.k?" on":"")} onClick={()=>onScegli(v)} title={v.nome}>{v.nome}</button>)}
            </div>))}
          {lista.length===0 && <div className="muted" style={{fontSize:12.5,padding:"6px 10px"}}>Nessun tipo di prodotto.</div>}
        </div>
      </>}
    </nav>);
}
function FotoLoop({foto, onApri}){
  if(!foto.length) return null;
  const reduce = typeof window!=="undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const lista = reduce? foto : [...foto, ...foto];   // doppia per il giro continuo
  return (
    <div className="foto-rail" aria-label="I nostri lavori">
      <div className="foto-rail-h">Fatti da noi</div>
      <div className="foto-rail-win">
        <div className={"foto-rail-track"+(reduce?"":" anim")} style={{animationDuration:Math.max(20,foto.length*6)+"s"}}>
          {lista.map((x,i)=>(
            <button type="button" key={i} className="foto-rail-it" onClick={()=>x.apri&&onApri(x.apri)} tabIndex={i>=foto.length?-1:0}>
              <img src={x.src} alt={x.titolo||""} loading="lazy"/>
              {x.titolo && <span>{x.titolo}</span>}
            </button>))}
        </div>
      </div>
    </div>);
}

// =====================================================================
//  CATALOGO
// =====================================================================
function Catalogo({addCart, catInit, profilo, vaiGuida, ricerca, setRicerca, iva, setIva}){
  const [prodotti,setProdotti]=useState(null);
  const [conf,setConf]=useState(null);
  const [errore,setErrore]=useState("");
  const [dettaglio,setDettaglio]=useState(null);
  const [cat,setCat]=useState(catInit||"");
  const [prezziDa,setPrezziDa]=useState({});   // {confId: prezzo unitario base} per i gadget
  const [abb,setAbb]=useState([]);   // capi del catalogo fornitore proposti (vista komunigo_abbigliamento, v17)
  const [abbSub,setAbbSub]=useState("");
  useEffect(()=>{ if(ricerca){ setAbbSub(""); setCat(""); } },[ricerca]);   // la ricerca cerca in TUTTO il catalogo: via filtri di categoria e tipo
  const [fotoLavori,setFotoLavori]=useState([]);   // foto reali per la colonna destra
  useEffect(()=>{ (async()=>{
    try{
      const [l,c]=await Promise.all([sb.from("komunigo_lavori_pub").select("*").order("ordine"), sb.from("komunigo_carosello_pub").select("*").order("ordine")]);
      setFotoLavori([...(l.data||[]),...(c.data||[])].filter(x=>x.path).map(x=>({src:kPubShop(x.path), titolo:x.titolo||""})));
    }catch(e){}
  })(); },[]);
  useEffect(()=>{ setCat(catInit||""); },[catInit]);
  useEffect(()=>{ (async()=>{
    try{ const {data,error}=await sb.from("komunigo_abbigliamento").select("*").order("nome");
      if(!error) setAbb((data||[]).map(x=>({...x, categoria:"Abbigliamento"}))); }catch(e){}
  })(); },[]);

  useEffect(()=>{ (async()=>{
    try{
      const [p,c]=await Promise.all([
        sb.from("komunigo_prodotti").select("*").order("nome"),
        sb.from("komunigo_configuratori").select("*").order("nome"),
      ]);
      if(p.error) throw p.error;
      if(c.error) throw c.error;
      setProdotti(p.data||[]); setConf(c.data||[]);
    }catch(e){ setErrore(e.message||String(e)); setProdotti([]); setConf([]); }
  })(); },[]);

  // prezzo "da €X/pz" per i gadget (minimo pezzi, senza stampa) — come fanno i competitor
  useEffect(()=>{ (async()=>{
    const gz=(conf||[]).filter(c=>c.tipo==="gadget");
    if(!gz.length) return;
    try{
      const res=await Promise.all(gz.map(c=>sb.functions.invoke("hyper-endpoint",{body:{prodotto_id:c.id, quantita:Number(c.minimo)||1}})
        .then(r=>({id:c.id, unit:(r.data && !r.data.sotto_costo)? Number(r.data.prezzo_unitario)||0 : 0})).catch(()=>({id:c.id,unit:0}))));
      const m={}; res.forEach(x=>{ if(x.unit>0) m[x.id]=x.unit; }); setPrezziDa(m);
    }catch(e){}
  })(); },[conf]);

  if(errore) return (
    <div className="warn"><b>Vetrina non ancora disponibile.</b> Esegui prima la migrazione
      <code> komunigo-v1.sql </code> in Supabase (crea le viste pubbliche). Dettaglio: {errore}</div>
  );
  if(prodotti===null || conf===null) return <div className="empty">Carico il catalogo…</div>;
  if(dettaglio && dettaglio.tipo==="abbigliamento") return <AbbigliamentoDettaglio capo={dettaglio.prod} addCart={addCart} onBack={()=>setDettaglio(null)} profilo={profilo} vaiGuida={vaiGuida} iva={iva} setIva={setIva}/>;
  if(dettaglio) return <ProdottoDettaglio tipo={dettaglio.tipo} prod={dettaglio.prod} addCart={addCart} onBack={()=>setDettaglio(null)} profilo={profilo} vaiGuida={vaiGuida} iva={iva} setIva={setIva}/>;

  const catList=[...new Set([...conf,...prodotti,...abb].map(x=>x.categoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const PACK_CAT=PACKAGING_SOTTO.map(p=>p.categoria.toLowerCase());
  const matchCat = x => { if(!cat) return true; const c=String(x.categoria||"").toLowerCase(), k=cat.toLowerCase();
    if(k==="packaging") return PACK_CAT.includes(c);
    if(x.categoria==="Abbigliamento" && x.sottocategoria!==undefined){ if(k==="borse e zaini") return eBorsa(x); if(k==="abbigliamento") return !eBorsa(x); }
    return c===k; };
  const q=(ricerca||"").trim().toLowerCase();
  const matchQ = x => !q || [x.nome,x.descrizione,x.note,x.categoria,x.codice,x.sottocategoria,x.brand, x.sottocategoria!==undefined? tradSub(x.sottocategoria):"", (x.sottocategoria!==undefined && eBorsa(x))? "borse borsa zaini zaino":""].filter(Boolean).join(" ").toLowerCase().includes(q);
  const capiAll = abb.filter(x=>matchCat(x) && matchQ(x));
  const abbSubs = [...new Set(capiAll.map(x=>x.sottocategoria).filter(Boolean))].sort((a,b)=>tradSub(a).localeCompare(tradSub(b),"it"));
  const subOk = abbSubs.includes(abbSub)? abbSub : "";   // un filtro tipo che non c'entra coi risultati viene ignorato
  const capi = capiAll.filter(x=>!subOk || x.sottocategoria===subOk);
  const soloBorse = capiAll.length>0 && capiAll.every(eBorsa);
  const gadget = conf.filter(c=>c.tipo==="gadget" && matchCat(c) && matchQ(c));
  const misura = conf.filter(c=>c.tipo!=="gadget" && c.tipo!=="scatola" && matchCat(c) && matchQ(c));
  const scatole = conf.filter(c=>c.tipo==="scatola" && matchCat(c) && matchQ(c));
  const stock  = prodotti.filter(x=>matchCat(x) && matchQ(x));
  const nTot = gadget.length+misura.length+stock.length+capiAll.length+scatole.length;
  const vuoto = nTot===0;

  const cardConf = (c,isGadget) => (
    <div className="card" key={c.id} style={{cursor:"pointer"}} onClick={()=>setDettaglio({tipo:"configuratore",prod:c})}>
      <div className="ph"><Ico n={isGadget?"gift":"ruler"} s={56} sw={1.1} className="ph-ico"/></div>
      <div className="bd"><span className="tag-conf">{isGadget?"Personalizzabile":"Su misura"}</span><h3>{c.nome}</h3>
        <div className="desc">{c.note||"Prodotto personalizzabile."}</div>
        <div className="row">{isGadget && prezziDa[c.id]
          ? <span className="price-da">da <b>{eur(conIva(prezziDa[c.id],iva))}</b>/pz <span className="iva-tag">{ivaLbl(iva)}</span></span>
          : <span className="muted">{Number(c.giorni_lavorazione)>0?`pronto in ~${c.giorni_lavorazione} gg lav.`:"prezzo su configurazione"}</span>}</div>
        <button className="add" onClick={e=>{e.stopPropagation();setDettaglio({tipo:"configuratore",prod:c});}}>{isGadget?"Personalizza":"Vedi e configura"}</button></div>
    </div>);

  // menu laterale: CATEGORIE con le loro VOCI (tipi di prodotto), tutto in ordine alfabetico
  const gruppiMenu=(()=>{
    const G={};
    const gr=(nome)=>G[nome]||(G[nome]={k:"g:"+nome, nome, cat:nome, voci:{}});
    const bello=t=>{ t=String(t||"").trim(); return t===t.toUpperCase()&&t.length>3? t.charAt(0)+t.slice(1).toLowerCase() : t; };
    [...(conf||[]),...(prodotti||[])].forEach(x=>{ const c=String(x.categoria||"").trim(); if(!c) return;
      if(PACK_CAT.includes(c.toLowerCase())){ const g=gr("Packaging"); g.voci[c]={k:"v:"+c, nome:c, cat:c}; }
      else gr(bello(c)).cat=c; });
    abb.forEach(x=>{ const g=gr(eBorsa(x)?"Borse e zaini":"Abbigliamento"); g.cat=g.nome; if(x.sottocategoria) g.voci[x.sottocategoria]={k:"s:"+x.sottocategoria, nome:tradSub(x.sottocategoria), cat:g.nome, sub:x.sottocategoria}; });
    return Object.values(G).map(g=>({...g, voci:Object.values(g.voci).sort((a,b)=>a.nome.localeCompare(b.nome,"it"))}))
      .sort((a,b)=>a.nome.localeCompare(b.nome,"it"));
  })();
  const menuAttivo = !cat? null : (abbSub? "s:"+abbSub : (gruppiMenu.flatMap(g=>g.voci).find(v=>!v.sub && v.cat.toLowerCase()===cat.toLowerCase())||{}).k || (gruppiMenu.find(g=>g.cat.toLowerCase()===cat.toLowerCase())||{}).k);
  const scegliMenu=v=>{ if(!v){ setCat(""); setAbbSub(""); } else { setCat(v.cat); setAbbSub(v.sub||""); } try{ window.scrollTo(0,0); }catch(e){} };
  // foto in loop: lavori reali + capi d'abbigliamento (cliccabili)
  const fotoRail=[...fotoLavori, ...abb.filter(c=>(c.immagini||[])[0]).slice(0,12).map(c=>({src:c.immagini[0].anteprima, titolo:c.nome, apri:{tipo:"abbigliamento",prod:c}}))];
  const apriVoce=v=>{ setDettaglio(v.apri||v); try{ window.scrollTo(0,0); }catch(e){} };

  return (
    <div className="cat-layout">
    <aside className="cat-side"><MenuTuttiProdotti gruppi={gruppiMenu} attivo={menuAttivo} onScegli={scegliMenu}/></aside>
    <div className="cat-main">
      {profilo && profilo.b2b && <div className="b2b-note"><Ico n="tag" s={16} className="ico-t"/><b>Prezzi riservati B2B{profilo.cliente_nome?" · "+profilo.cliente_nome:""}</b> — lo sconto del tuo listino è già applicato ai prezzi qui sotto.</div>}
      <div className="cat-toprow">
        <div className="cat-search">
          <Ico n="search" s={18}/>
          <input value={ricerca||""} onChange={e=>setRicerca(e.target.value)} placeholder="Cerca per nome, categoria, codice…"/>
          {q && <button className="search-x" onClick={()=>setRicerca("")} aria-label="Pulisci">×</button>}
        </div>
        {setIva && <div className="iva-toggle" title="Mostra i prezzi con o senza IVA">
          <button className={iva==="escl"?"on":""} onClick={()=>setIva("escl")}>IVA escl.</button>
          <button className={iva==="incl"?"on":""} onClick={()=>setIva("incl")}>IVA incl.</button>
        </div>}
      </div>
      {q && <p className="muted" style={{margin:"2px 0 10px"}}><b>{nTot}</b> {nTot===1?"risultato":"risultati"} per «{ricerca}» {(cat)?`in ${cat} `:""}<button className="lnk" onClick={()=>{setRicerca("");setCat("");}}>azzera</button></p>}
      {catList.length>0 && <div className="catbar">
        <button className={!cat?"on":""} onClick={()=>setCat("")}>Tutti</button>
        {catList.map(cc=><button key={cc} className={cat.toLowerCase()===cc.toLowerCase()?"on":""} onClick={()=>setCat(cc)}>{cc}</button>)}
      </div>}

      {capiAll.length>0 && <>
        <h2 className="sec"><Ico n={(soloBorse||cat.toLowerCase()==="borse e zaini")?"bag":"shirt"} s={26} sw={1.5} className="ico-t"/>{(soloBorse||cat.toLowerCase()==="borse e zaini")?"Borse e zaini personalizzati":"Abbigliamento personalizzato"}</h2>
        <p className="sec-sub">T-shirt, felpe, polo e giacche con il tuo logo: scegli colore, taglie e dove stampare.</p>
        {abbSubs.length>1 && <div className="catbar" style={{marginTop:0}}>
          <button className={!subOk?"on":""} onClick={()=>setAbbSub("")}>Tutto</button>
          {abbSubs.map(sc=><button key={sc} className={subOk===sc?"on":""} onClick={()=>setAbbSub(sc)}>{tradSub(sc)}</button>)}
        </div>}
        <div className="grid">{capi.map(c=>{ const img=(c.immagini||[])[0]; return (
          <div className="card" key={c.fornitore+":"+c.codice} style={{cursor:"pointer"}} onClick={()=>setDettaglio({tipo:"abbigliamento",prod:c})}>
            <div className="ph">{img?<img src={img.anteprima} alt={c.nome} loading="lazy" style={{objectFit:"contain",background:"#fff"}}/>:<Ico n="shirt" s={56} sw={1.1} className="ph-ico"/>}</div>
            <div className="bd"><span className="tag-conf">Personalizzabile</span>{c.sottocategoria && <span className="cat-l" style={{marginLeft:6}}>{tradSub(c.sottocategoria)}</span>}
              <h3>{c.nome}</h3>
              <div className="desc">{[c.brand,c.genere,c.grammatura].filter(Boolean).join(" · ")}</div>
              <div className="row">{c.prezzo_da

  {re:/tampografia/i, titolo:"Tampografia", testo:"Serve per stampare su oggetti piccoli o curvi, dove un foglio non arriverebbe: penne, accendini, portachiavi, tappi, gadget in plastica e metallo. Un tampone in silicone morbido raccoglie l'inchiostro da una lastra incisa con il tuo logo e lo appoggia sull'oggetto, adattandosi alla sua forma. È molto precisa: anche testi piccoli e linee sottili restano nitidi."},
