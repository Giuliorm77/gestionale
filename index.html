/* ================================================================ AGENTI / RAPPRESENTANTI */
function ModuloAgenti({profilo,perm}){
  const [agenti,setAgenti]=useState(null);
  const [clienti,setClienti]=useState([]);
  const [err,setErr]=useState("");
  const [cerca,setCerca]=useState("");
  const [editor,setEditor]=useState(null);
  const [vediClienti,setVediClienti]=useState(null);   // agente di cui elencare i clienti

  const carica=useCallback(async()=>{
    setErr("");
    const [a,c]=await Promise.all([
      sb.from("agenti").select("*").order("nome"),
      sb.from("clienti").select("id,agente_id"),
    ]);
    if(a.error){ setErr(a.error.message); return; }
    setAgenti(a.data||[]); setClienti(c.data||[]);
  },[]);
  useEffect(()=>{ carica(); },[carica]);

  const nClienti=useMemo(()=>{ const m={}; (clienti||[]).forEach(c=>{ if(c.agente_id) m[c.agente_id]=(m[c.agente_id]||0)+1; }); return m; },[clienti]);
  const filtrati=useMemo(()=>{
    if(!agenti) return [];
    const q=cerca.trim().toLowerCase();
    return agenti.filter(a=> !q || [a.nome,a.email,a.telefono].join(" ").toLowerCase().includes(q));
  },[agenti,cerca]);

  return (
    <>
      <div className="topbar">
        <h1>Agenti</h1>
        {perm.scrivi && <button className="btn primary" onClick={()=>setEditor({})}>+ Nuovo agente</button>}
      </div>
      <div className="content">
        {err && <div className="banner err">{err}</div>}
        <div className="toolbar">
          <div className="search"><span className="mag">🔍</span>
            <input placeholder="Cerca per nome, email, telefono…" value={cerca} onChange={e=>setCerca(e.target.value)}/></div>
          <span className="muted">{filtrati.length} agenti</span>
        </div>
        {agenti===null ? <div className="empty">Caricamento…</div>
          : filtrati.length===0 ? <div className="card empty">Nessun agente. Aggiungine uno con "+ Nuovo agente".</div>
          : <div className="card" style={{overflow:"auto"}}>
              <table>
                <thead><tr><th>Nome</th><th>Contatti</th><th style={{textAlign:"right"}}>Provvigione</th><th style={{textAlign:"right"}}>Clienti</th></tr></thead>
                <tbody>
                  {filtrati.map(a=>
                    <tr key={a.id} onClick={()=>setEditor(a)}>
                      <td className="rs">{a.nome}
                        {a.attivo===false && <span className="tag" style={{background:"#fdf0e3",color:"#c47a1e",marginLeft:8}}>Non attivo</span>}</td>
                      <td className="muted">{[a.email,a.telefono].filter(Boolean).join(" · ")||"—"}</td>
                      <td style={{textAlign:"right",fontWeight:700}}>{(Number(a.provvigione_pct)||0)}%</td>
                      <td style={{textAlign:"right"}} className="muted">
                        {nClienti[a.id]>0
                          ? <button className="btn small" title="Vedi i clienti associati a questo agente"
                              onClick={e=>{e.stopPropagation();setVediClienti(a);}} style={{padding:"1px 8px",fontWeight:700}}>{nClienti[a.id]} 👥</button>
                          : 0}</td>
                    </tr>)}
                </tbody>
              </table>
            </div>}
      </div>
      {editor && <AgenteForm agente={editor.id?editor:null} profilo={profilo} perm={perm}
        onClose={()=>setEditor(null)} onSalvato={()=>{setEditor(null);carica();}}/>}
      {vediClienti && <ClientiDiAgente agente={vediClienti} onClose={()=>setVediClienti(null)}/>}
    </>
  );
}

/* ------------------------------------------------ clienti associati a un agente */
function ClientiDiAgente({agente,onClose}){
  const [lista,setLista]=useState(null);
  const [q,setQ]=useState("");
  const [err,setErr]=useState("");
  useEffect(()=>{ let vivo=true;
    (async()=>{
      const {data,error}=await sb.from("clienti")
        .select("id,ragione_sociale,stato,categoria,clienti_sedi(citta)")
        .eq("agente_id",agente.id).order("ragione_sociale");
      if(!vivo) return;
      if(error){ setErr(error.message); setLista([]); return; }
      setLista(data||[]);
    })();
    return ()=>{vivo=false;};
  },[agente.id]);
  const filtr=(lista||[]).filter(c=>!q || (c.ragione_sociale||"").toLowerCase().includes(q.toLowerCase()));
  return (
    <div className="overlay">
      <div className="modal" style={{maxWidth:620}} onClick={e=>e.stopPropagation()}>
        <header>
          <div><h2>Clienti di {agente.nome}</h2>
            <span className="muted">{lista===null?"…":lista.length+" client"+(lista.length===1?"e":"i")+" associat"+(lista.length===1?"o":"i")}</span></div>
          <button className="x" onClick={onClose}>×</button>
        </header>
        <div className="body">
          {err && <div className="banner err">{err}</div>}
          {lista===null ? <div className="empty" style={{padding:14}}>Caricamento…</div>
            : lista.length===0 ? <div className="empty" style={{padding:14}}>Nessun cliente associato a questo agente.</div>
            : <>
                {lista.length>8 && <div className="search" style={{marginBottom:10}}><span className="mag">🔍</span>
                  <input placeholder="Filtra per ragione sociale…" value={q} onChange={e=>setQ(e.target.value)}/></div>}
                <table>
                  <thead><tr><th>Ragione sociale</th><th>Città</th><th>Stato</th></tr></thead>
                  <tbody>
                    {filtr.map(c=>{ const citta=(c.clienti_sedi||[])[0]?.citta||"—";
                      return <tr key={c.id}>
                        <td className="rs">{c.ragione_sociale}
                          {c.categoria==="Rivenditore" && <span className="tag" style={{background:"#eef1fb",color:"#2f5bea",marginLeft:6}}>Rivenditore</span>}</td>
                        <td className="muted">{citta}</td>
                        <td>{c.stato==="Sospeso"
                          ? <span className="tag" style={{background:"#fdf0e3",color:"#c47a1e"}}>Sospeso</span>
                          : <span className="tag" style={{background:"#e6f4ee",color:"#1f9c68"}}>Attivo</span>}</td>
                      </tr>; })}
                  </tbody>
                </table>
              </>}
        </div>
      </div>
    </div>
  );
}

/* ------------------------------------------------ scheda agente */
function AgenteForm({agente,profilo,perm,onClose,onSalvato}){
  const nuovo=!agente;
  const [f,setF]=useState(()=>({
    nome:agente?.nome||"",
    email:agente?.email||"",
    telefono:agente?.telefono||"",
    provvigione_pct:agente?.provvigione_pct ?? "",
    attivo:agente?.attivo!==false,
    note:agente?.note||"",
  }));
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const set=(k,v)=>setF(p=>({...p,[k]:v}));

  async function salva(e){
    e.preventDefault();
    if(!f.nome.trim()){ setErr("Il nome dell'agente è obbligatorio."); return; }
    setBusy(true); setErr("");
    const payload={ ...f, provvigione_pct: f.provvigione_pct===""?0:Number(f.provvigione_pct), aggiornato_il:new Date().toISOString() };
    try{
      if(nuovo){
        const {error}=await sb.from("agenti").insert({...payload, creato_da:profilo.id});
        if(error) throw error;
      }else{
        const {error}=await sb.from("agenti").update(payload).eq("id",agente.id);
        if(error) throw error;
      }
      onSalvato();
    }catch(ex){ setErr(ex.message); setBusy(false); }
  }
  async function elimina(){
    if(!window.confirm("Eliminare l'agente «"+f.nome+"»? I clienti collegati resteranno senza agente.")) return;
    setBusy(true); setErr("");
    const {error}=await sb.from("agenti").delete().eq("id",agente.id);
    if(error){ setErr(error.message); setBusy(false); return; }
    onSalvato();
  }

  return (
    <div className="modal-bg" onClick={onClose}>
      <form className="modal" onClick={e=>e.stopPropagation()} onSubmit={salva}>
        <header>
          <h2>{nuovo?"Nuovo agente":"Modifica agente"}</h2>
          <button type="button" className="x" onClick={onClose}>×</button>
        </header>
        <div className="body">
          {err && <div className="banner err">{err}</div>}
          <div className="section">
            <h3>Dati agente</h3>
            <div className="field"><label>Nome e cognome *</label>
              <input value={f.nome} onChange={e=>set("nome",e.target.value)} required/></div>
            <div className="row">
              <div className="field"><label>Email</label>
                <input type="email" value={f.email} onChange={e=>set("email",e.target.value)}/></div>
              <div className="field"><label>Telefono</label>
                <input value={f.telefono} onChange={e=>set("telefono",e.target.value)}/></div>
            </div>
            <div className="row">
              <div className="field" style={{maxWidth:200}}><label>Provvigione standard %</label>
                <input type="number" step="0.01" min="0" value={f.provvigione_pct}
                       onChange={e=>set("provvigione_pct",e.target.value)} placeholder="es. 5"/></div>
              <div className="field" style={{maxWidth:160}}><label>Stato</label>
                <select value={f.attivo?"si":"no"} onChange={e=>set("attivo",e.target.value==="si")}>
                  <option value="si">Attivo</option>
                  <option value="no">Non attivo</option>
                </select></div>
            </div>
            <div className="muted" style={{fontSize:12}}>È la % applicata di default ai clienti di questo agente. Sul singolo cliente puoi impostare un'eccezione.</div>
            <div className="field"><label>Note</label>
              <textarea rows={3} value={f.note} onChange={e=>set("note",e.target.value)}/></div>
          </div>
        </div>
        <footer>
          {!nuovo && perm.elimina && <button type="button" className="btn danger" disabled={busy} onClick={elimina}>Elimina</button>}
          <div style={{flex:1}}/>
          <button type="button" className="btn" onClick={onClose}>Annulla</button>
          <button type="submit" className="btn primary" disabled={busy}>{busy?"Salvo…":"Salva"}</button>
        </footer>
      </form>
    </div>
  );
}

function ModuloFornitori({profilo,perm}){
  const [fornitori,setFornitori]=useState(null);
  const [err,setErr]=useState("");
  const [cerca,setCerca]=useState("");
  const [filtroLav,setFiltroLav]=useState("");
  const [editor,setEditor]=useState(null);

  const carica=useCallback(async()=>{
    setErr("");
    const {data,error}=await sb.from("fornitori").select("*, fornitori_sedi(*)").order("ragione_sociale");
    if(error){ setErr(error.message); return; }
    setFornitori(data||[]);
  },[]);
  useEffect(()=>{ carica(); },[carica]);

  // incidenza % sugli acquisti (ordini fornitore, anno in corso), per fornitore
  const annoCorr=new Date().getFullYear();
  const [acqMap,setAcqMap]=useState({});
  useEffect(()=>{ if(!perm.economici){ setAcqMap({}); return; }
    sb.rpc("acquisti_fornitori",{p_anno:annoCorr}).then(({data})=>{
      const m={}; (data||[]).forEach(r=>{ m[r.fornitore_id]=Number(r.totale)||0; }); setAcqMap(m);
    }).catch(()=>{});
  },[perm.economici,annoCorr]);
  const acqTot=useMemo(()=>Object.values(acqMap).reduce((s,v)=>s+v,0),[acqMap]);
  const incid=fo=> acqTot>0 ? (Number(acqMap[fo.id])||0)/acqTot*100 : 0;
  const eur=n=>Number(n||0).toLocaleString("it-IT",{style:"currency",currency:"EUR",maximumFractionDigits:0});

  const filtrati=useMemo(()=>{
    if(!fornitori) return [];
    const q=cerca.trim().toLowerCase();
    return fornitori.filter(fo=>{
      const forniture=[...(fo.materiali_forniti||[]),...(fo.cosa_fornisce||[])];
      if(filtroLav && !forniture.includes(filtroLav)) return false;
      if(!q) return true;
      return [fo.ragione_sociale,fo.cosa_fornisce_note,fo.citta,fo.email,fo.referente,
        ...forniture].join(" ").toLowerCase().includes(q);
    });
  },[fornitori,cerca,filtroLav]);

  const stelle=n=>"★".repeat(n||0)+"☆".repeat(5-(n||0));

  function esporta(){
    const rows=filtrati.map(fo=>{
      const forn=[...(fo.materiali_forniti||[]),...(fo.cosa_fornisce||[])].join(", ");
      const r={
        "Ragione sociale":fo.ragione_sociale||"", "Cosa fornisce":forn, "Note forniture":fo.cosa_fornisce_note||"",
        "Affidabilità (1-5)":fo.affidabilita||"", "Referente":fo.referente||"",
        "Telefono":fo.telefono||"", "Cellulare":fo.cellulare||"", "Email":fo.email||"", "PEC":fo.pec||"",
        "P.IVA":fo.partita_iva||"", "Cod.Fiscale":fo.codice_fiscale||"",
        "Città":fo.citta||"", "Regione":fo.regione||"", "Termini pagamento":fo.termini_pagamento||"",
        "Attivo":fo.attivo===false?"No":"Sì",
      };
      if(perm.economici){ r["Acquisti "+annoCorr+" €"]=Math.round((Number(acqMap[fo.id])||0)*100)/100;
        r["Incidenza %"]=Math.round(incid(fo)*10)/10; }
      return r;
    });
    esportaExcel(rows, "Fornitori_"+new Date().toISOString().slice(0,10)+".xlsx", "Fornitori");
  }

  async function esportaRegistroFornitori(){
    try{
      const {data:vals,error}=await sb.from("fornitori_valutazioni")
        .select("fornitore_id,fornitore_nome,data_valutazione,qualita,prezzo,tempi,ecosostenibilita,disponibilita")
        .order("data_valutazione",{ascending:false}).order("creato_il",{ascending:false});
      if(error){ alert("Errore: "+error.message); return; }
      const latest={}; (vals||[]).forEach(v=>{ if(!latest[v.fornitore_id]) latest[v.fornitore_id]=v; });
      const rows=Object.values(latest);
      if(!rows.length){ alert("Nessuna valutazione registrata. Inseriscile dalle schede fornitore."); return; }
      const tipoMap={}; (fornitori||[]).forEach(fo=>{ tipoMap[fo.id]=[...(fo.materiali_forniti||[]),...(fo.cosa_fornisce||[])].join(", "); });
      const aoa1=[["REG QA-8.4 Registro Fornitori (qualifica se media ≥ 3; riesame almeno ogni 2 anni)"],
        ["Fornitore","Tipo di fornitura","Qualità","Prezzo","Tempi","Ecosostenibilità","Disponibilità","Valutazione media","Data valutazione","Qualifica","Check di controllo"]];
      let sQ=0,sP=0,sT=0,sE=0,sD=0,nQual=0; const n=rows.length;
      rows.forEach(v=>{ const media=valMediaForn(v), qual=valQualificaForn(v);
        if(qual==="Qualificato") nQual++;
        sQ+=Number(v.qualita)||0; sP+=Number(v.prezzo)||0; sT+=Number(v.tempi)||0; sE+=Number(v.ecosostenibilita)||0; sD+=Number(v.disponibilita)||0;
        aoa1.push([v.fornitore_nome||"", tipoMap[v.fornitore_id]||"", v.qualita,v.prezzo,v.tempi,v.ecosostenibilita,v.disponibilita, media,
          v.data_valutazione? new Date(v.data_valutazione).toLocaleDateString("it-IT"):"", qual, "Ok"]); });
      const r2=x=>Math.round(x/n*100)/100;
      const aoa2=[["Parametro","Media tutti fornitori"],["Qualità",r2(sQ)],["Prezzo",r2(sP)],["Tempi",r2(sT)],
        ["Ecosostenibilità",r2(sE)],["Disponibilità",r2(sD)],[],
        ["Conteggio complessivo Fornitori",""],["Fornitori valutati",n],["Fornitori qualificati",nQual],["Fornitori non qualificati",n-nQual]];
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa1), "Registro Fornitori");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa2), "Calcoli");
      XLSX.writeFile(wb, "Registro_fornitori_"+new Date().toISOString().slice(0,10)+".xlsx");
    }catch(e){ alert("Export non riuscito: "+(e&&e.message||e)); }
  }

  return (
    <>
      <div className="topbar">
        <h1>Anagrafica Fornitori</h1>
        <button className="btn" onClick={esporta} disabled={!filtrati.length} title="Esporta la lista filtrata in Excel">⬇️ Esporta Excel</button>
        {perm.economici && <button className="btn" onClick={esportaRegistroFornitori} title="Genera il registro ISO valutazione fornitori (Excel, con medie e qualifica)">📋 Registro fornitori ISO</button>}
        {perm.scrivi && <button className="btn primary" onClick={()=>setEditor({})}>+ Nuovo fornitore</button>}
      </div>
      <div className="content">
        {err && <div className="banner err">{err}</div>}
        <div className="toolbar">
          <div className="search"><span className="mag">🔍</span>
            <input placeholder="Cerca per nome, cosa fornisce, città, email…" value={cerca} onChange={e=>setCerca(e.target.value)}/></div>
          <select className="btn" value={filtroLav} onChange={e=>setFiltroLav(e.target.value)} style={{maxWidth:240}}>
            <option value="">Tutte le forniture</option>
            {MATERIE_PRIME.length>0 && <optgroup label="Materiali">
              {MATERIE_PRIME.map(m=><option key={"m-"+m} value={m}>{m}</option>)}
            </optgroup>}
            <optgroup label="Lavorazioni (terzismo)">
              {LAVORAZIONI.map(l=><option key={"l-"+l} value={l}>{l}</option>)}
            </optgroup>
          </select>
          <span className="muted">{filtrati.length} fornitori</span>
        </div>
        {fornitori===null ? <div className="empty">Caricamento…</div>
          : filtrati.length===0 ? <div className="card empty">Nessun fornitore. Aggiungine uno con "+ Nuovo fornitore".</div>
          : <div className="card" style={{overflow:"auto"}}>
              <table>
                <thead><tr><th>Ragione sociale</th><th>Cosa fornisce</th><th>Affidabilità</th>{perm.economici && <th style={{textAlign:"right"}} title={"Quota sugli acquisti "+annoCorr+" (ordini fornitore)"}>Incidenza {annoCorr}</th>}<th>Città</th></tr></thead>
                <tbody>
                  {filtrati.map(fo=>
                    <tr key={fo.id} onClick={()=>setEditor(fo)}>
                      <td className="rs">{fo.ragione_sociale}
                        {fo.attivo===false && <span className="tag" style={{background:"#fdf0e3",color:"#c47a1e",marginLeft:8}}>Non attivo</span>}</td>
                      <td>{(()=>{const forn=[...(fo.materiali_forniti||[]),...(fo.cosa_fornisce||[])];
                        return <>{forn.slice(0,3).map((l,i)=><span key={l+i} className="tag">{l}</span>)}
                          {forn.length>3 && <span className="tag">+{forn.length-3}</span>}
                          {forn.length===0 && <span className="muted">—</span>}</>;})()}</td>
                      <td style={{color:"#f5a623",letterSpacing:1}}>{stelle(fo.affidabilita)}</td>
                      {perm.economici && <td style={{textAlign:"right"}}>{acqTot>0 && acqMap[fo.id]? <b title={eur(acqMap[fo.id])}>{(Math.round(incid(fo)*10)/10)}%</b> : <span className="muted">—</span>}</td>}
                      <td className="muted">{fo.citta||"—"}</td>
                    </tr>)}
                </tbody>
              </table>
            </div>}
      </div>
      {editor && <FornitoreForm fornitore={editor.id?editor:null} perm={perm} profilo={profilo}
        onClose={()=>setEditor(null)} onSalvato={()=>{setEditor(null);carica();}}/>}
    </>
  );
}

/* ------------------------------------------------ scheda fornitore */
function FornitoreForm({fornitore,perm,profilo,onClose,onSalvato}){
  const nuovo=!fornitore;
  const [f,setF]=useState(()=>({
    ragione_sociale:fornitore?.ragione_sociale||"",
    tipo:fornitore?.tipo||"materiale",
    materiali_forniti:fornitore?.materiali_forniti||[],
    cosa_fornisce:fornitore?.cosa_fornisce||[],
    cosa_fornisce_note:fornitore?.cosa_fornisce_note||"",
    affidabilita:fornitore?.affidabilita||0,
    referente:fornitore?.referente||"",
    telefono:fornitore?.telefono||"",
    cellulare:fornitore?.cellulare||"",
    email:fornitore?.email||"",
    pec:fornitore?.pec||"",
    partita_iva:fornitore?.partita_iva||"",
    codice_fiscale:fornitore?.codice_fiscale||"",
    codice_sdi:fornitore?.codice_sdi||"",
    iban:fornitore?.iban||"",
    indirizzo:fornitore?.indirizzo||"",
    cap:fornitore?.cap||"",
    citta:fornitore?.citta||"",
    provincia:fornitore?.provincia||"",
    regione:fornitore?.regione||"",
    termini_pagamento:fornitore?.termini_pagamento||"",
    note:fornitore?.note||"",
    attivo:fornitore?.attivo!==false,
  }));
  const [sedi,setSedi]=useState(()=>{
    const s=(fornitore?.fornitori_sedi||[]).map(x=>({...x}));
    if(s.length) return s;
    // se non ci sono sedi ma c'era il vecchio indirizzo singolo, lo porto nella sede legale
    if(fornitore && (fornitore.indirizzo||fornitore.citta||fornitore.cap))
      return [{tipo:"legale",indirizzo:fornitore.indirizzo||"",cap:fornitore.cap||"",citta:fornitore.citta||"",
        provincia:fornitore.provincia||"",regione:fornitore.regione||"",nazione:"Italia",
        giorni_chiusura:[],orario_mattino:"",orario_pomeriggio:"",note:""}];
    return [];
  });
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  // --- Valutazione fornitore (registro ISO REG QA-8.4) ---
  const puoVal = !!(perm && perm.economici);
  const [valList,setValList]=useState(null);
  const [vf,setVf]=useState({data:new Date().toISOString().slice(0,10),qualita:3,prezzo:3,tempi:3,ecosostenibilita:3,disponibilita:3,note:""});
  const [valBusy,setValBusy]=useState(false);
  const setVfk=(k,v)=>setVf(p=>({...p,[k]:v}));
  useEffect(()=>{ if(nuovo){ setValList([]); return; }
    sb.from("fornitori_valutazioni").select("*").eq("fornitore_id",fornitore.id)
      .order("data_valutazione",{ascending:false}).order("creato_il",{ascending:false})
      .then(({data})=>setValList(data||[]));
  },[nuovo]);
  async function addVal(){ if(nuovo) return; setValBusy(true);
    const rec={fornitore_id:fornitore.id, fornitore_nome:f.ragione_sociale||fornitore.ragione_sociale||"",
      data_valutazione:vf.data||new Date().toISOString().slice(0,10),
      qualita:Number(vf.qualita)||0, prezzo:Number(vf.prezzo)||0, tempi:Number(vf.tempi)||0,
      ecosostenibilita:Number(vf.ecosostenibilita)||0, disponibilita:Number(vf.disponibilita)||0,
      note:vf.note||"", creato_da:profilo?profilo.id:null};
    const {error}=await sb.from("fornitori_valutazioni").insert(rec);
    setValBusy(false);
    if(error){ alert("Errore: "+error.message); return; }
    sb.from("fornitori_valutazioni").select("*").eq("fornitore_id",fornitore.id)
      .order("data_valutazione",{ascending:false}).order("creato_il",{ascending:false})
      .then(({data})=>setValList(data||[]));
  }
  async function delVal(id){ if(!confirm("Eliminare questa valutazione?")) return;
    await sb.from("fornitori_valutazioni").delete().eq("id",id);
    setValList(p=>(p||[]).filter(x=>x.id!==id)); }
  const vfMedia=valMediaForn(vf); const vfQual=valQualificaForn(vf);
  const toggleLav=l=>setF(p=>({...p,cosa_fornisce:p.cosa_fornisce.includes(l)
    ? p.cosa_fornisce.filter(x=>x!==l) : [...p.cosa_fornisce,l]}));
  const toggleMat=m=>setF(p=>({...p,materiali_forniti:(p.materiali_forniti||[]).includes(m)
    ? p.materiali_forniti.filter(x=>x!==m) : [...(p.materiali_forniti||[]),m]}));
  const mostraMateriali = f.tipo==="materiale" || f.tipo==="entrambi";
  const mostraLavorazioni = f.tipo==="terzista" || f.tipo==="entrambi";
  const warn=(ok,msg)=> !ok && <div className="muted" style={{fontSize:12,color:"var(--warn)"}}>⚠ {msg}</div>;
  const addSede=()=>setSedi(p=>[...p,{tipo:"magazzino",indirizzo:"",cap:"",citta:"",provincia:"",regione:"",
    nazione:"Italia",giorni_chiusura:[],orario_mattino:"",orario_pomeriggio:"",note:""}]);
  const setSede=(i,k,v)=>setSedi(p=>p.map((s,j)=>j===i?{...s,[k]:v}:s));
  const setSedeGiorno=(i,g)=>setSedi(p=>p.map((s,j)=>{
    if(j!==i) return s; const cur=s.giorni_chiusura||[];
    return {...s,giorni_chiusura:cur.includes(g)?cur.filter(x=>x!==g):[...cur,g]};
  }));
  const delSede=i=>setSedi(p=>p.filter((_,j)=>j!==i));

  async function salva(e){
    e.preventDefault();
    if(!f.ragione_sociale.trim()){ setErr("La ragione sociale è obbligatoria."); return; }
    if(!emailValida(f.email)){ setErr("L'email non è in un formato valido. Correggila o lasciala vuota."); return; }
    if(!emailValida(f.pec)){ setErr("La PEC non è in un formato valido. Correggila o lasciala vuota."); return; }
    if(!pivaValida(f.partita_iva)){ setErr("La Partita IVA non è valida (11 cifre per l'Italia, oppure prefisso paese es. IT/DE per l'estero). Correggila o lasciala vuota."); return; }
    if(!ibanValido(f.iban)){ setErr("L'IBAN non è in un formato valido. Correggilo o lascialo vuoto."); return; }
    setBusy(true); setErr("");
    try{
      // la sede legale (o la prima) tiene allineati i campi indirizzo del fornitore
      const princ=sedi.find(s=>s.tipo==="legale")||sedi[0]||null;
      const rec={...f};
      if(princ){ rec.indirizzo=princ.indirizzo||""; rec.cap=princ.cap||""; rec.citta=princ.citta||"";
        rec.provincia=princ.provincia||""; rec.regione=princ.regione||""; }
      let fornId=fornitore?.id;
      if(nuovo){ const {data,error}=await sb.from("fornitori").insert(rec).select("id").single(); if(error) throw error; fornId=data.id; }
      else{ const {error}=await sb.from("fornitori").update(rec).eq("id",fornId); if(error) throw error;
        await sb.from("fornitori_sedi").delete().eq("fornitore_id",fornId); }
      const sediValide=sedi.filter(s=>s.indirizzo||s.citta||s.cap);
      if(sediValide.length){
        const {error}=await sb.from("fornitori_sedi").insert(sediValide.map(s=>({fornitore_id:fornId,tipo:s.tipo,
          indirizzo:s.indirizzo||"",cap:s.cap||"",citta:s.citta||"",provincia:s.provincia||"",regione:s.regione||"",
          nazione:s.nazione||"Italia",giorni_chiusura:s.giorni_chiusura||[],orario_mattino:s.orario_mattino||"",
          orario_pomeriggio:s.orario_pomeriggio||"",note:s.note||""})));
        if(error) throw error;
      }
      onSalvato();
    }catch(ex){ setErr(ex.message); setBusy(false); }
  }
  async function elimina(){
    if(!confirm("Eliminare questo fornitore?")) return;
    setBusy(true);
    const {error}=await sb.from("fornitori").delete().eq("id",fornitore.id);
    if(error){ setErr(error.message); setBusy(false); return; }
    onSalvato();
  }

  return (
    <div className="overlay">
      <form className="modal" onClick={e=>e.stopPropagation()} onSubmit={salva}>
        <header><h2>{nuovo?"Nuovo fornitore":"Modifica fornitore"}</h2>
          <button type="button" className="x" onClick={onClose}>×</button></header>
        <div className="body">
          {err && <div className="banner err">{err}</div>}

          <div className="section">
            <h3>Dati principali</h3>
            <div className="field"><label>Ragione sociale *</label>
              <input value={f.ragione_sociale} onChange={e=>set("ragione_sociale",e.target.value)} required autoFocus/></div>
            <div className="field"><label>Tipo fornitore</label>
              <select value={f.tipo} onChange={e=>set("tipo",e.target.value)}>
                {TIPI_FORNITORE.map(t=><option key={t.v} value={t.v}>{t.l}</option>)}
              </select></div>
            <div className="field"><label>Affidabilità</label>
              <div style={{display:"flex",gap:4}}>
                {[1,2,3,4,5].map(n=>
                  <button type="button" key={n} onClick={()=>set("affidabilita",f.affidabilita===n?0:n)}
                    style={{background:"none",border:"none",fontSize:26,cursor:"pointer",lineHeight:1,
                      color:n<=f.affidabilita?"#f5a623":"#d0d5dd"}}>★</button>)}
              </div></div>
          </div>

          {mostraMateriali && <div className="section">
            <h3>Materiali forniti</h3>
            {MATERIE_PRIME.length===0
              ? <div className="muted" style={{fontSize:12}}>Nessuna materia prima in elenco. Aggiungile in <b>Impostazioni → Materie prime</b>.</div>
              : <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:10}}>
                  {MATERIE_PRIME.map(m=>{const on=(f.materiali_forniti||[]).includes(m);
                    return <button type="button" key={m} onClick={()=>toggleMat(m)} className="btn small"
                      style={on?{background:"var(--brand)",color:"#fff",borderColor:"var(--brand)"}:{}}>{on?"✓ ":""}{m}</button>;})}
                </div>}
          </div>}

          {mostraLavorazioni && <div className="section">
            <h3>Lavorazioni (terzismo)</h3>
            <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:10}}>
              {LAVORAZIONI.map(l=>{const on=f.cosa_fornisce.includes(l);
                return <button type="button" key={l} onClick={()=>toggleLav(l)} className="btn small"
                  style={on?{background:"var(--brand)",color:"#fff",borderColor:"var(--brand)"}:{}}>{on?"✓ ":""}{l}</button>;})}
            </div>
          </div>}

          <div className="section">
            <h3>Dettagli fornitura</h3>
            <div className="field"><label>Note (testo libero)</label>
              <input value={f.cosa_fornisce_note} onChange={e=>set("cosa_fornisce_note",e.target.value)}
                     placeholder="es. solo forex bianco fino a 3mm, tempi consegna…"/></div>
          </div>

          <div className="section">
            <h3>Contatti</h3>
            <div className="field"><label>Referente</label>
              <input value={f.referente} onChange={e=>set("referente",e.target.value)}/></div>
            <div className="row">
              <div className="field"><label>Telefono</label><input value={f.telefono} onChange={e=>set("telefono",e.target.value)}/></div>
              <div className="field"><label>Cellulare</label><input value={f.cellulare} onChange={e=>set("cellulare",e.target.value)}/></div>
            </div>
            <div className="row">
              <div className="field"><label>Email</label>
                <input type="email" value={f.email} onChange={e=>set("email",e.target.value)}/>{warn(emailValida(f.email),"email in formato non valido")}</div>
              <div className="field"><label>PEC</label>
                <input value={f.pec} onChange={e=>set("pec",e.target.value)}/>{warn(emailValida(f.pec),"PEC in formato non valido")}</div>
            </div>
          </div>

          <div className="section">
            <h3>Dati fiscali</h3>
            <div className="row">
              <div className="field"><label>Partita IVA</label>
                <input value={f.partita_iva} onChange={e=>set("partita_iva",e.target.value)}/>{warn(pivaValida(f.partita_iva),"la P.IVA dovrebbe avere 11 cifre")}</div>
              <div className="field"><label>Codice fiscale</label>
                <input value={f.codice_fiscale} onChange={e=>set("codice_fiscale",e.target.value)}/></div>
              <div className="field"><label>Codice SDI</label>
                <input value={f.codice_sdi} onChange={e=>set("codice_sdi",e.target.value)}/></div>
            </div>
            <div className="field"><label>IBAN</label>
              <input value={f.iban} onChange={e=>set("iban",e.target.value)}/>{warn(ibanValido(f.iban),"IBAN in formato non valido")}</div>
          </div>

          <div className="section">
            <h3>Sedi</h3>
            <div className="muted" style={{fontSize:12,marginBottom:10}}>Sede legale, magazzino, uffici… con giorni di chiusura e orari. La <b>sede legale</b> (o la prima) fa da indirizzo principale.</div>
            {sedi.map((s,i)=>
              <div className="subrow" key={i}>
                <div className="hd">
                  <select value={s.tipo} onChange={e=>setSede(i,"tipo",e.target.value)} className="btn small" style={{fontWeight:700}}>
                    {TIPI_SEDE_FORN.map(t=><option key={t.v} value={t.v}>{t.label}</option>)}
                  </select>
                  <button type="button" className="btn small danger" onClick={()=>delSede(i)}>Rimuovi</button>
                </div>
                <div className="field"><label>Indirizzo</label>
                  <input value={s.indirizzo} onChange={e=>setSede(i,"indirizzo",e.target.value)}/></div>
                <div className="row">
                  <div className="field" style={{maxWidth:110}}><label>CAP</label>
                    <input value={s.cap} onChange={e=>setSede(i,"cap",e.target.value)}/></div>
                  <div className="field"><label>Città</label>
                    <input value={s.citta} onChange={e=>setSede(i,"citta",e.target.value)}/></div>
                  <div className="field" style={{maxWidth:90}}><label>Prov.</label>
                    <input value={s.provincia} maxLength={4} onChange={e=>setSede(i,"provincia",e.target.value)}/></div>
                </div>
                <div className="field"><label>Regione</label>
                  <select value={s.regione||""} onChange={e=>setSede(i,"regione",e.target.value)}>
                    <option value="">—</option>{REGIONI.map(r=><option key={r} value={r}>{r}</option>)}
                  </select></div>
                <label style={{fontSize:12,fontWeight:600,color:"var(--muted)",textTransform:"uppercase"}}>Giorni di chiusura</label>
                <div style={{display:"flex",flexWrap:"wrap",gap:6,margin:"6px 0 10px"}}>
                  {GIORNI.map(g=>{
                    const on=(s.giorni_chiusura||[]).includes(g);
                    return <button type="button" key={g} className="btn small"
                      style={on?{background:"var(--danger)",color:"#fff",borderColor:"var(--danger)"}:{}}
                      onClick={()=>setSedeGiorno(i,g)}>{g}</button>;
                  })}
                </div>
                <div className="row">
                  <div className="field"><label>Orario mattino</label>
                    <input value={s.orario_mattino||""} onChange={e=>setSede(i,"orario_mattino",e.target.value)} placeholder="9:00–13:00"/></div>
                  <div className="field"><label>Orario pomeriggio</label>
                    <input value={s.orario_pomeriggio||""} onChange={e=>setSede(i,"orario_pomeriggio",e.target.value)} placeholder="14:30–18:30"/></div>
                </div>
                <div className="field"><label>Note sede</label>
                  <input value={s.note||""} onChange={e=>setSede(i,"note",e.target.value)} placeholder="es. chiusura ferie agosto, citofono, referente magazzino…"/></div>
              </div>)}
            <button type="button" className="btn small repeat-add" onClick={addSede}>+ Aggiungi sede</button>
          </div>

          <div className="section">
            <h3>Condizioni e note</h3>
            <div className="field"><label>Termini di pagamento</label>
              <input value={f.termini_pagamento} onChange={e=>set("termini_pagamento",e.target.value)} placeholder="es. 30 gg d.f. f.m."/></div>
            <label style={{display:"flex",alignItems:"center",gap:8,margin:"4px 0 12px"}}>
              <input type="checkbox" checked={f.attivo} onChange={e=>set("attivo",e.target.checked)} style={{width:"auto"}}/> Fornitore attivo
            </label>
            <div className="field"><label>Note</label><textarea rows={2} value={f.note} onChange={e=>set("note",e.target.value)}/></div>
          </div>

          <div className="section">
            <h3>📋 Valutazione fornitore <span className="muted" style={{fontWeight:400,fontSize:12}}>· registro ISO (scala 1-4 · qualificato se media ≥ 3)</span></h3>
            {nuovo
              ? <div className="muted" style={{fontSize:13}}>Salva prima il fornitore, poi potrai inserire le valutazioni.</div>
              : <>
                {puoVal && <div style={{background:"#f7f9fb",border:"1px solid var(--line)",borderRadius:10,padding:"10px 12px",marginBottom:10}}>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
                    <div className="field" style={{maxWidth:150,margin:0}}><label style={{fontSize:12}}>Data valutazione</label>
                      <input type="date" value={vf.data} onChange={e=>setVfk("data",e.target.value)}/></div>
                    {[["qualita","Qualità"],["prezzo","Prezzo"],["tempi","Tempi"],["ecosostenibilita","Ecosost."],["disponibilita","Disponib."]].map(([k,l])=>
                      <div className="field" style={{maxWidth:96,margin:0}} key={k}><label style={{fontSize:12}}>{l}</label>
                        <select value={vf[k]} onChange={e=>setVfk(k,Number(e.target.value))}>
                          {[1,2,3,4].map(n=><option key={n} value={n}>{n}</option>)}
                        </select></div>)}
                  </div>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end",marginTop:8}}>
                    <div className="field" style={{flex:1,minWidth:160,margin:0}}><label style={{fontSize:12}}>Nota</label>
                      <input value={vf.note} onChange={e=>setVfk("note",e.target.value)} placeholder="motivazione, riferimento…"/></div>
                    <div className="muted" style={{fontSize:12.5,alignSelf:"center"}}>Media <b>{vfMedia}</b> → <b style={{color:vfQual==="Qualificato"?"var(--ok)":"var(--danger)"}}>{vfQual}</b></div>
                    <button type="button" className="btn small primary" onClick={addVal} disabled={valBusy}>+ Aggiungi valutazione</button>
                  </div>
                </div>}
                {valList===null? <div className="muted">Caricamento…</div>
                  : valList.length===0? <div className="muted" style={{fontSize:13}}>Nessuna valutazione registrata.</div>
                  : <div style={{overflowX:"auto"}}><table><thead><tr>
                      <th>Data</th><th style={{textAlign:"center"}}>Qual.</th><th style={{textAlign:"center"}}>Prezzo</th><th style={{textAlign:"center"}}>Tempi</th><th style={{textAlign:"center"}}>Ecosost.</th><th style={{textAlign:"center"}}>Disp.</th><th style={{textAlign:"center"}}>Media</th><th>Qualifica</th><th>Nota</th>{puoVal && <th></th>}
                    </tr></thead><tbody>
                      {valList.map((v,idx)=>{ const q=valQualificaForn(v);
                        return <tr key={v.id} style={idx===0?{background:"#f2f8ff"}:null}>
                          <td>{v.data_valutazione? new Date(v.data_valutazione).toLocaleDateString("it-IT"):"—"}{idx===0 && <span className="muted" style={{fontSize:10}}> (ultima)</span>}</td>
                          <td style={{textAlign:"center"}}>{v.qualita}</td><td style={{textAlign:"center"}}>{v.prezzo}</td><td style={{textAlign:"center"}}>{v.tempi}</td>
                          <td style={{textAlign:"center"}}>{v.ecosostenibilita}</td><td style={{textAlign:"center"}}>{v.disponibilita}</td>
                          <td style={{textAlign:"center",fontWeight:700}}>{valMediaForn(v)}</td>
                          <td><span className="tag" style={{background:q==="Qualificato"?"#e6f4ee":"#fdecec",color:q==="Qualificato"?"#1f9c68":"#c0392b"}}>{q}</span></td>
                          <td className="muted">{v.note||"—"}</td>
                          {puoVal && <td style={{textAlign:"right"}}><button type="button" className="btn small danger" onClick={()=>delVal(v.id)}>✕</button></td>}
                        </tr>; })}
                    </tbody></table></div>}
              </>}
          </div>
        </div>
        <footer>
          {perm.elimina && !nuovo && <button type="button" className="btn danger" onClick={elimina} disabled={busy}>Elimina</button>}
          <button type="button" className="btn" onClick={onClose}>Annulla</button>
          <button className="btn primary" disabled={busy}>{busy?<span className="spin"/>:"Salva"}</button>
        </footer>
      </form>
    </div>
  );
}

/* ================================================================ OPERATORI / RISORSE (5.4) */
function ModuloOperatori({profilo,perm}){
  const [operatori,setOperatori]=useState(null);
  const [err,setErr]=useState("");
  const [cerca,setCerca]=useState("");
  const [filtroRep,setFiltroRep]=useState("");
  const [editor,setEditor]=useState(null);

  const carica=useCallback(async()=>{
    setErr("");
    const {data,error}=await sb.from("operatori").select("*").order("reparto").order("nome");
    if(error){ setErr(error.message); return; }
    setOperatori(data||[]);
  },[]);
  useEffect(()=>{ carica(); },[carica]);

  const filtrati=useMemo(()=>{
    if(!operatori) return [];
    const q=cerca.trim().toLowerCase();
    return operatori.filter(o=>{
      const reps=(o.reparti&&o.reparti.length)? o.reparti : (o.reparto?[o.reparto]:[]);
      if(filtroRep && !reps.includes(filtroRep)) return false;
      if(!q) return true;
      return [o.nome,...reps].join(" ").toLowerCase().includes(q);
    });
  },[operatori,cerca,filtroRep]);

  const repartiEsistenti=useMemo(()=>{
    const s=new Set(LAVORAZIONI);
    (operatori||[]).forEach(o=>(o.reparti||[]).forEach(r=>r&&s.add(r)));
    return [...s];
  },[operatori]);

  const euro=n=>Number(n||0).toLocaleString("it-IT",{style:"currency",currency:"EUR"});
  const isAdmin = (profilo && profilo.ruolo==="amministratore");

  return (
    <>
      <div className="topbar">
        <h1>Operatori / Risorse</h1>
        {perm.scrivi && <button className="btn primary" onClick={()=>setEditor({})}>+ Nuovo operatore</button>}
      </div>
      <div className="content">
        {err && <div className="banner err">{err}</div>}
        {isAdmin && <div className="banner info">Il <b>costo orario</b> è un dato sensibile: sarà usato dai Preventivi per calcolare la manodopera.</div>}
        <div className="toolbar">
          <div className="search"><span className="mag">🔍</span>
            <input placeholder="Cerca per nome o reparto…" value={cerca} onChange={e=>setCerca(e.target.value)}/></div>
          <select className="btn" value={filtroRep} onChange={e=>setFiltroRep(e.target.value)} style={{maxWidth:260}}>
            <option value="">Tutti i reparti</option>
            {repartiEsistenti.map(l=><option key={l} value={l}>{l}</option>)}
          </select>
          <span className="muted">{filtrati.length} operatori</span>
        </div>

        {operatori===null ? <div className="empty">Caricamento…</div>
          : filtrati.length===0 ? <div className="card empty">Nessun operatore. Aggiungline uno con "+ Nuovo operatore".</div>
          : <div className="card" style={{overflow:"auto"}}>
              <table>
                <thead><tr><th>Nome</th><th>Reparto</th>{isAdmin && <th>Costo orario</th>}<th>Attivo</th></tr></thead>
                <tbody>
                  {filtrati.map(o=>
                    <tr key={o.id} onClick={()=>setEditor(o)}>
                      <td className="rs">{o.nome||"—"}</td>
                      <td>{(() => { const reps=(o.reparti&&o.reparti.length)?o.reparti:(o.reparto?[o.reparto]:[]);
                        return reps.length? reps.map(r=><span key={r} className="tag">{r}</span>) : <span className="muted">—</span>; })()}</td>
                      {isAdmin && <td style={{fontWeight:600}}>{euro(o.costo_orario)}/h</td>}
                      <td>{o.attivo===false?<span className="tag" style={{background:"#fdf0e3",color:"#c47a1e"}}>No</span>
                        :<span className="tag" style={{background:"#e6f4ee",color:"#1f9c68"}}>Sì</span>}</td>
                    </tr>)}
                </tbody>
              </table>
            </div>}
      </div>
      {editor && <OperatoreForm operatore={editor.id?editor:null} perm={perm} profilo={profilo} repartiEsistenti={repartiEsistenti}
        onClose={()=>setEditor(null)} onSalvato={()=>{setEditor(null);carica();}}/>}
    </>
  );
}

/* ------------------------------------------------ scheda operatore */
function OperatoreForm({operatore,perm,profilo,repartiEsistenti,onClose,onSalvato}){
  const nuovo=!operatore;
  const isAdmin = (profilo && profilo.ruolo==="amministratore");
  const [f,setF]=useState(()=>({
    nome:operatore?.nome||"",
    reparti:operatore?.reparti || (operatore?.reparto? [operatore.reparto]:[]),
    costo_orario:operatore?.costo_orario ?? "",
    tipo:operatore?.tipo||"produzione",
    costo_annuo:operatore?.costo_annuo ?? "",
    ore_produzione:operatore?.ore_produzione ?? "",
    pin:operatore?.pin||"",
    attivo:operatore?.attivo!==false,
    note:operatore?.note||"",
  }));
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  // ore realmente timbrate in Postazione negli ultimi 12 mesi (per tarare i "misto")
  const [oreReali,setOreReali]=useState(null);
  useEffect(()=>{ if(!operatore?.id){ setOreReali(null); return; }
    const dal=new Date(Date.now()-365*86400000).toISOString();

function calcolaPreventivo(righe, prev){
  let ricavi=0, costi=0, imbRighe=0;
  (righe||[]).forEach(r=>{
    const q=Number(r.quantita)||0, pu=Number(r.prezzo_unitario)||0, cu=Number(r.costo_unitario)||0, sc=Number(r.sconto_pct)||0;
    ricavi += q*pu*(1-sc/100);
    costi  += q*cu;
    imbRighe += Number(r.imballo_costo)||0;   // imballo per riga (a carico cliente)
  });
  const imballaggio=Number(prev.imballaggio)||0, trasporto=Number(prev.trasporto)||0;
  const speseGen = costi*(Number(prev.spese_generali_pct)||0)/100;
  const imponibile = ricavi + imbRighe + imballaggio + trasporto;
  const costoTot = costi + speseGen;
  const margine = imponibile - costoTot;
  const marginePct = imponibile>0 ? margine/imponibile*100 : 0;
  const iva = imponibile*(Number(prev.iva_pct)||0)/100;
  const totale = imponibile + iva;
  return {ricavi,costi,speseGen,imponibile,costoTot,margine,marginePct,iva,totale,imbRighe};
}
// Versione CLIENTE: fonde le righe di lavorazione (manodopera/impianto) dentro le righe
// materiale/prodotto, distribuendo il costo in proporzione. Il cliente non vede le fasi,
// il totale resta identico. Le righe imballo/trasporto restano gestite a parte (extra).
function righeVersioneCliente(righe){
  const isLab=r=>r.tipo==="manodopera"||r.tipo==="impianto";
  const rev=r=>(Number(r.quantita)||0)*(Number(r.prezzo_unitario)||0)*(1-(Number(r.sconto_pct)||0)/100);
  const mats=(righe||[]).filter(r=>!isLab(r));
  if(!mats.length) return righe||[];   // niente materiale su cui fondere: lascio invariato
  const labTot=(righe||[]).filter(isLab).reduce((s,r)=>s+rev(r),0);
  const baseTot=mats.reduce((s,r)=>s+rev(r),0);
  return mats.map(r=>{
    const q=Number(r.quantita)||0;
    const base=rev(r);
    const share = baseTot>0 ? labTot*(base/baseTot) : labTot/mats.length;
    const tot=base+share;
    const qDisp = q>0? q : 1;
    return {...r, quantita:qDisp, sconto_pct:0, prezzo_unitario: tot/qDisp};
  });
}

const CODE128_PAT=["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
function code128B(text){
  const vals=[104]; let sum=104;
  for(let i=0;i<text.length;i++){ const v=text.charCodeAt(i)-32; if(v<0||v>94) continue; vals.push(v); sum+=v*(i+1); }
  vals.push(sum%103,106);
  const bars=[];
  vals.forEach(v=>{ const p=CODE128_PAT[v]; for(let j=0;j<p.length;j++) bars.push({bar:j%2===0,w:parseInt(p[j],10)}); });
  return bars;
}
function code128SVG(text,mw,h){
  mw=mw||2; h=h||48;
  const bars=code128B(String(text||"")); const total=bars.reduce((a,b)=>a+b.w,0);
  const quiet=10, W=(total+quiet*2)*mw; let x=quiet*mw, rects="";
  bars.forEach(b=>{ if(b.bar){ rects+='<rect x="'+x+'" y="0" width="'+(b.w*mw)+'" height="'+h+'" fill="#000"/>'; } x+=b.w*mw; });
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+h+'" viewBox="0 0 '+W+' '+h+'">'+rects+'</svg>';
}

// Provvigione di UNA trattativa. fb = fallback % (cliente poi agente) per il modo 'percentuale'.
// margine: (valore − prezzo_netto) × quota_margine_pct. percentuale: valore × pct.
function calcProvvTratt(t, fb){
  if(!t) return 0;
  const val=Number(t.valore_stimato)||0;
  if(t.tipo_provvigione==="margine"){
    const netto=Number(t.prezzo_netto)||0, quota=Number(t.quota_margine_pct)||0;
    return Math.max(0, val-netto)*quota/100;
  }
  const cliPct=fb&&fb.cliPct, agPct=fb&&fb.agPct;
  const pct = t.provvigione_pct!=null ? Number(t.provvigione_pct)
            : (cliPct!=null ? Number(cliPct) : (agPct!=null ? Number(agPct) : 0));
  return val*pct/100;
}

function suggerisciConsumi(righe, prodotti){
  const out=[];
  (righe||[]).forEach(r=>{
    if(r.config && r.config.prodotto_id){
      // prodotto configurabile: consuma la quantità calcolata dalle MISURE (baseTot)
      const prod=(prodotti||[]).find(p=>p.id===r.config.prodotto_id);
      if(prod){
        const vs=(prod.prodotti_config_varianti||[]);
        const va=vs.find(v=>v.id===r.config.variante_id)||vs[0]||{};
        const artId=r.config.articolo_id||va.articolo_id||r.articolo_id||null;
        if(artId){
          const res=calcolaConfigurato(prod,va,r.config.mis||{},Number(r.config.N)||0,r.config.vInput||{},null,Number(r.config.abbondanza_cm)||0);
          out.push({articolo_id:artId, descrizione:(prod.nome||"")+(va.nome?" · "+va.nome:""),
            quantita:Math.round((res.baseTot||0)*100)/100, unita:prod.unita_calcolo||"", pagato_intero:r.pagato_intero!==false});
        }
      }
    }else if(r.articolo_id){
      out.push({articolo_id:r.articolo_id, descrizione:r.descrizione||"", quantita:Number(r.quantita)||0, unita:r.unita||"", pagato_intero:r.pagato_intero!==false});
    }
    // PLURIBALL per riga (imballo scelto sulla riga) -> scarica i metri dalla bobina scelta
    const plz=r.imballo_pluriball;
    if(plz && plz.articolo_id && Number(plz.mtl_tot)>0){
      out.push({articolo_id:plz.articolo_id, descrizione:(plz.nome||"Pluriball"),
        quantita:Number(plz.mtl_tot)||0, unita:"ml", pagato_intero:true});
    }
  });
  // unisce gli stessi articoli sommando le quantità; pagato_intero: false se anche una sola riga lo è
  const map={};
  out.forEach(c=>{ if(map[c.articolo_id]){ map[c.articolo_id].quantita+=c.quantita;
      map[c.articolo_id].pagato_intero=(map[c.articolo_id].pagato_intero!==false)&&(c.pagato_intero!==false); }
    else map[c.articolo_id]={...c, pagato_intero:c.pagato_intero!==false}; });
  return Object.values(map).map(c=>({...c, quantita:Math.round(c.quantita*100)/100, scaricato:false, movimento_id:null}));
}

// una voce ha bisogno di un input manuale se il suo modo NON coincide con l'unità del prodotto e non è "fisso"
function voceRichiedeInput(voce, unitaProdotto){ return voce.modo!==unitaProdotto && voce.modo!=="fisso"; }
// calcolo del prodotto configurato: misure {L,H} in cm, N pezzi, vInput = input manuali/opzioni
// Costo materiale EFFETTIVO della variante: se agganciata a un articolo di magazzino, il costo
// arriva da LI' (un solo posto da aggiornare); altrimenti si usa il costo scritto a mano.
// artMap = { articolo_id: costo }. Passato dai punti che hanno il catalogo caricato.
function costoMatVariante(va, artMap){
  if(va && va.articolo_id && artMap && artMap[va.articolo_id]!=null) return Number(artMap[va.articolo_id])||0;
  return Number(va && va.costo_materiale)||0;
}
function calcolaConfigurato(prod, va, mis, N, vInput, artMap, abbCm){
  const u=prod.unita_calcolo;
  const L=Number(mis.L)||0, H=Number(mis.H)||0, sp=Number(va.spessore)||0;
  // ABBONDANZA per lato (cm): si aggiunge alla dimensione totale di ogni lato (smarginatura+crocini).
  // Le misure nette (L,H) restano per la descrizione al cliente; qui si usa la misura MAGGIORATA per il consumo.
  const abb=Number(abbCm)||0;
  const Lm=L>0?L+abb:0, Hm=H>0?H+abb:0;
  let basePezzo=1;
  if(u==="mq") basePezzo=(Lm/100)*(Hm/100);
  else if(u==="mtl") basePezzo=(Lm/100);
  else if(u==="mc") basePezzo=(Lm/100)*(Hm/100)*(sp/1000);
  const baseTot=basePezzo*(N||0);
  // sfrido della variante = % di scarto materiale AGGIUNTIVO (default 0), oltre all'abbondanza dimensionale
  let costo=costoMatVariante(va,artMap)*baseTot*(1+(Number(va.sfrido_pct)||0)/100);
  (prod.prodotti_config_voci||[]).forEach(voce=>{
    if(voce.opzionale && !vInput["on_"+voce.id]) return;
    let qty;
    if(voce.modo===u) qty=baseTot;
    else if(voce.modo==="fisso") qty=1;
    else qty=Number(vInput["q_"+voce.id])||0;
    costo += (Number(voce.costo)||0)*qty;
  });
  const m=Number(prod.margine_pct)||0;
  let prezzo = m>0? costo/(1-m/100) : costo;
  const fasce=(prod.prodotti_config_fasce||[]).slice().sort((a,b)=>(Number(b.da_quantita)||0)-(Number(a.da_quantita)||0));
  const fa=fasce.find(x=>(N||0)>=(Number(x.da_quantita)||0));
  if(fa) prezzo=prezzo*(1-(Number(fa.sconto_pct)||0)/100);
  if(Number(prod.minimo)>0 && prezzo<Number(prod.minimo)) prezzo=Number(prod.minimo);
  return {costoTot:costo, prezzoTot:prezzo, baseTot, basePezzo, fascia:fa};
}
// costo di un imballo (ricetta) date misure {L,H}, N pezzi e input manuali
function calcolaImballo(imb, mis, N, vInput){
  if(!imb) return 0;
  const u=imb.unita_calcolo;
  const L=Number(mis&&mis.L)||0, H=Number(mis&&mis.H)||0, sp=Number(mis&&mis.sp)||0;
  let basePezzo=1;
  if(u==="mq") basePezzo=(L/100)*(H/100);
  else if(u==="mtl") basePezzo=(L/100);
  else if(u==="mc") basePezzo=(L/100)*(H/100)*(sp/1000);
  const baseTot=basePezzo*(Number(N)||0);
  const perimetro=(2*((L+H)/100))*(Number(N)||0);                 // scotch che gira sui bordi
  const capienza=Number(imb.capienza)||0;                          // pezzi per scatola
  const nScatole=capienza>0? Math.ceil((Number(N)||0)/capienza) : (Number(N)||0);
  let costo=0;
  (imb.imballi_voci||[]).forEach(v=>{
    let qty;
    if(v.modo==="perimetro") qty=perimetro;
    else if(v.modo==="scatola") qty=nScatole;
    else if(v.modo===u) qty=baseTot;
    else if(v.modo==="fisso") qty=1;
    else if(v.modo==="pz") qty=Number(N)||0;
    else qty=Number(vInput&&vInput["q_"+v.id])||0;
    costo += (Number(v.costo)||0)*qty;
  });
  return costo*(1+(Number(imb.ricarico_pct)||0)/100);
}

// PLURIBALL: bobine di altezze diverse, riconosciute dal codice PLURIBALL-<altezza in cm>.
// Ritorna le bobine (articoli) ordinate per altezza crescente.
function bobinePluriball(articoli){
  return (articoli||[]).map(a=>{
    const m=/PLURIBALL-?0*(\d+)/i.exec(String(a.codice||"")) || /pluriball\D*0*(\d+)/i.exec(String(a.nome_articolo||""));
    return m? {...a, altezza:Number(m[1])} : null;
  }).filter(Boolean).sort((x,y)=>x.altezza-y.altezza);
}
// Metri di pluriball per UN pannello L×H (cm) + bobina scelta in automatico dalla larghezza.
// Regola Creatio: metri = (lato lungo × 2) × 1,02 (2% di abbondanza); bobina = la piu' piccola che copre il lato corto.
function calcolaPluriball(mis, bobine){
  const L=Number(mis&&mis.L)||0, H=Number(mis&&mis.H)||0;
  if(!(L>0&&H>0) || !bobine.length) return null;
  const lungoM=Math.max(L,H)/100, corto=Math.min(L,H);
  const bob=bobine.find(b=>b.altezza>=corto) || bobine[bobine.length-1];
  const metri=Math.round((lungoM*2*1.02)*100)/100;
  return {bobina:bob, metri, coperto:bob.altezza>=corto};
}
function imbVoceRichiedeInput(v, unitaImb){ return v.modo!==unitaImb && v.modo!=="fisso" && v.modo!=="pz"; }
// peso (kg) di una riga preventivo/commessa, calcolato dall'articolo collegato. null = peso non calcolabile
function pesoRiga(r, articoli){
  const artId=(r.config&&r.config.articolo_id)||r.articolo_id;
  const a=(articoli||[]).find(x=>x.id===artId);
  if(!a) return null;
  const ecc=1+(Number(a.peso_eccedenza_pct)||0)/100;
  const N=Number(r.quantita)||0;
  // "a peso": la quantita' e' gia' in kg (materiale venduto a peso), non serve il campo peso
  if(a.peso_um==="kg"){ return N*ecc; }
  if(!(Number(a.peso_kg)>0)) return null;
  const mis=(r.config&&r.config.mis)||{};
  const L=Number(mis.L)||0, H=Number(mis.H)||0;
  let q;
  if(a.peso_um==="mq"){ if(!(L>0&&H>0)) return null; q=(L/100)*(H/100)*N; }
  else if(a.peso_um==="mtl"){ if(!(L>0)) return null; q=(L/100)*N; }
  else { q=N; }
  return q*(Number(a.peso_kg)||0)*ecc;
}
// costo trasporto dato il corriere (con scaglioni) e i totali {peso,volume,colli,mq}
function calcolaTrasporto(corr, tot){
  if(!corr) return {costo:0, metrica:0};
  const peso=Number(tot.peso)||0, volume=Number(tot.volume)||0, colli=Number(tot.colli)||0, mq=Number(tot.mq)||0;
  let metrica;
  if(corr.base==="peso_volumetrico") metrica=Math.max(peso, volume*(Number(corr.coeff_volumetrico)||0));
  else if(corr.base==="colli") metrica=colli;
  else if(corr.base==="volume") metrica=volume;
  else if(corr.base==="mq") metrica=mq;
  else metrica=peso;
  const sc=(corr.corrieri_scaglioni||[]).slice().sort((a,b)=>(Number(a.da_valore)||0)-(Number(b.da_valore)||0));
  let prezzo=0, trovato=false;
  for(const s of sc){ if(metrica>=(Number(s.da_valore)||0)){ prezzo=Number(s.prezzo)||0; trovato=true; } }
  let costo=prezzo + (Number(corr.supplemento_collo)||0)*colli;
  if(costo<(Number(corr.minimo)||0)) costo=Number(corr.minimo)||0;
  return {costo:Math.round(costo*100)/100, metrica:Math.round(metrica*100)/100, fuoriScaglione:!trovato && sc.length>0};
}

function ModuloDDT({profilo,perm}){
  const [ddts,setDdts]=useState(null);
  const [clienti,setClienti]=useState([]);
  const [commesse,setCommesse]=useState([]);
  const [az,setAz]=useState({});
  const [err,setErr]=useState("");
  const [cerca,setCerca]=useState("");
  const [editor,setEditor]=useState(null);

  const carica=useCallback(async()=>{
    setErr("");
    const [d,c,co,i]=await Promise.all([
      sb.from("ddt").select("*, ddt_righe(*)").order("creato_il",{ascending:false}),
      sb.from("clienti").select("id,ragione_sociale,partita_iva").order("ragione_sociale"),
      sb.from("commesse").select("id,numero,cliente_id,cliente_nome, commesse_righe(id,descrizione,articolo_id,quantita,unita,stato,quantita_consegnata)").order("creato_il",{ascending:false}).limit(200),
      sb.from("azienda_info").select("*").maybeSingle(),
    ]);
    if(d.error){ setErr(d.error.message); return; }
    setDdts(d.data||[]); setClienti(c.data||[]); setCommesse(co.data||[]); if(i.data) setAz(i.data);
  },[]);
  useEffect(()=>{ carica(); },[carica]);

  const filtrati=useMemo(()=>{
    if(!ddts) return [];
    const q=cerca.trim().toLowerCase();
    return ddts.filter(x=>!q || [x.numero,x.cliente_nome,x.causale].join(" ").toLowerCase().includes(q));
  },[ddts,cerca]);

  async function stampa(x){
    let cli=null;
    if(x.cliente_id){ const {data}=await sb.from("clienti").select("*, clienti_sedi(*)").eq("id",x.cliente_id).maybeSingle(); cli=data; }
    stampaHTML(htmlDDT(x, (x.ddt_righe||[]).slice().sort((a,b)=>(a.ordine||0)-(b.ordine||0)), az, cli));
  }
  async function elimina(x){
    if(!window.confirm("Eliminare il DDT "+x.numero+"?")) return;
    const {error}=await sb.from("ddt").delete().eq("id",x.id);
    if(error){ alert("Errore: "+error.message); return; }
    carica();
  }
  const fmt=d=>d?new Date(d).toLocaleDateString("it-IT"):"—";

  return (
    <>
      <div className="topbar"><h1>DDT — Documenti di trasporto</h1>
        {perm.scrivi && <button className="btn primary" onClick={()=>setEditor({})}>+ Nuovo DDT</button>}</div>
      <div className="content">
        {err && <div className="banner err">{err}</div>}
        <div className="toolbar"><div className="search"><span className="mag">🔍</span>
          <input placeholder="Cerca per numero, cliente, causale…" value={cerca} onChange={e=>setCerca(e.target.value)}/></div>
          <span className="muted">{filtrati.length} documenti</span></div>
        {ddts===null ? <div className="empty">Caricamento…</div>
          : filtrati.length===0 ? <div className="card empty">Nessun DDT. Inizia con "+ Nuovo DDT".</div>
          : <div className="card" style={{overflow:"auto"}}>
              <table>
                <thead><tr><th>Numero</th><th>Data</th><th>Destinatario</th><th>Causale</th><th>Colli</th><th>Stato</th><th></th></tr></thead>
                <tbody>
                  {filtrati.map(x=>(
                    <tr key={x.id}>
                      <td className="rs" style={{fontFamily:"monospace"}}>{x.numero}</td>
                      <td className="muted">{fmt(x.data)}</td>
                      <td>{x.cliente_nome||"—"}</td>
                      <td className="muted">{x.causale||"—"}</td>
                      <td className="muted">{x.colli||"—"}</td>
                      <td><span style={{fontSize:12,fontWeight:700,color:x.stato==="emesso"?"var(--ok)":"var(--warn)"}}>{x.stato}</span></td>
                      <td style={{whiteSpace:"nowrap"}}>
                        <button className="btn small" onClick={()=>setEditor(x)}>Apri</button>{" "}
                        <button className="btn small" title="Stampa PDF" onClick={()=>stampa(x)}>🖨️</button>
                        {perm.elimina && <> <button className="btn small danger" onClick={()=>elimina(x)}>✕</button></>}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>}
      </div>
      {editor && <DDTEditor ddt={editor.id?editor:null} commessaId={null} profilo={profilo} perm={perm}
        onClose={()=>setEditor(null)} onSalvato={()=>{setEditor(null);carica();}}/>}
    </>
  );
}

function DDTEditor({ddt,commessaId,profilo,perm,onClose,onSalvato}){
  const nuovo=!ddt;
  const [clienti,setClienti]=useState([]);
  const [commesse,setCommesse]=useState([]);
  const [az,setAz]=useState({});
  const [f,setF]=useState(()=>({
    numero:ddt?.numero||"",
    data:ddt?.data||new Date().toISOString().slice(0,10),
    ora_trasporto:ddt?.ora_trasporto||"",
    cliente_id:ddt?.cliente_id||"",
    cliente_nome:ddt?.cliente_nome||"",
    commessa_id:ddt?.commessa_id||commessaId||"",
    causale:ddt?.causale||"Vendita",
    aspetto_beni:ddt?.aspetto_beni||"Colli",
    colli:ddt?.colli??1,
    peso_kg:ddt?.peso_kg??"",
    porto:ddt?.porto||"Franco",
    vettore_tipo:ddt?.vettore_tipo||"mittente",
    vettore_nome:ddt?.vettore_nome||"",
    note:ddt?.note||"",
    stato:ddt?.stato||"bozza",
  }));
  const [righe,setRighe]=useState(()=> (ddt?.ddt_righe||[]).slice().sort((a,b)=>(a.ordine||0)-(b.ordine||0)).map(r=>({...r})) );
  const [dest,setDest]=useState(ddt?.destinatario||{});
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const set=(k,v)=>setF(p=>({...p,[k]:v}));

  useEffect(()=>{ (async()=>{
    const [c,co,a]=await Promise.all([
      sb.from("clienti").select("id,ragione_sociale,partita_iva").order("ragione_sociale"),
      sb.from("commesse").select("id,numero,cliente_id,cliente_nome, commesse_righe(id,descrizione,articolo_id,quantita,unita,stato,quantita_consegnata)").order("creato_il",{ascending:false}).limit(200),
      sb.from("azienda_info").select("*").maybeSingle(),
    ]);
    setClienti(c.data||[]); const coData=co.data||[]; setCommesse(coData); if(a.data) setAz(a.data);
    if(nuovo){ const {data:dd}=await sb.from("ddt").select("numero"); setF(p=>p.numero?p:{...p,numero:prossimoNumeroDDT(dd||[])}); }
    if(commessaId && nuovo) importaCommessa(commessaId, coData);
  })(); },[]);

  async function pickCliente(id, nome){
    set("cliente_id",id);
    set("cliente_nome", nome || ((clienti.find(x=>x.id===id)||{}).ragione_sociale) || "");
    if(id){ const {data}=await sb.from("clienti").select("clienti_sedi(*)").eq("id",id).maybeSingle();
      const sedi=(data&&data.clienti_sedi)||[];
      const s=sedi.find(x=>x.tipo==="destinazione_merce")||sedi.find(x=>x.tipo==="operativa")||sedi.find(x=>x.tipo==="legale")||sedi[0]||{};
      setDest({indirizzo:s.indirizzo||"",cap:s.cap||"",citta:s.citta||"",provincia:s.provincia||""}); }
    else setDest({});
  }
  function importaCommessa(id, list){
    set("commessa_id",id);
    const c=(list||commesse).find(x=>x.id===id);
    if(!c) return;
    if(c.cliente_id) pickCliente(c.cliente_id, c.cliente_nome);
    const res=r=>(Number(r.quantita)||0)-(Number(r.quantita_consegnata)||0);
    const daSpedire=(c.commesse_righe||[]).filter(r=>res(r)>0 && r.stato!=="consegnato");
    let pool=daSpedire.filter(r=>r.stato==="pronto");   // prima i pronti (spedizione parziale)
    let msg="";
    if(!pool.length && daSpedire.length){ pool=daSpedire; msg="⚠ Nessun articolo ancora \"pronto\": importati tutti quelli da spedire — controlla lo stato prima di emettere."; }
    if(!pool.length){ setErr("Questa commessa non ha articoli da spedire (tutti già consegnati)."); setRighe(p=>p.filter(x=>!x.commessa_riga_id)); return; }
    setErr(msg);
    const nuove=pool.map(r=>({descrizione:r.descrizione,articolo_id:r.articolo_id||null,quantita:res(r),unita:r.unita||"",commessa_riga_id:r.id,_stato:r.stato}));
    setRighe(p=>[...p.filter(x=>!x.commessa_riga_id),...nuove]);
  }
  const setRiga=(i,k,v)=>setRighe(p=>p.map((r,j)=>j===i?{...r,[k]:v}:r));
  const addRiga=()=>setRighe(p=>[...p,{descrizione:"",articolo_id:null,quantita:1,unita:""}]);
  const delRiga=i=>setRighe(p=>p.filter((_,j)=>j!==i));

  async function salva(emesso){
    if(!f.cliente_id){ setErr("Scegli il destinatario (cliente)."); return; }
    setBusy(true); setErr("");
    const rec={numero:f.numero,data:f.data,ora_trasporto:f.ora_trasporto,commessa_id:f.commessa_id||null,
      cliente_id:f.cliente_id,cliente_nome:f.cliente_nome,destinatario:dest,causale:f.causale,
      aspetto_beni:f.aspetto_beni,colli:Number(f.colli)||0,peso_kg:f.peso_kg===""?null:Number(f.peso_kg),
      porto:f.porto,vettore_tipo:f.vettore_tipo,vettore_nome:f.vettore_nome,note:f.note,
      stato:emesso?"emesso":f.stato,creato_da:profilo.id};
    let ddtId=ddt?.id;
    if(nuovo){ const {data,error}=await sb.from("ddt").insert(rec).select("id").single();
      if(error){ setErr(error.message); setBusy(false); return; } ddtId=data.id; }
    else { const {error}=await sb.from("ddt").update(rec).eq("id",ddt.id);
      if(error){ setErr(error.message); setBusy(false); return; } }
    await sb.from("ddt_righe").delete().eq("ddt_id",ddtId);
    if(righe.length){ const rr=righe.map((r,idx)=>({ddt_id:ddtId,ordine:idx,descrizione:r.descrizione||"",articolo_id:r.articolo_id||null,quantita:Number(r.quantita)||0,unita:r.unita||"",commessa_riga_id:r.commessa_riga_id||null}));
      const {error}=await sb.from("ddt_righe").insert(rr); if(error){ setErr(error.message); setBusy(false); return; } }
    // all'EMISSIONE (solo la prima volta): segna consegnate le righe di commessa spedite
    if(emesso && (!ddt || ddt.stato!=="emesso")){
      for(const r of righe){
        if(!r.commessa_riga_id) continue;
        const {data:cr}=await sb.from("commesse_righe").select("quantita,quantita_consegnata").eq("id",r.commessa_riga_id).maybeSingle();
        if(cr){ const nc=(Number(cr.quantita_consegnata)||0)+(Number(r.quantita)||0), tot=Number(cr.quantita)||0;
          await sb.from("commesse_righe").update({quantita_consegnata:nc, stato: nc>=tot?"consegnato":"pronto"}).eq("id",r.commessa_riga_id); }
      }
      // se dopo l'emissione TUTTE le righe della commessa sono consegnate (ritiro,
      // mezzo nostro o corriere), la commessa passa a "consegnata"
      if(f.commessa_id){
        try{
          const {data:allr}=await sb.from("commesse_righe").select("stato").eq("commessa_id",f.commessa_id);
          const tutteCons=(allr||[]).length>0 && allr.every(x=>x.stato==="consegnato");
          if(tutteCons){ await sb.from("commesse").update({stato:"consegnata"}).eq("id",f.commessa_id); }
        }catch(e){}
      }
    }
    setBusy(false); onSalvato();
  }
  function stampa(){
    const cli={ragione_sociale:f.cliente_nome, partita_iva:(clienti.find(c=>c.id===f.cliente_id)||{}).partita_iva, clienti_sedi:[{tipo:"destinazione_merce",...dest}]};
    stampaHTML(htmlDDT({...f,destinatario:dest}, righe, az, cli));
  }
  const inNum={width:70,padding:"6px 7px",border:"1px solid var(--line)",borderRadius:7,textAlign:"right"};

  return (
    <div className="overlay">
      <div className="modal" style={{maxWidth:820,maxHeight:"92vh",display:"flex",flexDirection:"column"}}>
        <header><h2>{nuovo?"Nuovo DDT":"DDT "+f.numero}</h2><button type="button" className="x" onClick={onClose}>×</button></header>
        <div className="body" style={{overflow:"auto"}}>
          {err && <div className="banner err">{err}</div>}
          <div className="section">
            <h3>Documento</h3>
            <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
              <div className="field" style={{maxWidth:150}}><label>Numero</label><input value={f.numero} onChange={e=>set("numero",e.target.value)}/></div>
              <div className="field" style={{maxWidth:150}}><label>Data</label><input type="date" value={f.data} onChange={e=>set("data",e.target.value)}/></div>
              <div className="field" style={{maxWidth:110}}><label>Ora trasporto</label><input type="time" value={f.ora_trasporto} onChange={e=>set("ora_trasporto",e.target.value)}/></div>
              <div className="field" style={{maxWidth:220}}><label>Causale del trasporto</label>
                <select value={f.causale} onChange={e=>set("causale",e.target.value)}>{CAUSALI_TRASPORTO.map(c=><option key={c} value={c}>{c}</option>)}</select></div>
            </div>
          </div>
          <div className="section">
            <h3>Destinatario</h3>
            <div className="field"><label>Cliente</label>
              <select value={f.cliente_id} onChange={e=>pickCliente(e.target.value)}>
                <option value="">— scegli —</option>{clienti.map(c=><option key={c.id} value={c.id}>{c.ragione_sociale}</option>)}</select></div>
            {f.cliente_id && <div className="muted" style={{fontSize:13}}>Consegna a: {[dest.indirizzo,dest.cap,dest.citta,dest.provincia&&"("+dest.provincia+")"].filter(Boolean).join(" ")||"— nessuna sede consegna in anagrafica —"}</div>}
          </div>
          <div className="section">
            <h3>Trasporto</h3>
            <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
              <div className="field" style={{maxWidth:180}}><label>Aspetto dei beni</label>
                <select value={f.aspetto_beni} onChange={e=>set("aspetto_beni",e.target.value)}>{ASPETTO_BENI.map(a=><option key={a} value={a}>{a}</option>)}</select></div>
              <div className="field" style={{maxWidth:90}}><label>N. colli</label><input type="number" min="0" value={f.colli} onChange={e=>set("colli",e.target.value)}/></div>
              <div className="field" style={{maxWidth:110}}><label>Peso (kg)</label><input type="number" step="0.01" min="0" value={f.peso_kg} onChange={e=>set("peso_kg",e.target.value)}/></div>
              <div className="field" style={{maxWidth:130}}><label>Porto</label>
                <select value={f.porto} onChange={e=>set("porto",e.target.value)}>{PORTO_TIPO.map(p=><option key={p} value={p}>{p}</option>)}</select></div>
              <div className="field" style={{maxWidth:230}}><label>Trasporto a cura di</label>
                <select value={f.vettore_tipo} onChange={e=>set("vettore_tipo",e.target.value)}>{VETTORE_TIPO.map(v=><option key={v.v} value={v.v}>{v.l}</option>)}</select></div>
              <div className="field" style={{flex:1,minWidth:180}}><label>Vettore (nome)</label><input value={f.vettore_nome} onChange={e=>set("vettore_nome",e.target.value)} placeholder="Se vettore terzo…"/></div>
            </div>
          </div>
          <div className="section">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <h3 style={{margin:0}}>Articoli trasportati</h3>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                {commessaId
                  ? <span className="muted" style={{fontSize:13}}>Commessa {(commesse.find(c=>c.id===commessaId)||{}).numero||f.commessa_id}</span>
                  : (commesse.length>0 && <select className="btn small" value="" onChange={e=>e.target.value&&importaCommessa(e.target.value)} style={{maxWidth:230}}>
                      <option value="">⬇ Genera da commessa (solo pronti)…</option>{commesse.map(c=><option key={c.id} value={c.id}>{c.numero} · {c.cliente_nome}</option>)}</select>)}
                <button type="button" className="btn small" onClick={addRiga}>+ Riga</button>
              </div>
            </div>
            {righe.some(r=>r.commessa_riga_id) && <div className="banner info" style={{marginTop:8,fontSize:12.5}}>Quantità modificabili: spedisci <b>meno del pronto</b> per una <b>consegna parziale</b> — il resto resta in commessa e lo spedisci con un DDT successivo. All'<b>emissione</b> le righe spedite passano a <b>consegnato</b>.</div>}
            <div style={{overflow:"auto",marginTop:10}}>
              <table>
                <thead><tr><th>Descrizione</th><th style={{width:80}}>Q.tà</th><th style={{width:70}}>U.M.</th><th></th></tr></thead>
                <tbody>
                  {righe.length===0 && <tr><td colSpan={4} className="muted" style={{padding:12}}>Nessuna riga. Aggiungi a mano o importa da una commessa.</td></tr>}
                  {righe.map((r,i)=>(
                    <tr key={i}>
                      <td><input value={r.descrizione} onChange={e=>setRiga(i,"descrizione",e.target.value)} style={{width:"100%",padding:"6px",border:"1px solid var(--line)",borderRadius:7}}/></td>
                      <td><input type="number" step="0.01" value={r.quantita} onChange={e=>setRiga(i,"quantita",e.target.value)} style={inNum}/></td>
                      <td><input value={r.unita||""} onChange={e=>setRiga(i,"unita",e.target.value)} style={{width:60,padding:"6px",border:"1px solid var(--line)",borderRadius:7}}/></td>
                      <td><button type="button" className="btn small danger" onClick={()=>delRiga(i)}>✕</button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
          <div className="field"><label>Annotazioni</label><textarea rows={2} value={f.note} onChange={e=>set("note",e.target.value)}/></div>
        </div>
        <footer>
          <button type="button" className="btn" onClick={onClose}>Annulla</button>
          <button type="button" className="btn" onClick={stampa}>🖨️ PDF</button>
          {perm.scrivi && <button type="button" className="btn" disabled={busy} onClick={()=>salva(false)}>{busy?<span className="spin"/>:"Salva bozza"}</button>}
          {perm.scrivi && <button type="button" className="btn primary" disabled={busy} onClick={()=>salva(true)}>{busy?<span className="spin"/>:"Emetti DDT"}</button>}
        </footer>
      </div>
    </div>
  );
}

function ModuloPreventivi({profilo,perm}){
  const [preventivi,setPreventivi]=useState(null);
  const [clienti,setClienti]=useState([]);
  const [articoli,setArticoli]=useState([]);
  const [imp,setImp]=useState({spese_generali_pct:0,margine_minimo_pct:0,iva_pct:22});
  const [tariffe,setTariffe]=useState([]);
  const [prodotti,setProdotti]=useState([]);
  const [imballi,setImballi]=useState([]);
  const [corrieri,setCorrieri]=useState([]);
  const [err,setErr]=useState("");
  const [cerca,setCerca]=useState("");
  const [filtroStato,setFiltroStato]=useState("");
  const [editor,setEditor]=useState(null);
  const [editBozza,setEditBozza]=useState(null);
  const [bozza,setBozza]=useState(()=>leggiBozza());

  const riprendiBozza=()=>{
    if(!bozza) return;
    if(bozza.key && bozza.key!=="new"){ const pv=(preventivi||[]).find(p=>p.id===bozza.key); setEditBozza(bozza); setEditor(pv||{}); }
    else { setEditBozza(bozza); setEditor({}); }
  };
  const scartaBozza=()=>{ cancellaBozza(); setBozza(null); };

  const carica=useCallback(async()=>{
    setErr("");
    const [p,c,a,i,t,pc,imb,co]=await Promise.all([
      sb.from("preventivi").select("*, preventivi_righe(*)").order("creato_il",{ascending:false}),
      sb.from("clienti").select("id,ragione_sociale,categoria,sconto_pct, clienti_sconti(categoria,sconto_pct)").order("ragione_sociale"),
      caricaArticoliTutti("id,codice,nome_articolo,unita,categoria,costo,prezzo_pubblico,giacenza,impegnato,peso_kg,peso_um,peso_eccedenza_pct"),
      sb.from("impostazioni").select("*").eq("id",1).maybeSingle(),
      sb.from("impostazioni_lavorazioni").select("*"),
      sb.from("prodotti_config").select("*, prodotti_config_varianti(*), prodotti_config_voci(*), prodotti_config_fasce(*)").eq("attivo",true).order("nome"),
      sb.from("imballi").select("*, imballi_voci(*)").eq("attivo",true).order("nome"),
      sb.from("corrieri").select("*, corrieri_scaglioni(*)").eq("attivo",true).order("nome"),
    ]);
    if(p.error){ setErr(p.error.message); return; }
    setPreventivi(p.data||[]); setClienti(c.data||[]); setArticoli(a);
    if(i.data) setImp(i.data);
    setTariffe(t.data||[]); setProdotti(pc.data||[]); setImballi(imb.data||[]); setCorrieri(co.data||[]);
  },[]);
  useEffect(()=>{ carica(); },[carica]);

  const filtrati=useMemo(()=>{
    if(!preventivi) return [];
    const q=cerca.trim().toLowerCase();
    return preventivi.filter(p=>{
      if(filtroStato && p.stato!==filtroStato) return false;
      if(!q) return true;
      return [p.numero,p.cliente_nome,p.descrizione_breve,p.riferimento].join(" ").toLowerCase().includes(q);
    });
  },[preventivi,cerca,filtroStato]);

  return (
    <>
      <div className="topbar"><h1>Preventivi</h1>
        {perm.scrivi && <button className="btn primary" onClick={()=>{setEditBozza(null);setEditor({});}}>+ Nuovo preventivo</button>}
      </div>
      <div className="content">
        {err && <div className="banner err">{err}</div>}
        {bozza && !editor && <div className="banner info" style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          <span>📝 Hai una <b>bozza di preventivo non salvata</b> ({bozza.etichetta||"—"}).</span>
          <span style={{whiteSpace:"nowrap"}}>
            <button className="btn small primary" onClick={riprendiBozza}>Riprendi</button>{" "}
            <button className="btn small" onClick={scartaBozza}>Scarta</button>
          </span>
        </div>}
        <div className="toolbar">
          <div className="search"><span className="mag">🔍</span>
            <input placeholder="Cerca per numero, cliente, descrizione, riferimento…" value={cerca} onChange={e=>setCerca(e.target.value)}/></div>
          <select className="btn" value={filtroStato} onChange={e=>setFiltroStato(e.target.value)} style={{maxWidth:160}}>
            <option value="">Tutti gli stati</option>
            {Object.keys(STATI_PREV).map(s=><option key={s} value={s}>{STATI_PREV[s].l}</option>)}
          </select>
          <span className="muted">{filtrati.length} preventivi</span>
        </div>
        {preventivi===null ? <div className="empty">Caricamento…</div>
          : filtrati.length===0 ? <div className="card empty">Nessun preventivo. Creane uno con "+ Nuovo preventivo".</div>
          : <div className="card" style={{overflow:"auto"}}>
              <table>
                <thead><tr><th>Numero</th><th>Cliente</th><th>Descrizione</th><th>Data</th><th>Stato</th><th style={{textAlign:"right"}}>Totale</th></tr></thead>
                <tbody>
                  {filtrati.map(p=>{
                    const t=calcolaPreventivo(p.preventivi_righe,p);
                    const st=STATI_PREV[p.stato]||STATI_PREV.bozza;
                    return (
                      <tr key={p.id} onClick={()=>{setEditBozza(null);setEditor(p);}}>
                        <td className="rs">{p.numero||"—"}</td>
                        <td>{p.cliente_nome||"—"}</td>
