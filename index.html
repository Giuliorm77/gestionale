              <input value={r.sottotitolo||""} placeholder="Sottotitolo (es. Negozio · centro città)" disabled={!perm.scrivi} onChange={e=>set(i,"sottotitolo",e.target.value)} style={{marginTop:4,width:"100%"}}/>
              <div style={{display:"flex",gap:6,alignItems:"center",marginTop:6}}>
                <span className="muted" style={{fontSize:11}}>ord.</span><input type="number" value={r.ordine} disabled={!perm.scrivi} onChange={e=>set(i,"ordine",e.target.value)} style={{width:52}}/>
                <label style={{fontSize:12,display:"flex",gap:4,alignItems:"center"}}><input type="checkbox" checked={r.attivo!==false} disabled={!perm.scrivi} onChange={e=>set(i,"attivo",e.target.checked)} style={{width:"auto"}}/>attivo</label>
              </div>
              {perm.scrivi && <div style={{display:"flex",gap:6,marginTop:8}}>
                <button type="button" className="btn small primary" onClick={()=>salva(r)}>Salva</button>
                <button type="button" className="btn small danger" onClick={()=>elimina(r)}>✕</button></div>}
            </div>
          ))}
          {rows.length===0 && <div className="muted" style={{fontSize:13}}>Nessuna foto. {perm.scrivi?"Aggiungine con il pulsante qui sotto.":""}</div>}
        </div>}
      {perm.scrivi && <button type="button" className="btn small" style={{marginTop:12}} onClick={addRow}>+ Aggiungi foto</button>}
    </div>
  );
}

/* ------------------------------------------------ editor scheda vetrina */
function SchedaEditor({item, scheda, perm, onClose, onSaved}){
  const [f,setF]=useState(()=>({
    sottotitolo:scheda?.sottotitolo||"",
    descrizione:scheda?.descrizione||"",
    caratteristiche:Array.isArray(scheda?.caratteristiche)?scheda.caratteristiche:[],
    immagini:Array.isArray(scheda?.immagini)?scheda.immagini:[],
    template_path:scheda?.template_path||null,
    template_nome:scheda?.template_nome||"",
    template_note:scheda?.template_note||"",
    attivo: scheda? scheda.attivo!==false : true,
  }));
  const [busy,setBusy]=useState(false);
  const [up,setUp]=useState("");        // "img" | "pdf" mentre carica
  const [err,setErr]=useState("");
  const ro=!perm.scrivi;

  async function caricaImg(e){
    const files=[...(e.target.files||[])]; e.target.value="";
    if(!files.length) return;
    setUp("img"); setErr("");
    try{
      const nuove=[];
      for(const file of files){
        if(!file.type.startsWith("image/")) continue;
        const path=kNewPath("gallery", kSafeExt(file.name)||"jpg");
        const {error}=await sb.storage.from(KOMUNIGO_BUCKET).upload(path,file,{cacheControl:"3600",upsert:false});
        if(error) throw error;
        nuove.push({path, alt:""});
      }
      setF(p=>({...p,immagini:[...(p.immagini||[]),...nuove]}));
    }catch(ex){ setErr("Immagini: "+(ex.message||ex)); }
    setUp("");
  }
  async function rmImg(path){
    setF(p=>({...p,immagini:(p.immagini||[]).filter(x=>x.path!==path)}));
    try{ await sb.storage.from(KOMUNIGO_BUCKET).remove([path]); }catch(e){}
  }
  async function caricaPdf(e){
    const file=(e.target.files||[])[0]; e.target.value="";
    if(!file) return;
    if(file.type!=="application/pdf" && kSafeExt(file.name)!=="pdf"){ setErr("Il template deve essere un PDF."); return; }
    setUp("pdf"); setErr("");
    try{
      if(f.template_path){ try{ await sb.storage.from(KOMUNIGO_BUCKET).remove([f.template_path]); }catch(e){} }
      const path=kNewPath("template","pdf");
      const {error}=await sb.storage.from(KOMUNIGO_BUCKET).upload(path,file,{cacheControl:"3600",upsert:false,contentType:"application/pdf"});
      if(error) throw error;
      setF(p=>({...p,template_path:path,template_nome:file.name}));
    }catch(ex){ setErr("Template PDF: "+(ex.message||ex)); }
    setUp("");
  }
  async function rmPdf(){
    const path=f.template_path;
    setF(p=>({...p,template_path:null,template_nome:""}));
    if(path){ try{ await sb.storage.from(KOMUNIGO_BUCKET).remove([path]); }catch(e){} }
  }
  const setCar=(i,k,v)=>setF(p=>{ const c=[...p.caratteristiche]; c[i]={...c[i],[k]:v}; return {...p,caratteristiche:c}; });
  const addCar=()=>setF(p=>({...p,caratteristiche:[...(p.caratteristiche||[]),{label:"",valore:""}]}));
  const rmCar=i=>setF(p=>({...p,caratteristiche:p.caratteristiche.filter((_,j)=>j!==i)}));

  async function salva(){
    setBusy(true); setErr("");
    try{
      const payload={
        tipo:item.tipo, ref_id:item.ref_id,
        sottotitolo:f.sottotitolo, descrizione:f.descrizione,
        caratteristiche:(f.caratteristiche||[]).filter(c=>(c.label||"").trim()||(c.valore||"").trim()),
        immagini:f.immagini||[],
        template_path:f.template_path, template_nome:f.template_nome, template_note:f.template_note,
        attivo:!!f.attivo, aggiornato_il:new Date().toISOString(),
      };
      const {error}=await sb.from("komunigo_schede").upsert(payload,{onConflict:"tipo,ref_id"});
      if(error) throw error;
      onSaved();
    }catch(ex){ setErr(ex.message||String(ex)); }
    setBusy(false);
  }

  return (
    <div className="overlay" style={{zIndex:60}}>
      <div className="modal" style={{maxWidth:760}} onClick={e=>e.stopPropagation()}>
        <header><h2>Scheda: {item.nome}</h2><button type="button" className="x" onClick={onClose}>×</button></header>
        <div className="body">
          {err && <div className="banner err">{err}</div>}
          <div className="muted" style={{fontSize:12,marginBottom:4}}>{item.tipo==="configuratore"?"Prodotto su misura (configuratore)":"Prodotto a magazzino"}</div>

          <div className="field"><label>Sottotitolo <span className="muted" style={{textTransform:"none",fontWeight:400}}>(riga breve sotto il nome)</span></label>
            <input value={f.sottotitolo} disabled={ro} onChange={e=>setF(p=>({...p,sottotitolo:e.target.value}))} placeholder="es. Pannello rigido, leggero e resistente"/></div>

          <div className="field"><label>Descrizione</label>
            <textarea rows={5} value={f.descrizione} disabled={ro} onChange={e=>setF(p=>({...p,descrizione:e.target.value}))}
              placeholder="Descrizione completa del prodotto, usi tipici, materiali, finiture…"/></div>

          <div className="section">
            <h3>Caratteristiche tecniche</h3>
            {(f.caratteristiche||[]).map((c,i)=>
              <div className="row" key={i} style={{alignItems:"center",marginBottom:6}}>
                <div className="field" style={{margin:0,flex:"0 0 220px"}}><input value={c.label||""} disabled={ro} placeholder="Etichetta (es. Materiale)" onChange={e=>setCar(i,"label",e.target.value)}/></div>
                <div className="field" style={{margin:0,flex:1}}><input value={c.valore||""} disabled={ro} placeholder="Valore (es. Forex 5 mm)" onChange={e=>setCar(i,"valore",e.target.value)}/></div>
                {!ro && <button type="button" className="btn small danger" onClick={()=>rmCar(i)}>✕</button>}
              </div>)}
            {!ro && <button type="button" className="btn small" onClick={addCar}>+ Aggiungi caratteristica</button>}
          </div>

          <div className="section">
            <h3>📷 Immagini di galleria</h3>
            <div style={{display:"flex",flexWrap:"wrap",gap:10,alignItems:"flex-start"}}>
              {(f.immagini||[]).map(img=>(
                <div key={img.path} style={{position:"relative",width:96,height:96,borderRadius:8,overflow:"hidden",border:"1px solid var(--line)"}}>
                  <a href={kPub(img.path)} target="_blank" rel="noopener noreferrer"><img src={kPub(img.path)} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/></a>
                  {!ro && <button type="button" title="Rimuovi" onClick={()=>rmImg(img.path)}
                    style={{position:"absolute",top:2,right:2,width:22,height:22,borderRadius:"50%",border:0,background:"rgba(192,57,43,.92)",color:"#fff",cursor:"pointer",lineHeight:1,fontSize:13}}>×</button>}
                </div>
              ))}
              {!ro &&
                <label style={{width:96,height:96,borderRadius:8,border:"2px dashed var(--line)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",color:"#888",fontSize:12,textAlign:"center"}}>
                  {up==="img"? <span className="spin"/> : <><span style={{fontSize:22}}>＋</span>Aggiungi foto</>}
                  <input type="file" accept="image/*" multiple onChange={caricaImg} disabled={up==="img"} style={{display:"none"}}/>
                </label>}
            </div>
          </div>

          <div className="section">
            <h3>📄 Template / layout (PDF)</h3>
            <div className="muted" style={{fontSize:12,marginBottom:6}}>Il PDF con l'area utile dove il cliente posiziona la grafica. Sarà scaricabile dalla scheda prodotto nel negozio.</div>
            {f.template_path
              ? <div className="row" style={{alignItems:"center",gap:10}}>
                  <a href={kPub(f.template_path)} target="_blank" rel="noopener noreferrer">📄 {f.template_nome||"template.pdf"}</a>
                  {!ro && <button type="button" className="btn small danger" onClick={rmPdf}>Rimuovi</button>}
                </div>
              : !ro && <label className="btn small" style={{cursor:"pointer"}}>
                  {up==="pdf"? "Carico…" : "⬆ Carica PDF template"}
                  <input type="file" accept="application/pdf,.pdf" onChange={caricaPdf} disabled={up==="pdf"} style={{display:"none"}}/>
                </label>}
            <div className="field" style={{marginTop:10}}><label>Istruzioni per la grafica</label>
              <textarea rows={2} value={f.template_note} disabled={ro} onChange={e=>setF(p=>({...p,template_note:e.target.value}))}
                placeholder="es. Mantieni testi e loghi entro il tratteggio interno; abbondanza 3 mm per lato; esporta in PDF/X-1a."/></div>
          </div>

          <div className="field" style={{marginTop:6}}>
            <label style={{display:"flex",gap:8,alignItems:"center",textTransform:"none"}}>
              <input type="checkbox" checked={f.attivo} disabled={ro} onChange={e=>setF(p=>({...p,attivo:e.target.checked}))} style={{width:"auto"}}/>
              Scheda visibile nel negozio
            </label>
          </div>
        </div>
        <footer>
          <button type="button" className="btn" onClick={onClose}>Chiudi</button>
          {!ro && <button type="button" className="btn primary" disabled={busy||up} onClick={salva}>{busy?"Salvo…":"Salva scheda"}</button>}
        </footer>
      </div>
    </div>
  );
}

function ModuloProdottiConfig({profilo,perm}){
  const [prodotti,setProdotti]=useState(null);
  const [articoli,setArticoli]=useState([]);
  const [err,setErr]=useState("");
  const [cerca,setCerca]=useState("");
  const [editor,setEditor]=useState(null);
  const [dupN,setDupN]=useState(0);

  const carica=useCallback(async()=>{
    setErr("");
    const [p,a]=await Promise.all([
      sb.from("prodotti_config").select("*, prodotti_config_voci(*), prodotti_config_varianti(*), prodotti_config_fasce(*), prodotti_config_stampe(*)").order("nome"),
      caricaArticoliTutti("id,codice,nome_articolo,costo,unita"),
    ]);
    if(p.error){ setErr(p.error.message); return; }
    setProdotti(p.data||[]); setArticoli(a);
  },[]);
  useEffect(()=>{ carica(); },[carica]);

  const filtrati=useMemo(()=>{
    if(!prodotti) return [];
    const q=cerca.trim().toLowerCase();
    return prodotti.filter(p=>!q || p.nome.toLowerCase().includes(q));
  },[prodotti,cerca]);

  const artCostoMap=useMemo(()=>{ const m={}; (articoli||[]).forEach(a=>{ m[a.id]=Number(a.costo)||0; }); return m; },[articoli]);
  const prezzoInd = p => {
    const vv=(p.prodotti_config_varianti||[]).slice().sort((a,b)=>(a.ordine||0)-(b.ordine||0));
    const va=vv[0]||{costo_materiale:0,sfrido_pct:0};
    const costo=costoMatVariante(va,artCostoMap)*(1+(Number(va.sfrido_pct)||0)/100)
      + (p.prodotti_config_voci||[]).filter(v=>!v.opzionale && v.modo===p.unita_calcolo).reduce((s,v)=>s+(Number(v.costo)||0),0);
    const m=Number(p.margine_pct)||0; return m>0? costo/(1-m/100):costo;
  };

  return (
    <>
      <div className="topbar"><h1>Prodotti configurabili</h1>
        {perm.scrivi && <button className="btn primary" onClick={()=>setEditor({})}>+ Nuovo prodotto</button>}
      </div>
      <div className="content">
        {err && <div className="banner err">{err}</div>}
        <div className="banner info">Definisci qui i prodotti "a misura" (es. pannello forex): materiale + lavorazioni + margine + sfrido. Nei preventivi basterà inserire le misure.</div>
        <div className="toolbar">
          <div className="search"><span className="mag">🔍</span>
            <input placeholder="Cerca prodotto…" value={cerca} onChange={e=>setCerca(e.target.value)}/></div>
          <span className="muted">{filtrati.length} prodotti</span>
        </div>
        {prodotti===null? <div className="empty">Caricamento…</div>
          : filtrati.length===0? <div className="card empty">Nessun prodotto configurabile. Creane uno con "+ Nuovo prodotto".</div>
          : <div className="card" style={{overflow:"auto"}}>
              <table>
                <thead><tr><th>Nome</th><th>Calcolo</th><th>Varianti</th><th>Voci</th><th style={{textAlign:"right"}}>Prezzo indicativo</th></tr></thead>
                <tbody>
                  {filtrati.map(p=>
                    <tr key={p.id} onClick={()=>setEditor(p)}>
                      <td className="rs">{p.nome}{p.attivo===false && <span className="tag" style={{background:"#fdf0e3",color:"#c47a1e",marginLeft:8}}>Non attivo</span>}</td>
                      <td className="muted">{(UNITA_CALC.find(u=>u.v===p.unita_calcolo)||{}).l||p.unita_calcolo}</td>
                      <td>{(p.prodotti_config_varianti||[]).length}</td>
                      <td>{(p.prodotti_config_voci||[]).length}</td>
                      <td style={{textAlign:"right",fontWeight:700}}>{eur(prezzoInd(p))}/{p.unita_calcolo}</td>
                    </tr>)}
                </tbody>
              </table>
            </div>}
      </div>
      {editor && <ProdottoConfigEditor key={editor.id||("n"+dupN)} prodotto={editor&&(editor.id||editor._dup)?editor:null} perm={perm} articoli={articoli}
        onClose={()=>setEditor(null)} onSalvato={()=>{setEditor(null);carica();}}
        onDuplica={data=>{ setDupN(n=>n+1); setEditor({...data, id:undefined, _dup:true, nome:(data.nome||"")+" (copia)"}); }}/>}
    </>
  );
}

/* ------------------------------------------------ editor prodotto configurabile */
function ProdottoConfigEditor({prodotto,perm,articoli,onClose,onSalvato,onDuplica}){
  const nuovo=!prodotto || !prodotto.id;   // duplicato = precompilato ma trattato come nuovo
  const [f,setF]=useState(()=>({
    nome:prodotto?.nome||"",
    tipo:prodotto?.tipo||"misura",
    categoria:prodotto?.categoria||"",
    giorni_lavorazione:prodotto?.giorni_lavorazione ?? "",
    unita_calcolo:prodotto?.unita_calcolo||"mq",
    margine_pct:prodotto?.margine_pct ?? "",
    minimo:prodotto?.minimo ?? "",
    attivo:prodotto?.attivo!==false,
    note:prodotto?.note||"",
  }));
  const gadget = f.tipo==="gadget";
  const uLabel = gadget?"pz":f.unita_calcolo;
  const ord=(arr)=>arr.slice().sort((a,b)=>(a.ordine||0)-(b.ordine||0)).map(x=>({...x}));
  const [varianti,setVarianti]=useState(()=>{ const v=ord(prodotto?.prodotti_config_varianti||[]);
    return v.length? v : [{nome:"",spessore:"",costo_materiale:"",sfrido_pct:""}]; });
  const [voci,setVoci]=useState(()=> ord(prodotto?.prodotti_config_voci||[]) );
  const [fasce,setFasce]=useState(()=> ord(prodotto?.prodotti_config_fasce||[]) );
  const [stampe,setStampe]=useState(()=> ord(prodotto?.prodotti_config_stampe||[]) );
  const setStampa=(i,k,v)=>setStampe(p=>p.map((x,j)=>j===i?{...x,[k]:v}:x));
  const addStampa=()=>setStampe(p=>[...p,{nome:"",area_cm:"",max_colori:4,prezzo_pz:"",setup:""}]);
  const delStampa=i=>setStampe(p=>p.filter((_,j)=>j!==i));
  const [selVar,setSelVar]=useState(0);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const setVar=(i,k,v)=>setVarianti(p=>p.map((x,j)=>j===i?{...x,[k]:v}:x));
  const addVar=()=>setVarianti(p=>[...p,{nome:"",spessore:"",costo_materiale:"",sfrido_pct:""}]);
  const delVar=i=>setVarianti(p=>p.length>1? p.filter((_,j)=>j!==i):p);
  const setVoce=(i,k,v)=>setVoci(p=>p.map((x,j)=>j===i?{...x,[k]:v}:x));
  const delVoce=i=>setVoci(p=>p.filter((_,j)=>j!==i));
  const addVoce=(tipo)=>setVoci(p=>[...p,{descrizione:"",tipo,modo:f.unita_calcolo,costo:"",opzionale:tipo==="opzione",lavorazione:""}]);
  const setFascia=(i,k,v)=>setFasce(p=>p.map((x,j)=>j===i?{...x,[k]:v}:x));
  const addFascia=()=>setFasce(p=>[...p,{da_quantita:"",sconto_pct:""}]);
  const delFascia=i=>setFasce(p=>p.filter((_,j)=>j!==i));

  const artCostoMap=React.useMemo(()=>{ const m={}; (articoli||[]).forEach(a=>{ m[a.id]=Number(a.costo)||0; }); return m; },[articoli]);
  const va=varianti[selVar]||varianti[0]||{costo_materiale:0,sfrido_pct:0};
  const lavFisse=voci.filter(v=>!v.opzionale && v.modo===f.unita_calcolo).reduce((s,v)=>s+(Number(v.costo)||0),0);
  const costoUnita=costoMatVariante(va,artCostoMap)*(1+(Number(va.sfrido_pct)||0)/100)+lavFisse;
  const m=Number(f.margine_pct)||0;
  const prezzoUnita = m>0? costoUnita/(1-m/100) : costoUnita;
  const fasceOrd=fasce.filter(x=>x.da_quantita!=="").slice().sort((a,b)=>(Number(a.da_quantita)||0)-(Number(b.da_quantita)||0));

  async function salva(e){
    e.preventDefault();
    if(!f.nome.trim()){ setErr("Il nome è obbligatorio."); return; }
    const varValide=varianti.filter(v=>String(v.nome).trim()||Number(v.costo_materiale)>0);
    if(!varValide.length){ setErr("Aggiungi almeno una variante (nome + costo materiale)."); return; }
    setBusy(true); setErr("");
    try{
      const rec={nome:f.nome,tipo:f.tipo,categoria:(f.categoria||"").trim(),giorni_lavorazione:Number(f.giorni_lavorazione)||0,
        unita_calcolo:gadget?"pz":f.unita_calcolo,margine_pct:Number(f.margine_pct)||0,
        minimo:Number(f.minimo)||0,attivo:f.attivo,note:f.note};
      let id=prodotto?.id;
      if(nuovo){ const {data,error}=await sb.from("prodotti_config").insert(rec).select("id").single(); if(error) throw error; id=data.id; }
      else{ const {error}=await sb.from("prodotti_config").update(rec).eq("id",id); if(error) throw error;
        await sb.from("prodotti_config_varianti").delete().eq("prodotto_id",id);
        await sb.from("prodotti_config_voci").delete().eq("prodotto_id",id);
        await sb.from("prodotti_config_fasce").delete().eq("prodotto_id",id);
        await sb.from("prodotti_config_stampe").delete().eq("prodotto_id",id); }
      const rv=varValide.map((v,idx)=>({prodotto_id:id,nome:v.nome||"",spessore:Number(v.spessore)||0,
        costo_materiale:Number(v.costo_materiale)||0,sfrido_pct:Number(v.sfrido_pct)||0,
        articolo_id:v.articolo_id||null,ordine:idx}));
      { const {error}=await sb.from("prodotti_config_varianti").insert(rv); if(error) throw error; }
      const rvo=voci.filter(v=>String(v.descrizione).trim()||Number(v.costo)>0).map((v,idx)=>({prodotto_id:id,
        descrizione:v.descrizione||"",tipo:v.tipo,modo:v.modo,costo:Number(v.costo)||0,opzionale:!!v.opzionale,lavorazione:v.lavorazione||"",ordine:idx}));
      if(rvo.length){ const {error}=await sb.from("prodotti_config_voci").insert(rvo); if(error) throw error; }
      const rf=fasce.filter(x=>x.da_quantita!=="").map((x,idx)=>({prodotto_id:id,da_quantita:Number(x.da_quantita)||1,sconto_pct:Number(x.sconto_pct)||0,ordine:idx}));
      if(rf.length){ const {error}=await sb.from("prodotti_config_fasce").insert(rf); if(error) throw error; }
      if(gadget){
        const rs=stampe.filter(s=>String(s.nome).trim()).map((s,idx)=>({prodotto_id:id,nome:s.nome||"",area_cm:s.area_cm||"",
          max_colori:Number(s.max_colori)||4,prezzo_pz:Number(s.prezzo_pz)||0,setup:Number(s.setup)||0,ordine:idx}));
        if(rs.length){ const {error}=await sb.from("prodotti_config_stampe").insert(rs); if(error) throw error; }
      }
      onSalvato();
    }catch(ex){ setErr(ex.message); setBusy(false); }
  }

  return (
    <div className="overlay">
      <form className="modal" style={{maxWidth:860}} onClick={e=>e.stopPropagation()} onSubmit={salva}>
        <header><h2>{nuovo?"Nuovo prodotto configurabile":"Modifica prodotto"}</h2>
          <button type="button" className="x" onClick={onClose}>×</button></header>
        <div className="body">
          {err && <div className="banner err">{err}</div>}

          <div className="section">
            <h3>Dati prodotto</h3>
            <div className="row">
              <div className="field" style={{flex:2}}><label>Nome *</label>
                <input value={f.nome} onChange={e=>set("nome",e.target.value)} required placeholder={gadget?"es. Penna a sfera personalizzata":"es. Pannello rigido stampato e sagomato"}/></div>
              <div className="field" style={{maxWidth:210}}><label>Tipo prodotto</label>
                <select value={f.tipo} onChange={e=>set("tipo",e.target.value)}>
                  <option value="misura">A misura (mq/mtl/pz)</option>
                  <option value="gadget">Gadget (colori + stampa)</option>
                </select></div>
              {!gadget && <div className="field" style={{maxWidth:200}}><label>Unità di calcolo</label>
                <select value={f.unita_calcolo} onChange={e=>set("unita_calcolo",e.target.value)}>
                  {UNITA_CALC.map(u=><option key={u.v} value={u.v}>{u.l}</option>)}
                </select></div>}
            </div>
            <div className="row">
              <div className="field" style={{maxWidth:140}}><label>Margine %</label>
                <input type="number" step="0.1" value={f.margine_pct} onChange={e=>set("margine_pct",e.target.value)}/></div>
              <div className="field" style={{maxWidth:170}}><label>{gadget?"Minimo ordinabile (pz)":"Minimo €"}</label>
                <input type="number" step={gadget?"1":"0.01"} value={f.minimo} onChange={e=>set("minimo",e.target.value)}/></div>
            </div>
            <div className="row">
              <div className="field" style={{flex:1}}><label>Categoria <span className="muted" style={{textTransform:"none",fontWeight:400}}>(per il filtro del negozio)</span></label>
                <input value={f.categoria} onChange={e=>set("categoria",e.target.value)} list="cat-komunigo" placeholder="es. Stampa, Insegne, Gadget…"/>
                <datalist id="cat-komunigo"><option value="Stampa"/><option value="Insegne"/><option value="Gadget"/><option value="Allestimenti"/><option value="Cartotecnica"/><option value="Abbigliamento"/></datalist></div>
              <div className="field" style={{maxWidth:200}}><label>Giorni di lavorazione <span className="muted" style={{textTransform:"none",fontWeight:400}}>(per la data stimata)</span></label>
                <input type="number" min="0" value={f.giorni_lavorazione} onChange={e=>set("giorni_lavorazione",e.target.value)} placeholder="es. 5"/></div>
            </div>
            {gadget && <div className="muted" style={{fontSize:12,marginTop:2}}>🎁 <b>Gadget:</b> il cliente sceglie un <b>colore</b> + <b>quantità</b> e le <b>posizioni di stampa</b> (sotto). Il prezzo è per pezzo.</div>}
          </div>

          <div className="section">
            <h3>{gadget?"Colori disponibili":"Varianti (materiale + spessore)"}</h3>
            <div className="muted" style={{fontSize:12,marginBottom:8}}>{gadget?"Es. Bianco, Nero, Blu… ogni colore col suo costo per pezzo (o articolo di magazzino).":"Es. Forex 3mm, Forex 5mm, Alluminio 3mm… ognuna col suo costo materiale (€/"+f.unita_calcolo+")."}</div>
            {varianti.map((v,i)=>{
              const artSel=(articoli||[]).find(a=>a.id===v.articolo_id)||null;
              const agganciato=!!v.articolo_id;
              return <div className="subrow" key={i}>
                <div className="row">
                  <div className="field" style={{flex:2}}><label>{gadget?"Colore":"Nome variante"}</label>
                    <input value={v.nome} onChange={e=>setVar(i,"nome",e.target.value)} placeholder={gadget?"es. Bianco":"es. Forex 3mm"}/></div>
                  {!gadget && <div className="field" style={{maxWidth:110}}><label>Spessore mm</label>
                    <input type="number" step="0.1" value={v.spessore} onChange={e=>setVar(i,"spessore",e.target.value)}/></div>}
                  {!gadget && <div className="field" style={{maxWidth:100}}><label>Sfrido %</label>
                    <input type="number" step="0.1" value={v.sfrido_pct} onChange={e=>setVar(i,"sfrido_pct",e.target.value)}/></div>}
                  <button type="button" className="btn small danger" style={{alignSelf:"flex-end",marginBottom:12}} onClick={()=>delVar(i)}>✕</button>
                </div>
                <div className="row">
                  <div className="field" style={{flex:2}}><label>Materiale di magazzino (costo e scarico)</label>
                    <select value={v.articolo_id||""} onChange={e=>setVar(i,"articolo_id",e.target.value||null)}>
                      <option value="">— nessuno: costo scritto a mano —</option>
                      {(articoli||[]).map(a=><option key={a.id} value={a.id}>{a.nome_articolo}{a.unita?" ["+a.unita+"]":""}</option>)}
                    </select></div>
                  <div className="field" style={{maxWidth:180}}><label>Costo (€/{uLabel})</label>
                    {agganciato
                      ? <input value={artSel?Number(artSel.costo).toFixed(2):"—"} disabled style={{opacity:.7,fontWeight:700}} title="Preso dall'articolo di magazzino"/>
                      : <input type="number" step="0.01" value={v.costo_materiale} onChange={e=>setVar(i,"costo_materiale",e.target.value)}/>}
                  </div>
                </div>
                {agganciato &&
                  <div className="muted" style={{fontSize:12}}>Costo e scarico dal materiale <b>{artSel?artSel.nome_articolo:"(non trovato)"}</b>: si aggiorna da solo quando cambi il costo in Catalogo.</div>}
              </div>;
            })}
            <button type="button" className="btn small" onClick={addVar}>+ {gadget?"Colore":"Variante"}</button>
          </div>

          {gadget && <div className="section">
            <h3>Posizioni di stampa</h3>
            <div className="muted" style={{fontSize:12,marginBottom:8}}>Dove si può stampare sul gadget e con quanti colori. Il cliente sceglie posizione e n° colori: il prezzo si somma. <b>Prezzo/pz</b> = costo per pezzo per ogni colore; <b>Setup</b> = costo una-tantum di attrezzaggio.</div>
            {stampe.map((s,i)=>
              <div className="subrow" key={i}>
                <div className="row">
                  <div className="field" style={{flex:2}}><label>Posizione</label>
                    <input value={s.nome} onChange={e=>setStampa(i,"nome",e.target.value)} placeholder="es. Centrato sulla clip"/></div>
                  <div className="field" style={{maxWidth:130}}><label>Area (cm)</label>
                    <input value={s.area_cm} onChange={e=>setStampa(i,"area_cm",e.target.value)} placeholder="es. 3 × 4,3"/></div>
                  <button type="button" className="btn small danger" style={{alignSelf:"flex-end",marginBottom:12}} onClick={()=>delStampa(i)}>✕</button>
                </div>
                <div className="row" style={{alignItems:"flex-end"}}>
                  <div className="field" style={{maxWidth:120,margin:0}}><label>Max colori</label>
                    <input type="number" min="1" max="8" value={s.max_colori} onChange={e=>setStampa(i,"max_colori",e.target.value)}/></div>
                  <div className="field" style={{maxWidth:150,margin:0}}><label>Prezzo/pz colore</label>
                    <input type="number" step="0.0001" value={s.prezzo_pz} onChange={e=>setStampa(i,"prezzo_pz",e.target.value)}/></div>
                  <div className="field" style={{maxWidth:150,margin:0}}><label>Setup € (una tantum)</label>
                    <input type="number" step="0.01" value={s.setup} onChange={e=>setStampa(i,"setup",e.target.value)}/></div>
                </div>
              </div>)}
            {stampe.length===0 && <div className="muted" style={{marginBottom:8,fontSize:13}}>Nessuna posizione: aggiungine almeno una.</div>}
            <button type="button" className="btn small" onClick={addStampa}>+ Posizione di stampa</button>
          </div>}

          {!gadget && <div className="section">
            <h3>Lavorazioni e opzioni</h3>
            {voci.length===0 && <div className="muted" style={{marginBottom:8}}>Aggiungi le lavorazioni (es. stampa, sagomatura) e le opzioni (es. occhielli).</div>}
            {voci.map((v,i)=>
              <div className="subrow" key={i}>
                <div className="row">
                  <div className="field" style={{flex:2}}><label>Descrizione</label>
                    <input value={v.descrizione} onChange={e=>setVoce(i,"descrizione",e.target.value)} placeholder="es. Stampa"/></div>
                  <div className="field" style={{maxWidth:160}}><label>Lavorazione</label>
                    <select value={v.lavorazione||""} onChange={e=>setVoce(i,"lavorazione",e.target.value)}>
                      <option value="">—</option>{LAVORAZIONI.map(l=><option key={l} value={l}>{l}</option>)}
                    </select></div>
                  <button type="button" className="btn small danger" style={{alignSelf:"flex-end",marginBottom:12}} onClick={()=>delVoce(i)}>Rimuovi</button>
                </div>
                <div className="row">
                  <div className="field" style={{maxWidth:210}}><label>Modo di calcolo</label>
                    <select value={v.modo} onChange={e=>setVoce(i,"modo",e.target.value)}>
                      {MODI_VOCE.map(mo=><option key={mo.v} value={mo.v}>{mo.l}</option>)}
                    </select></div>
                  <div className="field" style={{maxWidth:130}}><label>Costo €</label>
                    <input type="number" step="0.01" value={v.costo} onChange={e=>setVoce(i,"costo",e.target.value)}/></div>
                  <label style={{display:"flex",alignItems:"center",gap:6,alignSelf:"flex-end",marginBottom:14,fontSize:13}}>
                    <input type="checkbox" checked={v.opzionale} onChange={e=>setVoce(i,"opzionale",e.target.checked)} style={{width:"auto"}}/> Opzionale
                  </label>
                </div>
              </div>)}
            <div style={{display:"flex",gap:8,marginTop:8}}>
              <button type="button" className="btn small" onClick={()=>addVoce("lavorazione")}>+ Lavorazione</button>
              <button type="button" className="btn small" onClick={()=>addVoce("opzione")}>+ Opzione</button>
            </div>
          </div>}

          <div className="section">
            <h3>Fasce di quantità</h3>
            <div className="muted" style={{fontSize:12,marginBottom:8}}>Sconto sul prezzo unitario in base alla quantità (es. da 11 pz −5%, da 51 pz −12%).</div>
            {fasce.map((x,i)=>
              <div className="row" key={i} style={{alignItems:"flex-end",marginBottom:8}}>
                <div className="field" style={{maxWidth:150}}><label>Da quantità</label>
                  <input type="number" value={x.da_quantita} onChange={e=>setFascia(i,"da_quantita",e.target.value)}/></div>
                <div className="field" style={{maxWidth:150}}><label>Sconto %</label>
                  <input type="number" step="0.1" value={x.sconto_pct} onChange={e=>setFascia(i,"sconto_pct",e.target.value)}/></div>
                <button type="button" className="btn small danger" style={{marginBottom:12}} onClick={()=>delFascia(i)}>✕</button>
              </div>)}
            <button type="button" className="btn small" onClick={addFascia}>+ Fascia</button>
          </div>

          <div className="card" style={{padding:14,background:"#fafbfc"}}>
            {varianti.length>1 &&
              <div className="field" style={{maxWidth:280,marginBottom:10}}><label>Anteprima per variante</label>
                <select value={selVar} onChange={e=>setSelVar(Number(e.target.value))}>
                  {varianti.map((v,i)=><option key={i} value={i}>{v.nome||("Variante "+(i+1))}</option>)}
                </select></div>}
            <div className="kv" style={{gridTemplateColumns:"1fr auto"}}>
              <span className="k">Costo per {uLabel} {gadget?"(colore base, senza stampa)":"(materiale + sfrido + lavorazioni)"}</span><span style={{textAlign:"right"}}>{eur(costoUnita)}</span>
              <span className="k">Prezzo per {uLabel} (margine {f.margine_pct||0}%){gadget?", stampa esclusa":""}</span>
              <span style={{textAlign:"right",fontWeight:700,color:"var(--ok)"}}>{eur(prezzoUnita)}</span>
            </div>
            {fasceOrd.length>0 &&
              <div style={{marginTop:8}}>
                {fasceOrd.map((x,i)=><span key={i} className="tag" style={{marginRight:6}}>da {x.da_quantita}: {eur(prezzoUnita*(1-(Number(x.sconto_pct)||0)/100))}/{f.unita_calcolo}</span>)}
              </div>}
            <div className="muted" style={{fontSize:12,marginTop:6}}>Le opzioni e le voci a pezzo/tempo/fisso si sommano nel preventivo in base a misure, ore e quantità.</div>
          </div>

          <div className="section" style={{marginTop:16}}>
            <label style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
              <input type="checkbox" checked={f.attivo} onChange={e=>set("attivo",e.target.checked)} style={{width:"auto"}}/> Prodotto attivo
            </label>
            <div className="field"><label>Note</label><textarea rows={2} value={f.note} onChange={e=>set("note",e.target.value)}/></div>
          </div>
        </div>
        <footer>
          <button type="button" className="btn" onClick={onClose}>Annulla</button>
          {!nuovo && perm.scrivi && onDuplica && <button type="button" className="btn" disabled={busy}
            title="Crea un nuovo prodotto copiando questa ricetta (varianti, voci, fasce) — poi cambi solo ciò che serve"
            onClick={()=>onDuplica({...f, prodotti_config_varianti:varianti, prodotti_config_voci:voci, prodotti_config_fasce:fasce})}>⧉ Duplica</button>}
          <button className="btn primary" disabled={busy}>{busy?<span className="spin"/>:"Salva prodotto"}</button>
        </footer>
      </form>
    </div>
  );
}

/* ================================================================ IMBALLI (ricette imballaggio, 5.9) */
function ModuloImballi({profilo,perm}){
  const [imballi,setImballi]=useState(null);
  const [err,setErr]=useState("");
  const [cerca,setCerca]=useState("");
  const [editor,setEditor]=useState(null);

  const carica=useCallback(async()=>{
    setErr("");
    const {data,error}=await sb.from("imballi").select("*, imballi_voci(*)").order("nome");
    if(error){ setErr(error.message); return; }
    setImballi(data||[]);
  },[]);
  useEffect(()=>{ carica(); },[carica]);

  const filtrati=useMemo(()=>{ if(!imballi) return []; const q=cerca.trim().toLowerCase();
    return imballi.filter(i=>!q||i.nome.toLowerCase().includes(q)); },[imballi,cerca]);
  const livL=v=>(LIVELLI_IMBALLO.find(x=>x.v===v)||{}).l||v;

  return (
    <>
      <div className="topbar"><h1>Imballi</h1>
        {perm.scrivi && <button className="btn primary" onClick={()=>setEditor({})}>+ Nuovo imballo</button>}
      </div>
      <div className="content">
        {err && <div className="banner err">{err}</div>}
        <div className="banner info">Ricette di imballaggio (pluriball, nastro, pedana, tempo…). Nei preventivi calcolano il costo dalle misure/quantità.</div>
        <div className="toolbar">
          <div className="search"><span className="mag">🔍</span>
            <input placeholder="Cerca imballo…" value={cerca} onChange={e=>setCerca(e.target.value)}/></div>
          <span className="muted">{filtrati.length} imballi</span>
        </div>
        {imballi===null? <div className="empty">Caricamento…</div>
          : filtrati.length===0? <div className="card empty">Nessun imballo. Creane uno con "+ Nuovo imballo".</div>
          : <div className="card" style={{overflow:"auto"}}>
              <table>
                <thead><tr><th>Nome</th><th>Livello</th><th>Consigliato per</th><th>Calcolo</th><th>Componenti</th></tr></thead>
                <tbody>
                  {filtrati.map(i=>
                    <tr key={i.id} onClick={()=>setEditor(i)}>
                      <td className="rs">{i.nome}{i.attivo===false && <span className="tag" style={{background:"#fdf0e3",color:"#c47a1e",marginLeft:8}}>Non attivo</span>}</td>
                      <td className="muted">{livL(i.livello)}</td>
                      <td>{i.consigliato_per==="corriere"? <span className="tag" style={{background:"#eef4ff",color:"#1e46c4"}}>Corriere</span>
                        : i.consigliato_per==="mezzo_nostro"? <span className="tag" style={{background:"#fff4e5",color:"#b26a00"}}>Mezzo nostro</span>
                        : <span className="muted">—</span>}</td>
                      <td className="muted">{(UNITA_CALC.find(u=>u.v===i.unita_calcolo)||{}).l||i.unita_calcolo}</td>
                      <td>{(i.imballi_voci||[]).length}</td>
                    </tr>)}
                </tbody>
              </table>
            </div>}
      </div>
      {editor && <ImballoEditor imballo={editor.id?editor:null} perm={perm}
        onClose={()=>setEditor(null)} onSalvato={()=>{setEditor(null);carica();}}/>}
    </>
  );
}

/* ------------------------------------------------ editor ricetta imballo */
function ImballoEditor({imballo,perm,onClose,onSalvato}){
  const nuovo=!imballo;
  const [f,setF]=useState(()=>({
    nome:imballo?.nome||"", livello:imballo?.livello||"prodotto",
    unita_calcolo:imballo?.unita_calcolo||"mq", ricarico_pct:imballo?.ricarico_pct ?? "",
    consigliato_per:imballo?.consigliato_per||"qualsiasi",
    capienza:imballo?.capienza ?? "",
    attivo:imballo?.attivo!==false, note:imballo?.note||"",
  }));
  const [voci,setVoci]=useState(()=> (imballo?.imballi_voci||[]).slice().sort((a,b)=>(a.ordine||0)-(b.ordine||0)).map(v=>({...v})) );
  const [busy,setBusy]=useState(false); const [err,setErr]=useState("");
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const setVoce=(i,k,v)=>setVoci(p=>p.map((x,j)=>j===i?{...x,[k]:v}:x));
  const delVoce=i=>setVoci(p=>p.filter((_,j)=>j!==i));
  const addVoce=()=>setVoci(p=>[...p,{descrizione:"",modo:f.unita_calcolo,costo:""}]);

  async function salva(e){
    e.preventDefault();
    if(!f.nome.trim()){ setErr("Il nome è obbligatorio."); return; }
    setBusy(true); setErr("");
    try{
      const rec={nome:f.nome,livello:f.livello,unita_calcolo:f.unita_calcolo,ricarico_pct:Number(f.ricarico_pct)||0,
        consigliato_per:f.consigliato_per||"qualsiasi",capienza:Number(f.capienza)||0,attivo:f.attivo,note:f.note};
      let id=imballo?.id;
      if(nuovo){ const {data,error}=await sb.from("imballi").insert(rec).select("id").single(); if(error) throw error; id=data.id; }
      else{ const {error}=await sb.from("imballi").update(rec).eq("id",id); if(error) throw error;
        await sb.from("imballi_voci").delete().eq("imballo_id",id); }
      const rows=voci.filter(v=>String(v.descrizione).trim()||Number(v.costo)>0).map((v,idx)=>({imballo_id:id,descrizione:v.descrizione||"",modo:v.modo,costo:Number(v.costo)||0,ordine:idx}));
      if(rows.length){ const {error}=await sb.from("imballi_voci").insert(rows); if(error) throw error; }
      onSalvato();
    }catch(ex){ setErr(ex.message); setBusy(false); }
  }
  async function elimina(){
    if(!imballo?.id) return;
    if(!window.confirm("Eliminare l'imballo «"+(f.nome||"")+"»?")) return;
    setBusy(true); setErr("");
    try{
      await sb.from("imballi_voci").delete().eq("imballo_id",imballo.id);
      const {error}=await sb.from("imballi").delete().eq("id",imballo.id);
      if(error) throw error;
      onSalvato();
    }catch(ex){
      // se è referenziato (usato in commesse/preventivi) il DB blocca: proponi la disattivazione
      setErr("Non eliminabile (forse è usato in commesse/preventivi): "+ex.message+" — in alternativa togli la spunta \"Imballo attivo\" per nasconderlo.");
      setBusy(false);
    }
  }

  return (
    <div className="overlay">
      <form className="modal" style={{maxWidth:760}} onClick={e=>e.stopPropagation()} onSubmit={salva}>
        <header><h2>{nuovo?"Nuovo imballo":"Modifica imballo"}</h2>
          <button type="button" className="x" onClick={onClose}>×</button></header>
        <div className="body">
          {err && <div className="banner err">{err}</div>}
          <div className="section">
            <h3>Dati imballo</h3>
            <div className="row">
              <div className="field" style={{flex:2}}><label>Nome *</label>
                <input value={f.nome} onChange={e=>set("nome",e.target.value)} required placeholder="es. Pannello protetto pluriball"/></div>
              <div className="field" style={{maxWidth:190}}><label>Livello</label>
                <select value={f.livello} onChange={e=>set("livello",e.target.value)}>
                  {LIVELLI_IMBALLO.map(x=><option key={x.v} value={x.v}>{x.l}</option>)}
                </select></div>
            </div>
            <div className="row">
              <div className="field" style={{maxWidth:230}}><label>Unità di calcolo (per le misure)</label>
                <select value={f.unita_calcolo} onChange={e=>set("unita_calcolo",e.target.value)}>
                  {UNITA_CALC.map(u=><option key={u.v} value={u.v}>{u.l}</option>)}
                </select></div>
              <div className="field" style={{maxWidth:140}}><label>Ricarico %</label>
                <input type="number" step="0.1" value={f.ricarico_pct} onChange={e=>set("ricarico_pct",e.target.value)}/></div>
              <div className="field" style={{maxWidth:270}}><label>Consigliato per</label>
                <select value={f.consigliato_per} onChange={e=>set("consigliato_per",e.target.value)}>
                  {IMB_CONSIGLIATO.map(x=><option key={x.v} value={x.v}>{x.l}</option>)}
                </select></div>
              <div className="field" style={{maxWidth:200}}><label>Capienza (pezzi/scatola)</label>
                <input type="number" step="1" min="0" value={f.capienza} onChange={e=>set("capienza",e.target.value)} placeholder="solo per scatole"/></div>
            </div>
            <div className="muted" style={{fontSize:12}}>Col <b>corriere</b> serve protezione piena; col <b>nostro mezzo</b> spesso basta l'estensibile.
              La <b>capienza</b> serve alle scatole: le voci "a scatola" si moltiplicano per <b>n° scatole = quantità ÷ capienza</b> (arrotondato per eccesso).</div>
          </div>

          <div className="section">
            <h3>Componenti</h3>
            {voci.length===0 && <div className="muted" style={{marginBottom:8}}>Aggiungi i materiali dell'imballo (pluriball, nastro, pedana, tempo…).</div>}
            {voci.map((v,i)=>
              <div className="subrow" key={i}>
                <div className="row">
                  <div className="field" style={{flex:2}}><label>Descrizione</label>
                    <input value={v.descrizione} onChange={e=>setVoce(i,"descrizione",e.target.value)} placeholder="es. Pluriball"/></div>
                  <div className="field" style={{maxWidth:210}}><label>Modo di calcolo</label>
                    <select value={v.modo} onChange={e=>setVoce(i,"modo",e.target.value)}>
                      {MODI_VOCE.filter(mo=>mo.v!=="passaggio"&&mo.v!=="battuta").map(mo=><option key={mo.v} value={mo.v}>{mo.l}</option>)}
                    </select></div>
                  <div className="field" style={{maxWidth:130}}><label>Costo €</label>
                    <input type="number" step="0.01" value={v.costo} onChange={e=>setVoce(i,"costo",e.target.value)}/></div>
                  <button type="button" className="btn small danger" style={{alignSelf:"flex-end",marginBottom:12}} onClick={()=>delVoce(i)}>✕</button>
                </div>
              </div>)}
            <button type="button" className="btn small" onClick={addVoce}>+ Componente</button>
          </div>

          <div className="section">
            <label style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
              <input type="checkbox" checked={f.attivo} onChange={e=>set("attivo",e.target.checked)} style={{width:"auto"}}/> Imballo attivo
            </label>
            <div className="field"><label>Note</label><textarea rows={2} value={f.note} onChange={e=>set("note",e.target.value)}/></div>
          </div>
        </div>
        <footer>
          {!nuovo && perm.elimina && <button type="button" className="btn danger" disabled={busy} onClick={elimina}>Elimina</button>}
          <button type="button" className="btn" style={{marginLeft:"auto"}} onClick={onClose}>Annulla</button>
          <button className="btn primary" disabled={busy}>{busy?<span className="spin"/>:"Salva imballo"}</button>
        </footer>
      </form>
    </div>
  );
}

/* ================================================================ COMMESSE / PRODUZIONE */
function ModuloCommesse({profilo,perm}){
  const [commesse,setCommesse]=useState(null);
  const [clienti,setClienti]=useState([]);
  const [operatori,setOperatori]=useState([]);
  const [articoli,setArticoli]=useState([]);
  const [prodotti,setProdotti]=useState([]);
  const [imballi,setImballi]=useState([]);
  const [corrieri,setCorrieri]=useState([]);
  const [fornitori,setFornitori]=useState([]);
  const [agenti,setAgenti]=useState([]);
  const [err,setErr]=useState("");
  const [cerca,setCerca]=useState("");
  const [filtroStato,setFiltroStato]=useState("");
  const [editor,setEditor]=useState(null);
  const [nomiUtenti,setNomiUtenti]=useState({});   // v61: id utente -> nome (chi ha aperto)
  const [ultimoLav,setUltimoLav]=useState({});     // v61: commessa_id -> ultimo segmento di lavoro

  const carica=useCallback(async()=>{
    setErr("");
    const [c,cl,op,pn,ul]=await Promise.all([
      sb.from("commesse").select("*, commesse_fasi(*), commesse_righe(*)").order("creato_il",{ascending:false}),
      sb.from("clienti").select("id,ragione_sociale,agente_id,provvigione_pct").order("ragione_sociale"),
      sb.from("operatori").select("id,nome,reparto,reparti,costo_orario").order("nome"),
      /* v61: nomi utenti (chi ha aperto) e ultimo lavoro registrato per commessa */
      sb.from("profili_nomi").select("id,nome"),
      sb.from("commesse_ultimo_lavoro").select("*"),
    ]);
    if(c.error){ setErr(c.error.message); return; }
    setCommesse(c.data||[]); setClienti(cl.data||[]); setOperatori(op.data||[]);
    setNomiUtenti((pn.data||[]).reduce((m,p)=>{ m[p.id]=p.nome; return m; },{}));
    setUltimoLav((ul.data||[]).reduce((m,r)=>{ m[r.commessa_id]=r; return m; },{}));
    // articoli + prodotti servono al modulo Magazzino della commessa (ruoli economici)
    if(perm.economici){
      const [a,pc,imb,co,fo,ag]=await Promise.all([
        caricaArticoliTutti("id,codice,nome_articolo,unita,giacenza,costo,peso_kg,peso_um,peso_eccedenza_pct"),
        sb.from("prodotti_config").select("*, prodotti_config_varianti(*), prodotti_config_voci(*), prodotti_config_fasce(*)").eq("attivo",true).order("nome"),
        sb.from("imballi").select("*, imballi_voci(*)").eq("attivo",true).eq("livello","prodotto").order("nome"),
        sb.from("corrieri").select("*, corrieri_scaglioni(*)").eq("attivo",true).order("nome"),
        sb.from("fornitori").select("id,ragione_sociale").order("ragione_sociale"),
        sb.from("agenti").select("id,nome,provvigione_pct,attivo").order("nome"),
      ]);
      setArticoli(a); setProdotti(pc.data||[]); setImballi(imb.data||[]); setCorrieri(co.data||[]); setFornitori(fo.data||[]); setAgenti(ag.data||[]);
    }else if(perm.magazzino){
      // il magazziniere legge le giacenze dalla VISTA senza prezzi (per lo scarico)
      try{ const a=await caricaArticoliTutti("id,codice,nome_articolo,unita,giacenza,impegnato",{tabella:"articoli_magazzino"}); setArticoli(a); }catch(e){}
    }
  },[perm.economici,perm.magazzino]);
  useEffect(()=>{ carica(); },[carica]);

  const filtrate=useMemo(()=>{
    if(!commesse) return [];
    const q=cerca.trim().toLowerCase();
    return commesse.filter(c=>{
      if(filtroStato && c.stato!==filtroStato) return false;
      if(!q) return true;
      return [c.numero,c.cliente_nome,c.riferimento].join(" ").toLowerCase().includes(q);
    });
  },[commesse,cerca,filtroStato]);

  return (
    <>
      <div className="topbar"><h1>Commesse / Produzione</h1>
        {perm.economici && <button className="btn primary" onClick={()=>setEditor({})}>+ Nuova commessa</button>}
      </div>
      <div className="content">
        {err && <div className="banner err">{err}</div>}
        <div className="banner info">Le commesse nascono di solito dal pulsante <b>🏭 Crea commessa</b> su un preventivo <b>accettato</b>. Qui segui l'avanzamento per reparto, gli operatori e le ore.</div>
        <div className="toolbar">
          <div className="search"><span className="mag">🔍</span>
            <input placeholder="Cerca per numero, cliente, riferimento…" value={cerca} onChange={e=>setCerca(e.target.value)}/></div>
          <select className="btn" value={filtroStato} onChange={e=>setFiltroStato(e.target.value)} style={{maxWidth:170}}>
            <option value="">Tutti gli stati</option>
            {Object.keys(STATI_COMMESSA).map(s=><option key={s} value={s}>{STATI_COMMESSA[s].l}</option>)}
          </select>
          <span className="muted">{filtrate.length} commesse</span>
        </div>
        {commesse===null ? <div className="empty">Caricamento…</div>
          : filtrate.length===0 ? <div className="card empty">Nessuna commessa. Crea un preventivo, segnalo come <b>Accettato</b> e premi “🏭 Crea commessa”.</div>
          : <div className="card" style={{overflow:"auto"}}>
              <table>
                <thead><tr><th>Numero</th><th>Cliente</th><th>Consegna</th><th>Priorità</th><th>Avanzamento</th><th>Persone</th><th>Stato</th>{perm.economici && <th style={{textAlign:"right"}}>Valore</th>}</tr></thead>
                <tbody>
                  {filtrate.map(c=>{
                    const fasi=c.commesse_fasi||[];
                    const fatte=fasi.filter(x=>x.stato==="fatto").length;
                    const st=STATI_COMMESSA[c.stato]||STATI_COMMESSA.aperta;
                    const pr=PRIORITA_COMMESSA[c.priorita]||PRIORITA_COMMESSA.normale;
                    const oggi=new Date(); oggi.setHours(0,0,0,0);
                    const cons=c.data_consegna? new Date(c.data_consegna):null;
                    const ritardo=cons && cons<oggi && c.stato!=="consegnata" && c.stato!=="chiusa";
                    const righe=c.commesse_righe||[];
                    const dateMancanti=righe.some(r=>!r.data_consegna);
                    const prontiArt=righe.filter(r=>r.stato==="pronto"||r.stato==="consegnato").length;
                    return (
                      <tr key={c.id} onClick={()=>setEditor(c)}>
                        <td className="rs">{c.numero||"—"}</td>
                        <td>{c.cliente_nome||"—"}</td>
                        <td className="muted" style={ritardo?{color:"var(--danger)",fontWeight:700}:null}>
                          {dateMancanti
                            ? <span className="tag" style={{background:"#fdecea",color:"#c0392b"}} title="Alcuni articoli non hanno la data di consegna">⚠ date mancanti</span>
                            : <>{cons? cons.toLocaleDateString("it-IT"):"—"}{ritardo?" ⚠":""}</>}</td>
                        <td style={{color:pr.c,fontWeight:600,fontSize:12}}>{pr.l}</td>
                        <td style={{minWidth:120}}>
                          <div style={{display:"flex",alignItems:"center",gap:8}}>
                            <div style={{flex:1,height:7,background:"#eef1f5",borderRadius:4,overflow:"hidden",minWidth:60}}>
                              <div style={{height:"100%",width:(fasi.length?Math.round(fatte/fasi.length*100):0)+"%",background:"#1f9c68"}}/></div>
                            <span className="muted" style={{fontSize:12,whiteSpace:"nowrap"}}>{fatte}/{fasi.length}</span>
                          </div>
                          {righe.length>0 && <div style={{fontSize:11,marginTop:3,color:prontiArt===righe.length?"#1f9c68":"#697386"}}>
                            {prontiArt===righe.length?"✓ ":""}{prontiArt}/{righe.length} articoli pronti</div>}
                        </td>
                        <td style={{fontSize:12,minWidth:150}}>
                          <div className="muted" title="Chi ha aperto la commessa">
                            🧾 {nomiUtenti[c.creato_da]||"—"}</div>
                          {(()=>{ const u=ultimoLav[c.id]; if(!u) return null;
                            return <div style={{marginTop:2,color:u.in_corso?"#1f9c68":"#697386",fontWeight:u.in_corso?600:400}}
                              title={"Ultimo a lavorarci"+(u.reparto?" · "+u.reparto:"")}>
                              🔧 {u.operatore_nome||"—"}{u.in_corso
                                ? " · in corso"
                                : " · "+new Date(u.inizio).toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit"})}</div>;
                          })()}
                        </td>
                        <td><span className="tag" style={{background:st.bg,color:st.c}}>{st.l}</span></td>
                        {perm.economici && <td style={{textAlign:"right",fontWeight:700}}>{eur(c.valore)}</td>}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>}
      </div>
      {editor && <CommessaEditor commessa={editor.id?editor:null} profilo={profilo} perm={perm}
        clienti={clienti} operatori={operatori} articoli={articoli} prodotti={prodotti} imballi={imballi} corrieri={corrieri} fornitori={fornitori} agenti={agenti}
        onClose={()=>setEditor(null)}
        onSalvato={()=>{setEditor(null);carica();}}/>}
    </>
  );
}

function CommessaEditor({commessa,profilo,perm,clienti,operatori,articoli,prodotti,imballi,corrieri,fornitori,agenti,onClose,onSalvato}){
  const nuova=!commessa;
  const [ddtOpen,setDdtOpen]=useState(false);
  const [f,setF]=useState(()=>({
    numero:commessa?.numero||"",
    cliente_id:commessa?.cliente_id||"",
    cliente_nome:commessa?.cliente_nome||"",
    riferimento:commessa?.riferimento||"",
    data_consegna:commessa?.data_consegna||"",
    stato:commessa?.stato||"aperta",
    priorita:commessa?.priorita||"normale",

        const {data,error}=await sb.from("commesse").insert(rec).select("id").single(); if(error) throw error; id=data.id;
      }else{ const {error}=await sb.from("commesse").update(rec).eq("id",id); if(error) throw error;
        await sb.from("commesse_fasi").delete().eq("commessa_id",id);
        await sb.from("commesse_righe").delete().eq("commessa_id",id); }
      const rows=fasi.map((fa,idx)=>({commessa_id:id, ordine:idx, chiave:fa.chiave||uid(), reparto:fa.reparto||"",
        descrizione:fa.descrizione||"", stato:fa.stato||(fa.esterna?"da_inviare":"da_fare"),
        ore_previste:Number(fa.ore_previste)||0,
        quantita_lavorata:Number(fa.quantita_lavorata)||0, unita_lavorata:fa.unita_lavorata||"",
        operatori:(fa.operatori||[]).map(o=>({id:o.id,nome:o.nome,ore:Number(o.ore)||0})),
        esterna:!!fa.esterna, fornitore_id:fa.fornitore_id||null, fornitore_nome:fa.fornitore_nome||"",
        costo_previsto:Number(fa.costo_previsto)||0, costo_reale:Number(fa.costo_reale)||0,
        data_invio:fa.data_invio||null, data_rientro_prevista:fa.data_rientro_prevista||null, data_rientro:fa.data_rientro||null,
        note:fa.note||""}));
      if(rows.length){ const {error}=await sb.from("commesse_fasi").insert(rows); if(error) throw error; }
      const rowsR=righe.map((r,idx)=>({commessa_id:id, ordine:idx, descrizione:r.descrizione||"",
        articolo_id:r.articolo_id||null, quantita:Number(r.quantita)||0, unita:r.unita||"",
        data_consegna:r.data_consegna||null, stato:r.stato||"da_produrre", note:r.note||"", config:r.config||null,
        imballo_id:null, imballo_ids:(Array.isArray(r.imballo_ids)&&r.imballo_ids.length? r.imballo_ids : (r.imballo_id?[r.imballo_id]:[])),
        imballo_pluriball:r.imballo_pluriball||null, imballo_costo:Math.round(costoImballoRiga(r)*100)/100,
        modalita_consegna:r.modalita_consegna||"corriere", evasione:r.evasione||"interna"}));
      if(rowsR.length){ const {error}=await sb.from("commesse_righe").insert(rowsR); if(error) throw error; }
      try{ await sb.rpc("ricalcola_impegni"); }catch(e){}
      onSalvato();
    }catch(ex){ setErr(ex.message); setBusy(false); }
  }

  async function elimina(){
    if(!commessa?.id) return;
    if(!window.confirm("Eliminare definitivamente la commessa "+(f.numero||"")+"? I suoi articoli e le sue fasi verranno cancellati.")) return;
    setBusy(true); setErr("");
    try{ const {error}=await sb.from("commesse").delete().eq("id",commessa.id); if(error) throw error;
      try{ await sb.rpc("ricalcola_impegni"); }catch(e){}
      onSalvato(); }
    catch(ex){ setErr(ex.message); setBusy(false); }
  }

  async function stampaScheda(){
    let az={};
    try{ const {data}=await sb.from("impostazioni").select("azienda_nome").eq("id",1).maybeSingle(); az=data||{}; }catch(e){}
    stampaHTML(htmlSchedaCommessa(f, fasi, righe, az));
  }

  // Crea un PREVENTIVO (in bozza) dal lavoro REALE della commessa:
  // materiali scaricati (a listino) + ore reali per reparto (a tariffa). Da rivedere in Preventivi.
  async function generaConsuntivo(){
    if(nuova || !commessa?.id){ setErr("Salva prima la commessa."); return; }
    setBusy(true); setErr(""); setConsMsg("");
    try{
      // materiali realmente presenti nei consumi (di norma già scaricati)
      const mat=(consumi||[]).filter(c=>c.articolo_id && (Number(c.quantita)||0)>0);
      const ids=[...new Set(mat.map(c=>c.articolo_id))];
      let aMap={};
      if(ids.length){ const {data}=await sb.from("articoli").select("id,nome_articolo,unita,costo,prezzo_pubblico").in("id",ids); (data||[]).forEach(a=>aMap[a.id]=a); }
      // ore reali per reparto (dai segmenti cronometrati chiusi)
      const orePerRep={};
      (segmenti||[]).forEach(s=>{ const r=(s.reparto||"—"); const b=s.fine?new Date(s.fine).getTime():null; if(b){ orePerRep[r]=(orePerRep[r]||0)+(b-new Date(s.inizio).getTime())/3600000; } });
      const [tf,imp2,prevs]=await Promise.all([
        sb.from("impostazioni_lavorazioni").select("*"),
        sb.from("impostazioni").select("spese_generali_pct,iva_pct,margine_minimo_pct").eq("id",1).maybeSingle(),
        sb.from("preventivi").select("numero"),
      ]);
      const tarMap={}; (tf.data||[]).forEach(t=>tarMap[t.lavorazione]=t);
      const imp=imp2.data||{};
      const righeMdo=Object.keys(orePerRep).map(rep=>{
        const ore=Math.round(orePerRep[rep]*100)/100; const t=tarMap[rep]||{};
        const costo=Number(t.tariffa_oraria)||0, marg=Number(t.margine_obiettivo)||0;
        return {tipo:"manodopera", descrizione:"Manodopera "+rep, articolo_id:null, lavorazione:rep, quantita:ore, unita:"ora",
          costo_unitario:costo, prezzo_unitario:Math.round(costo*(1+marg/100)*100)/100, sconto_pct:0};
      }).filter(r=>r.quantita>0);
      const righeMat=mat.map(c=>{ const a=aMap[c.articolo_id]||{};
        return {tipo:"materiale", descrizione:c.descrizione||a.nome_articolo||"Materiale", articolo_id:c.articolo_id, lavorazione:"",
          quantita:Number(c.quantita)||0, unita:c.unita||a.unita||"", costo_unitario:Number(a.costo)||0, prezzo_unitario:Number(a.prezzo_pubblico)||0, sconto_pct:0}; });
      const tutte=[...righeMdo,...righeMat];
      if(!tutte.length){ setBusy(false); setErr("Niente da consuntivare: nessun materiale scaricato né ore registrate su questa commessa."); return; }
      const numero=prossimoNumero(prevs.data||[]);
      const rec={numero, cliente_id:f.cliente_id||null, cliente_nome:f.cliente_nome||"",
        data:new Date().toISOString().slice(0,10), validita_giorni:30,
        descrizione_breve:"Consuntivo commessa "+(f.numero||commessa.numero||""),
        riferimento:f.riferimento||"", stato:"bozza",
        spese_generali_pct:Number(imp.spese_generali_pct)||0,
        iva_pct: imp.iva_pct!=null?Number(imp.iva_pct):22,
        margine_minimo_pct:Number(imp.margine_minimo_pct)||0,
        creato_da:profilo.id, aggiornato_il:new Date().toISOString()};
      const {data:np,error}=await sb.from("preventivi").insert(rec).select("id").single();
      if(error) throw error;
      const rows=tutte.map((r,idx)=>({preventivo_id:np.id, ordine:idx, ...r}));
      const {error:er}=await sb.from("preventivi_righe").insert(rows); if(er) throw er;
      setConsMsg("Consuntivo creato: preventivo "+numero+" (in bozza) con "+righeMdo.length+" lavorazione/i e "+righeMat.length+" materiale/i. Aprilo in 🧾 Preventivi per rivederlo, ritoccare i prezzi e inviarlo.");
      setBusy(false);
    }catch(ex){ setErr(ex.message); setBusy(false); }
  }

              {perm.economici && <div className="field" style={{maxWidth:150}}><label>Valore €</label>
                <input type="number" step="0.01" value={f.valore} onChange={e=>set("valore",e.target.value)}/></div>}
            </div>
            {perm.economici &&
              <div className="row">
                <div className="field" style={{maxWidth:280}}><label>Agente (provvigione)</label>
                  <select value={f.agente_id} onChange={e=>set("agente_id",e.target.value)}>
                    <option value="">{agenteInfo.eredit? "Eredita dal cliente ("+agenteInfo.eredit.nome+")" : "— nessuno —"}</option>
                    {(agenti||[]).map(a=><option key={a.id} value={a.id}>{a.nome}{a.attivo===false?" (non attivo)":""}</option>)}

                <div className="field" style={{alignSelf:"flex-end"}}>
                  <div className="muted" style={{fontSize:12,marginBottom:12}}>
                    {agenteInfo.eff

                      : "Nessun agente: questa commessa non genera provvigioni."}

                </div>
              </div>}
          </div>

            <h3>Articoli e consegne</h3>
            <div className="muted" style={{fontSize:12,marginBottom:8}}>Ogni articolo deve avere la sua <b>data di consegna</b> (obbligatoria per salvare la commessa). Aggiorna lo <b>Stato</b> per segnare quando un articolo è pronto.</div>
            {righe.length>0 && <div style={{display:"flex",gap:14,flexWrap:"wrap",alignItems:"center",fontSize:13,marginBottom:10}}>
              <span><b>{righe.length}</b> articoli</span>
              <span style={{color:STATI_RIGA_COMMESSA.pronto.c}}>✓ Pronti: <b>{artPronti}</b></span>
              <span style={{color:STATI_RIGA_COMMESSA.consegnato.c}}>📦 Consegnati: <b>{artConsegnati}</b></span>
              {perm.economici && imballoTot>0 && <span>🎁 Imballo: <b>{eur(imballoTot)}</b></span>}
              {righe.length>0 && artPronti+artConsegnati===righe.length &&
                <span className="tag" style={{background:"#e6f4ee",color:"#1f9c68"}}>tutti pronti 🎉</span>}
            </div>}
            {commessa?.preventivo_id && <button type="button" className="btn small" style={{marginBottom:10}} onClick={importaDaPreventivo} disabled={busy}>⬇ Importa articoli dal preventivo</button>}
            {righeSenzaData>0 && <div className="banner err" style={{marginTop:0}}>⚠ {righeSenzaData} articolo/i senza data di consegna: compila le date per poter salvare.</div>}
            {righe.length>1 && Object.keys(contConsegna).length>1 && <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center",marginBottom:8}}>
              <span className="muted" style={{fontSize:12}}>Raggruppa per consegna:</span>

                    return (
                    <tr key={i} style={{background:st.bg==="#eef1f5"?"transparent":st.bg}}>
                      <td style={{minWidth:220}}><input value={r.descrizione} onChange={e=>setRiga(i,"descrizione",e.target.value)}

                      <td><input type="number" step="0.01" value={r.quantita} onChange={e=>setRiga(i,"quantita",e.target.value)}
                        style={{width:72,padding:"6px",border:"1px solid var(--line)",borderRadius:7,textAlign:"right"}}/></td>
                      <td><input value={r.unita||""} onChange={e=>setRiga(i,"unita",e.target.value)}
                        style={{width:72,padding:"6px",border:"1px solid var(--line)",borderRadius:7}}/></td>
                      {perm.economici && (()=>{
                        const sel=imballiSelC(r);
                        return <td>
                          {(r.imballo_pluriball || sel.length>0) && <div style={{display:"flex",flexWrap:"wrap",gap:3,marginBottom:3}}>
                            {r.imballo_pluriball && <span className="tag" style={{fontSize:11}}>📦 {r.imballo_pluriball.nome||"Pluriball"} {r.imballo_pluriball.mtl_tot} mtl</span>}
                            {sel.map(id=>{ const im=(imballi||[]).find(x=>x.id===id);
                              return <span key={id} className="tag" style={{fontSize:11,display:"inline-flex",alignItems:"center",gap:4}}>

                                <button type="button" onClick={()=>removeImballoC(i,id)} style={{border:"none",background:"none",cursor:"pointer",color:"#c0392b",fontWeight:700,padding:0,lineHeight:1}}>×</button>

                          </div>}
                          <select value="" onChange={e=>{addImballoC(i,e.target.value); e.target.value="";}}

                          background:r.data_consegna?"#fff":"#fdecea"}}/></td>
                      <td><select value={r.stato||"da_produrre"} onChange={e=>setRiga(i,"stato",e.target.value)}

                      </select></td>
                      <td><select value={r.modalita_consegna||"corriere"} onChange={e=>setRiga(i,"modalita_consegna",e.target.value)}
                        style={{width:"100%",padding:"6px",borderRadius:7,border:"1px solid var(--line)",
                          background:(MODALITA_CONSEGNA[r.modalita_consegna||"corriere"]||MODALITA_CONSEGNA.corriere).bg,
                          color:(MODALITA_CONSEGNA[r.modalita_consegna||"corriere"]||MODALITA_CONSEGNA.corriere).c,fontWeight:600}}>

                      </select></td>
                      <td><select value={r.evasione||"interna"} onChange={e=>setRiga(i,"evasione",e.target.value)}

                          background:(EVASIONE[r.evasione||"interna"]||EVASIONE.interna).bg,
                          color:(EVASIONE[r.evasione||"interna"]||EVASIONE.interna).c,fontWeight:600}}>
                        {Object.keys(EVASIONE).map(m=><option key={m} value={m}>{EVASIONE[m].l}</option>)}
                      </select></td>
                      <td><button type="button" className="btn small danger" onClick={()=>delRiga(i)}>✕</button></td>
                    </tr>
                    );

                </tbody>

            {righe.some(r=>r.evasione==="fornitore") && <div style={{marginTop:12,padding:12,borderRadius:10,background:"#fff4e5",border:"1px solid #f0d8a8",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
              <div style={{flex:1,minWidth:200,fontSize:13}}>🚚 <b>{righe.filter(r=>r.evasione==="fornitore").length}</b> riga/e da evadere <b>via fornitore</b>: genera l'ordine fornitore (bozza) da completare.</div>

              <button type="button" className="btn small primary" onClick={scaricaMagazzino} disabled={busy||daScaricare.length===0}
