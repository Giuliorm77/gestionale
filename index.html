          {perm.economici &&
            <div className="section">
              <h3>Agente / provvigione</h3>
              {c.agente_id
                ? <div className="kv">
                    <span className="k">Agente</span><span>{(c.agente&&c.agente.nome)||"—"}</span>
                    <span className="k">Provvigione</span><span>{(c.provvigione_pct!=null? Number(c.provvigione_pct) : (c.agente? Number(c.agente.provvigione_pct)||0 : 0))}%{c.provvigione_pct!=null?" (eccezione)":" (standard agente)"}</span>
                  </div>
                : <span className="muted">Nessun agente assegnato</span>}
            </div>}

          {perm.economici &&
            <div className="section">
              <h3>Pagamento e banca</h3>
              {cond
                ? <div className="kv">
                    <span className="k">Metodo</span><span>{cond.metodo_pagamento||"—"}</span>
                    <span className="k">Termini</span><span>{cond.termini_pagamento||"—"}</span>
                    <span className="k">Banca</span><span>{cond.banca||"—"}</span>
                    <span className="k">IBAN</span><span>{cond.iban||"—"}</span>
                  </div>
                : <span className="muted">Nessun dato di pagamento</span>}
            </div>}

          {perm.economici &&
            <div className="section">
              <h3>Sconti</h3>
              <div className="kv">
                <span className="k">Sconto standard</span>
                <span style={{color:"var(--brand-d)",fontWeight:700}}>
                  −{c.sconto_pct!=null? Number(c.sconto_pct) : (c.categoria==="Rivenditore"? scontoRivStd : 0)}%
                  <span className="muted" style={{fontWeight:400,fontSize:12}}>
                    {c.sconto_pct!=null? " (su questo cliente)" : c.categoria==="Rivenditore"? " (standard rivenditori)" : " (cliente finale)"}</span>
                </span>
              </div>
              {(c.clienti_sconti||[]).length>0 && <>
                <div className="muted" style={{fontSize:12,margin:"8px 0 2px",textTransform:"uppercase",fontWeight:700}}>Eccezioni per categoria</div>
                {(c.clienti_sconti||[]).map(s=>
                  <div key={s.id} className="kv">
                    <span className="k">{s.categoria}</span>
                    <span style={{color:"var(--brand-d)",fontWeight:700}}>−{Number(s.sconto_pct)||0}%</span>
                  </div>)}
              </>}
              {cond && Number(cond.fatturato)>0 &&
                <div className="kv" style={{marginTop:6}}>
                  <span className="k">Fatturato annuo</span>
                  <span style={{color:"var(--ok)",fontWeight:700}}>
                    {Number(cond.fatturato).toLocaleString("it-IT",{style:"currency",currency:"EUR",maximumFractionDigits:0})}</span>
                </div>}
              <div className="muted" style={{fontSize:12,marginTop:6}}>Prezzo di listino = <b>Prezzo pubblico</b> del Catalogo; lo sconto viene proposto in automatico nei preventivi.</div>
            </div>}
          {c.note && <div className="section"><h3>Note</h3><div className="muted">{c.note}</div></div>}
          {perm.crm && <div className="section">
            <h3>🎯 CRM — Trattative e attività</h3>
            {perm.scrivi && <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
              <button type="button" className="btn small" onClick={()=>setCrmEditor({tipo:"tratt"})}>+ Nuova trattativa</button>
              <button type="button" className="btn small" onClick={()=>setCrmEditor({tipo:"att"})}>+ Registra attività</button>
            </div>}
            <div className="muted" style={{fontSize:11,fontWeight:700,textTransform:"uppercase",margin:"4px 0 6px"}}>Trattative</div>
            {crmTratt===null? <div className="muted">Caricamento…</div>
              : crmTratt.length===0? <div className="muted" style={{fontSize:13}}>Nessuna trattativa.</div>
              : crmTratt.map(t=>{ const S=STATI_TRATTATIVA[t.stato]||STATI_TRATTATIVA.nuovo;
                  return <div key={t.id} className="card" style={{padding:"8px 10px",marginBottom:6,cursor:"pointer"}} onClick={()=>setCrmEditor({tipo:"tratt",dato:t})}>
                    <div style={{display:"flex",justifyContent:"space-between",gap:8}}><span style={{fontWeight:600}}>{t.titolo}</span>
                      <span className="tag" style={{background:S.bg,color:S.c}}>{S.l}</span></div>
                    <div className="muted" style={{fontSize:12}}>{eurC(t.valore_stimato)} · {t.probabilita||0}%{t.data_prevista?" · 📅 "+new Date(t.data_prevista).toLocaleDateString("it-IT"):""}</div>
                  </div>; })}
            <div className="muted" style={{fontSize:11,fontWeight:700,textTransform:"uppercase",margin:"12px 0 6px"}}>Attività recenti</div>
            {crmAtt.length===0? <div className="muted" style={{fontSize:13}}>Nessuna attività registrata.</div>
              : crmAtt.map(a=>{ const T=TIPI_ATTIVITA[a.tipo]||TIPI_ATTIVITA.nota;
                  return <div key={a.id} style={{display:"grid",gridTemplateColumns:"auto 1fr",gap:8,fontSize:13,padding:"3px 0"}}>
                    <span>{T.ico}</span>
                    <span>{a.esito||a.note||T.l} <span className="muted">· {new Date(a.data_ora).toLocaleDateString("it-IT")}{!a.completata?" · ⏳ da fare":""}</span></span>
                  </div>; })}
          </div>}

          <div className="section">
            <h3>📋 Feedback cliente <span className="muted" style={{fontWeight:400,fontSize:12}}>· registro ISO</span></h3>
            {puoFeedback && <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end",marginBottom:10}}>
              <div className="field" style={{maxWidth:110,margin:0}}><label style={{fontSize:12}}>Anno</label>
                <input type="number" step="1" value={fbAnno} onChange={e=>setFbAnno(e.target.value)}/></div>
              <div className="field" style={{maxWidth:210,margin:0}}><label style={{fontSize:12}}>Feedback</label>
                <select value={fbEsito} onChange={e=>setFbEsito(e.target.value)}>
                  <option>Positivo</option><option>Parzialmente positivo</option><option>Negativo</option>
                </select></div>
              <div className="field" style={{flex:1,minWidth:160,margin:0}}><label style={{fontSize:12}}>Nota (facoltativa)</label>
                <input value={fbNota} onChange={e=>setFbNota(e.target.value)} placeholder="es. ritardo consegna, molto soddisfatto…"/></div>
              <button type="button" className="btn small primary" onClick={addFb} disabled={fbBusy}>+ Aggiungi</button>
            </div>}
            {fbList===null? <div className="muted">Caricamento…</div>
              : fbList.length===0? <div className="muted" style={{fontSize:13}}>Nessun feedback registrato.</div>
              : <table><thead><tr><th style={{width:70}}>Anno</th><th>Feedback</th><th>Nota</th>{puoFeedback && <th></th>}</tr></thead>
                  <tbody>
                    {fbList.map(fb=>{ const col=FB_COL[fb.feedback]||{bg:"#eee",c:"#333"};
                      return <tr key={fb.id}>
                        <td>{fb.anno}</td>
                        <td><span className="tag" style={{background:col.bg,color:col.c}}>{fb.feedback}</span></td>
                        <td className="muted">{fb.note||"—"}</td>
                        {puoFeedback && <td style={{textAlign:"right"}}><button type="button" className="btn small danger" onClick={()=>delFb(fb.id)}>✕</button></td>}
                      </tr>; })}
                  </tbody></table>}
          </div>
        </div>
        <footer>
          {perm.elimina && <button className="btn danger" onClick={elimina} disabled={busy}>Elimina</button>}
          {perm.scrivi && <button className="btn" onClick={onModifica}>Modifica</button>}
          <button className="btn primary" onClick={onClose}>Chiudi</button>
        </footer>
      </div>
      {crmEditor && crmEditor.tipo==="tratt" && <TrattativaForm profilo={profilo} perm={perm} clienti={clientiUno} trattativa={crmEditor.dato} clienteFisso={c.id}
        onClose={()=>setCrmEditor(null)} onSalvato={()=>{setCrmEditor(null);caricaCrm();}}/>}
      {crmEditor && crmEditor.tipo==="att" && <AttivitaForm profilo={profilo} clienti={clientiUno} attivita={crmEditor.dato} clienteFisso={c.id}
        onClose={()=>setCrmEditor(null)} onSalvato={()=>{setCrmEditor(null);caricaCrm();}}/>}
    </div>
  );
}

/* ------------------------------------------------ form nuovo/modifica */
function FormCliente({cliente,perm,onClose,onSalvato}){
  const nuovo=!cliente;
  const [f,setF]=useState(()=>({
    ragione_sociale:cliente?.ragione_sociale||"",
    tipo:cliente?.tipo||"Azienda",
    categoria:cliente?.categoria||"Cliente finale",
    affidabilita:cliente?.affidabilita||0,
    tipo_attivita:cliente?.tipo_attivita||"",
    referente:cliente?.referente||"",
    stato:cliente?.stato||"Attivo",
    agente_id:cliente?.agente_id||"",
    provvigione_pct:cliente?.provvigione_pct ?? "",
    partita_iva:cliente?.partita_iva||"",
    codice_fiscale:cliente?.codice_fiscale||"",
    codice_sdi:cliente?.codice_sdi||"",
    fattura_elettronica:cliente?.fattura_elettronica!==false,
    split_payment:cliente?.split_payment===true,
    sconto_pct:cliente?.sconto_pct ?? "",
    telefono:cliente?.telefono||"",
    cellulare:cliente?.cellulare||"",
    trasp_vettore:cliente?.trasp_vettore||"",
    trasp_referente:cliente?.trasp_referente||"",
    trasp_telefono:cliente?.trasp_telefono||"",
    trasp_resa:cliente?.trasp_resa||"Franco destino",
    trasp_note:cliente?.trasp_note||"",
    note:cliente?.note||"",
    lavorazioni:cliente?.lavorazioni||[],
  }));
  const [sedi,setSedi]=useState(()=> (cliente?.clienti_sedi||[]).map(s=>({...s})) );
  const [emails,setEmails]=useState(()=> (cliente?.clienti_email||[]).map(e=>({...e})) );
  const condIn=(cliente?.clienti_condizioni||[])[0];
  const [eco,setEco]=useState(()=>({
    banca:condIn?.banca||"",
    iban:condIn?.iban||"",
    metodo_pagamento:condIn?.metodo_pagamento||"Bonifico bancario",
    termini_pagamento:condIn?.termini_pagamento||"",
    fatturato:condIn?.fatturato ?? "",
  }));
  const [listini,setListini]=useState(()=> (cliente?.clienti_listini||[]).map(l=>({...l})) );
  const [agentiList,setAgentiList]=useState([]);
  const [sconti,setSconti]=useState(()=> (cliente?.clienti_sconti||[]).map(s=>({...s})) );
  const [categorieArt,setCategorieArt]=useState([]);
  const [scontoRivStd,setScontoRivStd]=useState(0);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  useEffect(()=>{ if(!perm.economici) return;
    sb.from("agenti").select("id,nome,provvigione_pct,attivo").order("nome").then(({data})=>setAgentiList(data||[]));
    sb.from("impostazioni").select("sconto_rivenditori_pct").eq("id",1).maybeSingle()
      .then(({data})=>setScontoRivStd(Number(data&&data.sconto_rivenditori_pct)||0));
    /* v60: dalla funzione categorie_articoli, non dalle prime 1000 righe. */
    sb.rpc("categorie_articoli").then(({data})=>setCategorieArt((data||[]).map(r=>r.categoria)));
  },[perm.economici]);
  const addSconto=()=>setSconti(p=>[...p,{categoria:"",sconto_pct:0}]);
  const setScontoR=(i,k,v)=>setSconti(p=>p.map((s,j)=>j===i?{...s,[k]:v}:s));
  const delSconto=i=>setSconti(p=>p.filter((_,j)=>j!==i));

  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const setE=(k,v)=>setEco(p=>({...p,[k]:v}));
  const toggleLav=l=>setF(p=>({...p,lavorazioni:p.lavorazioni.includes(l)
    ? p.lavorazioni.filter(x=>x!==l) : [...p.lavorazioni,l]}));

  const addSede=()=>setSedi(p=>[...p,{tipo:"operativa",indirizzo:"",cap:"",citta:"",provincia:"",regione:"",
    nazione:"Italia",giorni_apertura:[],orario_mattino:"",orario_pomeriggio:""}]);
  const setSede=(i,k,v)=>setSedi(p=>p.map((s,j)=>j===i?{...s,[k]:v}:s));
  const setSedeGiorno=(i,g)=>setSedi(p=>p.map((s,j)=>{
    if(j!==i) return s;
    const cur=s.giorni_apertura||[];
    return {...s,giorni_apertura:cur.includes(g)?cur.filter(x=>x!==g):[...cur,g]};
  }));
  const delSede=i=>setSedi(p=>p.filter((_,j)=>j!==i));
  const addEmail=()=>setEmails(p=>[...p,{categoria:"generica",indirizzo:""}]);
  const setEmail=(i,k,v)=>setEmails(p=>p.map((e,j)=>j===i?{...e,[k]:v}:e));
  const delEmail=i=>setEmails(p=>p.filter((_,j)=>j!==i));
  const addListino=()=>setListini(p=>[...p,{nome:"",sconto:0}]);
  const setListino=(i,k,v)=>setListini(p=>p.map((l,j)=>j===i?{...l,[k]:v}:l));
  const delListino=i=>setListini(p=>p.filter((_,j)=>j!==i));

  async function salva(e){
    e.preventDefault();
    if(!f.ragione_sociale.trim()){ setErr("La ragione sociale è obbligatoria."); return; }
    if(!pivaValida(f.partita_iva)){ setErr("La Partita IVA non è valida (11 cifre per l'Italia, oppure prefisso paese es. IT/DE per l'estero). Correggila o lasciala vuota."); return; }
    setBusy(true); setErr("");
    const payload={ ...f,
      agente_id: f.agente_id||null,
      provvigione_pct: f.provvigione_pct===""?null:Number(f.provvigione_pct),
      sconto_pct: f.sconto_pct===""?null:Number(f.sconto_pct) };
    try{
      let clienteId=cliente?.id;
      if(nuovo){
        const {data,error}=await sb.from("clienti").insert(payload).select("id").single();
        if(error) throw error; clienteId=data.id;
      }else{
        const {error}=await sb.from("clienti").update(payload).eq("id",clienteId);
        if(error) throw error;
        // rimpiazzo sedi/email (semplice e sicuro per la modifica)
        await sb.from("clienti_sedi").delete().eq("cliente_id",clienteId);
        await sb.from("clienti_email").delete().eq("cliente_id",clienteId);
      }
      const sediValide=sedi.filter(s=>s.indirizzo||s.citta||s.cap);
      if(sediValide.length){
        const {error}=await sb.from("clienti_sedi").insert(
          sediValide.map(s=>({cliente_id:clienteId,tipo:s.tipo,indirizzo:s.indirizzo,
            cap:s.cap,citta:s.citta,provincia:s.provincia,regione:s.regione||"",nazione:s.nazione,
            giorni_apertura:s.giorni_apertura||[],orario_mattino:s.orario_mattino||"",
            orario_pomeriggio:s.orario_pomeriggio||""})));
        if(error) throw error;
      }
      const emailValide=emails.filter(e=>e.indirizzo.trim());
      if(emailValide.length){
        const {error}=await sb.from("clienti_email").insert(
          emailValide.map(e=>({cliente_id:clienteId,categoria:e.categoria,indirizzo:e.indirizzo.trim()})));
        if(error) throw error;
      }
      if(perm.economici){
        const {error}=await sb.from("clienti_condizioni").upsert({
          cliente_id:clienteId, banca:eco.banca, iban:eco.iban,
          metodo_pagamento:eco.metodo_pagamento, termini_pagamento:eco.termini_pagamento,
          fatturato:Number(eco.fatturato)||0, aggiornato_il:new Date().toISOString()});
        if(error) throw error;
        await sb.from("clienti_sconti").delete().eq("cliente_id",clienteId);
        const scValidi=sconti.filter(s=>String(s.categoria||"").trim());
        if(scValidi.length){
          const {error:e2}=await sb.from("clienti_sconti").insert(
            scValidi.map(s=>({cliente_id:clienteId,categoria:String(s.categoria).trim(),sconto_pct:Number(s.sconto_pct)||0})));
          if(e2) throw e2;
        }
      }
      onSalvato();
    }catch(ex){ setErr(ex.message); setBusy(false); }
  }

  return (
    <div className="overlay">
      <form className="modal" onClick={e=>e.stopPropagation()} onSubmit={salva}>
        <header>
          <h2>{nuovo?"Nuovo cliente":"Modifica cliente"}</h2>
          <button type="button" className="x" onClick={onClose}>×</button>
        </header>
        <div className="body">
          {err && <div className="banner err">{err}</div>}

          <div className="section">
            <h3>Dati principali</h3>
            <div className="row">
              <div className="field" style={{flex:2}}>
                <label>Ragione sociale *</label>
                <input value={f.ragione_sociale} onChange={e=>set("ragione_sociale",e.target.value)} required/>
              </div>
              <div className="field" style={{maxWidth:150}}>
                <label>Tipo</label>
                <select value={f.tipo} onChange={e=>set("tipo",e.target.value)}>
                  {TIPI_CLIENTE.map(t=><option key={t} value={t}>{t}</option>)}
                </select>
              </div>
              <div className="field" style={{maxWidth:150}}>
                <label>Stato</label>
                <select value={f.stato} onChange={e=>set("stato",e.target.value)}>
                  {STATI.map(t=><option key={t} value={t}>{t}</option>)}
                </select>
              </div>
            </div>
            <div className="row">
              <div className="field" style={{maxWidth:220}}>
                <label>Categoria</label>
                <select value={f.categoria} onChange={e=>set("categoria",e.target.value)}>
                  {CATEGORIE_CLIENTE.map(c=><option key={c} value={c}>{c}</option>)}
                </select>
              </div>
              <div className="field" style={{maxWidth:180}}>
                <label>Affidabilità</label>
                <div style={{display:"flex",gap:4}}>
                  {[1,2,3,4,5].map(n=>
                    <button type="button" key={n} onClick={()=>set("affidabilita",f.affidabilita===n?0:n)}
                      style={{background:"none",border:"none",fontSize:26,cursor:"pointer",lineHeight:1,
                        color:n<=f.affidabilita?"#f5a623":"#d0d5dd"}}>★</button>)}
                </div>
              </div>
              <div className="field">
                <label>Tipo di attività</label>
                <input value={f.tipo_attivita} onChange={e=>set("tipo_attivita",e.target.value)}
                       placeholder="es. Agenzia di comunicazione, Ristorazione…"/>
              </div>
            </div>
          </div>

          {perm.economici &&
            <div className="section">
              <h3>Agente / rappresentante</h3>
              <div className="row">
                <div className="field" style={{flex:2}}>
                  <label>Agente assegnato</label>
                  <select value={f.agente_id} onChange={e=>set("agente_id",e.target.value)}>
                    <option value="">— nessuno —</option>
                    {agentiList.map(a=><option key={a.id} value={a.id}>{a.nome}{a.attivo===false?" (non attivo)":""}</option>)}
                  </select>
                </div>
                <div className="field" style={{maxWidth:200}}>
                  <label>Provvigione % (eccezione)</label>
                  <input type="number" step="0.01" min="0" value={f.provvigione_pct}
                         onChange={e=>set("provvigione_pct",e.target.value)}
                         placeholder={(()=>{ const a=agentiList.find(x=>x.id===f.agente_id); return a? "standard "+(Number(a.provvigione_pct)||0)+"%" : "—"; })()}/>
                </div>
              </div>
              <div className="muted" style={{fontSize:12}}>
                {(()=>{ const a=agentiList.find(x=>x.id===f.agente_id);
                  if(!f.agente_id) return "Nessun agente: le commesse di questo cliente non generano provvigioni.";
                  const eff = f.provvigione_pct!==""? Number(f.provvigione_pct) : (a? Number(a.provvigione_pct)||0 : 0);
                  return "Provvigione applicata a questo cliente: "+eff+"%"+(f.provvigione_pct!==""?" (eccezione)":" (standard agente)")+". Lascia vuoto il campo per usare la % standard dell'agente."; })()}
              </div>
            </div>}

          <div className="section">
            <h3>Contatti</h3>
            <div className="field"><label>Referente</label>
              <input value={f.referente} onChange={e=>set("referente",e.target.value)} placeholder="Persona di riferimento"/></div>
            <div className="row">
              <div className="field"><label>Telefono</label>
                <input value={f.telefono} onChange={e=>set("telefono",e.target.value)}/></div>
              <div className="field"><label>Cellulare</label>
                <input value={f.cellulare} onChange={e=>set("cellulare",e.target.value)}/></div>
            </div>
            <label style={{fontSize:12,fontWeight:600,color:"var(--muted)",textTransform:"uppercase"}}>Email</label>
            {emails.map((e,i)=>
              <div className="subrow" key={i}>
                <div className="row">
                  <div className="field" style={{maxWidth:180}}><label>Categoria</label>
                    <select value={e.categoria} onChange={ev=>setEmail(i,"categoria",ev.target.value)}>
                      {CATEGORIE_EMAIL.map(c=><option key={c.v} value={c.v}>{c.label}</option>)}
                    </select></div>
                  <div className="field" style={{flex:2}}><label>Indirizzo email</label>
                    <input type="email" value={e.indirizzo} onChange={ev=>setEmail(i,"indirizzo",ev.target.value)}/></div>
                  <button type="button" className="btn small danger" style={{alignSelf:"flex-end",marginBottom:12}}
                          onClick={()=>delEmail(i)}>Rimuovi</button>
                </div>
              </div>)}
            <button type="button" className="btn small repeat-add" onClick={addEmail}>+ Aggiungi email</button>
          </div>

          {perm.fiscali &&
            <div className="section">
              <h3>Dati fiscali</h3>
              <div className="row">
                <div className="field"><label>Partita IVA</label>
                  <input value={f.partita_iva} onChange={e=>set("partita_iva",e.target.value)}/>
                  {!pivaValida(f.partita_iva) && <div className="muted" style={{fontSize:12,color:"var(--warn)"}}>⚠ P.IVA non valida (11 cifre, o prefisso paese es. IT/DE)</div>}</div>
                <div className="field"><label>Codice fiscale</label>
                  <input value={f.codice_fiscale} onChange={e=>set("codice_fiscale",e.target.value)}/></div>
                <div className="field"><label>Codice SDI</label>
                  <input value={f.codice_sdi} onChange={e=>set("codice_sdi",e.target.value)}/></div>
              </div>
              <div className="row">
                <div className="field" style={{maxWidth:220}}><label>Fattura elettronica</label>

/* ================================================================ LISTINI (ruoli economici) */
function ModuloListini({profilo,perm}){
  const [listini,setListini]=useState(null);
  const [err,setErr]=useState("");
  const [cerca,setCerca]=useState("");
  const [editor,setEditor]=useState(null); // null | {} nuovo | listino esistente

  const carica=useCallback(async()=>{
    setErr("");
    const {data,error}=await sb.from("listini").select("*, listini_voci(*)").order("nome");
    if(error){ setErr(error.message); return; }
    setListini(data||[]);
  },[]);
  useEffect(()=>{ carica(); },[carica]);

  const filtrati=useMemo(()=>{
    if(!listini) return [];
    const q=cerca.trim().toLowerCase();
    if(!q) return listini;
    return listini.filter(l=>[l.nome,l.descrizione].join(" ").toLowerCase().includes(q));
  },[listini,cerca]);

  return (
    <>
      <div className="topbar">
        <h1>Listini</h1>
        {perm.scrivi && <button className="btn primary" onClick={()=>setEditor({})}>+ Nuovo listino</button>}
      </div>
      <div className="content">
        {err && <div className="banner err">{err}</div>}
        <div className="toolbar">
          <div className="search"><span className="mag">🔍</span>
            <input placeholder="Cerca listino…" value={cerca} onChange={e=>setCerca(e.target.value)}/></div>
          <span className="muted">{filtrati.length} listini</span>
        </div>
        {listini===null ? <div className="empty">Caricamento…</div>
          : filtrati.length===0 ? <div className="card empty">Nessun listino. Creane uno con "+ Nuovo listino".</div>
          : <div className="card" style={{overflow:"hidden"}}>
              <table>
                <thead><tr><th>Nome</th><th>Descrizione</th><th>Voci</th><th>Stato</th></tr></thead>
                <tbody>
                  {filtrati.map(l=>
                    <tr key={l.id} onClick={()=>setEditor(l)}>
                      <td className="rs">{l.nome}</td>
                      <td className="muted">{l.descrizione||"—"}</td>
                      <td>{(l.listini_voci||[]).length}</td>
                      <td>{l.attivo===false
                        ? <span className="tag" style={{background:"#fdf0e3",color:"#c47a1e"}}>Non attivo</span>
                        : <span className="tag" style={{background:"#e6f4ee",color:"#1f9c68"}}>Attivo</span>}</td>
                    </tr>)}
                </tbody>
              </table>
            </div>}
      </div>
      {editor && <ListinoEditor listino={editor.id?editor:null} perm={perm}
        onClose={()=>setEditor(null)} onSalvato={()=>{setEditor(null);carica();}}/>}
    </>
  );
}

function ListinoEditor({listino,perm,onClose,onSalvato}){
  const nuovo=!listino;
  const [f,setF]=useState(()=>({
    nome:listino?.nome||"",
    descrizione:listino?.descrizione||"",
    valuta:listino?.valuta||"EUR",
    attivo:listino?.attivo!==false,
    note:listino?.note||"",
  }));
  const [voci,setVoci]=useState(()=> (listino?.listini_voci||[])
    .slice().sort((a,b)=>(a.ordine||0)-(b.ordine||0)).map(v=>({...v})) );
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const [showImport,setShowImport]=useState(false);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const addVoce=()=>setVoci(p=>[...p,{codice:padCod(maxCod(p)+1),descrizione:"",lavorazione:"",unita:"",prezzo:"",note:""}]);
  const setVoce=(i,k,v)=>setVoci(p=>p.map((x,j)=>j===i?{...x,[k]:v}:x));
  const delVoce=i=>setVoci(p=>p.filter((_,j)=>j!==i));
  const importaVoci=(nuove)=>{
    setVoci(p=>{
      let base=maxCod(p);
      const conCodici=nuove.map(v=>{ if(!String(v.codice||"").trim()){ base+=1; return {...v,codice:padCod(base)}; } return v; });
      return [...p,...conCodici];
    });
    setShowImport(false);
  };

  async function salva(e){
    e.preventDefault();
    if(!f.nome.trim()){ setErr("Il nome del listino è obbligatorio."); return; }
    setBusy(true); setErr("");
    try{
      let id=listino?.id;
      if(nuovo){
        const {data,error}=await sb.from("listini").insert(f).select("id").single();
        if(error) throw error; id=data.id;
      }else{
        const {error}=await sb.from("listini").update(f).eq("id",id);
        if(error) throw error;
        await sb.from("listini_voci").delete().eq("listino_id",id);
      }
      const vv=voci.filter(v=>String(v.descrizione).trim());
      if(vv.length){
        const {error}=await sb.from("listini_voci").insert(vv.map((v,idx)=>({
          listino_id:id, codice:v.codice||"", descrizione:v.descrizione,
          lavorazione:v.lavorazione||"", unita:v.unita||"",
          prezzo:Number(v.prezzo)||0, note:v.note||"", ordine:idx })));
        if(error) throw error;
      }
      onSalvato();
    }catch(ex){ setErr(ex.message); setBusy(false); }
  }

  return (
    <div className="overlay">
      <form className="modal" style={{maxWidth:900}} onClick={e=>e.stopPropagation()} onSubmit={salva}>
        <header>
          <h2>{nuovo?"Nuovo listino":"Modifica listino"}</h2>
          <button type="button" className="x" onClick={onClose}>×</button>
        </header>
        <div className="body">
          {err && <div className="banner err">{err}</div>}
          <div className="section">
            <h3>Dati listino</h3>
            <div className="row">
              <div className="field" style={{flex:2}}><label>Nome *</label>
                <input value={f.nome} onChange={e=>set("nome",e.target.value)} required
                       placeholder="es. Listino Base 2026"/></div>
              <div className="field" style={{maxWidth:110}}><label>Valuta</label>
                <input value={f.valuta} onChange={e=>set("valuta",e.target.value)}/></div>
            </div>
            <div className="field"><label>Descrizione</label>
              <input value={f.descrizione} onChange={e=>set("descrizione",e.target.value)}/></div>
            <label style={{display:"flex",alignItems:"center",gap:8,margin:"4px 0"}}>
              <input type="checkbox" checked={f.attivo} onChange={e=>set("attivo",e.target.checked)} style={{width:"auto"}}/>
              Listino attivo
            </label>
          </div>

          <div className="section">
            <h3>Voci del listino</h3>
            {voci.length===0 && <div className="muted" style={{marginBottom:8}}>Nessuna voce. Aggiungine con il pulsante qui sotto.</div>}
            {voci.map((v,i)=>
              <div className="subrow" key={i}>
                <div className="row">
                  <div className="field" style={{maxWidth:120}}><label>Codice</label>
                    <input value={v.codice} onChange={e=>setVoce(i,"codice",e.target.value)}/></div>
                  <div className="field" style={{flex:2}}><label>Descrizione *</label>
                    <input value={v.descrizione} onChange={e=>setVoce(i,"descrizione",e.target.value)}
                           placeholder="es. Stampa PVC 500x1000 mm"/></div>
                  <button type="button" className="btn small danger" style={{alignSelf:"flex-end",marginBottom:12}}
                          onClick={()=>delVoce(i)}>Rimuovi</button>
                </div>
                <div className="row">
                  <div className="field"><label>Lavorazione</label>
                    <select value={v.lavorazione||""} onChange={e=>setVoce(i,"lavorazione",e.target.value)}>
                      <option value="">—</option>
                      {LAVORAZIONI.map(l=><option key={l} value={l}>{l}</option>)}
                    </select></div>
                  <div className="field" style={{maxWidth:160}}><label>Unità</label>
                    <select value={v.unita||""} onChange={e=>setVoce(i,"unita",e.target.value)}>
                      <option value="">—</option>
                      {UNITA.map(u=><option key={u} value={u}>{u}</option>)}
                    </select></div>
                  <div className="field" style={{maxWidth:140}}><label>Prezzo ({f.valuta})</label>
                    <input type="number" step="0.01" min="0" value={v.prezzo}
                           onChange={e=>setVoce(i,"prezzo",e.target.value)}/></div>
                </div>
                <div className="field"><label>Note</label>
                  <input value={v.note||""} onChange={e=>setVoce(i,"note",e.target.value)}/></div>
              </div>)}
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <button type="button" className="btn small repeat-add" onClick={addVoce}>+ Aggiungi voce</button>
              <button type="button" className="btn small" onClick={()=>setShowImport(true)}>📊 Importa da Excel/CSV</button>
            </div>
          </div>
        </div>
        <footer>
          <button type="button" className="btn" onClick={onClose}>Annulla</button>
          <button className="btn primary" disabled={busy}>{busy?<span className="spin"/>:"Salva"}</button>
        </footer>
        {showImport && <ImportListino onClose={()=>setShowImport(false)} onImport={importaVoci}/>}
      </form>
    </div>
  );
}

/* ------------------------------------------------ import listino da Excel/CSV */
function ImportListino({onClose,onImport}){
  const [cols,setCols]=useState(null);
  const [rows,setRows]=useState([]);
  const [map,setMap]=useState({descrizione:"",prezzo:"",codice:"",lavorazione:"",unita:"",note:""});
  const [err,setErr]=useState("");
  const [nomeFile,setNomeFile]=useState("");

  function onFile(e){
    const file=e.target.files && e.target.files[0];
    if(!file) return;
    setErr(""); setNomeFile(file.name);
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const json=XLSX.utils.sheet_to_json(ws,{defval:""});
        if(!json.length){ setErr("Il file sembra vuoto o senza intestazioni."); setCols(null); return; }
        const headers=Object.keys(json[0]);
        setCols(headers); setRows(json);
        const guess=(...ks)=>headers.find(h=>ks.some(k=>h.toLowerCase().includes(k)))||"";
        setMap({
          descrizione:guess("descriz","denomin","articolo","prodotto","voce"),
          prezzo:guess("prezzo","importo","costo","list","€","eur"),
          codice:guess("codice","cod","art."),
          lavorazione:guess("lavora","categor","tipo","reparto"),
          unita:guess("unit","u.m","udm","misura","um"),
          note:guess("note"),
        });
      }catch(ex){ setErr("Impossibile leggere il file: "+ex.message); setCols(null); }
    };
    reader.readAsArrayBuffer(file);
  }
  const setM=(k,v)=>setMap(p=>({...p,[k]:v}));

  const mappa=r=>({
    codice: map.codice? String(r[map.codice]??"").trim():"",
    descrizione: String(r[map.descrizione]??"").trim(),
    lavorazione: map.lavorazione? String(r[map.lavorazione]??"").trim():"",
    unita: map.unita? String(r[map.unita]??"").trim():"",
    prezzo: map.prezzo? normalizzaPrezzo(r[map.prezzo]):"",
    note: map.note? String(r[map.note]??"").trim():"",
  });
  const anteprima = useMemo(()=> cols? rows.slice(0,5).map(mappa):[], [cols,rows,map]);

  function conferma(){
    if(!map.descrizione){ setErr("Scegli almeno la colonna della Descrizione."); return; }
    const out=rows.map(mappa).filter(v=>v.descrizione);
    if(!out.length){ setErr("Nessuna riga con descrizione trovata."); return; }
    onImport(out);
  }

  const CAMPI=[
    {k:"descrizione",label:"Descrizione *"},{k:"prezzo",label:"Prezzo"},
    {k:"codice",label:"Codice"},{k:"lavorazione",label:"Lavorazione"},
    {k:"unita",label:"Unità"},{k:"note",label:"Note"},
  ];

  return (
    <div className="overlay" style={{zIndex:60}}>
      <div className="modal" style={{maxWidth:820}} onClick={e=>e.stopPropagation()}>
        <header>
          <h2>Importa listino da Excel/CSV</h2>
          <button type="button" className="x" onClick={onClose}>×</button>
        </header>
        <div className="body">
          {err && <div className="banner err">{err}</div>}
          <div className="section">
            <h3>1. Scegli il file</h3>
            <input type="file" accept=".xlsx,.xls,.csv" onChange={onFile}/>
            {nomeFile && <div className="muted" style={{marginTop:6}}>File: {nomeFile} — {rows.length} righe</div>}
            <div className="muted" style={{fontSize:12,marginTop:6}}>La prima riga del file deve contenere le intestazioni delle colonne.</div>
          </div>

          {cols &&
            <div className="section">
              <h3>2. Abbina le colonne</h3>
              <div className="muted" style={{fontSize:12,marginBottom:10}}>Per ogni campo del listino scegli la colonna del file (— se non presente).</div>
              {CAMPI.map(c=>
                <div className="row" key={c.k} style={{alignItems:"center",marginBottom:8}}>
                  <div style={{width:130,fontWeight:600}}>{c.label}</div>
                  <select className="btn" style={{flex:1}} value={map[c.k]} onChange={e=>setM(c.k,e.target.value)}>
                    <option value="">—</option>
                    {cols.map(h=><option key={h} value={h}>{h}</option>)}
                  </select>
                </div>)}
            </div>}

          {cols && map.descrizione &&
            <div className="section">
              <h3>3. Anteprima (prime righe)</h3>
              <div className="card" style={{overflow:"auto"}}>
                <table>
                  <thead><tr><th>Cod.</th><th>Descrizione</th><th>Lavorazione</th><th>Unità</th><th>Prezzo</th></tr></thead>
                  <tbody>
                    {anteprima.map((v,i)=>
                      <tr key={i}>
                        <td>{v.codice||"—"}</td><td>{v.descrizione||"—"}</td>
                        <td className="muted">{v.lavorazione||"—"}</td><td>{v.unita||"—"}</td>
                        <td>{v.prezzo===""?"—":v.prezzo}</td>
                      </tr>)}
                  </tbody>
                </table>
              </div>
              <div className="muted" style={{fontSize:12,marginTop:6}}>Il codice mancante viene generato automaticamente. Dopo l'import puoi correggere tutto prima di salvare.</div>
            </div>}
        </div>
        <footer>
          <button type="button" className="btn" onClick={onClose}>Annulla</button>
          <button type="button" className="btn primary" disabled={!cols||!map.descrizione} onClick={conferma}>
            Importa{rows.length?" ("+rows.length+" righe)":""}</button>
        </footer>
      </div>
    </div>
  );
}

/* Ricerca articoli LATO SERVER (v60). Prima si scaricava tutto il catalogo e si
   filtrava nel browser: Supabase pero' restituisce max 1000 righe, quindi con
   migliaia di articoli la maggior parte era invisibile e non cercabile. */
const ART_PER_PAGINA=50;
const CAMPI_RICERCA_ART=["codice","nome_articolo","descrizione_articolo","categoria","settore","materiale_articolo","nota_ripristino"];
function filtroRicercaArticoli(q){
  /* virgole e parentesi sono i separatori della sintassi .or() di PostgREST:
     lasciarle passare romperebbe la query, quindi si tolgono. */
  const t=String(q||"").replace(/[,()%\\*]/g," ").trim();
  if(!t) return null;
  return CAMPI_RICERCA_ART.map(c=>c+".ilike.%"+t+"%").join(",");
}

// Carica TUTTI gli articoli (o della vista senza prezzi) paginando a blocchi di 1000.
// Supabase restituisce max 1000 righe per richiesta: con migliaia di articoli, un singolo
// .select() ne perderebbe la maggior parte. Qui si scorre finché non finiscono.
// Ritorna direttamente l'array (non {data,error}); in caso di errore lancia.
async function caricaArticoliTutti(cols, opts){
  const tabella=(opts&&opts.tabella)||"articoli";
  let out=[], from=0; const P=1000;
  for(;;){
    const {data,error}=await sb.from(tabella).select(cols).order("id").range(from,from+P-1);
    if(error) throw error;
    out=out.concat(data||[]);
    if(!data || data.length<P) break;
    from+=P;
  }
  return out;
}

function ModuloCatalogo({profilo,perm}){
  const [articoli,setArticoli]=useState(null);
  const [tot,setTot]=useState(0);
  const [pagina,setPagina]=useState(0);
  const [err,setErr]=useState("");
  const [cerca,setCerca]=useState("");
  const [cercaDeb,setCercaDeb]=useState("");
  const [filtroTipo,setFiltroTipo]=useState("");
  const [filtroCat,setFiltroCat]=useState("");
  const [soloRip,setSoloRip]=useState(false);
  const [numRip,setNumRip]=useState(0);
  const [categorie,setCategorie]=useState([]);
  const [editor,setEditor]=useState(null);
  const [showImport,setShowImport]=useState(false);
  const [fornitori,setFornitori]=useState([]);
  const [ultimoBatch,setUltimoBatch]=useState(null);
  const [info,setInfo]=useState("");   // esito dell'import: e' un avviso, non un errore
  const [dupN,setDupN]=useState(0);     // forza il remount della scheda quando si duplica
  // l'aggiornamento in blocco del catalogo (e il suo annullamento) e' riservato all'amministratore
  const isAdmin = !!(profilo && profilo.ruolo==="amministratore");
  useEffect(()=>{ if(!isAdmin) return;
    sb.from("import_batch").select("id").is("annullato_il",null)
      .order("creato_il",{ascending:false}).limit(1).maybeSingle()
      .then(({data})=>setUltimoBatch(data?data.id:null)); },[isAdmin]);

  /* La ricerca digitata aspetta 300ms prima di interrogare il DB:
     senza, ogni tasto premuto sarebbe una query. */
  useEffect(()=>{ const t=setTimeout(()=>setCercaDeb(cerca),300); return ()=>clearTimeout(t); },[cerca]);
  /* Cambiando ricerca o filtri si riparte dalla prima pagina. */
  useEffect(()=>{ setPagina(0); },[cercaDeb,filtroTipo,filtroCat,soloRip]);

  /* Dati che non dipendono dalla pagina: fornitori e categorie (dalla
     funzione categorie_articoli, non dedotte dalle righe caricate). */
  useEffect(()=>{
    sb.from("fornitori").select("id,ragione_sociale").order("ragione_sociale")
      .then(({data})=>setFornitori(data||[]));
    sb.rpc("categorie_articoli").then(({data})=>setCategorie((data||[]).map(r=>r.categoria)));
  },[]);

  const carica=useCallback(async()=>{
    setErr(""); setArticoli(null);
    /* l'ordine secondario su id evita che due articoli con lo stesso nome
       "ballino" tra una pagina e l'altra */
    let q=sb.from("articoli").select("*, articoli_fornitori(prezzo, fornitori(ragione_sociale))",{count:"exact"}).order("nome_articolo").order("id");
    if(filtroTipo) q=q.eq("tipo",filtroTipo);
    if(filtroCat)  q=q.eq("categoria",filtroCat);
    if(soloRip)    q=q.eq("da_ripristinare",true);
    const orq=filtroRicercaArticoli(cercaDeb);
    if(orq) q=q.or(orq);
    const da=pagina*ART_PER_PAGINA;
    const [a,rip]=await Promise.all([
      q.range(da,da+ART_PER_PAGINA-1),
      sb.from("articoli").select("id",{count:"exact",head:true}).eq("da_ripristinare",true),
    ]);
    if(a.error){ setErr(a.error.message); setArticoli([]); return; }
    setArticoli(a.data||[]); setTot(a.count||0); setNumRip(rip.count||0);
  },[cercaDeb,filtroTipo,filtroCat,soloRip,pagina]);
  useEffect(()=>{ carica(); },[carica]);

  const filtrati=articoli||[];
  const pagine=Math.max(1,Math.ceil(tot/ART_PER_PAGINA));
  const conFiltri=!!(cercaDeb.trim()||filtroTipo||filtroCat||soloRip);

  const euro=n=>Number(n||0).toLocaleString("it-IT",{style:"currency",currency:"EUR"});

  async function importaArticoli(righe,opt){
    setErr("");
    const {modo="solo_nuovi", nomeFile="", idByCod={}, conteggio={}, fornListino=null, rinnovo=false} = opt||{};
    const aggiorna = modo==="aggiorna" && isAdmin;

    // Smisto le righe: quelle con un codice presente UNA volta in catalogo si aggiornano,
    // quelle con codice presente PIU' volte si saltano (non si sa quale), il resto e' nuovo.
    const daIns=[], daAgg=[], saltati=new Set();
    righe.forEach(r=>{
      const dati={...r}; const forn=dati.__forn||null; delete dati.__forn;
      const c=String(dati.codice||"").trim();
      const n=c?(conteggio[c]||0):0;
      if(c && n>1){ saltati.add(c); return; }
      if(c && n===1){ if(aggiorna) daAgg.push({dati,forn,id:idByCod[c]}); return; }
      daIns.push({dati,forn});
    });

    try{
      // 1) apro il "batch": serve a poter annullare tutto in blocco
      const {data:batch,error:eb}=await sb.from("import_batch")
        .insert({file_nome:nomeFile, creato_da:profilo.id}).select("id").single();
      if(eb) throw eb;
      const backup=[];

      // 2) AGGIORNAMENTI: prima fotografo com'erano, poi scrivo
      if(daAgg.length){
        const ids=daAgg.map(x=>x.id);
        for(let i=0;i<ids.length;i+=200){
          const {data,error}=await sb.from("articoli").select("*").in("id",ids.slice(i,i+200));
          if(error) throw error;
          (data||[]).forEach(a=>backup.push({batch_id:batch.id,articolo_id:a.id,azione:"update",dati_prima:a}));
        }
        for(const x of daAgg){
          const {error}=await sb.from("articoli")
            .update({...x.dati, aggiornato_il:new Date().toISOString()}).eq("id",x.id);
          if(error) throw error;
        }
      }

      // 3) INSERIMENTI
      const nuoviIds=[];
      for(let i=0;i<daIns.length;i+=200){
        const chunk=daIns.slice(i,i+200).map(x=>({...x.dati,creato_da:profilo.id}));
        const {data,error}=await sb.from("articoli").insert(chunk).select("id");
        if(error) throw error;
        (data||[]).forEach((row,j)=>{
          const d=daIns[i+j];
          nuoviIds.push({id:row.id, forn:d.forn, codice:d.dati.codice||"", costo:Number(d.dati.costo)||0});
          backup.push({batch_id:batch.id,articolo_id:row.id,azione:"insert",dati_prima:null});
        });
      }

      // 4) salvo la copia di sicurezza
      for(let i=0;i<backup.length;i+=200){
        const {error}=await sb.from("import_backup").insert(backup.slice(i,i+200));
        if(error) throw error;
      }
      await sb.from("import_batch").update({n_inseriti:daIns.length,n_aggiornati:daAgg.length}).eq("id",batch.id);

      // 5) collegamenti col fornitore (per nuovi e aggiornati)
      const fornByNome={};
      (fornitori||[]).forEach(fo=>{ fornByNome[String(fo.ragione_sociale||"").trim().toLowerCase()]=fo.id; });
      const links=[]; const fornMancanti=new Set();
      const aggiungiLink=(artId,fo)=>{
        if(!artId||!fo) return;
        const nome=String(fo.fornitore||"").trim();
        if(!nome) return;
        const fid=fornByNome[nome.toLowerCase()];
        if(!fid){ fornMancanti.add(nome); return; }
        links.push({articolo_id:artId, fornitore_id:fid,
          codice_fornitore:fo.codice_fornitore||"", prezzo:Number(fo.prezzo_fornitore)||0});
      };
      nuoviIds.forEach(x=>aggiungiLink(x.id,x.forn));
      daAgg.forEach(x=>aggiungiLink(x.id,x.forn));
      // "Listino del fornitore": collega TUTTI gli articoli importati a quel fornitore
      // (serve al rinnovo per sapere cosa e' del fornitore). Prezzo/codice = quelli dell'articolo.
      if(fornListino){
        nuoviIds.forEach(x=>links.push({articolo_id:x.id, fornitore_id:fornListino, codice_fornitore:x.codice||"", prezzo:x.costo||0}));
        daAgg.forEach(x=>links.push({articolo_id:x.id, fornitore_id:fornListino, codice_fornitore:(x.dati.codice||""), prezzo:Number(x.dati.costo)||0}));
      }
      if(links.length){
        // sugli aggiornati tolgo il vecchio collegamento con lo stesso fornitore, per non duplicarlo
        const perForn={};
        links.forEach(l=>{ (perForn[l.fornitore_id]=perForn[l.fornitore_id]||[]).push(l.articolo_id); });
        for(const fid of Object.keys(perForn)){
          const arr=[...new Set(perForn[fid])];
          for(let i=0;i<arr.length;i+=200)
            await sb.from("articoli_fornitori").delete().eq("fornitore_id",fid).in("articolo_id",arr.slice(i,i+200));
        }
        // dedup (un articolo potrebbe avere sia il link per-riga sia quello del listino, stesso fornitore)
        const visti=new Set(), linksU=[];
        links.forEach(l=>{ const k=l.articolo_id+"|"+l.fornitore_id; if(!visti.has(k)){ visti.add(k); linksU.push(l); } });
        for(let i=0;i<linksU.length;i+=200){
          const {error}=await sb.from("articoli_fornitori").insert(linksU.slice(i,i+200));
          if(error) throw error;
        }
      }

      // RINNOVO: disattiva i fuori-listino di questo fornitore ed elimina i mai usati
      let esitoRinnovo=null;
      if(rinnovo && fornListino){
        const codiciFile=[...new Set(righe.map(r=>String(r.codice||"").trim()).filter(Boolean))];
        const {data:rr,error:er}=await sb.rpc("rinnova_listino_fornitore",{p_fornitore_id:fornListino, p_codici:codiciFile});
        if(er) throw er;
        esitoRinnovo=rr;
      }

      const msg=[];
      msg.push("✓ Importati: "+daIns.length+" nuovi"+(daAgg.length?", "+daAgg.length+" aggiornati":""));
      if(esitoRinnovo) msg.push("rinnovo: "+(esitoRinnovo.disattivati||0)+" disattivati, "+(esitoRinnovo.eliminati||0)+" eliminati");
      if(saltati.size) msg.push("⚠ saltati "+saltati.size+" codici ambigui: "+[...saltati].slice(0,10).join(", "));
      if(fornMancanti.size) msg.push("⚠ fornitori non trovati: "+[...fornMancanti].join(", "));
      setInfo(msg.join(" · "));
      setUltimoBatch(batch.id);
    }catch(ex){ setErr("Errore durante l'import: "+ex.message); }
    setShowImport(false);
    carica();
  }

  // Rimette il catalogo com'era prima dell'ultimo import non ancora annullato.
  async function annullaUltimoImport(){
    setErr("");
    const {data:b}=await sb.from("import_batch").select("*")
      .is("annullato_il",null).order("creato_il",{ascending:false}).limit(1).maybeSingle();
    if(!b){ setErr("Nessun import da annullare."); return; }
    const quando=new Date(b.creato_il).toLocaleString("it-IT");
    if(!window.confirm("Annullare l'import del "+quando+(b.file_nome?" ("+b.file_nome+")":"")+"?\n\n"+
      "• "+b.n_inseriti+" articoli inseriti verranno ELIMINATI\n"+
      "• "+b.n_aggiornati+" articoli aggiornati torneranno come prima")) return;
    try{
      const {data:bk,error}=await sb.from("import_backup").select("*").eq("batch_id",b.id);
      if(error) throw error;
      const upd=(bk||[]).filter(x=>x.azione==="update"&&x.dati_prima).map(x=>x.dati_prima);
      const ins=(bk||[]).filter(x=>x.azione==="insert").map(x=>x.articolo_id);
      for(let i=0;i<upd.length;i+=200){
        const {error:e2}=await sb.from("articoli").upsert(upd.slice(i,i+200)); if(e2) throw e2;
      }
      for(let i=0;i<ins.length;i+=200){
        const {error:e3}=await sb.from("articoli").delete().in("id",ins.slice(i,i+200)); if(e3) throw e3;
      }
      await sb.from("import_batch").update({annullato_il:new Date().toISOString()}).eq("id",b.id);
      setInfo("↩ Import annullato: ripristinati "+upd.length+" articoli, eliminati "+ins.length+".");
      setUltimoBatch(null);
    }catch(ex){ setErr("Ripristino non riuscito: "+ex.message); }
    carica();
  }

  return (
    <>
      <div className="topbar">
        <h1>Catalogo Prodotti e Servizi</h1>
        {perm.scrivi && <div style={{display:"flex",gap:8}}>
          {isAdmin && ultimoBatch &&
            <button className="btn" onClick={annullaUltimoImport}
              title="Rimette il catalogo com'era prima dell'ultimo import">↩ Annulla ultimo import</button>}
          <button className="btn" onClick={()=>setShowImport(true)}>📊 Importa Excel</button>
          <button className="btn primary" onClick={()=>setEditor({})}>+ Nuovo articolo</button>
        </div>}
      </div>
      <div className="content">
        {err && <div className="banner err">{err}</div>}
        {info && <div className="banner info" style={{display:"flex",justifyContent:"space-between",gap:12,alignItems:"flex-start"}}>
          <span>{info}</span>
          <button className="btn small" onClick={()=>setInfo("")}>Chiudi</button></div>}
        <div className="toolbar">
          <div className="search"><span className="mag">🔍</span>
            <input placeholder="Cerca per nome, codice, descrizione, categoria…" value={cerca} onChange={e=>setCerca(e.target.value)}/></div>
          <span className="muted">{tot.toLocaleString("it-IT")} articoli{conFiltri?" trovati":""}</span>
        </div>
        <div className="toolbar">
          <select className="btn" value={filtroTipo} onChange={e=>setFiltroTipo(e.target.value)} style={{maxWidth:160}}>
            <option value="">Tutti i tipi</option>
            {TIPI_ARTICOLO.map(t=><option key={t} value={t}>{t==="prodotto"?"Prodotti":"Servizi"}</option>)}
          </select>
          <select className="btn" value={filtroCat} onChange={e=>setFiltroCat(e.target.value)} style={{maxWidth:220}}>
            <option value="">Tutte le categorie</option>
            {categorie.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          <button className="btn" onClick={()=>setSoloRip(v=>!v)}
            style={soloRip?{background:"#fff4e5",borderColor:"#f0d3a0",color:"#b26a00",fontWeight:600}:{}}
            title="Mostra solo gli articoli da ripristinare">🔧 Da ripristinare{numRip>0?" ("+numRip+")":""}</button>
          <button className="btn small" onClick={()=>{setCerca("");setFiltroTipo("");setFiltroCat("");setSoloRip(false);}}>Azzera filtri</button>
        </div>

        {articoli===null ? <div className="empty">Caricamento…</div>
          : filtrati.length===0 ? <div className="card empty">{conFiltri
              ? "Nessun articolo corrisponde alla ricerca."
              : "Nessun articolo. Creane uno o importa un Excel."}</div>
          : <div className="card" style={{overflow:"auto"}}>
              <table>
                <thead><tr><th>Codice</th><th>Nome</th><th>Tipo</th><th>Categoria</th><th>Fornitore</th>
                  <th>Prezzo pubblico</th><th>Giacenza</th><th>Attivo</th></tr></thead>
                <tbody>
                  {filtrati.map(a=>
                    <tr key={a.id} onClick={()=>setEditor(a)}>
                      <td className="muted">{a.codice||"—"}</td>
                      <td className="rs">
                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                          {Array.isArray(a.foto_urls)&&a.foto_urls[0] &&
                            <img src={a.foto_urls[0]} alt="" style={{width:34,height:34,borderRadius:5,objectFit:"cover",border:"1px solid var(--line)",flexShrink:0}}/>}
                          <span>{a.nome_articolo||"—"}</span>
                          {a.da_ripristinare===true &&
                            <span className="tag" style={{background:"#fff4e5",color:"#b26a00"}} title={a.nota_ripristino||"Da ripristinare"}>🔧 da ripristinare</span>}
                        </div>
                      </td>
                      <td>{a.tipo==="servizio"
                        ? <span className="tag" style={{background:"#eef1fb",color:"#2f5bea"}}>Servizio</span>
                        : <span className="tag" style={{background:"#eef7ee",color:"#1f9c68"}}>Prodotto</span>}</td>
                      <td className="muted">{a.categoria||"—"}</td>
                      <td className="muted">{(()=>{
                        const nomi=[...new Set((a.articoli_fornitori||[]).map(x=>x.fornitori&&x.fornitori.ragione_sociale).filter(Boolean))];
                        if(!nomi.length) return "—";
                        return nomi[0]+(nomi.length>1?" +"+(nomi.length-1):"");
                      })()}</td>
                      <td>{euro(a.prezzo_pubblico)}</td>
                      <td>{a.tipo==="prodotto"
                        ? (()=>{ const g=Number(a.giacenza)||0, im=Number(a.impegnato)||0, disp=g-im;
                            const sotto=Number(a.scorta_minima)>0 && disp<Number(a.scorta_minima);
                            return <>{g}{im>0 && <span className="muted" style={{marginLeft:6,fontSize:12}}>· disp. <b style={{color:disp<0?"#c0392b":"inherit"}}>{disp}</b> <span title="impegnato in commesse">({im} imp.)</span></span>}
                              {sotto && <span className="tag" style={{background:"#fdecea",color:"#c0392b",marginLeft:6}}>sottoscorta</span>}</>;
                          })()
                        : "—"}</td>
                      <td>{a.attivo===false?<span className="tag" style={{background:"#fdf0e3",color:"#c47a1e"}}>No</span>
                        :<span className="tag" style={{background:"#e6f4ee",color:"#1f9c68"}}>Sì</span>}</td>
                    </tr>)}
                </tbody>
              </table>
            </div>}

        {pagine>1 && <div className="toolbar" style={{justifyContent:"center",gap:12,marginTop:12}}>
          <button className="btn small" disabled={pagina===0} onClick={()=>setPagina(p=>p-1)}>← Precedente</button>
          <span className="muted">Pagina {pagina+1} di {pagine.toLocaleString("it-IT")}</span>
          <button className="btn small" disabled={pagina>=pagine-1} onClick={()=>setPagina(p=>p+1)}>Successiva →</button>
        </div>}
      </div>
      {editor && <ArticoloForm key={editor.id||("n"+dupN)} articolo={editor&&(editor.id||editor._dup)?editor:null} perm={perm} profilo={profilo} fornitori={fornitori}
        onClose={()=>setEditor(null)} onSalvato={()=>{setEditor(null);carica();}}
        onDuplica={data=>{ setDupN(n=>n+1); setEditor({...data, id:undefined, _dup:true, codice:(data.codice||"")+"-COPIA"}); }}/>}
      {showImport && <ImportArticoli isAdmin={isAdmin} fornitori={fornitori} onClose={()=>setShowImport(false)} onImport={importaArticoli}/>}
    </>
  );
}

/* ------------------------------------------------ scheda articolo (nuovo/modifica) */
function ArticoloForm({articolo,perm,profilo,fornitori,onClose,onSalvato,onDuplica}){
  const nuovo=!articolo || !articolo.id;   // duplicato = precompilato ma trattato come nuovo (insert)
  const [f,setF]=useState(()=>{
    const init={};
    CAMPI_ARTICOLO.forEach(c=>{ init[c.k]= articolo ? (articolo[c.k]??"") : ""; });
    return { tipo:articolo?.tipo||"prodotto", lavorazione:articolo?.lavorazione||"",
      attivo:articolo?.attivo!==false, vendibile:articolo?.vendibile===true,
      note:articolo?.note||"",
      foto_urls:Array.isArray(articolo?.foto_urls)?articolo.foto_urls:[],
      da_ripristinare:articolo?.da_ripristinare===true,
      nota_ripristino:articolo?.nota_ripristino||"",
      peso_kg:articolo?.peso_kg ?? "", peso_um:articolo?.peso_um||"pz", peso_eccedenza_pct:articolo?.peso_eccedenza_pct ?? "", ...init };
  });
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const [upBusy,setUpBusy]=useState(false);
  const [pesoRef,setPesoRef]=useState({peso:"",L:"",H:""});
  const [fornPrezzi,setFornPrezzi]=useState([]);
  useEffect(()=>{ if(articolo?.id){ sb.from("articoli_fornitori").select("*").eq("articolo_id",articolo.id)
    .then(({data})=>setFornPrezzi((data||[]).map(x=>({...x})))); } },[articolo?.id]);
  const [catSugg,setCatSugg]=useState([]);
  useEffect(()=>{ sb.rpc("categorie_articoli").then(({data})=>setCatSugg((data||[]).map(r=>r.categoria).filter(Boolean))); },[]);
  const [prezzoKg,setPrezzoKg]=useState("");   // per calcolare il costo/foglio della carta
  const addForn=()=>setFornPrezzi(p=>[...p,{fornitore_id:"",prezzo:0,codice_fornitore:"",note:""}]);
  const setFP=(i,k,v)=>setFornPrezzi(p=>p.map((r,j)=>j===i?{...r,[k]:v}:r));
  const delFP=i=>setFornPrezzi(p=>p.filter((_,j)=>j!==i));
  const migliorForn=fornPrezzi.filter(r=>r.fornitore_id && Number(r.prezzo)>0)
    .reduce((best,r)=>(!best||Number(r.prezzo)<Number(best.prezzo))?r:best,null);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const prodotto=f.tipo==="prodotto";
  // l'unità si può cambiare solo se articolo nuovo o senza stock/impegno (altrimenti stravolge i numeri)
  const unitaSblocca = nuovo || ((Number(articolo?.giacenza)||0)===0 && (Number(articolo?.impegnato)||0)===0);
  function calcolaKgMq(){
    const p=Number(pesoRef.peso)||0, L=Number(pesoRef.L)||0, H=Number(pesoRef.H)||0;
    const mq=(L/100)*(H/100);
    if(p>0 && mq>0){ set("peso_kg",Math.round(p/mq*1000)/1000); set("peso_um","mq"); }
  }

  async function caricaFoto(e){
    const files=[...(e.target.files||[])]; e.target.value="";
    if(!files.length) return;
    setUpBusy(true); setErr("");
    try{
      const nuovi=[];
      for(const file of files){
        if(!file.type.startsWith("image/")) continue;
        const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
        const path=Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+(ext||"jpg");
        const {error}=await sb.storage.from("articoli").upload(path,file,{cacheControl:"3600",upsert:false});
        if(error) throw error;
        nuovi.push(sb.storage.from("articoli").getPublicUrl(path).data.publicUrl);
      }
      setF(p=>({...p,foto_urls:[...(p.foto_urls||[]),...nuovi]}));
    }catch(ex){ setErr("Caricamento foto: "+ex.message); }
    setUpBusy(false);
  }
  async function rimuoviFoto(url){
    setF(p=>({...p,foto_urls:(p.foto_urls||[]).filter(u=>u!==url)}));
    const parts=String(url).split("/articoli/");
    if(parts.length>1){ try{ await sb.storage.from("articoli").remove([parts[1].split("?")[0]]); }catch(e){} }
  }
  async function elimina(){
    if(!articolo?.id) return;
    if(!window.confirm("Eliminare definitivamente l'articolo \""+(f.nome_articolo||"")+"\"?")) return;
    setBusy(true); setErr("");
    try{
      const {error}=await sb.from("articoli").delete().eq("id",articolo.id);
      if(error) throw error;
      onSalvato();
    }catch(ex){
      const msg=/foreign key|violates|referenced|constraint/i.test(ex.message||"")
        ? "Non eliminabile: l'articolo è usato in preventivi, commesse o ordini. In alternativa togli la spunta \"Articolo attivo\" per nasconderlo."
        : ex.message;
      setErr(msg); setBusy(false);
    }
  }
  const campo=(k,label,style)=>(
    <div className="field" style={style}><label>{label}</label>
      <input value={f[k]||""} onChange={e=>set(k,e.target.value)}/></div>
  );

  async function salva(e){
    e.preventDefault();
    if(!String(f.nome_articolo).trim()){ setErr("Il nome articolo è obbligatorio."); return; }
    setBusy(true); setErr("");
    try{
      const rec={...f};
      CAMPI_ARTICOLO.filter(c=>c.num).forEach(c=>{ rec[c.k]=normalizzaPrezzo(rec[c.k])||0; });
      rec.peso_kg=Number(rec.peso_kg)||0; rec.peso_eccedenza_pct=Number(rec.peso_eccedenza_pct)||0;
      rec.aggiornato_il=new Date().toISOString();
      // La GIACENZA non si scrive dalla scheda: la mantiene il trigger dei movimenti di magazzino.
      // La toccano solo l'import iniziale e i carichi/scarichi. Cosi' salvare un articolo non azzera lo stock.
      delete rec.giacenza;
      // L'UNITA' e' fissa dopo la creazione: cambiarla su un articolo con stock/movimenti ne corromperebbe
      // il significato (i numeri non si convertono). Sull'esistente non la riscriviamo mai.
      if(!unitaSblocca) delete rec.unita;
      let artId=articolo?.id;
      if(nuovo){
        rec.creato_da=profilo.id;
        const {data,error}=await sb.from("articoli").insert(rec).select("id").single();
        if(error) throw error; artId=data.id;
      }else{
        const {error}=await sb.from("articoli").update(rec).eq("id",artId);
        if(error) throw error;
        await sb.from("articoli_fornitori").delete().eq("articolo_id",artId);
      }
      const fp=fornPrezzi.filter(r=>r.fornitore_id).map(r=>({articolo_id:artId, fornitore_id:r.fornitore_id,
        prezzo:Number(r.prezzo)||0, codice_fornitore:r.codice_fornitore||"",
        lead_time_giorni:r.lead_time_giorni?Number(r.lead_time_giorni):null,
        minimo_ordine:r.minimo_ordine?Number(r.minimo_ordine):null, note:r.note||""}));
      if(nuovo){ /* niente da cancellare */ }
      if(fp.length){ const {error}=await sb.from("articoli_fornitori").insert(fp); if(error) throw error; }
      onSalvato();
    }catch(ex){ setErr(ex.message); setBusy(false); }
  }

  return (
    <div className="overlay">
      <form className="modal" style={{maxWidth:880}} onClick={e=>e.stopPropagation()} onSubmit={salva}>
        <header>
          <h2>{nuovo?"Nuovo articolo":"Modifica articolo"}</h2>
          <button type="button" className="x" onClick={onClose}>×</button>
        </header>
        <div className="body">
          {err && <div className="banner err">{err}</div>}
          <div className="section">
            <h3>Tipo</h3>
            <div style={{display:"flex",gap:8}}>
              {TIPI_ARTICOLO.map(t=>
                <button type="button" key={t} className="btn small"
                  style={f.tipo===t?{background:"var(--brand)",color:"#fff",borderColor:"var(--brand)"}:{}}
                  onClick={()=>set("tipo",t)}>{t==="prodotto"?"📦 Prodotto":"🖨️ Servizio"}</button>)}
            </div>
          </div>

          <div className="section">
            <h3>Identificazione</h3>
            <div className="row">
              <div className="field" style={{maxWidth:150}}><label>Codice interno</label>
                <input value={articolo?.codice_interno||"(automatico)"} disabled
                       style={{opacity:.7,fontWeight:700}} title="Assegnato dal gestionale, non modificabile"/></div>
              {campo("codice","Codice",{maxWidth:150})}
              <div className="field" style={{flex:2}}><label>Nome articolo *</label>
                <input value={f.nome_articolo||""} onChange={e=>set("nome_articolo",e.target.value)} required/></div>
            </div>
            {campo("descrizione_articolo","Descrizione")}
            <div className="row">
              <div className="field"><label>Categoria</label>
                <input list="art-cat-sugg" value={f.categoria||""} onChange={e=>set("categoria",e.target.value)}
                       placeholder="famiglia merceologica (es. Rigidi/Forex)"/>
                <datalist id="art-cat-sugg">{catSugg.map(c=><option key={c} value={c}/>)}</datalist></div>
              {campo("settore","Settore")}
              {prodotto ? campo("articolo_padre","Articolo padre")
                : <div className="field"><label>Lavorazione</label>
                    <select value={f.lavorazione} onChange={e=>set("lavorazione",e.target.value)}>
                      <option value="">—</option>
                      {LAVORAZIONI.map(l=><option key={l} value={l}>{l}</option>)}
                    </select></div>}
            </div>
          </div>

          <div className="section">
            <h3>Prezzi e costo</h3>
            <div className="row">
              <div className="field" style={{maxWidth:240}}>
                <label>Prezzo d'acquisto €</label>
                <input type="number" step="0.01" value={f.costo||""} onChange={e=>set("costo",e.target.value)}/>
                <div className="muted" style={{fontSize:12}}>Quanto lo paghiamo NOI al fornitore (il "listino riservato"). Mai mostrato al cliente.</div>
              </div>
              {PREZZI.map(p=>
                <div className="field" key={p.k} style={{maxWidth:240}}><label>{p.label} (€)</label>
                  <input type="number" step="0.01" value={f[p.k]||""} onChange={e=>set(p.k,e.target.value)}/>
                  <div className="muted" style={{fontSize:12}}>Il prezzo di vendita, uno solo. Lo sconto del cliente si applica su questo.</div></div>)}
              {(() => { const c=Number(f.costo)||0, p=Number(f.prezzo_pubblico)||0;
                if(!(c>0 && p>0)) return null;
                const m=(p-c)/p*100;
                return <div className="field" style={{maxWidth:200,alignSelf:"flex-start"}}>
                  <label>Margine</label>
                  <div style={{fontSize:22,fontWeight:800,color:m<=0?"var(--danger)":m<20?"#b26a00":"var(--ok)"}}>{m.toFixed(1)}%</div>
                  <div className="muted" style={{fontSize:12}}>{m<=0?"⚠️ Sotto costo!":"Sconto max prima di andare sotto costo: "+m.toFixed(0)+"%"}</div>
                </div>; })()}
            </div>
            <div className="row">
              <div className="field" style={{maxWidth:200}}><label>Unità</label>
                {unitaSblocca
                  ? <><select value={f.unita||""} onChange={e=>set("unita",e.target.value)}>
                        <option value="">—</option>
                        {UNITA.map(u=><option key={u} value={u}>{u}</option>)}
                      </select>
                      {!nuovo && <div className="muted" style={{fontSize:11,marginTop:3}}>Modificabile perché la giacenza è 0. Con stock/movimenti si blocca.</div>}</>
                  : <><input value={f.unita||"—"} disabled style={{opacity:.7,fontWeight:700}}
                        title="L'unità non si cambia con giacenza/movimenti in corso: cambierebbe il significato dei numeri"/>
                      <div className="muted" style={{fontSize:11,marginTop:3}}>Bloccata: l'articolo ha giacenza/impegno. Per cambiarla, azzera lo stock.</div></>}
              </div>
              {prodotto && <div className="field" style={{maxWidth:200}}><label>Giacenza attuale{f.unita?" ("+f.unita+")":""}</label>
                <input value={nuovo? "— (si carica dai movimenti)" : (Number(articolo?.giacenza)||0)} disabled
                       style={{opacity:.7,fontWeight:700}} title="Si aggiorna dai movimenti di magazzino, non a mano"/>
                {!nuovo && <div className="muted" style={{fontSize:11,marginTop:3}}>Si aggiorna dai <b>carichi/scarichi</b> in 🏬 Magazzino</div>}</div>}
              {prodotto && <div className="field" style={{maxWidth:170}}><label>Scorta minima{f.unita?" ("+f.unita+")":""}</label>
                <input type="number" step="0.01" value={f.scorta_minima||""} onChange={e=>set("scorta_minima",e.target.value)}/>
                <div className="muted" style={{fontSize:11,marginTop:3}}>Nella stessa unità dell'articolo{f.unita?" ("+f.unita+")":""}, non in pezzi</div></div>}
            </div>
            {prodotto && f.unita==="mq" &&
              <div className="row">
                <div className="field" style={{maxWidth:200}}><label>mq per lastra intera</label>
                  <input type="number" step="0.0001" value={f.mq_per_lastra||""} onChange={e=>set("mq_per_lastra",e.target.value)}
                         placeholder="es. 6,25"/></div>
                <div className="field" style={{alignSelf:"flex-end"}}>
                  <div className="muted" style={{fontSize:12,marginBottom:12}}>
                    {Number(f.mq_per_lastra)>0
                      ? "Es. lastra 305×205 cm = 6,25 mq. Giacenza attuale ≈ "+(Math.round((Number(f.giacenza)||0)/Number(f.mq_per_lastra)*10)/10)+" lastre. Così potrai caricare/scaricare a lastre."
                      : "Compilalo per i materiali in lastre: la giacenza resta in mq ma potrai contare e caricare a lastre intere."}
                  </div>
                </div>
              </div>}
            {prodotto && String(f.unita||"").indexOf("foglio")===0 && (()=>{
              const pf=pesoFoglioKg(f); const fpk=pf>0?1/pf:0;
              const costoFg=pf>0 && Number(prezzoKg)>0 ? pf*Number(prezzoKg) : 0;
              return <div className="card" style={{padding:12,background:"#fafbfc",marginTop:4}}>
                <div className="muted" style={{fontSize:12,marginBottom:8}}>🗞️ <b>Carta a foglio</b>: la compri a kg/pacco/foglio ma la usi e preventivi a <b>foglio</b>. Inserisci formato e grammatura → il sistema calcola peso e costo per foglio, e converte i carichi in fogli.</div>
                <div className="row">
                  <div className="field" style={{maxWidth:140}}><label>Grammatura (g/m²)</label>
                    <input type="number" step="1" value={f.grammatura||""} onChange={e=>set("grammatura",e.target.value)} placeholder="es. 100"/></div>
                  <div className="field" style={{maxWidth:130}}><label>Formato L (cm)</label>
                    <input type="number" step="0.1" value={f.formato_l||""} onChange={e=>set("formato_l",e.target.value)} placeholder="es. 70"/></div>
                  <div className="field" style={{maxWidth:130}}><label>Formato H (cm)</label>
                    <input type="number" step="0.1" value={f.formato_h||""} onChange={e=>set("formato_h",e.target.value)} placeholder="es. 100"/></div>
                  <div className="field" style={{maxWidth:230}}><label>Fogli per pacco</label>
                    <input type="number" step="1" value={f.fogli_per_pacco||""} onChange={e=>set("fogli_per_pacco",e.target.value)} placeholder="es. 100"/>
                    <div style={{display:"flex",gap:4,marginTop:4,flexWrap:"wrap"}}>
                      {[100,125,250,500,1000].map(n=>
                        <button type="button" key={n} className="btn small" style={{padding:"2px 8px",fontSize:11,...(Number(f.fogli_per_pacco)===n?{background:"var(--brand)",color:"#fff",borderColor:"var(--brand)"}:{})}}
                          onClick={()=>set("fogli_per_pacco",n)}>{n}</button>)}
                    </div></div>
                </div>
                {pf>0 && <div className="muted" style={{fontSize:12,marginBottom:8}}>Peso per foglio: <b>{(Math.round(pf*10000)/10000)} kg</b> · Fogli per kg: <b>{Math.round(fpk*10)/10}</b>{Number(f.fogli_per_pacco)>0?" · 1 pacco = "+Number(f.fogli_per_pacco)+" fogli":""}</div>}
                <div className="row" style={{alignItems:"flex-end"}}>
                  <div className="field" style={{maxWidth:160}}><label>Prezzo al kg (€/kg)</label>
                    <input type="number" step="0.01" value={prezzoKg} onChange={e=>setPrezzoKg(e.target.value)} placeholder="prezzo d'acquisto"/></div>
                  <div className="field" style={{alignSelf:"flex-end",marginBottom:4}}>
                    <button type="button" className="btn small" disabled={!(costoFg>0)}
                      onClick={()=>set("costo",Math.round(costoFg*10000)/10000)}>→ calcola costo/foglio {costoFg>0?"("+eur(costoFg)+")":""}</button>
                  </div>
                </div>
                <div className="muted" style={{fontSize:11}}>Il pulsante imposta il <b>Prezzo d'acquisto</b> (per foglio) = prezzo/kg × peso/foglio. Poi puoi ritoccarlo a mano.</div>
              </div>; })()}
          </div>

          {prodotto && <>
            <div className="section">
              <h3>Caratteristiche</h3>
              <div className="row">
                {campo("dimensione_articolo","Dimensione")}
                {campo("materiale_articolo","Materiale")}
              </div>
              <div className="row">
                {campo("colore_articolo","Colore")}
                {campo("deco_colore_articolo","Deco colore")}
                {campo("taglia_articolo","Taglia")}
              </div>
            </div>
            <div className="section">
              <h3>Imballo (carton)</h3>
              <div className="row">
                {campo("dimensione_1_carton","Dim. 1")}
                {campo("dimensione_2_carton","Dim. 2")}
                {campo("dimensione_3_carton","Dim. 3")}
                {campo("volume_carton","Volume")}
              </div>
              <div className="row">
                {campo("inner_carton","Inner")}
                {campo("box_carton","Box")}
                {campo("export_carton","Export")}
              </div>
            </div>
            <div className="section">
              <h3>Media</h3>
              <CampoLink label="Link foto" value={f.link_foto} onChange={v=>set("link_foto",v)}/>
              <CampoLink label="Foto" value={f.foto} onChange={v=>set("foto",v)}/>
              {campo("catalogo","Catalogo")}
            </div>
          </>}

          <div className="section">
            <h3>Peso e spedizione</h3>
            <div className="muted" style={{fontSize:12,marginBottom:10}}>Serve al calcolo delle spese di trasporto. Indica il peso e come <b>scala</b> (a pezzo, a m², a metro lineare) + un'eventuale eccedenza %.</div>
            <div className="row">
              <div className="field" style={{maxWidth:160}}><label>Peso</label>
                <input type="number" step="0.001" value={f.peso_um==="kg"?"":f.peso_kg} disabled={f.peso_um==="kg"}
                       onChange={e=>set("peso_kg",e.target.value)}
                       style={f.peso_um==="kg"?{opacity:.5}:{}} placeholder={f.peso_um==="kg"?"non serve":""}/></div>
              <div className="field" style={{maxWidth:230}}><label>Unità di peso</label>
                <select value={f.peso_um} onChange={e=>set("peso_um",e.target.value)}>
                  {PESO_UM.map(x=><option key={x.v} value={x.v}>{x.l}</option>)}
                </select></div>
              <div className="field" style={{maxWidth:150}}><label>Eccedenza %</label>
                <input type="number" step="0.1" value={f.peso_eccedenza_pct} onChange={e=>set("peso_eccedenza_pct",e.target.value)}/></div>
            </div>
            {f.peso_um==="kg" && <div className="muted" style={{fontSize:12,marginTop:-4,marginBottom:6}}>Con <b>"a peso"</b> il peso spedito = <b>quantità ordinata</b> (già in kg). Il campo Peso non serve; l'Eccedenza % vale comunque.</div>}
            <div className="card" style={{padding:12,background:"#fafbfc"}}>
              <div className="muted" style={{fontSize:12,marginBottom:6}}>Aiutino: ricava i <b>kg/m²</b> da un pezzo di riferimento (es. un 300×200 cm che pesa 50 kg → 8,33 kg/m²).</div>
              <div className="row" style={{alignItems:"flex-end"}}>
                <div className="field" style={{maxWidth:130}}><label>Peso rif. (kg)</label>
                  <input type="number" step="0.01" value={pesoRef.peso} onChange={e=>setPesoRef(p=>({...p,peso:e.target.value}))}/></div>
                <div className="field" style={{maxWidth:120}}><label>Largh. (cm)</label>
                  <input type="number" step="0.1" value={pesoRef.L} onChange={e=>setPesoRef(p=>({...p,L:e.target.value}))}/></div>
                <div className="field" style={{maxWidth:120}}><label>Alt. (cm)</label>
                  <input type="number" step="0.1" value={pesoRef.H} onChange={e=>setPesoRef(p=>({...p,H:e.target.value}))}/></div>
                <button type="button" className="btn small" onClick={calcolaKgMq}>→ Imposta kg/m²</button>
              </div>
            </div>
          </div>

          <div className="section">
            <h3>Fornitori e prezzi d'acquisto</h3>
            <div className="muted" style={{fontSize:12,marginBottom:10}}>Chi vende questo articolo e a quanto. Il più economico viene evidenziato ★ e sarà usato dal generatore ordini da commessa.</div>
            {fornPrezzi.length===0 && <div className="muted" style={{fontSize:13,marginBottom:8}}>Nessun fornitore associato.</div>}
            {fornPrezzi.map((r,i)=>{
              const best=migliorForn && migliorForn===r;
              return <div className="row" key={i} style={{alignItems:"flex-end"}}>
                <div className="field" style={{flex:2}}><label>Fornitore {best&&<span style={{color:"var(--ok)",fontWeight:700}}>★ miglior prezzo</span>}</label>
                  <select value={r.fornitore_id} onChange={e=>setFP(i,"fornitore_id",e.target.value)}>
                    <option value="">— scegli —</option>
                    {(fornitori||[]).map(fo=><option key={fo.id} value={fo.id}>{fo.ragione_sociale}</option>)}
                  </select></div>
                <div className="field" style={{maxWidth:130}}><label>Prezzo €</label>
                  <input type="number" step="0.01" value={r.prezzo} onChange={e=>setFP(i,"prezzo",e.target.value)}
                    style={best?{borderColor:"var(--ok)",fontWeight:700}:{}}/></div>
                <div className="field" style={{maxWidth:150}}><label>Cod. fornitore</label>
                  <input value={r.codice_fornitore||""} onChange={e=>setFP(i,"codice_fornitore",e.target.value)}/></div>
                <div className="field" style={{maxWidth:110}}><label>Consegna gg</label>
                  <input type="number" value={r.lead_time_giorni||""} onChange={e=>setFP(i,"lead_time_giorni",e.target.value)}/></div>
                <button type="button" className="btn small danger" style={{marginBottom:4}} onClick={()=>delFP(i)}>✕</button>
              </div>;
            })}
            <button type="button" className="btn small" style={{marginTop:6}} onClick={addForn}>+ Aggiungi fornitore</button>
          </div>

          <div className="section">
            <h3>📷 Foto dell'articolo</h3>
            <div style={{display:"flex",flexWrap:"wrap",gap:10,alignItems:"flex-start"}}>
              {(f.foto_urls||[]).map(url=>(
                <div key={url} style={{position:"relative",width:96,height:96,borderRadius:8,overflow:"hidden",border:"1px solid var(--line)"}}>
                  <a href={url} target="_blank" rel="noopener noreferrer">
                    <img src={url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/></a>
                  {perm.scrivi && <button type="button" title="Rimuovi foto" onClick={()=>rimuoviFoto(url)}
                    style={{position:"absolute",top:2,right:2,width:22,height:22,borderRadius:"50%",border:0,
                      background:"rgba(192,57,43,.92)",color:"#fff",cursor:"pointer",lineHeight:1,fontSize:13}}>×</button>}
                </div>
              ))}
              {perm.scrivi &&
                <label style={{width:96,height:96,borderRadius:8,border:"2px dashed var(--line)",display:"flex",
                  flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",color:"#888",fontSize:12,textAlign:"center"}}>
                  {upBusy? <span className="spin"/> : <><span style={{fontSize:22}}>＋</span>Aggiungi foto</>}
