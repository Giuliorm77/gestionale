              <table>
                <thead><tr>
                  <th>Materiale</th><th style={{width:90}}>Q.tà</th><th style={{width:70}}>Unità</th>
                  <th style={{width:110}}>Giacenza</th><th style={{width:120}}>Stato</th><th></th>
                </tr></thead>
                <tbody>
                  {consumi.length===0 && <tr><td colSpan={6} className="muted" style={{padding:14}}>Nessun materiale. Usa “Proponi dal preventivo” o cerca un articolo qui sotto.</td></tr>}
                  {consumi.map((c,i)=>{
                    const g=c.articolo_id!=null && giac[c.articolo_id]!=null ? giac[c.articolo_id] : null;
                    const insuff=!c.scaricato && g!=null && g < (Number(c.quantita)||0);
                    return (
                      <tr key={i} style={c.scaricato?{background:"#f3faf6"}:null}>
                        <td style={{minWidth:200}}>{c.descrizione||(artMap[c.articolo_id]&&artMap[c.articolo_id].nome_articolo)||"—"}</td>
                        <td>{c.scaricato
                          ? <span style={{fontWeight:600}}>{Number(c.quantita)||0}</span>
                          : <input type="number" step="0.01" value={c.quantita} onChange={e=>setConsumo(i,"quantita",e.target.value)}
                              style={{width:80,padding:"6px",border:"1px solid var(--line)",borderRadius:7,textAlign:"right"}}/>}</td>
                        <td className="muted">{c.unita||"—"}</td>
                        <td style={insuff?{color:"var(--danger)",fontWeight:700}:{color:"#555"}}>{g==null?"—":g}{insuff?" ⚠":""}</td>
                        <td>{c.scaricato
                          ? <span className="tag" style={{background:"#e6f4ee",color:"#1f9c68"}}>Scaricato</span>
                          : <span className="tag" style={{background:"#eef1f5",color:"#697386"}}>Da scaricare</span>}</td>
                        <td style={{whiteSpace:"nowrap"}}>{c.scaricato
                          ? <button type="button" className="btn small" onClick={()=>stornaConsumo(i)} disabled={busy} title="Annulla lo scarico e ripristina la giacenza">↩ Storna</button>
                          : <button type="button" className="btn small danger" onClick={()=>delConsumo(i)}>✕</button>}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <div style={{marginTop:8,position:"relative"}}>
              <input value={cercaArt} onChange={e=>setCercaArt(e.target.value)} placeholder="+ Aggiungi materiale: cerca articolo dal catalogo…"
                style={{width:"100%",maxWidth:440,padding:"8px 10px",border:"1px solid var(--line)",borderRadius:8}}/>
              {risArt.length>0 &&
                <div className="card" style={{maxWidth:440,maxHeight:200,overflow:"auto",position:"absolute",zIndex:5,background:"#fff"}}>
                  {risArt.map(a=>
                    <div key={a.id} onClick={()=>addConsumoArt(a)} style={{padding:"8px 12px",borderBottom:"1px solid var(--line)",cursor:"pointer"}}>
                      <b>{a.nome_articolo}</b> <span className="muted">{a.codice}</span>
                      <span className="muted" style={{float:"right"}}>giac. {Number(a.giacenza)||0}</span>
                    </div>)}
                </div>}
            </div>
          </div>}

          <div className="section">
            <h3>Fasi di lavorazione</h3>
            <div className="muted" style={{fontSize:12,marginBottom:10}}>
              Avanzamento: <b>{fatte}/{fasi.length}</b> fasi fatte · Ore previste <b>{orePrevTot}</b> · Ore effettive <b>{oreEffTot}</b>
            </div>
            {fasi.length===0 && <div className="card empty" style={{marginBottom:10}}>Nessuna fase. Aggiungine una qui sotto (di solito arrivano dal preventivo).</div>}
            {fasi.map((fa,i)=>{
              const est=!!fa.esterna;
              const statiFa=est?STATI_FASE_ESTERNA:STATI_FASE;
              const st=statiFa[fa.stato]||(est?STATI_FASE_ESTERNA.da_inviare:STATI_FASE.da_fare);
              const liberi=operatori.filter(o=>!(fa.operatori||[]).some(x=>x.id===o.id));
              return (
                <div key={i} className="card" style={{padding:12,marginBottom:10,borderLeft:"4px solid "+st.c}}>
                  <div className="row" style={{alignItems:"flex-end"}}>
                    <div className="field" style={{maxWidth:180}}><label>{est?"Lavorazione":"Reparto / lavorazione"}</label>
                      <input value={fa.reparto} onChange={e=>setFase(i,"reparto",e.target.value)}/></div>
                    <div className="field" style={{flex:2}}><label>Descrizione</label>
                      <input value={fa.descrizione} onChange={e=>setFase(i,"descrizione",e.target.value)}/></div>
                    <div className="field" style={{maxWidth:150}}><label>Stato</label>
                      <select value={fa.stato} onChange={e=>setFase(i,"stato",e.target.value)}>
                        {Object.keys(statiFa).map(s=><option key={s} value={s}>{statiFa[s].l}</option>)}
                      </select></div>
                    {!est && <div className="field" style={{maxWidth:100}}><label>Ore prev.</label>
                      <input type="number" step="0.5" value={fa.ore_previste} onChange={e=>setFase(i,"ore_previste",e.target.value)} style={numIn}/></div>}
                    {!est && <div className="field" style={{maxWidth:100}}><label>Q.tà lavorata</label>
                      <input type="number" step="0.01" value={fa.quantita_lavorata||""} onChange={e=>setFase(i,"quantita_lavorata",e.target.value)} style={numIn} title="Quanto ha lavorato il reparto (mq, battute…)"/></div>}
                    {!est && <div className="field" style={{maxWidth:70}}><label>Unità</label>
                      <input value={fa.unita_lavorata||""} onChange={e=>setFase(i,"unita_lavorata",e.target.value)} placeholder="mq" style={{width:60,padding:"6px",border:"1px solid var(--line)",borderRadius:7}}/></div>}
                    <button type="button" className="btn small danger" style={{marginBottom:4}} onClick={()=>delFase(i)} title="Elimina fase">✕</button>
                  </div>
                  <label style={{display:"inline-flex",alignItems:"center",gap:6,marginTop:8,fontSize:13,cursor:"pointer"}}>
                    <input type="checkbox" checked={est} onChange={e=>{ const v=e.target.checked; setFase(i,"esterna",v); setFase(i,"stato",v?"da_inviare":"da_fare"); }}/>
                    🔗 Lavorazione esterna (conto terzi)
                  </label>
                  {est
                    ? <div className="row" style={{marginTop:6,alignItems:"flex-end"}}>
                        <div className="field" style={{minWidth:170,flex:1}}><label>Terzista (fornitore)</label>
                          <select value={fa.fornitore_id||""} onChange={e=>{ const fo=(fornitori||[]).find(x=>x.id===e.target.value); setFase(i,"fornitore_id",e.target.value); setFase(i,"fornitore_nome",fo?fo.ragione_sociale:""); }}>
                            <option value="">— scegli —</option>
                            {(fornitori||[]).map(fo=><option key={fo.id} value={fo.id}>{fo.ragione_sociale}</option>)}
                          </select></div>
                        {perm.economici && <div className="field" style={{maxWidth:110}}><label>Costo prev. €</label>
                          <input type="number" step="0.01" value={fa.costo_previsto||""} onChange={e=>setFase(i,"costo_previsto",e.target.value)} style={numIn}/></div>}
                        {perm.economici && <div className="field" style={{maxWidth:110}}><label>Costo reale €</label>
                          <input type="number" step="0.01" value={fa.costo_reale||""} onChange={e=>setFase(i,"costo_reale",e.target.value)} style={numIn}/></div>}
                        <div className="field" style={{maxWidth:150}}><label>Inviato il</label>
                          <input type="date" value={fa.data_invio||""} onChange={e=>setFase(i,"data_invio",e.target.value)}/></div>
                        <div className="field" style={{maxWidth:150}}><label>Rientro previsto</label>
                          <input type="date" value={fa.data_rientro_prevista||""} onChange={e=>setFase(i,"data_rientro_prevista",e.target.value)}/></div>
                        <div className="field" style={{maxWidth:150}}><label>Rientrato il</label>
                          <input type="date" value={fa.data_rientro||""} onChange={e=>setFase(i,"data_rientro",e.target.value)}/></div>
                      </div>
                    : <div style={{marginTop:8}}>
                        <label className="muted" style={{fontSize:11,textTransform:"uppercase",letterSpacing:".05em"}}>Operatori &amp; ore effettive</label>
                        <div style={{display:"flex",flexWrap:"wrap",gap:8,alignItems:"center",marginTop:5}}>
                          {(fa.operatori||[]).map(o=>(
                            <span key={o.id} style={{display:"inline-flex",alignItems:"center",gap:6,background:"#f5f7fb",border:"1px solid var(--line)",borderRadius:20,padding:"4px 6px 4px 12px"}}>
                              {o.nome}
                              <input type="number" step="0.5" value={o.ore} onChange={e=>setOpOre(i,o.id,e.target.value)}
                                style={{width:56,padding:"3px 6px",border:"1px solid var(--line)",borderRadius:6,textAlign:"right"}}/>
                              <span className="muted" style={{fontSize:12}}>h</span>
                              <button type="button" className="btn small danger" onClick={()=>delOpFase(i,o.id)} style={{padding:"2px 7px"}}>✕</button>
                            </span>
                          ))}
                          {liberi.length>0 &&
                            <select value="" onChange={e=>{ if(e.target.value) addOpFase(i,e.target.value); }}
                              style={{padding:"6px",border:"1px dashed var(--line)",borderRadius:20,background:"#fff"}}>
                              <option value="">+ operatore…</option>
                              {liberi.map(o=><option key={o.id} value={o.id}>{o.nome}</option>)}
                            </select>}
                          <span className="muted" style={{fontSize:12,marginLeft:"auto"}}>tot. {oreFase(fa)} h</span>
                        </div>
                      </div>}
                </div>
              );
            })}
            <button type="button" className="btn small primary" onClick={addFase}>+ Aggiungi fase</button>
          </div>

          {/* Chi ha partecipato: visibile ai ruoli economici (amministratore + commerciale),
              così il commerciale vede gli stessi dettagli dell'amministratore sulla commessa. */}
          {!nuova && perm.economici && partecipanti.length>0 &&
            <div className="section">
              <h3>Chi ci ha lavorato</h3>
              <div className="muted" style={{fontSize:12,marginBottom:8}}>
                Ore <b>cronometrate</b> = sessioni avvio/stop dalla Postazione. Ore <b>a mano</b> = scritte nelle fasi o negli aiuti,
                senza orario. Chi lavora in un reparto che non usa la Postazione compare qui solo con le ore a mano.
              </div>
              <div style={{overflow:"auto"}}>
                <table>
                  <thead><tr><th>Persona</th><th>Reparti</th><th style={{textAlign:"right"}}>Sessioni</th>
                    <th style={{textAlign:"right"}}>Ore cronometrate</th><th style={{textAlign:"right"}}>Ore a mano</th>
                    <th style={{textAlign:"right"}}>Totale ore</th><th>Periodo</th></tr></thead>
                  <tbody>
                    {partecipanti.map(p=>
                      <tr key={p.nome}>
                        <td className="rs">{p.nome}{p.inCorso && <span className="tag" style={{background:"#e6f4ee",color:"#1f9c68",marginLeft:6}}>al lavoro ora</span>}</td>
                        <td className="muted" style={{fontSize:12}}>{p.reparti.join(", ")||"—"}</td>
                        <td style={{textAlign:"right"}}>{p.sessioni||"—"}</td>
                        <td style={{textAlign:"right"}} title={p.oreCrono?p.oreCrono.toFixed(3)+" h":""}>{durataOre(p.oreCrono)}</td>
                        <td style={{textAlign:"right"}}>{(p.oreMano+p.oreAiuto)? (p.oreMano+p.oreAiuto).toFixed(2):"—"}</td>
                        <td style={{textAlign:"right",fontWeight:700}}>{p.ore.toFixed(2)}</td>
                        <td className="muted" style={{fontSize:12}}>{p.dal
                          ? new Date(p.dal).toLocaleDateString("it-IT")+(p.al&&new Date(p.al).toDateString()!==new Date(p.dal).toDateString()
                              ? " → "+new Date(p.al).toLocaleDateString("it-IT"):"")
                          : "—"}</td>
                      </tr>)}
                  </tbody>
                </table>
              </div>
            </div>}

          <div className="section">
            <h3>Aiuti imprevisti in produzione</h3>
            <div className="muted" style={{fontSize:12,marginBottom:8}}>Quando qualcuno (es. un impiegato) viene chiamato al volo ad aiutare in produzione: registra chi, quante ore e una nota. Diventa un <b>costo imprevisto</b> della commessa e finisce nel Report.</div>
            {aiuti.length===0 && <div className="muted" style={{fontSize:13,marginBottom:8}}>Nessun aiuto registrato.</div>}
            {aiuti.map((a,i)=>
              <div className="row" key={i} style={{alignItems:"flex-end"}}>
                <div className="field" style={{flex:2}}><label>Chi</label>
                  <select value={a.operatore_id} onChange={e=>setAiuto(i,"operatore_id",e.target.value)}>
                    <option value="">— scegli —</option>
                    {(operatori||[]).map(o=><option key={o.id} value={o.id}>{o.nome}</option>)}
                  </select></div>
                <div className="field" style={{maxWidth:90}}><label>Ore</label>
                  <input type="number" step="0.25" value={a.ore} onChange={e=>setAiuto(i,"ore",e.target.value)}/></div>
                <div className="field" style={{maxWidth:160}}><label>Data</label>
                  <input type="date" value={a.data||""} onChange={e=>setAiuto(i,"data",e.target.value)}/></div>
                <div className="field" style={{flex:2}}><label>Nota</label>
                  <input value={a.nota||""} onChange={e=>setAiuto(i,"nota",e.target.value)} placeholder="es. urgenza consegna, macchina in blocco…"/></div>
                <button type="button" className="btn small danger" style={{marginBottom:4}} onClick={()=>delAiuto(i)}>✕</button>
              </div>)}
            <button type="button" className="btn small" style={{marginTop:6}} onClick={addAiuto}>+ Aggiungi aiuto</button>
            {perm.economici && aiuti.length>0 && <div className="muted" style={{fontSize:12,marginTop:8}}>Ore imprevisto totali: <b>{aiuti.reduce((s,a)=>s+(Number(a.ore)||0),0)}</b> · Costo imprevisto: <b style={{color:"var(--danger)"}}>{eur(costoAiuti)}</b></div>}
          </div>

          <div className="section">
            <h3>Straordinario</h3>
            <div className="muted" style={{fontSize:12,marginBottom:8}}>Ore di straordinario per <b>persona e data</b> (per la busta paga di fine mese). Costate <b>€{COSTO_STRAORDINARIO}/h</b> nel consuntivo, e raggruppate nel <b>Report</b> per operatore/mese.</div>
            {straordinari.length===0 && <div className="muted" style={{fontSize:13,marginBottom:8}}>Nessuno straordinario registrato.</div>}
            {straordinari.map((a,i)=>
              <div className="row" key={i} style={{alignItems:"flex-end"}}>
                <div className="field" style={{flex:2}}><label>Chi</label>
                  <select value={a.operatore_id} onChange={e=>setStraord(i,"operatore_id",e.target.value)}>
                    <option value="">— scegli —</option>
                    {(operatori||[]).map(o=><option key={o.id} value={o.id}>{o.nome}</option>)}
                  </select></div>
                <div className="field" style={{maxWidth:90}}><label>Ore</label>
                  <input type="number" step="0.25" value={a.ore} onChange={e=>setStraord(i,"ore",e.target.value)}/></div>
                <div className="field" style={{maxWidth:160}}><label>Data</label>
                  <input type="date" value={a.data||""} onChange={e=>setStraord(i,"data",e.target.value)}/></div>
                <button type="button" className="btn small danger" style={{marginBottom:4}} onClick={()=>delStraord(i)}>✕</button>
                <div className="field" style={{flex:1,minWidth:"100%"}}><label>Motivo</label>
                  <input value={a.motivo||""} onChange={e=>setStraord(i,"motivo",e.target.value)} placeholder="perché è stato fatto lo straordinario (es. consegna urgente, ristampa…)"/></div>
              </div>)}
            <button type="button" className="btn small" style={{marginTop:6}} onClick={addStraord}>+ Aggiungi straordinario</button>
            {straordinari.length>0 && <div className="muted" style={{fontSize:12,marginTop:8}}>Ore straordinario totali: <b>{oreStraordTot}</b> · Costo: <b>{eur(costoStraordinario)}</b></div>}
          </div>

          {perm.economici && <div className="section">
            <h3>Spedizione</h3>
            <div className="row">
              <div className="field" style={{maxWidth:240}}><label>Trasporto €</label>
                <div style={{display:"flex",gap:6}}>
                  <input type="number" step="0.01" value={f.trasporto} onChange={e=>set("trasporto",e.target.value)} style={{flex:1}}/>
                  <button type="button" className="btn small" title="Calcola dal listino corriere (peso reale della commessa)" onClick={()=>setTrasportoOpen(true)}>🚚</button>
                </div></div>
            </div>
            {trasportoOpen && <CalcolatoreTrasporto corrieri={corrieri} articoli={articoli} righe={righe}
              onClose={()=>setTrasportoOpen(false)}
              onApply={(costo)=>{ set("trasporto",Math.round(costo*100)/100); setTrasportoOpen(false); }}/>}
          </div>}

          {perm.economici && !nuova && <div className="section">
            <h3>Rilavorazioni / Post-vendita</h3>
            <div className="muted" style={{fontSize:12,marginBottom:8}}>Resi e sistemazioni (anche a commessa chiusa): costi e addebiti collegati a questa commessa.</div>
            {interventi.length===0 && <div className="muted" style={{fontSize:13,marginBottom:8}}>Nessuna rilavorazione.</div>}
            {interventi.map(it=>{
              const costo=(it.interventi_righe||[]).reduce((s,r)=>s+(Number(r.quantita)||0)*(Number(r.costo_unitario)||0),0);
              const add=(it.interventi_righe||[]).filter(r=>r.responsabilita==="cliente").reduce((s,r)=>s+(Number(r.quantita)||0)*(Number(r.prezzo_addebito)||0),0);
              return <div key={it.id} className="subrow" style={{cursor:"pointer"}} onClick={()=>setIntEditor(it)}>
                <div style={{display:"flex",justifyContent:"space-between",gap:10,flexWrap:"wrap"}}>
                  <span><b>{it.numero||"—"}</b>{it.data?" · "+new Date(it.data).toLocaleDateString("it-IT"):""}{it.motivo?" · "+it.motivo:""}</span>
                  <span className="muted">costo {eur(costo)} · addebito <b style={{color:"var(--ok)"}}>{eur(add)}</b></span>
                </div></div>;
            })}
            <button type="button" className="btn small primary" style={{marginTop:6}} onClick={()=>setIntEditor({})}>+ Nuova rilavorazione</button>
          </div>}

          {perm.economici && <div className="card" style={{padding:16,background:"#fafbfc"}}>
            <h3 style={{marginTop:0,marginBottom:10}}>Consuntivo reale</h3>
            <div className="kv" style={{gridTemplateColumns:"1fr auto"}}>
              <span className="k">Ricavi (valore commessa{addebitiInterventi>0?" + addebiti":""})</span><span style={{textAlign:"right"}}>{eur(ricaviTot)}</span>
              <span className="k">Costo materiali</span><span style={{textAlign:"right"}}>{eur(costoMateriali)}</span>
              <span className="k">Costo manodopera</span><span style={{textAlign:"right"}}>{eur(costoManodopera)}</span>
              <span className="k">Trasporto</span><span style={{textAlign:"right"}}>{eur(Number(f.trasporto)||0)}</span>
              {costoEsterno>0 && <><span className="k">Lavorazioni esterne (conto terzi)</span><span style={{textAlign:"right"}}>{eur(costoEsterno)}</span></>}
              {costoStraordinario>0 && <><span className="k">Straordinario ({oreStraordTot} h × €{COSTO_STRAORDINARIO})</span><span style={{textAlign:"right"}}>{eur(costoStraordinario)}</span></>}
              {costoAiuti>0 && <><span className="k" style={{color:"var(--danger)"}}>Costi imprevisti (aiuti produzione)</span><span style={{textAlign:"right",color:"var(--danger)"}}>{eur(costoAiuti)}</span></>}
              {costoPerdite>0 && <><span className="k" style={{color:"var(--danger)"}}>Perdite materiale (pezzi persi)</span><span style={{textAlign:"right",color:"var(--danger)"}}>{eur(costoPerdite)}</span></>}
              {costoInterventi>0 && <><span className="k">Costo rilavorazioni</span><span style={{textAlign:"right"}}>{eur(costoInterventi)}</span></>}
              <span className="k" style={{fontWeight:800}}>MARGINE REALE</span><span style={{textAlign:"right",fontWeight:800,fontSize:16,color:margineReale>=0?"var(--ok)":"var(--danger)"}}>{eur(margineReale)}</span>
            </div>
            <div className="muted" style={{fontSize:11,marginTop:8}}>Costi materiali/manodopera dai costi di catalogo e costi orari operatori. Le rilavorazioni "a nostro carico" riducono il margine; quelle "a carico cliente" rientrano nei ricavi.</div>
          </div>}

          <div className="section">
            <h3>Note</h3>
            <div className="field"><textarea rows={2} value={f.note} onChange={e=>set("note",e.target.value)} placeholder="Note di produzione, indicazioni per i reparti…"/></div>
          </div>
        </div>
        <footer>
          <button type="button" className="btn" onClick={stampaScheda} title="Stampa la scheda di lavorazione per il reparto">🖨️ Scheda</button>
          {!nuova && perm.magazzino &&
            <button type="button" className="btn" onClick={()=>setDdtOpen(true)}
              title="Genera un documento di trasporto con gli articoli pronti di questa commessa">📄 Genera DDT</button>}
          {!nuova && perm.economici &&
            <button type="button" className="btn" onClick={generaConsuntivo} disabled={busy}
              title="Crea un preventivo (bozza) con i materiali scaricati e le ore reali per reparto, da rivedere e inviare">📄 Genera consuntivo</button>}
          {!nuova && perm.elimina &&
            <button type="button" className="btn danger" onClick={elimina} disabled={busy}>Elimina</button>}
          <button type="button" className="btn" style={{marginLeft:"auto"}} onClick={onClose}>Annulla</button>
          <button className="btn primary" disabled={busy}>{busy?<span className="spin"/>:"Salva commessa"}</button>
        </footer>
      </form>
      {intEditor && <InterventoEditor intervento={intEditor.id?intEditor:null} commessa={commessa} profilo={profilo} perm={perm}
        articoli={articoli} operatori={operatori}
        numeroSuggerito={"R-"+(f.numero||commessa?.numero||"")+"-"+(interventi.length+1)}
        onClose={()=>setIntEditor(null)}
        onSalvato={()=>{setIntEditor(null);caricaInterventi();}}/>}
      {ddtOpen && <DDTEditor commessaId={commessa.id} profilo={profilo} perm={perm}
        onClose={()=>setDdtOpen(false)} onSalvato={()=>setDdtOpen(false)}/>}
    </div>
  );
}

/* ================================================================ ORDINI A FORNITORI (acquisti) */
const STATI_OF = {
  bozza:{l:"Bozza",bg:"#eef1f5",c:"#697386"},
  inviato:{l:"Inviato",bg:"#eef4ff",c:"#1e46c4"},
  confermato:{l:"Confermato",bg:"#fff4e5",c:"#b26a00"},
  ricevuto_parziale:{l:"Ricevuto parz.",bg:"#fff4e5",c:"#b26a00"},
  ricevuto:{l:"Ricevuto",bg:"#e6f4ee",c:"#1f9c68"},
  annullato:{l:"Annullato",bg:"#fdecea",c:"#c0392b"}};
function prossimoNumeroOF(ordini){
  const anno=new Date().getFullYear();
  const n=(ordini||[]).filter(o=>String(o.numero||"").startsWith("OF-"+anno+"-")).length+1;
  return "OF-"+anno+"-"+String(n).padStart(4,"0");
}

  let tot=0;

.forn .lbl{font-size:11px;text-transform:uppercase;color:#888;letter-spacing:.05em}.forn .nm{font-weight:bold;font-size:16px}
table.g{width:100%;border-collapse:collapse}
table.g th{background:#1d2430;color:#fff;text-align:left;padding:7px 8px;font-size:11px}
table.g td{padding:7px 8px;border-bottom:1px solid #e4e7ec}

.tot .big td{font-size:15px;font-weight:bold;border-top:2px solid #1d2430}

</style></head><body>

  <div style="text-align:right"><h1>ORDINE D'ACQUISTO</h1><div class="meta">N. ${escHtml(o.numero||"—")}<br>Data: ${fmt(o.data)}${o.data_prevista?"<br>Consegna prevista: "+fmt(o.data_prevista):""}${o.riferimento?"<br>Rif.: "+escHtml(o.riferimento):""}</div></div>
</div>
<div class="forn"><div class="lbl">Spett.le fornitore</div><div class="nm">${escHtml((forn&&forn.ragione_sociale)||o.fornitore_nome||"")}</div>${forn&&forn.indirizzo?escHtml(forn.indirizzo)+"<br>":""}${forn&&forn.partita_iva?"P.IVA "+escHtml(forn.partita_iva):""}</div>
<table class="g"><thead><tr><th>Descrizione</th><th class="c" style="width:90px">Q.tà</th><th class="r" style="width:90px">Prezzo</th><th class="r" style="width:100px">Totale</th></tr></thead>
<tbody>${rr||`<tr><td colspan="4" class="c" style="padding:14px;color:#999">Nessuna riga.</td></tr>`}</tbody></table>

${forn&&forn.termini_pagamento?`<div class="note"><b>Pagamento:</b> ${escHtml(forn.termini_pagamento)}</div>`:""}
${o.note?`<div class="note"><b>Note</b><br>${escHtml(o.note)}</div>`:""}

</body></html>`;
}

function ModuloOrdiniFornitori({profilo,perm}){
  const [ordini,setOrdini]=useState(null);
  const [fornitori,setFornitori]=useState([]);
  const [articoli,setArticoli]=useState([]);
  const [commesse,setCommesse]=useState([]);
  const [err,setErr]=useState("");
  const [cerca,setCerca]=useState("");
  const [filtroStato,setFiltroStato]=useState("");
  const [editor,setEditor]=useState(null);

  const carica=useCallback(async()=>{
    setErr("");
    const [o,fo,a,cm]=await Promise.all([
      sb.from("ordini_fornitore").select("*, ordini_fornitore_righe(*)").order("creato_il",{ascending:false}),
      sb.from("fornitori").select("*").order("ragione_sociale"),
      caricaArticoliTutti("id,codice,nome_articolo,unita,costo,giacenza,impegnato,scorta_minima"),
      sb.from("commesse").select("id,numero,cliente_nome").order("creato_il",{ascending:false}),
    ]);
    if(o.error){ setErr(o.error.message); return; }
    setOrdini(o.data||[]); setFornitori(fo.data||[]); setArticoli(a); setCommesse(cm.data||[]);
  },[]);
  useEffect(()=>{ carica(); },[carica]);

  const filtrati=useMemo(()=>{
    if(!ordini) return [];
    const q=cerca.trim().toLowerCase();
    return ordini.filter(o=>{
      if(filtroStato && o.stato!==filtroStato) return false;
      if(!q) return true;
      return [o.numero,o.fornitore_nome,o.riferimento].join(" ").toLowerCase().includes(q);
    });
  },[ordini,cerca,filtroStato]);

  return (
    <>
      <div className="topbar"><h1>Ordini a fornitori</h1>
        {perm.scrivi && <button className="btn primary" onClick={()=>setEditor({})}>+ Nuovo ordine</button>}
      </div>
      <div className="content">
        {err && <div className="banner err">{err}</div>}
        <div className="banner info">Ordini d'acquisto ai fornitori. Alla ricezione della merce, l'ordine <b>carica automaticamente il magazzino</b>. Puoi partire dagli articoli sotto scorta.</div>
        <div className="toolbar">
          <div className="search"><span className="mag">🔍</span>
            <input placeholder="Cerca per numero, fornitore, riferimento…" value={cerca} onChange={e=>setCerca(e.target.value)}/></div>
          <select className="btn" value={filtroStato} onChange={e=>setFiltroStato(e.target.value)} style={{maxWidth:180}}>
            <option value="">Tutti gli stati</option>
            {Object.keys(STATI_OF).map(s=><option key={s} value={s}>{STATI_OF[s].l}</option>)}
          </select>
          <span className="muted">{filtrati.length} ordini</span>
        </div>
        {ordini===null ? <div className="empty">Caricamento…</div>
          : filtrati.length===0 ? <div className="card empty">Nessun ordine. Creane uno con “+ Nuovo ordine”.</div>
          : <div className="card" style={{overflow:"auto"}}>
              <table>
                <thead><tr><th>Numero</th><th>Fornitore</th><th>Data</th><th>Stato</th><th style={{textAlign:"right"}}>Totale</th></tr></thead>
                <tbody>
                  {filtrati.map(o=>{
                    const st=STATI_OF[o.stato]||STATI_OF.bozza;
                    return (
                      <tr key={o.id} onClick={()=>setEditor(o)}>
                        <td className="rs">{o.numero||"—"}</td>
                        <td>{o.fornitore_nome||"—"}</td>
                        <td className="muted">{o.data? new Date(o.data).toLocaleDateString("it-IT"):"—"}</td>
                        <td><span className="tag" style={{background:st.bg,color:st.c}}>{st.l}</span></td>
                        <td style={{textAlign:"right",fontWeight:700}}>{eur(o.totale)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>}
      </div>
      {editor && <OrdineFornitoreEditor ordine={editor.id?editor:null} profilo={profilo} perm={perm}
        fornitori={fornitori} articoli={articoli} commesse={commesse}
        numeroSuggerito={prossimoNumeroOF(ordini)}
        onClose={()=>setEditor(null)}
        onSalvato={()=>{setEditor(null);carica();}}/>}
    </>
  );
}

function OrdineFornitoreEditor({ordine,profilo,perm,fornitori,articoli,commesse,numeroSuggerito,onClose,onSalvato}){
  const nuovo=!ordine;
  const [f,setF]=useState(()=>({
    numero:ordine?.numero||numeroSuggerito,
    fornitore_id:ordine?.fornitore_id||"",
    fornitore_nome:ordine?.fornitore_nome||"",
    data:ordine?.data||new Date().toISOString().slice(0,10),
    data_prevista:ordine?.data_prevista||"",
    stato:ordine?.stato||"bozza",
    riferimento:ordine?.riferimento||"",
    commessa_id:ordine?.commessa_id||"",
    note:ordine?.note||"",
  }));
  const [righe,setRighe]=useState(()=> (ordine?.ordini_fornitore_righe||[]).slice().sort((a,b)=>(a.ordine||0)-(b.ordine||0)).map(x=>({...x})) );
  const [cercaArt,setCercaArt]=useState("");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const [msg,setMsg]=useState("");
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const setRiga=(i,k,v)=>setRighe(p=>p.map((r,j)=>j===i?{...r,[k]:v}:r));
  const delRiga=i=>setRighe(p=>p.filter((_,j)=>j!==i));
  const addLibera=()=>setRighe(p=>[...p,{articolo_id:null,descrizione:"",quantita:1,unita:"",prezzo_unitario:0,quantita_ricevuta:0,note:""}]);
  const risArt=useMemo(()=>{ const s=cercaArt.trim().toLowerCase(); if(!s) return [];
    return (articoli||[]).filter(a=>[a.nome_articolo,a.codice].join(" ").toLowerCase().includes(s)).slice(0,8);
  },[cercaArt,articoli]);
  const addArt=a=>{ setRighe(p=>[...p,{articolo_id:a.id,descrizione:a.nome_articolo,quantita:1,unita:a.unita||"",
    prezzo_unitario:Number(a.costo)||0,quantita_ricevuta:0,note:""}]); setCercaArt(""); };
  function proponiSottoscorta(){
    const disp=a=>(Number(a.giacenza)||0)-(Number(a.impegnato)||0);
    const sotto=(articoli||[]).filter(a=>Number(a.scorta_minima)>0 && disp(a)<Number(a.scorta_minima));
    setRighe(p=>{ const esist=new Set(p.map(r=>r.articolo_id)); return [...p, ...sotto.filter(a=>!esist.has(a.id)).map(a=>({
      articolo_id:a.id, descrizione:a.nome_articolo, quantita:Math.round((Number(a.scorta_minima)-disp(a))*100)/100,
      unita:a.unita||"", prezzo_unitario:Number(a.costo)||0, quantita_ricevuta:0, note:"" })) ]; });
  }
  const totale=righe.reduce((s,r)=>s+(Number(r.quantita)||0)*(Number(r.prezzo_unitario)||0),0);
  const daRicevere=righe.filter(r=>r.articolo_id && ((Number(r.quantita)||0)-(Number(r.quantita_ricevuta)||0))>0).length;
  const numIn={width:82,padding:"6px 7px",border:"1px solid var(--line)",borderRadius:7,textAlign:"right"};

  async function persistiOrdine(id){
    const fo=fornitori.find(x=>x.id===f.fornitore_id);
    const rec={numero:f.numero||"", fornitore_id:f.fornitore_id||null,
      fornitore_nome:fo?fo.ragione_sociale:(f.fornitore_nome||""),
      data:f.data||null, data_prevista:f.data_prevista||null, stato:f.stato,
      riferimento:f.riferimento||"", commessa_id:f.commessa_id||null, note:f.note||"",
      totale:Math.round(totale*100)/100, aggiornato_il:new Date().toISOString()};
    if(!id){ rec.creato_da=profilo.id;
      const {data,error}=await sb.from("ordini_fornitore").insert(rec).select("id").single(); if(error) throw error; id=data.id;
    }else{ const {error}=await sb.from("ordini_fornitore").update(rec).eq("id",id); if(error) throw error;
      await sb.from("ordini_fornitore_righe").delete().eq("ordine_id",id); }
    const rows=righe.map((r,idx)=>({ordine_id:id, ordine:idx, articolo_id:r.articolo_id||null, descrizione:r.descrizione||"",
      quantita:Number(r.quantita)||0, unita:r.unita||"", prezzo_unitario:Number(r.prezzo_unitario)||0,
      quantita_ricevuta:Number(r.quantita_ricevuta)||0, note:r.note||""}));
    if(rows.length){ const {error}=await sb.from("ordini_fornitore_righe").insert(rows); if(error) throw error; }
    return id;
  }

  async function salva(e){
    e.preventDefault();
    if(!f.fornitore_id && !f.fornitore_nome){ setErr("Scegli un fornitore."); return; }
    setBusy(true); setErr("");
    try{ await persistiOrdine(ordine?.id); onSalvato(); }
    catch(ex){ setErr(ex.message); setBusy(false); }
  }

  async function ricevi(){
    if(nuovo || !ordine?.id){ setErr("Salva prima l'ordine, poi registra la ricezione."); return; }
    if(!daRicevere){ setErr("Niente da ricevere: le quantità risultano già caricate."); return; }
    if(!window.confirm("Registrare la ricezione e caricare a magazzino "+daRicevere+" articolo/i?")) return;
    setBusy(true); setErr(""); setMsg("");
    try{
      const rif="Ordine "+(f.numero||ordine.numero||"");
      const nuoveRighe=righe.map(r=>({...r}));
      for(const r of nuoveRighe){
        const delta=(Number(r.quantita)||0)-(Number(r.quantita_ricevuta)||0);
        if(!r.articolo_id || delta<=0) continue;
        const {error}=await sb.from("movimenti_magazzino").insert({articolo_id:r.articolo_id, tipo:"carico",
          quantita:delta, causale:"Acquisto / carico fornitore", riferimento:rif, creato_da:profilo.id});
        if(error) throw error;
        r.quantita_ricevuta=Number(r.quantita)||0;
      }
      const tuttoRic=nuoveRighe.every(r=>!r.articolo_id || (Number(r.quantita_ricevuta)||0)>=(Number(r.quantita)||0));
      setRighe(nuoveRighe);
      setF(p=>({...p,stato:tuttoRic?"ricevuto":"ricevuto_parziale"}));
      // persiste subito con le quantità ricevute aggiornate
      await sb.from("ordini_fornitore").update({stato:tuttoRic?"ricevuto":"ricevuto_parziale", aggiornato_il:new Date().toISOString()}).eq("id",ordine.id);
      await sb.from("ordini_fornitore_righe").delete().eq("ordine_id",ordine.id);
      const rows=nuoveRighe.map((r,idx)=>({ordine_id:ordine.id, ordine:idx, articolo_id:r.articolo_id||null, descrizione:r.descrizione||"",
        quantita:Number(r.quantita)||0, unita:r.unita||"", prezzo_unitario:Number(r.prezzo_unitario)||0,
        quantita_ricevuta:Number(r.quantita_ricevuta)||0, note:r.note||""}));
      if(rows.length){ const {error}=await sb.from("ordini_fornitore_righe").insert(rows); if(error) throw error; }
      setMsg("Merce ricevuta e caricata a magazzino ✓"); setBusy(false);
    }catch(ex){ setErr(ex.message); setBusy(false); }
  }

  async function elimina(){
    if(!ordine?.id) return;
    if(!window.confirm("Eliminare l'ordine "+(f.numero||"")+"? (I movimenti di magazzino già registrati restano.)")) return;
    setBusy(true); setErr("");
    try{ const {error}=await sb.from("ordini_fornitore").delete().eq("id",ordine.id); if(error) throw error; onSalvato(); }
    catch(ex){ setErr(ex.message); setBusy(false); }
  }

  async function stampa(){
    let az={};
    try{ const {data}=await sb.from("impostazioni").select("azienda_nome,azienda_indirizzo,azienda_citta,azienda_piva,azienda_tel,azienda_email").eq("id",1).maybeSingle(); az=data||{}; }catch(e){}
    const forn=fornitori.find(x=>x.id===f.fornitore_id)||null;
    stampaHTML(htmlOrdineFornitore(f, righe, az, forn));
  }

  return (
    <div className="overlay">
      <form className="modal" style={{maxWidth:1000}} onClick={e=>e.stopPropagation()} onSubmit={salva}>
        <header><h2>{nuovo?"Nuovo ordine fornitore":"Ordine "+(f.numero||"")}</h2>
          <button type="button" className="x" onClick={onClose}>×</button></header>
        <div className="body">
          {err && <div className="banner err">{err}</div>}
          {msg && <div className="banner" style={{background:"#e6f4ee",color:"#1f9c68"}}>📦 {msg}</div>}

          <div className="section">
            <h3>Testata</h3>
            <div className="row">
              <div className="field" style={{flex:2}}><label>Fornitore *</label>
                <select value={f.fornitore_id} onChange={e=>set("fornitore_id",e.target.value)} required>
                  <option value="">— scegli —</option>
                  {fornitori.map(fo=><option key={fo.id} value={fo.id}>{fo.ragione_sociale}</option>)}
                </select></div>
              <div className="field" style={{maxWidth:150}}><label>Numero</label>
                <input value={f.numero} onChange={e=>set("numero",e.target.value)}/></div>
              <div className="field" style={{maxWidth:160}}><label>Stato</label>
                <select value={f.stato} onChange={e=>set("stato",e.target.value)}>
                  {Object.keys(STATI_OF).map(s=><option key={s} value={s}>{STATI_OF[s].l}</option>)}
                </select></div>
            </div>
            <div className="row">
              <div className="field" style={{maxWidth:160}}><label>Data</label>
                <input type="date" value={f.data} onChange={e=>set("data",e.target.value)}/></div>
              <div className="field" style={{maxWidth:180}}><label>Consegna prevista</label>
                <input type="date" value={f.data_prevista||""} onChange={e=>set("data_prevista",e.target.value)}/></div>
              <div className="field"><label>Riferimento</label>
                <input value={f.riferimento} onChange={e=>set("riferimento",e.target.value)}/></div>
              <div className="field" style={{maxWidth:220}}><label>Commessa collegata</label>
                <select value={f.commessa_id||""} onChange={e=>set("commessa_id",e.target.value)}>
                  <option value="">— nessuna —</option>
                  {commesse.map(c=><option key={c.id} value={c.id}>{c.numero} · {c.cliente_nome}</option>)}
                </select></div>
            </div>
          </div>

          <div className="section">
            <h3>Righe</h3>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
              <button type="button" className="btn small" onClick={proponiSottoscorta}>⚠ Proponi da sottoscorta</button>
              <button type="button" className="btn small" onClick={addLibera}>+ Riga libera</button>
            </div>
            <div style={{overflow:"auto"}}>
              <table>
                <thead><tr>
                  <th>Descrizione</th><th style={{width:80}}>Q.tà</th><th style={{width:70}}>Unità</th>
                  <th style={{width:100}}>Prezzo €</th><th style={{width:90}}>Ricevuta</th>
                  <th style={{textAlign:"right",width:100}}>Totale</th><th></th>
                </tr></thead>
                <tbody>
                  {righe.length===0 && <tr><td colSpan={7} className="muted" style={{padding:14}}>Nessuna riga. Aggiungi articoli dal catalogo qui sotto, “Proponi da sottoscorta” o una riga libera.</td></tr>}
                  {righe.map((r,i)=>{
                    const rt=(Number(r.quantita)||0)*(Number(r.prezzo_unitario)||0);
                    const ric=(Number(r.quantita_ricevuta)||0)>=(Number(r.quantita)||0)&&(Number(r.quantita)||0)>0;
                    return (
                      <tr key={i}>
                        <td style={{minWidth:200}}><input value={r.descrizione} onChange={e=>setRiga(i,"descrizione",e.target.value)}
                          style={{width:"100%",padding:"6px",border:"1px solid var(--line)",borderRadius:7}}/></td>
                        <td><input type="number" step="any" value={r.quantita} onChange={e=>setRiga(i,"quantita",e.target.value)} style={numIn}/></td>
                        <td><input value={r.unita||""} onChange={e=>setRiga(i,"unita",e.target.value)} style={{width:60,padding:"6px",border:"1px solid var(--line)",borderRadius:7}}/></td>
                        <td><input type="number" step="any" value={r.prezzo_unitario} onChange={e=>setRiga(i,"prezzo_unitario",e.target.value)} style={numIn}/></td>
                        <td style={{textAlign:"center"}}>{Number(r.quantita_ricevuta)||0}{ric&&<span title="Ricevuto" style={{color:"var(--ok)",marginLeft:4}}>✓</span>}</td>
                        <td style={{textAlign:"right",fontWeight:600}}>{eur(rt)}</td>
                        <td><button type="button" className="btn small danger" onClick={()=>delRiga(i)}>✕</button></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <div style={{marginTop:10,position:"relative"}}>
              <input value={cercaArt} onChange={e=>setCercaArt(e.target.value)} placeholder="+ Aggiungi articolo dal catalogo…"
                style={{width:"100%",maxWidth:440,padding:"8px 10px",border:"1px solid var(--line)",borderRadius:8}}/>
              {risArt.length>0 &&
                <div className="card" style={{maxWidth:440,maxHeight:200,overflow:"auto",position:"absolute",zIndex:5,background:"#fff"}}>
                  {risArt.map(a=>
                    <div key={a.id} onClick={()=>addArt(a)} style={{padding:"8px 12px",borderBottom:"1px solid var(--line)",cursor:"pointer"}}>
                      <b>{a.nome_articolo}</b> <span className="muted">{a.codice}</span>
                      <span className="muted" style={{float:"right"}}>costo {eur(a.costo||0)} · disp. {(Number(a.giacenza)||0)-(Number(a.impegnato)||0)}</span>
                    </div>)}
                </div>}
            </div>
          </div>

          <div className="card" style={{padding:16,background:"#fafbfc"}}>
            <div className="kv" style={{gridTemplateColumns:"1fr auto"}}>
              <span className="k" style={{fontWeight:800}}>TOTALE ORDINE</span><span style={{textAlign:"right",fontWeight:800,fontSize:16}}>{eur(totale)}</span>
            </div>
          </div>

          <div className="section" style={{marginTop:18}}>
            <h3>Note</h3>
            <div className="field"><textarea rows={2} value={f.note} onChange={e=>set("note",e.target.value)}/></div>
          </div>
        </div>
        <footer>
          <button type="button" className="btn" onClick={stampa} disabled={!f.fornitore_id} title="Stampa / PDF ordine">🖨️ PDF</button>

            title={daRicevere?("Ricevi e carica a magazzino "+daRicevere+" articolo/i"):"Niente da ricevere"}>📥 Ricevi merce{daRicevere?" ("+daRicevere+")":""}</button>}
