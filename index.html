                  <input type="file" accept="image/*" multiple onChange={caricaFoto} disabled={upBusy} style={{display:"none"}}/>
                </label>}
            </div>
            {(f.foto_urls||[]).length===0 && !perm.scrivi && <div className="muted" style={{fontSize:13}}>Nessuna foto.</div>}
          </div>

          <div className="section">
            <h3>Altro</h3>
            <label style={{display:"flex",alignItems:"center",gap:8,margin:"4px 0",padding:"8px 10px",borderRadius:8,
              background:f.da_ripristinare?"#fff4e5":"transparent",border:f.da_ripristinare?"1px solid #f0d3a0":"1px solid transparent"}}>
              <input type="checkbox" checked={f.da_ripristinare} onChange={e=>set("da_ripristinare",e.target.checked)} style={{width:"auto"}}/>
              🔧 Da ripristinare
            </label>
            {f.da_ripristinare && <div className="field"><label>Cosa c'è da fare</label>
              <textarea rows={2} value={f.nota_ripristino||""} onChange={e=>set("nota_ripristino",e.target.value)}
                placeholder="Es. sostituire vetro rotto, ritoccare vernice, controllare alimentatore…"/></div>}
            <label style={{display:"flex",alignItems:"center",gap:8,margin:"8px 0"}}>
              <input type="checkbox" checked={f.attivo} onChange={e=>set("attivo",e.target.checked)} style={{width:"auto"}}/>
              Articolo attivo
            </label>
            <label style={{display:"flex",alignItems:"center",gap:8,margin:"4px 0 12px"}}>
              <input type="checkbox" checked={f.vendibile} onChange={e=>set("vendibile",e.target.checked)} style={{width:"auto"}}/>
              Vendibile online (e-commerce)
            </label>
            <div className="field"><label>Note</label>
              <textarea rows={2} value={f.note||""} onChange={e=>set("note",e.target.value)}/></div>
          </div>
        </div>
        <footer>
          {perm.elimina && !nuovo && <button type="button" className="btn danger" style={{marginRight:"auto"}} onClick={elimina} disabled={busy}>Elimina</button>}
          {!nuovo && perm.scrivi && onDuplica && <button type="button" className="btn" disabled={busy}
            title="Crea un nuovo articolo copiando questi dati (poi cambi solo ciò che serve)" onClick={()=>onDuplica({...f})}>⧉ Duplica</button>}
          <button type="button" className="btn" onClick={onClose}>Annulla</button>
          <button className="btn primary" disabled={busy}>{busy?<span className="spin"/>:"Salva"}</button>
        </footer>
      </form>
    </div>
  );
}

/* ------------------------------------------------ import catalogo da Excel/CSV */
function ImportArticoli({onClose,onImport,isAdmin,fornitori}){
  const [fornListino,setFornListino]=useState("");   // "questo listino e' del fornitore X"
  const [rinnovo,setRinnovo]=useState(false);        // disattiva i fuori-listino di quel fornitore
  const [cols,setCols]=useState(null);
  const [rows,setRows]=useState([]);
  const [map,setMap]=useState({});
  const [err,setErr]=useState("");
  const [nomeFile,setNomeFile]=useState("");
  const [tipoDefault,setTipoDefault]=useState("prodotto");
  const [busy,setBusy]=useState(false);
  const [analisi,setAnalisi]=useState(null);              // esito del confronto col catalogo
  const [modo,setModo]=useState(isAdmin?"aggiorna":"solo_nuovi");

  function onFile(e){
    const file=e.target.files && e.target.files[0]; if(!file) return;
    setErr(""); setNomeFile(file.name);
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const json=XLSX.utils.sheet_to_json(ws,{defval:""});
        if(!json.length){ setErr("File vuoto o senza intestazioni."); setCols(null); return; }
        const headers=Object.keys(json[0]);
        setCols(headers); setRows(json);
        const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,"");
        // Sinonimi per i listini dei fornitori. NB: nel listino gadget "Listino_riservato" e'
        // il prezzo che paghiamo NOI -> va nel COSTO, non tra i prezzi di vendita.
        const SIN={
          prezzo_pubblico:["listinopubblico","pubblico","prezzodilistino"],
          costo:["listinoriservato","riservato","prezzoacquisto","costoacquisto"],
        };
        const m={};
        CAMPI_ARTICOLO.forEach(c=>{
          let hit = headers.find(h=>norm(h)===norm(c.k))
                 || headers.find(h=>norm(h).includes(norm(c.k)));
          if(!hit && SIN[c.k]) hit = headers.find(h=>SIN[c.k].some(a=>norm(h)===a||norm(h).includes(a)));
          m[c.k]=hit||"";
        });
        // colonne del fornitore (prefisso forn_ per non confonderle coi campi articolo)
        CAMPI_IMPORT_FORNITORE.forEach(c=>{
          m["forn_"+c.k]= headers.find(h=>norm(h)===norm(c.k)) || "";
        });
        setMap(m); setAnalisi(null);
      }catch(ex){ setErr("Impossibile leggere il file: "+ex.message); setCols(null); }
    };
    reader.readAsArrayBuffer(file);
  }
  // cambiando la mappatura l'analisi non vale piu': va rifatta
  const setM=(k,v)=>{ setAnalisi(null); setMap(p=>({...p,[k]:v})); };

  // REGOLA: si importa SOLO cio' che e' mappato e non vuoto. Una colonna assente o una
  // cella vuota non tocca nulla -> aggiornando si puo' mandare un file con due sole colonne
  // (codice + costo) senza azzerare giacenze, scorte e pesi.
  const mappa=r=>{
    const o={tipo:tipoDefault};
    CAMPI_ARTICOLO.forEach(c=>{
      const col=map[c.k]; if(!col) return;
      const val=r[col];
      if(String(val??"").trim()==="") return;
      o[c.k]= c.num ? (normalizzaPrezzo(val)||0) : String(val).trim();
    });
    // dati fornitore: viaggiano a parte, finiranno in articoli_fornitori
    const fo={};
    CAMPI_IMPORT_FORNITORE.forEach(c=>{
      const col=map["forn_"+c.k];
      const val= col ? r[col] : "";
      fo[c.k]= c.num ? (normalizzaPrezzo(val)||0) : String(val??"").trim();
    });
    if(fo.fornitore || fo.codice_fornitore || fo.prezzo_fornitore) o.__forn=fo;
    return o;
  };
  const anteprima=useMemo(()=> cols? rows.slice(0,5).map(mappa):[], [cols,rows,map,tipoDefault]);
  const gruppi=[...new Set(CAMPI_ARTICOLO.map(c=>c.g))];

  // Confronta il file col catalogo PRIMA di scrivere: quanti nuovi, quanti da aggiornare,
  // e quali codici sono ambigui (presenti piu' volte in catalogo -> si saltano).
  async function analizza(){
    if(!map.nome_articolo){ setErr("Scegli almeno la colonna del Nome articolo."); return; }
    const out=rows.map(mappa).filter(a=>String(a.nome_articolo||"").trim());
    if(!out.length){ setErr("Nessuna riga con nome articolo trovata."); return; }
    setBusy(true); setErr(""); setAnalisi(null);
    try{
      const codici=[...new Set(out.map(a=>String(a.codice||"").trim()).filter(Boolean))];
      const conteggio={}, idByCod={};
      for(let i=0;i<codici.length;i+=200){
        const {data,error}=await sb.from("articoli").select("id,codice").in("codice",codici.slice(i,i+200));
        if(error) throw error;
        (data||[]).forEach(a=>{ const c=String(a.codice||"").trim();
          conteggio[c]=(conteggio[c]||0)+1; idByCod[c]=a.id; });
      }
      let nuovi=0, agg=0, senzaCodice=0; const ambigui=new Set();
      out.forEach(a=>{
        const c=String(a.codice||"").trim();
        if(!c){ nuovi++; senzaCodice++; return; }
        const n=conteggio[c]||0;
        if(n===0) nuovi++; else if(n===1) agg++; else ambigui.add(c);
      });
      setAnalisi({tot:out.length,nuovi,agg,senzaCodice,ambigui:[...ambigui],idByCod,conteggio});
    }catch(ex){ setErr("Analisi non riuscita: "+ex.message); }
    setBusy(false);
  }

  async function conferma(){
    if(!analisi){ setErr("Prima premi «Confronta col catalogo»."); return; }
    const out=rows.map(mappa).filter(a=>String(a.nome_articolo||"").trim());
    setBusy(true);
    await onImport(out,{modo:isAdmin?modo:"solo_nuovi", nomeFile,
      idByCod:analisi.idByCod, conteggio:analisi.conteggio,
      fornListino:fornListino||null, rinnovo:isAdmin && !!fornListino && rinnovo});
  }

  return (
    <div className="overlay" style={{zIndex:60}}>
      <div className="modal" style={{maxWidth:900}} onClick={e=>e.stopPropagation()}>
        <header><h2>Importa articoli da Excel/CSV</h2>
          <button type="button" className="x" onClick={onClose}>×</button></header>
        <div className="body">
          {err && <div className="banner err">{err}</div>}
          <div className="section">
            <h3>1. File e tipo</h3>
            <input type="file" accept=".xlsx,.xls,.csv" onChange={onFile}/>
            {nomeFile && <div className="muted" style={{marginTop:6}}>File: {nomeFile} — {rows.length} righe</div>}
            <div className="row">
              <div className="field" style={{maxWidth:220,marginTop:10}}>
                <label>Questi articoli sono</label>
                <select value={tipoDefault} onChange={e=>setTipoDefault(e.target.value)}>
                  {TIPI_ARTICOLO.map(t=><option key={t} value={t}>{t==="prodotto"?"Prodotti":"Servizi"}</option>)}
                </select>
              </div>
              <div className="field" style={{maxWidth:280,marginTop:10}}>
                <label>Listino del fornitore</label>
                <select value={fornListino} onChange={e=>{ setFornListino(e.target.value); if(!e.target.value) setRinnovo(false); }}>
                  <option value="">— nessuno (import generico) —</option>
                  {(fornitori||[]).map(fo=><option key={fo.id} value={fo.id}>{fo.ragione_sociale}</option>)}
                </select>
              </div>
            </div>
            {fornListino &&
              <label style={{display:"flex",alignItems:"flex-start",gap:8,marginTop:10,fontSize:13,
                opacity:isAdmin?1:.55,cursor:isAdmin?"pointer":"default"}}>
                <input type="checkbox" checked={rinnovo} disabled={!isAdmin}
                       onChange={e=>setRinnovo(e.target.checked)} style={{width:"auto",marginTop:3}}/>
                <span><b>Rinnovo completo del listino</b> — gli articoli di questo fornitore <b>non presenti nel file</b> verranno
                  <b> disattivati</b> (spariscono da menu e ricerche, lo storico resta); quelli <b>mai usati</b> verranno eliminati.
                  {!isAdmin && <span className="muted"> Solo l'amministratore.</span>}
                  <span className="muted"> Usa solo quando carichi il listino NUOVO e COMPLETO del fornitore.</span></span>
              </label>}
          </div>
          {cols &&
            <div className="section">
              <h3>2. Abbina le colonne</h3>
              <div className="muted" style={{fontSize:12,marginBottom:10}}>Abbinate in automatico dove i nomi combaciano. Correggi se serve (— = non importare).</div>
              {gruppi.map(g=>
                <div key={g} style={{marginBottom:12}}>
                  <div style={{fontWeight:700,fontSize:12,color:"var(--muted)",marginBottom:6}}>{g}</div>
                  {CAMPI_ARTICOLO.filter(c=>c.g===g).map(c=>
                    <div className="row" key={c.k} style={{alignItems:"center",marginBottom:6}}>
                      <div style={{width:150,fontSize:13}}>{c.label}</div>
                      <select className="btn" style={{flex:1}} value={map[c.k]||""} onChange={e=>setM(c.k,e.target.value)}>
                        <option value="">—</option>
                        {cols.map(h=><option key={h} value={h}>{h}</option>)}
                      </select>
                    </div>)}
                </div>)}
              <div style={{marginBottom:12}}>
                <div style={{fontWeight:700,fontSize:12,color:"var(--muted)",marginBottom:6}}>Fornitore <span style={{fontWeight:400,textTransform:"none"}}>— crea il collegamento articolo/fornitore</span></div>
                {CAMPI_IMPORT_FORNITORE.map(c=>
                  <div className="row" key={c.k} style={{alignItems:"center",marginBottom:6}}>
                    <div style={{width:150,fontSize:13}}>{c.label}</div>
                    <select className="btn" style={{flex:1}} value={map["forn_"+c.k]||""} onChange={e=>setM("forn_"+c.k,e.target.value)}>
                      <option value="">—</option>
                      {cols.map(h=><option key={h} value={h}>{h}</option>)}
                    </select>
                  </div>)}
                <div className="muted" style={{fontSize:12}}>Il <b>fornitore</b> viene riconosciuto dalla ragione sociale: dev'essere già presente in 🚚 Anagrafica Fornitori, scritto uguale. Il suo <b>codice</b> sarà pronto quando gli farai l'ordine.</div>
              </div>
            </div>}
          {cols && map.nome_articolo &&
            <div className="section">
              <h3>3. Anteprima (prime righe)</h3>
              <div className="card" style={{overflow:"auto"}}>
                <table><thead><tr><th>Codice</th><th>Nome</th><th>Categoria</th><th>Prezzo pubbl.</th></tr></thead>
                  <tbody>{anteprima.map((a,i)=>
                    <tr key={i}><td>{a.codice||"—"}</td><td>{a.nome_articolo||"—"}</td>
                      <td className="muted">{a.categoria||"—"}</td><td>{a.prezzo_pubblico||0}</td></tr>)}
                  </tbody></table>
              </div>
              <div className="muted" style={{fontSize:12,marginTop:8}}>Vengono importate <b>solo le colonne abbinate e non vuote</b>: una cella vuota non sovrascrive nulla.</div>
            </div>}

          {cols && map.nome_articolo &&
            <div className="section">
              <h3>4. Confronto col catalogo</h3>
              {!analisi
                ? <>
                    <div className="muted" style={{fontSize:12.5,marginBottom:8}}>Prima di scrivere, controlliamo quali articoli esistono già (riconosciuti dal <b>codice</b>).</div>
                    <button type="button" className="btn" disabled={busy} onClick={analizza}>
                      {busy?<span className="spin"/>:"Confronta col catalogo"}</button>
                  </>
                : <>
                    <div className="card" style={{padding:14,background:"#fafbfc"}}>
                      <div className="kv" style={{gridTemplateColumns:"1fr auto"}}>
                        <span className="k">Righe nel file</span><span style={{textAlign:"right"}}>{analisi.tot}</span>
                        <span className="k">Nuovi da inserire</span><span style={{textAlign:"right",fontWeight:700,color:"var(--ok)"}}>{analisi.nuovi}</span>
                        <span className="k">Già presenti</span><span style={{textAlign:"right",fontWeight:700}}>{analisi.agg}</span>
                        {analisi.ambigui.length>0 && <>
                          <span className="k" style={{color:"var(--danger)"}}>Codici ambigui (saltati)</span>
                          <span style={{textAlign:"right",fontWeight:700,color:"var(--danger)"}}>{analisi.ambigui.length}</span></>}
                      </div>
                      {analisi.senzaCodice>0 &&
                        <div className="muted" style={{fontSize:12,marginTop:8}}>⚠ {analisi.senzaCodice} righe <b>senza codice</b>: verranno sempre inserite come nuove (non riconoscibili).</div>}
                      {analisi.ambigui.length>0 &&
                        <div className="banner err" style={{marginTop:10,marginBottom:0,fontSize:12.5}}>
                          Questi codici compaiono <b>più volte</b> in catalogo, quindi non si sa quale aggiornare: vengono <b>saltati</b>.<br/>
                          <span style={{fontFamily:"monospace"}}>{analisi.ambigui.slice(0,12).join(", ")}{analisi.ambigui.length>12?" …":""}</span>
                        </div>}
                    </div>

                    <div className="field" style={{maxWidth:420,marginTop:12}}>
                      <label>Cosa faccio con i {analisi.agg} già presenti</label>
                      <select value={modo} onChange={e=>setModo(e.target.value)} disabled={!isAdmin}>
                        <option value="aggiorna">Aggiorna (con backup, annullabile)</option>
                        <option value="solo_nuovi">Non toccarli: inserisci solo i nuovi</option>
                      </select>
                      {!isAdmin && <div className="muted" style={{fontSize:12,marginTop:4}}>Solo l'amministratore può aggiornare in blocco: verranno inseriti soltanto i nuovi.</div>}
                    </div>

                    {isAdmin && modo==="aggiorna" &&
                      <div className="banner info" style={{fontSize:12.5}}>
                        Prima di modificare, salvo una <b>copia di sicurezza</b> delle {analisi.agg} righe. Se qualcosa va storto, usa
                        <b> «↩ Annulla ultimo import»</b> nel Catalogo per rimettere tutto com'era.
                      </div>}
                  </>}
            </div>}
        </div>
        <footer>
          <button type="button" className="btn" onClick={onClose}>Annulla</button>
          <button type="button" className="btn primary" disabled={!analisi||busy} onClick={conferma}>
            {busy?<span className="spin"/>
              : !analisi ? "Importa"
              : modo==="aggiorna" && isAdmin
                ? "Importa: "+analisi.nuovi+" nuovi + "+analisi.agg+" aggiornati"
                : "Importa "+analisi.nuovi+" nuovi"}</button>
        </footer>
      </div>
    </div>
  );
}

/* ================================================================ MAGAZZINO (Fase 2) */
function ModuloMagazzino({profilo,perm}){
  // Chi ha il flag "magazzino" gestisce i movimenti (carico/scarico) e può vederne lo storico.
  // Chi non ce l'ha (es. produzione: progettisti/disegnatori) vede SOLO le giacenze, senza prezzi.
  const canMov = !!perm.magazzino;
  const [vista,setVista]=useState("giacenze");   // 'giacenze' | 'movimenti'
  const [movimenti,setMovimenti]=useState(null);
  const [articoli,setArticoli]=useState(null);
  const [err,setErr]=useState("");
  const [form,setForm]=useState(false);
  const [filtroTipo,setFiltroTipo]=useState("");
  const [cerca,setCerca]=useState("");
  const [cercaDeb,setCercaDeb]=useState("");
  const [soloMag,setSoloMag]=useState(true);   // di default mostra solo cio' che si tiene davvero a magazzino
  const [movArt,setMovArt]=useState({});        // nomi articoli per lo storico movimenti (per id)
  const [troncato,setTroncato]=useState(false);
  const [impegni,setImpegni]=useState({});       // dettaglio "impegnato" per articolo_id: [{numero,cliente_nome,stato,quantita}]
  const [dettImp,setDettImp]=useState(null);     // articolo di cui mostrare il dettaglio impegni (modale)
  // la ricerca aspetta 300ms prima di interrogare il DB
  useEffect(()=>{ const t=setTimeout(()=>setCercaDeb(cerca),300); return ()=>clearTimeout(t); },[cerca]);

  const carica=useCallback(async()=>{
    setErr("");
    // GIACENZE lato SERVER: con migliaia di articoli non si possono scaricare tutti (Supabase ne dà max 1000
    // e i materiali si perderebbero). Chiediamo solo cio' che serve: i materiali a magazzino, o la ricerca.
    const LIM=1000;
    let qy=sb.from("articoli_magazzino")
      .select("id,codice,nome_articolo,unita,tipo,giacenza,impegnato,scorta_minima,mq_per_lastra")
      .order("nome_articolo").limit(LIM);
    const q=cercaDeb.trim().replace(/[,()*]/g," ");
    // il filtro "solo materiali a magazzino" vale per la vista di default; quando CERCHI
    // qualcosa vuoi trovarlo comunque (anche un articolo nuovo a giacenza 0), quindi non lo applico.
    if(soloMag && !q) qy=qy.or("giacenza.neq.0,impegnato.neq.0,scorta_minima.gt.0");
    if(q) qy=qy.or("nome_articolo.ilike.*"+q+"*,codice.ilike.*"+q+"*,tipo.ilike.*"+q+"*");
    const a=await qy;
    if(a.error){ setErr(a.error.message); return; }
    setArticoli(a.data||[]); setTroncato((a.data||[]).length>=LIM);
    // dettaglio "impegnato" per commessa (a chi è assegnato il materiale) — solo se ci sono impegni in vista
    if((a.data||[]).some(x=>Number(x.impegnato)>0)){
      const { data:imp } = await sb.rpc("impegni_dettaglio");
      const map={}; (imp||[]).forEach(r=>{ (map[r.articolo_id]=map[r.articolo_id]||[]).push(r); });
      Object.values(map).forEach(list=>list.sort((x,y)=>Number(y.quantita)-Number(x.quantita)));
      setImpegni(map);
    } else setImpegni({});
    if(canMov){
      const m=await sb.from("movimenti_magazzino").select("*").order("data",{ascending:false}).limit(200);
      if(m.error){ setErr(m.error.message); return; }
      setMovimenti(m.data||[]);
      // nomi degli articoli citati nello storico (potrebbero non essere tra i materiali a magazzino)
      const ids=[...new Set((m.data||[]).map(x=>x.articolo_id).filter(Boolean))];
      if(ids.length){
        const n=await sb.from("articoli_magazzino").select("id,codice,nome_articolo").in("id",ids);
        const mm={}; (n.data||[]).forEach(x=>{ mm[x.id]=x; }); setMovArt(mm);
      } else setMovArt({});
    } else { setMovimenti([]); }
  },[canMov,soloMag,cercaDeb]);
  useEffect(()=>{ carica(); },[carica]);

  // il server ha già applicato filtro "a magazzino" e ricerca: qui mostriamo così com'è
  const artFiltrati=articoli||[];

  const filtrati=useMemo(()=>{
    if(!movimenti) return [];
    const q=cercaDeb.trim().toLowerCase();
    return movimenti.filter(mv=>{
      if(filtroTipo && mv.tipo!==filtroTipo) return false;
      if(!q) return true;
      const a=movArt[mv.articolo_id]||{};
      return [a.nome_articolo,a.codice,mv.causale,mv.riferimento].join(" ").toLowerCase().includes(q);
    });
  },[movimenti,cercaDeb,filtroTipo,movArt]);

  const dataIt=d=> d? new Date(d).toLocaleString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
  const num=v=>{ const n=Number(v); return Number.isFinite(n)? (Math.round(n*100)/100) : 0; };

  return (
    <>
      <div className="topbar">
        <h1>Magazzino</h1>
        {canMov && perm.scrivi && <button className="btn primary" onClick={()=>setForm(true)}>+ Nuovo movimento</button>}
      </div>
      <div className="content">
        {err && <div className="banner err">{err}</div>}

        {canMov &&
          <div className="toolbar" style={{gap:8}}>
            <button className={"btn"+(vista==="giacenze"?" primary":"")} onClick={()=>setVista("giacenze")}>📦 Giacenze</button>
            <button className={"btn"+(vista==="movimenti"?" primary":"")} onClick={()=>setVista("movimenti")}>🔁 Movimenti</button>
          </div>}

        {vista==="giacenze" ? (
          <>
            <div className="toolbar">
              <div className="search"><span className="mag">🔍</span>
                <input placeholder="Cerca per articolo, codice, tipo…" value={cerca} onChange={e=>setCerca(e.target.value)}/></div>
              <label className="btn" style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",whiteSpace:"nowrap"}}
                     title="Mostra anche gli articoli a catalogo che non tenete a magazzino (es. gadget su ordinazione)">
                <input type="checkbox" checked={!soloMag} onChange={e=>setSoloMag(!e.target.checked)} style={{width:"auto"}}/>
                Mostra tutto il catalogo
              </label>
              <span className="muted">{artFiltrati.length} articoli{soloMag?" a magazzino":""}{troncato?" (primi 1000 — restringi con la ricerca)":""}</span>
            </div>
            {articoli===null ? <div className="empty">Caricamento…</div>
              : artFiltrati.length===0 ? <div className="card empty">
                  {cercaDeb.trim()
                    ? <>Nessun articolo trovato per «{cercaDeb.trim()}».{soloMag && <div className="muted" style={{fontSize:12.5,marginTop:6}}>Cerchi qualcosa non ancora a magazzino? Spunta “Mostra tutto il catalogo”.</div>}</>
                    : soloMag
                      ? <>Nessun materiale a magazzino.<div className="muted" style={{fontSize:12.5,marginTop:6}}>Qui compaiono gli articoli con una giacenza o con una <b>scorta minima</b> impostata. Spunta “Mostra tutto il catalogo” per vedere anche il resto.</div></>
                      : "Nessun articolo in catalogo."}
                </div>
              : <div className="card" style={{overflow:"auto"}}>
                  <table>
                    <thead><tr>
                      <th>Articolo</th><th>Tipo</th>
                      <th style={{textAlign:"right"}}>Giacenza</th>
                      <th style={{textAlign:"right"}}>Impegnato</th>
                      <th style={{textAlign:"right"}}>Disponibile</th>
                      <th style={{textAlign:"right"}}>Scorta min.</th>
                      <th>Stato</th>
                    </tr></thead>
                    <tbody>
                      {artFiltrati.map(a=>{
                        const gi=num(a.giacenza), imp=num(a.impegnato), disp=gi-imp, sc=num(a.scorta_minima);
                        const mql=num(a.mq_per_lastra);
                        const esaurito = disp<=0;
                        const sotto = !esaurito && sc>0 && disp<=sc;
                        return (
                          <tr key={a.id}>
                            <td className="rs">{a.nome_articolo||"—"}<div className="muted" style={{fontSize:12}}>{a.codice}</div></td>
                            <td className="muted" style={{textTransform:"capitalize"}}>{a.tipo||"—"}</td>
                            <td style={{textAlign:"right"}}>{gi}{a.unita?<span className="muted" style={{fontSize:12}}> {a.unita}</span>:null}
                              {mql>0 && <div className="muted" style={{fontSize:11}}>~{Math.round(gi/mql*10)/10} lastre</div>}</td>
                            <td style={{textAlign:"right"}} className="muted">
                              {imp>0
                                ? <button className="btn small" title="Vedi a quali commesse è assegnato" onClick={()=>setDettImp(a)}
                                    style={{padding:"1px 8px",fontWeight:700}}>{imp} 👥</button>
                                : "—"}</td>
                            <td style={{textAlign:"right",fontWeight:700,color:esaurito?"var(--danger)":sotto?"#b45309":"var(--ok)"}}>{disp}
                              {mql>0 && <div className="muted" style={{fontSize:11,fontWeight:400}}>~{Math.round(disp/mql*10)/10} lastre</div>}</td>
                            <td style={{textAlign:"right"}} className="muted">{sc||"—"}</td>
                            <td>{esaurito? <span className="tag" style={{background:"#fde8e8",color:"#c0392b"}}>Esaurito</span>
                                 : sotto? <span className="tag" style={{background:"#fff4e5",color:"#b26a00"}}>Sotto scorta</span>
                                 : <span className="tag" style={{background:"#e6f4ee",color:"#1f9c68"}}>Disponibile</span>}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>}
          </>
        ) : (
          <>
            <div className="toolbar">
              <div className="search"><span className="mag">🔍</span>
                <input placeholder="Cerca per articolo, causale, riferimento…" value={cerca} onChange={e=>setCerca(e.target.value)}/></div>
              <select className="btn" value={filtroTipo} onChange={e=>setFiltroTipo(e.target.value)} style={{maxWidth:170}}>
                <option value="">Tutti i movimenti</option>
                <option value="carico">Solo carichi</option>
                <option value="scarico">Solo scarichi</option>
                <option value="rettifica">Solo rettifiche</option>
              </select>
              <span className="muted">{filtrati.length} movimenti</span>
            </div>
            {movimenti===null ? <div className="empty">Caricamento…</div>
              : filtrati.length===0 ? <div className="card empty">Nessun movimento registrato. Inizia con "+ Nuovo movimento".</div>
              : <div className="card" style={{overflow:"auto"}}>
                  <table>
                    <thead><tr><th>Data</th><th>Articolo</th><th>Tipo</th><th>Quantità</th><th>Causale</th><th>Riferimento</th></tr></thead>
                    <tbody>
                      {filtrati.map(mv=>{
                        const a=movArt[mv.articolo_id]||{};
                        const seg = mv.tipo==="carico"?"+": mv.tipo==="scarico"?"−":"±";
                        const col = mv.tipo==="carico"?"var(--ok)": mv.tipo==="scarico"?"var(--danger)":"var(--muted)";
                        return (
                          <tr key={mv.id}>
                            <td className="muted">{dataIt(mv.data)}</td>
                            <td className="rs">{a.nome_articolo||"—"}<div className="muted" style={{fontSize:12}}>{a.codice}</div></td>
                            <td style={{textTransform:"capitalize"}}>{mv.tipo}</td>
                            <td style={{fontWeight:700,color:col}}>{seg}{Math.abs(mv.quantita)}</td>
                            <td className="muted">{mv.causale||"—"}</td>
                            <td className="muted">{mv.riferimento||"—"}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>}
          </>
        )}
      </div>
      {form && <MovimentoForm articoli={articoli||[]} profilo={profilo}
        onClose={()=>setForm(false)} onSalvato={()=>{setForm(false);carica();}}/>}
      {dettImp && (()=>{ const lista=impegni[dettImp.id]||[];
        const STLBL={aperta:"Aperta",in_produzione:"In produzione",pronta:"Pronta"};
        const totImp=lista.reduce((s,r)=>s+Number(r.quantita||0),0);
        return <div className="overlay">
          <div className="modal" style={{maxWidth:560}} onClick={e=>e.stopPropagation()}>
            <header>
              <div><h2>Materiale impegnato</h2>
                <span className="muted">{dettImp.nome_articolo}{dettImp.codice?" · "+dettImp.codice:""}</span></div>
              <button className="x" onClick={()=>setDettImp(null)}>×</button>
            </header>
            <div className="body">
              <div className="muted" style={{fontSize:13,marginBottom:10}}>
                Prenotato dalle commesse <b>attive</b> (non ancora scaricato). Impegnato totale: <b>{Math.round(totImp*100)/100}{dettImp.unita?" "+dettImp.unita:""}</b>.
              </div>
              {lista.length===0
                ? <div className="empty" style={{padding:14}}>Nessun dettaglio disponibile (l'impegno potrebbe essere stato appena scaricato — ricarica).</div>
                : <table>
                    <thead><tr><th>Commessa</th><th>Cliente</th><th>Stato</th><th style={{textAlign:"right"}}>Impegnato</th></tr></thead>
                    <tbody>
                      {lista.map((r,i)=><tr key={i}>
                        <td className="rs">{r.numero||"(bozza)"}</td>
                        <td>{r.cliente_nome||"—"}</td>
                        <td><span className="tag" style={{background:"#eef1fb",color:"#2f5bea"}}>{STLBL[r.stato]||r.stato}</span></td>
                        <td style={{textAlign:"right",fontWeight:700}}>{Math.round(Number(r.quantita)*100)/100}{dettImp.unita?<span className="muted" style={{fontSize:12}}> {dettImp.unita}</span>:null}</td>
                      </tr>)}
                    </tbody>
                  </table>}
            </div>
          </div>
        </div>; })()}
    </>
  );
}

/* ------------------------------------------------ registra movimento */
function MovimentoForm({articoli,profilo,onClose,onSalvato}){
  const [q,setQ]=useState("");
  const [sel,setSel]=useState(null);
  const [tipo,setTipo]=useState("carico");
  const [quantita,setQuantita]=useState("");
  const [target,setTarget]=useState("");
  const [causale,setCausale]=useState("");
  const [riferimento,setRiferimento]=useState("");
  const [note,setNote]=useState("");
  const [unitaAcq,setUnitaAcq]=useState("");   // unità d'acquisto: ""=base · "lastra" · "kg" · "pacco"
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");

  // Ricerca articolo lato SERVER: cosi' si trova QUALSIASI articolo del catalogo da caricare/scaricare,
  // anche quelli oggi a zero (non solo i materiali gia' a magazzino).
  const [risultati,setRisultati]=useState([]);
  useEffect(()=>{
    const s=q.trim().replace(/[,()*]/g," ");
    if(!s){ setRisultati([]); return; }
    const t=setTimeout(async()=>{
      const {data}=await sb.from("articoli_magazzino")
        .select("id,codice,nome_articolo,unita,giacenza,mq_per_lastra,grammatura,formato_l,formato_h,fogli_per_pacco")
        .or("nome_articolo.ilike.*"+s+"*,codice.ilike.*"+s+"*")
        .order("nome_articolo").limit(15);
      setRisultati(data||[]);
    },250);
    return ()=>clearTimeout(t);
  },[q]);

  const mql = sel? Number(sel.mq_per_lastra)||0 : 0;   // mq per lastra intera (0 = non a lastre)
  const isFoglio = sel? String(sel.unita||"").indexOf("foglio")===0 : false;
  const pf = sel? pesoFoglioKg(sel) : 0;               // kg per foglio
  const fpk = pf>0 ? 1/pf : 0;                          // fogli per kg
  const fpp = sel? Number(sel.fogli_per_pacco)||0 : 0;  // fogli per pacco
  // fattore di conversione dall'unità d'acquisto scelta all'unità base (con cui vive la giacenza)
  const conv = tipo==="rettifica" ? 1
    : unitaAcq==="lastra" && mql>0 ? mql
    : unitaAcq==="kg"     && fpk>0 ? fpk
    : unitaAcq==="pacco"  && fpp>0 ? fpp
    : 1;
  const qtaGrezza = (Number(quantita)||0)*conv;
  // i fogli sono pezzi interi: la conversione (es. kg -> fogli) si arrotonda per ECCESSO
  const qtaMq = isFoglio ? Math.ceil(qtaGrezza) : qtaGrezza;   // quantità convertita nell'unità base
  const giacAttuale = sel? Number(sel.giacenza||0):0;
  const nuovaGiac = !sel? 0
    : tipo==="carico" ? giacAttuale+qtaMq
    : tipo==="scarico" ? giacAttuale-qtaMq
    : target!=="" ? Number(target) : giacAttuale;

  async function salva(e){
    e.preventDefault();
    if(!sel){ setErr("Scegli un articolo."); return; }
    let qta;
    if(tipo==="rettifica"){
      if(target===""){ setErr("Indica la giacenza reale rilevata."); return; }
      qta = Number(target) - giacAttuale;
    } else {
      if(!Number(quantita) || Number(quantita)<=0){ setErr("Indica una quantità maggiore di zero."); return; }
      qta = qtaMq;   // salvo sempre in mq
    }
    setBusy(true); setErr("");
    const {error}=await sb.from("movimenti_magazzino").insert({
      articolo_id:sel.id, tipo, quantita:qta, causale, riferimento, note, creato_da:profilo.id
    });
    if(error){ setErr(error.message); setBusy(false); return; }
    onSalvato();
  }

  return (
    <div className="overlay">
      <form className="modal" style={{maxWidth:620}} onClick={e=>e.stopPropagation()} onSubmit={salva}>
        <header><h2>Nuovo movimento di magazzino</h2>
          <button type="button" className="x" onClick={onClose}>×</button></header>
        <div className="body">
          {err && <div className="banner err">{err}</div>}
          <div className="section">
            <h3>Articolo</h3>
            {sel
              ? <div className="subrow"><div className="hd">
                  <div><b>{sel.nome_articolo}</b> <span className="muted">{sel.codice}</span>
                    <div className="muted" style={{fontSize:13}}>Giacenza attuale: <b>{giacAttuale}</b></div></div>
                  <button type="button" className="btn small" onClick={()=>{setSel(null);setQ("");}}>Cambia</button>
                </div></div>
              : <>
                  <div className="field"><label>Cerca articolo (nome o codice)</label>
                    <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Digita per cercare…" autoFocus/></div>
                  {risultati.length>0 &&
                    <div className="card" style={{maxHeight:220,overflow:"auto"}}>
                      {risultati.map(a=>
                        <div key={a.id} onClick={()=>setSel(a)}
                             style={{padding:"8px 12px",borderBottom:"1px solid var(--line)",cursor:"pointer"}}>
                          <b>{a.nome_articolo}</b> <span className="muted">{a.codice}</span>
                          <span className="muted" style={{float:"right"}}>giac. {a.giacenza||0}</span>
                        </div>)}
                    </div>}
                  {q && risultati.length===0 && <div className="muted">Nessun articolo trovato.</div>}
                </>}
          </div>

          {sel && <div className="section">
            <h3>Movimento</h3>
            <div style={{display:"flex",gap:8,marginBottom:12}}>
              {["carico","scarico","rettifica"].map(t=>
                <button type="button" key={t} className="btn small"
                  style={tipo===t?{background:"var(--brand)",color:"#fff",borderColor:"var(--brand)"}:{}}
                  onClick={()=>{setTipo(t);setCausale("");}}>
                  {t==="carico"?"➕ Carico":t==="scarico"?"➖ Scarico":"✎ Rettifica"}</button>)}
            </div>
            {tipo!=="rettifica" && (mql>0 || (isFoglio&&(fpk>0||fpp>0))) &&
              <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
                <span className="muted" style={{fontSize:12,alignSelf:"center"}}>Carico/scarico in:</span>
                <button type="button" className="btn small" style={!unitaAcq?{background:"var(--brand)",color:"#fff",borderColor:"var(--brand)"}:{}}
                  onClick={()=>setUnitaAcq("")}>{sel&&sel.unita?sel.unita:"unità base"}</button>
                {mql>0 && <button type="button" className="btn small" style={unitaAcq==="lastra"?{background:"var(--brand)",color:"#fff",borderColor:"var(--brand)"}:{}}
                  onClick={()=>setUnitaAcq("lastra")}>lastre ({mql} mq/cad)</button>}
                {isFoglio && fpk>0 && <button type="button" className="btn small" style={unitaAcq==="kg"?{background:"var(--brand)",color:"#fff",borderColor:"var(--brand)"}:{}}
                  onClick={()=>setUnitaAcq("kg")}>kg (≈{Math.round(fpk*10)/10} fg/kg)</button>}
                {isFoglio && fpp>0 && <button type="button" className="btn small" style={unitaAcq==="pacco"?{background:"var(--brand)",color:"#fff",borderColor:"var(--brand)"}:{}}
                  onClick={()=>setUnitaAcq("pacco")}>pacchi ({fpp} fg/cad)</button>}
              </div>}
            {(()=>{ const uLbl=unitaAcq==="lastra"?"lastre":unitaAcq==="kg"?"kg":unitaAcq==="pacco"?"pacchi":(sel&&sel.unita?sel.unita:"");
              const baseLbl=sel&&sel.unita?sel.unita:"";
              return tipo==="rettifica"
              ? <div className="field" style={{maxWidth:260}}><label>Giacenza reale rilevata {baseLbl?"("+baseLbl+")":""}</label>
                  <input type="number" step="0.01" value={target} onChange={e=>setTarget(e.target.value)} autoFocus/></div>
              : <div className="field" style={{maxWidth:260}}><label>Quantità {uLbl?"("+uLbl+")":""}</label>
                  <input type="number" step="0.01" min="0" value={quantita} onChange={e=>setQuantita(e.target.value)} autoFocus/>
                  {unitaAcq && conv!==1 && <div className="muted" style={{fontSize:12,marginTop:3}}>= <b>{Math.round(qtaMq*100)/100} {baseLbl}</b></div>}</div>; })()}
            <div className="field"><label>Causale</label>
              <select value={causale} onChange={e=>setCausale(e.target.value)}>
                <option value="">—</option>
                {(CAUSALI[tipo]||[]).map(c=><option key={c} value={c}>{c}</option>)}
              </select></div>
            <div className="field"><label>Riferimento (n° documento, ordine…)</label>
              <input value={riferimento} onChange={e=>setRiferimento(e.target.value)}/></div>
            <div className="field"><label>Note</label>
              <textarea rows={2} value={note} onChange={e=>setNote(e.target.value)}/></div>
            <div className="banner info">Giacenza dopo il movimento: <b>{nuovaGiac}</b>
              {nuovaGiac<0 && <span style={{color:"var(--danger)"}}> — attenzione: diventa negativa</span>}</div>
          </div>}
        </div>
        <footer>
          <button type="button" className="btn" onClick={onClose}>Annulla</button>
          <button className="btn primary" disabled={busy||!sel}>{busy?<span className="spin"/>:"Registra movimento"}</button>
        </footer>
      </form>
    </div>
  );
}

/* ================================================================ PEZZI & ETICHETTE (magazzino, Fase A) */
function ModuloPezzi({profilo,perm}){
  const [pezzi,setPezzi]=useState(null);
  const [err,setErr]=useState("");
  const [form,setForm]=useState(false);
  const [rientro,setRientro]=useState(null);
  const [valorizza,setValorizza]=useState(null);
  const [storia,setStoria]=useState(null);
  const [fStato,setFStato]=useState("");
  const [cerca,setCerca]=useState("");

  const carica=useCallback(async()=>{
    setErr("");
    const {data,error}=await sb.from("magazzino_pezzi_op").select("*").order("creato_il",{ascending:false}).limit(300);
    if(error){ setErr(error.message); return; }
    let list=data||[];
    if(perm.economici){
      const [cst,art]=await Promise.all([
        sb.from("magazzino_pezzi").select("id,costo,valorizzazione"),
        caricaArticoliTutti("id,costo"),
      ]);
      const cm={}; (cst.data||[]).forEach(x=>cm[x.id]=x);
      const am={}; (art||[]).forEach(x=>am[x.id]=Number(x.costo)||0);
      list=list.map(p=>({...p, costo: cm[p.id]?cm[p.id].costo:null,
        valorizzazione: cm[p.id]?cm[p.id].valorizzazione:null, _artcosto: am[p.articolo_id]||0}));
    }
    setPezzi(list);
  },[perm.economici]);
  useEffect(()=>{ carica(); },[carica]);

  const filtrati=useMemo(()=>{
    if(!pezzi) return [];
    const q=cerca.trim().toLowerCase();
    return pezzi.filter(p=>{
      if(fStato && p.stato!==fStato) return false;
      if(!q) return true;
      return [p.codice,p.nome_articolo,p.articolo_codice].join(" ").toLowerCase().includes(q);
    });
  },[pezzi,cerca,fStato]);

  const colStato=s=>({in_magazzino:"var(--ok)",uscito:"var(--warn)",consumato:"var(--muted)",rientrato:"var(--brand)",perso:"var(--danger)"}[s]||"var(--muted)");
  const mis=p=>[p.larghezza_cm,p.altezza_cm].filter(v=>v!=null&&v!=="").join("×");

  return (
    <>
      <div className="topbar">
        <h1>Pezzi &amp; Etichette</h1>
        {perm.magazzino && <button className="btn" onClick={()=>setRientro({})}>↩ Registra rientro</button>}
        {perm.magazzino && <button className="btn primary" onClick={()=>setForm(true)}>+ Prepara per commessa</button>}
      </div>
      <div className="content">
        {err && <div className="banner err">{err}</div>}
        <div className="banner info">Il pezzo tracciato nasce qui, al <b>prelievo</b>: genera l'etichetta col codice a barre, aggancia il materiale alla commessa e scala la giacenza neutra.</div>
        {perm.economici && (()=>{ const av=filtrati.filter(p=>p.stato==="in_magazzino");
          if(!av.length) return null;
          const nz=av.filter(p=>Number(p.costo)===0).length;
          const vt=av.reduce((s,p)=>s+(Number(p.costo)||0),0);
          return <div className="banner info">♻️ Materiale recuperato a scaffale: <b>{av.length}</b> avanzi · <b>{nz}</b> a costo zero (già pagati) · valore residuo <b>{eur(vt)}</b>. Gli avanzi a costo zero sono la <b>leva</b> sui prezzi futuri.</div>; })()}
        <div className="toolbar">
          <div className="search"><span className="mag">🔍</span>
            <input placeholder="Cerca per codice o materiale…" value={cerca} onChange={e=>setCerca(e.target.value)}/></div>
          <select className="btn" value={fStato} onChange={e=>setFStato(e.target.value)} style={{maxWidth:200}}>
            <option value="">Tutti gli stati</option>
            <option value="in_magazzino">In magazzino</option>
            <option value="uscito">Uscito (in commessa)</option>
            <option value="rientrato">Rientrato (avanzo)</option>
            <option value="consumato">Consumato</option>
            <option value="perso">Perso</option>
          </select>
          <span className="muted">{filtrati.length} pezzi</span>
        </div>
        {pezzi===null ? <div className="empty">Caricamento…</div>
          : filtrati.length===0 ? <div className="card empty">Nessun pezzo tracciato. Inizia con "+ Prepara per commessa".</div>
          : <div className="card" style={{overflow:"auto"}}>
              <table>
                <thead><tr><th>Codice</th><th>Materiale</th><th>Misure (cm)</th><th>mq</th><th>Stato</th><th>Commessa</th>{perm.economici && <th>Valore</th>}<th></th></tr></thead>
                <tbody>
                  {filtrati.map(p=>(
                    <tr key={p.id}>
                      <td className="rs" style={{fontFamily:"monospace"}}>{p.codice}</td>
                      <td>{p.nome_articolo||"—"}<div className="muted" style={{fontSize:12}}>{p.articolo_codice||""}</div></td>
                      <td>{mis(p)||"—"}{p.spessore_mm?(" · "+p.spessore_mm+"mm"):""}</td>
                      <td className="muted">{p.mq!=null?p.mq:"—"}</td>
                      <td><span style={{background:colStato(p.stato),color:"#fff",borderRadius:20,padding:"2px 9px",fontSize:12,fontWeight:700}}>{String(p.stato||"").replace("_"," ")}</span></td>
                      <td className="muted">{p.commessa_numero||"—"}</td>
                      {perm.economici && <td>{p.costo!=null ? (Number(p.costo)===0 ? <span style={{color:"var(--ok)",fontWeight:700}}>€0 · già pagato</span> : eur(p.costo)) : <span className="muted">—</span>}</td>}
                      <td style={{whiteSpace:"nowrap"}}>
                        {p.stato==="uscito" && <button className="btn small" onClick={()=>setRientro({pezzo:p})}>↩ Rientro</button>}{" "}
                        {perm.economici && p.stato==="in_magazzino" && <button className="btn small" onClick={()=>setValorizza(p)}>💶 Valorizza</button>}{" "}
                        <button className="btn small" title="Storia del pezzo (origine, commessa, avanzi)" onClick={()=>setStoria(p)}>🕓</button>{" "}
                        <button className="btn small" title="Ristampa etichetta" onClick={()=>stampaHTML(htmlEtichetta({codice:p.codice,articolo:p.nome_articolo,larghezza_cm:p.larghezza_cm,altezza_cm:p.altezza_cm,spessore_mm:p.spessore_mm,commessa:p.commessa_numero?("Commessa "+p.commessa_numero):""}))}>🏷️</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>}
      </div>
      {form && <PreparaPezzoForm profilo={profilo} onClose={()=>setForm(false)} onFatto={()=>{setForm(false);carica();}}/>}
      {rientro && <RientroForm pezzoIniziale={rientro.pezzo||null} onClose={()=>setRientro(null)} onFatto={()=>{setRientro(null);carica();}}/>}
      {valorizza && <ValorizzaModal pezzo={valorizza} onClose={()=>setValorizza(null)} onSalvato={()=>{setValorizza(null);carica();}}/>}
      {storia && <StoriaPezzo pezzo={storia} perm={perm} onClose={()=>setStoria(null)}/>}
    </>
  );
}

/* ------------------------------------------------ storia/genealogia di un pezzo (origine commessa, avanzi) */
function StoriaPezzo({pezzo,perm,onClose}){
  const [catena,setCatena]=useState(null);   // dall'origine fino a questo pezzo
  const [figli,setFigli]=useState([]);
  useEffect(()=>{ let vivo=true;
    (async()=>{
      const chain=[pezzo]; let cur=pezzo, guard=0;
      while(cur && cur.pezzo_padre_id && guard<20){
        const {data}=await sb.from("magazzino_pezzi_op").select("*").eq("id",cur.pezzo_padre_id).maybeSingle();
        if(!data) break; chain.unshift(data); cur=data; guard++;
      }
      const {data:ch}=await sb.from("magazzino_pezzi_op").select("*").eq("pezzo_padre_id",pezzo.id).order("creato_il");
      if(!vivo) return; setCatena(chain); setFigli(ch||[]);
    })();
    return ()=>{vivo=false;};
  },[pezzo.id]);
  const fmt=d=>d? new Date(d).toLocaleString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
  const mis=p=>[p.larghezza_cm,p.altezza_cm].filter(v=>v!=null&&v!=="").join("×");
  const STL={uscito:{l:"in lavorazione",c:"#b26a00"},in_magazzino:{l:"a magazzino",c:"#1f9c68"},consumato:{l:"consumato",c:"#5b6773"},perso:{l:"perso",c:"#c0392b"}};
  const origine=(catena||[]).find(n=>n.commessa_numero);
  const nodo=(p,corrente)=>{ const s=STL[p.stato]||{l:p.stato,c:"#333"};
    return <div key={p.id} style={{border:"1px solid var(--line)",borderRadius:10,padding:"9px 12px",marginBottom:6,
      background:corrente?"#eef4ff":"#fff",borderColor:corrente?"#2f5bea":"var(--line)"}}>
      <div style={{display:"flex",justifyContent:"space-between",gap:8,flexWrap:"wrap"}}>
        <span style={{fontFamily:"monospace",fontWeight:700}}>{p.codice}{corrente?" ← questo":""}</span>
        <span className="tag" style={{background:"#f2f4f7",color:s.c}}>{s.l}</span>
      </div>
      <div className="muted" style={{fontSize:12.5,marginTop:2}}>
        {p.nome_articolo||"—"}{mis(p)?" · "+mis(p)+" cm":""}{p.mq!=null?" · "+p.mq+" mq":""}
        {p.commessa_numero?<> · commessa <b>{p.commessa_numero}</b></>:""}
      </div>
      <div className="muted" style={{fontSize:11,marginTop:2}}>📅 {fmt(p.creato_il)}{p.ubicazione?" · 📍 "+p.ubicazione:""}</div>
    </div>; };
  return (
    <div className="overlay"><div className="modal" style={{maxWidth:560}} onClick={e=>e.stopPropagation()}>
      <header><div><h2>🕓 Storia del pezzo</h2><span className="muted" style={{fontFamily:"monospace"}}>{pezzo.codice}</span></div>
        <button className="x" onClick={onClose}>×</button></header>
      <div className="body">
        {catena===null? <div className="empty">Caricamento…</div>
          : <>
              {origine
                ? <div className="banner info" style={{fontSize:13}}>Proviene dalla <b>commessa {origine.commessa_numero}</b>{origine.codice!==pezzo.codice?<> (lastra d'origine <span style={{fontFamily:"monospace"}}>{origine.codice}</span>)</>:null}.</div>
                : <div className="muted" style={{fontSize:13,marginBottom:8}}>Nessuna commessa d'origine collegata.</div>}
              <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",color:"var(--muted)",margin:"8px 0 6px"}}>Catena (dall'origine a questo pezzo)</div>
              {catena.map((p,i)=>nodo(p, p.id===pezzo.id))}
              {figli.length>0 && <>
                <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",color:"var(--muted)",margin:"12px 0 6px"}}>Avanzi ricavati da questo pezzo</div>
                {figli.map(p=>nodo(p,false))}
              </>}
            </>}
      </div>
      <footer><button className="btn primary" onClick={onClose}>Chiudi</button></footer>
    </div></div>
  );
}

/* ------------------------------------------------ prepara materiale per la commessa (nascita del pezzo) */
function PreparaPezzoForm({profilo,onClose,onFatto}){
  const [commesse,setCommesse]=useState([]);
  const [articoli,setArticoli]=useState([]);
  const [commessaId,setCommessaId]=useState("");
  const [q,setQ]=useState(""); const [art,setArt]=useState(null);
  const [larg,setLarg]=useState(""); const [alt,setAlt]=useState(""); const [sp,setSp]=useState("");
  const [qta,setQta]=useState(1); const [ubic,setUbic]=useState(""); const [note,setNote]=useState("");
  const [busy,setBusy]=useState(false); const [err,setErr]=useState("");
  const [fatto,setFatto]=useState(null);
  const [matCommessa,setMatCommessa]=useState([]);   // materiali della commessa scelta

  useEffect(()=>{ (async()=>{
    const [c,a]=await Promise.all([
      sb.from("commesse").select("id,numero,cliente_nome,stato").in("stato",["aperta","in_produzione","pronta"]).order("data_consegna",{ascending:true}),
      caricaArticoliTutti("id,codice,nome_articolo,unita",{tabella:"articoli_magazzino"}),
    ]);
    setCommesse(c.data||[]); setArticoli(a);
  })(); },[]);

  const artById=useMemo(()=>{ const m={}; articoli.forEach(a=>m[a.id]=a); return m; },[articoli]);
  // materiali agganciati alla commessa scelta (dai consumi e dalle righe)
  useEffect(()=>{ if(!commessaId){ setMatCommessa([]); return; } let vivo=true;
    sb.from("commesse").select("consumi, commesse_righe(articolo_id,descrizione)").eq("id",commessaId).maybeSingle()
      .then(({data})=>{ if(!vivo) return;
        const ids=new Map();
        (Array.isArray(data&&data.consumi)?data.consumi:[]).forEach(c=>{ if(c&&c.articolo_id) ids.set(c.articolo_id, {descrizione:c.descrizione||"", pagato_intero:c.pagato_intero!==false}); });
        (data&&data.commesse_righe||[]).forEach(r=>{ if(r.articolo_id && !ids.has(r.articolo_id)) ids.set(r.articolo_id, {descrizione:r.descrizione||"", pagato_intero:true}); });
        setMatCommessa([...ids.keys()].map(id=>({articolo_id:id, descrizione:ids.get(id).descrizione, pagato_intero:ids.get(id).pagato_intero})));
      });
    return ()=>{vivo=false;};
  },[commessaId]);

  const ris=useMemo(()=>{ const s=q.trim().toLowerCase(); if(!s) return [];
    return articoli.filter(a=>[a.nome_articolo,a.codice].join(" ").toLowerCase().includes(s)).slice(0,12); },[q,articoli]);
  const mq=((Number(larg)||0)*(Number(alt)||0)/10000)*(Number(qta)||1);

  const matSel = art ? matCommessa.find(m=>m.articolo_id===art.id) : null;
  const pagatoScelto = matSel ? matSel.pagato_intero!==false : true;   // deciso dal commerciale nel preventivo

  async function prepara(e){
    e.preventDefault();
    if(!commessaId){ setErr("Scegli la commessa."); return; }
    if(!art){ setErr("Scegli il materiale."); return; }
    setBusy(true); setErr("");
    const {data,error}=await sb.rpc("preleva_per_commessa",{
      p_articolo_id:art.id, p_commessa_id:commessaId,
      p_larghezza:larg===""?null:Number(larg), p_altezza:alt===""?null:Number(alt),
      p_spessore:sp===""?null:Number(sp), p_quantita:Number(qta)||1,
      p_ubicazione:ubic, p_note:note, p_pagato_intero:pagatoScelto,
    });
    if(error){ setErr(error.message); setBusy(false); return; }
    const com=commesse.find(c=>c.id===commessaId);
    setFatto({codice:data, articolo:art.nome_articolo, larghezza_cm:larg, altezza_cm:alt, spessore_mm:sp, commessa: com?("Commessa "+com.numero):""});
    setBusy(false);
  }

  if(fatto) return (
    <div className="overlay">
      <div className="modal" style={{maxWidth:460}}>
        <header><h2>Etichetta pronta</h2><button type="button" className="x" onClick={onFatto}>×</button></header>
        <div className="body" style={{textAlign:"center"}}>
          <div className="banner info">Pezzo <b>{fatto.codice}</b> creato e agganciato alla commessa. Giacenza neutra aggiornata.</div>
          <div style={{margin:"14px 0"}} dangerouslySetInnerHTML={{__html:code128SVG(fatto.codice,2,60)}}/>
          <div style={{fontFamily:"monospace",fontSize:16,letterSpacing:1}}>{fatto.codice}</div>
        </div>
        <footer>
          <button type="button" className="btn" onClick={onFatto}>Chiudi</button>
          <button type="button" className="btn primary" onClick={()=>stampaHTML(htmlEtichetta(fatto))}>🖨️ Stampa etichetta</button>
        </footer>
      </div>
    </div>
  );

  return (
    <div className="overlay">
      <form className="modal" style={{maxWidth:620}} onSubmit={prepara}>
        <header><h2>Prepara materiale per la commessa</h2><button type="button" className="x" onClick={onClose}>×</button></header>
        <div className="body">
          {err && <div className="banner err">{err}</div>}
          <div className="field"><label>Commessa</label>
            <select value={commessaId} onChange={e=>setCommessaId(e.target.value)}>
              <option value="">— scegli —</option>
              {commesse.map(c=><option key={c.id} value={c.id}>{c.numero} · {c.cliente_nome}</option>)}
            </select>
            {commesse.length===0 && <div className="muted" style={{fontSize:13,marginTop:4}}>Nessuna commessa aperta/in produzione.</div>}
          </div>
          <div className="section">
            <h3>Materiale (lastra neutra)</h3>
            {art
              ? <><div className="subrow"><div className="hd">
                  <div><b>{art.nome_articolo}</b> <span className="muted">{art.codice}</span></div>
                  <button type="button" className="btn small" onClick={()=>{setArt(null);setQ("");}}>Cambia</button>
                </div></div>
                {matSel && <div className="banner" style={{background:pagatoScelto?"#e7f6ec":"#fdecec",color:pagatoScelto?"#127a3e":"#c0392b",fontSize:12.5}}>
                  {pagatoScelto
                    ? "💶 Deciso nel preventivo: il cliente paga l'intera lastra → l'eventuale avanzo tornerà a €0."
                    : "💶 Deciso nel preventivo: il cliente paga solo la parte usata → l'eventuale avanzo tornerà a costo d'acquisto."}
                </div>}</>
              : <>
                  {commessaId && (()=>{ const chips=matCommessa.map(m=>artById[m.articolo_id]).filter(Boolean);
                    return chips.length>0
                      ? <div style={{marginBottom:10}}>
                          <label style={{fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:.03,color:"var(--muted)"}}>Materiali di questa commessa</label>
                          <div style={{display:"flex",flexWrap:"wrap",gap:6,margin:"6px 0 4px"}}>
                            {chips.map(a=><button type="button" key={a.id} className="btn small" onClick={()=>{setArt(a);setQ("");}}>{a.nome_articolo} <span className="muted">{a.codice}</span></button>)}
                          </div>
                          <div className="muted" style={{fontSize:12}}>oppure cerca in tutto il magazzino:</div>
                        </div>
                      : <div className="muted" style={{fontSize:12.5,marginBottom:8}}>Questa commessa non ha materiali di magazzino agganciati: cercalo qui sotto.</div>; })()}
                  <div className="field"><label>Cerca materiale (nome o codice)</label>
                    <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Digita per cercare…"/></div>
                  {ris.length>0 && <div className="card" style={{maxHeight:200,overflow:"auto"}}>
                    {ris.map(a=><div key={a.id} onClick={()=>setArt(a)} style={{padding:"8px 12px",borderBottom:"1px solid var(--line)",cursor:"pointer"}}>
                      <b>{a.nome_articolo}</b> <span className="muted">{a.codice}</span></div>)}
                  </div>}
                  {q && ris.length===0 && <div className="muted">Nessun materiale trovato.</div>}
                </>}
          </div>
          <div className="section">
            <h3>Misure del pezzo che mandi in produzione</h3>
            <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
              <div className="field" style={{maxWidth:130}}><label>Larghezza (cm)</label><input type="number" step="0.1" min="0" value={larg} onChange={e=>setLarg(e.target.value)}/></div>
              <div className="field" style={{maxWidth:130}}><label>Altezza (cm)</label><input type="number" step="0.1" min="0" value={alt} onChange={e=>setAlt(e.target.value)}/></div>
              <div className="field" style={{maxWidth:130}}><label>Spessore (mm)</label><input type="number" step="0.01" min="0" value={sp} onChange={e=>setSp(e.target.value)}/></div>
              <div className="field" style={{maxWidth:100}}><label>Quantità</label><input type="number" min="1" value={qta} onChange={e=>setQta(e.target.value)}/></div>
            </div>
            <div className="banner info">Scala dalla giacenza neutra: <b>{mq>0?mq.toFixed(3)+" mq":"— (inserisci le misure)"}</b></div>
          </div>
          <div className="field"><label>Ubicazione (facoltativo)</label><input value={ubic} onChange={e=>setUbic(e.target.value)}/></div>
          <div className="field"><label>Note (facoltativo)</label><input value={note} onChange={e=>setNote(e.target.value)}/></div>
        </div>
        <footer>
          <button type="button" className="btn" onClick={onClose}>Annulla</button>
          <button className="btn primary" disabled={busy}>{busy?<span className="spin"/>:"Genera etichetta e aggancia"}</button>
        </footer>
      </form>
    </div>
  );
}

/* ------------------------------------------------ rientro del pezzo dopo la lavorazione (avanzo / consumato / perso) */
function RientroForm({pezzoIniziale,onClose,onFatto}){
  const [code,setCode]=useState(pezzoIniziale?pezzoIniziale.codice:"");
  const [pezzo,setPezzo]=useState(pezzoIniziale||null);
  const [esito,setEsito]=useState("avanzo");
  const [larg,setLarg]=useState(""); const [alt,setAlt]=useState(""); const [sp,setSp]=useState("");
  const [qta,setQta]=useState(1); const [ubic,setUbic]=useState(""); const [note,setNote]=useState("");
  const [busy,setBusy]=useState(false); const [err,setErr]=useState("");
  const [fatto,setFatto]=useState(null);

  const mis=p=>[p.larghezza_cm,p.altezza_cm].filter(v=>v!=null&&v!=="").join("×");

  async function cerca(e){
    if(e) e.preventDefault();
    setErr("");
    const c=code.trim(); if(!c){ setErr("Scansiona o digita il codice del pezzo."); return; }
    const {data,error}=await sb.from("magazzino_pezzi_op").select("*").eq("codice",c).maybeSingle();
    if(error){ setErr(error.message); return; }
    if(!data){ setErr("Codice non trovato."); return; }
    if(data.stato!=="uscito"){ setErr("Questo pezzo non è in lavorazione (stato: "+String(data.stato).replace("_"," ")+")."); return; }
    setPezzo(data);
  }

  async function conferma(){
    if(esito==="avanzo" && !(Number(larg)>0 && Number(alt)>0)){ setErr("Inserisci le misure dell'avanzo rientrato."); return; }
    setBusy(true); setErr("");
    const {data,error}=await sb.rpc("registra_rientro",{
      p_pezzo_id:pezzo.id, p_esito:esito,
      p_larghezza:larg===""?null:Number(larg), p_altezza:alt===""?null:Number(alt),
      p_spessore:sp===""?null:Number(sp), p_quantita:Number(qta)||1,
      p_ubicazione:ubic, p_note:note,
    });
    if(error){ setErr(error.message); setBusy(false); return; }
    if(esito==="avanzo" && data){
      setFatto({codice:data, articolo:pezzo.nome_articolo, larghezza_cm:larg, altezza_cm:alt, spessore_mm:sp, commessa:""});
      setBusy(false);
    } else { setBusy(false); onFatto(); }
  }

  if(fatto) return (
    <div className="overlay">
      <div className="modal" style={{maxWidth:460}}>
        <header><h2>Avanzo registrato</h2><button type="button" className="x" onClick={onFatto}>×</button></header>
        <div className="body" style={{textAlign:"center"}}>
          <div className="banner info">Nuovo avanzo <b>{fatto.codice}</b> a scaffale, riutilizzabile. Attacca l'etichetta sul ritaglio.</div>
          <div style={{margin:"14px 0"}} dangerouslySetInnerHTML={{__html:code128SVG(fatto.codice,2,60)}}/>
          <div style={{fontFamily:"monospace",fontSize:16,letterSpacing:1}}>{fatto.codice}</div>
        </div>
        <footer>
          <button type="button" className="btn" onClick={onFatto}>Chiudi</button>
          <button type="button" className="btn primary" onClick={()=>stampaHTML(htmlEtichetta(fatto))}>🖨️ Stampa etichetta avanzo</button>
        </footer>
      </div>
    </div>
  );

  return (
    <div className="overlay">
      <div className="modal" style={{maxWidth:560}}>
        <header><h2>Registra rientro</h2><button type="button" className="x" onClick={onClose}>×</button></header>
        <div className="body">
          {err && <div className="banner err">{err}</div>}
          {!pezzo
            ? <form onSubmit={cerca}>
                <div className="field"><label>Codice pezzo (scansiona con la pistola o digita)</label>
                  <input value={code} onChange={e=>setCode(e.target.value)} placeholder="PZ-000001" autoFocus/></div>
                <button className="btn primary" type="submit">Cerca</button>
              </form>
            : <>
                <div className="subrow"><div className="hd">
                  <div><b>{pezzo.codice}</b> · {pezzo.nome_articolo||"—"}
                    <div className="muted" style={{fontSize:13}}>{mis(pezzo)?mis(pezzo)+" cm":""}{pezzo.commessa_numero?(" · commessa "+pezzo.commessa_numero):""}</div></div>
                </div></div>
                <div className="section">
                  <h3>Cosa è successo</h3>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
                    {[["avanzo","↩ È rientrato un avanzo"],["consumato","✓ Tutto consumato"],["perso","⚠ Perso per errore"]].map(([v,l])=>
                      <button type="button" key={v} className="btn small"
                        style={esito===v?{background:"var(--brand)",color:"#fff",borderColor:"var(--brand)"}:{}}
                        onClick={()=>{setEsito(v);setErr("");}}>{l}</button>)}
                  </div>
                  {esito==="avanzo" && <>
                    <p className="muted" style={{fontSize:13,margin:"0 0 8px"}}>Misura il ritaglio: nasce un nuovo pezzo con la sua etichetta.</p>
                    <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                      <div className="field" style={{maxWidth:130}}><label>Larghezza (cm)</label><input type="number" step="0.1" min="0" value={larg} onChange={e=>setLarg(e.target.value)} autoFocus/></div>
                      <div className="field" style={{maxWidth:130}}><label>Altezza (cm)</label><input type="number" step="0.1" min="0" value={alt} onChange={e=>setAlt(e.target.value)}/></div>
                      <div className="field" style={{maxWidth:130}}><label>Spessore (mm)</label><input type="number" step="0.01" min="0" value={sp} onChange={e=>setSp(e.target.value)}/></div>
                      <div className="field" style={{maxWidth:100}}><label>Quantità</label><input type="number" min="1" value={qta} onChange={e=>setQta(e.target.value)}/></div>
                    </div>
                    <div className="field"><label>Ubicazione (facoltativo)</label><input value={ubic} onChange={e=>setUbic(e.target.value)}/></div>
                  </>}
                  {esito==="perso" && <>
                    <div className="banner err" style={{marginBottom:8}}>Materiale perso per errore interno: non lo paga il cliente. Il costo a carico della commessa (che intacca il margine) sarà gestito con la Fase C.</div>
                    <div className="field"><label>Motivo / nota</label><input value={note} onChange={e=>setNote(e.target.value)} placeholder="Es. lastra rovinata al taglio"/></div>
                  </>}
                  {esito==="consumato" && <p className="muted" style={{fontSize:13}}>Tutto il materiale è stato usato per la commessa: nessun avanzo rientra.</p>}
                </div>
              </>}
        </div>
        {pezzo && <footer>
          <button type="button" className="btn" onClick={onClose}>Annulla</button>
          <button type="button" className="btn primary" disabled={busy} onClick={conferma}>{busy?<span className="spin"/>:"Conferma rientro"}</button>
        </footer>}
      </div>
    </div>
  );
}

/* ------------------------------------------------ valorizza un avanzo (solo economici): costo zero / acquisto / manuale */
function ValorizzaModal({pezzo,onClose,onSalvato}){
  const [modo,setModo]=useState(Number(pezzo.costo)===0?"zero":(pezzo.valorizzazione||"zero"));
  const [costo,setCosto]=useState(pezzo.costo!=null?String(pezzo.costo):"");
  const [busy,setBusy]=useState(false); const [err,setErr]=useState("");
  const mq=Number(pezzo.mq)||0;
  const acquisto=Math.round(mq*(Number(pezzo._artcosto)||0)*100)/100;

  async function salva(){
    setBusy(true); setErr("");
    let c, val;
    if(modo==="zero"){ c=0; val="zero"; }
    else if(modo==="acquisto"){ c=acquisto; val="acquisto"; }
    else { c=Number(costo)||0; val="manuale"; }
    const {error}=await sb.from("magazzino_pezzi").update({costo:c,valorizzazione:val}).eq("id",pezzo.id);
    if(error){ setErr(error.message); setBusy(false); return; }
    onSalvato();
  }

  return (
    <div className="overlay"><div className="modal" style={{maxWidth:460}}>
      <header><h2>Valorizza avanzo</h2><button type="button" className="x" onClick={onClose}>×</button></header>
      <div className="body">
        {err && <div className="banner err">{err}</div>}
        <div className="muted" style={{fontSize:13,marginBottom:12}}><b>{pezzo.codice}</b> · {pezzo.nome_articolo||""}{mq?(" · "+mq+" mq"):""}</div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <label style={{display:"flex",gap:8,alignItems:"flex-start"}}><input type="radio" name="v" checked={modo==="zero"} onChange={()=>setModo("zero")} style={{width:"auto",marginTop:3}}/>
            <span><b>Costo zero</b> — già pagato dalla commessa d'origine. È la <b>leva</b> per il commerciale sui prezzi futuri.</span></label>
          <label style={{display:"flex",gap:8,alignItems:"flex-start"}}><input type="radio" name="v" checked={modo==="acquisto"} onChange={()=>setModo("acquisto")} style={{width:"auto",marginTop:3}}/>
            <span><b>Costo d'acquisto</b> — <b>{eur(acquisto)}</b> (mq × costo materiale del catalogo).</span></label>
          <label style={{display:"flex",gap:8,alignItems:"flex-start"}}><input type="radio" name="v" checked={modo==="manuale"} onChange={()=>setModo("manuale")} style={{width:"auto",marginTop:3}}/>
            <span><b>Manuale</b> — imposto io il valore.</span></label>
          {modo==="manuale" && <input type="number" step="0.01" min="0" value={costo} onChange={e=>setCosto(e.target.value)} placeholder="€" style={{maxWidth:180,marginLeft:24}}/>}
        </div>
      </div>
      <footer>
        <button type="button" className="btn" onClick={onClose}>Annulla</button>
        <button type="button" className="btn primary" disabled={busy} onClick={salva}>{busy?<span className="spin"/>:"Salva valore"}</button>
      </footer>
    </div></div>
  );
}

/* ================================================================ IMPOSTAZIONI (5.9 - parziale) */
// prezzo di vendita di una tariffa = costo × (1 + margine%)
function prezzoVend(r){ const c=Number(r.tariffa_oraria)||0, m=Number(r.margine_obiettivo)||0; return c>0? Math.round(c*(1+m/100)*100)/100 : ""; }
// quota di una voce che finisce nei costi di struttura (per i "misti" = annuo − ore produzione × costo orario)
// categorie di costo struttura che ammettono la divisione "misto" (persona / condiviso)
function catAmmetteMisto(v){ return v==="personale_indiretto" || v==="altro"; }
function importoStruttura(x){
  if(x && x.misto && catAmmetteMisto(x.categoria)){ const annuo=Number(x.costo_annuo)||0, oreP=Number(x.ore_produzione)||0, ch=Number(x.costo_orario)||0;
    return Math.max(0, annuo - oreP*ch); }
  return Number(x&&x.importo)||0;
}
// quota di un OPERATORE che finisce nei costi di struttura, in base al tipo
function quotaStrutturaOp(o){
  if(!o) return 0;
  if(o.tipo==="struttura") return Number(o.costo_annuo)||0;
  if(o.tipo==="misto"){ const annuo=Number(o.costo_annuo)||0, oreP=Number(o.ore_produzione)||0, ch=Number(o.costo_orario)||0;
    return Math.max(0, annuo - oreP*ch); }
  return 0;
}
// quota di un OPERATORE che finisce nei costi DIRETTI (manodopera di produzione)
function quotaProduzioneOp(o){
  if(!o) return 0;
  if(o.tipo==="produzione") return Number(o.costo_annuo)||0;
  if(o.tipo==="misto") return (Number(o.ore_produzione)||0)*(Number(o.costo_orario)||0);
  return 0;
}
const TIPI_OPERATORE=[
  {v:"produzione",l:"Produzione"},
  {v:"misto",l:"Misto (produzione + ufficio)"},
  {v:"struttura",l:"Solo struttura (indiretto)"},
];
// Bozza impostazioni (anti-perdita, come nei preventivi)
const BOZZA_IMP_KEY="gest_bozza_impostazioni";
function leggiBozzaImp(){ try{ return JSON.parse(localStorage.getItem(BOZZA_IMP_KEY)||"null"); }catch(e){ return null; } }
function scriviBozzaImp(o){ try{ localStorage.setItem(BOZZA_IMP_KEY, JSON.stringify({...o,ts:Date.now()})); }catch(e){} }
function cancellaBozzaImp(){ try{ localStorage.removeItem(BOZZA_IMP_KEY); }catch(e){} }

/* ---- opzioni di spedizione Komunigo (gestite dalle Impostazioni) ---- */
function SpedizioniKomunigo({perm}){
  const [rows,setRows]=useState(null);
  const [err,setErr]=useState(""); const [ok,setOk]=useState("");
  const carica=useCallback(async()=>{
    setErr("");
    const {data,error}=await sb.from("komunigo_spedizioni").select("*").order("ordine");
    if(error){ setErr(error.message); setRows([]); return; }
    setRows(data||[]);
  },[]);
  useEffect(()=>{ carica(); },[carica]);

  const set=(i,k,v)=>setRows(p=>p.map((r,j)=>j===i?{...r,[k]:v}:r));
  const addRow=()=>setRows(p=>[...(p||[]),{_nuovo:true, id:"n"+Date.now(), nome:"", descrizione:"", prezzo:0, ritiro:false, ordine:(p&&p.length)||0, attivo:true}]);
  async function salva(r){
    setErr(""); setOk("");
    const payload={nome:(r.nome||"").trim(), descrizione:r.descrizione||"", prezzo:Number(r.prezzo)||0, ritiro:!!r.ritiro, ordine:Number(r.ordine)||0, attivo:r.attivo!==false};
    if(!payload.nome){ setErr("Il nome dell'opzione è obbligatorio."); return; }
    try{
      if(r._nuovo){ const {error}=await sb.from("komunigo_spedizioni").insert(payload); if(error) throw error; }
      else { const {error}=await sb.from("komunigo_spedizioni").update(payload).eq("id",r.id); if(error) throw error; }
      setOk("Opzione salvata."); await carica(); setTimeout(()=>setOk(""),1600);
    }catch(ex){ setErr(ex.message||String(ex)); }
  }
  async function elimina(r){
    if(r._nuovo){ setRows(p=>p.filter(x=>x!==r)); return; }
    if(!window.confirm("Eliminare l'opzione \""+(r.nome||"")+"\"?")) return;
    try{ const {error}=await sb.from("komunigo_spedizioni").delete().eq("id",r.id); if(error) throw error; await carica(); }
    catch(ex){ setErr(ex.message||String(ex)); }
  }

  return (
    <div className="card" style={{marginTop:16}}>
      <h2>🚚 Spedizioni Komunigo (e-commerce)</h2>
      <div className="muted" style={{fontSize:12,marginBottom:12}}>Opzioni di consegna mostrate nel carrello del negozio. Il prezzo è <b>netto</b> (l'IVA si aggiunge come per la merce). Spunta <b>Ritiro</b> per l'opzione senza spedizione (di norma prezzo 0).</div>
      {err && <div className="banner err">{err}</div>}
      {ok && <div className="banner info">✅ {ok}</div>}
      {rows===null? <div className="empty">Caricamento…</div>
       : <div style={{overflow:"auto"}}>
          <table>
            <thead><tr><th>Nome</th><th>Descrizione</th><th>Prezzo €</th><th>Ritiro</th><th>Ordine</th><th>Attivo</th><th></th></tr></thead>
            <tbody>
              {rows.map((r,i)=>
                <tr key={r.id}>
                  <td><input value={r.nome||""} disabled={!perm.scrivi} onChange={e=>set(i,"nome",e.target.value)} style={{minWidth:150}}/></td>
                  <td><input value={r.descrizione||""} disabled={!perm.scrivi} onChange={e=>set(i,"descrizione",e.target.value)} style={{minWidth:200}}/></td>
                  <td><input type="number" step="0.01" value={r.prezzo} disabled={!perm.scrivi} onChange={e=>set(i,"prezzo",e.target.value)} style={{maxWidth:100}}/></td>
                  <td style={{textAlign:"center"}}><input type="checkbox" checked={!!r.ritiro} disabled={!perm.scrivi} onChange={e=>set(i,"ritiro",e.target.checked)} style={{width:"auto"}}/></td>
                  <td><input type="number" value={r.ordine} disabled={!perm.scrivi} onChange={e=>set(i,"ordine",e.target.value)} style={{maxWidth:70}}/></td>
                  <td style={{textAlign:"center"}}><input type="checkbox" checked={r.attivo!==false} disabled={!perm.scrivi} onChange={e=>set(i,"attivo",e.target.checked)} style={{width:"auto"}}/></td>
                  <td style={{whiteSpace:"nowrap"}}>
                    {perm.scrivi && <button type="button" className="btn small primary" onClick={()=>salva(r)}>Salva</button>}{" "}
                    {perm.scrivi && <button type="button" className="btn small danger" onClick={()=>elimina(r)}>✕</button>}
                  </td>
                </tr>)}
              {rows.length===0 && <tr><td colSpan={7} className="muted">Nessuna opzione. {perm.scrivi?"Aggiungine una qui sotto.":""}</td></tr>}
            </tbody>
          </table>
        </div>}
      {perm.scrivi && <button type="button" className="btn small" style={{marginTop:12}} onClick={addRow}>+ Aggiungi opzione</button>}
    </div>
  );
}

/* ---- metodi di pagamento Komunigo (gestiti dalle Impostazioni) ---- */

    setErr("");
    const {data,error}=await sb.from("komunigo_pagamenti").select("*").order("ordine");
    if(error){ setErr(error.message); setRows([]); return; }
    setRows(data||[]);
  },[]);
  useEffect(()=>{ carica(); },[carica]);
  const set=(i,k,v)=>setRows(p=>p.map((r,j)=>j===i?{...r,[k]:v}:r));
  async function salva(r){
    setErr(""); setOk("");
    try{
      const {error}=await sb.from("komunigo_pagamenti").update({
        nome:(r.nome||"").trim(), descrizione:r.descrizione||"", istruzioni:r.istruzioni||"",

  }
  const LAB={carta:"💳 Carta di credito (Nexi)", bonifico:"🏦 Bonifico anticipato", ritiro:"🏬 Pagamento al ritiro", paypal:"🅿️ PayPal"};
  return (
    <div className="card" style={{marginTop:16}}>
