      <div className="muted" style={{fontSize:12,marginBottom:12}}>Attiva/disattiva i metodi e scrivi le istruzioni per il cliente. Per il <b>bonifico</b> metti IBAN, intestatario, banca e causale nel campo Istruzioni. Carta e PayPal si attivano quando i gateway sono collegati.</div>
      {err && <div className="banner err">{err}</div>}
      {ok && <div className="banner info">✅ {ok}</div>}
      {rows===null? <div className="empty">Caricamento…</div>
       : rows.map((r,i)=>(
          <div key={r.id} className="card" style={{padding:12,marginBottom:10,background:"#fafbfc"}}>
            <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
              <b>{LAB[r.metodo]||r.metodo}</b>
              <label style={{display:"flex",gap:6,alignItems:"center",fontSize:13}}><input type="checkbox" checked={r.attivo!==false} disabled={!perm.scrivi} onChange={e=>set(i,"attivo",e.target.checked)} style={{width:"auto"}}/>Attivo</label>
              <span className="muted" style={{fontSize:12}}>ordine</span><input type="number" value={r.ordine} disabled={!perm.scrivi} onChange={e=>set(i,"ordine",e.target.value)} style={{maxWidth:60}}/>
              {perm.scrivi && <button type="button" className="btn small primary" style={{marginLeft:"auto"}} onClick={()=>salva(r)}>Salva</button>}
            </div>
            <div className="field" style={{marginTop:8}}><label>Nome mostrato al cliente</label><input value={r.nome||""} disabled={!perm.scrivi} onChange={e=>set(i,"nome",e.target.value)}/></div>
            <div className="field"><label>Descrizione breve</label><input value={r.descrizione||""} disabled={!perm.scrivi} onChange={e=>set(i,"descrizione",e.target.value)}/></div>
            {(r.metodo==="bonifico"||r.metodo==="ritiro") && <div className="field"><label>Istruzioni per il cliente{r.metodo==="bonifico"?" (IBAN, intestatario, banca, causale)":""}</label><textarea rows={r.metodo==="bonifico"?4:2} value={r.istruzioni||""} disabled={!perm.scrivi} onChange={e=>set(i,"istruzioni",e.target.value)}/></div>}
            {(r.metodo==="carta"||r.metodo==="paypal") && r.attivo!==false && <div className="banner err" style={{fontSize:12,marginTop:6}}>⚠ Il gateway {r.metodo==="carta"?"Nexi":"PayPal"} non è ancora collegato: il cliente può sceglierlo ma il pagamento online non parte finché non completiamo l'integrazione. Tienilo <b>disattivo</b> per ora.</div>}
          </div>
        ))}
    </div>
  );
}

function ModuloImpostazioni({profilo,perm}){
  const [gen,setGen]=useState(null);
  const [tariffe,setTariffe]=useState([]);
  const [err,setErr]=useState(""); const [ok,setOk]=useState("");
  const [busy,setBusy]=useState(false);
  const [nuovaLav,setNuovaLav]=useState("");
  const [lavList,setLavList]=useState([]);
  const [lavNuovaM,setLavNuovaM]=useState("");
  const [matList,setMatList]=useState([]);
  const [matNuova,setMatNuova]=useState("");
  const [bozzaImp,setBozzaImp]=useState(null);
  const [operOp,setOperOp]=useState([]);
  const inputSt={maxWidth:150,padding:"7px 9px",border:"1px solid var(--line)",borderRadius:8};

  const carica=useCallback(async()=>{
    setErr("");
    const isAdm=(profilo && profilo.ruolo==="amministratore");
    const [g,t,l,op,mp,st]=await Promise.all([
      sb.from("impostazioni").select("*").eq("id",1).maybeSingle(),
      sb.from("impostazioni_lavorazioni").select("*"),
      sb.from("lavorazioni").select("*").order("ordine").order("nome"),
      sb.from("operatori").select("nome,tipo,costo_annuo,ore_produzione,costo_orario"),
      sb.from("materie_prime").select("*").order("ordine").order("nome"),
      // costi di struttura: tabella blindata, leggibile SOLO dall'amministratore
      isAdm ? sb.from("impostazioni_struttura").select("*").eq("id",1).maybeSingle() : Promise.resolve({data:null}),
    ]);
    if(g.error){ setErr(g.error.message); }
    setLavList(l.data||[]);
    setMatList(mp.data||[]);
    setOperOp(op.data||[]);
    // carico SEMPRE prima i dati salvati sul database (parametri generali + struttura blindata)
    const base=g.data||{id:1,spese_generali_pct:0,margine_minimo_pct:0,iva_pct:22,sconto_rivenditori_pct:0,abbondanza_cm:3};
    const stru=(st&&st.data)||{};
    setGen({...base,
      costi_struttura:Array.isArray(stru.costi_struttura)?stru.costi_struttura:[],
      costi_diretti_annui:stru.costi_diretti_annui||0,
      fatturato_annuo:stru.fatturato_annuo||0});
    const saved=t.data||[];
    const map={}; saved.forEach(r=>map[r.lavorazione]=r);
    const masterNomi=(l.data||[]).map(x=>x.nome);
    const uniq=[...new Set([...masterNomi,...saved.map(r=>r.lavorazione)])];
    setTariffe(uniq.map(l=>{ const r={lavorazione:l,
      modo:map[l]?.modo || "ora",
      tariffa_oraria:map[l]?.tariffa_oraria ?? "",
      margine_obiettivo:map[l]?.margine_obiettivo ?? ""};
      return {...r, prezzo_vendita:prezzoVend(r)}; }));
    // eventuale bozza non salvata: NON la ripristino da sola (causava un loop che
    // riscriveva la bozza e nascondeva i dati aggiornati). Mostro sempre i dati del
    // database e OFFRO di recuperare la bozza col pulsante "Ripristina".
    const b=leggiBozzaImp();
    if(b && b.gen){ setBozzaImp({...b, recente:false}); }
  },[profilo]);
  useEffect(()=>{ carica(); },[carica]);
  // autosalvataggio bozza: scrive su ogni modifica reale (quando il flag dirty è attivo)
  useEffect(()=>{ if(window.__gestDirty && gen){ scriviBozzaImp({gen,tariffe}); } },[gen,tariffe]);
  const scartaBozzaImp=()=>{ cancellaBozzaImp(); setBozzaImp(null); window.__gestDirty=false; carica(); };
  const ripristinaBozzaImp=()=>{ const b=bozzaImp; if(!b||!b.gen) return;
    setGen(b.gen);
    setTariffe((Array.isArray(b.tariffe)?b.tariffe:[]).map(r=>({...r,prezzo_vendita:r.prezzo_vendita ?? prezzoVend(r)})));
    window.__gestDirty=true; setBozzaImp({...b,recente:true}); };

  const setG=(k,v)=>{ window.__gestDirty=true; setGen(p=>({...p,[k]:v})); };
  useEffect(()=>()=>{ window.__gestDirty=false; },[]);  // pulisci il flag uscendo dalle Impostazioni
  function caricaCarta(e){
    const file=e.target.files&&e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>setG("carta_intestata", ev.target.result);
    reader.readAsDataURL(file);
  }
  const setT=(i,k,v)=>{ window.__gestDirty=true; setTariffe(p=>p.map((r,j)=>j===i?{...r,[k]:v}:r)); };
  // setter bidirezionale costo/margine/prezzo: se cambi il prezzo ricalcola il margine, altrimenti ricalcola il prezzo
  const setTC=(i,campo,val)=>{ window.__gestDirty=true; setTariffe(p=>p.map((r,j)=>{
    if(j!==i) return r;
    const nr={...r,[campo]:val};
    const costo=Number(nr.tariffa_oraria)||0;
    if(campo==="prezzo_vendita"){ const pz=Number(val)||0; nr.margine_obiettivo = costo>0? Math.round((pz/costo-1)*10000)/100 : 0; }
    else { nr.prezzo_vendita = prezzoVend(nr); }
    return nr;
  })); };
  const addLav=()=>{ const l=nuovaLav.trim(); if(!l) return; window.__gestDirty=true;
    setTariffe(p=>p.some(r=>r.lavorazione===l)?p:[...p,{lavorazione:l,tariffa_oraria:"",margine_obiettivo:"",prezzo_vendita:""}]); setNuovaLav(""); };
  // gestione elenco lavorazioni (tabella "lavorazioni")
  const setLavNome=(i,v)=>setLavList(p=>p.map((x,j)=>j===i?{...x,nome:v}:x));
  async function aggiungiLavM(){ const n=lavNuovaM.trim(); if(!n) return;
    const {error}=await sb.from("lavorazioni").insert({nome:n,ordine:lavList.length+1});
    if(error){ setErr(error.message); return; } setLavNuovaM(""); await carica(); await caricaLavorazioniGlobali(); }
  async function salvaLavM(id,nome){ if(!String(nome).trim()) return;
    const {error}=await sb.from("lavorazioni").update({nome:String(nome).trim()}).eq("id",id);
    if(error){ setErr(error.message); return; } await carica(); await caricaLavorazioniGlobali(); }
  async function eliminaLavM(id){ if(!confirm("Eliminare questa lavorazione dall'elenco?")) return;
    const {error}=await sb.from("lavorazioni").delete().eq("id",id);
    if(error){ setErr(error.message); return; } await carica(); await caricaLavorazioniGlobali(); }
  // elimina dalla tabella Tariffe: rimuove la tariffa E la lavorazione dall'elenco
  async function eliminaLavTariffa(nome){
    if(!confirm('Eliminare la lavorazione "'+nome+'" e la sua tariffa?')) return;
    const {error:e1}=await sb.from("impostazioni_lavorazioni").delete().eq("lavorazione",nome);
    if(e1){ setErr(e1.message); return; }
    const {error:e2}=await sb.from("lavorazioni").delete().eq("nome",nome);
    if(e2){ setErr(e2.message); return; }
    await carica(); await caricaLavorazioniGlobali();
  }
  // gestione elenco materie prime (tabella "materie_prime")
  const setMatNome=(i,v)=>setMatList(p=>p.map((x,j)=>j===i?{...x,nome:v}:x));
  async function aggiungiMat(){ const n=matNuova.trim(); if(!n) return;
    const {error}=await sb.from("materie_prime").insert({nome:n,ordine:matList.length+1});
    if(error){ setErr(error.message); return; } setMatNuova(""); await carica(); await caricaMateriePrimeGlobali(); }
  async function salvaMat(id,nome){ if(!String(nome).trim()) return;
    const {error}=await sb.from("materie_prime").update({nome:String(nome).trim()}).eq("id",id);
    if(error){ setErr(error.message); return; } await carica(); await caricaMateriePrimeGlobali(); }
  async function eliminaMat(id){ if(!confirm("Eliminare questa materia prima dall'elenco?")) return;
    const {error}=await sb.from("materie_prime").delete().eq("id",id);
    if(error){ setErr(error.message); return; } await carica(); await caricaMateriePrimeGlobali(); }

  async function salva(){
    setBusy(true); setErr(""); setOk("");
    try{
      const sedi=Array.isArray(gen.azienda_sedi)?gen.azienda_sedi:[];
      const emails=Array.isArray(gen.azienda_emails)?gen.azienda_emails:[];
      const legale=sedi.find(s=>s.tipo==="legale")||sedi[0]||null;   // per il PDF
      const emailPrinc=(emails.find(e=>e.indirizzo&&e.indirizzo.trim())||{}).indirizzo||gen.azienda_email||"";
      const {error:e1}=await sb.from("impostazioni").upsert({id:1,
        spese_generali_pct:Number(gen.spese_generali_pct)||0,
        abbondanza_cm:Number(gen.abbondanza_cm)||0,
        margine_minimo_pct:Number(gen.margine_minimo_pct)||0,
        sconto_rivenditori_pct:Number(gen.sconto_rivenditori_pct)||0,
        iva_pct:Number(gen.iva_pct)||0,
        azienda_nome:gen.azienda_nome||"",
        azienda_indirizzo:legale?(legale.indirizzo||""):(gen.azienda_indirizzo||""),
        azienda_citta:legale?[legale.cap,legale.citta].filter(Boolean).join(" "):(gen.azienda_citta||""),
        azienda_piva:gen.azienda_piva||"",
        azienda_email:emailPrinc, azienda_tel:gen.azienda_tel||"",
        azienda_sedi:sedi, azienda_emails:emails,
        azienda_iban:gen.azienda_iban||"", condizioni_default:gen.condizioni_default||"",
        carta_intestata:gen.carta_intestata||"", carta_margine_top:Number(gen.carta_margine_top)||40,
        carta_margine_bottom:Number(gen.carta_margine_bottom)||25, carta_margine_lati:Number(gen.carta_margine_lati)||15});
      if(e1) throw e1;
      // COSTI DI STRUTTURA: tabella blindata, la scrive SOLO l'amministratore
      if(profilo && profilo.ruolo==="amministratore"){
        const {error:eStr}=await sb.from("impostazioni_struttura").upsert({id:1,
          costi_struttura:Array.isArray(gen.costi_struttura)?gen.costi_struttura:[],
          costi_diretti_annui:Number(gen.costi_diretti_annui)||0,
          fatturato_annuo:Number(gen.fatturato_annuo)||0,
          aggiornato_il:new Date().toISOString()});
        if(eStr) throw eStr;
      }
      await sb.from("impostazioni_lavorazioni").delete().neq("id","00000000-0000-0000-0000-000000000000");
      const rows=tariffe.filter(r=>r.lavorazione && (r.tariffa_oraria!==""||r.margine_obiettivo!==""))
        .map(r=>({lavorazione:r.lavorazione,modo:r.modo||"ora",tariffa_oraria:Number(r.tariffa_oraria)||0,margine_obiettivo:Number(r.margine_obiettivo)||0}));
      if(rows.length){ const {error:e2}=await sb.from("impostazioni_lavorazioni").insert(rows); if(e2) throw e2; }
      window.__gestDirty=false; cancellaBozzaImp(); setBozzaImp(null);
      setOk("Impostazioni salvate."); setTimeout(()=>setOk(""),2500);
    }catch(ex){ setErr(ex.message); }
    setBusy(false);
  }

  if(!gen) return <><div className="topbar"><h1>Impostazioni</h1></div><div className="content"><div className="empty">Caricamento…</div></div></>;
  const azSedi=Array.isArray(gen.azienda_sedi)?gen.azienda_sedi:[];
  const azEmails=Array.isArray(gen.azienda_emails)?gen.azienda_emails:[];
  const addAzSede=()=>setG("azienda_sedi",[...azSedi,{tipo:"operativa",indirizzo:"",cap:"",citta:"",provincia:""}]);
  const setAzSede=(i,k,v)=>setG("azienda_sedi",azSedi.map((s,j)=>j===i?{...s,[k]:v}:s));
  const delAzSede=i=>setG("azienda_sedi",azSedi.filter((_,j)=>j!==i));
  const addAzEmail=()=>setG("azienda_emails",[...azEmails,{categoria:"generica",indirizzo:""}]);
  const setAzEmail=(i,k,v)=>setG("azienda_emails",azEmails.map((e,j)=>j===i?{...e,[k]:v}:e));
  const delAzEmail=i=>setG("azienda_emails",azEmails.filter((_,j)=>j!==i));
  const isAdmin = (profilo && profilo.ruolo==="amministratore");
  const cStrutt=Array.isArray(gen.costi_struttura)?gen.costi_struttura:[];
  const addCS=()=>setG("costi_struttura",[...cStrutt,{categoria:"personale_indiretto",descrizione:"",importo:0}]);
  const setCS=(i,k,v)=>setG("costi_struttura",cStrutt.map((x,j)=>j===i?{...x,[k]:v}:x));
  const delCS=i=>setG("costi_struttura",cStrutt.filter((_,j)=>j!==i));
  const persMisti=(operOp||[]).filter(o=>o.tipo==="misto"||o.tipo==="struttura");
  const persStruttTot=persMisti.reduce((s,o)=>s+quotaStrutturaOp(o),0);
  const totStrutt=cStrutt.reduce((s,x)=>s+importoStruttura(x),0)+persStruttTot;
  const prodOperatori=(operOp||[]).reduce((s,o)=>s+quotaProduzioneOp(o),0);
  const baseDiretti=(Number(gen.costi_diretti_annui)||0)+prodOperatori;
  const pctSuggerita=baseDiretti>0? Math.round(totStrutt/baseDiretti*1000)/10 : 0;
  return (
    <>
      <div className="topbar"><h1>Impostazioni</h1>
        {perm.scrivi && <button className="btn primary" onClick={salva} disabled={busy}>{busy?<span className="spin"/>:"Salva impostazioni"}</button>}
      </div>
      <div className="content">
        {err && <div className="banner err">{err}</div>}
        {ok && <div className="banner info">{ok}</div>}
        {bozzaImp && <div className="banner info" style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          {bozzaImp.recente
            ? <span>📝 <b>Modifiche non salvate ripristinate</b> ({bozzaImp.ts?new Date(bozzaImp.ts).toLocaleString("it-IT"):"—"}). Ricorda di premere <b>Salva impostazioni</b>.</span>
            : <span>📝 C'è una <b>bozza non salvata</b> del {bozzaImp.ts?new Date(bozzaImp.ts).toLocaleString("it-IT"):"—"}. Ora vedi i <b>dati salvati sul database</b>: se vuoi puoi recuperare la bozza, altrimenti scartala.</span>}
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {!bozzaImp.recente && <button className="btn small" onClick={ripristinaBozzaImp} style={{whiteSpace:"nowrap"}}>Ripristina bozza</button>}
            <button className="btn small" onClick={scartaBozzaImp} style={{whiteSpace:"nowrap"}}>{bozzaImp.recente?"Scarta e ricarica":"Scarta bozza"}</button>
          </div>
        </div>}

        <div className="card" style={{padding:20,marginBottom:18}}>
          <h3 style={{marginTop:0}}>Parametri generali</h3>
          <div className="row">
            <div className="field"><label>Spese generali (%)</label>
              <input type="number" step="0.1" value={gen.spese_generali_pct} onChange={e=>setG("spese_generali_pct",e.target.value)}/></div>
            <div className="field"><label>Margine minimo di avviso (%)</label>
              <input type="number" step="0.1" value={gen.margine_minimo_pct} onChange={e=>setG("margine_minimo_pct",e.target.value)}/></div>
            <div className="field"><label>IVA (%)</label>
              <input type="number" step="0.1" value={gen.iva_pct} onChange={e=>setG("iva_pct",e.target.value)}/></div>
            <div className="field"><label title="Rifilo/abbondanza aggiunta a OGNI LATO per smarginatura e crocini (materiali a mq/ml). Default globale, modificabile sulla singola riga di preventivo.">Abbondanza per lato (cm)</label>
              <input type="number" step="0.1" min="0" value={gen.abbondanza_cm ?? 3} onChange={e=>setG("abbondanza_cm",e.target.value)}/></div>
            <div className="field"><label>Sconto standard rivenditori (%)</label>
              <input type="number" step="0.1" min="0" max="100" value={gen.sconto_rivenditori_pct ?? 0}
                     onChange={e=>setG("sconto_rivenditori_pct",e.target.value)}/></div>
          </div>
          <div className="muted" style={{fontSize:12}}>Le spese generali si aggiungono al costo nei preventivi; sotto il margine minimo comparirà un avviso.</div>
          <div className="muted" style={{fontSize:12,marginTop:4}}>Lo <b>sconto standard rivenditori</b> si applica automaticamente ai clienti con Categoria "Rivenditore" che non hanno uno sconto proprio. Il prezzo di listino è quello del Catalogo (<b>Prezzo pubblico</b>).</div>
        </div>

        {isAdmin && <div className="card" style={{padding:20,marginBottom:18}}>
          <h3 style={{marginTop:0}}>Costi di struttura (per le Spese Generali %)</h3>
          <div className="muted" style={{fontSize:12,marginBottom:12}}>I costi <b>indiretti</b>: affitto, <b>personale non di produzione</b>, amministrazione, software… Con i costi diretti annui stimati, l'app ti propone la <b>% di spese generali</b>.</div>
          {cStrutt.length===0 && <div className="muted" style={{fontSize:13,marginBottom:8}}>Nessuna voce. Aggiungine con il pulsante sotto.</div>}
          {cStrutt.map((x,i)=>
            <div className="subrow" key={i}>
              <div className="hd" style={{flexWrap:"wrap",gap:8}}>
                <select value={x.categoria} onChange={e=>{ const v=e.target.value;
                    setG("costi_struttura", cStrutt.map((y,j)=> j===i ? {...y, categoria:v, misto: catAmmetteMisto(v)? y.misto : false} : y)); }} className="btn small" style={{fontWeight:700}}>
                  {CATEGORIE_STRUTTURA.map(c=><option key={c.v} value={c.v}>{c.label}</option>)}
                </select>
                {catAmmetteMisto(x.categoria) && <label style={{display:"flex",alignItems:"center",gap:6,fontSize:13}}>
                  <input type="checkbox" checked={!!x.misto} onChange={e=>setCS(i,"misto",e.target.checked)} style={{width:"auto"}}/> Misto (anche produzione)
                </label>}
                <button type="button" className="btn small danger" style={{marginLeft:"auto"}} onClick={()=>delCS(i)}>Rimuovi</button>
              </div>
              <div className="field"><label>Descrizione</label>
                <input value={x.descrizione||""} onChange={e=>setCS(i,"descrizione",e.target.value)} placeholder="es. Titolare, impiegato amministrativo, affitto…"/></div>
              {(!x.misto || !catAmmetteMisto(x.categoria))
                ? <div className="field" style={{maxWidth:200}}><label>Importo annuo €</label>
                    <input type="number" step="0.01" value={x.importo||""} onChange={e=>setCS(i,"importo",e.target.value)}/></div>
                : <>
                    <div className="row">
                      <div className="field" style={{maxWidth:160}}><label>Costo annuo €</label>
                        <input type="number" step="0.01" value={x.costo_annuo||""} onChange={e=>setCS(i,"costo_annuo",e.target.value)}/></div>
                      <div className="field" style={{maxWidth:150}}><label>Ore produzione/anno</label>
                        <input type="number" step="1" value={x.ore_produzione||""} onChange={e=>setCS(i,"ore_produzione",e.target.value)}/></div>
                      <div className="field" style={{maxWidth:140}}><label>Costo orario €</label>
                        <input type="number" step="0.01" value={x.costo_orario||""} onChange={e=>setCS(i,"costo_orario",e.target.value)}/></div>
                    </div>
                    <div className="muted" style={{fontSize:12}}>→ In struttura: <b>{eur(importoStruttura(x))}</b> · In produzione: <b>{eur((Number(x.ore_produzione)||0)*(Number(x.costo_orario)||0))}</b> (crea la persona come <b>Operatore</b> a {Number(x.costo_orario)||0} €/h)</div>
                  </>}
            </div>)}
          <button type="button" className="btn small repeat-add" onClick={addCS}>+ Aggiungi voce</button>

          {persMisti.length>0 && <div style={{marginTop:14,borderTop:"1px solid var(--line)",paddingTop:12}}>
            <label style={{fontSize:12,fontWeight:600,color:"var(--muted)",textTransform:"uppercase"}}>Personale dagli Operatori (misto / solo struttura)</label>
            <div className="muted" style={{fontSize:12,margin:"4px 0 8px"}}>Definiti in 👷 Operatori; la loro quota ufficio confluisce qui in automatico (niente doppia digitazione).</div>
            {persMisti.map((o,i)=>
              <div key={i} style={{display:"flex",justifyContent:"space-between",gap:10,fontSize:13,padding:"3px 0"}}>
                <span>{o.nome||"—"} <span className="muted">({(TIPI_OPERATORE.find(t=>t.v===o.tipo)||{}).l})</span></span>
                <span>in struttura: <b>{eur(quotaStrutturaOp(o))}</b></span>
              </div>)}
            <div style={{display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:700,marginTop:6,borderTop:"1px dashed var(--line)",paddingTop:6}}>
              <span>Totale personale in struttura</span><span>{eur(persStruttTot)}</span>
            </div>
          </div>}

          <div className="row" style={{marginTop:14,alignItems:"flex-end"}}>
            <div className="field" style={{maxWidth:200}}><label>Totale struttura / anno</label>
              <input value={eur(totStrutt)} disabled style={{fontWeight:700}}/></div>
            <div className="field" style={{maxWidth:200}}><label>Materiali diretti annui stimati €</label>
              <input type="number" step="0.01" value={gen.costi_diretti_annui||""} onChange={e=>setG("costi_diretti_annui",e.target.value)}/></div>
            <div className="field" style={{maxWidth:220}}><label>Obiettivo fatturato annuo €</label>
              <input type="number" step="0.01" value={gen.fatturato_annuo||""} onChange={e=>setG("fatturato_annuo",e.target.value)}/>
              <div className="muted" style={{fontSize:11,marginTop:3}}>Usato nel Report per gli obiettivi di fatturato mensili (÷12, con recupero sui mesi restanti).</div></div>
          </div>
          <div className="muted" style={{fontSize:12,marginTop:6}}>Costi diretti = materiali <b>{eur(Number(gen.costi_diretti_annui)||0)}</b> + manodopera produzione (dagli Operatori) <b>{eur(prodOperatori)}</b> = <b>{eur(baseDiretti)}</b></div>
          <div className="banner info" style={{marginTop:10,display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <span>Spese generali suggerite: <b>{pctSuggerita}%</b> {baseDiretti>0?"(struttura ÷ costi diretti)":"— inserisci i costi diretti annui per il calcolo"}{Number(gen.fatturato_annuo)>0?" · sul fatturato: "+(Math.round(totStrutt/Number(gen.fatturato_annuo)*1000)/10)+"%":""}</span>
            {pctSuggerita>0 && <button type="button" className="btn small primary" onClick={()=>setG("spese_generali_pct",pctSuggerita)}>Usa come Spese Generali %</button>}
          </div>
        </div>}

        <div className="card" style={{padding:20,marginBottom:18}}>
          <h3 style={{marginTop:0}}>Dati azienda (per i documenti / PDF)</h3>
          <div className="row">
            <div className="field" style={{flex:2}}><label>Ragione sociale</label>
              <input value={gen.azienda_nome||""} onChange={e=>setG("azienda_nome",e.target.value)}/></div>
            <div className="field"><label>P.IVA</label>
              <input value={gen.azienda_piva||""} onChange={e=>setG("azienda_piva",e.target.value)}/></div>
          </div>
          <div className="row">
            <div className="field"><label>Telefono</label>
              <input value={gen.azienda_tel||""} onChange={e=>setG("azienda_tel",e.target.value)}/></div>
            <div className="field"><label>IBAN</label>
              <input value={gen.azienda_iban||""} onChange={e=>setG("azienda_iban",e.target.value)}/></div>
          </div>

          <label style={{fontSize:12,fontWeight:600,color:"var(--muted)",textTransform:"uppercase",display:"block",margin:"12px 0 6px"}}>Sedi</label>
          {azSedi.map((s,i)=>
            <div className="subrow" key={i}>
              <div className="hd">
                <select value={s.tipo} onChange={e=>setAzSede(i,"tipo",e.target.value)} className="btn small" style={{fontWeight:700}}>
                  {TIPI_SEDE_FORN.map(t=><option key={t.v} value={t.v}>{t.label}</option>)}
                </select>
                <button type="button" className="btn small danger" onClick={()=>delAzSede(i)}>Rimuovi</button>
              </div>
              <div className="field"><label>Indirizzo</label>
                <input value={s.indirizzo||""} onChange={e=>setAzSede(i,"indirizzo",e.target.value)}/></div>
              <div className="row">
                <div className="field" style={{maxWidth:110}}><label>CAP</label>
                  <input value={s.cap||""} onChange={e=>setAzSede(i,"cap",e.target.value)}/></div>
                <div className="field"><label>Città</label>
                  <input value={s.citta||""} onChange={e=>setAzSede(i,"citta",e.target.value)}/></div>
                <div className="field" style={{maxWidth:90}}><label>Prov.</label>
                  <input value={s.provincia||""} maxLength={4} onChange={e=>setAzSede(i,"provincia",e.target.value)}/></div>
              </div>
            </div>)}
          <button type="button" className="btn small repeat-add" onClick={addAzSede}>+ Aggiungi sede</button>

          <label style={{fontSize:12,fontWeight:600,color:"var(--muted)",textTransform:"uppercase",display:"block",margin:"14px 0 6px"}}>Email</label>
          {azEmails.map((em,i)=>
            <div className="row" key={i} style={{alignItems:"flex-end"}}>
              <div className="field" style={{maxWidth:180}}><label>Categoria</label>
                <select value={em.categoria} onChange={e=>setAzEmail(i,"categoria",e.target.value)}>
                  {CATEGORIE_EMAIL.map(c=><option key={c.v} value={c.v}>{c.label}</option>)}
                </select></div>
              <div className="field"><label>Indirizzo email</label>
                <input type="email" value={em.indirizzo||""} onChange={e=>setAzEmail(i,"indirizzo",e.target.value)}/></div>
              <button type="button" className="btn small danger" style={{marginBottom:4}} onClick={()=>delAzEmail(i)}>✕</button>
            </div>)}
          <button type="button" className="btn small repeat-add" onClick={addAzEmail}>+ Aggiungi email</button>

          <div className="muted" style={{fontSize:12,marginTop:10}}>Sui documenti/PDF compaiono la <b>sede legale</b> (o la prima) e la <b>prima email</b>.</div>
        </div>

        <div className="card" style={{padding:20,marginBottom:18}}>
          <h3 style={{marginTop:0}}>Carta intestata (sfondo del PDF)</h3>
          <div className="muted" style={{fontSize:12,marginBottom:10}}>Carica un'immagine A4 (verticale) della tua carta intestata: verrà usata come sfondo di ogni pagina del preventivo. Se la carichi, l'intestazione testuale viene nascosta.</div>
          <div className="row" style={{alignItems:"flex-end"}}>
            <div className="field"><label>Immagine carta intestata (JPG/PNG)</label>
              <input type="file" accept="image/*" onChange={caricaCarta}/></div>
            <div className="field" style={{maxWidth:150}}><label>Margine sup. (mm)</label>
              <input type="number" value={gen.carta_margine_top ?? 40} onChange={e=>setG("carta_margine_top",e.target.value)}/></div>
            <div className="field" style={{maxWidth:150}}><label>Margine inf. (mm)</label>
              <input type="number" value={gen.carta_margine_bottom ?? 25} onChange={e=>setG("carta_margine_bottom",e.target.value)}/></div>
            <div className="field" style={{maxWidth:150}}><label>Margine laterale (mm)</label>
              <input type="number" value={gen.carta_margine_lati ?? 15} onChange={e=>setG("carta_margine_lati",e.target.value)}/></div>
          </div>
          {gen.carta_intestata &&
            <div style={{display:"flex",alignItems:"center",gap:12,marginTop:10}}>
              <img src={gen.carta_intestata} alt="anteprima" style={{height:120,border:"1px solid var(--line)",borderRadius:6}}/>
              <button type="button" className="btn small danger" onClick={()=>setG("carta_intestata","")}>Rimuovi carta intestata</button>
            </div>}
          <div className="muted" style={{fontSize:12,marginTop:8}}>I <b>margini</b> definiscono l'<b>area utile</b> della carta intestata: lascia in alto lo spazio della tua intestazione, in basso quello del piè di pagina, e ai lati. Il contenuto resterà dentro quest'area su <b>ogni</b> pagina, andando a capo da solo quando le righe sono tante. Immagine leggera (&lt; ~1,5 MB). Ricorda di premere <b>Salva impostazioni</b>.</div>
        </div>

        <div className="card" style={{padding:20,marginBottom:18}}>
          <h3 style={{marginTop:0}}>Condizioni di vendita (pagina allegata al preventivo)</h3>
          <div className="muted" style={{fontSize:12,marginBottom:10}}>Questo testo viene stampato come <b>seconda pagina A4</b> in coda a ogni preventivo. Lo scrivi una volta e vale per tutti.</div>
          <div className="field">
            <textarea rows={12} value={gen.condizioni_default||""} onChange={e=>setG("condizioni_default",e.target.value)}
                      placeholder={"1. Validità dell'offerta: 30 giorni salvo diversa indicazione.\n2. Pagamento: ...\n3. Tempi di consegna: ...\n4. Grafiche e bozze: ...\n5. Resi e reclami: ...\n6. Foro competente: ..."}/></div>
        </div>

        <div className="card" style={{padding:20,marginBottom:18}}>
          <h3 style={{marginTop:0}}>Lavorazioni</h3>
          <div className="muted" style={{fontSize:12,marginBottom:12}}>L'elenco usato in tutto il gestionale (clienti, catalogo, operatori, preventivi, prodotti configurabili…).</div>
          {lavList.map((l,i)=>
            <div className="row" key={l.id} style={{alignItems:"flex-end",marginBottom:8}}>
              <div className="field" style={{flex:1,maxWidth:380}}>
                <input value={l.nome} onChange={e=>setLavNome(i,e.target.value)}/></div>
              <button type="button" className="btn small" onClick={()=>salvaLavM(l.id,l.nome)}>Salva</button>
              <button type="button" className="btn small danger" onClick={()=>eliminaLavM(l.id)}>Elimina</button>
            </div>)}
          <div style={{display:"flex",gap:6,marginTop:12}}>
            <input value={lavNuovaM} onChange={e=>setLavNuovaM(e.target.value)} placeholder="Nuova lavorazione…"
                   style={{flex:1,maxWidth:280,padding:"7px 9px",border:"1px solid var(--line)",borderRadius:8}}
                   onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();aggiungiLavM();}}}/>
            <button type="button" className="btn small" onClick={aggiungiLavM}>+ Aggiungi lavorazione</button>
          </div>
          <div className="muted" style={{fontSize:12,marginTop:8}}>Le modifiche qui sono immediate. Nota: rinominare o eliminare una lavorazione non aggiorna i dati già salvati che la usano.</div>
        </div>

        <div className="card" style={{padding:20,marginBottom:18}}>
          <h3 style={{marginTop:0}}>Materie prime</h3>
          <div className="muted" style={{fontSize:12,marginBottom:12}}>Le categorie di materiale che acquistiamo (forex, pvc, inchiostri, imballaggio…). Compaiono come caselle <b>"Materiali forniti"</b> nell'anagrafica fornitori di tipo <b>Materiale</b>.</div>
          {matList.map((m,i)=>
            <div className="row" key={m.id} style={{alignItems:"flex-end",marginBottom:8}}>
              <div className="field" style={{flex:1,maxWidth:380}}>
                <input value={m.nome} onChange={e=>setMatNome(i,e.target.value)}/></div>
              <button type="button" className="btn small" onClick={()=>salvaMat(m.id,m.nome)}>Salva</button>
              <button type="button" className="btn small danger" onClick={()=>eliminaMat(m.id)}>Elimina</button>
            </div>)}
          <div style={{display:"flex",gap:6,marginTop:12}}>
            <input value={matNuova} onChange={e=>setMatNuova(e.target.value)} placeholder="Nuova materia prima…"
                   style={{flex:1,maxWidth:280,padding:"7px 9px",border:"1px solid var(--line)",borderRadius:8}}
                   onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();aggiungiMat();}}}/>
            <button type="button" className="btn small" onClick={aggiungiMat}>+ Aggiungi materia prima</button>
          </div>
          <div className="muted" style={{fontSize:12,marginTop:8}}>Le modifiche qui sono immediate.</div>
        </div>

        <div className="card" style={{padding:20}}>
          <h3 style={{marginTop:0}}>Tariffe per lavorazione</h3>
          <div className="muted" style={{fontSize:12,marginBottom:12}}>Per ogni lavorazione: come si conteggia (ora, mq, mtl, mc, pezzo…) e il <b>costo</b> per quell'unità. Poi metti <b>il prezzo di vendita</b> (e l'app calcola il margine) <b>oppure</b> il margine (e l'app calcola il prezzo). Usati per la manodopera nei preventivi.</div>
          <div style={{overflow:"auto"}}>
            <table>
              <thead><tr><th>Lavorazione</th><th>Modo di calcolo</th><th>Costo (€/unità)</th><th>Margine (%)</th><th>Prezzo di vendita €</th><th></th></tr></thead>
              <tbody>
                {tariffe.map((r,i)=>
                  <tr key={r.lavorazione}>
                    <td className="rs">{r.lavorazione}</td>
                    <td><select value={r.modo||"ora"} onChange={e=>setT(i,"modo",e.target.value)} style={{...inputSt,maxWidth:190}}>
                      {MODI_VOCE.map(mo=><option key={mo.v} value={mo.v}>{mo.l}</option>)}
                    </select></td>
                    <td><input type="number" step="0.01" value={r.tariffa_oraria} onChange={e=>setTC(i,"tariffa_oraria",e.target.value)} style={inputSt}/></td>
                    <td><input type="number" step="0.1" value={r.margine_obiettivo} onChange={e=>setTC(i,"margine_obiettivo",e.target.value)} style={inputSt}/></td>
                    <td><input type="number" step="0.01" value={r.prezzo_vendita ?? ""} onChange={e=>setTC(i,"prezzo_vendita",e.target.value)} style={{...inputSt,fontWeight:700,color:"var(--ok)"}}/></td>
                    <td><button type="button" className="btn small danger" title="Elimina lavorazione e tariffa" onClick={()=>eliminaLavTariffa(r.lavorazione)}>✕</button></td>
                  </tr>)}
              </tbody>
            </table>
          </div>
          <div style={{display:"flex",gap:6,marginTop:12}}>
            <input value={nuovaLav} onChange={e=>setNuovaLav(e.target.value)} placeholder="Aggiungi lavorazione…"
                   style={{flex:1,maxWidth:280,padding:"7px 9px",border:"1px solid var(--line)",borderRadius:8}}
                   onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();addLav();}}}/>
            <button type="button" className="btn small" onClick={addLav}>+ Aggiungi</button>
          </div>
        </div>
        <SpedizioniKomunigo perm={perm}/>
        <PagamentiKomunigo perm={perm}/>
      </div>
    </>
  );
}
