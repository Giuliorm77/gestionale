                        <td className="muted">{p.descrizione_breve||"—"}</td>
                        <td className="muted">{p.data? new Date(p.data).toLocaleDateString("it-IT"):"—"}</td>
                        <td><span className="tag" style={{background:st.bg,color:st.c}}>{st.l}</span></td>
                        <td style={{textAlign:"right",fontWeight:700}}>{eur(t.totale)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>}
      </div>
      {editor && <PreventivoEditor preventivo={editor.id?editor:null} profilo={profilo}
        clienti={clienti} articoli={articoli} imp={imp} tariffe={tariffe} prodotti={prodotti} imballi={imballi} corrieri={corrieri}
        bozza={editBozza}
        numeroSuggerito={prossimoNumero(preventivi)}
        onClose={()=>{setEditor(null);setEditBozza(null);setBozza(leggiBozza());}}
        onSalvato={()=>{setEditor(null);setEditBozza(null);setBozza(null);carica();}}/>}
    </>
  );
}

function PreventivoEditor({preventivo,profilo,clienti,articoli,imp,tariffe,prodotti,imballi,corrieri,bozza,numeroSuggerito,onClose,onSalvato}){
  const nuovo=!preventivo;
  const [f,setF]=useState(()=> (bozza&&bozza.f) ? bozza.f : ({
    numero:preventivo?.numero||numeroSuggerito,
    cliente_id:preventivo?.cliente_id||"",
    data:preventivo?.data||new Date().toISOString().slice(0,10),
    validita_giorni:preventivo?.validita_giorni ?? 30,
    descrizione_breve:preventivo?.descrizione_breve||"",
    riferimento:preventivo?.riferimento||"",
    referente_dest:preventivo?.referente_dest||"",
    email_dest:preventivo?.email_dest||"",
    stato:preventivo?.stato||"bozza",
    imballaggio:preventivo?.imballaggio ?? 0,
    trasporto:preventivo?.trasporto ?? 0,
    abbondanza_pct:preventivo?.abbondanza_pct ?? imp.abbondanza_pct ?? 2,
    spese_generali_pct:preventivo?.spese_generali_pct ?? imp.spese_generali_pct ?? 0,
    iva_pct:preventivo?.iva_pct ?? imp.iva_pct ?? 22,
    margine_minimo_pct:preventivo?.margine_minimo_pct ?? imp.margine_minimo_pct ?? 0,
    note:preventivo?.note||"",
    condizioni:preventivo?.condizioni||"",
    tipo_provvigione:preventivo?.tipo_provvigione||"percentuale",
    provvigione_pct:preventivo?.provvigione_pct ?? "",
    prezzo_netto:preventivo?.prezzo_netto ?? "",
    quota_margine_pct:preventivo?.quota_margine_pct ?? "",
  }));
  const [righe,setRighe]=useState(()=> (bozza&&bozza.righe) ? bozza.righe.map(r=>({...r}))
    : (preventivo?.preventivi_righe||[]).slice().sort((a,b)=>(a.ordine||0)-(b.ordine||0))
        .map(r=>{ const ids=Array.isArray(r.imballo_ids)?[...r.imballo_ids]:[];
          if(!ids.length && r.imballo_id) ids.push(r.imballo_id);
          if(r.imballo_pluriball && !ids.includes("__pluriball__")) ids.push("__pluriball__");
          return {...r, imballo_ids:ids}; }) );
  const [cercaArt,setCercaArt]=useState("");
  const [configOpen,setConfigOpen]=useState(false);
  const [configEditIdx,setConfigEditIdx]=useState(null);
  const [imbOrdineOpen,setImbOrdineOpen]=useState(false);
  const [trasportoOpen,setTrasportoOpen]=useState(false);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const [commMsg,setCommMsg]=useState("");
  const [avanzoDisp,setAvanzoDisp]=useState({});   // avanzi a magazzino per articolo: {mq, zero(mq a €0)}
  useEffect(()=>{ sb.from("magazzino_pezzi").select("articolo_id,larghezza_cm,altezza_cm,quantita,costo,stato").eq("stato","in_magazzino")
    .then(({data})=>{ const m={}; (data||[]).forEach(p=>{ if(!p.articolo_id) return;
        const mq=(Number(p.larghezza_cm)||0)*(Number(p.altezza_cm)||0)/10000*(Number(p.quantita)||1);
        const e=m[p.articolo_id]||(m[p.articolo_id]={mq:0,zero:0}); e.mq+=mq; if(Number(p.costo)===0) e.zero+=mq; });
      Object.values(m).forEach(e=>{ e.mq=Math.round(e.mq*100)/100; e.zero=Math.round(e.zero*100)/100; });
      setAvanzoDisp(m); }).catch(()=>{}); },[]);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const setRiga=(i,k,v)=>setRighe(p=>p.map((r,j)=>j===i?{...r,[k]:v}:r));
  const delRiga=i=>setRighe(p=>p.filter((_,j)=>j!==i));
  const apriConfigModifica=(i)=>{ setConfigEditIdx(i); setConfigOpen(true); };
  const aggiungiRigaConfig=(r)=>{
    // in modifica preservo le scelte di riga che il configuratore non gestisce (imballo, consegna)
    setRighe(p=> configEditIdx!=null
      ? p.map((x,j)=>j===configEditIdx? {...r, imballo_ids:x.imballo_ids, imballo_pluriball:x.imballo_pluriball, modalita_consegna:x.modalita_consegna} : x)
      : [...p,r]);
    setConfigOpen(false); setConfigEditIdx(null);
  };
  // salvataggio automatico di sicurezza: ad ogni modifica scrive una bozza nel browser
  const montato=React.useRef(false);
  useEffect(()=>{
    if(!montato.current){ montato.current=true; return; }
    scriviBozza({key:preventivo?.id||"new", f, righe, ts:Date.now(),
      etichetta:(f.numero||"")+" · "+((clienti.find(c=>c.id===f.cliente_id)||{}).ragione_sociale||"—")});
  },[f,righe]);

  const risultatiArt=useMemo(()=>{
    const s=cercaArt.trim().toLowerCase(); if(!s) return [];
    return articoli.filter(a=>[a.nome_articolo,a.codice].join(" ").toLowerCase().includes(s)).slice(0,10);
  },[cercaArt,articoli]);

  function addMateriale(a){
    // LISTINO UNICO: prezzo = Prezzo pubblico dell'articolo; lo SCONTO viene dalle regole del cliente
    // (eccezione per categoria -> sconto standard cliente -> standard rivenditori -> 0).
    const cli=(clienti||[]).find(c=>c.id===f.cliente_id);
    const sc=scontoPerCategoria(cli, cli&&cli.clienti_sconti, a.categoria, imp&&imp.sconto_rivenditori_pct);
    setRighe(p=>[...p,{tipo:"materiale",descrizione:a.nome_articolo,articolo_id:a.id,lavorazione:"",
      quantita:1,unita:a.unita||"",costo_unitario:Number(a.costo)||0,
      prezzo_unitario:Number(a.prezzo_pubblico)||0,sconto_pct:sc}]);
    setCercaArt("");
  }
  const addManodopera=()=>setRighe(p=>[...p,{tipo:"manodopera",descrizione:"",lavorazione:"",quantita:1,unita:"ora",costo_unitario:0,prezzo_unitario:0,sconto_pct:0}]);
  const addImpianto=()=>setRighe(p=>[...p,{tipo:"impianto",descrizione:"",lavorazione:"",quantita:1,unita:"",costo_unitario:0,prezzo_unitario:0,sconto_pct:0}]);
  const addLibera=()=>setRighe(p=>[...p,{tipo:"altro",descrizione:"",lavorazione:"",quantita:1,unita:"",costo_unitario:0,prezzo_unitario:0,sconto_pct:0}]);
  function setLavorazione(i,lav){
    const t=tariffe.find(x=>x.lavorazione===lav);
    // MODELLO B: nel listino tariffe si mette il COSTO; il prezzo = costo + margine(ricarico)
    const costo=Number(t?.tariffa_oraria)||0, marg=Number(t?.margine_obiettivo)||0;
    const prezzo=costo*(1+marg/100);
    setRighe(p=>p.map((r,j)=>j===i?{...r,lavorazione:lav,
      descrizione:r.descrizione||("Manodopera "+lav),
      prezzo_unitario:Math.round(prezzo*100)/100, costo_unitario:costo}:r));
  }

  // imballo PER RIGA (ricette livello prodotto) sulle righe materiale semplice
  const imballiProdPrev=(imballi||[]).filter(x=>x.livello==="prodotto");
  const bobinePrev=React.useMemo(()=>bobinePluriball(articoli),[articoli]);
  // pluriball di una riga: calcolato dalle misure della riga (serve un prodotto configurato con misure)
  const pluriballRiga=r=>{ const mis=(r.config&&r.config.mis)||{}; const pa=calcolaPluriball(mis,bobinePrev); if(!pa) return null;
    const N=Number(r.quantita)||0; const bob=pa.bobina;
    const prezzoUnit=Number(bob.prezzo_pubblico)>0? Number(bob.prezzo_pubblico) : (Number(bob.costo)||0);
    return {articolo_id:bob.id, nome:bob.nome_articolo, mtl:pa.metri, mtl_tot:Math.round(pa.metri*N*100)/100, prezzo_unit:prezzoUnit, coperto:pa.coperto}; };
  const imballiSel=r=> Array.isArray(r.imballo_ids)? r.imballo_ids : [];
  const costoUnImballo=(r,id)=>{
    if(id==="__pluriball__"){ const p=pluriballRiga(r); return p? p.mtl_tot*p.prezzo_unit : 0; }
    const imb=imballiProdPrev.find(x=>x.id===id); if(!imb) return 0;
    return calcolaImballo(imb,(r.config&&r.config.mis)||{},Number(r.quantita)||0,{}); };
  const costoImballoRiga=r=> imballiSel(r).reduce((s,id)=>s+costoUnImballo(r,id),0);
  const addImballo=(i,id)=>{ if(!id) return; setRighe(p=>p.map((x,j)=>j===i?{...x,imballo_ids:[...imballiSel(x).filter(v=>v!==id),id]}:x)); };
  const removeImballo=(i,id)=>setRighe(p=>p.map((x,j)=>j===i?{...x,imballo_ids:imballiSel(x).filter(v=>v!==id)}:x));
  const nomeImballo=(r,id)=> id==="__pluriball__"
    ? ("Pluriball"+(pluriballRiga(r)?" "+pluriballRiga(r).mtl_tot+" mtl":""))
    : ((imballiProdPrev.find(x=>x.id===id)||{}).nome||"imballo");
  // per salvataggio: se la riga include il pluriball, i dati bobina/metri da memorizzare
  const pluriballDaSalvare=r=> imballiSel(r).includes("__pluriball__") ? pluriballRiga(r) : null;
  const righeCalc=righe.map(r=>({...r, imballo_costo:Math.round(costoImballoRiga(r)*100)/100}));
  const tot=calcolaPreventivo(righeCalc,f);
  const sottoMargine = tot.imponibile>0 && tot.marginePct < (Number(f.margine_minimo_pct)||0);
  async function caricaCli(){
    if(!f.cliente_id) return null;
    const {data}=await sb.from("clienti").select("ragione_sociale,partita_iva,codice_fiscale,clienti_sedi(*),clienti_condizioni(metodo_pagamento,termini_pagamento)").eq("id",f.cliente_id).maybeSingle();
    return data;
  }
  async function stampa(){ const cli=await caricaCli(); stampaHTML(htmlPreventivo(f, righeCalc, imp, cli, tot)); }
  async function stampaCliente(){ const cli=await caricaCli(); stampaHTML(htmlPreventivo(f, righeVersioneCliente(righeCalc), imp, cli, tot)); }
  const numIn={width:82,padding:"6px 7px",border:"1px solid var(--line)",borderRadius:7,textAlign:"right"};
  const LAV_OPZ=[...new Set([...tariffe.map(t=>t.lavorazione),...LAVORAZIONI])];

  // Persiste il preventivo (testata + righe) SENZA chiudere; ritorna l'id. Usato da "Salva" e da "Crea commessa".
  async function persisti(){
    if(!f.cliente_id){ throw new Error("Scegli un cliente."); }
    // OBBLIGATORIO per il magazzino: ogni materiale deve avere la scelta "paga tutta la lastra / solo l'usato"
    const senzaScelta=righe.filter(r=>(r.tipo==="materiale"||r.tipo==="altro") && r.articolo_id && r.pagato_intero!==true && r.pagato_intero!==false);
    if(senzaScelta.length){ throw new Error("Per ogni materiale scegli se il cliente paga tutta la lastra o solo la parte usata (obbligatorio, serve al magazzino): "+senzaScelta.map(r=>r.descrizione||"materiale").join(", ")); }
    const cli=clienti.find(c=>c.id===f.cliente_id);
    const isMarg=f.tipo_provvigione==="margine";
    const rec={...f, cliente_nome:cli?cli.ragione_sociale:(preventivo?.cliente_nome||""),
      validita_giorni:Number(f.validita_giorni)||0, imballaggio:Number(f.imballaggio)||0, trasporto:Number(f.trasporto)||0,
      spese_generali_pct:Number(f.spese_generali_pct)||0, iva_pct:Number(f.iva_pct)||0, margine_minimo_pct:Number(f.margine_minimo_pct)||0,
      abbondanza_pct:Number(f.abbondanza_pct)||0,
      tipo_provvigione:f.tipo_provvigione||"percentuale",
      provvigione_pct: isMarg ? null : (f.provvigione_pct===""?null:Number(f.provvigione_pct)),
      prezzo_netto: isMarg ? (Number(f.prezzo_netto)||0) : null,
      quota_margine_pct: isMarg ? (Number(f.quota_margine_pct)||0) : null,
      aggiornato_il:new Date().toISOString()};
    let id=preventivo?.id;
    if(nuovo && !id){ rec.creato_da=profilo.id;
      const {data,error}=await sb.from("preventivi").insert(rec).select("id").single(); if(error) throw error; id=data.id;
    }else{ const {error}=await sb.from("preventivi").update(rec).eq("id",id); if(error) throw error;
      await sb.from("preventivi_righe").delete().eq("preventivo_id",id); }
    const rows=righe.map((r,idx)=>({preventivo_id:id,ordine:idx,tipo:r.tipo,descrizione:r.descrizione||"",
      articolo_id:r.articolo_id||null,lavorazione:r.lavorazione||"",quantita:Number(r.quantita)||0,unita:r.unita||"",
      costo_unitario:Number(r.costo_unitario)||0,prezzo_unitario:Number(r.prezzo_unitario)||0,sconto_pct:Number(r.sconto_pct)||0,
      config:r.config||null,modalita_consegna:r.modalita_consegna||"corriere", pagato_intero:r.pagato_intero!==false,
      imballo_id:null, imballo_ids:imballiSel(r).filter(x=>x!=="__pluriball__"), imballo_pluriball:pluriballDaSalvare(r),
      imballo_costo:Math.round(costoImballoRiga(r)*100)/100}));
    if(rows.length){ const {error}=await sb.from("preventivi_righe").insert(rows); if(error) throw error; }
    // Ribalta la provvigione decisa qui sulla trattativa CRM collegata (base dei report; l'agente la vede in sola lettura).
    try{
      await sb.from("crm_trattative").update({
        tipo_provvigione: rec.tipo_provvigione, provvigione_pct: rec.provvigione_pct,
        prezzo_netto: rec.prezzo_netto, quota_margine_pct: rec.quota_margine_pct,
        valore_stimato: Math.round((tot.imponibile||0)*100)/100
      }).eq("preventivo_id", id);
    }catch(e){}
    return id;
  }
  async function salva(e){
    if(e) e.preventDefault();
    setBusy(true); setErr("");
    try{ await persisti(); cancellaBozza(); onSalvato(); }
    catch(ex){ setErr(ex.message); setBusy(false); }
  }

  async function creaCommessa(){
    if(!preventivo?.id){ setErr("Salva prima il preventivo, poi crea la commessa."); return; }
    setErr(""); setCommMsg("");
    try{
      // esiste gia' una commessa per questo preventivo?
      const {data:esist}=await sb.from("commesse").select("numero").eq("preventivo_id",preventivo.id);
      if(esist&&esist.length){
        if(!window.confirm("Esiste già la commessa "+esist[0].numero+" per questo preventivo. Vuoi crearne un'altra?")) return;
      }
      setBusy(true);
      await persisti();   // salva in automatico il preventivo (con le modifiche correnti) prima di generare la commessa
      const {data:tutte}=await sb.from("commesse").select("numero");
      const numero=prossimoNumeroCommessa(tutte||[]);
      const cli=clienti.find(c=>c.id===f.cliente_id);
      const rec={numero, preventivo_id:preventivo.id, cliente_id:f.cliente_id||null,
        cliente_nome:cli?cli.ragione_sociale:(preventivo.cliente_nome||""),
        riferimento:f.riferimento||"", stato:"aperta", priorita:"normale",
        consumi:suggerisciConsumi(righe.map(r=>({...r, imballo_pluriball:pluriballDaSalvare(r)})), prodotti),
        valore:Math.round((tot.imponibile||0)*100)/100, creato_da:profilo.id, aggiornato_il:new Date().toISOString()};
      const {data:nc,error}=await sb.from("commesse").insert(rec).select("id").single();
      if(error) throw error;
      // fasi dalle righe di manodopera (una per lavorazione)
      const fasi=righe.filter(r=>r.tipo==="manodopera"&&(r.lavorazione||r.descrizione))
        .map((r,idx)=>({commessa_id:nc.id, ordine:idx, chiave:uid(), reparto:r.lavorazione||"",
          descrizione:r.descrizione||r.lavorazione||"", stato:"da_fare",
          ore_previste:Number(r.quantita)||0, operatori:[]}));
      if(fasi.length){ const {error:ef}=await sb.from("commesse_fasi").insert(fasi); if(ef) throw ef; }
      // righe articolo dagli articoli/prodotti del preventivo (data consegna da compilare)
      const artRighe=righe.filter(r=>(r.tipo==="materiale"||r.tipo==="altro") && String(r.descrizione||"").trim())
        .map((r,idx)=>({commessa_id:nc.id, ordine:idx, descrizione:r.descrizione||"",
          articolo_id:r.articolo_id||null, quantita:Number(r.quantita)||0, unita:r.unita||"",
          data_consegna:null, stato:"da_produrre", config:r.config||null,
          modalita_consegna:r.modalita_consegna||"corriere",
          imballo_id:null, imballo_ids:imballiSel(r).filter(x=>x!=="__pluriball__"), imballo_pluriball:pluriballDaSalvare(r),
          imballo_costo:Math.round(costoImballoRiga(r)*100)/100}));
      if(artRighe.length){ const {error:er}=await sb.from("commesse_righe").insert(artRighe); if(er) throw er; }
      try{ await sb.rpc("ricalcola_impegni"); }catch(e){}
      setBusy(false);
      setCommMsg("Commessa "+numero+" creata con "+artRighe.length+" articolo/i"+(fasi.length?(" e "+fasi.length+" fase/i"):"")+". Aprila nel modulo 🏭 Commesse e imposta le date di consegna (obbligatorie).");
    }catch(ex){ setErr(ex.message); setBusy(false); }
  }

  return (
    <div className="overlay">
      <form className="modal" style={{maxWidth:1000}} onClick={e=>e.stopPropagation()} onSubmit={salva}>
        <header><h2>{nuovo?"Nuovo preventivo":"Preventivo "+(f.numero||"")}</h2>
          <button type="button" className="x" onClick={onClose}>×</button></header>
        <div className="body">
          {err && <div className="banner err">{err}</div>}
          {commMsg && <div className="banner" style={{background:"#e6f4ee",color:"#1f9c68"}}>🏭 {commMsg}</div>}

          <div className="section">
            <h3>Testata</h3>
            <div className="row">
              <div className="field" style={{flex:2}}><label>Cliente *</label>
                <select value={f.cliente_id} onChange={e=>set("cliente_id",e.target.value)} required>
                  <option value="">— scegli —</option>
                  {clienti.map(c=><option key={c.id} value={c.id}>{c.ragione_sociale}</option>)}
                </select></div>
              <div className="field" style={{maxWidth:140}}><label>Numero</label>
                <input value={f.numero} onChange={e=>set("numero",e.target.value)}/></div>
              <div className="field" style={{maxWidth:160}}><label>Data</label>
                <input type="date" value={f.data} onChange={e=>set("data",e.target.value)}/></div>
            </div>
            <div className="field"><label>Descrizione breve</label>
              <input value={f.descrizione_breve} onChange={e=>set("descrizione_breve",e.target.value)}
                     placeholder="per riconoscerlo nell'elenco — es. Stampa 10 pannelli forex 300×200"/></div>
            <div className="row">
              <div className="field"><label>Riferimento</label>
                <input value={f.riferimento} onChange={e=>set("riferimento",e.target.value)}/></div>
              <div className="field" style={{maxWidth:140}}><label>Validità (giorni)</label>
                <input type="number" value={f.validita_giorni} onChange={e=>set("validita_giorni",e.target.value)}/></div>
              <div className="field" style={{maxWidth:160}}><label>Stato</label>
                <select value={f.stato} onChange={e=>set("stato",e.target.value)}>
                  {Object.keys(STATI_PREV).map(s=><option key={s} value={s}>{STATI_PREV[s].l}</option>)}
                </select></div>
            </div>
            <div className="row">
              <div className="field"><label>Alla c.a. (referente)</label>
                <input value={f.referente_dest} onChange={e=>set("referente_dest",e.target.value)} placeholder="es. Mario Rossi – Ufficio Acquisti"/></div>
              <div className="field"><label>Email destinatario</label>
                <input type="email" list="prev-email-sugg" value={f.email_dest} onChange={e=>set("email_dest",e.target.value)} placeholder="a chi è rivolto il preventivo"/>
                <datalist id="prev-email-sugg">
                  {((clienti.find(c=>c.id===f.cliente_id)||{}).clienti_email||[]).map(em=><option key={em.id} value={em.indirizzo}>{em.categoria}</option>)}
                </datalist></div>
            </div>
          </div>

          <div className="section">
            <h3>Righe</h3>
            <div style={{overflow:"auto"}}>
              <table>
                <thead><tr>
                  <th>Tipo</th><th>Descrizione / Lavorazione</th><th>Q.tà</th><th>Prezzo €</th><th>Sc.%</th><th>Costo €</th>
                  <th style={{textAlign:"right"}}>Totale</th><th>Consegna</th><th></th>
                </tr></thead>
                <tbody>
                  {righe.length===0 && <tr><td colSpan={9} className="muted" style={{padding:14}}>Nessuna riga. Aggiungi materiale, manodopera o impianti qui sotto.</td></tr>}
                  {righe.map((r,i)=>{
                    const rt=(Number(r.quantita)||0)*(Number(r.prezzo_unitario)||0)*(1-(Number(r.sconto_pct)||0)/100);
                    return (
                      <tr key={i}>
                        <td style={{textTransform:"capitalize",fontSize:12}}>{r.tipo}</td>
                        <td style={{minWidth:220}}>
                          {r.tipo==="manodopera"
                            ? <select value={r.lavorazione} onChange={e=>setLavorazione(i,e.target.value)}
                                      style={{width:"100%",padding:"6px",border:"1px solid var(--line)",borderRadius:7}}>
                                <option value="">— scegli lavorazione —</option>
                                {LAV_OPZ.map(l=><option key={l} value={l}>{l}</option>)}
                              </select>
                            : <input value={r.descrizione} onChange={e=>setRiga(i,"descrizione",e.target.value)}
                                     style={{width:"100%",padding:"6px",border:"1px solid var(--line)",borderRadius:7}}/>}
                        </td>
                        <td><input type="number" step="any" value={r.quantita} onChange={e=>setRiga(i,"quantita",e.target.value)} style={numIn}/></td>
                        <td><input type="number" step="any" value={r.prezzo_unitario} onChange={e=>setRiga(i,"prezzo_unitario",e.target.value)} style={numIn}/></td>
                        <td><input type="number" step="any" value={r.sconto_pct} onChange={e=>setRiga(i,"sconto_pct",e.target.value)} style={{...numIn,width:56}}/></td>
                        <td><input type="number" step="any" value={r.costo_unitario} onChange={e=>setRiga(i,"costo_unitario",e.target.value)} style={numIn}/></td>
                        <td style={{textAlign:"right",fontWeight:600}}>{eur(rt)}</td>
                        <td>{(r.tipo==="materiale"||r.tipo==="altro")
                          ? <div style={{display:"flex",flexDirection:"column",gap:4}}>
                              <select value={r.modalita_consegna||"corriere"} onChange={e=>setRiga(i,"modalita_consegna",e.target.value)}
                                style={{padding:"5px",borderRadius:7,border:"1px solid var(--line)",fontSize:12,
                                  background:(MODALITA_CONSEGNA[r.modalita_consegna||"corriere"]||MODALITA_CONSEGNA.corriere).bg,
                                  color:(MODALITA_CONSEGNA[r.modalita_consegna||"corriere"]||MODALITA_CONSEGNA.corriere).c,fontWeight:600}}>
                                {Object.keys(MODALITA_CONSEGNA).map(m=><option key={m} value={m}>{MODALITA_CONSEGNA[m].l}</option>)}
                              </select>
                              {(()=>{ const scelto=(r.pagato_intero===true||r.pagato_intero===false);
                                return <select value={r.pagato_intero===true?"si":r.pagato_intero===false?"no":""}
                                  onChange={e=>setRiga(i,"pagato_intero", e.target.value===""?null:e.target.value==="si")}
                                  title="OBBLIGATORIO: serve al magazzino. Se il cliente paga l'intera lastra, l'avanzo torna a €0; se paga solo la parte usata, l'avanzo rientra a costo d'acquisto."
                                  style={{padding:"5px",borderRadius:7,fontSize:12,fontWeight:600,
                                    border: scelto?"1px solid var(--line)":"2px solid #c0392b",
                                    background: !scelto?"#fff":(r.pagato_intero===false?"#fdecec":"#e7f6ec"),
                                    color: !scelto?"#c0392b":(r.pagato_intero===false?"#c0392b":"#127a3e")}}>
                                  <option value="" disabled>⚠ Scegli chi paga il materiale…</option>
                                  <option value="si">Paga tutta la lastra → avanzo €0</option>
                                  <option value="no">Paga solo l'usato → avanzo a costo</option>
                                </select>; })()}
                              {(()=>{ const av=avanzoDisp[r.articolo_id]; return av&&av.mq>0
                                ? <span className="tag" style={{fontSize:10.5,background:av.zero>0?"#e7f6ec":"#eef1f5",color:av.zero>0?"#127a3e":"#41505c"}}>♻ avanzi: {av.mq} mq{av.zero>0?" ("+av.zero+" mq a €0)":""}</span>
                                : null; })()}
                              {imballiSel(r).length>0 && <div style={{display:"flex",flexWrap:"wrap",gap:3}}>
                                {imballiSel(r).map(id=><span key={id} className="tag" style={{fontSize:11,display:"inline-flex",alignItems:"center",gap:4}}>
                                  📦 {nomeImballo(r,id)} <span className="muted">{eur(costoUnImballo(r,id))}</span>
                                  <button type="button" onClick={()=>removeImballo(i,id)} style={{border:"none",background:"none",cursor:"pointer",color:"#c0392b",fontWeight:700,padding:0,lineHeight:1}}>×</button>
                                </span>)}
                              </div>}
                              <select value="" onChange={e=>{addImballo(i,e.target.value); e.target.value="";}}
                                style={{padding:"5px",borderRadius:7,border:"1px solid var(--line)",fontSize:12}}>
                                <option value="">＋ aggiungi imballo…</option>
                                {pluriballRiga(r) && !imballiSel(r).includes("__pluriball__") && <option value="__pluriball__">📦 Pluriball (automatico)</option>}
                                {imballiProdPrev.filter(im=>!imballiSel(r).includes(im.id)).map(im=><option key={im.id} value={im.id}>📦 {im.nome}</option>)}
                              </select>
                              {imballiSel(r).length>0 && <span className="muted" style={{fontSize:11,fontWeight:600}}>imballo tot. {eur(costoImballoRiga(r))}</span>}
                            </div>
                          : <span className="muted">—</span>}</td>
                        <td style={{whiteSpace:"nowrap"}}>
                          {r.config && <button type="button" className="btn small" title="Vedi/modifica composizione" onClick={()=>apriConfigModifica(i)}>🧩</button>}{" "}
                          <button type="button" className="btn small danger" onClick={()=>delRiga(i)}>✕</button></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:10}}>
              <button type="button" className="btn small primary" onClick={()=>{setConfigEditIdx(null);setConfigOpen(true);}}>🧩 + Prodotto configurabile</button>
              <button type="button" className="btn small" onClick={addManodopera}>+ Manodopera</button>
              <button type="button" className="btn small" onClick={addImpianto}>+ Impianto/avviamento</button>
              <button type="button" className="btn small" onClick={addLibera}>+ Riga libera</button>
            </div>
            {configOpen && <ConfiguratoreRiga prodotti={prodotti} imballi={imballi} articoli={articoli} modiLabel={MODI_VOCE}
              iniziale={configEditIdx!=null ? (righe[configEditIdx]&&righe[configEditIdx].config) : null} abbDefault={Number(imp.abbondanza_cm ?? 3)}
              onClose={()=>{setConfigOpen(false);setConfigEditIdx(null);}} onAdd={aggiungiRigaConfig}/>}
            <div style={{marginTop:10,position:"relative"}}>
              <input value={cercaArt} onChange={e=>setCercaArt(e.target.value)} placeholder="+ Materiale: cerca articolo dal catalogo…"
                     style={{width:"100%",maxWidth:440,padding:"8px 10px",border:"1px solid var(--line)",borderRadius:8}}/>
              {risultatiArt.length>0 &&
                <div className="card" style={{maxWidth:440,maxHeight:200,overflow:"auto",position:"absolute",zIndex:5,background:"#fff"}}>
                  {risultatiArt.map(a=>
                    <div key={a.id} onClick={()=>addMateriale(a)} style={{padding:"8px 12px",borderBottom:"1px solid var(--line)",cursor:"pointer"}}>
                      <b>{a.nome_articolo}</b> <span className="muted">{a.codice}</span>
                      <span className="muted" style={{float:"right"}}>{eur(a.prezzo_pubblico||0)}</span>
                    </div>)}
                </div>}
            </div>
          </div>

          <div className="section">
            <h3>Extra a carico cliente</h3>
            <div className="row">
              <div className="field" style={{maxWidth:230}}><label>Imballaggio €</label>
                <div style={{display:"flex",gap:6}}>
                  <input type="number" step="0.01" value={f.imballaggio} onChange={e=>set("imballaggio",e.target.value)} style={{flex:1}}/>
                  <button type="button" className="btn small" title="Calcola da un imballo di spedizione" onClick={()=>setImbOrdineOpen(true)}>🎁</button>
                </div></div>
              <div className="field" style={{maxWidth:230}}><label>Trasporto €</label>
                <div style={{display:"flex",gap:6}}>
                  <input type="number" step="0.01" value={f.trasporto} onChange={e=>set("trasporto",e.target.value)} style={{flex:1}}/>
                  <button type="button" className="btn small" title="Calcola dal listino corriere" onClick={()=>setTrasportoOpen(true)}>🚚</button>
                </div></div>
              <div className="field" style={{maxWidth:150}}><label>Spese generali %</label>
                <input type="number" step="0.1" value={f.spese_generali_pct} onChange={e=>set("spese_generali_pct",e.target.value)}/></div>
              <div className="field" style={{maxWidth:110}}><label>IVA %</label>
                <input type="number" step="0.1" value={f.iva_pct} onChange={e=>set("iva_pct",e.target.value)}/></div>
            </div>
            {imbOrdineOpen && <ImballoOrdine imballi={imballi} modiLabel={MODI_VOCE}
              onClose={()=>setImbOrdineOpen(false)}
              onAdd={(costo)=>{ set("imballaggio",Math.round(((Number(f.imballaggio)||0)+costo)*100)/100); setImbOrdineOpen(false); }}/>}
            {trasportoOpen && <CalcolatoreTrasporto corrieri={corrieri} articoli={articoli} righe={righe}
              onClose={()=>setTrasportoOpen(false)}
              onApply={(costo)=>{ set("trasporto",Math.round(costo*100)/100); setTrasportoOpen(false); }}/>}
          </div>

          <div className="card" style={{padding:16,background:"#fafbfc"}}>
            <div className="kv" style={{gridTemplateColumns:"1fr auto"}}>
              {tot.imbRighe>0 && <><span className="k">di cui imballo articoli</span><span style={{textAlign:"right"}} className="muted">{eur(tot.imbRighe)}</span></>}
              <span className="k">Imponibile</span><span style={{textAlign:"right"}}>{eur(tot.imponibile)}</span>
              <span className="k">Costo totale (incl. spese generali {f.spese_generali_pct||0}%)</span><span style={{textAlign:"right"}}>{eur(tot.costoTot)}</span>
              <span className="k">Margine</span>
              <span style={{textAlign:"right",fontWeight:700,color:sottoMargine?"var(--danger)":"var(--ok)"}}>{eur(tot.margine)} ({tot.marginePct.toFixed(1)}%)</span>
              <span className="k">IVA {f.iva_pct||0}%</span><span style={{textAlign:"right"}}>{eur(tot.iva)}</span>
              <span className="k" style={{fontWeight:800}}>TOTALE</span><span style={{textAlign:"right",fontWeight:800,fontSize:16}}>{eur(tot.totale)}</span>
            </div>
            {sottoMargine && <div className="banner err" style={{marginTop:10,marginBottom:0}}>⚠ Margine sotto la soglia minima ({f.margine_minimo_pct}%). Verifica i prezzi.</div>}
          </div>

          <div className="section" style={{marginTop:18}}>
            <h3>💶 Provvigione agente</h3>
            <div className="muted" style={{fontSize:12,marginBottom:8}}>La stabilisce il commerciale qui, in fase di preventivo. L'agente la vedrà solo in lettura. Calcolata sull'<b>imponibile</b> ({eur(tot.imponibile)}).</div>
            {(()=>{ const base=Number(tot.imponibile)||0;
              const provv=calcProvvTratt({valore_stimato:base, tipo_provvigione:f.tipo_provvigione,
                provvigione_pct:f.provvigione_pct===""?null:Number(f.provvigione_pct),
                prezzo_netto:Number(f.prezzo_netto)||0, quota_margine_pct:Number(f.quota_margine_pct)||0},{cliPct:null,agPct:null});
              const marg=Math.max(0, base-(Number(f.prezzo_netto)||0));
              return <>
                <div className="row">
                  <div className="field" style={{maxWidth:210}}><label>Come si calcola</label>
                    <select value={f.tipo_provvigione} onChange={e=>set("tipo_provvigione",e.target.value)}>
                      <option value="percentuale">% sul valore</option>
                      <option value="margine">A margine (su prezzo netto)</option>
                    </select></div>
                  {f.tipo_provvigione==="percentuale"
                    ? <div className="field" style={{maxWidth:170}}><label>Provvigione %</label>
                        <input type="number" step="0.5" value={f.provvigione_pct} onChange={e=>set("provvigione_pct",e.target.value)}
                          placeholder="(se vuoto: % cliente/agente)"/></div>
                    : <>
                        <div className="field" style={{maxWidth:190}}><label>Prezzo netto azienda €</label>
                          <input type="number" step="0.01" value={f.prezzo_netto} onChange={e=>set("prezzo_netto",e.target.value)} placeholder="quanto incassa l'azienda"/></div>
                        <div className="field" style={{maxWidth:150}}><label>Quota agente %</label>
                          <input type="number" step="5" min="0" max="100" value={f.quota_margine_pct} onChange={e=>set("quota_margine_pct",e.target.value)} placeholder="es. 50 o 100"/></div>
                      </>}
                </div>
                <div className="muted" style={{fontSize:12.5}}>
                  {f.tipo_provvigione==="margine"
                    ? <>Margine: <b>{eur(marg)}</b> (imponibile − netto) · Provvigione agente: <b style={{color:"var(--ok)"}}>{eur(provv)}</b></>
                    : <>Provvigione agente: <b style={{color:"var(--ok)"}}>{eur(provv)}</b>{f.provvigione_pct===""?<span> — lasciando vuoto userà la % del cliente o dell'agente</span>:null}</>}
                </div>
              </>; })()}
          </div>

          <div className="section" style={{marginTop:18}}>
            <h3>Note e condizioni</h3>
            <div className="field"><label>Note</label><textarea rows={2} value={f.note} onChange={e=>set("note",e.target.value)}/></div>
            <div className="field"><label>Condizioni di vendita</label><textarea rows={2} value={f.condizioni} onChange={e=>set("condizioni",e.target.value)}/></div>
          </div>
        </div>
        <footer>
          <button type="button" className="btn" style={{marginRight:8}} onClick={stampa} disabled={!f.cliente_id} title="PDF interno completo (con lavorazioni)">🖨️ PDF interno</button>
          <button type="button" className="btn" style={{marginRight:"auto"}} onClick={stampaCliente} disabled={!f.cliente_id} title="PDF per il cliente: lavorazioni fuse nel materiale, nessuna fase visibile">👤 PDF cliente</button>
          {!nuovo && f.stato==="accettato" &&
            <button type="button" className="btn" onClick={creaCommessa} disabled={busy} title="Genera una commessa di produzione da questo preventivo">🏭 Crea commessa</button>}
          <button type="button" className="btn" onClick={onClose}>Annulla</button>
          <button className="btn primary" disabled={busy}>{busy?<span className="spin"/>:"Salva preventivo"}</button>
        </footer>
      </form>
    </div>
  );
}

/* ------------------------------------------------ configuratore riga (misure -> prezzo) nel preventivo */
function ConfiguratoreRiga({prodotti,imballi,articoli,modiLabel,iniziale,abbDefault,onClose,onAdd}){
  const [selProd,setSelProd]=useState(iniziale?.prodotto_id||"");
  const [selVar,setSelVar]=useState(iniziale?.variante_id||"");
  const [mis,setMis]=useState(iniziale?.mis||{L:"",H:""});
  const [N,setN]=useState(iniziale?.N||1);
  const [vInput,setVInput]=useState(iniziale?.vInput||{});
  const [selImb,setSelImb]=useState(iniziale?.selImb||"");
  const [imbInput,setImbInput]=useState(iniziale?.imbInput||{});
  const [selArt,setSelArt]=useState(iniziale?.articolo_id||"");
  const [abb,setAbb]=useState(iniziale?.abbondanza_cm ?? (Number(abbDefault)||3));
  const primo=React.useRef(true);
  const prod=prodotti.find(p=>p.id===selProd);
  const varianti=prod? (prod.prodotti_config_varianti||[]).slice().sort((a,b)=>(a.ordine||0)-(b.ordine||0)) : [];
  const va=varianti.find(v=>v.id===selVar)||varianti[0]||{};
  const u=prod?prod.unita_calcolo:"mq";
  const modoL=v=>(modiLabel.find(m=>m.v===v)||{}).l||v;

  useEffect(()=>{ if(primo.current){ primo.current=false; return; } // al primo mount non resettare (prefill in modifica)
    if(prod){ const vv=(prod.prodotti_config_varianti||[]).slice().sort((a,b)=>(a.ordine||0)-(b.ordine||0));
    setSelVar(vv[0]?.id||""); setVInput({}); setImbInput({}); setMis({L:"",H:""}); setN(1); setSelArt("");} },[selProd]);

  const setV=(k,v)=>setVInput(p=>({...p,[k]:v}));
  const artCostoMap=React.useMemo(()=>{ const m={}; (articoli||[]).forEach(a=>{ m[a.id]=Number(a.costo)||0; }); return m; },[articoli]);
  const abbAttiva = u==="mq"||u==="mtl"||u==="mc";                       // solo materiali a superficie/lunghezza
  const abbUsata = abbAttiva ? (Number(abb)||0) : 0;
  const risultato = prod? calcolaConfigurato(prod,va,mis,Number(N)||0,vInput,artCostoMap,abbUsata) : null;
  // % di sfrido risultante sull'area (quadratica per mq/mc) o sulla lunghezza (lineare per mtl)
  const sfridoPct=(()=>{ const L=Number(mis.L)||0, H=Number(mis.H)||0;
    if(!abbUsata) return 0;
    if(u==="mtl"){ return L>0? ((L+abbUsata)/L-1)*100 : 0; }
    if(!(L>0&&H>0)) return 0;
    return (((L+abbUsata)*(H+abbUsata))/(L*H)-1)*100; })();
  const vociInput=(prod?.prodotti_config_voci||[]).filter(voce=>voce.opzionale || voceRichiedeInput(voce,u));
  const imballiProd=(imballi||[]).filter(x=>x.livello==="prodotto");
  const imbObj=imballiProd.find(x=>x.id===selImb)||null;
  const imballoCosto=imbObj? calcolaImballo(imbObj,mis,Number(N)||0,imbInput):0;
  const imbVociInput=imbObj? (imbObj.imballi_voci||[]).filter(v=>imbVoceRichiedeInput(v,imbObj.unita_calcolo)):[];
  // NB: l'imballo (pluriball incluso) NON si sceglie piu' qui: si sceglie SULLA RIGA del preventivo,
  // perche' lo stesso pannello a volte va imballato (spedizione) e a volte no (es. copertura banchetto).
  const costoFinale=(risultato?risultato.costoTot:0);
  const prezzoFinale=(risultato?risultato.prezzoTot:0);
  // Rete di sicurezza: il prezzo non copre il costo totale (materiale + voci) = vendita in perdita
  const sottoCosto = !!risultato && Number(prezzoFinale) < Number(costoFinale);

  function conferma(){
    if(!prod) return;
    if(sottoCosto && !window.confirm("⚠️ Attenzione: questo prodotto è SOTTO COSTO — vendi in perdita di "+eur(costoFinale-prezzoFinale)+" (prezzo "+eur(prezzoFinale)+" < costo "+eur(costoFinale)+").\n\nAggiungere comunque al preventivo?")) return;
    const nPez=Math.max(1,Number(N)||1);
    const desc=[prod.nome, va.nome, (u==="mq"||u==="mc")?(mis.L+"×"+mis.H+" cm"):(u==="mtl"?mis.L+" cm":""), "q.tà "+nPez]
      .filter(Boolean).join(" · ");
    const artId=selArt||va.articolo_id||null;
    const config={prodotto_id:selProd, variante_id:selVar||va.id, mis, N:nPez, vInput, articolo_id:artId, abbondanza_cm:abbUsata};
    onAdd({tipo:"materiale", descrizione:desc, articolo_id:artId, lavorazione:"",
      quantita:nPez, unita:u, costo_unitario:(costoFinale/nPez)||0, prezzo_unitario:(prezzoFinale/nPez)||0, sconto_pct:0, config});
  }

  return (
    <div className="overlay" style={{zIndex:60}}>
      <div className="modal" style={{maxWidth:720}} onClick={e=>e.stopPropagation()}>
        <header><h2>Prodotto configurabile</h2>
          <button type="button" className="x" onClick={onClose}>×</button></header>
        <div className="body">
          {prodotti.length===0 && <div className="banner err">Non ci sono prodotti configurabili. Creane prima uno in "🧩 Prodotti config.".</div>}
          <div className="field"><label>Prodotto</label>
            <select value={selProd} onChange={e=>setSelProd(e.target.value)}>
              <option value="">— scegli —</option>
              {prodotti.map(p=><option key={p.id} value={p.id}>{p.nome}</option>)}
            </select></div>

          {prod && <>
            {varianti.length>0 &&
              <div className="field"><label>Variante (materiale + spessore)</label>
                <select value={selVar} onChange={e=>setSelVar(e.target.value)}>
                  {varianti.map(v=><option key={v.id} value={v.id}>{v.nome||"Variante"}{v.spessore?" ("+v.spessore+"mm)":""}</option>)}
                </select></div>}

            <div className="field"><label>Materiale da magazzino <span className="muted" style={{textTransform:"none",fontWeight:400}}>(facoltativo — per scaricare dalla giacenza)</span></label>
              <select value={selArt} onChange={e=>setSelArt(e.target.value)}>
                <option value="">— {va.articolo_id?"usa il materiale della variante":"nessun aggancio al magazzino"} —</option>
                {(articoli||[]).map(a=>{ const disp=(Number(a.giacenza)||0)-(Number(a.impegnato)||0);
                  return <option key={a.id} value={a.id}>{a.nome_articolo}{a.unita?" ["+a.unita+"]":""} — disp. {disp}</option>; })}
              </select>
              {(articoli||[]).length===0
                ? <div className="muted" style={{fontSize:12,marginTop:4}}>Nessun articolo in catalogo: crea prima la materia prima (es. la lastra di forex in <b>mq</b>) in 📦 Catalogo.</div>
                : selArt && risultato
                  ? <div className="muted" style={{fontSize:12,marginTop:4}}>In commessa scaricherà <b>{Math.round((risultato.baseTot||0)*100)/100} {u}</b> dal magazzino (calcolati dalle misure). Carica la materia prima nella stessa unità (<b>{u}</b>).</div>
                  : null}
            </div>

            <div className="section">
              <h3>Misure</h3>
              <div className="row">
                {(u==="mq"||u==="mtl"||u==="mc") &&
                  <div className="field" style={{maxWidth:150}}><label>Larghezza (cm)</label>
                    <input type="number" step="0.1" value={mis.L} onChange={e=>setMis(p=>({...p,L:e.target.value}))} autoFocus/></div>}
                {(u==="mq"||u==="mc") &&
                  <div className="field" style={{maxWidth:150}}><label>Altezza (cm)</label>
                    <input type="number" step="0.1" value={mis.H} onChange={e=>setMis(p=>({...p,H:e.target.value}))}/></div>}
                {u==="mc" &&
                  <div className="field" style={{maxWidth:150}}><label>Spessore (mm)</label>
                    <input type="number" value={va.spessore||0} disabled/></div>}
                <div className="field" style={{maxWidth:130}}><label>Quantità (pz)</label>
                  <input type="number" min="1" value={N} onChange={e=>setN(e.target.value)}/></div>
                {abbAttiva &&
                  <div className="field" style={{maxWidth:160}}><label title="Rifilo/abbondanza aggiunta a ogni lato per smarginatura e crocini. Non cambia la misura mostrata al cliente, solo il consumo di materiale.">Abbondanza per lato (cm)</label>
                    <input type="number" step="0.1" min="0" value={abb} onChange={e=>setAbb(e.target.value)}/></div>}
              </div>
              {abbAttiva && abbUsata>0 && (()=>{ const L=Number(mis.L)||0, H=Number(mis.H)||0;
                const magg = u==="mtl" ? (L>0?(L+abbUsata)+" cm":"") : ((L>0&&H>0)?((L+abbUsata)+"×"+(H+abbUsata)+" cm"):"");
                return <div className="muted" style={{fontSize:12}}>Misura netta (cliente): <b>{u==="mtl"?(L||"—")+" cm":(L&&H?L+"×"+H+" cm":"—")}</b> → di lavorazione: <b>{magg||"—"}</b>{magg&&<> · sfrido <b style={{color:"#b26a00"}}>+{sfridoPct.toFixed(2)}%</b></>}</div>; })()}
              {risultato && u!=="pz" && <div className="muted" style={{fontSize:12}}>Materiale (con abbondanza) — totale {u}: {risultato.baseTot.toFixed(3)}</div>}
            </div>

            {vociInput.length>0 &&
              <div className="section">
                <h3>Lavorazioni e opzioni</h3>
                {vociInput.map(voce=>
                  <div className="row" key={voce.id} style={{alignItems:"center",marginBottom:6}}>
                    <div style={{flex:1}}>
                      {voce.opzionale
                        ? <label style={{display:"flex",gap:8,alignItems:"center"}}>
                            <input type="checkbox" checked={!!vInput["on_"+voce.id]} onChange={e=>setV("on_"+voce.id,e.target.checked)} style={{width:"auto"}}/>
                            {voce.descrizione||voce.lavorazione} <span className="muted">({modoL(voce.modo)} {eur(voce.costo)})</span>
                          </label>
                        : <span>{voce.descrizione||voce.lavorazione} <span className="muted">({modoL(voce.modo)} {eur(voce.costo)})</span></span>}
                    </div>
                    {voceRichiedeInput(voce,u) && (!voce.opzionale || vInput["on_"+voce.id]) &&
                      <div className="field" style={{maxWidth:140,margin:0}}>
                        <input type="number" step="0.01"
                               placeholder={voce.modo==="ora"?"ore":voce.modo==="passaggio"?"passaggi":voce.modo==="battuta"?"battute":voce.modo==="pz"?"pezzi":"quantità"}
                               value={vInput["q_"+voce.id]||""} onChange={e=>setV("q_"+voce.id,e.target.value)}/></div>}
                  </div>)}
                <div className="muted" style={{fontSize:12}}>Le voci "{u}" si calcolano dalle misure; per le altre inserisci la quantità (ore, passaggi, battute…).</div>
              </div>}

            <div className="banner info" style={{fontSize:12}}>📦 L'imballo (pluriball, scatola, scotch…) si sceglie <b>sulla riga del preventivo</b>, così decidi caso per caso se e come imballare.</div>

            <div className="card" style={{padding:14,background:"#fafbfc"}}>
              <div className="kv" style={{gridTemplateColumns:"1fr auto"}}>
                <span className="k">Costo prodotto</span><span style={{textAlign:"right"}}>{eur(risultato?.costoTot)}</span>
                {risultato?.fascia && <><span className="k">Sconto fascia (da {risultato.fascia.da_quantita} pz)</span><span style={{textAlign:"right"}}>−{risultato.fascia.sconto_pct}%</span></>}
                <span className="k" style={{fontWeight:700}}>Prezzo totale (q.tà {N})</span><span style={{textAlign:"right",fontWeight:800,fontSize:16,color:"var(--ok)"}}>{eur(prezzoFinale)}</span>
                <span className="k">Prezzo unitario</span><span style={{textAlign:"right"}}>{eur(prezzoFinale/Math.max(1,Number(N)||1))}/pz</span>
              </div>
              {sottoCosto && <div className="banner err" style={{marginTop:10,fontSize:12.5}}>
                ⚠️ <b>Prezzo sotto costo.</b> Il prezzo totale ({eur(prezzoFinale)}) non copre il costo del prodotto ({eur(costoFinale)}): vendita in <b>perdita di {eur(costoFinale-prezzoFinale)}</b>. Controlla margine, sconto fascia o prezzo minimo.
              </div>}
            </div>
          </>}
        </div>
        <footer>
          <button type="button" className="btn" onClick={onClose}>Annulla</button>
          <button type="button" className="btn primary" disabled={!prod} onClick={conferma}>Aggiungi al preventivo</button>
        </footer>
      </div>
    </div>
  );
}

/* ------------------------------------------------ imballo di spedizione (livello ordine) */
function ImballoOrdine({imballi,modiLabel,onClose,onAdd}){
  const imballiOrd=(imballi||[]).filter(x=>x.livello==="ordine");
  const [selImb,setSelImb]=useState("");
  const [mis,setMis]=useState({L:"",H:"",sp:""});
  const [N,setN]=useState(1);
  const [vInput,setVInput]=useState({});
  const imb=imballiOrd.find(x=>x.id===selImb)||null;
  const u=imb?imb.unita_calcolo:"pz";
  const costo=imb? calcolaImballo(imb,mis,Number(N)||0,vInput):0;
  const vociInput=imb? (imb.imballi_voci||[]).filter(v=>imbVoceRichiedeInput(v,imb.unita_calcolo)):[];
  const setV=(k,v)=>setVInput(p=>({...p,[k]:v}));
  useEffect(()=>{ setVInput({}); setMis({L:"",H:"",sp:""}); setN(1); },[selImb]);

  return (
    <div className="overlay" style={{zIndex:60}}>
      <div className="modal" style={{maxWidth:640}} onClick={e=>e.stopPropagation()}>
        <header><h2>Imballo spedizione</h2><button type="button" className="x" onClick={onClose}>×</button></header>
        <div className="body">
          {imballiOrd.length===0 && <div className="banner err">Nessun imballo di livello "ordine". Creane uno in "🎁 Imballi".</div>}
          <div className="field"><label>Imballo</label>
            <select value={selImb} onChange={e=>setSelImb(e.target.value)}>
              <option value="">— scegli —</option>
              {imballiOrd.map(x=><option key={x.id} value={x.id}>{x.nome}</option>)}
            </select></div>
          {imb && <>
            <div className="row">
              {(u==="mq"||u==="mtl"||u==="mc") && <div className="field" style={{maxWidth:140}}><label>Larghezza (cm)</label>
                <input type="number" step="0.1" value={mis.L} onChange={e=>setMis(p=>({...p,L:e.target.value}))}/></div>}
              {(u==="mq"||u==="mc") && <div className="field" style={{maxWidth:140}}><label>Altezza (cm)</label>
                <input type="number" step="0.1" value={mis.H} onChange={e=>setMis(p=>({...p,H:e.target.value}))}/></div>}
              {u==="mc" && <div className="field" style={{maxWidth:140}}><label>Spessore (mm)</label>
                <input type="number" value={mis.sp} onChange={e=>setMis(p=>({...p,sp:e.target.value}))}/></div>}
              <div className="field" style={{maxWidth:120}}><label>Quantità</label>
                <input type="number" min="1" value={N} onChange={e=>setN(e.target.value)}/></div>
            </div>
            {vociInput.map(v=>
              <div className="row" key={v.id} style={{alignItems:"center",marginBottom:6}}>
                <div style={{flex:1}}>{v.descrizione} <span className="muted">({(modiLabel.find(m=>m.v===v.modo)||{}).l||v.modo} {eur(v.costo)})</span></div>
                <div className="field" style={{maxWidth:140,margin:0}}>
                  <input type="number" step="0.01" placeholder={v.modo==="ora"?"ore":"quantità"} value={vInput["q_"+v.id]||""} onChange={e=>setV("q_"+v.id,e.target.value)}/></div>
              </div>)}
            <div className="card" style={{padding:14,background:"#fafbfc"}}>
              <div className="kv" style={{gridTemplateColumns:"1fr auto"}}>
                <span className="k" style={{fontWeight:700}}>Costo imballo</span>
                <span style={{textAlign:"right",fontWeight:800,color:"var(--ok)"}}>{eur(costo)}</span>
              </div>
            </div>
          </>}
        </div>
        <footer>
          <button type="button" className="btn" onClick={onClose}>Annulla</button>
          <button type="button" className="btn primary" disabled={!imb} onClick={()=>onAdd(costo)}>Aggiungi all'imballaggio</button>
        </footer>
      </div>
    </div>
  );
}

/* ================================================================ PRODOTTI CONFIGURABILI (motore misure->prezzo) */
/* =====================================================================
   ORDINI KOMUNIGO (e-commerce) — pannello staff: ordini dal negozio online
   + download dei file grafici caricati dai clienti. Separato dalle commesse.
   ===================================================================== */
function ModuloOrdiniShop({profilo,perm}){
  const [ordini,setOrdini]=useState(null);
  const [righe,setRighe]=useState([]);
  const [files,setFiles]=useState([]);
  const [comm,setComm]=useState({});   // id commessa -> {numero,stato}
  const [err,setErr]=useState("");
  const [sel,setSel]=useState(null);
  const [cerca,setCerca]=useState("");

  const carica=useCallback(async()=>{
    setErr("");
    const [o,r,f]=await Promise.all([
      sb.from("komunigo_ordini").select("*").order("creato_il",{ascending:false}),
      sb.from("komunigo_ordini_righe").select("*"),
      sb.from("komunigo_ordini_file").select("*"),
    ]);
    if(o.error){ setErr(o.error.message); setOrdini([]); return; }
    const ords=o.data||[];
    setOrdini(ords); setRighe(r.data||[]); setFiles(f.data||[]);
    setSel(prev=> prev ? (ords.find(x=>x.id===prev.id)||prev) : prev);   // tieni fresco il dettaglio aperto
    const cids=[...new Set(ords.map(x=>x.commessa_id).filter(Boolean))];
    if(cids.length){ const {data:cc}=await sb.from("commesse").select("id,numero,stato").in("id",cids);
      const m={}; (cc||[]).forEach(c=>m[c.id]=c); setComm(m); }
    else setComm({});
  },[]);
  useEffect(()=>{ carica(); },[carica]);

  // stati impostabili A MANO solo PRIMA della commessa; dopo, lo stato lo guida la commessa
  const STATI=["nuovo","pagato","annullato"];
  async function setStato(ord, nuovo){
    const {error}=await sb.from("komunigo_ordini").update({stato:nuovo}).eq("id",ord.id);
    if(error){ setErr(error.message); return; }
    await carica();
  }
  const nFile = oid => files.filter(f=>f.ordine_id===oid).length;
  const q=cerca.trim().toLowerCase();
  const lista=(ordini||[]).filter(o=>!q || (o.numero||"").toLowerCase().includes(q) || (o.cliente_nome||"").toLowerCase().includes(q) || (o.cliente_email||"").toLowerCase().includes(q));
  // se c'è una commessa collegata lo stato mostrato SEGUE la commessa (dove si trova la lavorazione)
  const badge = o => {
    const c = o.commessa_id && comm[o.commessa_id];
    if(c){ const s=STATI_COMMESSA[c.stato]||STATI_COMMESSA.aperta; return <span className="tag" style={{background:s.bg,color:s.c}}>{s.l}</span>; }
    const col={nuovo:["#eef2ff","#3a49b8"],pagato:["#e6f4ea","#1e7d34"],in_lavorazione:["#fdf0e3","#c47a1e"],spedito:["#e4edf6","#2E6FB0"],annullato:["#fde8e8","#c0392b"]}[o.stato]||["#f0f0f0","#666"];
    return <span className="tag" style={{background:col[0],color:col[1]}}>{o.stato}</span>;
  };

  return (
    <>
      <div className="topbar"><h1>🌐 Ordini Komunigo</h1></div>
      <div className="content">
        {err && <div className="banner err">{err}</div>}
        <div className="banner info">Ordini arrivati dal <b>negozio online Komunigo</b> (e-commerce), separati dalle commesse interne. Qui vedi i dati del cliente e <b>scarichi i file grafici</b> caricati per ogni prodotto.</div>
        <div className="toolbar">
          <div className="search"><span className="mag">🔍</span><input placeholder="Cerca numero, cliente, email…" value={cerca} onChange={e=>setCerca(e.target.value)}/></div>
          <span className="muted">{lista.length} ordini</span>
        </div>
        {ordini===null? <div className="empty">Caricamento…</div>
         : lista.length===0? <div className="card empty">Nessun ordine dal negozio.</div>
         : <div className="card" style={{overflow:"auto"}}>
            <table>
              <thead><tr><th>Numero</th><th>Data</th><th>Cliente</th><th>Consegna</th><th style={{textAlign:"right"}}>Totale</th><th>File</th><th>Commessa</th><th>Stato</th></tr></thead>
              <tbody>
                {lista.map(o=>{ const sp=(o.spedizione&&o.spedizione.opzione)||null; const c=o.commessa_id&&comm[o.commessa_id]; return (
                  <tr key={o.id} onClick={()=>setSel(o)} style={{cursor:"pointer"}}>
                    <td className="rs">{o.numero}</td>
                    <td className="muted">{o.creato_il? new Date(o.creato_il).toLocaleDateString("it-IT"):""}</td>
                    <td>{o.cliente_nome}<div className="muted" style={{fontSize:12}}>{o.cliente_email}</div></td>
                    <td className="muted">{sp? sp.nome : "—"}</td>
                    <td style={{textAlign:"right",fontWeight:700}}>{eur(o.totale)}</td>
                    <td style={{textAlign:"center"}}>{nFile(o.id)||"—"}</td>
                    <td className="muted">{c? c.numero : "—"}</td>
                    <td onClick={e=>e.stopPropagation()}>{badge(o)}</td>
                  </tr>); })}
              </tbody>
            </table>
          </div>}
      </div>
      {sel && <OrdineShopDettaglio ordine={sel} righe={righe.filter(r=>r.ordine_id===sel.id)} files={files.filter(f=>f.ordine_id===sel.id)}
        commessa={sel.commessa_id?comm[sel.commessa_id]:null}
        perm={perm} profilo={profilo} stati={STATI} onStato={setStato} onChanged={carica} onClose={()=>setSel(null)}/>}
    </>
  );
}

/* ---- dettaglio ordine e-commerce con download file ---- */
function OrdineShopDettaglio({ordine,righe,files,commessa,perm,profilo,stati,onStato,onChanged,onClose}){
  const [urls,setUrls]=useState({});
  const [genBusy,setGenBusy]=useState(false);
  const [genMsg,setGenMsg]=useState("");
  const [commFatta,setCommFatta]=useState(!!ordine.commessa_id);
  const [pagState,setPagState]=useState(ordine.pagamento_stato);
  const [pagBusy,setPagBusy]=useState(false);
  const PAG_LAB={carta:"Carta di credito", bonifico:"Bonifico anticipato", ritiro:"Pagamento al ritiro", paypal:"PayPal"};
  async function confermaIncasso(){
    setPagBusy(true);
    try{
      const upd={pagamento_stato:"pagato"};
      if(ordine.stato==="nuovo") upd.stato="pagato";
      const {error}=await sb.from("komunigo_ordini").update(upd).eq("id",ordine.id);
      if(error) throw error;
      setPagState("pagato"); if(onChanged) onChanged();
    }catch(e){ setGenMsg("Errore: "+(e.message||e)); }
    setPagBusy(false);
  }
  useEffect(()=>{ (async()=>{
    const m={};
    for(const f of files){
      try{ const {data}=await sb.storage.from("komunigo-ordini").createSignedUrl(f.path,3600); if(data) m[f.id]=data.signedUrl; }catch(e){}
    }
    setUrls(m);
  })(); },[ordine.id, files.length]);

  async function generaCommessa(){
    if(commFatta && !window.confirm("Questo ordine ha già una commessa collegata. Vuoi generarne un'altra?")) return;
    if(ordine.bozza_stato && ordine.bozza_stato!=="approvata"){ setGenMsg("Prima serve l'approvazione della bozza grafica dal cliente."); return; }
    setGenBusy(true); setGenMsg("");
    try{
      const {data:tutte}=await sb.from("commesse").select("numero");
      const numero=prossimoNumeroCommessaKomunigo(tutte||[]);
      // materiali da consumare: calcolati dalle varianti+misure come per i preventivi
      const cfgIds=[...new Set(righe.filter(r=>r.prodotto_config_id).map(r=>r.prodotto_config_id))];
      let prodottiCfg=[];
      if(cfgIds.length){ const {data:pc}=await sb.from("prodotti_config")
        .select("*, prodotti_config_varianti(*), prodotti_config_voci(*), prodotti_config_fasce(*)").in("id",cfgIds);
        prodottiCfg=pc||[]; }
      const {data:imp}=await sb.from("impostazioni").select("abbondanza_cm").eq("id",1).maybeSingle();
      const abb=Number(imp&&imp.abbondanza_cm)||0;
      const righeConsumi=righe.map(r=> r.prodotto_config_id
        ? {config:{prodotto_id:r.prodotto_config_id, variante_id:r.config&&r.config.variante_id,
            mis:{L:r.config&&r.config.larghezza_cm, H:r.config&&r.config.altezza_cm}, N:Number(r.quantita)||0, vInput:{}, abbondanza_cm:abb}}
        : {articolo_id:r.articolo_id, descrizione:r.descrizione, quantita:Number(r.quantita)||0, unita:(r.config&&r.config.unita_calcolo)||""});
      const consumiCalc=suggerisciConsumi(righeConsumi, prodottiCfg);
      const rec={numero, preventivo_id:null, cliente_id:null,
        cliente_nome: ordine.cliente_nome||"Cliente e-commerce",
        riferimento:"Ordine Komunigo "+ordine.numero, stato:"aperta", priorita:"normale",
        consumi:consumiCalc, valore:Math.round((Number(ordine.imponibile)||0)*100)/100,
        creato_da:profilo.id, aggiornato_il:new Date().toISOString()};
      const {data:nc,error}=await sb.from("commesse").insert(rec).select("id,numero").single();
      if(error) throw error;
      const cr=righe.map((r,idx)=>({commessa_id:nc.id, ordine:idx, descrizione:r.descrizione||"",
        articolo_id:r.articolo_id||null, quantita:Number(r.quantita)||0,
        unita:(r.config&&r.config.unita_calcolo)||"", data_consegna:null, stato:"da_produrre",
        config:{...(r.config||{}), komunigo_ordine:ordine.numero, komunigo_ordine_id:ordine.id, komunigo_riga_id:r.id},
        modalita_consegna:"corriere", imballo_ids:[], imballo_pluriball:null, imballo_costo:0}));
      if(cr.length){ const {error:er}=await sb.from("commesse_righe").insert(cr); if(er) throw er; }
      const fasi=righe.map((r,idx)=>({commessa_id:nc.id, ordine:idx, chiave:uid(), reparto:"Produzione",
        descrizione:r.descrizione||"Produzione", stato:"da_fare", ore_previste:0, operatori:[]}));
      if(fasi.length){ const {error:ef}=await sb.from("commesse_fasi").insert(fasi); if(ef) throw ef; }
      await sb.from("komunigo_ordini").update({commessa_id:nc.id, stato:"in_lavorazione"}).eq("id",ordine.id);
      try{ await sb.rpc("ricalcola_impegni"); }catch(e){}
      setCommFatta(true);
      setGenMsg("✅ Commessa "+nc.numero+" creata e ordine messo in lavorazione. Aprila nel modulo 🏭 Commesse per impostare le date di consegna. I file grafici del cliente restano scaricabili da qui.");
      if(onChanged) onChanged();
    }catch(ex){ setGenMsg("Errore: "+(ex.message||ex)); }
    setGenBusy(false);
  }

  const sp=(ordine.spedizione&&ordine.spedizione.opzione)||null;
  const indir=(ordine.spedizione&&ordine.spedizione.indirizzo)||null;
  const fileDiRiga=rid=>files.filter(f=>f.ordine_riga_id===rid && f.tipo!=="bozza");
  const fileSenzaRiga=files.filter(f=>!f.ordine_riga_id && f.tipo!=="bozza");
  const bozzaFiles=files.filter(f=>f.tipo==="bozza");
  const kb=n=> n? (n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB"):"";
  const [bozBusy,setBozBusy]=useState(false);
  const bozzaBadge=st=>{
    const m={da_approvare:["In attesa di approvazione dal cliente","#eef4ff","#3a49b8"],approvata:["Approvata dal cliente ✅","#e6f4ee","#1f9c68"],modifiche_richieste:["Il cliente ha chiesto modifiche","#fdf0e3","#c47a1e"]}[st];
    if(!st||!m) return <span className="muted" style={{fontSize:13}}>Nessuna bozza caricata.</span>;
    return <span className="tag" style={{background:m[1],color:m[2]}}>{m[0]}</span>;
  };
  async function caricaBozza(e){
    const file=(e.target.files||[])[0]; e.target.value=""; if(!file) return;
    setBozBusy(true); setGenMsg("");
    try{
      const ext=(file.name.split(".").pop()||"pdf").toLowerCase().replace(/[^a-z0-9]/g,"");
      const path=ordine.id+"/bozza/"+Date.now()+"-"+Math.random().toString(36).slice(2,7)+"."+(ext||"pdf");
      const {error:eU}=await sb.storage.from("komunigo-ordini").upload(path,file,{cacheControl:"60",upsert:false});
      if(eU) throw eU;
      const {error:eI}=await sb.from("komunigo_ordini_file").insert({ordine_id:ordine.id, tipo:"bozza", path, nome_file:file.name, dimensione:file.size, mime:file.type});
      if(eI) throw eI;
      const {error:eO}=await sb.from("komunigo_ordini").update({bozza_stato:"da_approvare", bozza_feedback:null}).eq("id",ordine.id);
      if(eO) throw eO;
      if(onChanged) onChanged();
    }catch(ex){ setGenMsg("Errore bozza: "+(ex.message||ex)); }
    setBozBusy(false);
  }

  return (
    <div className="overlay" style={{zIndex:60}}>
      <div className="modal" style={{maxWidth:760}} onClick={e=>e.stopPropagation()}>
        <header><h2>Ordine {ordine.numero}</h2><button type="button" className="x" onClick={onClose}>×</button></header>
        <div className="body">
          <div className="two">
            <div><div className="muted" style={{fontSize:12}}>Cliente</div><b>{ordine.cliente_nome||"—"}</b>
              <div style={{fontSize:13}}>{ordine.cliente_email}{ordine.cliente_tel?(" · "+ordine.cliente_tel):""}</div></div>
            <div><div className="muted" style={{fontSize:12}}>Consegna</div><b>{sp?sp.nome:"—"}</b>
              {indir && <div style={{fontSize:13}}>{indir}</div>}</div>
          </div>

          <div style={{marginTop:12,padding:12,borderRadius:10,background: pagState==="pagato"?"#f3faf6":"#fff8ec",border:"1px solid "+(pagState==="pagato"?"#bfe3cf":"#f0d8a8"),display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:200,fontSize:13}}>💳 <b>Pagamento:</b> {PAG_LAB[ordine.pagamento_metodo]||ordine.pagamento_metodo||"—"} — {pagState==="pagato"? <b style={{color:"#1e7d34"}}>incassato ✅</b> : <b style={{color:"#c47a1e"}}>in attesa</b>}</div>
            {perm.scrivi && pagState!=="pagato" && <button type="button" className="btn small primary" disabled={pagBusy} onClick={confermaIncasso}>{pagBusy?"…":"Conferma incasso"}</button>}
          </div>

          {(commFatta||commessa)
            ? <div style={{marginTop:12,padding:12,borderRadius:10,background:"#f3faf6",border:"1px solid #bfe3cf",fontSize:13}}>
                🏭 <b>In produzione</b> — commessa <b>{commessa? commessa.numero : "collegata"}</b>
                {commessa? <> · stato <b>{(STATI_COMMESSA[commessa.stato]||STATI_COMMESSA.aperta).l}</b></> : null}
                <div className="muted" style={{fontSize:12,marginTop:4}}>Lo stato dell'ordine <b>segue la commessa</b>. Aprila nel modulo 🏭 Commesse per gestire la lavorazione e le date di consegna.</div>
              </div>
            : <>
                {perm.scrivi && <div className="field" style={{marginTop:12,maxWidth:260}}><label>Stato ordine</label>
                  <select value={ordine.stato} onChange={e=>onStato(ordine,e.target.value)}>
                    {stati.map(s=><option key={s} value={s}>{s}</option>)}
                  </select></div>}
                {perm.scrivi && <div style={{marginTop:14,padding:14,borderRadius:10,background:"#eef4ff",border:"1px solid #c3d4f5",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
                  <div style={{flex:1,minWidth:200,fontSize:13}}>Manda l'ordine <b>in produzione</b>: genera una commessa con i prodotti dell'ordine.</div>
                  <button type="button" className="btn primary" disabled={genBusy} onClick={generaCommessa}>
                    {genBusy? "Genero…" : "🏭 Genera commessa e manda in produzione"}</button>
                </div>}
              </>}
          {genMsg && <div className={"banner "+(genMsg.startsWith("Errore")?"err":"info")} style={{marginTop:8}}>{genMsg}</div>}

          <div className="section">
            <h3>Prodotti e file caricati</h3>
            {righe.map(r=>{ const ff=fileDiRiga(r.id); return (
              <div key={r.id} className="card" style={{padding:12,marginBottom:10,background:"#fafbfc"}}>
                <div style={{display:"flex",justifyContent:"space-between",gap:10}}>
                  <b>{r.descrizione}</b><span className="muted">{r.quantita} pz · {eur(r.prezzo_totale)}</span></div>
                {r.config && (r.config.larghezza_cm||r.config.variante_id) &&
                  <div className="muted" style={{fontSize:12,marginTop:2}}>{r.config.larghezza_cm?`${r.config.larghezza_cm}×${r.config.altezza_cm} cm`:""}</div>}
                <div style={{marginTop:8}}>
                  {ff.length===0? <span className="muted" style={{fontSize:13}}>⚠ Nessun file caricato dal cliente</span>
                   : ff.map(f=> <div key={f.id} style={{display:"flex",alignItems:"center",gap:8,fontSize:13,marginTop:3}}>
                       📎 {urls[f.id]? <a href={urls[f.id]} target="_blank" rel="noopener noreferrer">{f.nome_file}</a> : f.nome_file}
                       <span className="muted" style={{fontSize:12}}>{kb(f.dimensione)}</span></div>)}
                </div>
              </div>); })}
            {fileSenzaRiga.length>0 && <div className="card" style={{padding:12,background:"#fafbfc"}}>
              <b>Altri file</b>
              {fileSenzaRiga.map(f=><div key={f.id} style={{display:"flex",alignItems:"center",gap:8,fontSize:13,marginTop:3}}>
                📎 {urls[f.id]? <a href={urls[f.id]} target="_blank" rel="noopener noreferrer">{f.nome_file}</a>:f.nome_file}
                <span className="muted" style={{fontSize:12}}>{kb(f.dimensione)}</span></div>)}
            </div>}
          </div>

          <div className="section">
            <h3>🎨 Bozza grafica (simulazione di stampa)</h3>
            <div className="muted" style={{fontSize:12,marginBottom:8}}>Carica la simulazione da far approvare al cliente. La <b>commessa si genera solo a bozza approvata</b>. (Facoltativa: se non carichi bozze, l'ordine si può produrre subito.)</div>
            <div style={{marginBottom:8}}>{bozzaBadge(ordine.bozza_stato)}</div>
            {ordine.bozza_stato==="modifiche_richieste" && ordine.bozza_feedback &&
              <div className="banner" style={{background:"#fdf0e3",border:"1px solid #f0d8a8",fontSize:13,marginBottom:8}}><b>Modifiche chieste dal cliente:</b> {ordine.bozza_feedback}</div>}
            {bozzaFiles.length>0 && <div style={{marginBottom:8}}>{bozzaFiles.map(f=>(
              <div key={f.id} style={{display:"flex",alignItems:"center",gap:8,fontSize:13,marginTop:3}}>
                🖼️ {urls[f.id]? <a href={urls[f.id]} target="_blank" rel="noopener noreferrer">{f.nome_file}</a> : f.nome_file}
                <span className="muted" style={{fontSize:12}}>{kb(f.dimensione)}</span></div>))}</div>}
            {perm.scrivi && <label className="btn small" style={{cursor:"pointer"}}>
              {bozBusy? "Carico…" : (ordine.bozza_stato? "⬆ Sostituisci bozza" : "⬆ Carica bozza per il cliente")}
              <input type="file" onChange={caricaBozza} disabled={bozBusy} style={{display:"none"}}/></label>}
          </div>

          <div className="card" style={{padding:14,background:"#fafbfc"}}>
            <div className="kv" style={{gridTemplateColumns:"1fr auto"}}>
              <span className="k">Imponibile</span><span style={{textAlign:"right"}}>{eur(ordine.imponibile)}</span>
              <span className="k">IVA</span><span style={{textAlign:"right"}}>{eur(ordine.iva)}</span>
              <span className="k" style={{fontWeight:700}}>Totale</span><span style={{textAlign:"right",fontWeight:800}}>{eur(ordine.totale)}</span>
            </div>
          </div>
        </div>
        <footer><button type="button" className="btn" onClick={onClose}>Chiudi</button></footer>
      </div>
    </div>
  );
}

/* =====================================================================
   VETRINA E-COMMERCE (Komunigo) — scheda pubblica di ogni prodotto:
   descrizione, caratteristiche, immagini di galleria, PDF del template.
   Copre articoli vendibili E prodotti configurabili. Salva in komunigo_schede.
   ===================================================================== */
const KOMUNIGO_BUCKET="komunigo-public";
const kPub = path => path ? sb.storage.from(KOMUNIGO_BUCKET).getPublicUrl(path).data.publicUrl : "";
const kSafeExt = name => (String(name).split(".").pop()||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const kNewPath = (pref,ext) => pref+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+(ext?"."+ext:"");

function ModuloVetrina({profilo,perm}){
  const [articoli,setArticoli]=useState([]);
  const [config,setConfig]=useState([]);
  const [schede,setSchede]=useState([]);
  const [loading,setLoading]=useState(true);
  const [err,setErr]=useState("");
  const [cerca,setCerca]=useState("");
  const [edit,setEdit]=useState(null);

  const carica=useCallback(async()=>{
    setLoading(true); setErr("");
    try{
      const [a,c,s]=await Promise.all([
        sb.from("articoli").select("id,nome_articolo,codice,categoria").eq("vendibile",true).order("nome_articolo"),
        sb.from("prodotti_config").select("id,nome").eq("attivo",true).order("nome"),
        sb.from("komunigo_schede").select("*"),
      ]);
      if(a.error) throw a.error; if(c.error) throw c.error; if(s.error) throw s.error;
      setArticoli(a.data||[]); setConfig(c.data||[]); setSchede(s.data||[]);
    }catch(ex){ setErr(ex.message||String(ex)); }
    setLoading(false);
  },[]);
  useEffect(()=>{ carica(); },[carica]);

  const smap={}; schede.forEach(s=>{ smap[s.tipo+":"+s.ref_id]=s; });
  const items=[
    ...articoli.map(a=>({tipo:"articolo", ref_id:a.id, nome:a.nome_articolo, extra:a.categoria||a.codice||"a magazzino"})),
    ...config.map(c=>({tipo:"configuratore", ref_id:c.id, nome:c.nome, extra:"su misura"})),
  ];
  const q=cerca.trim().toLowerCase();
  const shown=items.filter(it=> !q || (it.nome||"").toLowerCase().includes(q));

  return (
    <>
      <div className="topbar"><h1>Vetrina e-commerce</h1></div>
      <div className="content">
        {err && <div className="banner err">{err}</div>}
        <div className="banner info">Prepara la <b>scheda pubblica</b> di ogni prodotto del negozio Komunigo: descrizione, caratteristiche, foto e il <b>PDF del template</b> (dove il cliente posiziona la grafica). I prezzi restano gestiti in Catalogo / Prodotti config.</div>
        <div className="toolbar">
          <div className="search"><span className="mag">🔍</span>
            <input placeholder="Cerca prodotto…" value={cerca} onChange={e=>setCerca(e.target.value)}/></div>
          <span className="muted">{shown.length} prodotti pubblicati</span>
        </div>
        {loading? <div className="empty">Caricamento…</div>
          : shown.length===0? <div className="card empty">Nessun prodotto pubblicato. Rendi "vendibile" un articolo in 📦 Catalogo, oppure attiva un configuratore in 🧩 Prodotti config.</div>
          : <div className="card" style={{overflow:"auto"}}>
              <table>
                <thead><tr><th>Prodotto</th><th>Tipo</th><th>Scheda</th><th>Foto</th><th>Template PDF</th><th></th></tr></thead>
                <tbody>
                  {shown.map(it=>{ const s=smap[it.tipo+":"+it.ref_id];
                    const compilata = s && String(s.descrizione||"").trim();
                    const nFoto = s && Array.isArray(s.immagini)? s.immagini.length : 0;
                    return <tr key={it.tipo+":"+it.ref_id} onClick={()=>setEdit({item:it, scheda:s||null})} style={{cursor:"pointer"}}>
                      <td className="rs">{it.nome}<div className="muted" style={{fontSize:12}}>{it.extra}</div></td>
                      <td className="muted">{it.tipo==="configuratore"?"Su misura":"A magazzino"}</td>
                      <td>{compilata
                        ? <span className="tag" style={{background:"#e6f4ea",color:"#1e7d34"}}>Completa</span>
                        : s ? <span className="tag" style={{background:"#fdf0e3",color:"#c47a1e"}}>Iniziata</span>
                            : <span className="tag" style={{background:"#f0f0f0",color:"#888"}}>Da fare</span>}</td>
                      <td>{nFoto>0? nFoto : <span className="muted">—</span>}</td>
                      <td onClick={e=>e.stopPropagation()}>{s&&s.template_path
                        ? <a href={kPub(s.template_path)} target="_blank" rel="noopener noreferrer">📄 {s.template_nome||"PDF"}</a>
                        : <span className="muted">—</span>}</td>
                      <td style={{textAlign:"right"}}><button className="btn small" onClick={e=>{e.stopPropagation();setEdit({item:it, scheda:s||null});}}>{perm.scrivi?"✏️ Modifica":"👁 Vedi"}</button></td>
                    </tr>; })}
                </tbody>
              </table>
            </div>}
        <MediaHomepage perm={perm} tabella="komunigo_lavori" prefisso="lavori" wide={false}
          titolo="🏠 Lavori in homepage"
          nota={"Le foto reali mostrate in homepage nella sezione “Fatti da noi, installati da noi”. Meglio immagini quadrate 1000×1000. Se vuota, restano i segnaposto."}/>
        <MediaHomepage perm={perm} tabella="komunigo_carosello" prefisso="carosello" wide={true}
          titolo="🎞️ Carosello home"
          nota={"Foto larghe che scorrono in loop nella banda sotto l’hero. Consigliato 1920×720 (16:6). Se vuoto, il carosello non appare."}/>
      </div>
      {edit && <SchedaEditor item={edit.item} scheda={edit.scheda} perm={perm}
        onClose={()=>setEdit(null)} onSaved={()=>{ setEdit(null); carica(); }}/>}
    </>
  );
}

/* ---- foto homepage riusabile (lavori installati + carosello), dal gestionale ---- */
function MediaHomepage({perm, tabella, prefisso, titolo, nota, wide}){
  const [rows,setRows]=useState(null);
  const [err,setErr]=useState(""); const [up,setUp]=useState(false);
  const carica=useCallback(async()=>{
    setErr("");
    const {data,error}=await sb.from(tabella).select("*").order("ordine");
    if(error){ setErr(error.message); setRows([]); return; }
    setRows(data||[]);
  },[tabella]);
  useEffect(()=>{ carica(); },[carica]);
  const set=(i,k,v)=>setRows(p=>p.map((r,j)=>j===i?{...r,[k]:v}:r));
  const addRow=()=>setRows(p=>[...(p||[]),{_nuovo:true,id:"n"+Date.now(),titolo:"",sottotitolo:"",path:null,ordine:(p&&p.length)||0,attivo:true}]);
  async function salva(r){
    setErr("");
    try{
      const payload={titolo:r.titolo||"", sottotitolo:r.sottotitolo||"", path:r.path||null, ordine:Number(r.ordine)||0, attivo:r.attivo!==false};
      if(r._nuovo){ const {error}=await sb.from(tabella).insert(payload); if(error) throw error; }
      else { const {error}=await sb.from(tabella).update(payload).eq("id",r.id); if(error) throw error; }
      await carica();
    }catch(ex){ setErr(ex.message||String(ex)); }
  }
  async function elimina(r){
    if(r._nuovo){ setRows(p=>p.filter(x=>x!==r)); return; }
    if(!window.confirm("Eliminare questa foto dalla homepage?")) return;
    try{ if(r.path){ try{ await sb.storage.from(KOMUNIGO_BUCKET).remove([r.path]); }catch(e){} }
      const {error}=await sb.from(tabella).delete().eq("id",r.id); if(error) throw error; await carica();
    }catch(ex){ setErr(ex.message||String(ex)); }
  }
  async function caricaFoto(i,e){
    const file=(e.target.files||[])[0]; e.target.value=""; if(!file) return;
    if(!file.type.startsWith("image/")){ setErr("Serve un'immagine."); return; }
    setUp(true); setErr("");
    try{
      const path=kNewPath(prefisso, kSafeExt(file.name)||"jpg");
      const {error}=await sb.storage.from(KOMUNIGO_BUCKET).upload(path,file,{cacheControl:"3600",upsert:false});
      if(error) throw error; set(i,"path",path);
    }catch(ex){ setErr("Foto: "+(ex.message||ex)); }
    setUp(false);
  }
  return (
    <div className="card" style={{marginTop:16}}>
      <h2>{titolo}</h2>
      <div className="muted" style={{fontSize:12,marginBottom:12}}>{nota}</div>
      {err && <div className="banner err">{err}</div>}
      {rows===null? <div className="empty">Caricamento…</div>
       : <div style={{display:"flex",flexWrap:"wrap",gap:12}}>
          {rows.map((r,i)=>(
            <div key={r.id} className="card" style={{padding:10,width:wide?300:200,background:"#fafbfc"}}>
              <label style={{display:"block",width:"100%",aspectRatio:wide?"16/6":"1/1",borderRadius:8,overflow:"hidden",border:"1px solid var(--line)",cursor:perm.scrivi?"pointer":"default",background:"#eef1f5"}}>
                {r.path? <img src={kPub(r.path)} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                  : <div style={{display:"grid",placeItems:"center",height:"100%",color:"#888",fontSize:12}}>{up?"Carico…":"＋ Foto"}</div>}
                {perm.scrivi && <input type="file" accept="image/*" onChange={e=>caricaFoto(i,e)} disabled={up} style={{display:"none"}}/>}
              </label>
              <input value={r.titolo||""} placeholder="Titolo (es. Insegna luminosa)" disabled={!perm.scrivi} onChange={e=>set(i,"titolo",e.target.value)} style={{marginTop:6,width:"100%"}}/>
