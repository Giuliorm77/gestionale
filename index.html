<style>

    --line:#e4e7ec; --brand:#2f5bea; --brand-d:#1e46c4;

  *{box-sizing:border-box}

<div id="root"></div>

<!-- Rilevatore errori: se qualcosa va storto, lo scrive a schermo invece di lasciare la pagina vuota -->
<script>
function __mostraErrore(titolo, dettaglio){
  var r=document.getElementById('root');
  if(!r || r.children.length>0) return; /* non toccare un'app gia' avviata */
  r.innerHTML='<div style="max-width:640px;margin:40px auto;padding:24px;'
    +'font-family:Segoe UI,sans-serif;background:#fff;border:1px solid #f5c6c0;border-radius:12px">'
    +'<h2 style="color:#8a1c12;margin-top:0">⚠️ '+titolo+'</h2>'
    +'<pre style="white-space:pre-wrap;background:#fdecea;padding:12px;border-radius:8px;'
    +'color:#8a1c12;font-size:13px">'+String(dettaglio).replace(/</g,'&lt;')+'</pre>'
    +'<p style="color:#697386;font-size:13px">Copia questo testo e mandalo in chat.</p></div>';
}
window.addEventListener('error', function(e){
  __mostraErrore('Errore durante l\'avvio', (e.message||e.error||'errore')
    +'\n'+(e.filename||'')+ (e.lineno? ' : riga '+e.lineno : ''));
});
// Avviso anti-perdita: se una finestra di inserimento e' aperta O ci sono modifiche
// non salvate in una pagina intera (es. Impostazioni), chiede conferma prima di uscire/refresh
window.addEventListener('beforeunload', function(e){
  if(document.querySelector('.overlay') || window.__gestDirty){ e.preventDefault(); e.returnValue=''; }
});
// Se dopo 4 secondi la pagina e' ancora vuota, avvisa
setTimeout(function(){
  var r=document.getElementById('root');
  if(r && r.children.length===0)
    __mostraErrore('L\'app non si e\' avviata',
      'React: '+(typeof React)+'\nReactDOM: '+(typeof ReactDOM)
      +'\nBabel: '+(typeof Babel)+'\nSupabase: '+(typeof supabase)
      +'\nConfig: '+(window.GESTIONALE_CONFIG?'presente':'assente'));
}, 4000);
</script>

<!-- Forza Babel a usare la modalita' "classica" (React.createElement),
     altrimenti genera "import" non validi in un file HTML normale. -->
<script>
  Babel.registerPreset('react-classic', {
    presets: [[Babel.availablePresets.react, { runtime: 'classic' }]]
  });
</script>

<script type="text/babel" data-presets="react-classic">
const { useState, useEffect, useMemo, useCallback } = React;

/* ---------------------------------------------------------------- costanti */
let LAVORAZIONI = [
  "Stampa digitale piccolo formato","Stampa digitale grande formato","Serigrafia",
  "Gadget","Allestimenti eventi","Scenografie polistirolo","Insegne luminose",
  "Cartotecnica","Packaging"
];
let __setLavVer = null; // impostato da App per forzare il re-render quando cambiano le lavorazioni
function aggiornaLavorazioni(lista){
  if(lista && lista.length){ LAVORAZIONI.splice(0, LAVORAZIONI.length, ...lista); }
  if(__setLavVer) __setLavVer(v=>v+1);
}
async function caricaLavorazioniGlobali(){
  if(!sb) return;
  try{
    const {data}=await sb.from("lavorazioni").select("nome").eq("attivo",true).order("ordine").order("nome");
    if(data && data.length) aggiornaLavorazioni(data.map(r=>r.nome));
  }catch(e){}
}

// Il prezzo di listino e' uno solo (articoli.prezzo_pubblico). Quello che cambia
// per cliente e' lo sconto, in ordine di precedenza:
//   1) eccezione per categoria dell'articolo (clienti_sconti)
//   2) sconto standard del cliente (clienti.sconto_pct)
//   3) se il cliente e' "Rivenditore": sconto standard rivenditori (impostazioni)
//   4) altrimenti 0
// `sconti` = righe {categoria, sconto_pct} del cliente. `scontoRivStd` = da impostazioni.
function scontoDefaultCliente(cliente, scontoRivStd){
  if(!cliente) return 0;
  if(cliente.sconto_pct!=null && cliente.sconto_pct!=="") return Number(cliente.sconto_pct)||0;
  if((cliente.categoria||"")==="Rivenditore") return Number(scontoRivStd)||0;
  return 0;
}
function scontoPerCategoria(cliente, sconti, categoria, scontoRivStd){
  const ecc=(sconti||[]).find(s=>s.categoria && categoria && String(s.categoria).toLowerCase()===String(categoria).toLowerCase());
  if(ecc && ecc.sconto_pct!=null && ecc.sconto_pct!=="") return Number(ecc.sconto_pct)||0;
  return scontoDefaultCliente(cliente, scontoRivStd);
}

// permessi EFFETTIVI = default del ruolo + deroghe per-utente (profiles.permessi)
function permEffettivi(profilo){
  const base = PERMESSI[profilo && profilo.ruolo] || PERMESSI.reception;
  const ov = (profilo && profilo.permessi) || {};
  const p = {...base};
  PERM_FLAGS.forEach(k=>{ if(typeof ov[k]==="boolean") p[k]=ov[k]; });
  p.moduli = (ov.moduli && typeof ov.moduli==="object") ? ov.moduli : null;
  return p;
}
// può accedere a un modulo? deroga esplicita, altrimenti dipende dal flag richiesto dal modulo
function puoModulo(perm, mod){
  if(perm.moduli && typeof perm.moduli[mod]==="boolean") return perm.moduli[mod];
  const req = MODULO_REQ[mod] || "sempre";
  return req==="sempre" ? true : !!perm[req];
}

// Interpreta un prezzo scritto in vari formati (es. "1.234,56 €", "1,234.56", "12,5") -> numero
function normalizzaPrezzo(v){
  if(v===null||v===undefined||v==="") return "";
  if(typeof v==="number") return v;
  let s=String(v).replace(/[^0-9.,-]/g,"").trim();
  if(s.includes(",") && s.includes(".")){
    s = s.lastIndexOf(",")>s.lastIndexOf(".") ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,"");
  } else if(s.includes(",")){ s=s.replace(",","."); }
  const n=parseFloat(s);
  return isNaN(n) ? "" : n;
}

// Copia negli appunti, con ripiego che funziona anche su file:// (contesto non sicuro)
function copiaTesto(t){
  try{
    if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(t); return; }
  }catch(e){}
  const ta=document.createElement("textarea");
  ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}

/* ================================================================ LOGIN */
function SchermataLogin(){
  const [mode,setMode]=useState("login"); // login | signup | reset
  const [nome,setNome]=useState("");
  const [email,setEmail]=useState("");
  const [pw,setPw]=useState("");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const [info,setInfo]=useState("");

  async function submit(e){
    e.preventDefault(); setErr(""); setInfo(""); setBusy(true);
    try{
      if(mode==="reset"){
        const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});
        if(error) throw error;
        setInfo("Se l'indirizzo è registrato, riceverai un'email con il link per reimpostare la password. Controlla anche lo spam.");
        setMode("login");
      }else if(mode==="login"){
        const {error}=await sb.auth.signInWithPassword({email,password:pw});
        if(error) throw error;
      }else{
        const {data,error}=await sb.auth.signUp({
          email,password:pw,options:{data:{nome}}
        });
        if(error) throw error;
        if(!data.session){
          setInfo("Registrazione inviata. Controlla l'email per confermare, poi accedi.");
          setMode("login");
        }
      }
    }catch(ex){ setErr(traduci(ex.message)); }
    finally{ setBusy(false); }
  }
  const titolo = mode==="reset"?"Recupera password":mode==="signup"?"Registrati":"Accedi";
  return (
    <div className="center">
      <form className="authcard" onSubmit={submit}>
        <h2>Gestionale Creatio</h2>
        <p className="muted" style={{marginTop:0}}>Stampa · Serigrafia · Allestimenti</p>
        {err && <div className="banner err">{err}</div>}
        {info && <div className="banner info">{info}</div>}
        {mode==="reset" && <p className="muted" style={{fontSize:13}}>Inserisci la tua email: ti mandiamo un link per impostare una nuova password.</p>}
        {mode==="signup" &&
          <div className="field">
            <label>Nome e cognome</label>
            <input value={nome} onChange={e=>setNome(e.target.value)} required placeholder="Mario Rossi"/>
          </div>}
        <div className="field">
          <label>Email</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} required placeholder="tu@azienda.it"/>
        </div>
        {mode!=="reset" &&
          <div className="field">
            <label>Password</label>
            <input type="password" value={pw} onChange={e=>setPw(e.target.value)} required minLength={6} placeholder="••••••••"/>
          </div>}
        {mode==="login" &&
          <div style={{textAlign:"right",marginTop:-4,marginBottom:4}}>
            <a href="#" style={{fontSize:12.5}} onClick={e=>{e.preventDefault();setErr("");setInfo("");setMode("reset");}}>Password dimenticata?</a>
          </div>}
        <button className="btn primary" style={{width:"100%",marginTop:6}} disabled={busy}>
          {busy ? <span className="spin"/> : (mode==="reset"?"Invia link di reset":titolo)}
        </button>
        <div className="switchrow">
          {mode==="reset"
            ? <a href="#" onClick={e=>{e.preventDefault();setErr("");setInfo("");setMode("login");}}>← Torna all'accesso</a>
            : <>
                <span className="muted">{mode==="login"?"Non hai un account?":"Hai già un account?"}</span>
                <a href="#" onClick={e=>{e.preventDefault();setErr("");setInfo("");setMode(mode==="login"?"signup":"login");}}>
                  {mode==="login"?"Registrati":"Accedi"}
                </a>
              </>}
        </div>
      </form>
    </div>
  );
}
function traduci(m=""){
  if(/Invalid login credentials/i.test(m)) return "Email o password non corretti.";
  if(/already registered/i.test(m)) return "Questa email è già registrata.";
  if(/Password should be/i.test(m)) return "La password deve avere almeno 6 caratteri.";
  if(/New password should be different/i.test(m)) return "La nuova password deve essere diversa da quella attuale.";
  if(/rate limit|too many/i.test(m)) return "Troppi tentativi ravvicinati. Attendi qualche minuto e riprova.";
  return m;
}

/* ================================================ IMPOSTA NUOVA PASSWORD (recupero) */
function SchermataNuovaPassword({onFatto}){
  const [pw,setPw]=useState("");
  const [pw2,setPw2]=useState("");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const [ok,setOk]=useState(false);
  async function submit(e){
    e.preventDefault(); setErr("");
    if(pw.length<6){ setErr("La password deve avere almeno 6 caratteri."); return; }
    if(pw!==pw2){ setErr("Le due password non coincidono."); return; }
    setBusy(true);
    try{
      const {error}=await sb.auth.updateUser({password:pw});
      if(error) throw error;
      setOk(true);
      // ripulisco l'hash di recupero dall'URL e proseguo nell'app
      try{ window.history.replaceState(null,"",window.location.pathname+window.location.search); }catch(e){}
      setTimeout(()=>{ onFatto&&onFatto(); },1200);
    }catch(ex){ setErr(traduci(ex.message)); setBusy(false); }
  }
  return (
    <div className="center">
      <form className="authcard" onSubmit={submit}>
        <h2>Nuova password</h2>
        <p className="muted" style={{marginTop:0}}>Scegli una nuova password per il tuo account.</p>
        {err && <div className="banner err">{err}</div>}
        {ok && <div className="banner info">✅ Password aggiornata. Ti sto facendo entrare…</div>}
        {!ok && <>
          <div className="field">
            <label>Nuova password</label>
            <input type="password" value={pw} onChange={e=>setPw(e.target.value)} required minLength={6} placeholder="••••••••" autoFocus/>
          </div>
          <div className="field">
            <label>Ripeti la password</label>
            <input type="password" value={pw2} onChange={e=>setPw2(e.target.value)} required minLength={6} placeholder="••••••••"/>
          </div>
          <button className="btn primary" style={{width:"100%",marginTop:6}} disabled={busy}>
            {busy ? <span className="spin"/> : "Salva nuova password"}
          </button>
        </>}
      </form>
    </div>
  );
}

/* ================================================================ APP */
function App(){
  const [sessione,setSessione]=useState(undefined); // undefined=carico, null=fuori
  const [profilo,setProfilo]=useState(null);
  const [recupero,setRecupero]=useState(()=>{ try{ return /type=recovery/.test(window.location.hash||""); }catch(e){ return false; } }); // link reset password aperto
  const [,setLavVer]=useState(0); // versione lavorazioni: forza il re-render dei menu
  useEffect(()=>{ __setLavVer=setLavVer; },[]);
  useEffect(()=>{ if(sessione) caricaLavorazioniGlobali(); },[sessione]);
  const [,setMatVer]=useState(0); // versione materie prime
  useEffect(()=>{ __setMatVer=setMatVer; },[]);
  useEffect(()=>{ if(sessione) caricaMateriePrimeGlobali(); },[sessione]);

  useEffect(()=>{
    if(!sb) return;
    sb.auth.getSession().then(({data})=> setSessione(data.session||null));
    const {data:sub}=sb.auth.onAuthStateChange((evt,s)=>{
      if(evt==="PASSWORD_RECOVERY"){ setRecupero(true); setSessione(s||null); return; }
      // I rinnovi automatici del token NON devono rimontare l'app (perderesti i dati non salvati)
      if(evt==="TOKEN_REFRESHED" || evt==="USER_UPDATED") return;
      setSessione(prev=>{
        const pid=prev&&prev.user&&prev.user.id, nid=s&&s.user&&s.user.id;
        if(pid && nid && pid===nid) return prev; // stesso utente: nessun cambio, niente rimontaggio
        return s||null;                          // login/logout reale
      });
    });
    return ()=> sub.subscription.unsubscribe();
  },[]);

  useEffect(()=>{
    if(!sessione){ setProfilo(null); return; }
    let vivo=true;
    (async()=>{
      const {data}=await sb.from("profiles").select("*").eq("id",sessione.user.id).single();
      if(vivo) setProfilo(data || {id:sessione.user.id,nome:sessione.user.email,ruolo:"reception"});
    })();
    return ()=>{vivo=false;};
  },[sessione]);

  if(!CONFIGURATO) return <SchermataSetup/>;
  if(recupero) return <SchermataNuovaPassword onFatto={()=>setRecupero(false)}/>;
  if(sessione===undefined) return <div className="center"><span className="muted">Caricamento…</span></div>;
  if(!sessione) return <SchermataLogin/>;
  if(!profilo) return <div className="center"><span className="muted">Caricamento profilo…</span></div>;
  if(profilo.approvato===false) return <SchermataAttesa profilo={profilo}/>;
  return <Gestionale profilo={profilo}/>;
}

/* ========================================================= CRUSCOTTO MOBILE */
function CruscottoMobile({profilo,perm,onApriCompleto}){
  const [dati,setDati]=useState(null);
  const [err,setErr]=useState("");
  const [apri,setApri]=useState("commesse");
  const [filtro,setFiltro]=useState("tutte");
  useEffect(()=>{ let vivo=true; (async()=>{
    const q=[ sb.from("commesse").select("id,numero,cliente_nome,stato,data_consegna,valore,priorita, commesse_righe(stato,data_consegna,descrizione)").order("data_consegna",{ascending:true}) ];
    if(perm.economici) q.push(sb.from("preventivi").select("id,numero,cliente_nome,stato,data, preventivi_righe(prezzo_unitario,quantita)").order("data",{ascending:false}));
    const res=await Promise.all(q);
    if(!vivo) return;
    const c=res[0], p=perm.economici?res[1]:{data:[]};
    if(c.error||(p&&p.error)){ setErr((c.error||(p&&p.error)).message); return; }
    setDati({commesse:c.data||[], preventivi:(p&&p.data)||[]});
  })(); return ()=>{vivo=false;}; },[perm.economici]);

  const eur = n => "€ " + Math.round(n||0).toLocaleString("it-IT");
  const gg = s => s ? String(s).split("-").reverse().join("/") : "—";
  const oggiS = new Date().toISOString().slice(0,10);
  const tra7S = new Date(Date.now()+7*864e5).toISOString().slice(0,10);
  const meseS = oggiS.slice(0,7);
  const valPrev = p => (p.preventivi_righe||[]).reduce((s,r)=> s + (Number(r.prezzo_unitario)||0)*(Number(r.quantita)||1), 0);

  if(err) return <div className="cm"><div className="cmempty" style={{color:"#c0392b"}}>Errore: {err}</div></div>;
  if(!dati) return <div className="cm"><div className="cmempty">Caricamento…</div></div>;

  const comm=dati.commesse, prev=dati.preventivi;
  const aperte=comm.filter(c=>["consegnata","chiusa"].indexOf(c.stato)<0);
  const ritardo=aperte.filter(c=>c.data_consegna && c.data_consegna<oggiS);
  const scadenza=aperte.filter(c=>c.data_consegna && c.data_consegna>=oggiS && c.data_consegna<=tra7S);
  const pronte=comm.filter(c=>c.stato==="pronta");
  const prevAttesa=prev.filter(p=>p.stato==="inviato");
  const valoreInCorso=aperte.reduce((s,c)=>s+(Number(c.valore)||0),0);
  const valorePronte=pronte.reduce((s,c)=>s+(Number(c.valore)||0),0);
  const consegnatoMese=comm.filter(c=>["consegnata","chiusa"].indexOf(c.stato)>=0 && String(c.data_consegna||"").slice(0,7)===meseS).reduce((s,c)=>s+(Number(c.valore)||0),0);
  const valorePrevAttesa=prevAttesa.reduce((s,p)=>s+valPrev(p),0);

  const rigaComm=c=>{ const sc=STATI_COMMESSA[c.stato]||STATI_COMMESSA.aperta;
    const inRit=c.data_consegna && c.data_consegna<oggiS && ["consegnata","chiusa"].indexOf(c.stato)<0;
    return <div className="cmrow" key={c.id}>
      <div className="l">
        <div className="n">{c.numero||"(bozza)"}</div>
        <div className="c">{c.cliente_nome||"—"}</div>
        <span className="cmbadge" style={{background:sc.bg,color:sc.c}}>{sc.l}</span>
      </div>
      <div className="r">
        <div className="d" style={{color:inRit?"#c0392b":"#14202b"}}>{gg(c.data_consegna)}</div>
        {inRit && <div style={{fontSize:11,color:"#c0392b",fontWeight:700}}>in ritardo</div>}
      </div>
    </div>; };
  const rigaPrev=p=><div className="cmrow" key={p.id}>
      <div className="l"><div className="n">{p.numero||"—"}</div><div className="c">{p.cliente_nome||"—"}</div></div>
      <div className="r">{perm.economici && <div className="d">{eur(valPrev(p))}</div>}<div style={{fontSize:12,color:"#5b6773"}}>{gg(p.data)}</div></div>
    </div>;

  let lista=null;
  if(apri==="commesse"){
    const base = filtro==="ritardo"?ritardo : filtro==="scadenza"?scadenza : aperte;
    lista=<div>
      <div className="cmchips">
        {[["tutte","Tutte ("+aperte.length+")"],["ritardo","In ritardo ("+ritardo.length+")"],["scadenza","In scadenza ("+scadenza.length+")"]].map(a=>
          <button key={a[0]} className={"cmchip"+(filtro===a[0]?" on":"")} onClick={()=>setFiltro(a[0])}>{a[1]}</button>)}
      </div>
      <div className="cmlist">{base.length? base.map(rigaComm) : <div className="cmempty">Niente qui 👍</div>}</div>
    </div>;
  } else if(apri==="pronte"){
    lista=<div className="cmlist">{pronte.length? pronte.map(rigaComm) : <div className="cmempty">Nessuna commessa pronta.</div>}</div>;
  } else if(apri==="prev"){
    lista=<div className="cmlist">{prevAttesa.length? prevAttesa.map(rigaPrev) : <div className="cmempty">Nessun preventivo in attesa.</div>}</div>;
  }

  return <div className="cm">
    <div className="cmhead">
      <div><b>Gestionale Creatio</b><div className="u">{profilo.nome} · {profilo.ruolo}</div></div>
      <button className="btn small" onClick={()=>sb.auth.signOut()}>Esci</button>
    </div>

    <div className="cmcards">
      <button className={"cmcard"+(apri==="commesse"?" sel":"")} onClick={()=>{setApri("commesse");setFiltro("tutte");}}>
        <div className="ic">🏭</div><div className="big">{aperte.length}</div><div className="lb">Commesse aperte</div>
        <div className="sub">{ritardo.length>0 ? <span style={{color:"#c0392b",fontWeight:700}}>{ritardo.length} in ritardo</span> : <span style={{color:"#1f9c68"}}>nessun ritardo</span>}{scadenza.length>0? <span style={{color:"#b26a00"}}> · {scadenza.length} in scadenza</span>:null}</div>
      </button>
      <button className={"cmcard"+(apri==="pronte"?" sel":"")} onClick={()=>setApri("pronte")}>
        <div className="ic">📦</div><div className="big">{pronte.length}</div><div className="lb">Pronto da consegnare</div>
        <div className="sub" style={{color:"#5b6773"}}>da ritirare o spedire</div>
      </button>
      {perm.economici && <button className={"cmcard"+(apri==="prev"?" sel":"")} onClick={()=>setApri("prev")}>
        <div className="ic">🧾</div><div className="big">{prevAttesa.length}</div><div className="lb">Preventivi in attesa</div>
        <div className="sub" style={{color:"#5b6773"}}>inviati, senza risposta</div>
      </button>}
    </div>

    <div style={{marginTop:14}}>{lista}</div>

    {perm.economici && <div>
      <div style={{margin:"22px 4px 8px",fontWeight:800,fontSize:12,color:"#41505c",textTransform:"uppercase",letterSpacing:".05em"}}>Numeri economici</div>
      <div className="cmecon">
        <div className="er"><span>Commesse in corso</span><b>{eur(valoreInCorso)}</b></div>
        <div className="er"><span>Pronte da consegnare</span><b>{eur(valorePronte)}</b></div>
        <div className="er"><span>Consegnato questo mese</span><b>{eur(consegnatoMese)}</b></div>
        <div className="er"><span>Preventivi in attesa (stima)</span><b>{eur(valorePrevAttesa)}</b></div>
      </div>
      <div style={{fontSize:11.5,color:"#8b95a1",margin:"8px 4px 0"}}>Il fatturato reale arriverà con l'integrazione Fatture in Cloud.</div>
    </div>}

    <button className="cmfull" onClick={onApriCompleto}>Apri la versione completa →</button>
  </div>;
}

/* ===================================================== CRUSCOTTO MOBILE AGENTE
   Vista leggera per telefono dedicata al ruolo "agente" (CRM). Classi .ag*
   separate dal cruscotto di produzione (.cm*), che resta invariato. */
function CruscottoAgente({profilo,perm,onApriCompleto}){
  const [tratt,setTratt]=useState(null);
  const [att,setAtt]=useState([]);
  const [clienti,setClienti]=useState([]);
  const [tab,setTab]=useState("trattative");
  const [q,setQ]=useState("");
  const [editorTratt,setEditorTratt]=useState(null);
  const [editorAtt,setEditorAtt]=useState(null);
  const [myPct,setMyPct]=useState(null);
  const [cambiaPw,setCambiaPw]=useState(false);
  const [err,setErr]=useState("");
  const eur=n=>Number(n||0).toLocaleString("it-IT",{style:"currency",currency:"EUR",maximumFractionDigits:0});
  const carica=useCallback(async()=>{
    const [t,a,c]=await Promise.all([
      sb.from("crm_trattative").select("*, clienti(ragione_sociale)").order("aggiornato_il",{ascending:false}),
      sb.from("crm_attivita").select("*, clienti(ragione_sociale)").eq("completata",false).not("promemoria_il","is",null).order("promemoria_il"),
      sb.from("clienti").select("id,ragione_sociale,provvigione_pct").order("ragione_sociale"),
    ]);
    if(t.error){ setErr(t.error.message); return; }
    setTratt(t.data||[]); setAtt(a.data||[]); setClienti(c.data||[]);
    const {data:p}=await sb.rpc("my_provvigione_pct"); setMyPct(p==null?null:Number(p));
  },[]);
  useEffect(()=>{ carica(); },[carica]);
  const APERTI=["nuovo","contatto","trattativa","offerta"];
  const aperte=(tratt||[]).filter(t=>APERTI.indexOf(t.stato)>=0);
  const valPipe=aperte.reduce((s,t)=>s+(Number(t.valore_stimato)||0),0);
  const cliPct={}; clienti.forEach(c=>cliPct[c.id]=c.provvigione_pct);
  const provMat=(tratt||[]).filter(t=>t.stato==="vinta").reduce((s,t)=>
    s+calcProvvTratt(t,{cliPct:cliPct[t.cliente_id], agPct:myPct}),0);
  // classificazione follow-up per data
  const oggi=new Date(); const gg0=new Date(oggi.getFullYear(),oggi.getMonth(),oggi.getDate()).getTime();
  const gg1=gg0+86400000;
  const classFU=d=>{ const t=new Date(d).getTime(); if(t<gg0) return "scad"; if(t<gg1) return "oggi"; return ""; };
  const daFare=att.filter(a=>classFU(a.promemoria_il)!=="").length;
  const completa=async(id)=>{ await sb.from("crm_attivita").update({completata:true}).eq("id",id); carica(); };
  const cerca=clienti.filter(c=>!q || (c.ragione_sociale||"").toLowerCase().includes(q.toLowerCase()));

  if(err) return <div className="ag"><div className="agempty" style={{color:"#c0392b"}}>Errore: {err}</div></div>;
  if(tratt===null) return <div className="ag"><div className="agempty">Caricamento…</div></div>;

  return <div className="ag">
    <div className="aghead">
      <div><b>Ciao {(profilo.nome||"").split(" ")[0]||"agente"} 👋</b>
        <div className="u">La tua area commerciale</div></div>
      <div style={{display:"flex",flexDirection:"column",gap:5}}>
        <button className="btn small" onClick={()=>setCambiaPw(true)}>🔑 Password</button>
        <button className="btn small" onClick={()=>sb.auth.signOut()}>Esci</button>
      </div>
    </div>

    <div className="agkpi">
      <div className="k"><div className="b">{aperte.length}</div><div className="l">Aperte</div></div>
      <div className="k"><div className="b">{eur(valPipe)}</div><div className="l">Pipeline</div></div>
      <div className="k"><div className="b" style={daFare?{color:"#c0392b"}:null}>{daFare}</div><div className="l">Follow-up</div></div>
      <div className="k"><div className="b" style={{color:"#127a3e"}}>{eur(provMat)}</div><div className="l">Provvigione</div></div>
    </div>

    <div className="agactions">
      {perm.scrivi && <button className="agbtn primary" onClick={()=>setEditorTratt({})}>+ Trattativa</button>}
      {perm.scrivi && <button className="agbtn" onClick={()=>setEditorAtt({})}>+ Attività</button>}
    </div>

    <div className="agtabs">
      {[["trattative","Trattative"],["followup","Follow-up"],["clienti","Clienti"]].map(([k,l])=>
        <button key={k} className={"agtab"+(tab===k?" sel":"")} onClick={()=>setTab(k)}>{l}</button>)}
    </div>

    {tab==="trattative" && <div className="aglist">
      {aperte.length===0 ? <div className="agempty">Nessuna trattativa aperta.</div>
        : aperte.map(t=>{ const S=STATI_TRATTATIVA[t.stato]||{l:t.stato,bg:"#eee",c:"#333"};
          return <div className="agrow" key={t.id} onClick={()=>setEditorTratt(t)} style={{cursor:"pointer"}}>
            <div className="l">
              <div className="n">{t.titolo}</div>
              <div className="c">{(t.clienti&&t.clienti.ragione_sociale)||"—"}</div>
              <span className="agbadge" style={{background:S.bg,color:S.c}}>{S.l}</span>
            </div>
            <div className="r">
              <div className="d">{eur(t.valore_stimato)}</div>
              {t.data_prevista && <span className="agchip">📅 {new Date(t.data_prevista).toLocaleDateString("it-IT")}</span>}
            </div>
          </div>; })}
    </div>}

    {tab==="followup" && <div className="aglist">
      {att.length===0 ? <div className="agempty">Nessun follow-up in programma 👍</div>
        : att.map(a=>{ const cl=classFU(a.promemoria_il);
          return <div className="agrow" key={a.id}>
            <div className="l">
              <div className="n">{(()=>{const T=TIPI_ATTIVITA[a.tipo];return T?T.ico+" "+T.l:a.tipo;})()} · {(a.clienti&&a.clienti.ragione_sociale)||"—"}</div>
              {a.note && <div className="c">{a.note}</div>}
              <span className={"agchip"+(cl?" "+cl:"")}>
                {cl==="scad"?"⚠️ scaduto · ":cl==="oggi"?"oggi · ":""}
                {new Date(a.promemoria_il).toLocaleDateString("it-IT")} {new Date(a.promemoria_il).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})}</span>
            </div>
            <div className="r"><button className="agok" onClick={()=>completa(a.id)}>✓ Fatto</button></div>
          </div>; })}
    </div>}

    {tab==="clienti" && <>
      <input className="agsearch" placeholder="Cerca cliente…" value={q} onChange={e=>setQ(e.target.value)}/>
      <div className="aglist">
        {cerca.length===0 ? <div className="agempty">Nessun cliente.</div>
          : cerca.slice(0,60).map(c=>
            <div className="agrow" key={c.id}>
              <div className="l"><div className="n">{c.ragione_sociale}</div></div>
              <div className="r"><button className="agok" style={{background:"#eef1f5",color:"#1e46c4",borderColor:"#cdd8ee"}}
                onClick={()=>setEditorAtt({clienteFisso:c.id})}>+ Attività</button></div>
            </div>)}
        {cerca.length>60 && <div className="agempty" style={{fontSize:11.5}}>Mostrati i primi 60 · affina la ricerca</div>}
      </div>
    </>}

    <button className="agfull" onClick={onApriCompleto}>Apri la versione completa →</button>

    {editorTratt && <TrattativaForm profilo={profilo} perm={perm} clienti={clienti} trattativa={editorTratt.id?editorTratt:null}
      onClose={()=>setEditorTratt(null)} onSalvato={()=>{setEditorTratt(null);carica();}}/>}
    {editorAtt && <AttivitaForm profilo={profilo} clienti={clienti} attivita={null} clienteFisso={editorAtt.clienteFisso||null}
      onClose={()=>setEditorAtt(null)} onSalvato={()=>{setEditorAtt(null);carica();}}/>}
    {cambiaPw && <CambiaPasswordModal onClose={()=>setCambiaPw(false)}/>}
  </div>;
}

/* ======================================================= POSTAZIONE OPERATORE */
function PostazioneOperatore({profilo,perm}){
  const [commesse,setCommesse]=useState(null);
  const [operatori,setOperatori]=useState([]);
  const [segmenti,setSegmenti]=useState([]);
  const [me,setMe]=useState(()=>{ try{ return localStorage.getItem("postazione_op")||""; }catch(e){ return ""; } });
  const [meVerificato,setMeVerificato]=useState(false);   // PIN confermato in questa sessione
  const [pinInput,setPinInput]=useState("");
  const [err,setErr]=useState("");
  const [now,setNow]=useState(Date.now());
  const [pausaFor,setPausaFor]=useState(null);   // fase.chiave in attesa del motivo
  const [riep,setRiep]=useState(null);           // riepilogo di fine lavorazione
  const [busy,setBusy]=useState(false);
  const [cerca,setCerca]=useState("");           // ricerca in "Altre lavorazioni"
  const [dettFase,setDettFase]=useState(null);    // commessa di cui mostrare "cosa fare"

  const carica=useCallback(async()=>{
    const [c,o,s]=await Promise.all([
      sb.from("commesse").select("id,numero,cliente_nome,stato, commesse_fasi(id,chiave,reparto,descrizione,stato,ore_previste,ordine)").in("stato",["aperta","in_produzione"]).order("data_consegna",{ascending:true}),
      sb.from("operatori_nomi").select("id,nome,tipo,has_pin").order("nome"),
      sb.from("segmenti_lavoro").select("*"),
    ]);
    if(c.error){ setErr(c.error.message); return; }
    setErr("");
    setCommesse(c.data||[]); setOperatori(o.data||[]); setSegmenti(s.data||[]);
  },[]);
  useEffect(()=>{ carica(); },[carica]);
  useEffect(()=>{ const t=setInterval(()=>setNow(Date.now()),1000); return ()=>clearInterval(t); },[]);
  const scegliMe=v=>{ setMe(v); setMeVerificato(false); setPinInput(""); setErr(""); try{ localStorage.setItem("postazione_op",v); }catch(e){} };
  const meObj=operatori.find(o=>o.id===me)||null;
  const meNome=meObj?meObj.nome:"";
  // PIN OBBLIGATORIO: si può timbrare solo dopo aver confermato il PIN in questa sessione.
  const okOperatore = !!me && meVerificato;          // sbloccato solo con PIN verificato
  const meServePin  = !!me && !meVerificato;         // finché non verificato, deve autenticarsi
  const meSenzaPin  = !!(meObj && !meObj.has_pin);   // operatore senza PIN impostato -> bloccato
  async function verificaPin(){
    if(!me){ return; }
    const p=String(pinInput||"").trim();
    if(!p){ setErr("Inserisci il PIN."); return; }
    setBusy(true); setErr("");
    try{ const {data,error}=await sb.rpc("verifica_pin_operatore",{p_operatore_id:me,p_pin:p});
      if(error) throw error;
      if(data===true){ setMeVerificato(true); setPinInput(""); setErr(""); }
      else{ setErr("PIN errato."); }
    }catch(ex){ setErr(ex.message); }
    setBusy(false);
  }

  const ms=x=>new Date(x).getTime();
  const segDi=ch=>ch?segmenti.filter(s=>s.fase_chiave===ch):[];
  const durata=s=>((s.fine?ms(s.fine):now)-ms(s.inizio));
  const netto=ch=>segDi(ch).reduce((t,s)=>t+durata(s),0);
  const attrav=ch=>{ const ss=segDi(ch); if(!ss.length) return 0; const a=Math.min.apply(null,ss.map(s=>ms(s.inizio))); const b=Math.max.apply(null,ss.map(s=>s.fine?ms(s.fine):now)); return b-a; };
  const aperti=ch=>segDi(ch).filter(s=>!s.fine);
  const mioAperto=ch=>segDi(ch).find(s=>!s.fine && s.operatore_id===me);
  const fmt=v=>{ const tot=Math.max(0,Math.floor(v/1000)); const h=Math.floor(tot/3600),m=Math.floor((tot%3600)/60),se=tot%60; return (h>0?h+"h ":"")+String(m).padStart(2,"0")+"m "+String(se).padStart(2,"0")+"s"; };
  const oreDi=v=>(v/3600000);
  const oraIt=x=> x? new Date(x).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}):"—";
  // orario "a muro" di una fase: primo inizio -> ultima fine (o "in corso" se un segmento è aperto)
  const orarioFase=ch=>{ const ss=segDi(ch); if(!ss.length) return null; const running=ss.some(s=>!s.fine);
    const a=Math.min.apply(null,ss.map(s=>ms(s.inizio))); const b=running?null:Math.max.apply(null,ss.map(s=>ms(s.fine))); return {a,b,running}; };
  const MOTIVI={interruzione:"Interruzione", cambio:"Cambio lavoro", guasto:"Guasto", altro:"Altro"};

  async function assicuraChiave(fa){
    if(fa.chiave) return fa.chiave;
    const ch=uid(); await sb.from("commesse_fasi").update({chiave:ch}).eq("id",fa.id); fa.chiave=ch; return ch;
  }
  async function prendi(fa,c){
    if(!me){ setErr("Prima scegli chi sei, in alto."); window.scrollTo(0,0); return; }
    setBusy(true);
    try{
      const ch=await assicuraChiave(fa);
      await sb.from("segmenti_lavoro").insert({commessa_id:c.id, fase_chiave:ch, fase_descr:fa.descrizione||fa.reparto||"", reparto:fa.reparto||"", operatore_id:me, operatore_nome:meNome, inizio:new Date().toISOString()});
      if(fa.stato==="da_fare") await sb.from("commesse_fasi").update({stato:"in_corso"}).eq("id",fa.id);
      // appena si inizia a lavorare, la commessa passa da "aperta" a "in produzione"
      if(c.stato==="aperta"){ try{ await sb.from("commesse").update({stato:"in_produzione"}).eq("id",c.id); }catch(e){} }
      await carica();
    }catch(ex){ setErr(ex.message); }
    setBusy(false);
  }
  async function mettiPausa(fa,motivo){
    const seg=mioAperto(fa.chiave); setPausaFor(null); if(!seg) return;
    setBusy(true);
    try{ await sb.from("segmenti_lavoro").update({fine:new Date().toISOString(), motivo}).eq("id",seg.id); await carica(); }
    catch(ex){ setErr(ex.message); }
    setBusy(false);
  }
  async function chiudi(fa,c){
    if(!window.confirm("Chiudere la lavorazione «"+(fa.descrizione||fa.reparto||"")+"»? Ferma tutti i cronometri attivi.")) return;
    setBusy(true);
    try{
      const ch=fa.chiave||await assicuraChiave(fa);
      for(const s of aperti(ch)){ await sb.from("segmenti_lavoro").update({fine:new Date().toISOString(), motivo:"fine"}).eq("id",s.id); }
      await sb.from("commesse_fasi").update({stato:"fatto"}).eq("id",fa.id);
      // se tutte le fasi della commessa sono completate, la commessa diventa "pronta"
      try{
        const {data:ff}=await sb.from("commesse_fasi").select("stato").eq("commessa_id",c.id);
        const tutteFatto=(ff||[]).length>0 && ff.every(x=>x.stato==="fatto");
        if(tutteFatto && c.stato!=="consegnata" && c.stato!=="chiusa"){
          await sb.from("commesse").update({stato:"pronta"}).eq("id",c.id); }
      }catch(e){}
      const ss=((await sb.from("segmenti_lavoro").select("*").eq("fase_chiave",ch)).data)||[];
      const dur=x=>((x.fine?ms(x.fine):ms(x.inizio))-ms(x.inizio));
      const nettoV=ss.reduce((t,x)=>t+dur(x),0);
      const attravV=ss.length? Math.max.apply(null,ss.map(x=>x.fine?ms(x.fine):ms(x.inizio)))-Math.min.apply(null,ss.map(x=>ms(x.inizio))) : 0;
      const perOp={}; ss.forEach(x=>{ const n=x.operatore_nome||"?"; perOp[n]=(perOp[n]||0)+dur(x); });
      const pause=ss.filter(x=>x.motivo && x.motivo!=="fine");
      const inizioV=ss.length? Math.min.apply(null,ss.map(x=>ms(x.inizio))):null;
      const fineV=ss.length? Math.max.apply(null,ss.map(x=>x.fine?ms(x.fine):ms(x.inizio))):null;
      setRiep({fa, nettoV, attravV, perOp, pause, inizioV, fineV});
      await carica();
    }catch(ex){ setErr(ex.message); }
    setBusy(false);
  }

  if(err && !commesse) return <div className="po"><div className="po-empty" style={{color:"#c0392b"}}>Errore: {err}</div></div>;
  if(!commesse) return <div className="po"><div className="po-empty">Caricamento…</div></div>;

  const items=[];
  commesse.forEach(c=>(c.commesse_fasi||[]).slice().sort((a,b)=>(a.ordine||0)-(b.ordine||0)).forEach(fa=>{ if(fa.stato!=="fatto") items.push({c,fa}); }));
  const mieOra = me? items.filter(({fa})=>mioAperto(fa.chiave)) : [];
  const q=cerca.trim().toLowerCase();
  const altre = items
    .filter(({fa})=> !(me && mioAperto(fa.chiave)))
    .filter(({c,fa})=> !q || [c.numero,c.cliente_nome,fa.descrizione,fa.reparto].join(" ").toLowerCase().includes(q));

  const renderFase=(c,fa,big)=>{
    const ch=fa.chiave;
    const mio=mioAperto(ch);
    const att=aperti(ch);
    const st=STATI_FASE[fa.stato]||STATI_FASE.da_fare;
    const orar=orarioFase(ch);
    const haSeg=segDi(ch).length>0;
    return <div key={c.id+"|"+(ch||fa.id)} className={"po-fase"+(big?" big":(mio?" mine":""))}>
      <div className="po-fh">
        <div style={{cursor:"pointer"}} onClick={()=>setDettFase(c)} title="Apri il dettaglio: cosa fare, articoli, misure, note">
          <div className="po-sm">{c.numero||"(commessa)"} · {c.cliente_nome||"—"}</div>
          <div className="ds">{fa.descrizione||fa.reparto||"Lavorazione"} <span style={{fontSize:13,color:"#2f5bea",fontWeight:600}}>ℹ️ cosa fare</span></div>
        </div>
        <span className="po-badge" style={{background:st.bg,color:st.c}}>{st.l}</span>
      </div>
      <div className="po-times">
        <div className="po-t"><div className="lab">Tempo netto</div><div className={"val"+(att.length?" run":"")}>{fmt(netto(ch))}</div></div>
        {orar && <div className="po-t"><div className="lab">Orario</div>
          <div className="val" style={{fontSize:big?26:18}}>{oraIt(orar.a)} → {orar.running? <span style={{color:"#1f9c68"}}>in corso</span> : oraIt(orar.b)}</div></div>}
      </div>
      <div className="po-sub">Attraversamento {fmt(attrav(ch))} · previste {Number(fa.ore_previste)||0}h → reali {oreDi(netto(ch)).toFixed(1)}h
        {att.length? <> · ▶ <b>{att.map(s=>s.operatore_nome).join(", ")}</b></> : haSeg? " · ⏸ in pausa" : ""}</div>
      {pausaFor===ch && ch
        ? <div className="po-reasons">
            {Object.keys(MOTIVI).map(k=><button key={k} onClick={()=>mettiPausa(fa,k)}>{MOTIVI[k]}</button>)}
            <button onClick={()=>setPausaFor(null)} style={{background:"#f5f7fb"}}>Annulla</button>
          </div>
        : <div className="po-btns">
            {mio
              ? <button className="po-btn pause" disabled={busy} onClick={()=>setPausaFor(ch)}>⏸ Pausa</button>
              : <button className="po-btn go" disabled={busy||!me} onClick={()=>prendi(fa,c)}>{haSeg?"▶ Riprendi":"▶ Prendi in carico"}</button>}
            <button className="po-btn close" disabled={busy} onClick={()=>chiudi(fa,c)}>✓ Chiudi</button>
          </div>}
    </div>;
  };

  return <div className="po">
    <div className="po-top">
      <h2>⏱️ Postazione operatore</h2>
      <div className="po-who">
        <span style={{fontSize:14,color:"#5b6773"}}>Sei:</span>
        <select value={me} onChange={e=>scegliMe(e.target.value)}>
          <option value="">— scegli —</option>
          {operatori.filter(o=>o.tipo!=="struttura" || profilo.ruolo==="amministratore").map(o=><option key={o.id} value={o.id}>{o.nome}{o.tipo==="struttura"?" (struttura)":""}</option>)}
        </select>
      </div>
    </div>
    {profilo.ruolo==="amministratore" && <div className="po-empty" style={{padding:"6px 12px",fontSize:12.5,color:"#5b6773"}}>👑 Amministratore: vedi <b>tutte</b> le commesse in lavorazione; puoi timbrare col tuo PIN (compaiono anche gli operatori "struttura", es. titolari).</div>}
    {err && <div className="po-empty" style={{color:"#c0392b",padding:12}}>{err}</div>}
    {!me && <div className="po-empty">👆 Scegli il tuo nome in alto per iniziare a timbrare.</div>}

    {me && meServePin && meSenzaPin &&
      <div className="po-empty" style={{padding:22}}>
        <div style={{fontSize:16,marginBottom:6}}>🔒 <b>{meNome}</b> non ha un PIN impostato.</div>
        <div className="muted" style={{fontSize:13}}>Per timbrare serve un PIN: chiedi all'amministratore di impostartelo nella tua scheda operatore.</div>
      </div>}
    {me && meServePin && !meSenzaPin &&
      <div className="po-empty" style={{padding:22}}>
        <div style={{fontSize:16,marginBottom:10}}>🔒 Ciao <b>{meNome}</b>, inserisci il tuo <b>PIN</b> per accedere.</div>
        <div style={{display:"flex",gap:8,justifyContent:"center",alignItems:"center",flexWrap:"wrap"}}>
          <input type="password" inputMode="numeric" autoComplete="off" value={pinInput} autoFocus
            onChange={e=>setPinInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();verificaPin();}}}
            placeholder="PIN" style={{width:140,padding:"10px 12px",fontSize:18,textAlign:"center",letterSpacing:4,border:"1px solid var(--line)",borderRadius:8}}/>
          <button type="button" className="btn primary" disabled={busy} onClick={verificaPin}>Accedi</button>
        </div>
        <div className="muted" style={{fontSize:12,marginTop:10}}>Il PIN lo imposta l'amministratore nella scheda operatore. Serve per evitare timbrature a nome altrui.</div>
      </div>}

    {okOperatore && items.length===0 &&
      <div className="po-empty">Nessuna lavorazione attiva. Compaiono qui le fasi delle commesse aperte o in produzione.</div>}

    {okOperatore && items.length>0 && <>
      <div className="po-empty" style={{padding:"8px 14px",fontSize:13,color:"#41505c",background:"#eef4ff",borderRadius:8,margin:"4px 0 8px"}}>
        👉 Trova la tua lavorazione qui sotto e premi <b>▶ Prendi in carico</b> per avviare il cronometro. Tocca <b>ℹ️ cosa fare</b> per vedere articoli, misure e note della commessa. A fine lavoro <b>⏸ Pausa</b> o <b>✓ Chiudi</b>.
      </div>
      <div className="po-section">▶ Sto lavorando ora <span className="count">({mieOra.length})</span></div>
      {mieOra.length===0
        ? <div className="po-empty" style={{padding:"18px 20px"}}>Nessuna lavorazione in corso. Prendine una qui sotto 👇</div>
        : mieOra.map(({c,fa})=>renderFase(c,fa,true))}

      <div className="po-section">Altre lavorazioni <span className="count">({altre.length})</span></div>
      <div className="po-search"><span>🔍</span>
        <input placeholder="Cerca commessa, cliente o fase…" value={cerca} onChange={e=>setCerca(e.target.value)}/></div>
      {altre.length===0
        ? <div className="po-empty" style={{padding:"18px 20px"}}>{q? "Nessun risultato per «"+cerca+"»." : "Tutto in corso 👍"}</div>
        : altre.map(({c,fa})=>renderFase(c,fa,false))}
    </>}

    {riep && <div className="po-modal-bg" onClick={()=>setRiep(null)}>
      <div className="po-modal" onClick={e=>e.stopPropagation()}>
        <h3>Riepilogo lavorazione</h3>
        <div style={{fontSize:13,color:"#6b7684",marginBottom:10}}>{riep.fa.descrizione||riep.fa.reparto||""}</div>
        <div className="rr"><span>Orario (inizio → fine)</span><b>{oraIt(riep.inizioV)} → {oraIt(riep.fineV)}</b></div>
        <div className="rr"><span>Tempo netto (lavoro)</span><b>{fmt(riep.nettoV)}</b></div>
        <div className="rr"><span>Attraversamento (inizio→fine)</span><b>{fmt(riep.attravV)}</b></div>
        <div style={{margin:"14px 0 4px",fontWeight:700,fontSize:12,textTransform:"uppercase",letterSpacing:".05em",color:"#41505c"}}>Chi ha lavorato</div>
        {Object.keys(riep.perOp).length===0 && <div style={{color:"#8b95a1",fontSize:14}}>—</div>}
        {Object.keys(riep.perOp).map(n=><div key={n} className="rr"><span>{n}</span><b>{fmt(riep.perOp[n])}</b></div>)}
        <div style={{margin:"14px 0 4px",fontWeight:700,fontSize:12,textTransform:"uppercase",letterSpacing:".05em",color:"#41505c"}}>Pause ({riep.pause.length})</div>

// Frequenza controllo di uno strumento: valore + unità (giorni/settimane/mesi/anni).
// Fallback al vecchio frequenza_mesi per i record creati prima della v91.
const UNIT_STRUM_DAYS={giorni:1,settimane:7,mesi:30,anni:365};
function freqStrum(str){ let v=str.frequenza_valore, u=str.frequenza_unita;
  if(v==null && str.frequenza_mesi!=null){ v=str.frequenza_mesi; u="mesi"; }
  return {v:Number(v)||0, u:u||"mesi"}; }
function freqLabelStrum(str){ const {v,u}=freqStrum(str); if(v<=0) return "—";
  const sing={giorni:"giorno",settimane:"settimana",mesi:"mese",anni:"anno"};
  const plur={giorni:"giorni",settimane:"settimane",mesi:"mesi",anni:"anni"};
  return v+" "+(v===1?sing[u]:plur[u]); }
// Stato di un mezzo/strumento in base all'ultima data di controllo + frequenza (valore+unità)
function statoStrumento(str, lastData){
  const {v,u}=freqStrum(str);
  if(v<=0) return {stato:"Ok", prossimo:null};                    // nessuna frequenza = nessuna scadenza
  if(!lastData) return {stato:"Scaduto", prossimo:null};          // mai controllato
  const d=new Date(lastData); if(isNaN(d.getTime())) return {stato:"Scaduto", prossimo:null};
  const due=new Date(d);
  if(u==="giorni") due.setDate(due.getDate()+v);
  else if(u==="settimane") due.setDate(due.getDate()+v*7);
  else if(u==="anni") due.setFullYear(due.getFullYear()+v);
  else due.setMonth(due.getMonth()+v);
  const oggi=new Date(); oggi.setHours(0,0,0,0);
  const giorni=Math.floor((due-oggi)/86400000);
  const win=Math.max(1, Math.min(30, Math.round(v*(UNIT_STRUM_DAYS[u]||30)*0.2)));  // preavviso ~20% dell'intervallo
  if(giorni<0) return {stato:"Scaduto", prossimo:due};
  if(giorni<=win) return {stato:"In scadenza", prossimo:due};
  return {stato:"Ok", prossimo:due};
}

          : <div className="card" style={{overflow:"auto"}}>
              <table>
                <thead><tr>

function StrumentoForm({strumento,profilo,perm,onClose,onSalvato}){

    nome:strumento?.nome||"", codice:strumento?.codice||"", tipo_controllo:strumento?.tipo_controllo||"",
    chi_controlla:strumento?.chi_controlla||"",
    frequenza_valore:strumento?(strumento.frequenza_valore ?? strumento.frequenza_mesi ?? ""):"",
    frequenza_unita:strumento?.frequenza_unita||"mesi",
    attivo:strumento?strumento.attivo!==false:true, note:strumento?.note||"",
  }));
  const [busy,setBusy]=useState(false),[err,setErr]=useState("");
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  async function salva(e){ e&&e.preventDefault();
    if(!String(f.nome).trim()){ setErr("Metti un nome allo strumento."); return; }
    setBusy(true); setErr("");
    const rec={ nome:f.nome, codice:f.codice||"", tipo_controllo:f.tipo_controllo||"", chi_controlla:f.chi_controlla||"",
      frequenza_valore:Number(f.frequenza_valore)||0, frequenza_unita:f.frequenza_unita||"mesi",
      frequenza_mesi: (f.frequenza_unita||"mesi")==="mesi" ? (Number(f.frequenza_valore)||0) : null,
      attivo:!!f.attivo, note:f.note||"" };
    try{
      if(nuovo){ rec.creato_da=profilo.id; const {error}=await sb.from("strumenti").insert(rec); if(error) throw error; }
      else { const {error}=await sb.from("strumenti").update(rec).eq("id",strumento.id); if(error) throw error; }
      onSalvato();
    }catch(ex){ setErr(ex.message); setBusy(false); }
  }
  async function elimina(){ if(!confirm("Eliminare questo strumento e i suoi controlli?")) return;
    setBusy(true); const {error}=await sb.from("strumenti").delete().eq("id",strumento.id);
    if(error){ setErr(error.message); setBusy(false); return; } onSalvato(); }
  return (
    <div className="overlay"><form className="modal" style={{maxWidth:520}} onClick={e=>e.stopPropagation()} onSubmit={salva}>
      <header><h2>{nuovo?"Nuovo strumento/mezzo":"Strumento/mezzo"}</h2><button type="button" className="x" onClick={onClose}>×</button></header>

          <input value={f.nome} onChange={e=>set("nome",e.target.value)} required placeholder="es. Plotter da taglio, Muletto, Calibro…"/></div>
        <div className="field"><label>Codice / Targa / Matricola</label>
          <input value={f.codice} onChange={e=>set("codice",e.target.value)} placeholder='se non disponibile: "non applicabile"'/></div>
        <div className="row">
          <div className="field"><label>Tipo di controllo</label>
            <input value={f.tipo_controllo} onChange={e=>set("tipo_controllo",e.target.value)} placeholder="es. pulizia, taratura, tagliando"/></div>
          <div className="field" style={{maxWidth:110}}><label>Ogni</label>
            <input type="number" step="1" min="0" value={f.frequenza_valore} onChange={e=>set("frequenza_valore",e.target.value)}/></div>
          <div className="field" style={{maxWidth:150}}><label>Unità</label>
            <select value={f.frequenza_unita} onChange={e=>set("frequenza_unita",e.target.value)}>
              <option value="giorni">giorni</option><option value="settimane">settimane</option>
              <option value="mesi">mesi</option><option value="anni">anni</option>
            </select></div>
        </div>
        <div className="field"><label>Chi effettua il controllo</label>
          <input value={f.chi_controlla} onChange={e=>set("chi_controlla",e.target.value)} placeholder="es. Mario Rossi / ditta esterna"/></div>
        <label style={{display:"flex",alignItems:"center",gap:8,margin:"4px 0"}}>
          <input type="checkbox" checked={f.attivo} onChange={e=>set("attivo",e.target.checked)} style={{width:"auto"}}/> Attivo (compare nel registro)
        </label>
        <div className="field"><label>Note</label><textarea rows={2} value={f.note} onChange={e=>set("note",e.target.value)}/></div>
      </div>
      <footer>

        <button className="btn primary" disabled={busy}>{busy?<span className="spin"/>:"Salva"}</button>
      </footer>
    </form></div>
  );

function StoricoControlli({strumento,perm,onClose,onCambiato}){
  const [lista,setLista]=useState(null);
  const carica=useCallback(()=>{ sb.from("strumenti_controlli").select("*").eq("strumento_id",strumento.id)
    .order("data",{ascending:false}).order("creato_il",{ascending:false}).then(({data})=>setLista(data||[])); },[strumento.id]);
  useEffect(()=>{ carica(); },[carica]);
  async function del(id){ if(!confirm("Eliminare questo controllo?")) return;
    await sb.from("strumenti_controlli").delete().eq("id",id); carica(); onCambiato&&onCambiato(); }
  return (
    <div className="overlay"><div className="modal" style={{maxWidth:520}} onClick={e=>e.stopPropagation()}>
      <header><div><h2>🕓 Storico controlli</h2><span className="muted">{strumento.nome}</span></div>
        <button className="x" onClick={onClose}>×</button></header>
      <div className="body">
        {lista===null? <div className="empty">Caricamento…</div>
          : lista.length===0? <div className="muted" style={{fontSize:13}}>Nessun controllo registrato.</div>
          : <table><thead><tr><th>Data</th><th>Operatore</th><th>Note</th>{perm.elimina && <th></th>}</tr></thead>
              <tbody>{lista.map(c=><tr key={c.id}>
                <td>{c.data? new Date(c.data).toLocaleDateString("it-IT"):"—"}</td>
                <td className="muted">{c.operatore||"—"}</td>
                <td className="muted">{c.note||"—"}</td>
                {perm.elimina && <td style={{textAlign:"right"}}><button className="btn small danger" onClick={()=>del(c.id)}>✕</button></td>}
              </tr>)}</tbody></table>}
      </div>
      <footer><button className="btn primary" onClick={onClose}>Chiudi</button></footer>
    </div></div>
  );
}

// Valutazione fornitore ISO: media dei 5 criteri e qualifica (media >= 3)
function valMediaForn(v){ if(!v) return 0;
  const a=[v.qualita,v.prezzo,v.tempi,v.ecosostenibilita,v.disponibilita].map(x=>Number(x)||0);
  return Math.round(a.reduce((s,x)=>s+x,0)/5*100)/100; }
function valQualificaForn(v){ return valMediaForn(v)>=3 ? "Qualificato" : "Non qualificato"; }

// Export di un array di oggetti in un file .xlsx (usa la libreria xlsx già inclusa)
function esportaExcel(rows, nomeFile, foglio){
  try{
    if(!rows||!rows.length){ alert("Niente da esportare."); return; }
    const ws=XLSX.utils.json_to_sheet(rows);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, (foglio||"Dati").slice(0,31));
    XLSX.writeFile(wb, nomeFile);
  }catch(e){ alert("Export non riuscito: "+(e&&e.message||e)); }
}

function ModuloClienti({profilo,perm}){
  const [clienti,setClienti]=useState(null);
  const [err,setErr]=useState("");
  const [cerca,setCerca]=useState("");
  const [filtroLav,setFiltroLav]=useState("");
  const [filtroReg,setFiltroReg]=useState("");
  const [filtroCitta,setFiltroCitta]=useState("");
  const [filtroStato,setFiltroStato]=useState("");
  const [filtroTipo,setFiltroTipo]=useState("");
  const [filtroCat,setFiltroCat]=useState("");
  const [fattMin,setFattMin]=useState("");
  const [fattMax,setFattMax]=useState("");
  const [selezionato,setSelezionato]=useState(null); // cliente per dettaglio
  const [form,setForm]=useState(null); // null | {} nuovo | cliente esistente

  const carica=useCallback(async()=>{
    setErr("");
    const {data,error}=await sb.from("clienti")
      .select("*, clienti_sedi(*), clienti_email(*), clienti_condizioni(*), clienti_listini(*), clienti_sconti(*), agente:agenti(nome,provvigione_pct)")
      .order("ragione_sociale");
    if(error){ setErr(error.message); return; }
    setClienti(data||[]);
  },[]);
  useEffect(()=>{ carica(); },[carica]);

  // incidenza % sul fatturato: fatturato reale (commesse consegnate/chiuse) dell'anno in corso, per cliente
  const annoCorr=new Date().getFullYear();
  const [fattMap,setFattMap]=useState({});
  useEffect(()=>{ if(!perm.economici){ setFattMap({}); return; }
    sb.rpc("fatturato_clienti",{p_anno:annoCorr}).then(({data})=>{
      const m={}; (data||[]).forEach(r=>{ m[r.cliente_id]=Number(r.totale)||0; }); setFattMap(m);
    }).catch(()=>{});
  },[perm.economici,annoCorr]);
  const fattTot=useMemo(()=>Object.values(fattMap).reduce((s,v)=>s+v,0),[fattMap]);
  const incid=c=> fattTot>0 ? (Number(fattMap[c.id])||0)/fattTot*100 : 0;
  const eur=n=>Number(n||0).toLocaleString("it-IT",{style:"currency",currency:"EUR",maximumFractionDigits:0});

  const cittaOpzioni = useMemo(()=>{
    const set=new Set();
    (clienti||[]).forEach(c=>(c.clienti_sedi||[]).forEach(s=>s.citta&&set.add(s.citta)));
    return [...set].sort((a,b)=>a.localeCompare(b));
  },[clienti]);

  const filtrati = useMemo(()=>{
    if(!clienti) return [];
    const q=cerca.trim().toLowerCase();
    return clienti.filter(c=>{
      const sedi=c.clienti_sedi||[];
      if(filtroLav && !(c.lavorazioni||[]).includes(filtroLav)) return false;
      if(filtroReg && !sedi.some(s=>s.regione===filtroReg)) return false;
      if(filtroCitta && !sedi.some(s=>s.citta===filtroCitta)) return false;
      if(filtroStato && (c.stato||"Attivo")!==filtroStato) return false;
      if(filtroTipo && (c.tipo||"Azienda")!==filtroTipo) return false;
      if(filtroCat && (c.categoria||"Cliente finale")!==filtroCat) return false;
      if(perm.economici){
        const fatt=Number((c.clienti_condizioni||[])[0]?.fatturato||0);
        if(fattMin!=="" && fatt<Number(fattMin)) return false;
        if(fattMax!=="" && fatt>Number(fattMax)) return false;
      }
      if(!q) return true;
      const blob=[c.ragione_sociale,c.tipo_attivita,c.partita_iva,c.referente,
        ...sedi.map(s=>s.citta),
        ...(c.clienti_email||[]).map(e=>e.indirizzo)].join(" ").toLowerCase();
      return blob.includes(q);
    });
  },[clienti,cerca,filtroLav,filtroReg,filtroCitta,filtroStato,filtroTipo,fattMin,fattMax,perm]);

  function esporta(){
    const rows=filtrati.map(c=>{
      const sede=(c.clienti_sedi||[])[0]||{};
      const email=(c.clienti_email||[]).map(e=>e.indirizzo).filter(Boolean).join(", ");
      const r={
        "Ragione sociale":c.ragione_sociale||"", "Tipo":c.tipo||"", "Categoria":c.categoria||"",
        "Attività":c.tipo_attivita||"", "Referente":c.referente||"",
        "Città":sede.citta||"", "Provincia":sede.provincia||"", "Regione":sede.regione||"",
        "Telefono":c.telefono||"", "Cellulare":c.cellulare||"", "Email":email,
        "P.IVA":c.partita_iva||"", "Cod.Fiscale":c.codice_fiscale||"",
        "Stato":c.stato||"Attivo", "Affidabilità":c.affidabilita||"",
        "Agente":(c.agente&&c.agente.nome)||"", "Lavorazioni":(c.lavorazioni||[]).join(", "),
      };
      if(perm.economici){ r["Fatturato "+annoCorr+" €"]=Math.round((Number(fattMap[c.id])||0)*100)/100;
        r["Incidenza %"]=Math.round(incid(c)*10)/10; }
      return r;
    });
    esportaExcel(rows, "Clienti_"+new Date().toISOString().slice(0,10)+".xlsx", "Clienti");
  }

  const puoFeedback=["amministratore","commerciale","reception"].indexOf(profilo&&profilo.ruolo)>=0;
  async function esportaRegistroFeedback(){
    try{
      const {data,error}=await sb.from("clienti_feedback").select("cliente_nome,anno,feedback,note")
        .order("anno",{ascending:true}).order("cliente_nome");
      if(error){ alert("Errore: "+error.message); return; }
      const rows=data||[];
      if(!rows.length){ alert("Nessun feedback registrato. Inseriscine dalle schede cliente."); return; }
      const aoa1=[["REG QA-9.1.2 Registro feed-back clienti"],
        ["Nome cliente","Anno","Feedback","Controllo compilazione","Note"],
        ...rows.map(r=>[r.cliente_nome||"", r.anno, r.feedback, (r.cliente_nome&&r.anno&&r.feedback)?"Ok":"", r.note||""])];
      const byYear={};
      rows.forEach(r=>{ const b=(byYear[r.anno]=byYear[r.anno]||{Negativo:0,"Parzialmente positivo":0,Positivo:0}); if(b[r.feedback]!=null) b[r.feedback]++; });
      const years=Object.keys(byYear).map(Number).sort((a,b)=>a-b);
      let tN=0,tP=0,tPos=0;
      const aoa2=[["Anno","Negativo","Parzialmente positivo","Positivo","Totale feed-back"]];
      years.forEach(y=>{ const b=byYear[y]; const tot=b.Negativo+b["Parzialmente positivo"]+b.Positivo;
        tN+=b.Negativo; tP+=b["Parzialmente positivo"]; tPos+=b.Positivo;
        aoa2.push([y,b.Negativo,b["Parzialmente positivo"],b.Positivo,tot]); });
      aoa2.push([],["Riepilogo complessivo",""],["Feed-back positivi",tPos],
        ["Feed-back parzialmente positivi",tP],["Feed-back negativi",tN]);
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa1), "Registro feed-back clienti");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa2), "Calcoli");
      XLSX.writeFile(wb, "Registro_feedback_clienti_"+new Date().toISOString().slice(0,10)+".xlsx");
    }catch(e){ alert("Export non riuscito: "+(e&&e.message||e)); }
  }

  return (
    <>
      <div className="topbar">
        <h1>Anagrafica Clienti</h1>
        <button className="btn" onClick={esporta} disabled={!filtrati.length} title="Esporta la lista filtrata in Excel">⬇️ Esporta Excel</button>
        {puoFeedback && <button className="btn" onClick={esportaRegistroFeedback} title="Genera il registro ISO feedback clienti (Excel, con calcoli per anno)">📋 Registro feedback ISO</button>}
        {perm.scrivi &&
          <button className="btn primary" onClick={()=>setForm({})}>+ Nuovo cliente</button>}
      </div>
      <div className="content">
        {err && <div className="banner err">{err}</div>}
        <div className="toolbar">
          <div className="search">
            <span className="mag">🔍</span>
            <input placeholder="Cerca per ragione sociale, attività, referente, città, email…"
                   value={cerca} onChange={e=>setCerca(e.target.value)}/>
          </div>
          <span className="muted">{filtrati.length} clienti</span>
        </div>
        <div className="toolbar">
          <select className="btn" value={filtroLav} onChange={e=>setFiltroLav(e.target.value)} style={{maxWidth:220}}>
            <option value="">Tutte le lavorazioni</option>
            {LAVORAZIONI.map(l=><option key={l} value={l}>{l}</option>)}
          </select>
          <select className="btn" value={filtroReg} onChange={e=>setFiltroReg(e.target.value)} style={{maxWidth:180}}>
            <option value="">Tutte le regioni</option>
            {REGIONI.map(r=><option key={r} value={r}>{r}</option>)}
          </select>
          <select className="btn" value={filtroCitta} onChange={e=>setFiltroCitta(e.target.value)} style={{maxWidth:170}}>
            <option value="">Tutte le città</option>
            {cittaOpzioni.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          <select className="btn" value={filtroTipo} onChange={e=>setFiltroTipo(e.target.value)} style={{maxWidth:130}}>
            <option value="">Tipo: tutti</option>
            {TIPI_CLIENTE.map(t=><option key={t} value={t}>{t}</option>)}
          </select>
          <select className="btn" value={filtroCat} onChange={e=>setFiltroCat(e.target.value)} style={{maxWidth:160}}>
            <option value="">Finale/Rivend.: tutti</option>
            {CATEGORIE_CLIENTE.map(t=><option key={t} value={t}>{t}</option>)}
          </select>
          <select className="btn" value={filtroStato} onChange={e=>setFiltroStato(e.target.value)} style={{maxWidth:130}}>
            <option value="">Stato: tutti</option>
            {STATI.map(t=><option key={t} value={t}>{t}</option>)}
          </select>
          {perm.economici && <>
            <input className="btn" type="number" min="0" placeholder="Fatt. min €" value={fattMin}
                   onChange={e=>setFattMin(e.target.value)} style={{maxWidth:120}}/>
            <input className="btn" type="number" min="0" placeholder="Fatt. max €" value={fattMax}
                   onChange={e=>setFattMax(e.target.value)} style={{maxWidth:120}}/>
          </>}
          <button className="btn small" onClick={()=>{setFiltroLav("");setFiltroReg("");setFiltroCitta("");
            setFiltroTipo("");setFiltroCat("");setFiltroStato("");setFattMin("");setFattMax("");setCerca("");}}>Azzera filtri</button>
        </div>

        {clienti===null
          ? <div className="empty">Caricamento…</div>
          : filtrati.length===0
            ? <div className="card empty">Nessun cliente trovato.</div>
            : <div className="card" style={{overflow:"hidden"}}>
                <table>
                  <thead><tr>
                    <th>Ragione sociale</th><th>Tipo attività</th>
                    <th>Città</th>{perm.economici && <th style={{textAlign:"right"}} title={"Quota sul fatturato "+annoCorr+" (commesse consegnate/chiuse)"}>Incidenza {annoCorr}</th>}<th>Affidabilità</th><th>Lavorazioni</th>
                  </tr></thead>
                  <tbody>
                    {filtrati.map(c=>{
                      const citta=(c.clienti_sedi||[])[0]?.citta || "—";
                      return (
                        <tr key={c.id} onClick={()=>setSelezionato(c)}>
                          <td className="rs">{c.ragione_sociale}
                            {c.stato==="Sospeso" &&
                              <span className="tag" style={{background:"#fdf0e3",color:"#c47a1e",marginLeft:8}}>Sospeso</span>}
                          </td>
                          <td className="muted">{c.tipo_attivita||"—"}</td>
                          <td>{citta}</td>
                          {perm.economici && <td style={{textAlign:"right"}}>{fattTot>0 && fattMap[c.id]? <b title={eur(fattMap[c.id])}>{(Math.round(incid(c)*10)/10)}%</b> : <span className="muted">—</span>}</td>}
                          <td style={{color:"#f5a623",letterSpacing:1,whiteSpace:"nowrap"}}>{c.affidabilita>0? ("★".repeat(c.affidabilita)+"☆".repeat(5-c.affidabilita)) : <span className="muted">—</span>}</td>
                          <td>{(c.lavorazioni||[]).slice(0,3).map(l=><span key={l} className="tag">{l}</span>)}
                              {(c.lavorazioni||[]).length>3 && <span className="tag">+{c.lavorazioni.length-3}</span>}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>}
      </div>

      {selezionato &&
        <DettaglioCliente cliente={selezionato} perm={perm} profilo={profilo}
          onClose={()=>setSelezionato(null)}
          onModifica={()=>{ setForm(selezionato); setSelezionato(null); }}
          onEliminato={()=>{ setSelezionato(null); carica(); }}/>}

      {form &&
        <FormCliente cliente={form.id?form:null} perm={perm}
          onClose={()=>setForm(null)}
          onSalvato={()=>{ setForm(null); carica(); }}/>}
    </>
  );
}

    sb.from("impostazioni").select("sconto_rivenditori_pct").eq("id",1).maybeSingle()
      .then(({data})=>setScontoRivStd(Number(data&&data.sconto_rivenditori_pct)||0)); },[perm.economici]);
  // CRM del cliente (visibile a chi ha il flag crm: amministratore/commerciale/agente)
  const [crmTratt,setCrmTratt]=useState(null);
  const [crmAtt,setCrmAtt]=useState([]);
  const [crmEditor,setCrmEditor]=useState(null);      // {tipo:'tratt'|'att', dato}

      sb.from("crm_trattative").select("*").eq("cliente_id",c.id).order("aggiornato_il",{ascending:false}),
      sb.from("crm_attivita").select("*").eq("cliente_id",c.id).order("data_ora",{ascending:false}).limit(30),
    ]).then(([t,a])=>{ setCrmTratt(t.data||[]); setCrmAtt(a.data||[]); });

  useEffect(()=>{ caricaCrm(); },[caricaCrm]);

  // --- Feedback cliente (registro ISO REG QA-9.1.2) ---

  const [fbList,setFbList]=useState(null);
