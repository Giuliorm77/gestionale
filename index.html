/* ================================================================ TRASPORTI (listini corrieri) */
function ModuloTrasporti({profilo,perm}){
  const [corrieri,setCorrieri]=useState(null);
  const [err,setErr]=useState("");
  const [editor,setEditor]=useState(null);
  const carica=useCallback(async()=>{
    setErr("");
    const {data,error}=await sb.from("corrieri").select("*, corrieri_scaglioni(*)").order("nome");
    if(error){ setErr(error.message); return; }
    setCorrieri(data||[]);
  },[]);
  useEffect(()=>{ carica(); },[carica]);
  const baseL=v=>(BASI_TRASPORTO.find(b=>b.v===v)||{}).l||v;
  return (
    <>
      <div className="topbar"><h1>Trasporti / Corrieri</h1>
        {perm.scrivi && <button className="btn primary" onClick={()=>setEditor({})}>+ Nuovo listino corriere</button>}
      </div>
      <div className="content">
        {err && <div className="banner err">{err}</div>}
        <div className="banner info">Un listino per ogni <b>corriere + zona</b>. Scegli la <b>base</b> (peso, peso volumetrico, colli, volume, mq) e gli <b>scaglioni</b>. Il calcolo trasporto nel preventivo userà questi listini.</div>
        {corrieri===null ? <div className="empty">Caricamento…</div>
          : corrieri.length===0 ? <div className="card empty">Nessun listino. Creane uno con “+ Nuovo listino corriere”.</div>
          : <div className="card" style={{overflow:"auto"}}>
              <table>
                <thead><tr><th>Corriere</th><th>Zona</th><th>Base di calcolo</th><th>Scaglioni</th><th>Attivo</th></tr></thead>
                <tbody>
                  {corrieri.map(c=>
                    <tr key={c.id} onClick={()=>setEditor(c)}>
                      <td className="rs">{c.nome||"—"}</td>
                      <td>{c.zona||"—"}</td>
                      <td className="muted">{baseL(c.base)}</td>
                      <td className="muted">{(c.corrieri_scaglioni||[]).length}</td>
                      <td>{c.attivo===false?<span className="tag" style={{background:"#fdf0e3",color:"#c47a1e"}}>No</span>:<span className="tag" style={{background:"#e6f4ee",color:"#1f9c68"}}>Sì</span>}</td>
                    </tr>)}
                </tbody>
              </table>
            </div>}
      </div>
      {editor && <CorriereEditor corriere={editor.id?editor:null} profilo={profilo} perm={perm}
        onClose={()=>setEditor(null)} onSalvato={()=>{setEditor(null);carica();}}/>}
    </>
  );
}

function CorriereEditor({corriere,profilo,perm,onClose,onSalvato}){
  const nuovo=!corriere;
  const [f,setF]=useState(()=>({
    nome:corriere?.nome||"", zona:corriere?.zona||"", base:corriere?.base||"peso",
    coeff_volumetrico:corriere?.coeff_volumetrico ?? 200, supplemento_collo:corriere?.supplemento_collo ?? 0,
    minimo:corriere?.minimo ?? 0, attivo:corriere?.attivo!==false, note:corriere?.note||"",
  }));
  const [scaglioni,setScaglioni]=useState(()=> (corriere?.corrieri_scaglioni||[]).slice().sort((a,b)=>(Number(a.da_valore)||0)-(Number(b.da_valore)||0)).map(s=>({...s})) );
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const [importOpen,setImportOpen]=useState(false);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const setSc=(i,k,v)=>setScaglioni(p=>p.map((s,j)=>j===i?{...s,[k]:v}:s));
  const addSc=()=>setScaglioni(p=>[...p,{da_valore:0,prezzo:0}]);
  const delSc=i=>setScaglioni(p=>p.filter((_,j)=>j!==i));
  const volumetrico=f.base==="peso_volumetrico";
  async function salva(e){
    e.preventDefault();
    if(!f.nome.trim()){ setErr("Indica il nome del corriere."); return; }
    setBusy(true); setErr("");
    try{
      const rec={nome:f.nome, zona:f.zona||"", base:f.base, coeff_volumetrico:Number(f.coeff_volumetrico)||0,
        supplemento_collo:Number(f.supplemento_collo)||0, minimo:Number(f.minimo)||0, attivo:f.attivo, note:f.note||""};
      let id=corriere?.id;
      if(nuovo){ const {data,error}=await sb.from("corrieri").insert(rec).select("id").single(); if(error) throw error; id=data.id; }
      else{ const {error}=await sb.from("corrieri").update(rec).eq("id",id); if(error) throw error;
        await sb.from("corrieri_scaglioni").delete().eq("corriere_id",id); }
      const rows=scaglioni.filter(s=>s.prezzo!==""||s.da_valore!=="").map((s,idx)=>({corriere_id:id, ordine:idx,
        da_valore:Number(s.da_valore)||0, prezzo:Number(s.prezzo)||0}));
      if(rows.length){ const {error}=await sb.from("corrieri_scaglioni").insert(rows); if(error) throw error; }
      onSalvato();
    }catch(ex){ setErr(ex.message); setBusy(false); }
  }
  async function elimina(){
    if(!corriere?.id) return;
    if(!window.confirm("Eliminare il listino \""+(f.nome||"")+"\"?")) return;
    setBusy(true); setErr("");
    try{ const {error}=await sb.from("corrieri").delete().eq("id",corriere.id); if(error) throw error; onSalvato(); }
    catch(ex){ setErr(ex.message); setBusy(false); }
  }
  const inSt={width:120,padding:"6px 7px",border:"1px solid var(--line)",borderRadius:7,textAlign:"right"};
  return (
    <div className="overlay">
      <form className="modal" style={{maxWidth:720}} onClick={e=>e.stopPropagation()} onSubmit={salva}>
        <header><h2>{nuovo?"Nuovo listino corriere":"Listino "+(f.nome||"")}</h2>
          <button type="button" className="x" onClick={onClose}>×</button></header>
        <div className="body">
          {err && <div className="banner err">{err}</div>}
          <div className="section">
            <h3>Corriere e zona</h3>
            <div className="row">
              <div className="field" style={{flex:2}}><label>Corriere *</label>
                <input value={f.nome} onChange={e=>set("nome",e.target.value)} required placeholder="es. BRT, GLS…" autoFocus/></div>
              <div className="field"><label>Zona</label>
                <input value={f.zona} onChange={e=>set("zona",e.target.value)} placeholder="es. Italia Nord, Isole, CAP 80–84…"/></div>
            </div>
            <div className="row">
              <div className="field"><label>Base di calcolo</label>
                <select value={f.base} onChange={e=>set("base",e.target.value)}>
                  {BASI_TRASPORTO.map(b=><option key={b.v} value={b.v}>{b.l}</option>)}
                </select></div>
              {volumetrico && <div className="field" style={{maxWidth:180}}><label>Coeff. volumetrico (kg/m³)</label>
                <input type="number" step="1" value={f.coeff_volumetrico} onChange={e=>set("coeff_volumetrico",e.target.value)}/></div>}
            </div>
            <div className="row">
              <div className="field" style={{maxWidth:180}}><label>Supplemento a collo €</label>
                <input type="number" step="0.01" value={f.supplemento_collo} onChange={e=>set("supplemento_collo",e.target.value)}/></div>
              <div className="field" style={{maxWidth:150}}><label>Minimo €</label>
                <input type="number" step="0.01" value={f.minimo} onChange={e=>set("minimo",e.target.value)}/></div>
              <label style={{display:"flex",alignItems:"center",gap:8,alignSelf:"flex-end",paddingBottom:8}}>
                <input type="checkbox" checked={f.attivo} onChange={e=>set("attivo",e.target.checked)} style={{width:"auto"}}/> Attivo
              </label>
            </div>
          </div>
          <div className="section">
            <h3>Scaglioni</h3>
            <div className="muted" style={{fontSize:12,marginBottom:8}}>Da un valore in su (sulla base scelta) si applica il prezzo. Es. da 0 = 8€, da 5 = 12€, da 10 = 18€…</div>
            <table>
              <thead><tr><th>Da (valore)</th><th>Prezzo €</th><th></th></tr></thead>
              <tbody>
                {scaglioni.length===0 && <tr><td colSpan={3} className="muted" style={{padding:12}}>Nessuno scaglione. Aggiungine qui sotto.</td></tr>}
                {scaglioni.map((s,i)=>
                  <tr key={i}>
                    <td><input type="number" step="0.001" value={s.da_valore} onChange={e=>setSc(i,"da_valore",e.target.value)} style={inSt}/></td>
                    <td><input type="number" step="0.01" value={s.prezzo} onChange={e=>setSc(i,"prezzo",e.target.value)} style={inSt}/></td>
                    <td><button type="button" className="btn small danger" onClick={()=>delSc(i)}>✕</button></td>
                  </tr>)}
              </tbody>
            </table>
            <div style={{display:"flex",gap:8,marginTop:8}}>
              <button type="button" className="btn small" onClick={addSc}>+ Aggiungi scaglione</button>
              <button type="button" className="btn small" onClick={()=>setImportOpen(true)}>📊 Importa Excel</button>
            </div>
          </div>
          <div className="field"><label>Note</label><textarea rows={2} value={f.note} onChange={e=>set("note",e.target.value)}/></div>
          {importOpen && <ImportScaglioni onClose={()=>setImportOpen(false)}
            onImport={(list)=>{ setScaglioni(list.slice().sort((a,b)=>(Number(a.da_valore)||0)-(Number(b.da_valore)||0))); setImportOpen(false); }}/>}
        </div>
        <footer>
          {!nuovo && perm.elimina && <button type="button" className="btn danger" style={{marginRight:"auto"}} onClick={elimina} disabled={busy}>Elimina</button>}
          <button type="button" className="btn" onClick={onClose}>Annulla</button>
          <button className="btn primary" disabled={busy}>{busy?<span className="spin"/>:"Salva listino"}</button>
        </footer>
      </form>
    </div>
  );
}

/* ------------------------------------------------ import scaglioni corriere da Excel/CSV */
function ImportScaglioni({onClose,onImport}){
  const [cols,setCols]=useState(null);
  const [rows,setRows]=useState([]);
  const [colDa,setColDa]=useState("");
  const [colPrezzo,setColPrezzo]=useState("");
  const [err,setErr]=useState("");
  const [nomeFile,setNomeFile]=useState("");
  function onFile(e){
    const file=e.target.files && e.target.files[0]; if(!file) return;
    setErr(""); setNomeFile(file.name);
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const json=XLSX.utils.sheet_to_json(ws,{defval:""});
        if(!json.length){ setErr("File vuoto o senza intestazioni."); setCols(null); return; }
        const headers=Object.keys(json[0]);
        setCols(headers); setRows(json);
        const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,"");
        setColDa(headers.find(h=>/(peso|kg|soglia|scagl|volume|coll|mq|da|fino)/.test(norm(h)))||headers[0]||"");
        setColPrezzo(headers.find(h=>/(prezzo|costo|tariffa|euro|importo)/.test(norm(h)))||headers[1]||headers[0]||"");
      }catch(ex){ setErr("Impossibile leggere il file: "+ex.message); setCols(null); }
    };
    reader.readAsArrayBuffer(file);
  }
  const parsed=useMemo(()=> (cols&&colDa&&colPrezzo)
    ? rows.map(r=>({da_valore:normalizzaPrezzo(r[colDa])||0, prezzo:normalizzaPrezzo(r[colPrezzo])||0}))
        .filter(s=>s.prezzo>0 || s.da_valore>0)
    : [], [cols,rows,colDa,colPrezzo]);
  function conferma(){
    if(!parsed.length){ setErr("Nessuno scaglione valido: controlla le colonne selezionate."); return; }
    onImport(parsed);
  }
  return (
    <div className="overlay" style={{zIndex:70}}>
      <div className="modal" style={{maxWidth:640}} onClick={e=>e.stopPropagation()}>
        <header><h2>Importa scaglioni da Excel/CSV</h2>
          <button type="button" className="x" onClick={onClose}>×</button></header>
        <div className="body">
          {err && <div className="banner err">{err}</div>}
          <div className="banner info">Carica il listino del corriere. Poi indica quale colonna è il <b>valore "da"</b> (peso/colli/volume/mq) e quale il <b>prezzo</b>. L'import <b>sostituisce</b> gli scaglioni attuali.</div>
          <div className="field"><label>File Excel / CSV</label>
            <input type="file" accept=".xlsx,.xls,.csv" onChange={onFile}/>
            {nomeFile && <div className="muted" style={{fontSize:12,marginTop:4}}>{nomeFile} · {rows.length} righe</div>}</div>
          {cols && <>
            <div className="row">
              <div className="field"><label>Colonna "Da valore"</label>
                <select value={colDa} onChange={e=>setColDa(e.target.value)}>
                  {cols.map(c=><option key={c} value={c}>{c}</option>)}
                </select></div>
              <div className="field"><label>Colonna "Prezzo"</label>
                <select value={colPrezzo} onChange={e=>setColPrezzo(e.target.value)}>
                  {cols.map(c=><option key={c} value={c}>{c}</option>)}
                </select></div>
            </div>
            <div className="muted" style={{fontSize:12,margin:"6px 0"}}>Anteprima ({parsed.length} scaglioni):</div>
            <div style={{maxHeight:200,overflow:"auto",border:"1px solid var(--line)",borderRadius:8}}>
              <table><thead><tr><th>Da</th><th>Prezzo</th></tr></thead>
                <tbody>{parsed.slice(0,20).map((s,i)=><tr key={i}><td>{s.da_valore}</td><td>{eur(s.prezzo)}</td></tr>)}</tbody></table>
            </div>
          </>}
        </div>
        <footer>
          <button type="button" className="btn" onClick={onClose}>Annulla</button>
          <button type="button" className="btn primary" disabled={!parsed.length} onClick={conferma}>Importa {parsed.length||""} scaglioni</button>
        </footer>
      </div>
    </div>
  );
}

/* ------------------------------------------------ calcolatore trasporto (usa i listini corrieri) */
function CalcolatoreTrasporto({corrieri,articoli,righe,onClose,onApply}){
  const modOf=r=>r.modalita_consegna||"corriere";
  const corriereRows=(righe||[]).filter(r=>modOf(r)==="corriere");
  const cnt={corriere:corriereRows.length,
    ritiro_cliente:(righe||[]).filter(r=>modOf(r)==="ritiro_cliente").length,
    mezzo_nostro:(righe||[]).filter(r=>modOf(r)==="mezzo_nostro").length};
  const hasMix=cnt.ritiro_cliente>0 || cnt.mezzo_nostro>0;
  const autoPeso=Math.round(corriereRows.map(r=>pesoRiga(r,articoli)).reduce((s,p)=>s+(p||0),0)*1000)/1000;
  const mancanti=corriereRows.filter(r=>{ const art=(r.config&&r.config.articolo_id)||r.articolo_id; return art && pesoRiga(r,articoli)==null; }).length;
  const autoMq=Math.round(corriereRows.reduce((s,r)=>{ const m=(r.config&&r.config.mis)||{}; const L=Number(m.L)||0,H=Number(m.H)||0,N=Number(r.quantita)||0; return s+(L>0&&H>0?(L/100)*(H/100)*N:0); },0)*100)/100;
  const [peso,setPeso]=useState(String(autoPeso||""));
  const [volume,setVolume]=useState("");
  const [colli,setColli]=useState("1");
  const [mq,setMq]=useState(String(autoMq||""));
  const [selCorr,setSelCorr]=useState("");
  const [mezzoNostro,setMezzoNostro]=useState("");
  const corr=(corrieri||[]).find(c=>c.id===selCorr)||null;
  const res=corr? calcolaTrasporto(corr,{peso:Number(peso)||0,volume:Number(volume)||0,colli:Number(colli)||0,mq:Number(mq)||0}) : null;
  const costoCorriere=res?res.costo:0;
  const totale=Math.round((costoCorriere+(Number(mezzoNostro)||0))*100)/100;
  const inSt={width:"100%",padding:"7px 9px",border:"1px solid var(--line)",borderRadius:8,textAlign:"right"};
  return (
    <div className="overlay" style={{zIndex:60}}>
      <div className="modal" style={{maxWidth:620}} onClick={e=>e.stopPropagation()}>
        <header><h2>🚚 Calcolo spese di trasporto</h2>
          <button type="button" className="x" onClick={onClose}>×</button></header>
        <div className="body">
          {hasMix && <div className="banner info">Consegna mista: <b>{cnt.corriere}</b> corriere · <b>{cnt.ritiro_cliente}</b> ritiro cliente · <b>{cnt.mezzo_nostro}</b> mezzo nostro. Il corriere calcola <b>solo</b> gli articoli "Corriere".</div>}
          {(corrieri||[]).length===0 && <div className="banner err">Nessun listino corriere: creane uno in <b>🚚 Trasporti</b>.</div>}
          {mancanti>0 && <div className="banner err">⚠ {mancanti} articolo/i (corriere) senza peso impostato: il peso calcolato è parziale. Imposta il peso nella scheda articolo (📦 Catalogo).</div>}
          <div className="section">
            <h3>Corriere</h3>
            <div className="row">
              <div className="field"><label>Peso totale (kg)</label>
                <input type="number" step="0.01" value={peso} onChange={e=>setPeso(e.target.value)} style={inSt}/>
                <div className="muted" style={{fontSize:11,marginTop:3}}>dagli articoli corriere: {autoPeso} kg</div></div>
              <div className="field"><label>Volume (m³)</label>
                <input type="number" step="0.001" value={volume} onChange={e=>setVolume(e.target.value)} style={inSt}/></div>
            </div>
            <div className="row">
              <div className="field" style={{maxWidth:160}}><label>N° colli</label>
                <input type="number" step="1" value={colli} onChange={e=>setColli(e.target.value)} style={inSt}/></div>
              <div className="field" style={{maxWidth:160}}><label>Superficie (m²)</label>
                <input type="number" step="0.01" value={mq} onChange={e=>setMq(e.target.value)} style={inSt}/></div>
            </div>
            <div className="field"><label>Listino corriere</label>
              <select value={selCorr} onChange={e=>setSelCorr(e.target.value)}>
                <option value="">— scegli —</option>
                {(corrieri||[]).filter(c=>c.attivo!==false).map(c=><option key={c.id} value={c.id}>{c.nome}{c.zona?" · "+c.zona:""} ({(BASI_TRASPORTO.find(b=>b.v===c.base)||{}).l})</option>)}
              </select></div>
          </div>
          <div className="section">
            <h3>Mezzo nostro</h3>
            <div className="field" style={{maxWidth:240}}><label>Costo consegna col nostro mezzo €</label>
              <input type="number" step="0.01" value={mezzoNostro} onChange={e=>setMezzoNostro(e.target.value)} style={inSt}
                placeholder={cnt.mezzo_nostro>0?"":"(nessun articolo a mezzo nostro)"}/></div>
          </div>
          <div className="card" style={{padding:16,background:"#fafbfc"}}>
            <div className="kv" style={{gridTemplateColumns:"1fr auto"}}>
              <span className="k">Corriere{corr?" ("+corr.nome+")":""}</span><span style={{textAlign:"right"}}>{eur(costoCorriere)}</span>
              <span className="k">Mezzo nostro</span><span style={{textAlign:"right"}}>{eur(Number(mezzoNostro)||0)}</span>
              <span className="k" style={{fontWeight:800}}>TOTALE TRASPORTO</span><span style={{textAlign:"right",fontWeight:800,fontSize:16}}>{eur(totale)}</span>
            </div>
            {res && res.fuoriScaglione && <div className="banner err" style={{marginTop:10,marginBottom:0}}>⚠ Il valore è sotto il primo scaglione: verifica il listino.</div>}
          </div>
        </div>
        <footer>
          <button type="button" className="btn" onClick={onClose}>Annulla</button>
          <button type="button" className="btn primary" disabled={totale<=0} onClick={()=>onApply(totale)}>Applica al trasporto</button>
        </footer>
      </div>
    </div>
  );
}

/* ================================================================ INTERVENTO / RILAVORAZIONE (post-vendita) */
function InterventoEditor({intervento,commessa,profilo,perm,articoli,operatori,numeroSuggerito,onClose,onSalvato}){
  const nuovo=!intervento;
  const [f,setF]=useState(()=>({
    numero:intervento?.numero||numeroSuggerito,
    data:intervento?.data||new Date().toISOString().slice(0,10),
    cliente_nome:intervento?.cliente_nome||commessa?.cliente_nome||"",
    motivo:intervento?.motivo||"",
    stato:intervento?.stato||"aperto",
    note:intervento?.note||"",
  }));
  const [righe,setRighe]=useState(()=> (intervento?.interventi_righe||[]).slice().sort((a,b)=>(a.ordine||0)-(b.ordine||0)).map(r=>({...r})) );
  const [cercaArt,setCercaArt]=useState("");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const [msg,setMsg]=useState("");
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const setRiga=(i,k,v)=>setRighe(p=>p.map((r,j)=>j===i?{...r,[k]:v}:r));
  const delRiga=i=>setRighe(p=>p.filter((_,j)=>j!==i));
  const addRiga=tipo=>setRighe(p=>[...p,{tipo,descrizione:"",articolo_id:null,quantita:1,unita:tipo==="manodopera"?"ora":"",costo_unitario:0,responsabilita:"nostro",prezzo_addebito:0,scaricato:false,movimento_id:null}]);
  const risArt=useMemo(()=>{ const s=cercaArt.trim().toLowerCase(); if(!s) return [];
    return (articoli||[]).filter(a=>[a.nome_articolo,a.codice].join(" ").toLowerCase().includes(s)).slice(0,8);
  },[cercaArt,articoli]);
  const addMat=a=>{ setRighe(p=>[...p,{tipo:"materiale",descrizione:a.nome_articolo,articolo_id:a.id,quantita:1,unita:a.unita||"",
    costo_unitario:Number(a.costo)||0,responsabilita:"nostro",prezzo_addebito:0,scaricato:false,movimento_id:null}]); setCercaArt(""); };

  const costoTot=righe.reduce((s,r)=>s+(Number(r.quantita)||0)*(Number(r.costo_unitario)||0),0);
  const addebitoTot=righe.filter(r=>r.responsabilita==="cliente").reduce((s,r)=>s+(Number(r.quantita)||0)*(Number(r.prezzo_addebito)||0),0);
  const daScaricare=righe.filter(r=>r.tipo==="materiale" && r.articolo_id && !r.scaricato && (Number(r.quantita)||0)>0).length;
  const numIn={width:82,padding:"6px 7px",border:"1px solid var(--line)",borderRadius:7,textAlign:"right"};

  async function persisti(){
    const rec={commessa_id:commessa.id, numero:f.numero||"", data:f.data||null, cliente_nome:f.cliente_nome||"",
      motivo:f.motivo||"", stato:f.stato, note:f.note||"", aggiornato_il:new Date().toISOString()};
    let id=intervento?.id;
    if(nuovo){ rec.creato_da=profilo.id;
      const {data,error}=await sb.from("interventi").insert(rec).select("id").single(); if(error) throw error; id=data.id;
    }else{ const {error}=await sb.from("interventi").update(rec).eq("id",id); if(error) throw error;
      await sb.from("interventi_righe").delete().eq("intervento_id",id); }
    const rows=righe.map((r,idx)=>({intervento_id:id, ordine:idx, tipo:r.tipo, descrizione:r.descrizione||"",
      articolo_id:r.articolo_id||null, quantita:Number(r.quantita)||0, unita:r.unita||"",
      costo_unitario:Number(r.costo_unitario)||0, responsabilita:r.responsabilita||"nostro",
      prezzo_addebito:Number(r.prezzo_addebito)||0, scaricato:!!r.scaricato, movimento_id:r.movimento_id||null}));
    if(rows.length){ const {error}=await sb.from("interventi_righe").insert(rows); if(error) throw error; }
    return id;
  }
  async function salva(e){ e.preventDefault();
    setBusy(true); setErr("");
    try{ await persisti(); onSalvato(); }catch(ex){ setErr(ex.message); setBusy(false); }
  }
  async function scaricaMateriali(){
    if(nuovo || !intervento?.id){ setErr("Salva prima l'intervento, poi scarica i materiali."); return; }
    if(!daScaricare){ setErr("Nessun materiale da scaricare."); return; }
    if(!window.confirm("Scaricare "+daScaricare+" materiale/i dal magazzino?")) return;
    setBusy(true); setErr(""); setMsg("");
    try{
      const rif="Rilavorazione "+(f.numero||"");
      const nuove=righe.map(r=>({...r}));
      for(const r of nuove){
        if(r.tipo!=="materiale" || !r.articolo_id || r.scaricato || (Number(r.quantita)||0)<=0) continue;
        const {data,error}=await sb.from("movimenti_magazzino").insert({articolo_id:r.articolo_id, tipo:"scarico",
          quantita:Number(r.quantita)||0, causale:"Consumo per produzione", riferimento:rif, creato_da:profilo.id}).select("id").single();
        if(error) throw error; r.scaricato=true; r.movimento_id=data.id;
      }
      setRighe(nuove);
      await sb.from("interventi").update({aggiornato_il:new Date().toISOString()}).eq("id",intervento.id);
      await sb.from("interventi_righe").delete().eq("intervento_id",intervento.id);
      const rows=nuove.map((r,idx)=>({intervento_id:intervento.id, ordine:idx, tipo:r.tipo, descrizione:r.descrizione||"",
        articolo_id:r.articolo_id||null, quantita:Number(r.quantita)||0, unita:r.unita||"", costo_unitario:Number(r.costo_unitario)||0,
        responsabilita:r.responsabilita||"nostro", prezzo_addebito:Number(r.prezzo_addebito)||0, scaricato:!!r.scaricato, movimento_id:r.movimento_id||null}));
      if(rows.length){ const {error}=await sb.from("interventi_righe").insert(rows); if(error) throw error; }
      setMsg("Materiali scaricati dal magazzino ✓"); setBusy(false);
    }catch(ex){ setErr(ex.message); setBusy(false); }
  }
  async function elimina(){
    if(!intervento?.id) return;
    if(!window.confirm("Eliminare l'intervento "+(f.numero||"")+"? (I movimenti di magazzino già registrati restano.)")) return;
    setBusy(true); setErr("");
    try{ const {error}=await sb.from("interventi").delete().eq("id",intervento.id); if(error) throw error; onSalvato(); }
    catch(ex){ setErr(ex.message); setBusy(false); }
  }
  async function stampaAddebito(){
    let az={};
    try{ const {data}=await sb.from("impostazioni").select("azienda_nome,azienda_indirizzo,azienda_citta,azienda_piva,azienda_tel,azienda_email").eq("id",1).maybeSingle(); az=data||{}; }catch(e){}
    stampaHTML(htmlPreventivoAddebito(f, righe, az, commessa?.numero));
  }

  return (
    <div className="overlay" style={{zIndex:60}}>
      <form className="modal" style={{maxWidth:980}} onClick={e=>e.stopPropagation()} onSubmit={salva}>
        <header><h2>{nuovo?"Nuova rilavorazione":"Rilavorazione "+(f.numero||"")}</h2>
          <button type="button" className="x" onClick={onClose}>×</button></header>
        <div className="body">
          {err && <div className="banner err">{err}</div>}
          {msg && <div className="banner" style={{background:"#e6f4ee",color:"#1f9c68"}}>📦 {msg}</div>}
          <div className="banner info">Commessa di origine: <b>{commessa?.numero||"—"}</b> · Cliente: <b>{f.cliente_nome||"—"}</b></div>
          <div className="section">
            <h3>Testata</h3>
            <div className="row">
              <div className="field" style={{maxWidth:170}}><label>Numero</label>
                <input value={f.numero} onChange={e=>set("numero",e.target.value)}/></div>
              <div className="field" style={{maxWidth:170}}><label>Data</label>
                <input type="date" value={f.data} onChange={e=>set("data",e.target.value)}/></div>
              <div className="field" style={{maxWidth:160}}><label>Stato</label>
                <select value={f.stato} onChange={e=>set("stato",e.target.value)}>
                  <option value="aperto">Aperto</option><option value="chiuso">Chiuso</option>
                </select></div>
            </div>
            <div className="field"><label>Motivo del reso / rilavorazione</label>
              <input value={f.motivo} onChange={e=>set("motivo",e.target.value)} placeholder="es. pannello graffiato in trasporto, errore stampa…"/></div>
          </div>
          <div className="section">
            <h3>Voci di costo</h3>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
              <button type="button" className="btn small" onClick={()=>addRiga("manodopera")}>+ Manodopera</button>
              <button type="button" className="btn small" onClick={()=>addRiga("trasporto")}>+ Trasporto</button>
              <button type="button" className="btn small" onClick={()=>addRiga("altro")}>+ Altro</button>
              <button type="button" className="btn small primary" onClick={scaricaMateriali} disabled={busy||daScaricare===0}
                title={daScaricare?("Scarica "+daScaricare+" materiale/i"):"Niente da scaricare"}>📦 Scarica materiali{daScaricare?" ("+daScaricare+")":""}</button>
            </div>
            <div style={{overflow:"auto"}}>
              <table>
                <thead><tr>
                  <th>Tipo</th><th>Descrizione</th><th style={{width:70}}>Q.tà</th><th style={{width:70}}>Unità</th>
                  <th style={{width:100}}>Costo €</th><th style={{width:160}}>Responsabilità</th><th style={{width:110}}>Addebito €</th><th></th>
                </tr></thead>
                <tbody>
                  {righe.length===0 && <tr><td colSpan={8} className="muted" style={{padding:14}}>Nessuna voce. Aggiungi materiali (ricerca sotto), manodopera, trasporto o altro.</td></tr>}
                  {righe.map((r,i)=>{
                    const cliente=r.responsabilita==="cliente";
                    return (
                      <tr key={i}>
                        <td style={{textTransform:"capitalize",fontSize:12}}>{r.tipo}{r.tipo==="materiale"&&r.scaricato&&<span title="Scaricato" style={{color:"var(--ok)",marginLeft:4}}>✓</span>}</td>
                        <td style={{minWidth:180}}><input value={r.descrizione} onChange={e=>setRiga(i,"descrizione",e.target.value)} style={{width:"100%",padding:"6px",border:"1px solid var(--line)",borderRadius:7}}/></td>
                        <td><input type="number" step="any" value={r.quantita} onChange={e=>setRiga(i,"quantita",e.target.value)} style={numIn}/></td>
                        <td><input value={r.unita||""} onChange={e=>setRiga(i,"unita",e.target.value)} style={{width:60,padding:"6px",border:"1px solid var(--line)",borderRadius:7}}/></td>
                        <td><input type="number" step="any" value={r.costo_unitario} onChange={e=>setRiga(i,"costo_unitario",e.target.value)} style={numIn}/></td>
                        <td><select value={r.responsabilita} onChange={e=>setRiga(i,"responsabilita",e.target.value)}
                          style={{width:"100%",padding:"6px",borderRadius:7,border:"1px solid var(--line)",background:RESP_INT[r.responsabilita].bg,color:RESP_INT[r.responsabilita].c,fontWeight:600}}>
                          <option value="nostro">A nostro carico</option><option value="cliente">A carico cliente</option>
                        </select></td>
                        <td><input type="number" step="0.01" value={r.prezzo_addebito} disabled={!cliente} onChange={e=>setRiga(i,"prezzo_addebito",e.target.value)}
                          style={{...numIn,opacity:cliente?1:.4}}/></td>
                        <td><button type="button" className="btn small danger" onClick={()=>delRiga(i)}>✕</button></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <div style={{marginTop:10,position:"relative"}}>
              <input value={cercaArt} onChange={e=>setCercaArt(e.target.value)} placeholder="+ Materiale: cerca articolo dal catalogo…"
                style={{width:"100%",maxWidth:440,padding:"8px 10px",border:"1px solid var(--line)",borderRadius:8}}/>
              {risArt.length>0 &&
                <div className="card" style={{maxWidth:440,maxHeight:200,overflow:"auto",position:"absolute",zIndex:5,background:"#fff"}}>
                  {risArt.map(a=><div key={a.id} onClick={()=>addMat(a)} style={{padding:"8px 12px",borderBottom:"1px solid var(--line)",cursor:"pointer"}}>
                    <b>{a.nome_articolo}</b> <span className="muted">{a.codice}</span><span className="muted" style={{float:"right"}}>costo {eur(a.costo||0)}</span></div>)}
                </div>}
            </div>
          </div>
          <div className="card" style={{padding:16,background:"#fafbfc"}}>
            <div className="kv" style={{gridTemplateColumns:"1fr auto"}}>
              <span className="k">Costo rilavorazione (a noi)</span><span style={{textAlign:"right",fontWeight:700,color:"var(--danger)"}}>{eur(costoTot)}</span>
              <span className="k">Da addebitare al cliente</span><span style={{textAlign:"right",fontWeight:700,color:"var(--ok)"}}>{eur(addebitoTot)}</span>
              <span className="k" style={{fontWeight:800}}>Saldo a nostro carico</span><span style={{textAlign:"right",fontWeight:800,fontSize:15}}>{eur(costoTot-addebitoTot)}</span>
            </div>
          </div>
          <div className="section" style={{marginTop:16}}><h3>Note</h3>
            <div className="field"><textarea rows={2} value={f.note} onChange={e=>set("note",e.target.value)}/></div>
          </div>
        </div>
        <footer>
          <button type="button" className="btn" onClick={stampaAddebito} disabled={addebitoTot<=0} title="Preventivo di addebito (voci a carico cliente)">🖨️ Preventivo addebito</button>
          {!nuovo && perm.elimina && <button type="button" className="btn danger" onClick={elimina} disabled={busy}>Elimina</button>}
          <button type="button" className="btn" style={{marginLeft:"auto"}} onClick={onClose}>Annulla</button>
          <button className="btn primary" disabled={busy}>{busy?<span className="spin"/>:"Salva rilavorazione"}</button>
        </footer>
      </form>
    </div>
  );
}

/* ================================================================ CRM rete agenti */
// helper datetime-local <-> ISO
function toLocalDT(iso){ if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return "";
  const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes()); }
function fromLocalDT(v){ if(!v) return null; const d=new Date(v); return isNaN(d)?null:d.toISOString(); }

/* --- Form Trattativa --- */
function TrattativaForm({profilo,perm,clienti,trattativa,clienteFisso,onClose,onSalvato}){
  const nuovo=!trattativa;
  const [f,setF]=useState(()=>({
    cliente_id:trattativa?.cliente_id||clienteFisso||"",
    titolo:trattativa?.titolo||"", descrizione:trattativa?.descrizione||"",
    valore_stimato:trattativa?.valore_stimato ?? "", probabilita:trattativa?.probabilita ?? 50,
    stato:trattativa?.stato||"nuovo", data_prevista:trattativa?.data_prevista||"",
    motivo_perdita:trattativa?.motivo_perdita||"",
  }));
  const [busy,setBusy]=useState(false),[err,setErr]=useState(""),[msg,setMsg]=useState("");
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const isAgente=profilo&&profilo.ruolo==="agente";
  async function salva(e){ e&&e.preventDefault();
    if(!String(f.titolo).trim()){ setErr("Metti un titolo alla trattativa."); return; }
    setBusy(true); setErr("");
    const cli=(clienti||[]).find(c=>c.id===f.cliente_id);
    const agente_id = isAgente ? (profilo.agente_id||null) : (cli?cli.agente_id:(trattativa?trattativa.agente_id:null));
    const rec={ cliente_id:f.cliente_id||null, agente_id, titolo:f.titolo, descrizione:f.descrizione||"",
      valore_stimato:Number(f.valore_stimato)||0, probabilita:Number(f.probabilita)||0, stato:f.stato,
      data_prevista:f.data_prevista||null, motivo_perdita:f.stato==="persa"?(f.motivo_perdita||""):null };
    try{
      if(nuovo){ rec.creato_da=profilo.id; const {error}=await sb.from("crm_trattative").insert(rec); if(error) throw error; }
      else { const {error}=await sb.from("crm_trattative").update(rec).eq("id",trattativa.id); if(error) throw error; }
      onSalvato();
    }catch(ex){ setErr(ex.message); setBusy(false); }
  }
  async function generaPreventivo(){
    if(!trattativa?.id){ setErr("Salva prima la trattativa."); return; }
    if(!f.cliente_id){ setErr("Serve un cliente per il preventivo."); return; }
    setBusy(true); setErr(""); setMsg("");
    try{
      const cli=(clienti||[]).find(c=>c.id===f.cliente_id);
      const {data:prevs}=await sb.from("preventivi").select("numero");
      const numero=prossimoNumero(prevs||[]);
      let imp={}; try{ const {data}=await sb.from("impostazioni").select("iva_pct,spese_generali_pct,margine_minimo_pct").eq("id",1).maybeSingle(); imp=data||{}; }catch(e){}
      const rec={numero, cliente_id:f.cliente_id, cliente_nome:cli?cli.ragione_sociale:"",
        data:new Date().toISOString().slice(0,10), validita_giorni:30, stato:"bozza",
        descrizione_breve:"Da trattativa: "+f.titolo, riferimento:f.titolo||"",
        spese_generali_pct:Number(imp.spese_generali_pct)||0, iva_pct:imp.iva_pct!=null?Number(imp.iva_pct):22,
        margine_minimo_pct:Number(imp.margine_minimo_pct)||0, creato_da:profilo.id, aggiornato_il:new Date().toISOString()};
      const {data:np,error}=await sb.from("preventivi").insert(rec).select("id").single(); if(error) throw error;
      await sb.from("preventivi_righe").insert({preventivo_id:np.id, ordine:0, tipo:"altro", descrizione:f.titolo,
        quantita:1, unita:"", costo_unitario:0, prezzo_unitario:Number(f.valore_stimato)||0, sconto_pct:0});
      await sb.from("crm_trattative").update({preventivo_id:np.id}).eq("id",trattativa.id);
      setMsg("Preventivo "+numero+" creato (bozza) e collegato. Aprilo in 🧾 Preventivi per completarlo.");
      setBusy(false);
    }catch(ex){ setErr(ex.message); setBusy(false); }
  }
  const eurT=n=>Number(n||0).toLocaleString("it-IT",{style:"currency",currency:"EUR"});
  const cliSel=(clienti||[]).find(c=>c.id===f.cliente_id);
  const cliPctDef=cliSel&&cliSel.provvigione_pct!=null?Number(cliSel.provvigione_pct):null;
  // provvigione in SOLA LETTURA: la decide il commerciale nel preventivo (v86), qui si mostra soltanto.
  const provvView=trattativa?calcProvvTratt(trattativa,{cliPct:cliPctDef,agPct:null}):0;
  const commImpostata = !!(trattativa && (trattativa.preventivo_id || trattativa.tipo_provvigione==="margine" || trattativa.provvigione_pct!=null));
  const tipoCommLbl = trattativa&&trattativa.tipo_provvigione==="margine" ? "a margine (su prezzo netto)" : "a percentuale sul valore";
  return (
    <div className="overlay"><form className="modal" style={{maxWidth:560}} onClick={e=>e.stopPropagation()} onSubmit={salva}>
      <header><h2>{nuovo?"Nuova trattativa":"Trattativa"}</h2><button type="button" className="x" onClick={onClose}>×</button></header>
      <div className="body">
        {err && <div className="banner err">{err}</div>}
        {msg && <div className="banner" style={{background:"#e6f4ee",color:"#1f9c68"}}>✅ {msg}</div>}
        <div className="field"><label>Cliente</label>
          <select value={f.cliente_id} onChange={e=>set("cliente_id",e.target.value)} disabled={!!clienteFisso}>
            <option value="">— nessuno —</option>
            {(clienti||[]).map(c=><option key={c.id} value={c.id}>{c.ragione_sociale}</option>)}
          </select></div>
        <div className="field"><label>Titolo *</label>
          <input value={f.titolo} onChange={e=>set("titolo",e.target.value)} required placeholder="es. Fornitura insegne 2027"/></div>
        <div className="field"><label>Descrizione</label>
          <textarea rows={2} value={f.descrizione} onChange={e=>set("descrizione",e.target.value)}/></div>
        <div className="row">
          <div className="field" style={{maxWidth:170}}><label>Valore stimato €</label>
            <input type="number" step="0.01" value={f.valore_stimato} onChange={e=>set("valore_stimato",e.target.value)}/></div>
          <div className="field" style={{maxWidth:150}}><label>Probabilità %</label>
            <input type="number" step="5" min="0" max="100" value={f.probabilita} onChange={e=>set("probabilita",e.target.value)}/></div>
          <div className="field" style={{maxWidth:170}}><label>Data prevista</label>
            <input type="date" value={f.data_prevista} onChange={e=>set("data_prevista",e.target.value)}/></div>
        </div>
        <div className="field" style={{maxWidth:220}}><label>Stato</label>
          <select value={f.stato} onChange={e=>set("stato",e.target.value)}>
            {ORDINE_STATI_TRATT.map(s=><option key={s} value={s}>{STATI_TRATTATIVA[s].l}</option>)}
          </select></div>
        {f.stato==="persa" && <div className="field"><label>Motivo perdita</label>
          <input value={f.motivo_perdita} onChange={e=>set("motivo_perdita",e.target.value)} placeholder="es. prezzo, tempi, concorrente…"/></div>}

        {!nuovo && <div style={{marginTop:6,paddingTop:10,borderTop:"1px solid var(--line)"}}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:4}}>💶 Provvigione agente <span className="muted" style={{fontWeight:400,fontSize:11}}>· sola lettura</span></div>
          {commImpostata
            ? <div className="muted" style={{fontSize:12.5}}>Provvigione: <b style={{color:"var(--ok)"}}>{eurT(provvView)}</b> <span style={{opacity:.85}}>({tipoCommLbl})</span></div>
            : <div className="muted" style={{fontSize:12.5}}>Non ancora definita. La imposta il <b>commerciale</b> nel <b>preventivo</b> collegato.</div>}
        </div>}

        {!nuovo && trattativa.preventivo_id && <div className="banner info" style={{fontSize:12}}>🧾 Preventivo già collegato a questa trattativa.</div>}
      </div>
      <footer>
        {!nuovo && perm && perm.economici && !trattativa.preventivo_id &&
          <button type="button" className="btn" onClick={generaPreventivo} disabled={busy} title="Crea un preventivo bozza dal valore stimato">🧾 Genera preventivo</button>}
        <button type="button" className="btn" style={{marginLeft:"auto"}} onClick={onClose}>Annulla</button>
        <button className="btn primary" disabled={busy}>{busy?<span className="spin"/>:"Salva"}</button>
      </footer>
    </form></div>
  );
}

/* --- Form Attività / follow-up --- */
function AttivitaForm({profilo,clienti,attivita,clienteFisso,trattativaFissa,onClose,onSalvato}){
  const nuovo=!attivita;
  const [f,setF]=useState(()=>({
    tipo:attivita?.tipo||"chiamata", cliente_id:attivita?.cliente_id||clienteFisso||"",
    data_ora:toLocalDT(attivita?.data_ora)||toLocalDT(new Date().toISOString()),
    esito:attivita?.esito||"", note:attivita?.note||"",
    completata:attivita?attivita.completata:true,
    promemoria_il:toLocalDT(attivita?.promemoria_il),
  }));
  const [busy,setBusy]=useState(false),[err,setErr]=useState("");
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const isAgente=profilo&&profilo.ruolo==="agente";
  async function salva(e){ e&&e.preventDefault(); setBusy(true); setErr("");
    const cli=(clienti||[]).find(c=>c.id===f.cliente_id);
    const agente_id=isAgente?(profilo.agente_id||null):(cli?cli.agente_id:(attivita?attivita.agente_id:null));
    const rec={ tipo:f.tipo, cliente_id:f.cliente_id||null, trattativa_id:(attivita?attivita.trattativa_id:trattativaFissa)||null,
      agente_id, data_ora:fromLocalDT(f.data_ora)||new Date().toISOString(), esito:f.esito||"", note:f.note||"",
      completata:!!f.completata, promemoria_il:fromLocalDT(f.promemoria_il) };
    try{
      if(nuovo){ rec.creato_da=profilo.id; const {error}=await sb.from("crm_attivita").insert(rec); if(error) throw error; }
      else { const {error}=await sb.from("crm_attivita").update(rec).eq("id",attivita.id); if(error) throw error; }
      onSalvato();
    }catch(ex){ setErr(ex.message); setBusy(false); }
  }
  return (
    <div className="overlay"><form className="modal" style={{maxWidth:520}} onClick={e=>e.stopPropagation()} onSubmit={salva}>
      <header><h2>{nuovo?"Registra attività":"Attività"}</h2><button type="button" className="x" onClick={onClose}>×</button></header>
      <div className="body">
        {err && <div className="banner err">{err}</div>}
        <div className="row">
          <div className="field" style={{maxWidth:200}}><label>Tipo</label>
            <select value={f.tipo} onChange={e=>set("tipo",e.target.value)}>
              {Object.keys(TIPI_ATTIVITA).map(t=><option key={t} value={t}>{TIPI_ATTIVITA[t].ico} {TIPI_ATTIVITA[t].l}</option>)}
            </select></div>
          <div className="field"><label>Quando</label>
            <input type="datetime-local" value={f.data_ora} onChange={e=>set("data_ora",e.target.value)}/></div>
        </div>
        {!clienteFisso && <div className="field"><label>Cliente</label>
          <select value={f.cliente_id} onChange={e=>set("cliente_id",e.target.value)}>
            <option value="">— nessuno —</option>
            {(clienti||[]).map(c=><option key={c.id} value={c.id}>{c.ragione_sociale}</option>)}
          </select></div>}
        <div className="field"><label>Esito</label>
          <input value={f.esito} onChange={e=>set("esito",e.target.value)} placeholder="es. interessato, richiamare, ordine confermato…"/></div>
        <div className="field"><label>Note</label>
          <textarea rows={2} value={f.note} onChange={e=>set("note",e.target.value)}/></div>
        <label style={{display:"flex",alignItems:"center",gap:8,margin:"6px 0"}}>
          <input type="checkbox" checked={f.completata} onChange={e=>set("completata",e.target.checked)} style={{width:"auto"}}/> Già svolta (se tolgi la spunta = da fare)</label>
        <div className="field" style={{maxWidth:250}}><label>Promemoria (Agenda)</label>
          <input type="datetime-local" value={f.promemoria_il} onChange={e=>set("promemoria_il",e.target.value)}/>
          <div className="muted" style={{fontSize:11,marginTop:3}}>Se lo imposti e l'attività è "da fare", compare in 📅 Agenda.</div></div>
      </div>
      <footer>
        <button type="button" className="btn" style={{marginLeft:"auto"}} onClick={onClose}>Annulla</button>
        <button className="btn primary" disabled={busy}>{busy?<span className="spin"/>:"Salva"}</button>
      </footer>
    </form></div>
  );
}

/* --- Modulo CRM / Trattative (pipeline) --- */
function ModuloCRM({profilo,perm}){
  const [tratt,setTratt]=useState(null);
  const [clienti,setClienti]=useState([]);
  const [agenti,setAgenti]=useState([]);
  const [editor,setEditor]=useState(null);
  const [filtroAg,setFiltroAg]=useState("");
  const [myPct,setMyPct]=useState(null);   // % provvigione standard dell'agente loggato
  const [err,setErr]=useState("");
  const isAdminComm=perm.economici; // admin/commerciale
  const isAgente=profilo.ruolo==="agente";
  const carica=useCallback(async()=>{
    const [t,c,a]=await Promise.all([
      sb.from("crm_trattative").select("*, clienti(ragione_sociale)").order("aggiornato_il",{ascending:false}),
      sb.from("clienti").select("id,ragione_sociale,agente_id,provvigione_pct").order("ragione_sociale"),
      isAdminComm? sb.from("agenti").select("id,nome").order("nome") : Promise.resolve({data:[]}),
    ]);
    if(t.error){ setErr(t.error.message); return; }
    setTratt(t.data||[]); setClienti(c.data||[]); setAgenti(a.data||[]);
    if(isAgente){ const {data:p}=await sb.rpc("my_provvigione_pct"); setMyPct(p==null?null:Number(p)); }
  },[isAdminComm,isAgente]);
  useEffect(()=>{ carica(); },[carica]);
  const eur=n=>Number(n||0).toLocaleString("it-IT",{style:"currency",currency:"EUR"});
  const filtrate=(tratt||[]).filter(t=>!filtroAg || t.agente_id===filtroAg);
  const APERTI=["nuovo","contatto","trattativa","offerta"];
  const cliPct=useMemo(()=>{ const m={}; (clienti||[]).forEach(c=>m[c.id]=c.provvigione_pct); return m; },[clienti]);
  const kpiCrm=(()=>{ let aperte=0,valAperte=0,vinte=0,valVinte=0,perse=0,prov=0;
    filtrate.forEach(t=>{ const v=Number(t.valore_stimato)||0;
      if(t.stato==="vinta"){ vinte++; valVinte+=v;
        prov+=calcProvvTratt(t,{cliPct:cliPct[t.cliente_id], agPct:myPct});
      } else if(t.stato==="persa"){perse++;}
      else if(APERTI.indexOf(t.stato)>=0){aperte++;valAperte+=v;} });
    const chiuse=vinte+perse; return {aperte,valAperte,vinte,valVinte,tasso:chiuse?Math.round(vinte/chiuse*100):null,prov}; })();
  return (
    <>
      <div className="topbar"><h1>🎯 CRM / Trattative</h1>
        {perm.scrivi && <button className="btn primary" onClick={()=>setEditor({})}>+ Nuova trattativa</button>}
      </div>
      <div className="content">
        {err && <div className="banner err">{err}</div>}
        {tratt!==null && <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:12}}>
          {[["Trattative aperte",kpiCrm.aperte,null],["Valore in pipeline",eur(kpiCrm.valAperte),null],
            ["Vinte",kpiCrm.vinte,"var(--ok)"],["Valore vinto",eur(kpiCrm.valVinte),"var(--ok)"],
            ["Tasso chiusura",kpiCrm.tasso==null?"—":kpiCrm.tasso+"%",null],
            ...(isAgente?[["Provvigione maturata",eur(kpiCrm.prov),"var(--ok)"]]:[])].map((k,i)=>
            <div key={i} className="card" style={{padding:"10px 14px",flex:1,minWidth:130}}>
              <div className="muted" style={{fontSize:11}}>{k[0]}</div>
              <div style={{fontSize:18,fontWeight:800,marginTop:2,color:k[2]||"inherit"}}>{k[1]}</div>
            </div>)}
        </div>}
        {isAgente && myPct==null && <div className="muted" style={{fontSize:11,marginTop:-6,marginBottom:12}}>La provvigione usa la % specifica del cliente dove presente; per gli altri clienti manca la tua % standard (chiedi all'amministratore di impostarla nella tua scheda Agente).</div>}
        {isAdminComm && <div className="toolbar">
          <select className="btn" value={filtroAg} onChange={e=>setFiltroAg(e.target.value)} style={{maxWidth:240}}>
            <option value="">Tutti gli agenti</option>
            {agenti.map(a=><option key={a.id} value={a.id}>{a.nome}</option>)}
          </select>
          <span className="muted">{filtrate.length} trattative</span>
        </div>}
        {tratt===null? <div className="empty">Caricamento…</div> :
          <div style={{display:"flex",gap:10,overflowX:"auto",paddingBottom:8}}>
            {ORDINE_STATI_TRATT.map(st=>{ const col=filtrate.filter(t=>t.stato===st);
              const tot=col.reduce((s,t)=>s+(Number(t.valore_stimato)||0),0);
              const S=STATI_TRATTATIVA[st];
              return <div key={st} style={{minWidth:210,flex:"0 0 210px"}}>
                <div style={{background:S.bg,color:S.c,borderRadius:8,padding:"6px 10px",fontWeight:700,fontSize:13,marginBottom:8}}>
                  {S.l} <span style={{opacity:.8,fontWeight:400}}>({col.length})</span>
                  <div style={{fontSize:11,fontWeight:400,opacity:.85}}>{eur(tot)}</div></div>
                {col.map(t=>
                  <div key={t.id} className="card" style={{padding:10,marginBottom:8,cursor:"pointer"}} onClick={()=>setEditor(t)}>
                    <div style={{fontWeight:600,fontSize:13}}>{t.titolo}</div>
                    <div className="muted" style={{fontSize:12}}>{(t.clienti&&t.clienti.ragione_sociale)||"—"}</div>
                    <div style={{display:"flex",justifyContent:"space-between",marginTop:4,fontSize:12}}>
                      <b>{eur(t.valore_stimato)}</b><span className="muted">{t.probabilita||0}%</span></div>
                    {t.data_prevista && <div className="muted" style={{fontSize:11,marginTop:2}}>📅 {new Date(t.data_prevista).toLocaleDateString("it-IT")}</div>}
                  </div>)}
                {col.length===0 && <div className="muted" style={{fontSize:12,textAlign:"center",padding:"6px 0"}}>—</div>}
              </div>;})}
          </div>}
      </div>
      {editor && <TrattativaForm profilo={profilo} perm={perm} clienti={clienti} trattativa={editor.id?editor:null}
        onClose={()=>setEditor(null)} onSalvato={()=>{setEditor(null);carica();}}/>}
    </>
  );
}

/* --- Modulo Agenda & Follow-up --- */
function ModuloAgenda({profilo,perm}){
  const [att,setAtt]=useState(null);
  const [clienti,setClienti]=useState([]);
  const [editor,setEditor]=useState(null);
  const [err,setErr]=useState("");
  const carica=useCallback(async()=>{
    const [a,c]=await Promise.all([
      sb.from("crm_attivita").select("*, clienti(ragione_sociale)").eq("completata",false).not("promemoria_il","is",null).order("promemoria_il"),
      sb.from("clienti").select("id,ragione_sociale,agente_id").order("ragione_sociale"),
    ]);
    if(a.error){ setErr(a.error.message); return; }
    setAtt(a.data||[]); setClienti(c.data||[]);
  },[]);
  useEffect(()=>{ carica(); },[carica]);
  async function completa(id){ await sb.from("crm_attivita").update({completata:true}).eq("id",id); carica(); }
  const oggi=new Date(); const inizioOggi=new Date(oggi.getFullYear(),oggi.getMonth(),oggi.getDate());
  const fine7=new Date(inizioOggi.getTime()+7*86400000);
  const grp={scaduti:[],oggi:[],sett:[],oltre:[]};
  (att||[]).forEach(a=>{ const d=new Date(a.promemoria_il);
    if(d<inizioOggi) grp.scaduti.push(a);
    else if(d<new Date(inizioOggi.getTime()+86400000)) grp.oggi.push(a);
    else if(d<fine7) grp.sett.push(a);
    else grp.oltre.push(a); });
  const sezione=(titolo,lista,col)=> lista.length>0 && <div className="section">
    <div className="po-section" style={{color:col}}>{titolo} <span className="count">({lista.length})</span></div>
    {lista.map(a=>{ const T=TIPI_ATTIVITA[a.tipo]||TIPI_ATTIVITA.nota;
      return <div key={a.id} className="card" style={{padding:"10px 12px",marginBottom:8,display:"flex",justifyContent:"space-between",gap:10,alignItems:"center"}}>
        <div><div style={{fontWeight:600}}>{T.ico} {(a.clienti&&a.clienti.ragione_sociale)||"—"} <span className="muted" style={{fontWeight:400,fontSize:12}}>· {T.l}</span></div>
          {(a.note||a.esito) && <div className="muted" style={{fontSize:12}}>{a.esito||a.note}</div>}
          <div className="muted" style={{fontSize:11,marginTop:2}}>🕐 {new Date(a.promemoria_il).toLocaleString("it-IT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</div></div>
        <button className="btn small primary" onClick={()=>completa(a.id)}>✓ Fatto</button>
      </div>;})}
  </div>;
  return (
    <>
      <div className="topbar"><h1>📅 Agenda & Follow-up</h1>
        {perm.scrivi && <button className="btn primary" onClick={()=>setEditor({})}>+ Nuovo promemoria</button>}
      </div>
      <div className="content">
        {err && <div className="banner err">{err}</div>}
        {att===null? <div className="empty">Caricamento…</div>
          : (att.length===0? <div className="card empty">Nessun follow-up in programma. Aggiungine uno o imposta un promemoria da un'attività cliente.</div>
            : <>
                {sezione("⛔ Scaduti",grp.scaduti,"#c0392b")}
                {sezione("📌 Oggi",grp.oggi,"#b26a00")}
                {sezione("🗓️ Prossimi 7 giorni",grp.sett,"#1e46c4")}
                {sezione("Più avanti",grp.oltre,"#697386")}
              </>)}
      </div>
      {editor && <AttivitaForm profilo={profilo} clienti={clienti} attivita={editor.id?editor:null}
        onClose={()=>setEditor(null)} onSalvato={()=>{setEditor(null);carica();}}/>}
    </>
  );
}

const NC_REPARTI=["Amministrativo","Commerciale","Forniture","Logistica","Operativo","Gestionale"];
const NC_AMBITI=["Qualità","Ambiente"];
const NC_GRAVITA=[{v:1,l:"1 (minimo)"},{v:2,l:"2 (basso)"},{v:3,l:"3 (medio)"},{v:4,l:"4 (alto)"},{v:5,l:"5 (molto alto)"}];
const NC_ESITO={positivo:{l:"Positivo",bg:"#e7f6ec",c:"#127a3e"},negativo:{l:"Negativo",bg:"#fdecec",c:"#c0392b"}};

// Rapporto di non conformità stampabile (MOD QA-10.2)
function htmlRapportoNC(nc, az){
  const box=(on)=> on ? "☒" : "☐";
  const fmt=d=> d? new Date(d).toLocaleDateString("it-IT"):"—";
  const rep=NC_REPARTI.map(r=>`<span style="margin-right:14px;white-space:nowrap">${box((nc.reparti||[]).includes(r))} ${r}</span>`).join("");
  const grav=NC_GRAVITA.map(g=>`<span style="margin-right:14px;white-space:nowrap">${box(Number(nc.gravita)===g.v)} ${g.l}</span>`).join("");
  const amb=NC_AMBITI.map(a=>`<span style="margin-right:14px;white-space:nowrap">${box((nc.ambiti||[]).includes(a))} ${a}</span>`).join("");
  const esito=`<span style="margin-right:14px">${box(nc.esito==="positivo")} Positivo</span><span>${box(nc.esito==="negativo")} Negativo</span>`;
  const riga=(t,v)=>`<tr><td class="k">${t}</td><td>${v||"—"}</td></tr>`;
  return `<!doctype html><html><head><meta charset="utf-8"><title>Rapporto NC ${nc.numero}/${nc.anno}</title>
  <style>body{font-family:Arial,sans-serif;color:#111;margin:26px;font-size:13px}
  h1{font-size:18px;margin:0 0 2px} .sub{color:#666;font-size:12px;margin-bottom:14px}
  table{width:100%;border-collapse:collapse;margin-top:8px} td{border:1px solid #bbb;padding:7px 9px;vertical-align:top}
  td.k{width:210px;background:#f3f5f7;font-weight:bold} .box{margin:4px 0} .firme{margin-top:26px;display:flex;gap:40px}
  .firme div{flex:1;border-top:1px solid #999;padding-top:6px;font-size:12px;color:#555}</style></head><body>
  <h1>Rapporto di Non Conformità</h1>
  <div class="sub">MOD QA-10.2 · ${az&&az.azienda_nome?az.azienda_nome:"Creatio"} · N° <b>${nc.numero}/${nc.anno}</b></div>
  <table>
    ${riga("Data rilevamento", fmt(nc.data_rilevamento))}
    <tr><td class="k">Reparto/i</td><td class="box">${rep}</td></tr>
    <tr><td class="k">Livello di gravità</td><td class="box">${grav}</td></tr>
    <tr><td class="k">Ambito/i</td><td class="box">${amb}</td></tr>
    ${riga("Descrizione della non conformità", (nc.descrizione||"").replace(/</g,"&lt;"))}
    ${riga("Azione correttiva pianificata", (nc.azione_correttiva||"").replace(/</g,"&lt;"))}
    ${riga("Responsabile azione correttiva", nc.responsabile)}
    ${riga("Data limite", fmt(nc.data_limite))}
    <tr><td class="k">Esito azione correttiva</td><td class="box">${esito}</td></tr>
    ${riga("Note", (nc.note||"").replace(/</g,"&lt;"))}
  </table>
  <div class="firme"><div>Firma del responsabile</div><div>Firma per accettazione</div></div>
  </body></html>`;
}

function QualitaNonConformita({profilo,perm}){
  const [lista,setLista]=useState(null);
  const [err,setErr]=useState("");
  const [editor,setEditor]=useState(null);
  const [annoF,setAnnoF]=useState("");
  const carica=useCallback(async()=>{
    setErr("");
    const {data,error}=await sb.from("non_conformita").select("*").order("anno",{ascending:false}).order("numero",{ascending:false});
    if(error){ setErr(error.message); return; }
    setLista(data||[]);
  },[]);
  useEffect(()=>{ carica(); },[carica]);
  const anni=useMemo(()=>[...new Set((lista||[]).map(x=>x.anno))].sort((a,b)=>b-a),[lista]);
  const filtrata=(lista||[]).filter(x=>!annoF || String(x.anno)===String(annoF));

  function esportaRegistro(){
    const rows=(lista||[]);
    if(!rows.length){ alert("Nessuna non conformità registrata."); return; }
    const head=["Numero","Anno",...NC_REPARTI,...NC_AMBITI,"Gravità","Esito azione correttiva","Controllo compilazione","Note"];
    const aoa1=[["REG QA-10.2.1 Registro delle non conformità"],head];
    rows.slice().sort((a,b)=>(a.anno-b.anno)||(a.numero-b.numero)).forEach(nc=>{
      const compl=(nc.reparti&&nc.reparti.length && nc.gravita && nc.esito)?"Ok":"";
      aoa1.push([nc.numero,nc.anno,
        ...NC_REPARTI.map(r=>(nc.reparti||[]).includes(r)?"X":""),
        ...NC_AMBITI.map(a=>(nc.ambiti||[]).includes(a)?"X":""),
        nc.gravita||"", nc.esito?(NC_ESITO[nc.esito]?NC_ESITO[nc.esito].l:nc.esito):"", compl, nc.note||""]);
    });
    // Calcoli
    const perRep=NC_REPARTI.map(r=>[r,rows.filter(x=>(x.reparti||[]).includes(r)).length]);
    const perGrav=[1,2,3,4,5].map(g=>[g,rows.filter(x=>Number(x.gravita)===g).length]);
    const perAmb=NC_AMBITI.map(a=>[a,rows.filter(x=>(x.ambiti||[]).includes(a)).length]);
    const anniTut=[...new Set(rows.map(x=>x.anno))].sort();
    const aoa2=[["Reparto NC","Quantità"],...perRep,["Tutte",rows.length],[],
      ["Gravità NC","Quantità"],...perGrav,[],
      ["Ambito NC","Quantità"],...perAmb,[],
      ["Anno","N° NC Totali","N° NC Qualità","N° NC Ambiente"],
      ...anniTut.map(an=>{ const r=rows.filter(x=>x.anno===an);
        return [an, r.length, r.filter(x=>(x.ambiti||[]).includes("Qualità")).length, r.filter(x=>(x.ambiti||[]).includes("Ambiente")).length]; })];
    try{
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa1), "Registro non conformità");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa2), "Calcoli");
      XLSX.writeFile(wb, "Registro_non_conformita_"+new Date().toISOString().slice(0,10)+".xlsx");
    }catch(e){ alert("Export non riuscito: "+(e&&e.message||e)); }
  }

  return (
    <>
      {err && <div className="banner err">{err}</div>}
      <div className="toolbar">
        <select className="btn" value={annoF} onChange={e=>setAnnoF(e.target.value)} style={{maxWidth:150}}>
          <option value="">Tutti gli anni</option>
          {anni.map(a=><option key={a} value={a}>{a}</option>)}
        </select>
        <span className="muted">{filtrata.length} non conformità</span>
        <button className="btn" style={{marginLeft:"auto"}} onClick={esportaRegistro} disabled={!(lista&&lista.length)}>⬇️ Registro Excel (ISO)</button>
        {perm.scrivi && <button className="btn primary" onClick={()=>setEditor({})}>+ Nuova non conformità</button>}
      </div>
      {lista===null ? <div className="empty">Caricamento…</div>
        : filtrata.length===0 ? <div className="card empty">Nessuna non conformità. Aggiungine una con "+ Nuova non conformità".</div>
        : <div className="card" style={{overflow:"auto"}}>
            <table>
              <thead><tr><th>N°</th><th>Data</th><th>Reparto/i</th><th>Ambito</th><th style={{textAlign:"center"}}>Gravità</th><th>Esito</th><th>Descrizione</th></tr></thead>
              <tbody>
                {filtrata.map(nc=>{ const es=NC_ESITO[nc.esito];
                  return <tr key={nc.id} onClick={()=>setEditor(nc)} style={{cursor:"pointer"}}>
                    <td className="rs">{nc.numero}/{nc.anno}</td>
                    <td className="muted">{nc.data_rilevamento?new Date(nc.data_rilevamento).toLocaleDateString("it-IT"):"—"}</td>
                    <td>{(nc.reparti||[]).map(r=><span key={r} className="tag" style={{marginRight:3}}>{r}</span>)}</td>
                    <td className="muted">{(nc.ambiti||[]).join(", ")||"—"}</td>
                    <td style={{textAlign:"center",fontWeight:700}}>{nc.gravita||"—"}</td>
                    <td>{es?<span className="tag" style={{background:es.bg,color:es.c}}>{es.l}</span>:<span className="muted">in corso</span>}</td>
                    <td className="muted" style={{maxWidth:280,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{nc.descrizione||"—"}</td>
                  </tr>; })}
              </tbody>
            </table>
          </div>}
      {editor && <NCForm nc={editor.id?editor:null} lista={lista||[]} profilo={profilo} perm={perm}
        onClose={()=>setEditor(null)} onSalvato={()=>{setEditor(null);carica();}}/>}
    </>
  );
}

function NCForm({nc,lista,profilo,perm,onClose,onSalvato}){
  const nuovo=!nc;
  const [f,setF]=useState(()=>({
    numero:nc?.numero||0, anno:nc?.anno||new Date().getFullYear(),
    data_rilevamento:nc?.data_rilevamento||new Date().toISOString().slice(0,10),
    reparti:nc?.reparti||[], ambiti:nc?.ambiti||[], gravita:nc?.gravita||3,

const CQ_ESITO={"Positivo":{bg:"#e7f6ec",c:"#127a3e"},"Parzialmente positivo":{bg:"#fff4e5",c:"#b26a00"},"Negativo":{bg:"#fdecec",c:"#c0392b"}};
function QualitaControlli({profilo,perm}){
  const [lista,setLista]=useState(null);

  const [editor,setEditor]=useState(null);
  const [annoF,setAnnoF]=useState("");
  const carica=useCallback(async()=>{ setErr("");
    const {data,error}=await sb.from("controlli_qualita").select("*").order("data",{ascending:false}).order("creato_il",{ascending:false});
    if(error){ setErr(error.message); return; } setLista(data||[]);
  },[]);
  useEffect(()=>{ carica(); },[carica]);
  const anni=useMemo(()=>[...new Set((lista||[]).map(x=>x.anno))].sort((a,b)=>b-a),[lista]);
  const filtrata=(lista||[]).filter(x=>!annoF||String(x.anno)===String(annoF));
  function esportaRegistro(){
    const rows=(lista||[]); if(!rows.length){ alert("Nessun controllo registrato."); return; }
    const aoa1=[["REG QA-8.5.1 Registro Controlli Operativi Qualità"],
      ["Commessa/Attività/Processo","Controllo qualità effettuato","Chi ha effettuato","Esito","Data del controllo","Anno","Check di verifica","Eventuali note"]];
    rows.slice().sort((a,b)=>String(a.data).localeCompare(String(b.data))).forEach(r=>{
      const ok=(r.commessa_processo&&r.controllo&&r.chi&&r.esito&&r.data)?"Ok":"";
      aoa1.push([r.commessa_processo||"",r.controllo||"",r.chi||"",r.esito||"",
        r.data?new Date(r.data).toLocaleDateString("it-IT"):"",r.anno||"",ok,r.note||""]);
    });
    const anniTut=[...new Set(rows.map(x=>x.anno))].sort();
    const aoa2=[["Anno","Totali","Con esito positivo","Con esito parzialmente positivo","Con esito negativo"],
      ...anniTut.map(an=>{ const r=rows.filter(x=>x.anno===an);
        return [an,r.length,r.filter(x=>x.esito==="Positivo").length,r.filter(x=>x.esito==="Parzialmente positivo").length,r.filter(x=>x.esito==="Negativo").length]; })];
    try{ const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa1), "Registro controlli operativi");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa2), "Calcoli");
      XLSX.writeFile(wb, "Registro_controlli_qualita_"+new Date().toISOString().slice(0,10)+".xlsx");

          <option value="">Tutti gli anni</option>{anni.map(a=><option key={a} value={a}>{a}</option>)}
        </select>
        <span className="muted">{filtrata.length} controlli</span>
        <button className="btn" style={{marginLeft:"auto"}} onClick={esportaRegistro} disabled={!(lista&&lista.length)}>⬇️ Registro Excel (ISO)</button>
        {perm.scrivi && <button className="btn primary" onClick={()=>setEditor({})}>+ Nuovo controllo</button>}
      </div>
      {lista===null ? <div className="empty">Caricamento…</div>
        : filtrata.length===0 ? <div className="card empty">Nessun controllo qualità registrato.</div>
        : <div className="card" style={{overflow:"auto"}}><table>
            <thead><tr><th>Commessa/Processo</th><th>Controllo</th><th>Chi</th><th>Esito</th><th>Data</th></tr></thead>
            <tbody>{filtrata.map(r=>{ const es=CQ_ESITO[r.esito]||{bg:"#eee",c:"#333"};
              return <tr key={r.id} onClick={()=>setEditor(r)} style={{cursor:"pointer"}}>
                <td className="rs">{r.commessa_processo||"—"}</td>
                <td className="muted" style={{maxWidth:260,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.controllo||"—"}</td>
                <td className="muted">{r.chi||"—"}</td>
                <td><span className="tag" style={{background:es.bg,color:es.c}}>{r.esito}</span></td>
                <td className="muted">{r.data?new Date(r.data).toLocaleDateString("it-IT"):"—"}</td>
              </tr>; })}</tbody>
          </table></div>}
      {editor && <CQForm cq={editor.id?editor:null} profilo={profilo} onClose={()=>setEditor(null)} onSalvato={()=>{setEditor(null);carica();}}/>}
    </>
  );
}
