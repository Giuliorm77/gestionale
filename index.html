function ModuloReport({profilo,perm}){
  const [commesse,setCommesse]=useState(null);
  const [artMap,setArtMap]=useState({});
  const [opMap,setOpMap]=useState({});
  const [intByComm,setIntByComm]=useState({});
  const [persiByComm,setPersiByComm]=useState({});
  const [err,setErr]=useState("");
  const [dal,setDal]=useState("");
  const [al,setAl]=useState("");
  const [meseStraord,setMeseStraord]=useState(()=>new Date().toISOString().slice(0,7));
  const [meseProvv,setMeseProvv]=useState(()=>new Date().toISOString().slice(0,7));
  const [cliMap,setCliMap]=useState({});
  const [agMap,setAgMap]=useState({});
  const [crmTratt,setCrmTratt]=useState([]);      // trattative CRM (per report vendite/provvigioni agenti)
  const [segmenti,setSegmenti]=useState(null);   // storico timbrature postazione
  const [filtroOp,setFiltroOp]=useState("");
  useEffect(()=>{ sb.from("segmenti_lavoro").select("*").order("inizio",{ascending:false}).limit(1000)
    .then(({data})=>setSegmenti(data||[])); },[]);
  // costi di struttura annui (F) per il punto di pareggio — solo amministratore
  const isAdminRep = (profilo && profilo.ruolo==="amministratore");
  const [strutturaF,setStrutturaF]=useState(null);
  const [fattAnnuo,setFattAnnuo]=useState(0);   // obiettivo di fatturato annuo (da Impostazioni)
  useEffect(()=>{ if(!isAdminRep) return;
    Promise.all([
      sb.from("impostazioni_struttura").select("costi_struttura,fatturato_annuo").eq("id",1).maybeSingle(),
      sb.from("operatori").select("tipo,costo_annuo,ore_produzione,costo_orario"),
    ]).then(([st,op])=>{
      const voci=Array.isArray(st.data&&st.data.costi_struttura)?st.data.costi_struttura:[];
      const fVoci=voci.reduce((s,x)=>s+importoStruttura(x),0);
      const fOp=(op.data||[]).reduce((s,o)=>s+quotaStrutturaOp(o),0);
      setStrutturaF(Math.round((fVoci+fOp)*100)/100);
      setFattAnnuo(Number(st.data&&st.data.fatturato_annuo)||0);
    }).catch(()=>{});
  },[isAdminRep]);

  const carica=useCallback(async()=>{
    setErr("");
    const [c,a,o,it,pz,cl,ag,tr]=await Promise.all([
      sb.from("commesse").select("*, commesse_fasi(*), commesse_righe(*)").order("creato_il",{ascending:false}),
      caricaArticoliTutti("id,costo"),
      sb.from("operatori").select("id,costo_orario"),
      sb.from("interventi").select("commessa_id, interventi_righe(*)"),
      sb.from("magazzino_pezzi").select("commessa_id,larghezza_cm,altezza_cm,quantita,articolo_id").eq("stato","perso"),
      sb.from("clienti").select("id,agente_id,provvigione_pct"),
      sb.from("agenti").select("id,nome,provvigione_pct"),
      sb.from("crm_trattative").select("agente_id,cliente_id,stato,valore_stimato,aggiornato_il,tipo_provvigione,prezzo_netto,quota_margine_pct,provvigione_pct"),
    ]);
    if(c.error){ setErr(c.error.message); return; }
    setCommesse(c.data||[]);
    const am={}; (a||[]).forEach(x=>am[x.id]=x); setArtMap(am);
    const om={}; (o.data||[]).forEach(x=>om[x.id]=x); setOpMap(om);
    const ibc={}; (it.data||[]).forEach(x=>{ (ibc[x.commessa_id]=ibc[x.commessa_id]||[]).push(x); }); setIntByComm(ibc);
    const pbc={}; (pz.data||[]).forEach(x=>{ if(x.commessa_id){ (pbc[x.commessa_id]=pbc[x.commessa_id]||[]).push(x); } }); setPersiByComm(pbc);
    const cm={}; (cl.data||[]).forEach(x=>cm[x.id]=x); setCliMap(cm);
    const gm={}; (ag.data||[]).forEach(x=>gm[x.id]=x); setAgMap(gm);
    setCrmTratt((tr&&tr.data)||[]);
  },[]);
  useEffect(()=>{ carica(); },[carica]);

  const filtrate=useMemo(()=>{
    if(!commesse) return [];
    return commesse.filter(c=>{ const d=(c.creato_il||"").slice(0,10);
      if(dal && d<dal) return false; if(al && d>al) return false; return true; });
  },[commesse,dal,al]);

  const consunt=useCallback(c=>{
    const consumi=Array.isArray(c.consumi)?c.consumi:[];
    const costoMat=consumi.reduce((s,x)=>{ const a=artMap[x.articolo_id]; return s+(Number(x.quantita)||0)*(a?Number(a.costo)||0:0); },0);
    const costoMdo=(c.commesse_fasi||[]).reduce((s,fa)=>s+(fa.operatori||[]).reduce((ss,o)=>{ const op=opMap[o.id]; return ss+(Number(o.ore)||0)*(op?Number(op.costo_orario)||0:0); },0),0);
    const ints=intByComm[c.id]||[];
    const costoInt=ints.reduce((s,it)=>s+(it.interventi_righe||[]).reduce((ss,r)=>ss+(Number(r.quantita)||0)*(Number(r.costo_unitario)||0),0),0);
    const addeb=ints.reduce((s,it)=>s+(it.interventi_righe||[]).filter(r=>r.responsabilita==="cliente").reduce((ss,r)=>ss+(Number(r.quantita)||0)*(Number(r.prezzo_addebito)||0),0),0);
    const costiAiuti=(Array.isArray(c.aiuti)?c.aiuti:[]).reduce((s,a)=>{ const op=opMap[a.operatore_id]; return s+(Number(a.ore)||0)*(op?Number(op.costo_orario)||0:0); },0);
    const costoStraord=(Array.isArray(c.straordinari)?c.straordinari:[]).reduce((s,a)=>s+(Number(a.ore)||0)*COSTO_STRAORDINARIO,0);
    const costoPerdite=(persiByComm[c.id]||[]).reduce((s,p)=>{ const a=artMap[p.articolo_id];
      const mq=(Number(p.larghezza_cm)||0)*(Number(p.altezza_cm)||0)/10000*(Number(p.quantita)||1);
      return s+mq*(a?Number(a.costo)||0:0); },0);
    const ricavi=(Number(c.valore)||0)+addeb;
    const costi=costoMat+costoMdo+(Number(c.trasporto)||0)+costoInt+costiAiuti+costoPerdite+costoStraord;
    return {ricavi,costi,margine:ricavi-costi};
  },[artMap,opMap,intByComm,persiByComm]);

  const tot=useMemo(()=>{ let ric=0,cos=0; filtrate.forEach(c=>{ const x=consunt(c); ric+=x.ricavi; cos+=x.costi; });
    return {ric,cos,mar:ric-cos,n:filtrate.length}; },[filtrate,consunt]);

  // PUNTO DI PAREGGIO (break-even), anno solare, su commesse CONCLUSE (numeri reali).
  // Pareggio annuale cumulativo, monitorato a settimana. Entrata = margine di contribuzione (ricavi − costi diretti).
  const bep=useMemo(()=>{
    if(strutturaF==null) return null;
    const anno=new Date().getFullYear();
    const dateOf=c=>String(c.data_consegna||c.creato_il||"").slice(0,10);
    const concluse=(commesse||[]).filter(c=>(c.stato==="chiusa"||c.stato==="consegnata") && dateOf(c).slice(0,4)===String(anno));
    let m=0; concluse.forEach(c=>{ m+=consunt(c).margine; }); m=Math.round(m*100)/100;
    const F=Number(strutturaF)||0;
    const coperta=F>0? m/F : 0;
    const oggi=new Date(), inizio=new Date(anno,0,1);
    const giorniPassati=Math.max(1,Math.floor((oggi-inizio)/86400000)+1);
    const giorniAnno=((anno%4===0&&anno%100!==0)||anno%400===0)?366:365;
    const atteso=giorniPassati/giorniAnno;
    const settN=Math.ceil(giorniPassati/7);
    const targetSett=Math.round(F/52*100)/100;
    // margine concluso in QUESTA settimana (da lunedì)
    const gg=(oggi.getDay()+6)%7; const lun=new Date(oggi); lun.setHours(0,0,0,0); lun.setDate(lun.getDate()-gg);
    const lunISO=lun.toISOString().slice(0,10);
    let mSett=0; concluse.forEach(c=>{ if(dateOf(c)>=lunISO) mSett+=consunt(c).margine; }); mSett=Math.round(mSett*100)/100;
    // dettaglio mensile: margine e fatturato concluso per mese
    const perMese=Array(12).fill(0), fattMese=Array(12).fill(0);
    concluse.forEach(c=>{ const mo=parseInt(dateOf(c).slice(5,7),10)-1; if(mo>=0&&mo<12){ const r=consunt(c); perMese[mo]+=r.margine; fattMese[mo]+=r.ricavi; } });
    const targetMese=Math.round(F/12*100)/100;
    const meseCorr=oggi.getMonth();
    // OBIETTIVO FATTURATO dinamico: base = T/12; aggiornato = (T − fatturato dei mesi chiusi) / mesi restanti
    const T=Number(fattAnnuo)||0;
    const realizzatoChiusi=fattMese.slice(0,meseCorr).reduce((s,v)=>s+v,0);
    const mesiRestanti=12-meseCorr;
    const fattBaseMese=Math.round(T/12*100)/100;
    const fattObiettivoMese=mesiRestanti>0? Math.round((T-realizzatoChiusi)/mesiRestanti*100)/100 : 0;
    const fattRealizzatoAnno=Math.round(fattMese.reduce((s,v)=>s+v,0)*100)/100;
    // FATTURATO DI PAREGGIO = costi struttura ÷ margine di contribuzione medio (dai dati reali)
    const marginRatio=fattRealizzatoAnno>0? m/fattRealizzatoAnno : null;
    const fatturatoPareggio=(marginRatio&&marginRatio>0)? Math.round(F/marginRatio*100)/100 : null;
    return {F,m,coperta,mancante:Math.max(0,Math.round((F-m)*100)/100),utile:Math.max(0,Math.round((m-F)*100)/100),
      marginRatio,fatturatoPareggio,
      atteso,inLinea:coperta>=atteso,n:concluse.length,anno,settN,targetSett,mSett,
      perMese:perMese.map(v=>Math.round(v*100)/100),targetMese,meseCorr,
      fattMese:fattMese.map(v=>Math.round(v*100)/100),T,fattBaseMese,fattObiettivoMese,fattRealizzatoAnno,mesiRestanti};
  },[strutturaF,fattAnnuo,commesse,consunt]);

  const perLav=useMemo(()=>{
    const m={};
    filtrate.forEach(c=>(c.commesse_fasi||[]).forEach(fa=>{
      const k=fa.reparto||"(senza reparto)";
      const oreEff=(fa.operatori||[]).reduce((s,o)=>s+(Number(o.ore)||0),0);
      const costo=(fa.operatori||[]).reduce((s,o)=>{ const op=opMap[o.id]; return s+(Number(o.ore)||0)*(op?Number(op.costo_orario)||0:0); },0);
      const e=m[k]||(m[k]={reparto:k,orePrev:0,oreEff:0,costo:0,nfasi:0,qta:0,unita:""});
      e.orePrev+=Number(fa.ore_previste)||0; e.oreEff+=oreEff; e.costo+=costo; e.nfasi++;
      e.qta+=Number(fa.quantita_lavorata)||0;
      if(fa.unita_lavorata && !e.unita) e.unita=fa.unita_lavorata;
    }));
    return Object.values(m).sort((a,b)=>b.oreEff-a.oreEff);
  },[filtrate,opMap]);

  const aiutiAgg=useMemo(()=>{
    const m={};
    filtrate.forEach(c=>(Array.isArray(c.aiuti)?c.aiuti:[]).forEach(a=>{
      const k=a.operatore_id||("?"+(a.nome||""));
      const op=opMap[a.operatore_id];
      const costo=(Number(a.ore)||0)*(op?Number(op.costo_orario)||0:0);
      const e=m[k]||(m[k]={nome:a.nome||"—",volte:0,ore:0,costo:0});
      e.volte++; e.ore+=Number(a.ore)||0; e.costo+=costo;
    }));
    return Object.values(m).sort((a,b)=>b.costo-a.costo);
  },[filtrate,opMap]);
  const aiutiTot=aiutiAgg.reduce((o,r)=>({volte:o.volte+r.volte,ore:o.ore+r.ore,costo:o.costo+r.costo}),{volte:0,ore:0,costo:0});

  const straordAgg=useMemo(()=>{
    const m={};
    (commesse||[]).forEach(c=>(Array.isArray(c.straordinari)?c.straordinari:[]).forEach(a=>{
      if(meseStraord && String(a.data||"").slice(0,7)!==meseStraord) return;
      const k=a.operatore_id||("?"+(a.nome||""));
      const e=m[k]||(m[k]={nome:a.nome||"—",volte:0,ore:0});
      e.volte++; e.ore+=Number(a.ore)||0;
    }));
    return Object.values(m).sort((a,b)=>b.ore-a.ore);
  },[commesse,meseStraord]);
  const straordTot=straordAgg.reduce((o,r)=>({volte:o.volte+r.volte,ore:o.ore+r.ore}),{volte:0,ore:0});

  // Provvigioni "maturande" (STIMA): commesse consegnate/chiuse nel mese, base = valore commessa.
  // Agente = override commessa || agente del cliente. % = eccezione cliente (se l'agente è il suo) o standard agente.
  // A regime (con Fatturazione+Scadenzario) la base passerà all'INCASSATO.
  const provvAgg=useMemo(()=>{
    const m={};
    (commesse||[]).forEach(c=>{
      if(["consegnata","chiusa"].indexOf(c.stato)<0) return;
      if(meseProvv && String(c.data_consegna||"").slice(0,7)!==meseProvv) return;
      const cli=cliMap[c.cliente_id];
      const agId = c.agente_id || (cli && cli.agente_id);
      if(!agId) return;
      const ag=agMap[agId];
      const pct = (cli && cli.provvigione_pct!=null && (!c.agente_id || c.agente_id===cli.agente_id))
        ? Number(cli.provvigione_pct) : (ag?Number(ag.provvigione_pct)||0:0);
      const valore=Number(c.valore)||0;
      const e=m[agId]||(m[agId]={nome:(ag&&ag.nome)||"—",ncomm:0,valore:0,prov:0});
      e.ncomm++; e.valore+=valore; e.prov+=valore*pct/100;
    });
    return Object.values(m).sort((a,b)=>b.prov-a.prov);
  },[commesse,cliMap,agMap,meseProvv]);
  const provvTot=provvAgg.reduce((o,r)=>({ncomm:o.ncomm+r.ncomm,valore:o.valore+r.valore,prov:o.prov+r.prov}),{ncomm:0,valore:0,prov:0});

  // ---- CRM: pipeline vendite e provvigioni maturande per agente (trattative) ----
  // Aperte = stato nuovo/contatto/trattativa/offerta. Vinte/Perse nel periodo dal/al (per aggiornato_il).
  // Provvigione su vinte: % eccezione cliente se valorizzata, altrimenti % standard agente.
  const crmAg=useMemo(()=>{
    const inPeriodo=t=>{ const d=String(t.aggiornato_il||"").slice(0,10);
      if(dal && d<dal) return false; if(al && d>al) return false; return true; };
    const m={};
    (crmTratt||[]).forEach(t=>{
      const k=t.agente_id||"__none__";
      const ag=agMap[t.agente_id];
      const e=m[k]||(m[k]={nome:(ag&&ag.nome)||"(nessun agente)",aperte:0,valAperte:0,vinte:0,valVinte:0,perse:0,prov:0});
      if(t.stato==="vinta"){
        if(!inPeriodo(t)) return;
        const v=Number(t.valore_stimato)||0; e.vinte++; e.valVinte+=v;
        const cli=cliMap[t.cliente_id];
        e.prov+=calcProvvTratt(t,{cliPct:cli?cli.provvigione_pct:null, agPct:ag?ag.provvigione_pct:null});
      } else if(t.stato==="persa"){
        if(!inPeriodo(t)) return;
        e.perse++;
      } else {
        e.aperte++; e.valAperte+=Number(t.valore_stimato)||0;
      }
    });
    return Object.values(m).filter(e=>e.aperte||e.vinte||e.perse).sort((a,b)=>b.valVinte-a.valVinte);
  },[crmTratt,agMap,cliMap,dal,al]);
  const crmTot=crmAg.reduce((o,r)=>({aperte:o.aperte+r.aperte,valAperte:o.valAperte+r.valAperte,vinte:o.vinte+r.vinte,valVinte:o.valVinte+r.valVinte,perse:o.perse+r.perse,prov:o.prov+r.prov}),{aperte:0,valAperte:0,vinte:0,valVinte:0,perse:0,prov:0});

  const kpi=(label,val,col)=>(
    <div className="card" style={{padding:"14px 16px",flex:1,minWidth:150}}>
      <div className="muted" style={{fontSize:12}}>{label}</div>
      <div style={{fontSize:20,fontWeight:800,marginTop:4,color:col||"inherit"}}>{val}</div>
    </div>
  );

  return (
    <>
      <div className="topbar"><h1>Report / Consuntivi</h1></div>
      <div className="content">
        {err && <div className="banner err">{err}</div>}

        {isAdminRep && bep && <div className="card" style={{padding:"18px 20px",marginBottom:16,borderLeft:"5px solid "+(bep.utile>0?"var(--ok)":bep.inLinea?"#2f5bea":"var(--warn)")}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",flexWrap:"wrap",gap:8}}>
            <h3 style={{margin:0}}>🎯 Punto di pareggio {bep.anno} <span className="muted" style={{fontSize:12,fontWeight:400}}>· su commesse concluse · settimana {bep.settN}/52</span></h3>
            <span style={{fontSize:13,fontWeight:700,color:bep.utile>0?"var(--ok)":bep.inLinea?"#2f5bea":"var(--warn)"}}>
              {bep.utile>0 ? "✅ Pareggio superato · utile "+eur(bep.utile)
                : bep.inLinea ? "🟢 In linea col ritmo dell'anno"
                : "🟠 Sotto il ritmo dell'anno"}</span>
          </div>
          <div style={{margin:"12px 0 6px",height:14,background:"#eef1f5",borderRadius:8,overflow:"hidden",position:"relative"}}>
            <div style={{height:"100%",width:Math.min(100,Math.round(bep.coperta*100))+"%",
              background:bep.utile>0?"var(--ok)":bep.inLinea?"#2f5bea":"var(--warn)",transition:"width .3s"}}></div>
            <div title="Dove dovresti essere a oggi" style={{position:"absolute",top:-3,bottom:-3,left:"calc("+Math.min(100,Math.round(bep.atteso*100))+"% - 1px)",width:2,background:"#1a2230",opacity:.55}}></div>
          </div>
          <div className="muted" style={{fontSize:12,marginBottom:12}}>
            Coperto <b>{Math.round(bep.coperta*100)}%</b> dei costi di struttura · a oggi dovresti essere al <b>{Math.round(bep.atteso*100)}%</b> (linea nera)
          </div>
          <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
            {kpi("Margine concluso (anno)",eur(bep.m))}
            {kpi("Costi di struttura (anno)",eur(bep.F))}
            {bep.utile>0 ? kpi("Utile oltre il pareggio",eur(bep.utile),"var(--ok)")
                         : kpi("Manca al pareggio",eur(bep.mancante),"var(--warn)")}
          </div>
          {bep.fatturatoPareggio!=null
            ? <div style={{marginTop:10,padding:"10px 14px",background:"#eef4ff",borderRadius:8,fontSize:13.5,color:"#1e46c4"}}>
                📉 <b>Fatturato minimo per coprire tutti i costi (pareggio): {eur(bep.fatturatoPareggio)}/anno</b>
                <span style={{opacity:.85}}> — con il margine di contribuzione medio attuale del <b>{Math.round(bep.marginRatio*100)}%</b> ({eur(bep.F)} di struttura ÷ {Math.round(bep.marginRatio*100)}%). Sopra questo fatturato inizi a fare utile.</span>
              </div>
            : <div className="muted" style={{fontSize:12,marginTop:10}}>📉 Il <b>fatturato di pareggio</b> comparirà appena avrai qualche <b>commessa conclusa</b> (serve per stimare il margine medio).</div>}
          <div className="banner" style={{marginTop:12,background:bep.mSett>=bep.targetSett?"#e6f4ee":"#fff8ec",color:bep.mSett>=bep.targetSett?"#1f9c68":"#b26a00",fontSize:13}}>
            📅 <b>Questa settimana:</b> chiuso <b>{eur(bep.mSett)}</b> di margine · target per stare in pari <b>{eur(bep.targetSett)}/settimana</b> {bep.mSett>=bep.targetSett?"✓":"— sotto target"}
          </div>
          <div style={{marginTop:12}}>
            <div className="muted" style={{fontSize:12,fontWeight:600,marginBottom:6}}>Obiettivi mensili — target <b>{eur(bep.targetMese)}/mese</b> di margine</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(92px,1fr))",gap:6}}>
              {["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"].map((nm,i)=>{
                const v=bep.perMese[i], futuro=i>bep.meseCorr, ok=v>=bep.targetMese;
                const bg=futuro?"#f3f6f7":ok?"#e6f4ee":"#fff8ec", tc=futuro?"#8698a2":ok?"#1f9c68":"#b26a00";
                return <div key={nm} title={nm+": "+eur(v)+" / target "+eur(bep.targetMese)}
                  style={{background:bg,borderRadius:8,padding:"6px 6px",textAlign:"center",border:i===bep.meseCorr?"2px solid #2f5bea":"1px solid var(--line)"}}>
                  <div style={{fontSize:11,color:"#5b6773",fontWeight:600}}>{nm}{i===bep.meseCorr?" •":""}</div>
                  <div style={{fontSize:12.5,fontWeight:700,color:tc}}>{futuro?"—":Number(v).toLocaleString("it-IT",{maximumFractionDigits:0})+" €"}</div>
                </div>;
              })}
            </div>
          </div>
          {bep.T>0
            ? <div style={{marginTop:14,borderTop:"1px dashed var(--line)",paddingTop:12}}>
                <div className="muted" style={{fontSize:12,fontWeight:600,marginBottom:6}}>💰 Obiettivo fatturato {bep.anno}: <b>{eur(bep.T)}</b> · in media <b>{eur(bep.fattBaseMese)}/mese</b> · realizzato {eur(bep.fattRealizzatoAnno)}</div>
                <div className="banner" style={{background:"#eef4ff",color:"#1e46c4",fontSize:13,marginBottom:8}}>
                  🎯 Per i <b>{bep.mesiRestanti}</b> mesi restanti servono <b>{eur(bep.fattObiettivoMese)}/mese</b> per centrare l'obiettivo — recupera in automatico lo scostamento dei mesi già chiusi.
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(92px,1fr))",gap:6}}>
                  {["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"].map((nm,i)=>{
                    const v=bep.fattMese[i], futuro=i>bep.meseCorr, ok=v>=bep.fattBaseMese;
                    const bg=futuro?"#f3f6f7":ok?"#e6f4ee":"#fff8ec", tc=futuro?"#8698a2":ok?"#1f9c68":"#b26a00";
                    return <div key={nm} title={nm+": fatturato "+eur(v)+" / media "+eur(bep.fattBaseMese)}
                      style={{background:bg,borderRadius:8,padding:"6px 6px",textAlign:"center",border:i===bep.meseCorr?"2px solid #2f5bea":"1px solid var(--line)"}}>
                      <div style={{fontSize:11,color:"#5b6773",fontWeight:600}}>{nm}{i===bep.meseCorr?" •":""}</div>
                      <div style={{fontSize:12.5,fontWeight:700,color:tc}}>{futuro?"—":Number(v).toLocaleString("it-IT",{maximumFractionDigits:0})+" €"}</div>
                    </div>;
                  })}
                </div>
              </div>
            : <div className="muted" style={{fontSize:12,marginTop:12,borderTop:"1px dashed var(--line)",paddingTop:12}}>💰 Per gli <b>obiettivi di fatturato mensile</b> imposta l'<b>Obiettivo fatturato annuo</b> in ⚙️ Impostazioni → Costi di struttura.</div>}
          <div className="muted" style={{fontSize:11.5,marginTop:10}}>
            Margine = ricavi − costi diretti (materiali + manodopera + trasporto) delle {bep.n} commesse <b>concluse</b> (consegnate/chiuse) dell'anno. Target settimanale = costi di struttura ÷ 52; obiettivo fatturato ÷ 12 con recupero sui mesi restanti. Dati da ⚙️ Impostazioni. Aggiornato in tempo reale.
          </div>
        </div>}

        <div className="banner info">Numeri REALI dalle commesse: usali per ritarare le <b>tariffe</b> (ore effettive per lavorazione) e per vedere il <b>margine vero</b>. Costi: materiali (costo catalogo) + manodopera (ore × costo orario) + trasporto + rilavorazioni.</div>
        <div className="toolbar">
          <div className="field" style={{maxWidth:170}}><label style={{fontSize:12}}>Dal</label>
            <input type="date" value={dal} onChange={e=>setDal(e.target.value)}/></div>
          <div className="field" style={{maxWidth:170}}><label style={{fontSize:12}}>Al</label>
            <input type="date" value={al} onChange={e=>setAl(e.target.value)}/></div>
          <button className="btn small" onClick={()=>{setDal("");setAl("");}}>Tutto il periodo</button>
        </div>

        <div className="card" style={{padding:16,marginBottom:18}}>
          <h3 style={{marginTop:0}}>🕐 Storico lavorazioni (Postazione)</h3>
          <div className="muted" style={{fontSize:12,marginBottom:8}}>Ogni timbratura avvio→stop: chi, quale commessa/fase, orari e durata. Usa i filtri <b>Dal/Al</b> in alto.</div>
          {segmenti===null ? <div className="muted">Caricamento…</div> : (()=>{
            const commInfo={}; (commesse||[]).forEach(c=>commInfo[c.id]={numero:c.numero,cliente:c.cliente_nome});
            const ops=[...new Set(segmenti.map(s=>s.operatore_nome).filter(Boolean))].sort();
            const rows=segmenti.filter(s=>{ const d=(s.inizio||"").slice(0,10);
              if(dal && d<dal) return false; if(al && d>al) return false;
              if(filtroOp && s.operatore_nome!==filtroOp) return false; return true; });
            const durH=s=> s.fine? (new Date(s.fine)-new Date(s.inizio))/3600000 : null;
            const fmtDur=h=> h==null? "in corso" : durataOre(h);
            const dt=x=> x? new Date(x).toLocaleString("it-IT",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}) : "—";
            const totH=rows.reduce((t,s)=>t+(durH(s)||0),0);
            return <>
              <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap",alignItems:"center"}}>
                <select className="btn" value={filtroOp} onChange={e=>setFiltroOp(e.target.value)} style={{maxWidth:220}}>
                  <option value="">Tutti gli operatori</option>
                  {ops.map(o=><option key={o} value={o}>{o}</option>)}
                </select>
                <span className="muted">{rows.length} timbrature · totale {fmtDur(totH)}</span>
              </div>
              <div style={{overflow:"auto",maxHeight:420}}>
                <table><thead><tr><th>Operatore</th><th>Commessa</th><th>Fase / reparto</th><th>Inizio</th><th>Fine</th><th style={{textAlign:"right"}}>Durata</th></tr></thead>
                <tbody>
                  {rows.length===0 && <tr><td colSpan={6} className="muted" style={{padding:12}}>Nessuna timbratura nel periodo.</td></tr>}
                  {rows.map(s=>{ const ci=commInfo[s.commessa_id]||{}; return (
                    <tr key={s.id}>
                      <td className="rs">{s.operatore_nome||"—"}</td>
                      <td>{ci.numero||"—"}{ci.cliente?<span className="muted"> · {ci.cliente}</span>:""}</td>
                      <td className="muted">{s.fase_descr||s.reparto||"—"}</td>
                      <td className="muted" style={{fontSize:12}}>{dt(s.inizio)}</td>
                      <td className="muted" style={{fontSize:12}}>{s.fine? dt(s.fine) : <span style={{color:"#1f9c68",fontWeight:600}}>in corso</span>}</td>
                      <td style={{textAlign:"right",fontWeight:600}}>{fmtDur(durH(s))}</td>
                    </tr>); })}
                </tbody></table>
              </div>
              {segmenti.length>=1000 && <div className="muted" style={{fontSize:11,marginTop:6}}>Mostrate le ultime 1000 timbrature. Per periodi più vecchi restringi con Dal/Al (verranno caricati su richiesta in futuro).</div>}
            </>; })()}
        </div>

        {commesse===null ? <div className="empty">Caricamento…</div> : <>
          <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:18}}>
            {kpi("Commesse",tot.n)}
            {kpi("Ricavi",eur(tot.ric))}
            {kpi("Costi",eur(tot.cos))}
            {kpi("Margine",eur(tot.mar),tot.mar>=0?"var(--ok)":"var(--danger)")}
            {kpi("Margine %",(tot.ric>0?(tot.mar/tot.ric*100):0).toFixed(1)+"%")}
          </div>

          <div className="card" style={{padding:20,marginBottom:18,overflow:"auto"}}>
            <h3 style={{marginTop:0}}>Ore reali per lavorazione</h3>
            <div className="muted" style={{fontSize:12,marginBottom:10}}>Confronta previsto e reale: se le ore effettive superano spesso le previste, la tariffa di quel reparto è da alzare.</div>
            <table>
              <thead><tr><th>Lavorazione / reparto</th><th style={{textAlign:"right"}}>Ore previste</th><th style={{textAlign:"right"}}>Ore effettive</th><th style={{textAlign:"right"}}>Scostamento</th><th style={{textAlign:"right"}}>Q.tà lavorata</th><th style={{textAlign:"right"}}>Produttività</th><th style={{textAlign:"right"}}>Costo manodopera</th><th style={{textAlign:"right"}}>N° fasi</th></tr></thead>
              <tbody>
                {perLav.length===0 ? <tr><td colSpan={8} className="muted" style={{padding:12}}>Nessun dato nel periodo.</td></tr>
                  : perLav.map(r=>{ const scost=r.oreEff-r.orePrev;
                    return <tr key={r.reparto}>
                      <td className="rs">{r.reparto}</td>
                      <td style={{textAlign:"right"}}>{Math.round(r.orePrev*10)/10}</td>
                      <td style={{textAlign:"right",fontWeight:600}}>{Math.round(r.oreEff*10)/10}</td>
                      <td style={{textAlign:"right",color:scost>0?"var(--danger)":"var(--ok)"}}>{scost>0?"+":""}{Math.round(scost*10)/10}</td>
                      <td style={{textAlign:"right"}}>{r.qta>0?(Math.round(r.qta*100)/100+" "+(r.unita||"")):"—"}</td>
                      <td style={{textAlign:"right",fontWeight:600}}>{r.qta>0&&r.oreEff>0?(Math.round(r.qta/r.oreEff*100)/100+" "+(r.unita||"")+"/h"):"—"}</td>
                      <td style={{textAlign:"right"}}>{eur(r.costo)}</td>
                      <td style={{textAlign:"right"}} className="muted">{r.nfasi}</td>
                    </tr>; })}
              </tbody>
            </table>
          </div>

          <div className="card" style={{padding:20,marginBottom:18,overflow:"auto"}}>
            <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",marginBottom:10}}>
              <h3 style={{margin:0}}>Straordinari (busta paga)</h3>
              <div className="field" style={{maxWidth:180,margin:0}}><label style={{fontSize:12}}>Mese</label>
                <input type="month" value={meseStraord} onChange={e=>setMeseStraord(e.target.value)}/></div>
            </div>
            <div className="muted" style={{fontSize:12,marginBottom:10}}>Ore di straordinario per operatore nel mese scelto (dalla voce "Straordinario" delle commesse). Costo a €{COSTO_STRAORDINARIO}/h.</div>
            <table>
              <thead><tr><th>Operatore</th><th style={{textAlign:"right"}}>Volte</th><th style={{textAlign:"right"}}>Ore</th><th style={{textAlign:"right"}}>Costo</th></tr></thead>
              <tbody>
                {straordAgg.length===0 ? <tr><td colSpan={4} className="muted" style={{padding:12}}>Nessuno straordinario in questo mese.</td></tr>
                  : straordAgg.map((r,i)=><tr key={i}>
                    <td className="rs">{r.nome}</td>
                    <td style={{textAlign:"right"}}>{r.volte}</td>
                    <td style={{textAlign:"right",fontWeight:700}}>{Math.round(r.ore*100)/100}</td>
                    <td style={{textAlign:"right"}}>{eur(r.ore*COSTO_STRAORDINARIO)}</td>
                  </tr>)}
                {straordAgg.length>0 && <tr style={{borderTop:"2px solid var(--line)"}}>
                  <td style={{fontWeight:800}}>TOTALE</td>
                  <td style={{textAlign:"right",fontWeight:800}}>{straordTot.volte}</td>
                  <td style={{textAlign:"right",fontWeight:800}}>{Math.round(straordTot.ore*100)/100}</td>
                  <td style={{textAlign:"right",fontWeight:800}}>{eur(straordTot.ore*COSTO_STRAORDINARIO)}</td>
                </tr>}
              </tbody>
            </table>
          </div>

          <div className="card" style={{padding:20,marginBottom:18,overflow:"auto"}}>
            <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",marginBottom:10}}>
              <h3 style={{margin:0}}>Provvigioni maturande (stima)</h3>
              <div className="field" style={{maxWidth:180,margin:0}}><label style={{fontSize:12}}>Mese consegna</label>
                <input type="month" value={meseProvv} onChange={e=>setMeseProvv(e.target.value)}/></div>
            </div>
            <div className="muted" style={{fontSize:12,marginBottom:10}}>
              Commesse <b>consegnate/chiuse</b> nel mese scelto, provvigione stimata sul <b>valore</b> della commessa.
              ⚠️ Stima provvisoria: a regime, con Fatturazione + Scadenzario, la base passerà all'<b>incassato reale</b>.
            </div>
            <table>
              <thead><tr><th>Agente</th><th style={{textAlign:"right"}}>Commesse</th><th style={{textAlign:"right"}}>Valore</th><th style={{textAlign:"right"}}>Provvigione</th></tr></thead>
              <tbody>
                {provvAgg.length===0 ? <tr><td colSpan={4} className="muted" style={{padding:12}}>Nessuna commessa consegnata con agente in questo mese.</td></tr>
                  : provvAgg.map((r,i)=><tr key={i}>
                    <td className="rs">{r.nome}</td>
                    <td style={{textAlign:"right"}} className="muted">{r.ncomm}</td>
                    <td style={{textAlign:"right"}}>{eur(r.valore)}</td>
                    <td style={{textAlign:"right",fontWeight:700,color:"var(--ok)"}}>{eur(r.prov)}</td>
                  </tr>)}
                {provvAgg.length>0 && <tr style={{borderTop:"2px solid var(--line)"}}>
                  <td style={{fontWeight:800}}>TOTALE</td>
                  <td style={{textAlign:"right",fontWeight:800}}>{provvTot.ncomm}</td>
                  <td style={{textAlign:"right",fontWeight:800}}>{eur(provvTot.valore)}</td>
                  <td style={{textAlign:"right",fontWeight:800,color:"var(--ok)"}}>{eur(provvTot.prov)}</td>
                </tr>}
              </tbody>
            </table>
          </div>

          <div className="card" style={{padding:20,marginBottom:18,overflow:"auto"}}>
            <h3 style={{marginTop:0}}>🎯 Pipeline vendite e provvigioni per agente <span className="muted" style={{fontSize:12,fontWeight:400}}>· trattative CRM</span></h3>
            <div className="muted" style={{fontSize:12,marginBottom:10}}>
              <b>Aperte</b> = trattative ancora in corso (tutte, a prescindere dal periodo). <b>Vinte / Perse</b> = quelle aggiornate nel periodo {dal||al ? <b>{dal||"…"} → {al||"…"}</b> : "(tutto lo storico, imposta le date in alto per filtrare)"}.
              Provvigione delle vinte calcolata per <b>ogni trattativa</b> col suo modello: <b>a percentuale</b> (sul valore) o <b>a margine</b> (quota % su valore − prezzo netto).
            </div>
            <table>
              <thead><tr>
                <th>Agente</th>
                <th style={{textAlign:"right"}}>Aperte</th>
                <th style={{textAlign:"right"}}>Valore aperto</th>
                <th style={{textAlign:"right"}}>Vinte</th>
                <th style={{textAlign:"right"}}>Valore vinto</th>
                <th style={{textAlign:"right"}}>Tasso chiusura</th>
                <th style={{textAlign:"right"}}>Provvigione</th>
              </tr></thead>
              <tbody>
                {crmAg.length===0 ? <tr><td colSpan={7} className="muted" style={{padding:12}}>Nessuna trattativa nel periodo selezionato.</td></tr>
                  : crmAg.map((r,i)=>{ const chiuse=r.vinte+r.perse; const tasso=chiuse?Math.round(r.vinte/chiuse*100):null;
                    return <tr key={i}>
                    <td className="rs">{r.nome}</td>
                    <td style={{textAlign:"right"}} className="muted">{r.aperte}</td>
                    <td style={{textAlign:"right"}} className="muted">{eur(r.valAperte)}</td>
                    <td style={{textAlign:"right",fontWeight:600}}>{r.vinte}</td>
                    <td style={{textAlign:"right"}}>{eur(r.valVinte)}</td>
                    <td style={{textAlign:"right"}}>{tasso==null?"—":tasso+"%"}</td>
                    <td style={{textAlign:"right",fontWeight:700,color:"var(--ok)"}}>{eur(r.prov)}</td>
                  </tr>; })}
                {crmAg.length>0 && (()=>{ const chiuse=crmTot.vinte+crmTot.perse; const tasso=chiuse?Math.round(crmTot.vinte/chiuse*100):null;
                  return <tr style={{borderTop:"2px solid var(--line)"}}>
                  <td style={{fontWeight:800}}>TOTALE</td>
                  <td style={{textAlign:"right",fontWeight:800}}>{crmTot.aperte}</td>
                  <td style={{textAlign:"right",fontWeight:800}}>{eur(crmTot.valAperte)}</td>
                  <td style={{textAlign:"right",fontWeight:800}}>{crmTot.vinte}</td>
                  <td style={{textAlign:"right",fontWeight:800}}>{eur(crmTot.valVinte)}</td>
                  <td style={{textAlign:"right",fontWeight:800}}>{tasso==null?"—":tasso+"%"}</td>
                  <td style={{textAlign:"right",fontWeight:800,color:"var(--ok)"}}>{eur(crmTot.prov)}</td>
                </tr>; })()}
              </tbody>
            </table>
          </div>

          {aiutiAgg.length>0 && <div className="card" style={{padding:20,marginBottom:18,overflow:"auto"}}>
            <h3 style={{marginTop:0}}>Aiuti imprevisti in produzione</h3>
            <div className="muted" style={{fontSize:12,marginBottom:10}}>Quante volte si è dovuto "tappare il buco" chiamando qualcuno in produzione, e quanto è costato. Se un nome ricorre spesso, forse serve rinforzare la produzione.</div>
            <table>
              <thead><tr><th>Persona</th><th style={{textAlign:"right"}}>Volte</th><th style={{textAlign:"right"}}>Ore</th><th style={{textAlign:"right"}}>Costo</th></tr></thead>
              <tbody>
                {aiutiAgg.map((r,i)=><tr key={i}>
                  <td className="rs">{r.nome}</td>
                  <td style={{textAlign:"right",fontWeight:600}}>{r.volte}</td>
                  <td style={{textAlign:"right"}}>{Math.round(r.ore*10)/10}</td>
                  <td style={{textAlign:"right",color:"var(--danger)",fontWeight:700}}>{eur(r.costo)}</td>
                </tr>)}
                <tr style={{borderTop:"2px solid var(--line)"}}>
                  <td style={{fontWeight:800}}>Totale</td>
                  <td style={{textAlign:"right",fontWeight:800}}>{aiutiTot.volte}</td>
                  <td style={{textAlign:"right",fontWeight:800}}>{Math.round(aiutiTot.ore*10)/10}</td>
                  <td style={{textAlign:"right",fontWeight:800,color:"var(--danger)"}}>{eur(aiutiTot.costo)}</td>
                </tr>
              </tbody>
            </table>
          </div>}

          <div className="card" style={{padding:20,overflow:"auto"}}>
            <h3 style={{marginTop:0}}>Consuntivo per commessa</h3>
            <table>
              <thead><tr><th>Numero</th><th>Cliente</th><th>Stato</th><th style={{textAlign:"right"}}>Ricavi</th><th style={{textAlign:"right"}}>Costi</th><th style={{textAlign:"right"}}>Margine</th><th style={{textAlign:"right"}}>%</th></tr></thead>
              <tbody>
                {filtrate.length===0 ? <tr><td colSpan={7} className="muted" style={{padding:12}}>Nessuna commessa nel periodo.</td></tr>
                  : filtrate.map(c=>{ const x=consunt(c); const st=STATI_COMMESSA[c.stato]||STATI_COMMESSA.aperta;
                    return <tr key={c.id}>
                      <td className="rs">{c.numero||"—"}</td>
                      <td>{c.cliente_nome||"—"}</td>
                      <td><span className="tag" style={{background:st.bg,color:st.c}}>{st.l}</span></td>
                      <td style={{textAlign:"right"}}>{eur(x.ricavi)}</td>
                      <td style={{textAlign:"right"}}>{eur(x.costi)}</td>
                      <td style={{textAlign:"right",fontWeight:700,color:x.margine>=0?"var(--ok)":"var(--danger)"}}>{eur(x.margine)}</td>
                      <td style={{textAlign:"right"}} className="muted">{x.ricavi>0?(x.margine/x.ricavi*100).toFixed(0):0}%</td>
                    </tr>; })}
              </tbody>
            </table>
          </div>
        </>}
      </div>
    </>
  );
}

/* ================================================================ UTENTI (solo admin) */
function ModuloUtenti({profilo}){
  const [utenti,setUtenti]=useState(null);
  const [agenti,setAgenti]=useState([]);
  const [err,setErr]=useState("");
  const [permEditor,setPermEditor]=useState(null);
  const RUOLI=["amministratore","commerciale","agente","produzione","magazzino","reception"];

  const carica=useCallback(async()=>{
    const [u,a]=await Promise.all([
      sb.from("profiles").select("*").order("nome"),
      sb.from("agenti").select("id,nome").order("nome"),
    ]);
    if(u.error){ setErr(u.error.message); return; }
    setUtenti(u.data||[]); setAgenti(a.data||[]);
  },[]);
  useEffect(()=>{ carica(); },[carica]);

  async function cambiaRuolo(id,ruolo){
    const {error}=await sb.from("profiles").update({ruolo}).eq("id",id);
    if(error){ alert("Errore: "+error.message); return; }
    carica();
  }
  async function cambiaAgente(id,agente_id){
    const {error}=await sb.from("profiles").update({agente_id:agente_id||null}).eq("id",id);
    if(error){ alert("Errore: "+error.message); return; }
    carica();
  }
  async function approva(id,val){
    const {error}=await sb.from("profiles").update({approvato:val}).eq("id",id);
    if(error){ alert("Errore: "+error.message); return; }
    carica();
  }
  const inAttesa=(utenti||[]).filter(u=>u.approvato===false).length;

  return (
    <>
      <div className="topbar"><h1>Utenti &amp; Ruoli</h1></div>
      <div className="content">
        {err && <div className="banner err">{err}</div>}
        {inAttesa>0 && <div className="banner err">{inAttesa} utente/i <b>in attesa di approvazione</b>. Finché non li approvi non possono operare.</div>}
        <div className="banner info">Approva i nuovi utenti e assegna il ruolo. Con <b>Permessi</b> fai eccezioni per singolo utente (vedere/fare cose). L'economico è blindato anche dal database.</div>
        {utenti===null? <div className="empty">Caricamento…</div> :
          <div className="card" style={{overflow:"auto"}}>
            <table>
              <thead><tr><th>Nome</th><th>Stato</th><th>Ruolo</th><th>Agente collegato</th><th>Azioni</th></tr></thead>
              <tbody>
                {utenti.map(u=>
                  <tr key={u.id} style={{cursor:"default"}}>
                    <td className="rs">{u.nome}{u.id===profilo.id && <span className="muted"> (tu)</span>}</td>
                    <td>{u.approvato
                      ? <span className="tag" style={{background:"#e6f4ee",color:"#1f9c68"}}>Approvato</span>
                      : <span className="tag" style={{background:"#fdecea",color:"#c0392b"}}>In attesa</span>}</td>
                    <td>
                      <select className="btn small" value={u.ruolo||"reception"}
                              onChange={e=>cambiaRuolo(u.id,e.target.value)}>
                        {RUOLI.map(r=><option key={r} value={r}>{r}</option>)}
                      </select>
                    </td>
                    <td>
                      {u.ruolo==="agente"
                        ? <select className="btn small" value={u.agente_id||""} onChange={e=>cambiaAgente(u.id,e.target.value)}
                                  style={!u.agente_id?{borderColor:"var(--danger)"}:{}}>
                            <option value="">— collega un agente —</option>
                            {agenti.map(a=><option key={a.id} value={a.id}>{a.nome}</option>)}
                          </select>
                        : <span className="muted">—</span>}
                    </td>
                    <td style={{whiteSpace:"nowrap"}}>
                      {u.approvato && u.id!==profilo.id && <><button className="btn small" onClick={()=>setPermEditor(u)}>Permessi{u.permessi?" •":""}</button>{" "}</>}
                      {u.approvato
                        ? (u.id!==profilo.id && <button className="btn small danger" onClick={()=>approva(u.id,false)}>Sospendi</button>)
                        : <button className="btn small primary" onClick={()=>approva(u.id,true)}>✓ Approva</button>}
                    </td>
                  </tr>)}
              </tbody>
            </table>
          </div>}
      </div>
      {permEditor && <PermessiEditor utente={permEditor} onClose={()=>setPermEditor(null)} onSalvato={()=>{setPermEditor(null);carica();}}/>}
    </>
  );
}

/* ------------------------------------------------ permessi per singolo utente */
function PermessiEditor({utente,onClose,onSalvato}){
  const ruolo=utente.ruolo||"reception";
  const base=PERMESSI[ruolo]||PERMESSI.reception;
  const [ov,setOv]=useState(()=> (utente.permessi && typeof utente.permessi==="object") ? JSON.parse(JSON.stringify(utente.permessi)) : {});
  const [busy,setBusy]=useState(false); const [err,setErr]=useState("");
  const flagVal=k=> (typeof ov[k]==="boolean") ? (ov[k]?"si":"no") : "";
  const setFlag=(k,v)=>setOv(p=>{ const n={...p}; if(v==="") delete n[k]; else n[k]=(v==="si"); return n; });
  const modVal=m=> (ov.moduli && typeof ov.moduli[m]==="boolean") ? (ov.moduli[m]?"si":"no") : "";
  const setMod=(m,v)=>setOv(p=>{ const mm={...(p.moduli||{})}; if(v==="") delete mm[m]; else mm[m]=(v==="si");
    const n={...p}; if(Object.keys(mm).length) n.moduli=mm; else delete n.moduli; return n; });
  async function salva(){ setBusy(true); setErr("");
    const payload=Object.keys(ov).length? ov : null;
    const {error}=await sb.from("profiles").update({permessi:payload}).eq("id",utente.id);
    if(error){ setErr(error.message); setBusy(false); return; } onSalvato();
  }
  const FLAGS=[
    {k:"economici",l:"Vede dati economici (prezzi, costi, margini)"},
    {k:"scrivi",l:"Può modificare / salvare"},
    {k:"elimina",l:"Può eliminare"},
    {k:"utenti",l:"Gestione utenti"},
  ];
  const selTri=(val,onCh)=><select className="btn small" value={val} onChange={e=>onCh(e.target.value)} style={{minWidth:120}}>
    <option value="">Come ruolo</option><option value="si">Sì</option><option value="no">No</option></select>;
  return (
    <div className="overlay">
      <div className="modal" style={{maxWidth:640}} onClick={e=>e.stopPropagation()}>
        <header><h2>Permessi di {utente.nome}</h2><button type="button" className="x" onClick={onClose}>×</button></header>
        <div className="body">
          {err && <div className="banner err">{err}</div>}
          <div className="banner info">Ruolo: <b>{ruolo}</b>. Qui fai <b>eccezioni</b> solo per questo utente. "Come ruolo" = usa il default del ruolo.</div>
          <div className="section"><h3>Autorizzazioni</h3>
            {FLAGS.map(f=>
              <div key={f.k} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,padding:"6px 0",flexWrap:"wrap"}}>
                <span>{f.l} <span className="muted">(ruolo: {base[f.k]?"sì":"no"})</span></span>
                {selTri(flagVal(f.k),v=>setFlag(f.k,v))}
              </div>)}
          </div>
          <div className="section"><h3>Accesso ai moduli</h3>
            {NAV_ITEMS.map(it=>{ const def=puoModulo({...base,moduli:null},it.m);
              return <div key={it.m} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,padding:"5px 0",flexWrap:"wrap"}}>
                <span>{it.ico} {it.label} <span className="muted">(ruolo: {def?"sì":"no"})</span></span>
                {selTri(modVal(it.m),v=>setMod(it.m,v))}
              </div>; })}
          </div>
        </div>
        <footer>
          <button type="button" className="btn" onClick={onClose}>Annulla</button>
          <button type="button" className="btn primary" disabled={busy} onClick={salva}>{busy?<span className="spin"/>:"Salva permessi"}</button>
        </footer>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------- mount */
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
